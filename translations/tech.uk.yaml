spytechStatsDescription: На рівнях 0 і 1 ти бачиш лише загальні очки інших гравців. З рівня 2 ти також бачиш їхні очки за споруди, з рівня 4 — за дослідження. З рівня 6 ти додатково бачиш очки за кораблі й оборону, а також їхню бойову статистику.
