longDescription:
  '1': Шахти металу видобувають руду, на якій тримається будь-яка імперія, нова чи давня.
  '2': Кристал — ключовий матеріал для електронних схем і деяких сплавів.
  '3': Дейтерій — паливо для твоїх кораблів, його добувають із глибоких морів. Це рідкісна речовина, тому вона відносно дорога.
  '4': Сонячні електростанції перетворюють сонячне світло на енергію. Без енергії не працює жодна шахта.
  '6': Типово кожен рівень скорочує час досліджень на 8%.
  '12': Термоядерна електростанція виробляє енергію, зливаючи ядра дейтерію. Вона дає більше енергії, ніж сонячна електростанція, але й коштує дорожче. Вихід енергії зростає з енергетичною технологією та з рівнем самої станції. Формула виробництва енергії:<br>Вироблена енергія = 30 x рівень термоядерної електростанції x (1,05 + (0,01 * рівень енергетичної технології))^рівень термоядерної електростанції
  '14': Фабрики роботів постачають будівельних роботів, які допомагають зводити твої споруди. Кожен рівень пришвидшує будівництво.
  '15': Вершина робототехніки. Кожен рівень удвічі скорочує час будівництва споруд, кораблів і оборони.
  '21': Усі кораблі й оборонні споруди будують на верфі планети.
  '22': Зберігає надлишки металу.
  '23': Зберігає надлишки кристалу.
  '24': Зберігає надлишки дейтерію.
  '31': Щоб досліджувати нові технології, потрібна дослідницька лабораторія. Її рівень визначає швидкість досліджень і те, які технології тобі доступні. Дослідження йде в лабораторії планети, де ти його почав, а результат діє на всіх твоїх планетах. Поки триває дослідження, жодну дослідницьку лабораторію вдосконалити не можна.
  '33': 'Тераформер збільшує придатну для забудови площу планети. Кожен рівень дає 5 додаткових полів, а на кожному парному рівні — ще одне. Кожен рівень тераформера сам займає одне поле.<br>Для будівництва потрібна енергія, але вона не витрачається: планета лише має виробляти її достатньо (1000 для 1-го рівня, далі подвоюється з кожним рівнем), навіть якщо її вже споживають шахти. Збудований тераформер знести вже не можна.'
  '34': 'Склад альянсу наразі не діє в цій грі: дружні флоти можуть утримувати позицію на твоїй планеті й без нього, а постачання палива немає.'
  '35': Ремонтний док може полагодити кораблі, знищені в бою, що залишили після себе поле решток. Ремонт триває щонайбільше 12 годин і не може завершитися раніше ніж за 30 хвилин після появи поля решток.<br>Щойно поле решток з'явилося, у тебе є 3 доби, щоб почати ремонт. Коли ремонт завершиться, кораблі треба самостійно ввести в стрій. Якщо цього не зробити, вони повернуться в стрій автоматично через 3 доби.
  '41': На Місяці немає атмосфери, а на свіжому Місяці є місце лише для однієї споруди, тож починай з місячної бази. Кожен рівень дає 3 додаткові поля й сам займає одне поле. Збудовану місячну базу знести вже не можна.
  '42': 'Сенсорна фаланга дозволяє стежити за рухом флотів. Що вищий рівень, то більший радіус фаланги: типово (рівень фаланги)^2 - 1 систем, тож 1-й рівень охоплює лише власну систему Місяця. Одне сканування коштує 5000 дейтерію, який має бути на Місяці. Щоб сканувати, відкрий галактику з Місяця й клацни на планету в радіусі дії. Самі Місяці фалангою сканувати не можна, бо в них немає атмосфери.<br><br>Фаланга показує флоти, що вирушають із просканованої планети або летять до неї: коли вони прибудуть, коли завершиться утримання позиції і коли флоти власника повернуться додому. Розгортання та ракети не показуються ніколи, так само як і польоти переробників чи торгові польоти до планети.'
  '43': 'Місячні брами — це величезні передавачі, що миттєво переправляють великі флоти через увесь всесвіт. Вони не споживають дейтерій, але переправити так ресурси не вийде. Обидві брами мають бути готові: після стрибка кожна потребує перезарядки, яка типово становить 60 хвилин на 1-му рівні й скорочується з кожним рівнем до 10 хвилин із 15-го.'
  '44': Ракетні шахти зберігають твої ракети. Типово кожен рівень додає 10 місць. Ракета-перехоплювач займає 1 місце, міжпланетна ракета — 2.
  '106': 'Ця технологія дає змогу збирати відомості про інші планети та Місяці. Коли ти надсилаєш зонди, твої шпигунські технології порівнюються з технологіями цілі: що вищий твій рівень, то більше інформації у звіті й то менша ймовірність, що зонди помітять. Більше зондів відкривають більше подробиць, але підвищують ризик викриття. На певних рівнях шпигунських технологій ти також дізнаєшся більше про чужі флоти на екрані огляду:<br><br><li>На рівні 0–1 ти бачиш лише те, що до твоєї планети наближається флот</li><li>На рівнях 2–3 ти бачиш, скільки кораблів наближається</li><li>На рівнях 4–7 ти бачиш, які типи кораблів у флоті</li><li>З рівня 8 ти бачиш, скільки кораблів кожного типу у флоті</li>'
  '108': Кращі комп'ютери дозволяють керувати більшою кількістю флотів. Кожен рівень комп'ютерних технологій збільшує максимальну кількість флотів на один.
  '109': Технологія зброї робить озброєння ефективнішим. Кожен рівень збільшує силу зброї всіх одиниць на 10% від базового значення.
  '110': Технологія щитів посилює щити кораблів і оборонних споруд. Кожен рівень збільшує міцність щитів на 10% від базового значення.
  '111': Спеціальні сплави покращують броню кораблів і оборонних споруд. Кожен рівень збільшує ефективність броні на 10%.
  '113': Опанування різних видів енергії — ключ до багатьох нових технологій. Кожен рівень енергетичної технології також збільшує вихід енергії термоядерної електростанції.
  '114': Поєднавши 4-й і 5-й виміри, ти зможеш дослідити новий тип двигуна, економніший і ефективніший.
  '115': Розвиток цього двигуна робить деякі кораблі швидшими, але кожен рівень додає лише 10% базової швидкості. Це стосується малого й великого транспортів, легкого винищувача, переробника та шпигунського зонда (малий транспорт і переробник згодом переходять на кращі двигуни).
  '117': 'Імпульсний двигун працює за принципом реактивної тяги. Його розвиток робить деякі кораблі швидшими, але кожен рівень додає лише 20% базової швидкості: бомбардувальника, крейсера, важкого винищувача й колонізатора, а також малого транспорту й переробника, щойно ті перейдуть на цей двигун. Міжпланетні ракети теж летять далі з кожним рівнем.'
  '118': 'Гіперпросторовий двигун викривлює простір навколо корабля. Його розвиток робить деякі кораблі швидшими, але кожен рівень додає лише 30% базової швидкості: лінійного крейсера, лінкора, знищувача, Зірки смерті, Чорного Місяця, бойового транспортера, Аватара й бойового переробника, а також бомбардувальника й переробника, щойно ті перейдуть на цей двигун. Потрібні гіперпросторова технологія (3-й рівень) і дослідницька лабораторія (7-й рівень).'
  '120': Сфокусоване світло створює промінь, що вражає все на своєму шляху. Потрібні дослідницька лабораторія (1-й рівень) і енергетична технологія (2-й рівень).
  '121': Смертоносний промінь прискорених іонів, що завдає величезної шкоди при влучанні.
  '122': Подальший розвиток іонної технології, що прискорює високоенергетичну плазму, створену надзвичайним нагріванням іонів. Руйнівна дія при влучанні жахлива.
  '123': Дослідники на різних планетах спілкуються через цю мережу. Кожен рівень дозволяє підключити до лабораторії, де ти починаєш дослідження, ще одну лабораторію. Обираються лабораторії з найвищими рівнями, а підключена лабораторія має бути достатньо розвиненою, щоб самостійно вести це дослідження. Їхні рівні додаються для розрахунку часу дослідження.
  '124': 'Астрофізика відкриває колонізацію та експедиції в глибокий космос. Ліміт колоній, час утримання та позиції нижче — типові налаштування; у твоєму всесвіті вони можуть відрізнятися.<br><br> <li>Ліміт колоній</li> Рівень 1–2 = 2 планети<br> Рівень 3–4 = 3 планети<br> Рівень 5–6 = 4 планети<br> Рівень 7–8 = 5 планет<br> Рівень 9–10 = 6 планет<br> Рівень 11–12 = 7 планет<br> Рівень 13–14 = 8 планет<br> Рівень 15–16 = 9 планет<br> Рівень 17–18 = 10 планет<br> Рівень 19–20 = 11 планет<br> Рівень 21+ = 12 планет<br><br> <li>Слоти експедицій</li> Рівень 1–3 = 1 експедиція<br> Рівень 4–8 = 2 експедиції<br> Рівень 9–15 = 3 експедиції<br> Рівень 16–24 = 4 експедиції<br>(ще одна на кожному наступному квадратному рівні: 25, 36, ...)<br><br> <li>Час утримання в експедиції</li> Рівень = макс. час утримання в годинах<br><br> <li>Позиції для колонізації</li> Рівень 1–3 = 4–12<br> Рівень 4–5 = 3–13<br> Рівень 6–7 = 2–14<br> Рівень 8+ = 1–15'
  '131': Збільшує виробництво металу на 2% за рівень.
  '132': Збільшує виробництво кристалу на 2% за рівень.
  '133': Збільшує виробництво дейтерію на 2% за рівень.
  '134': Зменшує витрати на політ на 2% за рівень.
  '199': Постріл сконцентрованим зарядом гравітонних частинок створює штучне гравітаційне поле, здатне знищувати кораблі й навіть Місяці. Потрібна дослідницька лабораторія (12-й рівень).
  '202': Малий транспорт — моторний корабель, що швидко доправляє ресурси на інші планети.<br>Він літає на реактивному двигуні, доки твій імпульсний двигун не досягне 5-го рівня. Відтоді він переходить на імпульсний двигун, який подвоює його базову швидкість.
  '203': Цей вантажний корабель везе набагато більше за малий транспорт і зазвичай швидший завдяки вдосконаленому двигуну.
  '204': Перший бойовий корабель, який будує кожен імператор. Легкий винищувач моторний, але поодинці вразливий; у великій кількості він стає справжньою загрозою для будь-якої імперії. Саме легкі винищувачі першими супроводжують малі й великі транспорти до ворожих планет зі слабким захистом.
  '205': Цей винищувач має міцнішу броню й б'є сильніше за легкий винищувач.
  '206': Крейсери мають майже втричі міцнішу броню, ніж важкі винищувачі, і більш ніж удвічі більшу вогневу міць. До того ж вони дуже швидкі.
  '207': Лінкори — хребет флоту. Важкі гармати, висока швидкість і місткі трюми роблять їх суперниками, з якими варто рахуватися.
  '208': 'Цей добре броньований корабель підкорює нові планети, потрібні імперії для зростання. На новій колонії корабель розбирають, і весь придатний для переробки матеріал іде на розвиток нового світу. Скільки планет ти можеш колонізувати, прямо залежить від астрофізики: перший рівень і кожен другий після нього дозволяють ще одну колонію (типово).'
  '209': Переробник збирає сировину з полів уламків. Його вантажомісткість — 20 000. Спершу він літає на реактивному двигуні, переходить на імпульсний, коли твій імпульсний двигун досягне 17-го рівня, і на гіперпросторовий, коли гіперпросторовий двигун досягне 15-го рівня.
  '210': Шпигунські зонди — малі моторні дрони, що доставляють дані про флоти й планети на великі відстані.
  '211': Бомбардувальник створено спеціально для знищення оборони планет.<br>Він літає на імпульсному двигуні й переходить на гіперпросторовий, коли твій гіперпросторовий двигун досягне 8-го рівня.
  '212': Сонячні супутники — прості платформи із сонячних елементів на високій стаціонарній орбіті. Вони збирають сонячне світло й передають його лазером на наземну станцію.
  '213': 'Знищувач — король військових кораблів. Проти малих лазерних турелей він має швидкий вогонь: після кожного влучання в 9 випадках із 10 він отримує ще один постріл.'
  '214': Руйнівна міць Зірки смерті не має рівних, до того ж вона здатна знищувати Місяці.
  '215': Лінійний крейсер спеціалізується на перехопленні ворожих флотів.
  '216': 'Наступник улюбленої Зірки смерті: набагато швидший і міцніший, із величезним трюмом, але б''є трохи слабше.'
  '217': Розвиток великого транспорту з набагато більшою вантажомісткістю. Він працює на гіперпросторовому двигуні, тож спершу повільніший за великий транспорт, але випереджає його, коли твій гіперпросторовий двигун росте в рівнях.
  '218': Абсолютний найгірший сценарій, хоч і дуже повільний.
  '219': Величезний вантажний відсік і нові двигуни дозволяють йому літати швидше й збирати більше з полів уламків.
  '220': 'Сталевий колос — справжня фортеця в космосі, захищена непохитними бар''єрами й масивною бронею. Навіть найлютіші атаки відскакують, а він невблаганно рухається вперед. Але ця перевага в обороні має ціну: озброєння майже не варте згадки, а мляві двигуни роблять його повільним гігантом. Замість блискавичних ударів чи спритних маневрів цей корабель покладається на чисту стійкість. Той, хто хоче його зупинити, має запастися витримкою — або приголомшливою вогневою міццю.'
  '221': 'Штормовий клинок — винищувач найвищого класу: неймовірно швидкий і безжально озброєний. Супротивники ледве його бачать, доки він не вдарить. Захист для нього другорядний — йому не треба витримувати те, від чого можна просто втекти. Його єдина мета — флоти транспортів і переробників, які він знищує без жодного опору. Із запаморочливою швидкістю він б''є, коли захоче, і зникає раніше, ніж прийде підмога. Тому, кого обрав Штормовий клинок, майже не лишається шансів урятуватися.'
  '222': Важкий крейсер — посилена еволюція звичайного крейсера. Із покращеними щитами та потужним озброєнням він може встояти проти неповороткого ворога. Найкраще він розкривається в парі зі Сталевими колосами, знищувачами й бомбардувальниками, де його вогнева міць справді сяє. Втім, попри всю силу, він залишається повільним і менш маневреним.
  '223': Щитовий дрон — новий підхід до оборони флоту, що передусім береже екіпаж. Інноваційні, але важкі щитові технології суттєво знизили швидкість польоту й маневреність. Попри слабку швидкість і спритність, він дуже ефективний в обороні. Застарілу конструкцію довели до межі можливостей, щоб отримати майже непробивний захист.
  '224': Імпровізований штурмовий транспорт — неперевірений вантажний апарат із мінімальним озброєнням, створений спеціально, щоб дратувати необережних і непідготовлених сусідів. Цей саморобний апарат не розрахований на тривале використання, а лише на швидкі спонтанні атаки, що викликають миттєву реакцію. Щойно його застосують, сварка з сусідами практично гарантована. З обмеженим обладнанням і непередбачуваною вдачею він стає небезпечним інструментом швидкої ескалації конфлікту.
  '225': Штормовий транспортер — справжнє диво техніки, що пропонує ідеальний баланс бойової потужності, швидкості й вантажомісткості. Здатність швидко доставляти війська й ресурси та водночас приносити на поле бою вражаючу вогневу міць зробила його невід'ємною частиною будь-якого сильного флоту. Чи то для швидких штурмових загонів, чи для підтримки довготривалих операцій, Штормовий транспортер — ключ до ефективної війни й обов'язковий елемент будь-якого флоту.
  '226': Колосальний бойовий транспортер — вершина інженерної думки. Попри трохи громіздкий дизайн і, як наслідок, невисоку швидкість польоту, це найміцніше броньований бойовий транспортер, який будь-коли бачив будь-який флот. Його нищівна вогнева міць робить його нестримною силою на полі бою. Цей велетень легко пробиває ворожі лінії, водночас максимально захищаючи екіпаж. Він утілює силу й стійкість, роблячи його неоціненним активом будь-якого важкоозброєного флоту.
  '227': Оптимізований переробник — передове вдосконалення звичайного переробника. Потужний імпульсний двигун дозволяє швидше й дешевше діставатися до полів уламків, що робить його незамінним для будь-якого просунутого флоту. Оптимізована конструкція здешевлює будівництво й підвищує ефективність збору ресурсів. Він стає доступним із середини гри й дає стратегічну перевагу будь-якій імперії, що розширюється.
  '228': 'Омега-переробник — вершина технологій переробки, але за високу ціну. Його потужний гіперпросторовий двигун дозволяє досягати полів уламків за рекордний час і збирати ресурси швидше за будь-який інший корабель. Проте швидкість дається коштом ефективності: його будівництво й паливо надзвичайно дорогі, тож це варіант лише для заможних командирів на пізніх етапах гри. Для тих, хто цінує швидкість понад вартість, це найкращий переробник.'
  '229': Створена, щоб зламати панування Ксерів, Гадюка — найкраща зброя проти легких винищувачів, важких винищувачів і крейсерів. Зі скорострільними гарматами та передовими технологіями вона змінює баланс сил у всесвіті.
  '230': Швидкий. Точний. Недосяжний. Перехоплювач створений не для чесних боїв — він б'є швидко й сильно, миттю даючи нищівну перевагу.
  '231': Бегемот — результат десятиліть гравітонних досліджень, втілений у невблаганну бойову платформу. На відміну від Зірок смерті, його створено не для знищення планет, а для максимальної ефективності на полі бою. Відмовившись від енергомістких систем, потрібних для руйнування Місяців, конструкцію суттєво полегшили, що дало потужніші двигуни, більшу спритність і підвищену вогневу міць. Його компактна гравітонна гармата робить його рухомою машиною руйнування, здатною самотужки знищити навіть величезні флоти.
  '232': 'Титан порожнечі — вершина сучасної гравітонної технології. Кожен елемент його конструкції служить одній меті: швидкому знищенню ворожих Місяців. Звичайні гарматні башти свідомо прибрали, щоб зменшити масу й звільнити місце для колосальних кристалічних генераторів. Вони живлять найдосконаліші прискорювальні котушки, коли-небудь збудовані в відомих галактиках, даруючи кораблю неперевершену мобільність. Величезна потреба в кристалі робить кожен Титан порожнечі монументальним промисловим досягненням — і символом безмежної руйнівної сили.'
  '401': Ракетна установка — проста, але вигідна оборона. Після бою в середньому близько 70% знищених оборонних споруд відновлюється.
  '402': Малі лазерні турелі — проста наземна зброя. Спеціальні системи наведення стежать за ворогом, а потужний лазер прорізає корпус цілі. Після бою в середньому близько 70% знищених оборонних споруд відновлюється.
  '403': Велика лазерна турель — практична вдосконалена версія малої лазерної турелі. Після бою в середньому близько 70% знищених оборонних споруд відновлюється.
  '404': Гаусова гармата стріляє надщільними металевими снарядами з надзвичайною швидкістю. Після бою в середньому близько 70% знищених оборонних споруд відновлюється.
  '405': Іонна гармата випускає промені іонів (позитивно або негативно заряджених частинок). Після бою в середньому близько 70% знищених оборонних споруд відновлюється.
  '406': Плазмова гармата використовує велику паливну комірку ядерного реактора, що живить електромагнітний прискорювач, який випускає імпульси (тороїди) плазми. Після бою в середньому близько 70% знищених оборонних споруд відновлюється.
  '407': Мала щитова оболонка огортає всю планету полем, що поглинає колосальну кількість енергії. На планеті можна збудувати лише одну.
  '408': Велика щитова оболонка — подальший розвиток, якому потрібно набагато більше енергії, щоб витримувати атаки. На планеті можна збудувати лише одну.
  '409': Еволюція технології щитових оболонок. Вона споживає значно більше енергії, але витримує більше атак, ніж будь-який інший щит. На планеті можна збудувати лише один.
  '410': Після багатьох років досліджень гравітації вчені створили гравітонну гармату, що генерує невелике сфокусоване гравітонне поле й вистрілює його по ворогу.
  '411': Нерухома оборонна платформа без власного двигуна, яку гравітація утримує на стабільній орбіті навколо планети. Запуск цього процесу потребує величезної кількості енергії. На планеті можна збудувати лише одну.
  '412': Бункер — сильно укріплена споруда, розрахована витримати навіть наймогутніші атаки. Він дарує неперевершений захист мешканцям планети та критичній інфраструктурі, ставши наріжним каменем планетарної оборони.
  '413': Титанічний лазер — колосальна зброя незрівнянної руйнівної сили.
  '414': Приманка — витончена оборонна система, створена, щоб вводити ворога в оману й плутати його. Маскуючись під ракетну установку, вона відлякує атаки.
  '502': Ракети-перехоплювачі знищують міжпланетні ракети, що наближаються. На кожну міжпланетну ракету потрібна одна ракета-перехоплювач.
  '503': Міжпланетні ракети знищують оборону супротивника, якщо їх не збили ракети-перехоплювачі. Оборона, знищена таким чином, не відновлюється. Типово їхня дальність (у сонячних системах) залежить від рівня твого імпульсного двигуна:<br>Дальність = (5 x рівень імпульсного двигуна) - 1
  '901': Метал — основний ресурс для споруд і кораблів. Він найдешевший, але й потрібен найбільше, а ще, як і кристал, потребує найменше енергії для виробництва. Що більші шахти, то глибше вони вгризаються в землю.
  '902': Кристал — основний ресурс для електронних схем і деяких сплавів. Його видобувають у підземних шахтах, де сировина одразу перетворюється на схеми.
  '903': Дейтерій знаходять у найглибших морях, і це один із найрідкісніших ресурсів у всесвіті. Щоб його отримати, треба дістатися морського дна, тому він найдорожчий ресурс.
  '911': Енергія потрібна для виробництва кожного ресурсу.
secureResources: Кожен рівень сховища захищає від пограбування під час атак 1% добового виробництва відповідного ресурсу, максимум 10%.
shortDescription:
  '1': Шахти металу видобувають руду, на якій тримається будь-яка імперія, нова чи давня.
  '2': Кристал — ключовий матеріал для електронних схем і деяких сплавів.
  '3': Дейтерій — паливо для твоїх кораблів, його добувають із глибоких морів. Це рідкісна речовина, тому вона відносно дорога.
  '4': Сонячні електростанції перетворюють сонячне світло на енергію. Без енергії не працює жодна шахта.
  '6': Типово кожен рівень скорочує час досліджень на 8%.
  '12': Термоядерна електростанція виробляє енергію, зливаючи ядра дейтерію.
  '14': Фабрики роботів постачають будівельних роботів, які допомагають зводити твої споруди. Кожен рівень пришвидшує будівництво.
  '15': Вершина робототехніки. Кожен рівень удвічі скорочує час будівництва споруд, кораблів і оборони.
  '21': Усі кораблі й оборонні споруди будують на верфі планети.
  '22': Зберігає надлишки металу.
  '23': Зберігає надлишки кристалу.
  '24': Зберігає надлишки дейтерію.
  '31': Щоб досліджувати нові технології, потрібна дослідницька лабораторія.
  '33': 'Тераформер збільшує придатну для забудови площу планети: 5 додаткових полів за рівень, плюс ще одне на кожному парному рівні. Кожен рівень сам займає одне поле.'
  '34': Склад альянсу наразі не діє в цій грі.
  '35': Ремонтний док відновлює кораблі з поля решток.
  '41': На Місяці немає атмосфери, а на свіжому Місяці є місце лише для однієї споруди, тож починай з місячної бази.
  '42': Сенсорна фаланга дозволяє стежити за рухом флотів. Що вищий рівень, то більший радіус фаланги.
  '43': Місячні брами — це величезні передавачі, що миттєво переправляють великі флоти через увесь всесвіт.
  '44': Ракетні шахти зберігають твої ракети.
  '106': Ця технологія дає змогу збирати відомості про інші планети та Місяці.
  '108': Кращі комп'ютери дозволяють керувати більшою кількістю флотів. Кожен рівень комп'ютерних технологій збільшує максимальну кількість флотів на один.
  '109': Технологія зброї робить озброєння ефективнішим. Кожен рівень збільшує силу зброї всіх одиниць на 10% від базового значення.
  '110': Технологія щитів посилює щити кораблів і оборонних споруд. Кожен рівень збільшує міцність щитів на 10% від базового значення.
  '111': Спеціальні сплави покращують броню кораблів і оборонних споруд. Кожен рівень збільшує ефективність броні на 10%.
  '113': Опанування різних видів енергії — ключ до багатьох нових технологій.
  '114': Поєднавши 4-й і 5-й виміри, ти зможеш дослідити новий тип двигуна, економніший і ефективніший.
  '115': Розвиток цього двигуна робить деякі кораблі швидшими, але кожен рівень додає лише 10% базової швидкості.
  '117': Імпульсний двигун працює за принципом реактивної тяги. Його розвиток робить деякі кораблі швидшими, але кожен рівень додає лише 20% базової швидкості.
  '118': Гіперпросторовий двигун викривлює простір навколо корабля. Його розвиток робить деякі кораблі швидшими, але кожен рівень додає лише 30% базової швидкості.
  '120': Сфокусоване світло створює промінь, що вражає все на своєму шляху.
  '121': Смертоносний промінь прискорених іонів, що завдає величезної шкоди при влучанні.
  '122': Подальший розвиток іонної технології, що прискорює високоенергетичну плазму, створену надзвичайним нагріванням іонів. Руйнівна дія при влучанні жахлива.
  '123': Дослідники на різних планетах спілкуються через цю мережу.
  '124': Відкриває колонізацію та експедиції в глибокий космос. Додаткові планети на непарних рівнях, додаткові слоти експедицій на квадратних рівнях, довше утримання в експедиціях і більше позицій для планет у системі.
  '131': Збільшує виробництво металу на 2% за рівень.
  '132': Збільшує виробництво кристалу на 2% за рівень.
  '133': Збільшує виробництво дейтерію на 2% за рівень.
  '134': Зменшує витрати на політ на 2% за рівень.
  '199': Постріл сконцентрованим зарядом гравітонних частинок створює штучне гравітаційне поле, здатне знищувати кораблі й навіть Місяці.
  '202': Малий транспорт — моторний корабель, що швидко доправляє ресурси на інші планети.
  '203': Цей вантажний корабель везе набагато більше за малий транспорт і зазвичай швидший завдяки вдосконаленому двигуну.
  '204': Перший бойовий корабель, який будує кожен імператор. Легкий винищувач моторний, але поодинці вразливий; у великій кількості він стає справжньою загрозою для будь-якої імперії. Саме легкі винищувачі першими супроводжують малі й великі транспорти до ворожих планет зі слабким захистом.
  '205': Цей винищувач має міцнішу броню й б'є сильніше за легкий винищувач.
  '206': Крейсери мають майже втричі міцнішу броню, ніж важкі винищувачі, і більш ніж удвічі більшу вогневу міць. До того ж вони дуже швидкі.
  '207': Лінкори — хребет флоту. Важкі гармати, висока швидкість і місткі трюми роблять їх суперниками, з якими варто рахуватися.
  '208': Цим кораблем можна колонізувати вільні планети.
  '209': Переробник збирає сировину з полів уламків.
  '210': Шпигунські зонди — малі моторні дрони, що доставляють дані про флоти й планети на великі відстані.
  '211': Бомбардувальник створено спеціально для знищення оборони планет.
  '212': Сонячні супутники — прості платформи із сонячних елементів на високій стаціонарній орбіті. Вони збирають сонячне світло й передають його лазером на наземну станцію.
  '213': Знищувач — король військових кораблів.
  '214': Руйнівна міць Зірки смерті не має рівних, до того ж вона здатна знищувати Місяці.
  '215': Лінійний крейсер спеціалізується на перехопленні ворожих флотів.
  '216': 'Наступник улюбленої Зірки смерті: набагато швидший і міцніший, із величезним трюмом, але б''є трохи слабше.'
  '217': Розвиток великого транспорту з набагато більшою вантажомісткістю. Він працює на гіперпросторовому двигуні, тож спершу повільніший за великий транспорт, але випереджає його, коли твій гіперпросторовий двигун росте в рівнях.
  '218': Абсолютний найгірший сценарій, хоч і дуже повільний.
  '219': Величезний вантажний відсік і нові двигуни дозволяють йому літати швидше й збирати більше з полів уламків.
  '220': Сталевий колос витримує будь-яку атаку завдяки масивним щитам і товстій броні, але його зброя та двигуни залишають бажати кращого.
  '221': Штормовий клинок — блискавично швидкий винищувач, озброєний до зубів. Захист? Зайвий — його здобич це беззахисні транспорти й переробники.
  '222': Повільний, але важкоозброєний крейсер із посиленими щитами та наступальними можливостями.
  '223': Переосмислений легкий винищувач, що ставить безпеку екіпажу вище за льотні якості.
  '224': Неперевірений вантажний апарат із мінімальним озброєнням, створений дратувати необережних сусідів і миттєво розпалювати конфлікт.
  '225': Корабель, що поєднує бойову потужність, швидкість і вантажомісткість, що робить його незамінним для будь-якого сильного флоту.
  '226': Важкоброньований бойовий транспортер із грізним, трохи громіздким дизайном, чия нищівна вогнева міць здатна здолати навіть найміцніших супротивників.
  '227': Покращена версія класичного переробника з імпульсними двигунами, що дозволяє ефективніше й дешевше збирати уламки.
  '228': Надшвидке, але неефективне вдосконалення переробника з гіперпросторовим двигуном.
  '229': Створена, щоб зламати панування Ксерів, Гадюка — найкраща зброя проти легких винищувачів, важких винищувачів і крейсерів. Зі скорострільними гарматами та передовими технологіями вона змінює баланс сил у всесвіті.
  '230': Швидкий. Точний. Недосяжний. Перехоплювач створений не для чесних боїв — він б'є швидко й сильно, миттю даючи нищівну перевагу.
  '231': Менша й швидша Зірка смерті, що не вміє знищувати Місяці. Бегемот смертоносний проти флотів.
  '232': Швидший, вибуховіший, завжди приємний сюрприз. Титан порожнечі — жах Місяців.
  '401': Ракетна установка — проста, але вигідна оборона.
  '402': Малі лазерні турелі — проста наземна оборонна зброя. Спеціальні системи наведення стежать за ворожими кораблями, а потужний лазер прорізає корпус цілі.
  '403': Велика лазерна турель — вдосконалена версія малої лазерної турелі.
  '404': Гаусова гармата стріляє надщільними металевими снарядами з надзвичайною швидкістю.
  '405': Іонна гармата випускає промені іонів (позитивно або негативно заряджених частинок).
  '406': Плазмова гармата використовує велику паливну комірку ядерного реактора, що живить електромагнітний прискорювач, який випускає імпульси (тороїди) плазми.
  '407': Мала щитова оболонка огортає всю планету полем, що поглинає колосальну кількість енергії.
  '408': Велика щитова оболонка здатна поглинати значно більше енергії під час атак.
  '409': Еволюція технології щитових оболонок. Вона споживає значно більше енергії, але витримує більше атак, ніж будь-який інший щит.
  '410': Після багатьох років досліджень гравітації вчені створили гравітонну гармату, що генерує невелике сфокусоване гравітонне поле й вистрілює його по ворогу.
  '411': Нерухома оборонна платформа без власного двигуна, яку гравітація утримує на стабільній орбіті навколо планети. Запуск цього процесу потребує величезної кількості енергії.
  '412': Він захищає! Як цеглинка Lego в Kindergarten TD.
  '413': Титанічний лазер — колосальний лазер.
  '414': Приманка — витончена оборонна система, створена, щоб вводити ворога в оману й плутати його. Маскуючись під ракетну установку, вона відлякує атаки.
  '502': Ракети-перехоплювачі знищують міжпланетні ракети, що наближаються.
  '503': Міжпланетні ракети знищують оборону супротивника.
  '901': Метал — основний ресурс для споруд і кораблів. Він найдешевший, але й потрібен найбільше.
  '902': Кристал — основний ресурс для виготовлення електронних схем і деяких сплавів.
  '903': Дейтерій знаходять у найглибших морях. Це найдорожчий ресурс, якому до того ж потрібно найбільше енергії.
  '911': Енергія потрібна для виробництва кожного ресурсу.
