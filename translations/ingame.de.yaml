Achievement_text:
  '1': Du hast dir eine Nacht um die Ohren geschlagen und keinen einzigen Schuss gelandet.
  '2': Du hattest die letzten 90 Tage permanent laufende Flottenbewegungen.
  '3': Du hast deine Flotte verloren, während deine Sprache auf „Französisch“ eingestellt war.
  '4': Erforsche Ionentechnik 10.
  '5': Erforsche Gravitonforschung 2 – einfach, weil du es kannst.
  '6': Einer deiner Angriffe kam mit 1 Metall, 1 Kristall, 1 Deuterium zurück.
  '7': Besiege eine Flotte aus Piraten- oder Alienschiffen mit insgesamt mindestens 10.000 Schiffen. Der Weltraum gehört uns!
  '8': Komm zum Strammtisch (dienstags ab 20 Uhr auf Discord).
  '9': Baue deinen ersten Todesstern.
  '10': Zerstöre den Mond eines Spielers.
  '11': Spiele 14 Tage ausschließlich am Handy.
  '12': >-
    Deine Flotte wurde in deiner ersten Expedition durch ein schwarzes Loch
    zerstört.
  '13': Schick deine Flotte weg, wenn ein anfliegender Angriff nur noch weniger als 5 Sekunden entfernt ist.
  '14': Du hast 10 Flotten an schwarze Löcher verloren. Die Leere hat Hunger.
  '15': Erzeuge auch nach 10 Versuchen an einem Planeten keinen Mond. Beim nächsten Mal klappt’s.
  '16': Mehr als 250 deiner Recycler sind leer zurückgekehrt.
  '17': Gib in einem einzigen Bauauftrag mindestens 5000 Raketenwerfer in Auftrag.
  '18': Verbrenne innerhalb von 24 Stunden 5 Millionen Deuterium als Treibstoff auf einem einzigen Planeten.
  '19': Erforsche Raumschiffpanzerung 3.
  '20': Erforsche Raumschiffpanzerung 6.
  '21': Erforsche Raumschiffpanzerung 9.
  '22': Erforsche Raumschiffpanzerung 12.
  '23': Erforsche Raumschiffpanzerung 15.
  '24': Erforsche Lasertechnik 12.
  '25': Stimme dem Opt-in für die Rekorde zu.
  '26': Lösche den Planeten, der dir die meisten Punkte bringt (mindestens 100.000 Punkte).
  '27': Erforsche Intergalaktisches Forschungsnetzwerk 1.
  '28': Baue alle drei Rohstofflager auf einem Mond auf mindestens Stufe 3 aus.
  '29': Kollektiviere die Flotte eines punktestärkeren Spielers mit einem 5-Spieler-Verbandsangriff.
  '30': Wehre einen 5-Spieler-Verbandsangriff ganz allein ab.
  '31': Du hast einen Spieler durch deinen Angriff in den Urlaubsmodus befördert.
  '32': Raide 1000 Planeten, während das Theme „SetSail“ aktiv ist. Arr!
  '33': Komm aus dem Urlaubsmodus zurück.
  '34': Werde zum ersten Mal angegriffen. Willkommen im Universum.
  '35': Greife einen aktiven Spieler an, der weniger als ein Zehntel deiner Punkte hat.
  '36': "Erhalte eine Nachricht, die einen der folgenden Bausteine enthält:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Deine Flotte wurde von einem Verbandsangriff mit 5 Beteiligten ausgelöscht.
  '38': Greife Mitglieder deiner eigenen Allianz an. Friendly Fire, jemand?
  '39': Greife jemanden mit genau 42 Schiffen an.
  '40': >-
    Kolonisiere einen Planeten, der mindestens ein halbes Universum entfernt
    ist.
  '41': >-
    Blockiere einen Flottenslot für eine Woche mit einem schlechten
    Marktplatzangebot.
  '42': Tritt 4-mal als Verlierer in der Battlehall auf.
  '43': Gewinne einen Kampf, während dein Account als inaktiv markiert ist – auf einem deiner Planeten, auf dem zuvor eine Flotte mit mehr als 7 Tagen Flugzeit angekommen ist.
  '44': Produziere auf einem Planeten mehr als 7 Tage lang einen Rohstoff bei weniger als 100% Energieversorgung.
  '45': Gewinne einen Angriff gegen einen Spieler aus den Top 5 der Verteidigung.
  '46': Löse den Bash-Schutz aus, indem du Interplanetarraketen abfeuerst.
  '47': Zerstöre 5 Monde.
  '48': Verliere 5 Todessterne beim Versuch, Monde zu zerstören. Autsch.
  '49': Reiße eine Kolonie kurz nach der Gründung ab.
  '50': Verliere auf einem Planeten alle deine Solarsatelliten, obwohl dessen Energie für die Gravitonforschung gereicht hätte – ohne sie je erforscht zu haben.
  '51': Verbrauche dein gesamtes Deuterium in der Galaxieansicht.
  '52': Baue einen Todesstern, ohne vorher andere Kampfschiffe (Leichter Jäger, Schwerer Jäger, Kreuzer, Schlachtschiff, Bomber, Zerstörer oder Schlachtkreuzer) gebaut zu haben.
  '53': Habe in 5 Forschungen gleichzeitig die höchste Stufe.
  '54': Lass einen Angriff auf einen aktiven Spieler genau am 01.01. um 00:00:00 einschlagen.
  '55': Sonderachievement
