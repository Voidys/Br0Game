  Hiermit wird dein Konto nach mindestens 7 Tagen automatisch vollständig
  gelöscht. Die endgültige Löschung hängt von der Ausführungszeit des
  Lösch-Cronjobs ab und kann noch ein paar Tage dauern. Die Löschung kann
  gestoppt werden, solange sie noch nicht durchgeführt wurde, d.h. solange du
  dich noch in das Konto einloggen kannst.
