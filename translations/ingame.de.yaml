op_activate_vacation_mode_confirm: Du kannst den Urlaubsmodus 48 Stunden lang nicht beenden. Sicher?
op_activate_vacation_mode_descrip: Der Urlaubsmodus schützt dich bei längerer Abwesenheit. Du kannst ihn nur aktivieren, wenn keine deiner Flotten unterwegs ist. Ist er aktiv, schützt er dich vor neuen Angriffen. Bereits gestartete Angriffe laufen jedoch weiter, und haltende befreundete Flotten werden zurückgeschickt! Rohstoffproduktion, Gebäudebau, Werftaufträge und Forschung ruhen in dieser Zeit und gehen danach weiter. In den ersten 48 Stunden lässt sich der Urlaubsmodus nicht beenden!
