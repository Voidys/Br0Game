stb_big_ress: 'Viele Ressourcen am Ziel, kleiner als:'
stb_big_ress_tooltip: >-
  Wenn weniger Ressoucen als eingegeben auf dem Planeten sind, wird der der
  Spionagebericht hellgrün (gut) gekennzeichnet. Spionageberichte mit Ressourcen
  oberhalb dieses Wertes werden hellblau (optimal) angezeigt.
stb_big_time: Gutes Ressourcen pro Zeit Verhältniss
stb_big_time_tooltip: >-
  Beschreibt die bestmögliche Ressourchenausbeute pro Sekunde, gerundet auf zwei
  Stellen hinter dem Komma. Eine Verhältniss kleiner als der eingetragene Wert
  wird als gut (hellgrün) interpretiert, ein Wert obehalb als optimal
  (hellblau).
stb_low_ress: 'Wenig Ressourcen am Ziel, kleiner als:'
stb_low_ress_tooltip: >-
  Wenn weniger Ressoucen als eingegeben auf dem Planeten sind, wird der der
  Spionagebericht hellrot (schlecht) gekennzeichnet.
stb_med_time: Mittleres Ressourcen pro Zeit Verhältniss
stb_med_time_tooltip: >-
  Beschreibt die bestmögliche Ressourchenausbeute pro Sekunde, gerundet auf zwei
  Stellen hinter dem Komma. Eine Verhältniss kleiner als der eingetragene Wert
  wird als mittel (hellorange) interpretiert.
stb_mid_ress: 'Mittel Ressourcen am Ziel, kleiner als:'
stb_mid_ress_tooltip: >-
  Wenn weniger Ressoucen als eingegeben auf dem Planeten sind, wird der der
