op_activate_vacation_mode: Urlaubsmodus aktiveren
op_activate_vacation_mode_confirm: >-
  Der Urlaubsmodus kann für 48h nicht wieder deaktiviert werden. Bist du dir
  sicher?
op_activate_vacation_mode_descrip: >-
  Der Urlaubsmodus soll dich während längerer Abwesenheit schützen. Er kann nur
  aktiviert werden, wenn keine eigenen Flotten unterwegs sind. Wenn er aktiviert
  ist, schützt er dich vor neuen Angriffen. Bereits begonnene Angriffe werden
  jedoch fortgesetzt und haltende befreundete Flotten werden zurückgeschickt!
  Die Produktion von Ressourcen, der Bau von Gebäuden und Werftaufträgen, sowie
  die Forschung ist in dieser Zeit pausiert und wird anschließend fortgesetzt.
  Der Urlaubsmodus hält mindestens 48 Stunden an, danach kannst du ihn wieder
  deaktivieren.
