tutorial_text:
  step0: "Welcome to {game_name}!<br><br>\r\nThis tutorial will show you the basics of the game.<br>\r\nWe often refer to our wiki for additional information, as not all aspects of the game can be explained in the tutorial. You can access the wiki at any time via the menu on the left-hand side.<br>\r\nYou can skip the tutorial at any time, but you will not be able to start it again.<br><br>\r\nGood luck, Imperator!"
  step1: "The aim of this game is to score as many points as possible. You get one point for every 1,000 resources you spend. These resources can be obtained in a variety of ways. The most important way is to produce your own mines.<br>\r\nSo first ensure your basic supplies. To do this, you need metal and crystal from the corresponding mines. You will also need energy from the solar power plant for these to work. If there is not enough energy available, 100% production will not be achieved.<br>\r\nYou can upgrade these buildings via the <b>Buildings</b> menu. Click on the building name to see what the added value of the expansion is in terms of resources. Here you can also see how much energy the next level will consume on completion.<br><br>\r\nFor more information, you can take another look at the <b>Wiki</b>: \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Resources</a>"
  step2: "It's much more fun when you interact with your fellow players. Most of them organize themselves via our Discord. In the community, you not only get answers to your questions, but you can also find other players to play with.<br>\r\nIf you are unsure, you can also open tickets here."
  step3: "Another way to get resources is to raid the planets of your fellow players.<br>\r\nHowever, this can also happen to you - so build your first defense!<br>\r\nIt is important to have a defense to at least protect your night production.<br>\r\nHowever, mass is not necessarily the decisive factor here; the composition of the attacking fleet also counts.<br>\r\nBefore plundering, the attacker must first overcome your defenses. Every ship the attacker has to send reduces his profit and possibly increases his loss due to broken ships.<br>\r\nDefenses are built in the <b>Defense</b> menu with a shipyard. This in turn requires a robot factory and deuterium for construction.<br><br>\r\nHere is the matching article in the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Defense facilities</a>"
  step4: "Secure your supplies by expanding your mines!<br>\r\nThe construction of your buildings, ships and defenses, as well as research, will become more expensive over time. You should therefore continue to expand your production in order to balance out your planet's resource requirements. So click on Buildings now and expand your buildings accordingly if you have enough resources."
  step5: "Build yourself a Light Cargo!<br>\r\nLight Cargos are a quick means of transportation later in the game.<br>\r\nIf they fly with impulse engines, they are faster than the Heavy Cargo over a long period of time.<br>\r\nThey are used to transport resources between your planets, to trade with other players or to raid them.<br><br>\r\nYou can find more information in the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Ships</a>"
  step6: "Planets can be renamed for a better overview. To do this, click on the planet name in the overview in the header of the points display. Try this out now.<br><br>\r\nYou can also send buddy requests to other players. If they accept your request, you can communicate more easily and see each other's online status. You don't have to be in the same alliance to do this. Another advantage is that you can keep fleets with your buddy, which makes it possible to defend together outside of an alliance.<br><br>\r\nYou can also join an alliance to play together with other players. You no longer need a separate buddy request to hold fleets. Within the alliance you can send circular mails and see your online status and score - depending on your alliance rank. You can also see the online status and score of other alliance members."
  step7: "To see what resources, buildings, research, ships and defenses other players have, you have to spy on them. To do this, send a spy probe to another player either via the fleet menu or via the galaxy.<br>\r\nHowever, other players can also spy on you!"
  step8: >-
    An expedition can bring resources, ships, events or losses. To try this out,
    grab a ship and fly an expedition by clicking on planet coordinate 16 and
    mission "Expedition" in the fleet menu.<br>

    Each ship type will add points to the expedition fleet size up to a limit
    where the maximum event size is reached.<br><br>

    For more information, you can read in the wiki what you can change and in
    what form to possibly maximize your profit: 

    <a href="{wiki_url}/wiki/En/Expoanleitung"
    target="_blank">Expeditions</a>
  step9: "To have a fast production, you should colonize more planets. This gives you the opportunity to produce or build ships on two or more planets at the same time. Please note that you can only settle on the inner or outer edge of a system with a correspondingly high astrophysics level. In addition, the colony ship can be built without astrophysics, but the first colony requires astrophysics!<br><br>\r\nColonizing planets in a system or directly in neighboring systems keeps transport routes short, but also makes you vulnerable to players later in the game who place a colony in your system not for the mines, but as a temporary fleet base - called a raid colony.<br><br>\r\nFor more information you can check the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrophysics</a>"
  step10: "To get resources faster, you can also attack other players. Pay attention to the cost-benefit factor in order to launch a profitable attack. Use spy reports and the combat simulator to do this.<br><br>\r\nAttention! Many fleet missions can be tracked by other players in various ways.<br>\r\nNot losing your hard-earned fleet is one of the most important aspects of the game.<br><br>\r\nSo be sure to read through these topics in the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Fleet saving</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensor Phalanx</a>"
  step10_u6: >-
    To get resources faster, you can also attack other players. Pay attention to
    the cost-benefit factor in order to launch a profitable attack. Use spy
    reports and the combat simulator to do this.<br><br>

    Attention! Many fleet missions can be tracked by other players in various
    ways.<br>

    Not losing your hard-earned fleet is one of the most important aspects of
    the game.<br><br>

    So be sure to read through these topics in the wiki:

    <a
    href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Fleet saving</a>
  step11: "When fleets are destroyed, a debris field is created which can be harvested. For this you need a recycler with a cargo capacity of 20,000. Destroying a large fleet can be a lucrative source of resources.<br><br>\r\nInstead of using the fleet menu, recyclers can also be sent in suitable numbers directly via the Galaxy menu by clicking on a debris field."
  step12: "Congratulations, you have completed the tutorial.<br><br>\r\nThere are many more mechanics that this game has to offer.<br>\r\nFor example, there are essentially 3 styles of play, which also differ in terms of the time required:<br>\r\n<ul>\r\n<li>Miner: Expand mines on many colonies, mainly uses transporters</li>\r\n<li>Fleeter: High percentage of points in battleships, hardly any own production, lives from raiding other players</li>\r\n<li>Comber: A combination of both</li>\r\n</ul>\r\nMoons become important later in the game, and you should have already become familiar with the sensor phalanx.<br><br>\r\nIf you have further questions, you can read the wiki or ask the community in the Discord for help."
  step12_u6: >-
    Congratulations, you have completed the tutorial.<br><br>

    There are many more mechanics that this game has to offer.<br>

    For example, there are essentially 3 styles of play, which also differ in
    terms of the time required:<br>

    <ul>

    <li>Miner: Expand mines on many colonies, mainly uses transporters</li>

    <li>Fleeter: High percentage of points in battleships, hardly any own
    production, lives from raiding other players</li>

    <li>Comber: A combination of both</li>

    </ul>

    If you have further questions, you can read the wiki or ask the community in
    the Discord for help.
