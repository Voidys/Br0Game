longDescription:
  '1': 金属矿负责开采矿石，每一个新兴或成熟的帝国都建立在它之上。
  '2': 晶体是电子电路和某些合金的关键原料。
  '3': 重氢是飞船的燃料，从深海中提取。它十分稀有，所以价格相对较高。
  '4': 太阳能电站把阳光转化为能量。每座矿场都需要能量才能运转。
  '6': 默认情况下，每级可缩短 8% 的研究时间。
  '12': 核聚变电站通过聚变重氢来产生能量。它比太阳能电站产能更高，但建造成本也更高。产量会随能量技术等级和电站自身等级提升。能量产量公式：<br> 能量产量 = 30 x 核聚变电站等级 x (1.05 + (0.01 * 能量技术等级))^核聚变电站等级
  '14': 机器人工厂提供建筑机器人，协助你建造建筑。每升一级，建筑升级都会更快。
  '15': 机器人技术的巅峰。每升一级，建筑、舰船和防御设施的建造时间减半。
  '21': 所有舰船和防御设施都在星球上的造船厂中建造。
  '22': 为多余的金属提供储存空间。
  '23': 为多余的晶体提供储存空间。
  '24': 为多余的重氢提供储存空间。
  '31': 你需要研究实验室来研究新技术。实验室等级决定研究速度，以及你能解锁哪些技术。研究在你启动研究的那颗星球的实验室中进行，成果对你所有的星球生效。研究进行期间，任何研究实验室都无法升级。
  '33': 地形改造器可以扩展星球的可用面积。每升一级获得 5 个额外空地，偶数等级再多 1 个。地形改造器每一级本身也占用 1 个空地。<br>建造它需要能量，但能量不会被消耗：你的星球只需产出足够的能量即可（1 级需要 1,000，之后每升一级翻倍），即使你的矿场已经在使用这些能量。建成后，地形改造器永远无法拆除。
  '34': 联盟太空站目前在本游戏中没有任何效果：没有它，友方舰队也可以停驻在你的星球上，而且没有燃料补给功能。
  '35': 修复船坞可以修复在战斗中被击毁并留下残骸场的舰船。一次修复最多需要 12 小时，且最早也要在残骸场出现 30 分钟后才能完成。<br>残骸场出现后，你有 3 天时间开始修复。修复完成后，你需要手动让舰船重新服役；如果不操作，它们会在 3 天后自动重新服役。
  '41': 月球没有大气层，新生的月球只有一个建筑位，所以先建月球基地吧。每升一级可获得 3 个额外空地，且本身占用 1 个空地。建成后，月球基地永远无法拆除。
  '42': 感应阵可以让你监视舰队动向。等级越高，感应范围越大：默认为 (感应阵等级)^2 - 1 个星系，所以 1 级只能覆盖月球所在的星系。每次扫描消耗 5,000 重氢，且这些重氢必须存放在月球上。扫描时，在月球上打开星系视图，点击范围内的一颗星球即可。月球本身无法被感应阵扫描，因为它们没有大气层。<br><br>感应阵会显示从被扫描星球出发或飞往该星球的舰队：包括抵达时间、驻守结束时间，以及所有者的舰队返航时间。部署和导弹永远不会显示，飞往该星球的回收或贸易飞行也不会显示。
  '43': 跳跃门是巨型传送装置，能让大型舰队瞬间穿越宇宙，毫不耗时。它们不消耗重氢，但无法借此传送资源。两座跳跃门都必须就绪：跳跃之后，每座门都需要冷却，默认 1 级为 60 分钟，每升一级都会缩短，15 级起降至 10 分钟。
  '44': 导弹发射井用来储存你的导弹。默认情况下，每级增加 10 个储存位。一枚拦截导弹占 1 个位置，一枚星际导弹占 2 个位置。
  '106': 这项技术让你能够获取其他星球和月球的情报。当你派出探测器时，你的间谍技术会与目标的间谍技术比较：你的等级越高，报告中的信息越多，探测器被发现的几率也越低。探测器越多，细节越详尽，但被发现的风险也越高。达到特定间谍技术等级后，你还能在总览界面看到更多关于外来舰队的信息：<br><br><li>0-1 级时，你只能看到有舰队正在接近你的星球</li><li>2-3 级时，你能看到接近的舰船数量</li><li>4-7 级时，你能看到舰队中有哪些舰船类型</li><li>8 级及以上，你能看到舰队中每种舰船的数量</li>
  '108': 更先进的计算机让你能指挥更多舰队。计算机技术每升一级，你的舰队数量上限增加 1。
  '109': 武器技术让武器系统更加有效。每升一级，所有单位的武器威力提升基础值的 10%。
  '110': 护盾技术让舰船和防御设施的护盾更加有效。每升一级，护盾强度提升基础值的 10%。
  '111': 特种合金可以强化舰船和防御设施的装甲。每升一级，装甲效果提升 10%。
  '113': 掌握各种形式的能量，是通往众多新技术的钥匙。能量技术每升一级，还会提升核聚变电站的能量产量。
  '114': 通过整合第四和第五维度，你可以研究一种更经济、更高效的新型引擎。
  '115': 研发这种引擎可以让部分舰船更快，但每级只增加基础速度的 10%。受影响的舰船：小型运输舰、大型运输舰、轻型战斗机、回收船和间谍探测器（小型运输舰和回收船之后会换用更好的引擎）。
  '117': 脉冲引擎基于反作用力原理。继续研发可让部分舰船更快，但每级只增加基础速度的 20%：轰炸机、巡洋舰、重型战斗机和殖民船，以及换用该引擎后的小型运输舰和回收船。星际导弹的射程也会随等级提升。
  '118': 超空间引擎能扭曲舰船周围的空间。研发它可以让部分舰船更快，但每级只增加基础速度的 30%：战列巡洋舰、战列舰、毁灭者、死星、黑月、战斗运输舰、化身和战斗回收船，以及换用该引擎后的轰炸机和回收船。需要超空间技术（3 级）和研究实验室（7 级）。
  '120': 聚焦的光线会形成光束，对命中的一切造成伤害。需要研究实验室（1 级）和能量技术（2 级）。
  '121': 由加速离子形成的致命光束，命中时造成巨大伤害。
  '122': 离子技术的进一步发展，通过加速高能等离子体（由离子超高温加热而成）产生，命中时效果毁灭性。
  '123': 不同星球上的研究人员通过这个网络互相交流。每升一级，就能让多一座实验室加入你启动研究的实验室。系统会选取等级最高的实验室，且联网的实验室自身必须足够先进，能够独立进行该项研究。它们的等级会相加，用来计算研究时间。
  '124': 天体物理学解锁殖民和深空远征。下面的殖民上限、驻守时间和星球位置均为默认设置，你所在的宇宙可能有所不同。<br><br> <li>殖民上限</li> 1-2 级 = 2 颗星球<br> 3-4 级 = 3 颗星球<br> 5-6 级 = 4 颗星球<br> 7-8 级 = 5 颗星球<br> 9-10 级 = 6 颗星球<br> 11-12 级 = 7 颗星球<br> 13-14 级 = 8 颗星球<br> 15-16 级 = 9 颗星球<br> 17-18 级 = 10 颗星球<br> 19-20 级 = 11 颗星球<br> 21 级及以上 = 12 颗星球<br><br> <li>远征栏位</li> 1-3 级 = 1 支远征<br> 4-8 级 = 2 支远征<br> 9-15 级 = 3 支远征<br> 16-24 级 = 4 支远征<br>（之后每逢平方数等级再多 1 支：25、36……）<br><br> <li>远征驻守时间</li> 等级 = 最长驻守小时数<br><br> <li>可殖民位置</li> 1-3 级 = 4-12<br> 4-5 级 = 3-13<br> 6-7 级 = 2-14<br> 8 级及以上 = 1-15
  '131': 每级使金属产量提升 2%。
  '132': 每级使晶体产量提升 2%。
  '133': 每级使重氢产量提升 2%。
  '134': 每级使飞行消耗降低 2%。
  '199': 发射一束集中的引力子粒子，可以制造人造引力场，摧毁舰船甚至月球。需要研究实验室（12 级）。
  '202': 小型运输舰是一种灵活的飞船，能把资源快速运往其他星球。<br>在你的脉冲引擎达到 5 级之前，它使用燃烧引擎飞行。之后它会换用脉冲引擎，基础速度翻倍。
  '203': 这种运输舰的载货量远超小型运输舰，并且得益于改进的引擎，通常飞得更快。
  '204': 每位皇帝建造的第一艘战舰。轻型战斗机灵活但单独作战很脆弱；数量一多，就会成为任何帝国的真正威胁。轻型战斗机最先为小型和大型运输舰护航，前往防御薄弱的敌对星球。
  '205': 这种战斗机的装甲更厚，火力也比轻型战斗机更强。
  '206': 巡洋舰的装甲几乎是重型战斗机的三倍，火力超过两倍，而且速度很快。
  '207': 战列舰是舰队的中坚力量。重炮、高速和巨大的货舱，让它成为不容小觑的对手。
  '208': 这艘装甲精良的飞船负责征服新星球，这是新兴帝国发展壮大所必需的。到达新殖民地后，飞船会被拆解，所有可回收的材料都用于建设这个新世界。你能殖民多少颗星球，直接取决于天体物理学：第一级以及之后每隔一级，就能多殖民一颗星球（默认设置）。
  '209': 回收船从残骸场中采集原材料。它的载货量为 20,000。它起初使用燃烧引擎，当你的脉冲引擎达到 17 级后换用脉冲引擎，超空间引擎达到 15 级后换用超空间引擎。
  '210': 间谍探测器是小巧灵活的无人机，能跨越远距离送回舰队和星球的情报。
  '211': 轰炸机专为摧毁星球的防御设施而打造。<br>它使用脉冲引擎飞行，当你的超空间引擎达到 8 级后换用超空间引擎。
  '212': 太阳能卫星是一种简易平台，由太阳能电池组成，停在高空的静止轨道上。它们收集阳光，并通过激光传送给地面站。
  '213': 毁灭者是战舰之王。面对轻型激光炮时它拥有速射能力：每次命中后，有 90% 的几率再开一炮。
  '214': 死星的破坏力无与伦比，还能摧毁月球。
  '215': 战列巡洋舰专精于拦截敌方舰队。
  '216': 广受欢迎的死星的继任者：速度快得多，也更坚固，货舱巨大，但火力稍逊一筹。
  '217': 大型运输舰的升级版，载货量大得多。它使用超空间引擎，所以起步比大型运输舰慢，但随着超空间引擎等级提升会反超。
  '218': 绝对的最坏情况，虽然速度非常慢。
  '219': 巨大的货舱和全新的引擎，让它飞得更快，也能从残骸场中收集更多资源。
  '220': 钢铁巨像是真正的太空堡垒，由坚不可摧的屏障和厚重的装甲保护。即使最猛烈的攻击也会被弹开，而它依然无情地向前推进。但这种防御优势是有代价的：它的武器几乎不值一提，引擎迟缓，是个缓慢的巨人。它靠的不是闪电突击或灵活机动，而是纯粹的坚韧。想要阻止它的人，必须有极强的耐力，或者压倒性的火力。
  '221': 风暴之刃是顶级战斗机：快得惊人，火力凶狠。对手还没看清它，它就已经出手。防御只是次要考虑——能直接甩开的敌人，何必硬扛。它只盯着运输舰和回收船舰队，将它们毫无抵抗地歼灭。凭借疾风般的速度，它可以随意出击，并在援军赶到前消失。被风暴之刃盯上的人，几乎没有逃脱的机会。
  '222': 重型巡洋舰是标准巡洋舰的强化进化版。护盾更强，火力强大，可以在笨重的敌人面前站稳脚跟。与钢铁巨像、毁灭者和轰炸机并肩作战时，它的火力才真正大放异彩。不过，尽管实力强劲，它依然速度缓慢，机动性较差。
  '223': 护盾无人机代表了舰队防御的新思路，主要着眼于保护船员。创新却笨重的护盾技术大幅降低了飞行速度和机动性。尽管速度和灵活性很差，它的防御效果却极为出色。过时的结构被推向极限，只为提供几乎无法穿透的防御。
  '224': 临时突击运输艇是一种未经检验的运输艇，只配备最低限度的武器，专门用来骚扰粗心大意、毫无防备的邻居。这种临时拼凑的载具并非为长期使用而设计，而是用于快速、冲动的攻击，引发立竿见影的反应。一旦出动，邻里纠纷几乎是板上钉钉的事。凭借有限的装备和难以预测的特性，它是快速升级冲突的危险工具。
  '225': 风暴运输舰是真正的科技奇迹，在战斗力、速度和运载能力之间达到了完美平衡。它能快速部署部队和资源，同时在战场上输出惊人的火力，因此成为任何强大舰队不可或缺的一员。无论是迅猛的突击部队，还是支援长期行动，风暴运输舰都是高效作战的关键，是每支舰队的必备之选。
  '226': 巨型战斗运输舰代表了工程技术的巅峰。尽管外形略显笨重、飞行速度因此较慢，它仍是任何舰队见过的装甲最厚重的战斗运输舰。压倒性的火力让它成为战场上势不可挡的力量。这头庞然大物可以轻松突破敌军战线，同时为船员提供最大程度的保护。它是力量与坚韧的化身，是任何重装舰队的重要战力。
  '227': 优化回收船是标准回收船的尖端升级版。搭载强力脉冲引擎，它能更快、更省钱地抵达残骸场，是任何先进舰队的重要资产。优化的设计降低了建造成本，同时提高了资源回收效率。它在游戏中期开放，为任何扩张中的帝国带来战略优势。
  '228': 欧米茄回收船代表了回收技术的巅峰，但代价高昂。它强大的超空间引擎让它能以创纪录的速度抵达残骸场，并比任何其他舰船更快地回收资源。然而，这种速度是以效率为代价换来的：它的建造和燃料成本极其庞大，只有游戏后期的富有指挥官才用得起。对于速度重于成本的玩家来说，这就是终极回收船。
  '229': 毒蛇的研发目的是打破 Xer 的统治，它是对付轻型战斗机、重型战斗机和巡洋舰的终极武器。凭借速射火炮和先进技术，它改变了宇宙中的力量平衡。
  '230': 快速。精准。无法触及。拦截者不是为公平对决而生——它的设计就是要又快又狠地出击，转瞬之间创造压倒性的优势。
  '231': 贝希摩斯是数十年引力子研究的结晶，被打造成一座无情的战斗平台。与死星不同，它的设计目标不是摧毁星球，而是追求战场上的极致效率。舍弃了摧毁月球所需的高耗能系统后，它的结构大幅减重，得以搭载更强的引擎，获得更高的灵活性和更强的火力。其紧凑的引力炮让它成为一台移动的毁灭机器，一己之力就能歼灭庞大的舰队。
  '232': 虚空泰坦代表了现代引力子技术的巅峰。它设计的每一个方面都服务于同一个目的：快速歼灭敌方月球。常规的武器炮塔被刻意省略，以减轻质量，为巨大的晶体发电机腾出空间。这些发电机为已知星系中最先进的加速线圈供能，赋予这艘飞船无与伦比的机动性。庞大的晶体需求让每一艘虚空泰坦都成为一项宏伟的工业成就——也是无限毁灭力量的象征。
  '401': 导弹发射器是一种简单但性价比高的防御设施。战斗结束后，平均约 70% 被摧毁的防御设施会被重建。
  '402': 轻型激光炮是简单的地面武器。特殊的瞄准系统追踪敌人，高强度激光切开目标的船体。战斗结束后，平均约 70% 被摧毁的防御设施会被重建。
  '403': 重型激光炮是轻型激光炮的实用改进版。战斗结束后，平均约 70% 被摧毁的防御设施会被重建。
  '404': 高斯炮以极高的速度发射高密度金属弹丸。战斗结束后，平均约 70% 被摧毁的防御设施会被重建。
  '405': 离子炮发射离子束（带正电或负电的粒子）。战斗结束后，平均约 70% 被摧毁的防御设施会被重建。
  '406': 等离子炮利用大型核反应堆燃料电池为电磁加速器供能，发射等离子脉冲（环形体）。战斗结束后，平均约 70% 被摧毁的防御设施会被重建。
  '407': 小型护盾罩将整颗星球笼罩在一个能吸收巨量能量的力场中。每颗星球只能建造一个。
  '408': 大型护盾罩是进一步的发展，需要多得多的能量来抵御攻击。每颗星球只能建造一个。
  '409': 护盾罩技术的进化。它耗能更多，但比任何其他护盾都能承受更多次攻击。每颗星球只能建造一个。
  '410': 经过多年的引力研究，科学家们开发出了引力炮，它能产生一个小而集中的引力场，并将其射向敌人。
  '411': 一座不可移动的防御平台，自身没有动力，靠引力保持在围绕星球的稳定轨道上。启动这一过程需要巨量能量。每颗星球只能建造一个。
  '412': 地堡是一座重兵设防的建筑，专为抵御最强大的攻击而设计。它为星球居民和关键基础设施提供无与伦比的保护，是星球防御的基石。
  '413': 泰坦激光炮是一件拥有无与伦比破坏力的巨型武器。
  '414': 诱饵是一套精密的防御系统，用来误导和迷惑敌军。它伪装成导弹发射器，借此吓阻攻击。
  '502': 拦截导弹可以摧毁来袭的星际导弹。每枚星际导弹需要一枚拦截导弹。
  '503': 星际导弹会摧毁对手的防御设施，除非被拦截导弹击落。以这种方式摧毁的防御设施不会被重建。默认情况下，它们的射程（以星系为单位）取决于你的脉冲引擎等级：<br>射程 = (5 x 脉冲引擎等级) - 1
  '901': 金属是建造建筑和舰船的主要资源。它是最便宜的资源，但也是你需求量最大的，并且和晶体一样，生产所需的能量最少。矿场越大，向地下挖得就越深。
  '902': 晶体是电子电路和某些合金的主要资源。它在地下矿井中生产，原料会被当场加工成电路。
  '903': 重氢存在于最深的海洋中，是宇宙中最稀有的资源之一。你必须深入海底才能获取，这使它成为最昂贵的资源。
  '911': 生产每一种资源都需要能量。
secureResources: 仓储建筑每升一级，可保护该资源每日产量的 1% 不被攻击掠夺，最高 10%。
shortDescription:
  '1': 金属矿负责开采矿石，每一个新兴或成熟的帝国都建立在它之上。
  '2': 晶体是电子电路和某些合金的关键原料。
  '3': 重氢是飞船的燃料，从深海中提取。它十分稀有，所以价格相对较高。
  '4': 太阳能电站把阳光转化为能量。每座矿场都需要能量才能运转。
  '6': 默认情况下，每级可缩短 8% 的研究时间。
  '12': 核聚变电站通过聚变重氢燃料来产生能量。
  '14': 机器人工厂提供建筑机器人，协助你建造建筑。每升一级，建筑升级都会更快。
  '15': 机器人技术的巅峰。每升一级，建筑、舰船和防御设施的建造时间减半。
  '21': 所有舰船和防御设施都在星球上的造船厂中建造。
  '22': 为多余的金属提供储存空间。
  '23': 为多余的晶体提供储存空间。
  '24': 为多余的重氢提供储存空间。
  '31': 你需要研究实验室来研究新技术。
  '33': 地形改造器可以扩展星球的可用面积：每级增加 5 个空地，偶数等级再多 1 个。每一级本身也占用 1 个空地。
  '34': 联盟太空站目前在本游戏中没有任何效果。
  '35': 修复船坞可以从残骸场中修复舰船。
  '41': 月球没有大气层，新生的月球只有一个建筑位，所以先建月球基地吧。
  '42': 感应阵可以让你监视舰队动向。等级越高，感应范围越大。
  '43': 跳跃门是巨型传送装置，能让大型舰队瞬间穿越宇宙，毫不耗时。
  '44': 导弹发射井用来储存你的导弹。
  '106': 这项技术让你能够获取其他星球和月球的情报。
  '108': 更先进的计算机让你能指挥更多舰队。计算机技术每升一级，你的舰队数量上限增加 1。
  '109': 武器技术让武器系统更加有效。每升一级，所有单位的武器威力提升基础值的 10%。
  '110': 护盾技术让舰船和防御设施的护盾更加有效。每升一级，护盾强度提升基础值的 10%。
  '111': 特种合金可以强化舰船和防御设施的装甲。每升一级，装甲效果提升 10%。
  '113': 掌握各种形式的能量，是通往众多新技术的钥匙。
  '114': 通过整合第四和第五维度，你可以研究一种更经济、更高效的新型引擎。
  '115': 研发这种引擎可以让部分舰船更快，但每级只增加基础速度的 10%。
  '117': 脉冲引擎基于反作用力原理。继续研发可让部分舰船更快，但每级只增加基础速度的 20%。
  '118': 超空间引擎能扭曲舰船周围的空间。研发它可以让部分舰船更快，但每级只增加基础速度的 30%。
  '120': 聚焦的光线会形成光束，对命中的一切造成伤害。
  '121': 由加速离子形成的致命光束，命中时造成巨大伤害。
  '122': 离子技术的进一步发展，通过加速高能等离子体（由离子超高温加热而成）产生，命中时效果毁灭性。
  '123': 不同星球上的研究人员通过这个网络互相交流。
  '124': 解锁殖民和深空远征。奇数等级增加星球数量，平方数等级增加远征栏位，还能延长远征驻守时间，并开放更多星系内的星球位置。
  '131': 每级使金属产量提升 2%。
  '132': 每级使晶体产量提升 2%。
  '133': 每级使重氢产量提升 2%。
  '134': 每级使飞行消耗降低 2%。
  '199': 发射一束集中的引力子粒子，可以制造人造引力场，摧毁舰船甚至月球。
  '202': 小型运输舰是一种灵活的飞船，能把资源快速运往其他星球。
  '203': 这种运输舰的载货量远超小型运输舰，并且得益于改进的引擎，通常飞得更快。
  '204': 每位皇帝建造的第一艘战舰。轻型战斗机灵活但单独作战很脆弱；数量一多，就会成为任何帝国的真正威胁。轻型战斗机最先为小型和大型运输舰护航，前往防御薄弱的敌对星球。
  '205': 这种战斗机的装甲更厚，火力也比轻型战斗机更强。
  '206': 巡洋舰的装甲几乎是重型战斗机的三倍，火力超过两倍，而且速度很快。
  '207': 战列舰是舰队的中坚力量。重炮、高速和巨大的货舱，让它成为不容小觑的对手。
  '208': 这艘飞船可以殖民空置的星球。
  '209': 回收船从残骸场中采集原材料。
  '210': 间谍探测器是小巧灵活的无人机，能跨越远距离送回舰队和星球的情报。
  '211': 轰炸机专为摧毁星球的防御设施而打造。
  '212': 太阳能卫星是一种简易平台，由太阳能电池组成，停在高空的静止轨道上。它们收集阳光，并通过激光传送给地面站。
  '213': 毁灭者是战舰之王。
  '214': 死星的破坏力无与伦比，还能摧毁月球。
  '215': 战列巡洋舰专精于拦截敌方舰队。
  '216': 广受欢迎的死星的继任者：速度快得多，也更坚固，货舱巨大，但火力稍逊一筹。
  '217': 大型运输舰的升级版，载货量大得多。它使用超空间引擎，所以起步比大型运输舰慢，但随着超空间引擎等级提升会反超。
  '218': 绝对的最坏情况，虽然速度非常慢。
  '219': 巨大的货舱和全新的引擎，让它飞得更快，也能从残骸场中收集更多资源。
  '220': 钢铁巨像凭借厚重的护盾和装甲抵御一切攻击，但它的武器和引擎实在不敢恭维。
  '221': 风暴之刃是一种快如闪电、武装到牙齿的战斗机。防御？没必要——它的猎物是毫无防备的运输舰和回收船。
  '222': 一艘缓慢但火力强大的巡洋舰，拥有强化的护盾和攻击能力。
  '223': 轻型战斗机的重新设计版，优先保障船员安全，代价是飞行性能很差。
  '224': 一种未经检验的运输艇，武装极少，专门用来骚扰粗心的邻居并立刻引发冲突。
  '225': 集战斗力、速度和运载能力于一身的飞船，是任何强大舰队不可或缺的一员。
  '226': 一艘装甲厚重的战斗运输舰，外形威严而略显笨重，压倒性的火力足以击败最强硬的对手。
  '227': 经典回收船的改进版，搭载脉冲引擎，能以更低的成本更高效地执行回收任务。
  '228': 回收船的升级版，搭载超空间引擎，速度极快但效率不高。
  '229': 毒蛇的研发目的是打破 Xer 的统治，它是对付轻型战斗机、重型战斗机和巡洋舰的终极武器。凭借速射火炮和先进技术，它改变了宇宙中的力量平衡。
  '230': 快速。精准。无法触及。拦截者不是为公平对决而生——它的设计就是要又快又狠地出击，转瞬之间创造压倒性的优势。
  '231': 更小更快的死星，无法摧毁月球。贝希摩斯对舰队有致命威力。
  '232': 更快、更爆裂，总能带来惊喜。虚空泰坦是月球的噩梦。
  '401': 导弹发射器是一种简单但性价比高的防御设施。
  '402': 轻型激光炮是简单的地面防御武器。特殊的瞄准系统追踪敌舰，高强度激光切开目标的船体。
  '403': 重型激光炮是轻型激光炮的改进版。
  '404': 高斯炮以极高的速度发射高密度金属弹丸。
  '405': 离子炮发射离子束（带正电或负电的粒子）。
  '406': 等离子炮利用大型核反应堆燃料电池为电磁加速器供能，发射等离子脉冲（环形体）。
  '407': 小型护盾罩将整颗星球笼罩在一个能吸收巨量能量的力场中。
  '408': 大型护盾罩在攻击中能吸收多得多的能量。
  '409': 护盾罩技术的进化。它耗能更多，但比任何其他护盾都能承受更多次攻击。每颗星球只能建造一个。
  '410': 经过多年的引力研究，科学家们开发出了引力炮，它能产生一个小而集中的引力场，并将其射向敌人。
  '411': 一座不可移动的防御平台，自身没有动力，靠引力保持在围绕星球的稳定轨道上。启动这一过程需要巨量能量。
  '412': 它在守护！就像幼儿园塔防里的乐高积木。
  '413': 泰坦激光炮是一门巨型激光炮。
  '414': 诱饵是一套精密的防御系统，用来误导和迷惑敌军。它伪装成导弹发射器，借此吓阻攻击。
  '502': 拦截导弹可以摧毁来袭的星际导弹。
  '503': 星际导弹会摧毁对手的防御设施。
  '901': 金属是建造建筑和舰船的主要资源。它是最便宜的资源，但也是你需求量最大的。
  '902': 晶体是制造电子电路和形成某些合金的主要资源。
  '903': 重氢存在于最深的海洋中。它是最昂贵的资源，生产所需的能量也最多。
  '911': 生产每一种资源都需要能量。
