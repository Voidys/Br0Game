bonus:
  Attack: Attack
  BuildTime: 'Construction time'
  Defensive: Defense
  DefensiveTime: 'Defense building time'
  Energy: 'Energy production'
  Expedition: Expeditions
  FleetSlots: 'Fleet slots'
  FlyTime: 'Flight time'
  GateCoolTime: Jump gate charging time
  MoreFound: 'Expedition finds'
  Planets: Planets
  ResearchTime: Research time
  Resource: 'Resource production'
  ResourceStorage: Resource storage
  Shield: Shield
  ShipStorage: 'Ship storage'
  ShipTime: 'Ship building time'
  SpyPower: Espionage power
longDescription:
  '1': >-
    Metal mines extract the ore that every emerging and established empire is
    built on.
  '2': >-
    Crystal is the key ingredient for electronic circuits and certain alloys.
  '3': >-
    Deuterium fuels your spaceships and is harvested from the deep sea. It is
    a rare substance, so it is relatively expensive.
  '4': >-
    Solar power plants turn sunlight into energy. Every mine needs energy to
    run.
  '6': >-
    By default, each level shortens research time by 8%.
  '12': >-
    The Fusion Power Plant produces energy by fusing deuterium. It yields more
    energy than a Solar Power Plant, but costs more to build. Output rises with
    Energy Technology and with the plant's own level. The formula for energy
    production is:<br>
    Energy produced = 30 x Fusion Power Plant level x (1.05 + (0.01 * Energy
    Technology level))^Fusion Power Plant level
  '14': >-
    Robotic factories supply construction robots that help build your
    buildings. Each level speeds up building upgrades.
  '15': >-
    The ultimate in robotics. Each level halves the construction time of
    buildings, ships and defenses.
  '21': 'All ships and defenses are built in the planetary shipyard.'
  '22': Provides storage for excess Metal.
  '23': Provides storage for excess Crystal.
  '24': 'Provides storage for excess Deuterium.'
  '31': >-
    You need a research lab to research new technologies. The lab level sets how
    fast you research and which technologies you can unlock. Research runs at
    the lab of the planet where you start it, and the result counts for all your
    planets. While a research is running, no research lab can be upgraded.
  '33': >-
    The Terraformer expands the usable area of the planet. Each level gives you
    5 additional fields, plus one extra field on every even level. Every level
    of the Terraformer takes up one field itself.<br>Building it takes energy,
    but the energy is not used up: your planet only has to produce enough of it
    (1,000 for level 1, doubling with every level), even if your mines are
    already using it. Once built, the Terraformer can never be demolished.
  '34': "The Alliance Depot lets you supply friendly fleets that hold at your planet with deuterium and so extend their stay. Open it from the building page: for every holding fleet you choose between 1 hour and as many hours as the level of the depot, and pay hours times the fleet's hourly holding cost from the deuterium of your planet. The hourly holding cost is one tenth of the summed base fuel consumption of the fleet's ships, rounded up. A fleet can be supplied again and again, but it may never have more than 32 hours of stay left. Only fleets of other players that are currently in orbit at your planet can be supplied."
  '35': >-
    The repair dock can repair ships that were destroyed in battle and left a
    wreck field. A repair takes at most 12 hours, and it cannot finish earlier
    than 30 minutes after the wreck field appeared.<br>Once the wreck field
    appears, you have 3 days to start the repair. When the repair is finished,
    you have to put the ships back into service yourself. If you don't, they
    return to service automatically after 3 days.
  '41': >-
    The moon has no atmosphere, and a fresh moon has room for just one building,
    so start with the Moon Base. Each level gives 3 extra fields and takes up
    one field itself. Once built, the Moon Base can never be deconstructed.
  '42': >-
    The sensor array lets you watch fleet movements. The higher the level, the
    greater the Phalanx range: (Phalanx level)^2 - 1 systems by default, so
    level 1 covers only the moon's own system. One scan costs 5,000 deuterium,
    which must be on the moon. To scan, open the galaxy view from the moon and
    click a planet in range. Moons themselves cannot be scanned with the
    Phalanx, because they have no atmosphere.<br><br>The Phalanx shows fleets
    that start from or fly to the scanned planet: when they arrive, when a hold
    ends, and when the owner's fleets come home. Deployments and missiles are
    never shown, and neither are recycling or trade flights heading to the
    planet.
  '43': >-
    Jump gates are huge transmitters that send large fleets across the universe
    without losing any time. They use no deuterium, but you can't transfer
    resources this way. Both gates must be ready: after a jump, each gate needs
    a cooldown, which by default is 60 minutes at level 1 and shrinks with every
    level, down to 10 minutes from level 15.
  '44': >-
    Missile silos store your missiles. By default, each level adds 10 slots. An
    Interceptor missile takes up 1 slot, an Interplanetary missile takes up 2.
  '106': >-
    This technology lets you gather information about other planets and moons.
    When you send probes, your Spy Technology is compared with the target's: the
    higher your level, the more information in the report and the lower the
    chance of your probes being detected. More probes reveal more details but
    raise the risk of detection. At certain levels of Spy Technology you also
    learn more about foreign fleets on your Overview screen:<br><br><li>At level
    0-1 you only see that a fleet is approaching your planet</li><li>At levels
    2-3 you see how many ships are approaching</li><li>At levels 4-7 you see
    which types of ships are in the fleet</li><li>At level 8+ you see how many
    ships of each type are in the fleet</li>
  '108': >-
    Better computers let you command more fleets. Each level of Computer
    Technology raises your maximum number of fleets by one.
  '109': >-
    Weapons Technology makes weapon systems more effective. Each level
    increases the weapon strength of all units by 10% of the base value.
  '110': >-
    Shield Technology makes the shields of ships and defensive structures more
    effective. Each level increases shield strength by 10% of the base value.
  '111': >-
    Special alloys improve the armor of ships and defensive structures. Each
    level increases armor effectiveness by 10%.
  '113': >-
    Mastering different kinds of energy is the key to many new technologies.
    Each level of Energy Technology also increases the Fusion Power Plant's
    energy output.
  '114': >-
    By integrating the 4th and 5th dimensions, you can research a new kind of
    drive that is more economical and efficient.
  '115': >-
    Developing this drive makes some ships faster, but each level only adds 10%
    of the base speed. Affected ships: Light Cargo, Heavy Cargo, Light Fighter,
    Recycler and Spy Probe (Light Cargo and Recycler switch to better drives
    later).
  '117': >-
    The impulse drive works on the reaction principle. Developing it further
    makes some ships faster, but each level only adds 20% of the base speed:
    Bomber, Cruiser, Heavy Fighter and Colony Ship, plus Light Cargo and
    Recycler once they switch to this drive. Interplanetary missiles also fly
    further with every level.
  '118': >-
    The hyperspace drive warps space around a ship. Developing it makes some
    ships faster, but each level only adds 30% of the base speed: Battle
    Cruiser, Battleship, Destroyer, Death Star, Black Moon, Battle Transporter,
    Avatar and Battle Recycler, plus Bomber and Recycler once they switch to
    this drive. Requires Hyperspace Technology (level 3) and a Research Lab
    (level 7).
  '120': >-
    Focused light produces a beam that damages whatever it hits. Requires a
    Research Lab (level 1) and Energy Technology (level 2).
  '121': 'A deadly beam of accelerated ions that does enormous damage on impact.'
  '122': >-
    A further development of ion technology that accelerates high-energy
    plasma, created by super-heating ions. It has a devastating effect on
    impact.
  '123': >-
    Researchers on different planets communicate via this network. Each level
    lets one more lab join the lab where you start a research. The labs with the
    highest levels are picked, and a networked lab must be advanced enough to
    run that research on its own. Their levels are added together to calculate
    research time.
  '124': >-
    Astrophysics Research unlocks colonization and expeditions into deep space.
    The colony limit, hold time and positions below are the default settings;
    your universe may differ.<br><br> <li>Colony limit</li> Level 1-2 = 2
    planets<br> Level 3-4 = 3 planets<br> Level 5-6 = 4 planets<br> Level 7-8 =
    5 planets<br> Level 9-10 = 6 planets<br> Level 11-12 = 7 planets<br> Level
    13-14 = 8 planets<br> Level 15-16 = 9 planets<br> Level 17-18 = 10
    planets<br> Level 19-20 = 11 planets<br> Level 21+ = 12 planets<br><br>
    <li>Expedition slots</li> Level 1-3 = 1 expedition<br> Level 4-8 = 2
    expeditions<br> Level 9-15 = 3 expeditions<br> Level 16-24 = 4
    expeditions<br>(one more on every further square level: 25, 36, ...)<br><br>
    <li>Expedition hold time</li> Level = Max hold time in hours<br><br>
    <li>Colonizable positions</li> Level 1-3 = 4-12<br> Level 4-5 = 3-13<br>
    Level 6-7 = 2-14<br> Level 8+ = 1-15
  '131': >-
    Increases Metal production by 2% per level.
  '132': >-
    Increases Crystal production by 2% per level.
  '133': >-
    Increases Deuterium production by 2% per level.
  '134': >-
    Reduces flight costs by 2% per level.
  '199': >-
    Firing a concentrated charge of graviton particles creates an artificial
    gravity field that can destroy ships and even moons. Requires a Research Lab
    (level 12).
  '202': >-
    The light cargo is an agile ship that quickly carries resources to other
    planets.<br>It flies on the combustion drive until your Impulse Engine
    reaches level 5. From then on it switches to the impulse drive, which
    doubles its base speed.
  '203': >-
    This cargo ship carries much more than the light cargo and is generally
    faster thanks to an improved drive.
  '204': >-
    The first fighting ship every emperor builds. The light fighter is agile
    but vulnerable on its own; in large numbers, it becomes a real threat to
    any empire. Light fighters are the first to escort light and heavy cargoes
    to hostile planets with weak defenses.
  '205': 'This fighter has better armor and hits harder than the light fighter.'
  '206': >-
    Cruisers have almost three times the armor of heavy fighters and more
    than twice the firepower. They are also very fast.
  '207': >-
    Battleships are the backbone of a fleet. Heavy cannons, high speed and
    large cargo holds make them opponents to be taken seriously.
  '208': >-
    This well-armored ship conquers new planets, which an emerging empire needs
    to grow. At the new colony, the ship is disassembled and all recyclable
    material goes into developing the new world. How many planets you can
    colonize depends directly on Astrophysics Research: the first level and
    every second level after it allow another colony (by default).
  '209': >-
    The recycler harvests raw materials from debris fields. Its cargo capacity
    is 20,000. It starts out on the combustion drive, switches to the impulse
    drive once your Impulse Engine reaches level 17, and to the hyperspace drive
    once your Hyperspace Engine reaches level 15.
  '210': >-
    Spy probes are small, agile drones that deliver data on fleets and planets
    across long distances.
  '211': >-
    The bomber was built specifically to destroy a planet's defenses.<br>It
    flies on the impulse drive and switches to the hyperspace drive once your
    Hyperspace Engine reaches level 8.
  '212': >-
    Solar satellites are simple platforms of solar cells in a high, stationary
    orbit. They collect sunlight and beam it down to the ground station by
    laser.
  '213': >-
    The destroyer is the king of warships. Against Light Laser Turrets it has
    rapid fire: after each hit it gets another shot in 9 out of 10 cases.
  '214': >-
    The Death Star's destructive power is second to none, and it can destroy
    moons.
  '215': 'The Battle Cruiser specializes in intercepting hostile fleets.'
  '216': >-
    The successor to the popular Death Star: much faster and sturdier, with a
    huge cargo hold, but it hits somewhat less hard.
  '217': >-
    A development of the heavy cargo with far more carrying capacity. It runs on
    the hyperspace drive, so it starts out slower than the heavy cargo but pulls
    ahead as your Hyperspace Engine levels up.
  '218': 'The absolute worst-case scenario, albeit a very slow one.'
  '219': >-
    Huge cargo space and new engines let it fly faster and gather more from
    debris fields.
  '220': >-
    The Steel Colossus is a true fortress in space, shielded by unyielding
    barriers and massive armor. Even the fiercest attacks bounce off as it
    relentlessly moves forward. But this defensive superiority comes at a
    cost: its armament is barely worth mentioning, and its sluggish engines
    make it a slow giant. Instead of lightning strikes or agile maneuvers,
    this ship relies on sheer resilience. Anyone wishing to stop it must have
    great endurance – or overwhelming firepower.
  '221': >-
    The Stormblade is a top-tier fighter: incredibly fast and ruthlessly armed.
    Opponents barely see it before it strikes. Defense is a secondary concern –
    it doesn’t need to endure what it can simply outrun. Its sole focus is on
    transporters and recycler fleets, which are obliterated without resistance.
    With its blistering speed, it can strike at will and disappear before
    reinforcements arrive. Anyone targeted by the Stormblade has little chance
    of escape.
  '222': >-
    The Heavy Cruiser is a reinforced evolution of the standard cruiser. With
    improved shields and powerful weaponry, it can hold its ground against
    cumbersome enemies. It excels when deployed alongside Steel Colossi,
    Destroyers, and Bombers, where its firepower truly shines. However, despite
    its strength, it remains slow and less maneuverable.
  '223': >-
    The Shield Drone represents a new approach in fleet defense, focusing
    primarily on crew protection. Innovative but heavy shielding technologies
    have significantly reduced flight speed and maneuverability. Despite its
    poor speed and agility, it is highly effective in defense. The outdated
    structure has been pushed to its limits to provide a nearly impenetrable
    defense.
  '224': >-
    The Improvised Assault Transport is an untested transport craft equipped
    with minimal armament, specifically created to disturb careless and
    unprepared neighbors. This makeshift vehicle is not designed for long-term
    use, but for quick, impulsive attacks that provoke immediate reactions. A
    neighborhood dispute is practically guaranteed as soon as it is deployed.
    With its limited equipment and unpredictable nature, it becomes a dangerous
    tool for rapid conflict escalation.
  '225': >-
    The Storm Transporter is a true marvel of technology, offering the perfect
    balance between combat power, speed, and transport capacity. Its ability to
    quickly deploy troops and resources while delivering impressive firepower to
    the battlefield has made it an essential element of any powerful fleet.
    Whether for swift assault units or supporting long-term operations, the
    Storm Transporter is key to effective warfare and is an absolute must-have
    in any fleet.
  '226': >-
    The Colossal Battle Transporter represents the pinnacle of engineering.
    Despite its slightly bulky design and the resulting slow flight speed, it
    is the most heavily armored battle transporter ever seen by any fleet.
    Its overwhelming firepower makes it an unstoppable force on the
    battlefield. This behemoth can effortlessly breach enemy lines while
    providing maximum protection to its crew. It embodies strength and
    resilience, making it an essential asset for any heavily armed fleet.
  '227': >-
    The Optimized Recycler is a cutting-edge upgrade of the standard recycler.
    Equipped with a powerful impulse engine, it reaches debris fields faster and
    more cost-effectively, making it an essential asset for any advanced fleet.
    Its optimized design reduces construction costs while increasing resource
    recovery efficiency. Available from the midgame, it provides a strategic
    advantage for any expanding empire.
  '228': >-
    The Omega Recycler represents the pinnacle of recycling technology—but at a
    high cost. Its powerful hyperspace drive allows it to reach debris fields in
    record time and salvage resources faster than any other ship. However, this
    speed comes at the expense of efficiency: Its construction and fuel costs
    are immense, making it a viable option only for wealthy commanders in the
    late game. For those prioritizing speed over cost, this is the ultimate
    Recycler.
  '229': >-
    Developed to break the dominance of the Xer, the Viper is the ultimate
    weapon against Light fighters, Heavy fighters and Cruisers. With its
    rapid-fire cannons and advanced technology, it shifts the balance of power
    in the universe.
  '230': >-
    Fast. Precise. Untouchable. The Interceptor isn't built for fair fights –
    it's designed to strike fast and hard, creating an overwhelming advantage
    in the blink of an eye.
  '231': >-
    The Behemoth is the result of decades of graviton research, turned into a
    relentless combat platform. Unlike Death Stars, it was not designed for
    planetary destruction, but for maximum battlefield efficiency. By
    abandoning the energy-intensive systems needed for moon destruction, its
    design was significantly lightened, allowing for stronger engines, greater
    agility and increased firepower. Its compact graviton cannon makes it a
    mobile engine of destruction, capable of annihilating even massive fleets
    single-handedly.
  '232': >-
    The Void Titan represents the pinnacle of modern graviton technology.
    Every aspect of its design serves a single purpose: the rapid annihilation
    of enemy moons. Conventional weapon turrets were deliberately omitted to
    reduce mass and make room for colossal crystal generators. These power the
    most advanced acceleration coils ever constructed across the known
    galaxies, granting the vessel an unmatched level of mobility. The immense
    crystal requirements make every Void Titan a monumental industrial
    achievement – and a symbol of limitless destructive power.
  '401': >-
    The Rocket Launcher is a simple but cost-effective defense. After a battle,
    on average about 70% of destroyed defenses are rebuilt.
  '402': >-
    Light lasers are simple ground-based weapons. Special targeting systems
    track the enemy, and a high-intensity laser cuts through the hull of the
    target. After a battle, on average about 70% of destroyed defenses are
    rebuilt.
  '403': >-
    The Heavy Laser is a practical, improved version of the Light Laser. After a
    battle, on average about 70% of destroyed defenses are rebuilt.
  '404': >-
    The Gauss Cannon fires high-density metal projectiles at extremely high
    velocity. After a battle, on average about 70% of destroyed defenses are
    rebuilt.
  '405': >-
    An ion cannon fires beams of ions (positively or negatively charged
    particles). After a battle, on average about 70% of destroyed defenses are
    rebuilt.
  '406': >-
    The Plasma Turret uses a large nuclear reactor fuel cell to power an
    electromagnetic accelerator that fires pulses (toroids) of plasma. After a
    battle, on average about 70% of destroyed defenses are rebuilt.
  '407': >-
    The Small Shield Dome envelops the whole planet in a field that absorbs
    tremendous amounts of energy. Only one can be built per planet.
  '408': >-
    The Large Shield Dome is a further development that needs substantially more
    energy to withstand attacks. Only one can be built per planet.
  '409': >-
    The evolution of shield dome technology. It uses much more energy, but
    endures more attacks than any other shield. Only one can be built per
    planet.
  '410': >-
    After years of research into gravity, scientists developed a graviton
    cannon that generates a small, concentrated graviton field and fires it at
    the enemy.
  '411': >-
    An immovable defense platform with no power of its own, held in a stable
    orbit around the planet by gravity. Starting this process takes huge amounts
    of energy. Only one can be built per planet.
  '412': >-
    The Bunker is a heavily fortified structure designed to withstand even the
    most powerful attacks. It provides unparalleled protection for the planet's
    inhabitants and critical infrastructure, making it a cornerstone of planetary
    defense.
  '413': >-
    The Titan Laser is a colossal weapon of unparalleled destructive power.
  '414': >-
    The Decoy is a sophisticated defensive system designed to mislead and
    confuse enemy forces. By disguising itself as a Missile Launcher, it
    deters attacks.
  '502': >-
    Interceptor missiles destroy incoming Interplanetary missiles. One
    Interceptor missile is needed per Interplanetary missile.
  '503': >-
    Interplanetary missiles destroy the opponent's defenses, unless Interceptor
    missiles shoot them down. Defenses destroyed this way are not rebuilt. By
    default, their range (in solar systems) depends on your Impulse Engine
    level:<br>Range = (5 x Impulse Engine level) - 1
  '901': >-
    Metal is the main resource for buildings and ships. It is the cheapest
    resource, but also the one you need the most, and, like crystal, it takes
    the least energy to produce. The bigger the mines, the deeper they dig into
    the earth.
  '902': >-
    Crystal is the main resource for electronic circuits and certain alloys.
    It is produced in underground mines, where the raw material is turned into
    circuits right away.
  '903': >-
    Deuterium is found in the deepest seas and is one of the rarest resources
    in the universe. You have to reach the sea floor to get it, which makes it
    the most expensive resource.
  '911': 'Energy is needed to produce every resource.'
secureResources: >-
  Each level of a storage building protects 1% of that resource's daily
  production from looting during attacks, up to a maximum of 10%.
