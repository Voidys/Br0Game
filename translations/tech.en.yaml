    tremendous amounts of energy.
  '408': >-
    The development of the Large Shield Dome allows for substantially more
    energy to be absorbed during attacks.
  '409': >-
    The evolution of the Great Shield Dome Shield technology. It uses much more
    energy but can endure even more attacks than any other shield.
  '410': >-
    After years of research at the gravitational force, researchers were able
    to develop a Graviton cannon that generate small concentrated Graviton
    field that can be shot at the enemy.
  '411': >-
    There is an immovable defensive platform. It has no direct power, and is
    held by Gravity in a stable orbit of the planet. The start of this process
    requires high masses of energy.
  '412': >-
    It Protects! Like the Lego brick in Kindergarten TD
  '413': >-
    The Titan Laser is a colossal Laser.
  '414': >-
    The Decoy pretends to be a Missile Launcher.
  '502': Interceptor missiles are used to destroy attacking Interplanetary missiles.
  '503': Interplanetary missiles are used to destroy the opponents defenses.
  '901': >-
    Metal is the main resource for Buildings and Ships. It is the cheapest
    resource, but it is needed the most as well.
  '902': >-
    Crystals are the main resource used to build electronic circuits and form
    certain alloy compounds.
  '903': >-
    Deuterium is found in the deepest sea. It is the most expensive resource and
    needs the most energy as well.
  '911': Energy is needed for the production of every resource.
