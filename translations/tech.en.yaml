longDescription:
  '1': >-
    Used in the extraction of metal ore, metal mines are of primary importance
    to all emerging and established empires.
  '2': >-
    Crystals are the main resource used to build electronic circuits and form
    certain alloy compounds.
  '3': >-
    Deuterium is used as fuel for spaceships and is harvested in the deep sea.
    Deuterium is a rare substance and is thus relatively expensive.
  '4': >-
    Solar power plants absorb energy from solar radiation. All mines need energy
    to operate.
  '6': Shortens research time each level by 8%.
  '12': >-
    The Fusion Power Plant produces energy by fusing deuterium. It yields more
    energy than a Solar Power Plant, but costs more to build. Output rises with
    Energy Technology and with the plant's own level. The formula for energy
    production is:<br>
    Energy produced = 30 x Fusion Power Plant level x (1.05 + (0.01 * Energy
    Technology level))^Fusion Power Plant level
  '14': >-
    Robotic factories provide construction robots to aid in the construction of
    buildings. Each level increases the speed of the upgrade of buildings
  '15': >-
    This is the ultimate in robotics technology. Each level cuts the
    construction time for buildings, ships, and defenses
  '21': >-
    All types of ships and defensive facilities are built in the planetary
    shipyard
  '22': Provides storage for excess Metal.
  '23': Provides storage for excess Crystal.
  '24': Provides storage for excess Deuterium
  '31': >-
    A research lab is required in order to conduct research into new
    technologies.
  '33': >-
    The Terraformer increases the usable area on the planet. For each level of
    Terraformer you get 5 additional fields to use and one extra field every
    even level, one field is occupied by Terraformer itself.<br>To start
    building Terraformer you don't need the energy available, you just need to
    be capable to produce enough energy to start the building.
  '34': >-
    With an Alliance Depot you can supply fuel to friendly fleets in orbit. The
    Alliance Depot allows you to support friendly fleets so they can remain
    stationed at your planet for a time. The depot can launch a support-rocket
    that brings deuterium to the fleet in the orbit. The amount of deuterium is
    20,000 deuterium for each Alliance Depot Level.
  '35': >-
    The repair dock offers the possibility to repair destroyed ships that have
    left a wreckage field after a battle. The repair time is a maximum of 12
    hours, but it takes at least 30 minutes before the ships can be put back
    into service.<br>Once the wreck field has been created, you have 3 days to
    start the repair. The repaired ships must be actively put back into service
    at the end of the repair. If this is not done, they will automatically
    return to service after 3 days.
  '41': >-
    The moon has no atmosphere therefore a lunar base must be built before the
    settlement of other buildings. Each level of Moon Base gives 3 extra fields.
    Once built, the Moon Base can never be deconstructed.
  '42': >-
    The sensor array allows you to monitor fleet movements. The higher the
    stage, the greater is the range of the Phalanx. One use costs 5.000
    deuterium. Note that moons cannot be scanned with Phalanx due to their lack
    of the atmosphere<br><br>What Sensor Phalanx can see:<li>Attacking fleets
    (including ACS)</li><li>Trading fleets</li><li>Fleets on deployment
    mission</li><li>Spying fleets<li>Fleets with the mission hold
    (ACS)</li><br>If you scan the home planet of the fleet:<li>Fleets coming
    home from any mission (except Recalled deployment)</li><li>Fleets on a hold
    or expedition mission</li>
  '43': >-
    Jump gates are huge transmitters that are able to send large fleets without
    loss of time through the universe. You can't transfer your resources this
    way. There is a sixty minute cooldown time on both Jumpgates that were used.
  '44': >-
    Missile silos are used for storage of rockets. For each level of the missile
    silo an extra 10 slots are made available. An Interceptor missile occupies 1
    slot, while an interplanetary missile occupies 2.
  '106': >-
    Information about other planets and moons can be gained using this
    technology. At certain levels of Spy Technologies you get more information
    about foreign fleets on your Overview screen:<br><br><li>At level 0-1 you
    just see that the fleet is approaching your planet</li><li>At levels 2-3 you
    can see the number of ships approaching</li><li>At levels 4-7 you can see
    what type of ships are in the approaching fleet</li><li>At levels 8+ you can
    see how many of each type of ships is in the fleet</li>
  '108': >-
    More fleets can be commanded by increasing computer capacities. Each level
    of computer technology increases the maximum number of fleets by one.
  '109': >-
    Weapons technology makes weapons systems more efficient. Each level of
    weapons technology increases the weapon strength of units by 10 % of the
    base value.
  '110': >-
    Shielding technology makes the shields on ships and defensive facilities
    more efficient. Each level of shield technology increases the strength of
    the shields by 10 % of the base value.
  '111': >-
    Special alloys improve the armour on ships and defensive structures. The
    effectiveness of the armour can be increased by 10 % per level.
  '113': >-
    The command of different types of energy is necessary for many new
    technologies. Additionally, each level of Energy Technology also increases
    the Fusion Power Plant's energy output.
  '114': >-
    By integrating the 4th and 5th dimensions it is now possible to research a
    new kind of drive that is more economical and efficient.
  '115': >-
    The development of this drive makes some ships faster, although each level
    increases speed by only 10 % of the base value.
  '117': >-
    The impulse drive is based on the reaction principle. Further development of
    this drive makes some ships faster, although each level increases speed by
    only 20 % of the base value.
  '118': >-
    Hyperspace drive warps space around a ship. The development of this drive
    makes some ships faster, although each level increases speed by only 30 % of
    the base value.
  '120': Focusing light produces a beam that causes damage when it strikes an object.
  '121': >-
    A deadly beam of accelerated ions. This causes enormous damage when striking
    an object.
  '122': >-
    A further development of ion technology which accelerates high-energy
    Plasma, a result of super-heating Ions. This has a devastating effect when
    striking an object.
  '123': >-
    Researchers on different planets communicate via this network. Each level
    allows one extra lab to join with the lab where you begin research,
    effectively adding their levels together to compute research time.
  '124': >-
    Astrophysics Research unlocks colonisation and expeditions into deep space.<br><br>
    <li>Colony limit</li>
    Level 1-2 = 2 planets<br>
    Level 3-4 = 3 planets<br>
    Level 5-6 = 4 planets<br>
    Level 7-8 = 5 planets<br>
    Level 9-10 = 6 planets<br>
    Level 11-12 = 7 planets<br>
    Level 13-14 = 8 planets<br>
    Level 15-16 = 9 planets<br>
    Level 17-18 = 10 planets<br>
    Level 19-20 = 11 planets<br>
    Level 21+ = 12 planets<br><br>
    <li>Expedition slots</li>
    Level 1-3 = 1 expedition<br>
    Level 4-8 = 2 expeditions<br>
    Level 9-15 = 3 expeditions<br>
    Level 16-24 = 4 expeditions<br><br>
    <li>Expedition hold time</li>
    Level = Max hold time in hours<br><br>
    <li>Colonisable positions</li>
    Level 1-3 = 4-12<br>
    Level 4-5 = 3-13<br>
    Level 6-7 = 2-14<br>
    Level 8+ = 1-15
  '131': Increases the production of Metal by 2%
  '132': Increases the production of Crystal by 2%
  '133': Increases the production of Deuterium by 2%
  '134': Reduces flight costs by 2%
  '199': >-
    Firing a concentrated charge of graviton particles can create an artificial
    gravity field, which can destroy ships or even moons.
  '202': >-
    The light cargo is an agile ship which can quickly transport resources to
    other planets.<br>Light cargo switches to Impulse drive at level 5, doubling
    its base speed
  '203': >-
    This cargo ship has a much larger cargo capacity than the light cargo, and
    is generally faster thanks to an improved drive.
  '204': >-
    This is the first fighting ship all emperors will build. The light fighter
    is an agile ship, but vulnerable on its own. In mass numbers, they can
    become a great threat to any empire. They are the first to accompany light
    and heavy cargoes to hostile planets with minor defences.
  '205': >-
    This fighter is better armoured and has a higher attack strength than the
    light fighter.
  '206': >-
    Cruisers are armoured almost three times as heavily as heavy fighters and
    have more than twice the firepower. In addition, they are very fast.
  '207': >-
    Battleships form the backbone of a fleet. Their heavy cannons, high speed,
    and large cargo holds make them opponents to be taken seriously.
  '208': >-
    This well-armored ship is used to conquer new planets, which is essential
    for an emerging empire. The ship is used on the new colony as a raw material
    supplier, in which it is disassembled again and all recyclable material is
    used for the development of the new world. The number of colonizable planets
    per empire is directly dependent on astrophysics research. The first, as
    well as every other second level, allow for further colonization.
  '209': >-
    The recycler harvests raw materials from debris fields. Its cargo capacity
    is 20,000. At Impulse Engine 17 or Hyperspace Engine 15 it switches to the
    faster drive.
  '210': >-
    Spy probes are small agile drones, which provide data over long distances on
    fleets and planets.
  '211': >-
    The bomber was specially designed to destroy a planet's defenses.<br>
    Bomber switches to Hyperspace drive at level 8
  '212': >-
    Solar satellites are simple platforms of solar cells that are located in a
    high stationary orbit. They collect the sunlight and pass it on to the
    ground station via laser.
  '213': The destroyer is the king of the warships.
  '214': >-
    The destructive power of the Death Star is second to none and can destroy
    moons.
  '215': The Battle Cruiser is specialized in the interception of hostile fleets.
  '216': The successor of the popular death star, faster but not as strong.
  '217': >-
    Is a development of the heavy cargo, it has more carry capacity and flies
    faster with the right technology.
  '218': The absolute worst case scenario, albeit very slowly.
  '219': >-
    Is a huge cargo space and new engines, enable it to fly faster and gather
    more in debris fields .
  '220': >-
    The Steel Colossus is a true fortress in space, shielded by unyielding
    barriers and massive armor. Even the fiercest attacks bounce off as it
    relentlessly moves forward. But this defensive superiority comes at a cost:
    its armament is barely worth mentioning, and its sluggish engines make it a
    slow giant. Instead of lightning strikes or agile maneuvers, this ship
    relies on sheer resilience. Anyone wishing to stop it must have great
    endurance – or overwhelming firepower.
  '221': >-
    The Stormblade is a top-tier fighter: incredibly fast and ruthlessly armed.
    Opponents barely see it before it strikes. Defense is a secondary concern –
    it doesn’t need to endure what it can simply outrun. Its sole focus is on
    transporters and recycler fleets, which are obliterated without resistance.
    With its blistering speed, it can strike at will and disappear before
    reinforcements arrive. Anyone targeted by the Stormblade has little chance
    of escape.
  '222': >-
    The Heavy Cruiser is a reinforced evolution of the standard cruiser. With
    improved shields and powerful weaponry, it can hold its ground against
    cumbersome enemies. It excels when deployed alongside Steel Colossi,
    Destroyers, and Bombers, where its firepower truly shines. However, despite
    its strength, it remains slow and less maneuverable.
  '223': >-
    The Shield Drone represents a new approach in fleet defense, focusing
    primarily on crew protection. Innovative but heavy shielding technologies
    have significantly reduced flight speed and maneuverability. Despite its
    poor speed and agility, it is highly effective in defense. The outdated
    structure has been pushed to its limits to provide a nearly impenetrable
    defense.
  '224': >-
    The Improvised Assault Transport is an untested transport craft equipped
    with minimal armament, specifically created to disturb careless and
    unprepared neighbors. This makeshift vehicle is not designed for long-term
    use, but for quick, impulsive attacks that provoke immediate reactions. A
    neighborhood dispute is practically guaranteed as soon as it is deployed.
    With its limited equipment and unpredictable nature, it becomes a dangerous
    tool for rapid conflict escalation.
  '225': >-
    The Storm Transporter is a true marvel of technology, offering the perfect
    balance between combat power, speed, and transport capacity. Its ability to
    quickly deploy troops and resources while delivering impressive firepower to
    the battlefield has made it an essential element of any powerful fleet.
    Whether for swift assault units or supporting long-term operations, the
    Storm Transporter is key to effective warfare and is an absolute must-have
    in any fleet.
  '226': >-
    The Colossal Battle Transporter represents the pinnacle of engineering.
    Despite its slightly bulky design and the resulting slow flight speed, it is
    the most heavily armored battle transporter ever seen by any fleet. Its
    overwhelming firepower makes it an unstoppable force on the battlefield.
    This behemoth can effortlessly breach enemy lines while providing maximum
    protection to its crew. It embodies strength and resilience, making it an
    essential asset for any heavily armed fleet.
  '227': >-
    The Optimized Recycler is a cutting-edge upgrade of the standard recycler.
    Equipped with a powerful impulse engine, it reaches debris fields faster and
    more cost-effectively, making it an essential asset for any advanced fleet.
    Its optimized design reduces construction costs while increasing resource
    recovery efficiency. Available from the midgame, it provides a strategic
    advantage for any expanding empire.
  '228': >-
    The Omega Recycler represents the pinnacle of recycling technology—but at a
    high cost. Its powerful hyperspace drive allows it to reach debris fields in
    record time and salvage resources faster than any other ship. However, this
    speed comes at the expense of efficiency: Its construction and fuel costs
    are immense, making it a viable option only for wealthy commanders in the
    late game. For those prioritizing speed over cost, this is the ultimate
    Recycler.
  '229': >-
    Developed to break the dominance of the Xer, the Viper is the ultimate weapon against
    Light fighters, Heavy fighters and Cruisers. With its rapid-fire canons and advanced technology,
    it shifts the balance of power in the universe.
  '230': >-
    Fast. Precise. Untouchable.
    The Interceptor isn't built for fair fights
    it's designed to strike fast and hard,
    creating an overwhelming advantage in the blink of an eye.
  '231': >-
    The Behemoth is the result of decades of graviton research, combining this technology
    into a relentless combat platform. Unlike Death Stars, it was not designed for
    planetary destruction, but for maximum battlefield efficiency. By abandoning the
    energy-intensive systems required for moon destruction, its design was significantly
    lightened, allowing for stronger engines, greater agility, and increased firepower.
    Its compact graviton cannon transforms it into a mobile engine of destruction,
    capable of annihilating even massive fleets single-handedly. 
  '232': >-
    The Void Titan represents the pinnacle of modern graviton technology.Every aspect
    of its design serves a single purpose: the rapid annihilation of enemy moons.
    Conventional weapon turrets were deliberately omitted to reduce mass and make room
    for colossal crystal generators. These power the most advanced acceleration coils
    ever constructed across the known galaxies, granting the vessel an unmatched
    level of mobility. The immense crystal requirements make every Void Titan a
    monumental industrial achievement—and a symbol of limitless destructive power.
  '402': >-
    Light Lasers are simple ground based weapons that utilize special targeting
    systems to track the enemy and fire a high intensity laser designed to cut
    through the hull of the target.
  '403': The Heavy Laser is a practical, improved version of the Light Laser.
  '404': >-
    The Gauss Cannon fires high-density metal projectiles at extremely high
    velocity.
  '405': >-
    An ion cannon is a weapon that fires beams of ions (positively or negatively
    charged particles).
  '406': >-
    The Plasma Turret uses a large nuclear reactor fuel cell to power an
    electromagnetic accelerator that fires a pulse, or toroid, of plasma.
  '407': >-
    The Small Shield Dome envelops the whole planet in a field, which can absorb
    tremendous amounts of energy.
  '408': >-
    The development of the Large Shield Dome needs substantially more energy to
    endure attacks.
  '409': >-
    The evolution of the Great Shield Dome Shield technology. It uses much more
    energy but can endure even more attacks than any other shield.
  '410': >-
    After years of research at the gravitational force, researchers were able
    to develop a Graviton cannon that generate small concentrated Graviton
    field that can be shot at the enemy.
  '411': >-
    There is an immovable defensive platform. It has no direct power, and is
    held by Gravity in a stable orbit of the planet. The start of this process
    requires high masses of energy.
  '412': >-
    The Bunker is a heavily fortified structure designed to withstand even the
    most powerful attacks. It provides unparalleled protection for the planet's
    inhabitants and critical infrastructure, making it a cornerstone of planetary
    defense.
  '413': >-
    The Titan Laser is a colossal weapon of unparalleled destructive power.
  '414': >-
    The Decoy is a sophisticated defensive system designed to mislead and
    confuse enemy forces. By disgusing itself as a Missile Launcher it deters
    attacks.
  '502': >-
    Interceptor missiles are used to destroy attacking Interplanetary missiles.
    1 Interceptor missile is required to destroy 1 Interplanetary missile
  '503': >-
    Interplanetary missiles are used to destroy the opponents defenses. The
    range of Interplanetary missiles(in number of solar system) is determined by
    the level of your Impulse drive:<br>Range = (5 x Impulse Drive level) - 1
  '901': >-
    Metal is the main resource for Buildings and Ships. It is the cheapest
    resource, but it is needed the most as well. Producing Metal is the least
    energy expensive. The bigger the mines are, the deeper they dig into the
    earth.
  '902': >-
    Crystals are the main resource used to build electronic circuits and form
    certain alloy compounds. It gets produced in mines under the ground, where
    the raw material instantly is made into circuits.
  '903': >-
    Deuterium is found in the deepest sea. It belongs to the rarest resources in
    the Universe. Because you have to get to the ground of the sea in order to
    get Deuterium, it is the most expensive resource.
  '911': Energy is needed for the production of every resource.
secureResources: >-
  Depending on the upgrade level, 1% of the daily production up to a maximum of
  10% is protected against looting during attacks.
