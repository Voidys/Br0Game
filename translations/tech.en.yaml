  '225': >-
    A ship that combines combat power, speed, and transport capacity, making it
    indispensable for any powerful fleet.
  '226': >-
    A heavily armored battle transporter with an imposing, slightly bulky
    design, whose overwhelming firepower can defeat even the toughest
    opponents.
  '227': >-
    An improved version of the classic recycler with impulse engines, allowing
    for more efficient salvage missions at lower costs.
  '228': An extremely fast but inefficient Recycler upgrade with a hyperspace drive.
  '229': >-
    Developed to break the dominance of the Xer, the Viper is the ultimate
    weapon against Light fighters, Heavy fighters and Cruisers. With its
    rapid-fire cannons and advanced technology, it shifts the balance of power
    in the universe.
  '230': >-
    Fast. Precise. Untouchable. The Interceptor isn't built for fair fights –
    it's designed to strike fast and hard, creating an overwhelming advantage
    in the blink of an eye.
  '231': >-
    A smaller, faster Death Star that can't destroy moons. The Behemoth is
    deadly against fleets.
  '232': >-
    Faster, more explosive, always a good surprise.
    The Void Titan is the terror of the moons.
  '401': The Rocket Launcher is a simple but cost-effective defense.
  '402': >-
    Light lasers are simple ground-based defense weapons. Special targeting
    systems track enemy ships, and a high-intensity laser cuts through the
    hull of the target.
  '403': The Heavy Laser is an improved version of the Light Laser.
  '404': >-
    The Gauss Cannon fires high-density metal projectiles at extremely high
    velocity.
  '405': >-
    An ion cannon fires beams of ions (positively or negatively charged
    particles).
  '406': >-
    The Plasma Turret uses a large nuclear reactor fuel cell to power an
    electromagnetic accelerator that fires pulses (toroids) of plasma.
  '407': >-
    The Small Shield Dome envelops the whole planet in a field that absorbs
    tremendous amounts of energy.
  '408': >-
    The Large Shield Dome can absorb substantially more energy during attacks.
  '409': >-
    The evolution of shield dome technology. It uses much more energy, but
    endures more attacks than any other shield.
  '410': >-
    After years of research into gravity, scientists developed a graviton
    cannon that generates a small, concentrated graviton field and fires it at
    the enemy.
  '411': >-
    An immovable defense platform with no power of its own, held in a stable
    orbit around the planet by gravity. Starting this process takes huge
    amounts of energy.
  '412': 'It protects! Like the Lego brick in Kindergarten TD.'
  '413': 'The Titan Laser is a colossal laser.'
  '414': >-
    The Decoy is a sophisticated defensive system designed to mislead and
    confuse enemy forces. By disguising itself as a Missile Launcher, it
    deters attacks.
  '502': 'Interceptor missiles destroy incoming Interplanetary missiles.'
  '503': 'Interplanetary missiles destroy the opponent''s defenses.'
  '901': >-
    Metal is the main resource for buildings and ships. It is the cheapest
    resource, but also the one you need the most.
  '902': >-
    Crystals are the main resource used to build electronic circuits and form
    certain alloy compounds.
  '903': >-
    Deuterium is found in the deepest seas. It is the most expensive resource
    and needs the most energy as well.
  '911': 'Energy is needed to produce every resource.'
