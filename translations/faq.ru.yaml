questions:
  '1':
    '1':
      body: |-
        <p>Здесь собраны основные постройки: что строить в первую очередь и зачем нужна каждая. Сильная империя начинается с разумной очерёдности строительства.</p>
        <h3>Солнечная электростанция</h3>
        <p>Строй её первой. Без энергии рудники не добывают металл, кристалл и дейтерий. Когда электростанция достроена, панель ресурсов и страница «Сырьё» покажут, сколько у тебя энергии.</p>
        <h3>Рудник металла</h3>
        <p>Металл — один из трёх ресурсов. Почти всё, что ты строишь или исследуешь, стоит металла, так что рудник надо развивать в первую очередь. В начале игры держи его на несколько уровней выше остальных рудников.</p>
        <h3>Рудник кристалла и Синтезатор дейтерия</h3>
        <p>Кристалл идёт на постройки, корабли и исследования. Кристалла добывается меньше, чем металла, поэтому он ценнее, а в поздней игре за него часто идёт жестокая борьба. Дейтерий — топливо для флотов, из него можно получать энергию на Термоядерной электростанции, и он нужен для нескольких важных построек и исследований (в том числе для Исследовательской лаборатории).</p>
        <p>Подробнее: <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">Wiki</a>.</p>
      title: Шаг 1
    '2':
      body: |-
        <p>Чтобы развивать империю и взаимодействовать с другими игроками, нужны новые постройки. Исследования и Верфь откроют путь к собственному флоту и обороне планеты.</p>
        <h3>Верфь</h3>
        <p>Здесь строятся все корабли (и оборона). Верфь доступна рано, но для многих классов кораблей всё равно нужны дополнительные исследования. Требования к каждому кораблю и оборонительному сооружению перечислены в меню «Технологии». Чем выше уровень Верфи, тем быстрее строятся корабли.</p>
        <h3>Исследовательская лаборатория</h3>
        <p>Здесь запускаются исследования. Они открывают постройки, корабли, оборону и новые исследования, а некоторые технологии ещё и усиливают то, что у тебя уже есть. Чем выше уровень лаборатории, тем быстрее идут исследования.</p>
        <h3>Фабрика роботов</h3>
        <p>Фабрика роботов обязательна. Её уровни сокращают время строительства зданий и ускоряют производство кораблей. Когда строительство начинает затягиваться, прокачай Фабрику роботов — время снова сократится.</p>
      title: Шаг 2
    '3':
      body: |-
        <p>Здесь речь о защите планеты и первых шагах с флотом: как отправлять флоты и как вести себя с другими игроками.</p>
        <h3>Обзор галактики</h3>
        <p>Через него ищут других игроков. Ты видишь подробности о чужих планетах и можешь отправить часть флота прямо отсюда. Ещё можно написать игроку или пошпионить за планетой, если у тебя есть Шпионские зонды.</p>
        <h3>Отправка флотов</h3>
        <p>Флоты отправляются из Галактики или из меню «Флот». Сначала выбери, сколько кораблей каждого типа отправить. Затем укажи цель (координаты из Галактики) и скорость. В конце выбери задание: Атака, Оставить, Держаться, Переработать или Транспорт.</p>
        <h3>Оборона</h3>
        <p>Когда у тебя есть Верфь, можно строить и оборону. Она защищает планету и сражается вместе с флотом, который находится на планете в момент атаки. В отличие от кораблей, около 70% уничтоженных оборонительных сооружений восстанавливается после боя.</p>
      title: Шаг 3
    category: Советы для новичков
  '2':
    '1':
      body: |-
        <h3>Рейды</h3>
        <p>Рейд — это нападение на другого игрока ради его ресурсов. Основные виды:</p>
        <ul>
        <li>Фарм</li>
        <li>Атака флота</li>
        <li>Рейд на ПО</li>
        <li>Подлов</li>
        </ul>
        <h3>Фарм</h3>
        <p>Самый распространённый вид атак во вселенной. Ты шпионишь за ближайшими планетами и отправляешь небольшие флоты с достаточным грузовым отсеком и огневой мощью, чтобы пробить лёгкую оборону и остаться в плюсе: награбленные ресурсы должны перекрывать потраченный дейтерий и твои потери.</p>
        <h3>Атака флота</h3>
        <p>Высший пилотаж: охота за чужими флотами. Помимо Шпионских зондов и удачи, решают Сенсорная фаланга и точный расчёт времени. Найти достойный флот мало — его ещё нужно поймать и переработать обломки. Это часто непросто: выгодные флоты дают обломков больше, чем вмещают твои Переработчики. Тогда нужно согласовать Переработчики и, если надо, участников САБ вместе с боевым флотом.</p>
        <h3>Рейд на ПО</h3>
        <p>Самый простой и самый непопулярный способ заработать: собирать поля обломков (ПО), созданные другими игроками. Обломки достаются тому, кто их собрал, поэтому кража ПО — частая причина обид.</p>
        <h3>Подлов</h3>
        <p>Работа флитовода — строить флот и уничтожать флоты. Простаивающие корабли попадаются не всегда, поэтому сильных игроков часто ловят в момент сейва или во время их собственной атаки. Это непросто, но защита от этого есть.</p>
        <ul>
        <li><p>Луна упрощает подлов: Сенсорная фаланга показывает движения флотов на планетах в радиусе действия (не на лунах). Если нашёл флот, достойный охоты, рассчитай оставшееся время полёта — особенно время возврата после прилёта. Для расчёта достаточно уровней двигателей (Реактивный, Импульсный, Гиперпространственный) из шпионского доклада: считать можно вручную или в калькуляторе полёта. Пригодятся точные часы. Рассчитай время так, чтобы твой флот и Переработчики прилетели примерно на 3–5 секунд позже цели на её планету или луну. Переработчиков тоже нужно синхронизировать.</p></li>
        <li><p>Чтобы подловить флот, летящий с луны на поле обломков, нужно примерное время его старта. Создай видимое поле обломков в местах, где, по твоему мнению, он будет собирать (например, Шпионскими зондами). Рассчитай, сколько флот летит туда, следи за системой и обновляй страницу, пока поле не исчезнет. Запомни это время, добавь время возврата и рассчитай свой флот и Переработчиков на несколько секунд позже этого прилёта.</p>
        <p><b>Важно:</b> это работает не всегда. Частая контрмера — отправить вперёд Переработчик, который уберёт поле первым.</p></li>
        <li>Ещё один вид подлова — Держаться на планете друга, чтобы защитить его: нападающим приходится отзывать флот, потому что защитники окажутся слишком сильными. Риск быть пойманным таким способом можно снизить сейв-сканом.</li>
        <li><p>Если игрок перебазирует флот с одной планеты на другую, а затем отзывает его, флот исчезает с Сенсорной фаланги. Изучи его сейв-схему (когда он стартует и когда отзывает). Когда ждёшь отзыв, сканируй планету фалангой каждую секунду. Как только флот пропал, запомни время, добавь время возврата и прилети примерно на 4–6 секунд позже с флотом и Переработчиками.</p>
        <p>Если игрок сейвится с луны на поле обломков и отправляет Переработчиков вперёд, подловить его почти невозможно, пока не уничтожена луна. Отправь Звёзды смерти с заданием «Уничтожить». Когда луны не станет, флот вернётся на планету: сканируй её фалангой и встань на несколько секунд позже него.</p>
        <p>Все эти приёмы работают гораздо лучше, если знаешь привычки цели — например, сейв каждый вечер в 23:00 или выход в сеть в полдень. Изучи игрока, прежде чем ловить его.</p></li>
        </ul>
        <p>Подробнее в Wiki: <a href="{wiki_url}/wiki/En/Saven" target="_blank">Сейв флота</a>, <a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">Сенсорная фаланга</a>.</p>
      title: Рейды
    '2':
      body: |-
        <h3>Атака через САБ</h3>
        <p>Чтобы атаковать вместе, сначала отправь флот с заданием «Атака» на цель. После старта открой меню «Флот» и кнопкой «Союз» преврати этот флот в группу САБ. Здесь можно переименовать группу и пригласить других игроков; начавший атаку игрок приглашается автоматически. Каждый приглашённый отправляет свои корабли на те же координаты с заданием «Совместная атака».</p>
        <p>Группа всегда летит со скоростью самого медленного флота. Более быстрые флоты, присоединившиеся позже, оставшееся время не сокращают. Более медленные флоты увеличивают оставшееся время до своего времени полёта. Обычно в одной атаке САБ могут участвовать не более 5 игроков и 16 флотов (настройки вселенной могут отличаться). Присоединяющийся флот может увеличить оставшееся время полёта не более чем на 30%. Если осталось 100 минут, присоединяющийся флот может лететь не дольше 130 минут.</p>
        <p><b>Внимание:</b> если основатель САБ отзовёт флот, будут отозваны и все остальные флоты группы.</p>
        <h3>Защита через САБ</h3>
        <p>Если тебя атакуют, на помощь могут прийти члены альянса и друзья. Они отправляют флот на атакуемые координаты, выбирают время пребывания и задание «Держаться». Кроме дейтерия на полёт, при старте списываются дополнительные затраты на удержание — в зависимости от размера флота и длительности. Пока они держатся, они участвуют в каждом бою на этой планете или луне и в шпионских докладах отображаются так, будто это твои корабли. Рассчитай удержание так, чтобы прилететь незадолго до атакующего: тогда сейв-скан вряд ли их заметит. Удерживающие игроки могут в любой момент отозвать флот в меню «Флот»; иначе флот отстоит своё время и вернётся домой.</p>
        <h3>Дейтерий за 1 час удержания</h3>
        <p>Малый транспорт: 5<br>
        Большой транспорт: 5<br>
        Лёгкий истребитель: 2<br>
        Тяжёлый истребитель: 7<br>
        Крейсер: 30<br>
        Линкор: 50<br>
        Колонизатор: 100<br>
        Переработчик: 30<br>
        Шпионский зонд: 1/10<br>
        Бомбардировщик: 100<br>
        Уничтожитель: 100<br>
        Звезда смерти: 1/10</p>
      title: Совместные бои (САБ)
    '3':
      body: |-
        <p>Луна может появиться, если создано поле обломков не меньше 100 000 единиц (шанс луны 1%). Шанс ограничен 20%, каким бы большим ни было поле.</p>
        <h3>Общее</h3>
        <p>Луны можно переименовывать, как и планеты, но «(Луна)» в названии остаётся. На одну планету приходится не больше одной луны. Луна позволяет сейвить флот вне поля зрения Сенсорной фаланги, поэтому её стоит получить пораньше. На луне можно строить Фабрику роботов, Верфь, Хранилище металла, Хранилище кристалла, Ёмкость для дейтерия, Склад альянса, Лунную базу, Сенсорную фалангу и Телепорт.</p>
        <h3>Лунный выстрел</h3>
        <p>Лунный выстрел — это намеренное уничтожение кораблей ради поля обломков. Обычно для этого берут Лёгкие истребители: при 30% флота и 0% обороны в обломках 1667 Лёгких истребителей дают шанс луны 20%. Их не жалко терять, а шанс получается почти максимальным. Если сильный игрок уничтожает Лёгкие истребители слабого, обломки может собирать любой. Если слабый игрок атакует сильного кораблями, которые должны погибнуть, собирать может только слабый — иначе это пуш. На луны и попытки их создать распространяются правила о пуше.</p>
        <p>Во вселенной, где оборона тоже попадает в обломки, часто выгоднее построить оборону и разбить её за несколько волн — получится несколько попыток создать луну. Обычный выбор — 3334 Ракетных установок или 3334 Лёгких лазера.</p>
        <p>Когда луна появляется, в боевом докладе пишется, что огромные массы свободного металла и кристалла притягиваются друг к другу и образуют спутник возле планеты.</p>
        <p>Шанс луны от 1% до 19%: размер случайный. Шанс луны 20%: диаметр больше 8000 км. Луна никогда не бывает больше 8944 км.</p>
        <h3>Постройки</h3>
        <p>Хранилища на луне обычно строить не стоит: там ничего не добывается. Верфь тоже редко нужна: корабли строятся долго, а построить их можно на планете. Склад альянса — спорный выбор, к тому же он занимает ценные поля.</p>
        <p>Три постройки, доступные только на луне:</p>
        <ul>
        <li><p><b>Лунная база</b><br>Добавляет поля для строительства: по 3 за уровень, одно из которых занимает следующее улучшение Лунной базы.</p></li>
        <li><p><b>Сенсорная фаланга</b><br>Показывает движения флотов на вражеских планетах (не на лунах). С каждым уровнем радиус растёт.</p></li>
        <li><p><b>Телепорт</b><br>Мгновенно перебрасывает корабли с одной луны на другую. Ресурсы с собой взять нельзя. После прыжка телепорту нужно время на остывание (обычно один час), иначе он перегреется.</p></li>
        </ul>
        <p>Типичная очерёдность строительства на луне:<br>
        <b>Обозначения:</b><br>
        ЛБ – Лунная база<br>
        СФ – Сенсорная фаланга<br>
        ТП – Телепорт<br>
        ФР – Фабрика роботов</p>
        <p>ЛБ1 – ФР1 – ФР2 – ЛБ2 – СФ1 – ФР3 – ЛБ3 – СФ2 – ФР4 – ЛБ4 – СФ3 – ФР5 – ЛБ5 – СФ4 – ФР6 – ЛБ6 – СФ5 – СФ6 – ЛБ7 – СФ7 – СФ8 – ЛБ8 – ТП1<br>
        После этого можно и дальше качать Сенсорную фалангу, если хватает ресурсов. Ещё можно снести несколько уровней Фабрики роботов и отдать эти поля под фалангу.</p>
        <h3>Уничтожение</h3>
        <p>Луну можно уничтожить только Звёздами смерти. В меню заданий выбери «Уничтожить» вместо «Атака». Сначала должен быть уничтожен весь флот на луне; выжившие Звёзды смерти всё равно могут погибнуть при разрушении самой луны. При уничтожении луны поле обломков не образуется.</p>
        <h3>Атаки Звёздами смерти на луну</h3>
        <p>Шанс уничтожить луну: (100 − sqrt(размер луны)) × sqrt(число Звёзд смерти). Шанс потерять атакующие Звёзды смерти: sqrt(размер луны) / 2. Чем больше луна, тем рискованнее её уничтожать.</p>
        <h3>Шанс луны и размер</h3>
        <p>100 000 единиц обломков дают 1% шанса луны. Максимальный шанс — 20%. После одного из изменений у каждой луны максимальное число полей для строительства (79). Раньше оно считалось как FLOOR((диаметр / 1000)²). Самая большая возможная луна: диаметр 8944 км, 79 полей.</p>
        <p>Ещё в Wiki: <a href="{wiki_url}/wiki/En/Mond" target="_blank">Луны</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">Wiki</a>.</p>
      title: Луны
    '4':
      body: |-
        <h3>Как основать альянс?</h3>
        <p>Открой «Альянс» в меню слева, затем «Основать собственный альянс». Введи тег альянса (короткую аббревиатуру) и его название. Пример: альянс «Лучшие из лучших» может взять тег «ЛИЛ».</p>
        <p>Разрешены только буквы, цифры и пробелы. После ввода тега и названия нажми «Создать». Если такое название или тег уже заняты, появится сообщение об ошибке — выбери другие. При успехе ты увидишь подтверждение; «Продолжить» откроет пока ещё пустое меню альянса, в которое всегда можно попасть через пункт «Альянс» в меню слева. Вверху видны тег и название.</p>
        <p>Ниже ты найдёшь:<br>
        Участники: все участники с очками, координатами главной планеты, датой вступления и статусом онлайн. Клик по заголовку столбца меняет сортировку.<br>
        Твой ранг: название твоего ранга и ссылка на управление альянсом.<br>
        Сообщения альянса: отправка сообщения всему альянсу или выбранным рангам.</p>
        <h3>Управление альянсом</h3>
        <p>В «Рангах» настраиваются права для каждого ранга, например распускать альянс или рассылать общие сообщения. В «Участниках» можно исключать игроков, назначать ранги и смотреть, сколько дней они не были в сети. Здесь же меняются тег и название альянса.</p>
        <p>«Тексты» — редактирование текстов альянса. Внешний текст виден всем игрокам, внутренний — только членам альянса. Текст заявки — шаблон для тех, кто подаёт заявку.</p>
        <p>В «Настройках» можно указать изображение-баннер и форум альянса, выбрать, открыт ли приём заявок, и задать название ранга основателя. Если оставить его пустым, ранг будет называться «Основатель».</p>
        <p>Альянс можно распустить или передать другому участнику — он станет основателем.</p>
      title: Альянсы
