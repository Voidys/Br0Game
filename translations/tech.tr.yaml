longDescription:
  '1': Metal madenleri, yeni kurulan ve köklü her imparatorluğun üzerine inşa edildiği cevheri çıkarır.
  '2': Kristal, elektronik devrelerin ve bazı alaşımların anahtar malzemesidir.
  '3': Deuterium uzay gemilerine yakıt olur ve derin denizden çıkarılır. Nadir bir madde olduğu için görece pahalıdır.
  '4': Solar enerji santralleri güneş ışığını enerjiye çevirir. Her madenin çalışması için enerji gerekir.
  '6': Varsayılan olarak her seviye araştırma süresini %8 kısaltır.
  '12': Füzyon Enerji Santrali, deuterium kaynaştırarak enerji üretir. Solar Enerji Santrali'nden daha fazla enerji verir ama inşası daha pahalıdır. Üretim, Enerji Tekniği ve santralin kendi seviyesiyle artar. Enerji üretim formülü:<br> Üretilen enerji = 30 x Füzyon Enerji Santrali seviyesi x (1,05 + (0,01 * Enerji Tekniği seviyesi))^Füzyon Enerji Santrali seviyesi
  '14': Robot fabrikaları, binalarını inşa etmene yardım eden inşaat robotları sağlar. Her seviye bina yükseltmelerini hızlandırır.
  '15': Robotiğin zirvesi. Her seviye bina, gemi ve savunma inşa süresini yarıya indirir.
  '21': Tüm gemiler ve savunmalar gezegen tersanesinde inşa edilir.
  '22': Fazla Metal için depo sağlar.
  '23': Fazla Kristal için depo sağlar.
  '24': Fazla Deuterium için depo sağlar.
  '31': Yeni teknolojileri araştırmak için bir araştırma laboratuvarına ihtiyacın var. Laboratuvar seviyesi ne kadar hızlı araştırma yapacağını ve hangi teknolojilerin kilidini açabileceğini belirler. Araştırma, başlattığın gezegenin laboratuvarında yürür ve sonucu tüm gezegenlerin için geçerli olur. Bir araştırma sürerken hiçbir araştırma laboratuvarı yükseltilemez.
  '33': 'Terraformer gezegenin kullanılabilir alanını genişletir. Her seviye sana 5 ek alan, her çift seviyede ayrıca bir alan daha verir. Terraformer''ın her seviyesi kendisi de bir alan kaplar.<br>İnşası enerji ister ama enerji harcanıp bitmez: gezegenin yalnızca yeterince enerji üretmesi gerekir (1. seviye için 1.000, her seviyede iki katına çıkar); madenlerin zaten bu enerjiyi kullanıyor olması sorun değildir. İnşa edildikten sonra Terraformer asla yıkılamaz.'
  '34': 'İttifak Deposu şu an bu oyunda hiçbir işe yaramıyor: dost filolar o olmadan da gezegeninde bekleyebilir ve yakıt ikmali de yok.'
  '35': Onarım rıhtımı, savaşta yok edilip geride hurda alanı bırakan gemileri onarabilir. Bir onarım en fazla 12 saat sürer ve hurda alanı oluştuktan en az 30 dakika önce bitemez.<br>Hurda alanı oluştuktan sonra onarımı başlatmak için 3 günün var. Onarım bitince gemileri kendin yeniden hizmete almalısın. Almazsan 3 gün sonra otomatik olarak hizmete dönerler.
  '41': Ayda atmosfer yoktur ve yeni bir ayda yalnızca tek bir binaya yer vardır, o yüzden Ay Merkez İstasyonu ile başla. Her seviye 3 ek alan verir ve kendisi bir alan kaplar. İnşa edildikten sonra Ay Merkez İstasyonu asla yıkılamaz.
  '42': 'Sensör dizisi filo hareketlerini izlemeni sağlar. Seviye yükseldikçe Radar İstasyonu menzili artar: varsayılan olarak (Radar İstasyonu seviyesi)^2 - 1 sistem, yani 1. seviye yalnızca ayın kendi sistemini kapsar. Bir tarama 5.000 deuterium harcar ve bu deuterium ayda bulunmalıdır. Taramak için aydan galaksi görünümünü aç ve menzildeki bir gezegene tıkla. Aylar atmosferi olmadığı için Radar İstasyonu ile taranamaz.<br><br>Radar İstasyonu, taranan gezegenden kalkan ya da o gezegene uçan filoları gösterir: varış zamanlarını, bir beklemenin ne zaman bittiğini ve sahibinin filolarının ne zaman eve döndüğünü. Konuşlandırmalar ve roketler hiçbir zaman gösterilmez; gezegene giden geri dönüşüm ve ticaret uçuşları da gösterilmez.'
  '43': 'Sıçrama geçitleri, büyük filoları evrenin bir ucundan diğerine hiç vakit kaybetmeden gönderen devasa vericilerdir. Deuterium harcamazlar ama bu yolla kaynak aktaramazsın. İki geçit de hazır olmalıdır: sıçramadan sonra her geçidin bir bekleme süresi vardır; varsayılan olarak 1. seviyede 60 dakikadır ve her seviyeyle kısalır, 15. seviyeden itibaren 10 dakikaya kadar iner.'
  '44': Roket silosu roketlerini depolar. Varsayılan olarak her seviye 10 yuva ekler. Bir Yakalayıcı Roket 1 yuva, bir Gezegenler Arası Roket 2 yuva kaplar.
  '106': 'Bu teknoloji diğer gezegenler ve aylar hakkında bilgi toplamanı sağlar. Sonda gönderdiğinde Casusluk Tekniğin hedefinkiyle karşılaştırılır: seviyen ne kadar yüksekse raporda o kadar çok bilgi olur ve sondalarının fark edilme şansı o kadar düşer. Daha fazla sonda daha çok ayrıntı gösterir ama fark edilme riskini artırır. Casusluk Tekniğinin belirli seviyelerinde Genel Bakış ekranında yabancı filolar hakkında da daha fazla şey öğrenirsin:<br><br><li>0-1. seviyede yalnızca bir filonun gezegenine yaklaştığını görürsün</li><li>2-3. seviyede kaç geminin yaklaştığını görürsün</li><li>4-7. seviyede filoda hangi gemi türlerinin olduğunu görürsün</li><li>8. seviye ve üzerinde filodaki her türden kaç gemi olduğunu görürsün</li>'
  '108': Daha iyi bilgisayarlar daha fazla filoyu yönetmeni sağlar. Bilgisayar Tekniğinin her seviyesi en fazla filo sayını bir artırır.
  '109': Silah Tekniği silah sistemlerini daha etkili yapar. Her seviye tüm birimlerin silah gücünü temel değerin %10'u kadar artırır.
  '110': Kalkan Tekniği gemilerin ve savunma yapılarının kalkanlarını daha etkili yapar. Her seviye kalkan gücünü temel değerin %10'u kadar artırır.
  '111': Özel alaşımlar gemilerin ve savunma yapılarının zırhını geliştirir. Her seviye zırh etkisini %10 artırır.
  '113': Farklı enerji türlerinde ustalaşmak birçok yeni teknolojinin anahtarıdır. Enerji Tekniğinin her seviyesi ayrıca Füzyon Enerji Santrali'nin enerji üretimini artırır.
  '114': 4. ve 5. boyutları birleştirerek daha ekonomik ve verimli yeni bir itici türü araştırabilirsin.
  '115': 'Bu iticiyi geliştirmek bazı gemileri hızlandırır, ama her seviye temel hızın yalnızca %10''unu ekler. Etkilenen gemiler: Küçük Nakliye, Büyük Nakliye, Hafif Avcı, Geri Dönüşümcü ve Casus Sondası (Küçük Nakliye ve Geri Dönüşümcü daha sonra daha iyi iticilere geçer).'
  '117': 'İmpuls iticisi tepki ilkesiyle çalışır. Geliştirmek bazı gemileri hızlandırır, ama her seviye temel hızın yalnızca %20''sini ekler: Bombardıman Gemisi, Kruvazör, Ağır Avcı ve Koloni Gemisi, ayrıca bu iticiye geçtiklerinde Küçük Nakliye ve Geri Dönüşümcü. Gezegenler Arası Roketler de her seviyeyle daha uzağa uçar.'
  '118': 'Hiperuzay iticisi bir geminin çevresindeki uzayı büker. Geliştirmek bazı gemileri hızlandırır, ama her seviye temel hızın yalnızca %30''unu ekler: Fırkateyn, Komuta Gemisi, Muhrip, Ölüm Yıldızı, Kara Savaşçı, Ultra Nakliye, Avatar ve Ultra Dönüşümcü, ayrıca bu iticiye geçtiklerinde Bombardıman Gemisi ve Geri Dönüşümcü. Hiperuzay Tekniği (seviye 3) ve Araştırma Laboratuvarı (seviye 7) gerektirir.'
  '120': Odaklanmış ışık, çarptığı her şeye zarar veren bir ışın üretir. Araştırma Laboratuvarı (seviye 1) ve Enerji Tekniği (seviye 2) gerektirir.
  '121': Hızlandırılmış iyonlardan oluşan ölümcül bir ışın; çarptığında muazzam hasar verir.
  '122': 'İyon teknolojisinin bir adım ötesi: aşırı ısıtılmış iyonlardan oluşan yüksek enerjili plazmayı hızlandırır. Çarptığında yıkıcı etki yapar.'
  '123': Farklı gezegenlerdeki araştırmacılar bu ağ üzerinden haberleşir. Her seviye, araştırmayı başlattığın laboratuvara bir laboratuvar daha katılmasını sağlar. En yüksek seviyeli laboratuvarlar seçilir ve ağa bağlı bir laboratuvarın o araştırmayı tek başına yürütebilecek kadar gelişmiş olması gerekir. Araştırma süresi hesaplanırken seviyeleri toplanır.
  '124': 'Astrofizik, kolonileşmenin ve derin uzaya keşiflerin kilidini açar. Aşağıdaki koloni sınırı, bekleme süresi ve konumlar varsayılan ayarlardır; evreninde farklı olabilir.<br><br> <li>Koloni sınırı</li> Seviye 1-2 = 2 gezegen<br> Seviye 3-4 = 3 gezegen<br> Seviye 5-6 = 4 gezegen<br> Seviye 7-8 = 5 gezegen<br> Seviye 9-10 = 6 gezegen<br> Seviye 11-12 = 7 gezegen<br> Seviye 13-14 = 8 gezegen<br> Seviye 15-16 = 9 gezegen<br> Seviye 17-18 = 10 gezegen<br> Seviye 19-20 = 11 gezegen<br> Seviye 21+ = 12 gezegen<br><br> <li>Keşif yuvaları</li> Seviye 1-3 = 1 keşif<br> Seviye 4-8 = 2 keşif<br> Seviye 9-15 = 3 keşif<br> Seviye 16-24 = 4 keşif<br>(sonraki her kare seviyede bir tane daha: 25, 36, ...)<br><br> <li>Keşif bekleme süresi</li> Seviye = en fazla bekleme süresi (saat)<br><br> <li>Kolonileştirilebilir konumlar</li> Seviye 1-3 = 4-12<br> Seviye 4-5 = 3-13<br> Seviye 6-7 = 2-14<br> Seviye 8+ = 1-15'
  '131': Metal üretimini seviye başına %2 artırır.
  '132': Kristal üretimini seviye başına %2 artırır.
  '133': Deuterium üretimini seviye başına %2 artırır.
  '134': Uçuş maliyetlerini seviye başına %2 azaltır.
  '199': Yoğunlaştırılmış graviton parçacıkları ateşlemek, gemileri ve hatta ayları yok edebilen yapay bir yerçekimi alanı yaratır. Araştırma Laboratuvarı (seviye 12) gerektirir.
  '202': Küçük Nakliye, kaynakları diğer gezegenlere hızla taşıyan çevik bir gemidir.<br>İmpuls Motorun 5. seviyeye ulaşana kadar yanmalı iticiyle uçar. Ondan sonra temel hızını ikiye katlayan impuls iticisine geçer.
  '203': Bu kargo gemisi Küçük Nakliye'den çok daha fazla taşır ve geliştirilmiş iticisi sayesinde genelde daha hızlıdır.
  '204': Her imparatorun inşa ettiği ilk savaş gemisi. Hafif Avcı çevik ama tek başına savunmasızdır; kalabalık olduğunda her imparatorluk için gerçek bir tehdit olur. Hafif Avcılar, Küçük ve Büyük Nakliyelere zayıf savunmalı düşman gezegenlere kadar ilk eşlik eden gemilerdir.
  '205': Bu avcı, Hafif Avcı'dan daha iyi zırhlı ve daha sert vurur.
  '206': Kruvazörlerin zırhı Ağır Avcılarınkinin neredeyse üç katı, ateş gücü ise iki katından fazladır. Üstelik çok hızlıdırlar.
  '207': Komuta Gemileri bir filonun belkemiğidir. Ağır toplar, yüksek hız ve geniş kargo bölmeleri onları ciddiye alınması gereken rakipler yapar.
  '208': 'Bu iyi zırhlı gemi, yeni kurulan bir imparatorluğun büyümesi için gereken yeni gezegenleri fetheder. Yeni kolonide gemi parçalarına ayrılır ve geri dönüştürülebilir tüm malzeme yeni dünyanın gelişimine gider. Kaç gezegeni kolonileştirebileceğin doğrudan Astrofizik araştırmana bağlıdır: ilk seviye ve sonrasındaki her ikinci seviye bir koloni daha açar (varsayılan olarak).'
  '209': Geri Dönüşümcü enkaz alanlarından hammadde toplar. Kargo kapasitesi 20.000'dir. Yanmalı iticiyle başlar, İmpuls Motorun 17. seviyeye ulaşınca impuls iticisine, Hiper İtici 15. seviyeye ulaşınca hiperuzay iticisine geçer.
  '210': Casus Sondaları, filolar ve gezegenler hakkında uzun mesafelerden veri getiren küçük, çevik dronlardır.
  '211': Bombardıman Gemisi, bir gezegenin savunmasını yok etmek için özel olarak yapıldı.<br>İmpuls iticisiyle uçar ve Hiper İtici 8. seviyeye ulaşınca hiperuzay iticisine geçer.
  '212': Solar uydular, yüksek ve sabit bir yörüngedeki basit güneş hücresi platformlarıdır. Güneş ışığını toplar ve lazerle yer istasyonuna iletirler.
  '213': 'Muhrip, savaş gemilerinin kralıdır. Hafif Lazerlere karşı seri atışı vardır: her isabetten sonra 10 durumda 9''unda bir atış daha yapar.'
  '214': Ölüm Yıldızı'nın yıkıcı gücünün eşi benzeri yoktur ve ayları yok edebilir.
  '215': Fırkateyn, düşman filolarını önlemekte uzmanlaşmıştır.
  '216': 'Sevilen Ölüm Yıldızı''nın halefi: çok daha hızlı ve sağlam, kargo bölmesi devasa; ama biraz daha az sert vurur.'
  '217': Büyük Nakliye'nin çok daha fazla taşıma kapasitesine sahip gelişmiş hali. Hiperuzay iticisiyle çalışır; bu yüzden başta Büyük Nakliye'den yavaştır ama Hiper İtici seviyen yükseldikçe onu geride bırakır.
  '218': Olabilecek en kötü senaryo; yine de çok yavaş.
  '219': Devasa kargo alanı ve yeni motorlar sayesinde daha hızlı uçar ve enkaz alanlarından daha çok toplar.
  '220': 'Çelik Kolos uzayın gerçek bir kalesidir; yılmaz bariyerlerle ve devasa zırhla korunur. En şiddetli saldırılar bile amansızca ilerlerken ondan sekip gider. Ama bu savunma üstünlüğünün bir bedeli var: silahları anmaya değmez ve ağır motorları onu yavaş bir dev yapar. Şimşek hücumlarına ya da çevik manevralara değil, saf dayanıklılığa güvenir. Onu durdurmak isteyen büyük bir dayanıklılığa – ya da ezici bir ateş gücüne – sahip olmalı.'
  '221': 'Fırtınakılıcı üst düzey bir avcıdır: inanılmaz hızlı ve acımasızca silahlı. Rakipler vurmadan önce onu pek görmez bile. Savunma ikinci planda – kaçabildiği şeye dayanması gerekmez. Tek odağı, direnç göstermeden yok edilen nakliye ve geri dönüşümcü filolarıdır. Kavurucu hızıyla istediği zaman vurabilir ve takviyeler gelmeden kaybolabilir. Fırtınakılıcı''nın hedef aldığı birinin kaçma şansı çok azdır.'
  '222': Ağır Kruvazör, standart kruvazörün güçlendirilmiş halidir. Gelişmiş kalkanları ve güçlü silahlarıyla hantal düşmanlara karşı yerini korur. Çelik Kolos, Muhrip ve Bombardıman Gemileriyle birlikte kullanıldığında ateş gücü asıl parlar. Ancak gücüne rağmen yavaş ve daha az manevra yeteneklidir.
  '223': Kalkan Dronu, filo savunmasında yeni bir yaklaşımı temsil eder ve öncelikle mürettebat korumasına odaklanır. Yenilikçi ama ağır kalkan teknolojileri uçuş hızını ve manevra kabiliyetini belirgin biçimde düşürdü. Zayıf hız ve çevikliğine rağmen savunmada çok etkilidir. Eski yapı, neredeyse aşılmaz bir savunma sağlamak için sınırlarına kadar zorlandı.
  '224': Doğaçlama Saldırı Taşıyıcısı, dikkatsiz ve hazırlıksız komşuları rahatsız etmek için özel olarak yapılmış, asgari silahlı, denenmemiş bir taşıma aracıdır. Bu derme çatma araç uzun süreli kullanım için değil, anında tepki çeken hızlı, dürtüsel saldırılar için tasarlandı. Devreye girer girmez bir komşu kavgası neredeyse garantidir. Sınırlı donanımı ve öngörülemez doğasıyla çatışmayı hızla tırmandırmak için tehlikeli bir araç olur.
  '225': Fırtına Taşıyıcısı, savaş gücü, hız ve taşıma kapasitesi arasında kusursuz dengeyi sunan gerçek bir teknoloji harikasıdır. Birlikleri ve kaynakları hızla konuşlandırırken savaş alanına etkileyici ateş gücü taşıması, onu her güçlü filonun vazgeçilmez parçası yaptı. İster hızlı saldırı birimleri için ister uzun vadeli operasyonları desteklemek için olsun, Fırtına Taşıyıcısı etkili savaşın anahtarıdır ve her filoda mutlaka olmalıdır.
  '226': Kolosal Savaş Taşıyıcısı mühendisliğin zirvesidir. Biraz hantal tasarımı ve bunun sonucu yavaş uçuş hızına rağmen, hiçbir filonun görmediği en ağır zırhlı savaş taşıyıcısıdır. Ezici ateş gücü onu savaş alanında durdurulamaz bir güç yapar. Bu dev, düşman hatlarını zahmetsizce yarıp mürettebatına azami koruma sağlar. Güç ve dayanıklılığı temsil eder; ağır silahlı her filo için vazgeçilmez bir varlıktır.
  '227': Optimize Geri Dönüşümcü, standart geri dönüşümcünün son teknoloji bir yükseltmesidir. Güçlü bir impuls motoruyla enkaz alanlarına daha hızlı ve daha ucuza ulaşır; bu da onu her gelişmiş filo için vazgeçilmez kılar. Optimize tasarımı inşa maliyetlerini düşürürken kaynak geri kazanım verimini artırır. Oyunun ortasından itibaren erişilebilir olup büyüyen her imparatorluğa stratejik avantaj sağlar.
  '228': 'Omega Geri Dönüşümcü geri dönüşüm teknolojisinin zirvesidir – ama yüksek bir bedelle. Güçlü hiperuzay iticisi, enkaz alanlarına rekor sürede ulaşmasını ve kaynakları diğer tüm gemilerden daha hızlı kurtarmasını sağlar. Ancak bu hız verimlilik pahasınadır: inşa ve yakıt maliyetleri çok yüksektir; bu yüzden yalnızca oyunun geç evresindeki zengin komutanlar için uygun bir seçenektir. Hızı maliyetin önüne koyanlar için nihai Geri Dönüşümcü budur.'
  '401': Roket Atıcı basit ama uygun maliyetli bir savunmadır. Bir savaştan sonra yok edilen savunmaların ortalama yaklaşık %70'i yeniden inşa edilir.
  '402': Hafif lazerler basit, yer tabanlı silahlardır. Özel nişan sistemleri düşmanı takip eder ve yüksek yoğunluklu bir lazer hedefin gövdesini keser. Bir savaştan sonra yok edilen savunmaların ortalama yaklaşık %70'i yeniden inşa edilir.
  '403': Ağır Lazer, Hafif Lazer'in pratik, geliştirilmiş halidir. Bir savaştan sonra yok edilen savunmaların ortalama yaklaşık %70'i yeniden inşa edilir.
  '404': Gauss Topu yüksek yoğunluklu metal mermileri son derece yüksek hızda ateşler. Bir savaştan sonra yok edilen savunmaların ortalama yaklaşık %70'i yeniden inşa edilir.
  '405': İyon topu iyon ışınları (pozitif ya da negatif yüklü parçacıklar) ateşler. Bir savaştan sonra yok edilen savunmaların ortalama yaklaşık %70'i yeniden inşa edilir.
  '406': Plazma Atıcı, plazma atımları (toroidler) ateşleyen bir elektromanyetik hızlandırıcıyı büyük bir nükleer reaktör yakıt hücresiyle besler. Bir savaştan sonra yok edilen savunmaların ortalama yaklaşık %70'i yeniden inşa edilir.
  '407': Küçük Kalkan Kubbesi tüm gezegeni muazzam miktarda enerjiyi emen bir alanla sarar. Gezegen başına yalnızca bir tane inşa edilebilir.
  '408': Büyük Kalkan Kubbesi, saldırılara dayanmak için belirgin biçimde daha fazla enerji isteyen daha gelişmiş bir kubbedir. Gezegen başına yalnızca bir tane inşa edilebilir.
  '409': Kalkan kubbesi teknolojisinin evrimi. Çok daha fazla enerji kullanır ama diğer tüm kalkanlardan daha fazla saldırıya dayanır. Gezegen başına yalnızca bir tane inşa edilebilir.
  '410': Yıllarca süren yerçekimi araştırmasının ardından bilim insanları, küçük ve yoğun bir graviton alanı üretip düşmana ateşleyen bir graviton topu geliştirdi.
  '411': Kendi gücü olmayan, yerçekimiyle gezegenin çevresinde kararlı bir yörüngede tutulan hareketsiz bir savunma platformu. Bu süreci başlatmak muazzam enerji ister. Gezegen başına yalnızca bir tane inşa edilebilir.
  '412': Bunker, en güçlü saldırılara bile dayanacak şekilde tasarlanmış, ağır tahkim edilmiş bir yapıdır. Gezegen sakinlerine ve kritik altyapıya eşsiz koruma sağlar ve gezegen savunmasının temel taşıdır.
  '413': Titan Lazer, eşi benzeri olmayan yıkıcı güce sahip devasa bir silahtır.
  '414': Yem, düşman güçlerini yanıltmak ve şaşırtmak için tasarlanmış sofistike bir savunma sistemidir. Roket Atıcı gibi görünerek saldırıları caydırır.
  '502': Yakalayıcı roketler gelen Gezegenler Arası Roketleri yok eder. Her Gezegenler Arası Roket için bir Yakalayıcı Roket gerekir.
  '503': Gezegenler Arası Roketler, Yakalayıcı Roketler onları düşürmedikçe rakibin savunmasını yok eder. Bu şekilde yok edilen savunmalar yeniden inşa edilmez. Varsayılan olarak menzilleri (güneş sistemi cinsinden) İmpuls Motorunun seviyesine bağlıdır:<br>Menzil = (5 x İmpuls Motoru seviyesi) - 1
  '901': Metal, binalar ve gemiler için ana kaynaktır. En ucuz kaynaktır ama en çok ihtiyaç duyulan da odur ve Kristal gibi üretimi en az enerji ister. Madenler büyüdükçe toprağa daha derin iner.
  '902': Kristal, elektronik devrelerin ve bazı alaşımların ana kaynağıdır. Ham madde hemen devreye dönüştürüldüğü yeraltı madenlerinde üretilir.
  '903': Deuterium en derin denizlerde bulunur ve evrendeki en nadir kaynaklardan biridir. Onu almak için deniz tabanına inmen gerekir; bu da onu en pahalı kaynak yapar.
  '911': Her kaynağı üretmek için enerji gerekir.
  "229": Xer'in egemenliğini kırmak için geliştirilen Engerek; Hafif Avcılara, Ağır Avcılara ve Kruvazörlere karşı nihai silahtır. Seri atış topları ve gelişmiş teknolojisiyle evrendeki güç dengesini değiştirir.
  "230": Hızlı. Kesin. Dokunulmaz. Önleyici adil dövüşler için yapılmadı – hızlı ve sert vurup göz açıp kapayıncaya kadar ezici bir üstünlük yaratmak için tasarlandı.
  "231": Behemot, onlarca yıllık graviton araştırmasının acımasız bir savaş platformuna dönüşmüş halidir. Ölüm Yıldızları'nın aksine gezegen yıkımı için değil, azami savaş alanı verimliliği için tasarlandı. Ay yok etmek için gereken enerji yoğun sistemlerden vazgeçilerek tasarımı belirgin biçimde hafifletildi; bu da daha güçlü motorlara, daha fazla çevikliğe ve artan ateş gücüne imkân verdi. Kompakt graviton topu onu hareketli bir yıkım makinesi yapar ve devasa filoları bile tek başına yok edebilir.
  "232": 'Boşluk Titanı modern graviton teknolojisinin zirvesidir. Tasarımının her yönü tek bir amaca hizmet eder: düşman aylarının hızla yok edilmesi. Kütleyi azaltmak ve devasa kristal jeneratörlerine yer açmak için geleneksel silah kuleleri bilerek çıkarıldı. Bu jeneratörler, bilinen galaksilerde yapılmış en gelişmiş hızlandırma bobinlerini besler ve gemiye eşsiz bir hareketlilik kazandırır. Muazzam kristal ihtiyacı her Boşluk Titanı''nı anıtsal bir endüstriyel başarı – ve sınırsız yıkım gücünün simgesi – yapar.'
secureResources: Depo binasının her seviyesi, o kaynağın günlük üretiminin %1'ini saldırılarda yağmalanmaktan korur; en fazla %10'a kadar.
shortDescription:
  '1': Metal madenleri, yeni kurulan ve köklü her imparatorluğun üzerine inşa edildiği cevheri çıkarır.
  '2': Kristal, elektronik devrelerin ve bazı alaşımların anahtar malzemesidir.
  '3': Deuterium uzay gemilerine yakıt olur ve derin denizden çıkarılır. Nadir bir madde olduğu için görece pahalıdır.
  '4': Solar enerji santralleri güneş ışığını enerjiye çevirir. Her madenin çalışması için enerji gerekir.
  '6': Varsayılan olarak her seviye araştırma süresini %8 kısaltır.
  '12': Füzyon Enerji Santrali, deuterium yakıtını kaynaştırarak enerji üretir.
  '14': Robot fabrikaları, binalarını inşa etmene yardım eden inşaat robotları sağlar. Her seviye bina yükseltmelerini hızlandırır.
  '15': Robotiğin zirvesi. Her seviye bina, gemi ve savunma inşa süresini yarıya indirir.
  '21': Tüm gemiler ve savunmalar gezegen tersanesinde inşa edilir.
  '22': Fazla Metal için depo sağlar.
  '23': Fazla Kristal için depo sağlar.
  '24': Fazla Deuterium için depo sağlar.
  '31': Yeni teknolojileri araştırmak için bir araştırma laboratuvarına ihtiyacın var.
  '33': 'Terraformer gezegenin kullanılabilir alanını genişletir: seviye başına 5 ek alan, her çift seviyede bir alan daha. Her seviye kendisi de bir alan kaplar.'
  '34': İttifak Deposu şu an bu oyunda hiçbir işe yaramıyor.
  '35': Onarım rıhtımı, hurda alanındaki gemileri geri kazandırır.
  '41': Ayda atmosfer yok ve yeni bir ayda yalnızca tek bir binaya yer var, o yüzden Ay Merkez İstasyonu ile başla.
  '42': Sensör dizisi filo hareketlerini izlemeni sağlar. Seviye yükseldikçe Radar İstasyonu menzili artar.
  '43': Sıçrama geçitleri, büyük filoları evrenin bir ucundan diğerine hiç vakit kaybetmeden gönderen devasa vericilerdir.
  '44': Roket silosu roketlerini depolar.
  '106': Bu teknoloji diğer gezegenler ve aylar hakkında bilgi toplamanı sağlar.
  '108': Daha iyi bilgisayarlar daha fazla filoyu yönetmeni sağlar. Bilgisayar Tekniğinin her seviyesi en fazla filo sayını bir artırır.
  '109': Silah Tekniği silah sistemlerini daha etkili yapar. Her seviye tüm birimlerin silah gücünü temel değerin %10'u kadar artırır.
  '110': Kalkan Tekniği gemilerin ve savunma yapılarının kalkanlarını daha etkili yapar. Her seviye kalkan gücünü temel değerin %10'u kadar artırır.
  '111': Özel alaşımlar gemilerin ve savunma yapılarının zırhını geliştirir. Her seviye zırh etkisini %10 artırır.
  '113': Farklı enerji türlerinde ustalaşmak birçok yeni teknolojinin anahtarıdır.
  '114': 4. ve 5. boyutları birleştirerek daha ekonomik ve verimli yeni bir itici türü araştırabilirsin.
  '115': Bu iticiyi geliştirmek bazı gemileri hızlandırır, ama her seviye temel hızın yalnızca %10'unu ekler.
  '117': İmpuls iticisi tepki ilkesiyle çalışır. Geliştirmek bazı gemileri hızlandırır, ama her seviye temel hızın yalnızca %20'sini ekler.
  '118': Hiperuzay iticisi bir geminin çevresindeki uzayı büker. Geliştirmek bazı gemileri hızlandırır, ama her seviye temel hızın yalnızca %30'unu ekler.
  '120': Odaklanmış ışık, çarptığı her şeye zarar veren bir ışın üretir.
  '121': Hızlandırılmış iyonlardan oluşan ölümcül bir ışın; çarptığında muazzam hasar verir.
  '122': 'İyon teknolojisinin bir adım ötesi: aşırı ısıtılmış iyonlardan oluşan yüksek enerjili plazmayı hızlandırır. Çarptığında yıkıcı etki yapar.'
  '123': Farklı gezegenlerdeki araştırmacılar bu ağ üzerinden haberleşir.
  '124': Kolonileşmenin ve derin uzay keşiflerinin kilidini açar. Tek seviyelerde ek gezegenler, kare seviyelerde ek keşif yuvaları, daha uzun keşif beklemeleri ve bir sistemde daha fazla gezegen konumu.
  '131': Metal üretimini seviye başına %2 artırır.
  '132': Kristal üretimini seviye başına %2 artırır.
  '133': Deuterium üretimini seviye başına %2 artırır.
  '134': Uçuş maliyetlerini seviye başına %2 azaltır.
  '199': Yoğunlaştırılmış graviton parçacıkları ateşlemek, gemileri ve hatta ayları yok edebilen yapay bir yerçekimi alanı yaratır.
  '202': Küçük Nakliye, kaynakları diğer gezegenlere hızla taşıyan çevik bir gemidir.
  '203': Bu kargo gemisi Küçük Nakliye'den çok daha fazla taşır ve geliştirilmiş iticisi sayesinde genelde daha hızlıdır.
  '204': Her imparatorun inşa ettiği ilk savaş gemisi. Hafif Avcı çevik ama tek başına savunmasızdır; kalabalık olduğunda her imparatorluk için gerçek bir tehdit olur. Hafif Avcılar, Küçük ve Büyük Nakliyelere zayıf savunmalı düşman gezegenlere kadar ilk eşlik eden gemilerdir.
  '205': Bu avcı, Hafif Avcı'dan daha iyi zırhlı ve daha sert vurur.
  '206': Kruvazörlerin zırhı Ağır Avcılarınkinin neredeyse üç katı, ateş gücü ise iki katından fazladır. Üstelik çok hızlıdırlar.
  '207': Komuta Gemileri bir filonun belkemiğidir. Ağır toplar, yüksek hız ve geniş kargo bölmeleri onları ciddiye alınması gereken rakipler yapar.
  '208': Boş gezegenler bu gemiyle kolonileştirilebilir.
  '209': Geri Dönüşümcü, enkaz alanlarından hammadde toplar.
  '210': Casus Sondaları, filolar ve gezegenler hakkında uzun mesafelerden veri getiren küçük, çevik dronlardır.
  '211': Bombardıman Gemisi, bir gezegenin savunmasını yok etmek için özel olarak yapıldı.
  '212': Solar uydular, yüksek ve sabit bir yörüngedeki basit güneş hücresi platformlarıdır. Güneş ışığını toplar ve lazerle yer istasyonuna iletirler.
  '213': Muhrip, savaş gemilerinin kralıdır.
  '214': Ölüm Yıldızı'nın yıkıcı gücünün eşi benzeri yoktur ve ayları yok edebilir.
  '215': Fırkateyn, düşman filolarını önlemekte uzmanlaşmıştır.
  '216': 'Sevilen Ölüm Yıldızı''nın halefi: çok daha hızlı ve sağlam, kargo bölmesi devasa; ama biraz daha az sert vurur.'
  '217': Büyük Nakliye'nin çok daha fazla taşıma kapasitesine sahip gelişmiş hali. Hiperuzay iticisiyle çalışır; bu yüzden başta Büyük Nakliye'den yavaştır ama Hiper İtici seviyen yükseldikçe onu geride bırakır.
  '218': Olabilecek en kötü senaryo; yine de çok yavaş.
  '219': Devasa kargo alanı ve yeni motorlar sayesinde daha hızlı uçar ve enkaz alanlarından daha çok toplar.
  '220': Çelik Kolos, devasa kalkanları ve kalın zırhıyla her saldırıya dayanır; ama silahları ve motorları arzulanan çok şey bırakır.
  '221': Fırtınakılıcı, dişinden tırnağına silahlı, yıldırım hızında bir avcıdır. Savunma mı? Gereksiz – avı savunmasız nakliyeler ve geri dönüşümcülerdir.
  '222': Güçlendirilmiş kalkanlara ve saldırı gücüne sahip, yavaş ama ağır silahlı bir kruvazör.
  '223': 'Hafif Avcı''nın yeniden tasarımı: mürettebat güvenliğini önceler, bedeli kötü uçuş özellikleridir.'
  '224': Çok az silahı olan, denenmemiş bir taşıma aracı; dikkatsiz komşuları rahatsız edip anında çatışma çıkarmak için tasarlandı.
  '225': Savaş gücünü, hızı ve taşıma kapasitesini birleştiren, her güçlü filo için vazgeçilmez bir gemi.
  '226': Heybetli, biraz hantal tasarımlı, ezici ateş gücüyle en sert rakipleri bile yenebilen ağır zırhlı bir savaş taşıyıcısı.
  '227': Klasik Geri Dönüşümcü'nün impuls motorlu geliştirilmiş hali; daha düşük maliyetle daha verimli kurtarma görevleri sağlar.
  '228': Hiperuzay iticili, son derece hızlı ama verimsiz bir Geri Dönüşümcü yükseltmesi.
  '231': Daha küçük, daha hızlı bir Ölüm Yıldızı; ayları yok edemez. Behemot filolara karşı ölümcüldür.
  '401': Roket Atıcı basit ama uygun maliyetli bir savunmadır.
  '402': Hafif lazerler basit, yer tabanlı savunma silahlarıdır. Özel nişan sistemleri düşman gemilerini takip eder ve yüksek yoğunluklu bir lazer hedefin gövdesini keser.
  '403': Ağır Lazer, Hafif Lazer'in geliştirilmiş halidir.
  '404': Gauss Topu yüksek yoğunluklu metal mermileri son derece yüksek hızda ateşler.
  '405': İyon topu iyon ışınları (pozitif ya da negatif yüklü parçacıklar) ateşler.
  '406': Plazma Atıcı, plazma atımları (toroidler) ateşleyen bir elektromanyetik hızlandırıcıyı büyük bir nükleer reaktör yakıt hücresiyle besler.
  '407': Küçük Kalkan Kubbesi tüm gezegeni muazzam miktarda enerjiyi emen bir alanla sarar.
  '408': Büyük Kalkan Kubbesi saldırılar sırasında belirgin biçimde daha fazla enerji emebilir.
  '409': Kalkan kubbesi teknolojisinin evrimi. Çok daha fazla enerji kullanır ama diğer tüm kalkanlardan daha fazla saldırıya dayanır.
  '410': Yıllarca süren yerçekimi araştırmasının ardından bilim insanları, küçük ve yoğun bir graviton alanı üretip düşmana ateşleyen bir graviton topu geliştirdi.
  '411': Kendi gücü olmayan, yerçekimiyle gezegenin çevresinde kararlı bir yörüngede tutulan hareketsiz bir savunma platformu.
  '412': Korur! Tıpkı Kindergarten TD'deki Lego tuğlası gibi.
  '413': Titan Lazer devasa bir lazerdir.
  '414': Yem, düşman güçlerini yanıltmak ve şaşırtmak için tasarlanmış sofistike bir savunma sistemidir. Roket Atıcı gibi görünerek saldırıları caydırır.
  '502': Yakalayıcı roketler gelen Gezegenler Arası Roketleri yok eder.
  '503': Gezegenler Arası Roketler rakibin savunmasını yok eder.
  '901': Metal, binalar ve gemiler için ana kaynaktır. En ucuz kaynaktır ama en çok ihtiyaç duyulan da odur ve Kristal gibi üretimi en az enerji ister.
  '902': Kristal, elektronik devrelerin ve bazı alaşımların ana kaynağıdır.
  '903': Deuterium en derin denizlerde bulunur. En pahalı kaynaktır.
  '911': Her kaynağı üretmek için enerji gerekir.
  "229": Xer'in egemenliğini kırmak için geliştirilen Engerek; Hafif Avcılara, Ağır Avcılara ve Kruvazörlere karşı nihai silahtır. Seri atış topları ve gelişmiş teknolojisiyle evrendeki güç dengesini değiştirir.
  "230": Hızlı. Kesin. Dokunulmaz. Önleyici adil dövüşler için yapılmadı – hızlı ve sert vurup göz açıp kapayıncaya kadar ezici bir üstünlük yaratmak için tasarlandı.
  "232": Daha hızlı, daha patlayıcı, hep güzel bir sürpriz. Boşluk Titanı ayların korkulu rüyasıdır.
