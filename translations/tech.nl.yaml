spytechStatsDescription: Op niveau 0 en 1 zie je alleen de totale punten van andere spelers. Vanaf niveau 2 zie je ook hun gebouwpunten, vanaf niveau 4 hun onderzoekspunten. Vanaf niveau 6 zie je ook hun schip- en verdedigingspunten, plus hun gevechtsstatistieken.
