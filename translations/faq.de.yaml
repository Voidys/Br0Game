        <h2 id="support">Support</h2>
        <p>Fragen zu deinem Konto oder Fehler: Eröffne ein Ticket auf der Seite <b>Support</b>. Lies die Seite <b>Regeln</b>, bevor du raidest, handelst oder mehrere Konten nutzt.</p>
