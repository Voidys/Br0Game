  '1':
    '1':
      body: |-
        <p>Dieser Abschnitt behandelt die wichtigsten Gebäude: was du zuerst bauen solltest und wofür jedes gut ist. Ein blühendes Imperium entsteht, wenn du sie in sinnvoller Reihenfolge ausbaust.</p>
        <h3>Solarkraftwerk</h3>
        <p>Baue es als Erstes. Deine Minen brauchen Energie, um Metall, Kristall und Deuterium zu produzieren. Sobald das Kraftwerk fertig ist, siehst du in der Rohstoffleiste und auf der Rohstoffseite, wie viel Energie du hast.</p>
        <h3>Metallmine</h3>
        <p>Metall ist einer der drei Rohstoffe. Fast alles, was du baust oder erforschst, kostet Metall, deshalb hat der Ausbau dieser Mine Priorität. Halte sie am Anfang einige Stufen vor deinen anderen Minen.</p>
        <h3>Kristallmine und Deuteriumsynthetisierer</h3>
        <p>Kristall wird für Gebäude, Schiffe und Forschung gebraucht. Davon produzierst du weniger als Metall, und das macht ihn wertvoller; später im Spiel ist er oft hart umkämpft. Deuterium treibt deine Flotten an, kann im Fusionskraftwerk zu Energie verbrannt werden und wird für mehrere wichtige Gebäude und Forschungen benötigt (darunter das Forschungslabor).</p>
        <p>Mehr Informationen: <a href="{wiki_url}/wiki/Hauptseite" target="_blank">Wiki</a>.</p>
      title: Schritt 1
    '2':
      body: |-
        <p>Um dein Imperium wachsen zu lassen und mit anderen Spielern zu interagieren, brauchst du weitere Gebäude. Mit Forschung und einer Raumschiffwerft startest du den Aufbau deiner Flotte und der planetaren Verteidigung.</p>
        <h3>Raumschiffwerft</h3>
        <p>Hier werden alle Schiffe (und Verteidigungsanlagen) gebaut. Die Werft steht früh zur Verfügung, aber für viele Schiffsklassen brauchst du zusätzliche Forschung. Das Menü „Technologie“ listet die Voraussetzungen für jedes Schiff und jede Verteidigungsanlage auf. Je höher die Stufe der Raumschiffwerft, desto schneller wird gebaut.</p>
        <h3>Forschungslabor</h3>
        <p>Hier startest du Forschungen. Sie schalten Gebäude, Schiffe, Verteidigungsanlagen und weitere Forschungen frei, und manche Technologien geben außerdem Boni auf bereits Vorhandenes. Der Ausbau des Forschungslabors beschleunigt die Forschung.</p>
        <h3>Roboterfabrik</h3>
        <p>Die Roboterfabrik ist unverzichtbar. Höhere Stufen verkürzen die Bauzeit von Gebäuden und beschleunigen auch die Schiffsproduktion. Werden die Bauzeiten lang, baue die Roboterfabrik aus, um sie wieder zu senken.</p>
      title: Schritt 2
    '3':
      body: |-
        <p>Dieser Abschnitt behandelt die Verteidigung deines Planeten und die ersten Flottenbewegungen: wie du Flotten losschickst und wie du mit anderen Spielern umgehst.</p>
        <h3>Galaxieansicht</h3>
        <p>Hier findest du andere Spieler. Du siehst Details zu anderen Planeten und kannst Teile deiner Flotte direkt aus dieser Ansicht losschicken. Außerdem kannst du Spielern schreiben oder einen Planeten ausspionieren, wenn du Spionagesonden zur Verfügung hast.</p>
        <h3>Flotten verschicken</h3>
        <p>Flotten kannst du aus der Galaxieansicht oder über das Flottenmenü losschicken. Wähle zuerst, wie viele Schiffe jedes Typs fliegen sollen. Lege dann das Ziel (Koordinaten aus der Galaxieansicht) und die Geschwindigkeit fest. Zum Schluss wählst du den Auftrag, etwa Angreifen, Stationieren, Halten, Abbauen oder Transport.</p>
        <h3>Verteidigung</h3>
        <p>Sobald du eine Raumschiffwerft hast, kannst du auch Verteidigungsanlagen bauen. Sie schützen den Planeten und kämpfen zusammen mit jeder Flotte, die beim Einschlag eines Angriffs vor Ort ist. Anders als Schiffe werden etwa 70 % aller zerstörten Verteidigungsanlagen nach dem Kampf repariert.</p>
      title: Schritt 3
    category: Einsteiger-Tipps
  '2':
    '1':
      body: |-
        <h3>Raiden</h3>
        <p>Raiden heißt, andere Spieler anzugreifen, um ihnen Rohstoffe abzunehmen. Die gängigen Arten:</p>
        <ul>
        <li>Farmraid</li>
        <li>Fleetangriff</li>
        <li>TF-Raid</li>
        <li>Abfangen</li>
        </ul>
        <h3>Farmraid</h3>
        <p>Das sind die häufigsten Angriffe in einem Universum. Du spionierst Planeten in der Nähe aus und schickst kleine Flotten los, die genug Laderaum und Feuerkraft haben, um eine schwache Verteidigung zu durchbrechen und trotzdem Gewinn zu machen: Die erbeuteten Rohstoffe sollten das verbrauchte Deuterium plus deine eigenen Verluste übersteigen.</p>
        <h3>Fleetangriff</h3>
        <p>Die Königsklasse des Raidens: die Jagd auf Flotten anderer Spieler. Neben Spionagesonden und etwas Glück zählen hier Sensorenphalanx und gutes Timing. Hast du eine lohnende Flotte entdeckt, musst du sie noch abfangen und das Trümmerfeld recyceln. Das ist oft schwierig, weil lohnende Flotten deine Recyclerkapazität übersteigen können – dann musst du neben der Kampfflotte auch die Recycler und gegebenenfalls Verbandsangriff-Partner koordinieren.</p>
        <h3>TF-Raid</h3>
        <p>Die bequemste, aber auch unbeliebteste Art, Gewinn zu machen: Du baust Trümmerfelder ab, die andere Spieler erzeugt haben. Trümmer gehören dem, der sie abbaut, deshalb sorgt der Klau von Trümmerfeldern oft für böses Blut.</p>
        <h3>Abfangen</h3>
        <p>Der Lebensinhalt eines Fleeters besteht darin, Flotte zu bauen und Flotte zu zerstören. Du findest nicht immer untätige Schiffe, deshalb heißt es bei guten Spielern oft: abfangen, während sie saven oder einen Angriff fliegen. Das ist nicht leicht, denn es gibt Wege, sich davor zu schützen.</p>
        <ul>
        <li><p>Ein Mond macht das Abfangen leichter, weil die Sensorenphalanx Flottenbewegungen auf Planeten in Reichweite scannen kann (nicht auf Monden). Findest du eine Flotte, die sich lohnt, rechne ihre Restflugzeit aus – vor allem die Rückflugzeit nach der Ankunft. Dafür reichen die Triebwerksstufen (Verbrennungstriebwerk, Impulstriebwerk, Hyperraumantrieb) aus einem Spionagebericht, per Hand oder mit einem Flugzeitrechner. Eine genaue Uhr hilft. Time deine Flotte und die Recycler so, dass sie etwa 3–5 Sekunden nach dem Ziel auf dessen Planet oder Mond ankommen. Auch die Recycler müssen gut getimt sein.</p></li>
        <li><p>Um eine Flotte abzufangen, die vom Mond zu einem Trümmerfeld fliegt, brauchst du ungefähr die Startzeit. Erzeuge an den Stellen, an denen du den Abbau vermutest, ein sichtbares Trümmerfeld (zum Beispiel mit Spionagesonden). Berechne, wie lange ihre Flotte bis dorthin braucht, beobachte das System und aktualisiere, bis das Feld verschwindet. Merke dir diese Zeit, addiere den Rückflug und time deine Flotte und die Recycler ein paar Sekunden hinter diese Ankunft.</p>
        <p><b>Achtung:</b> Das klappt nicht immer. Ein vorausgeschickter Recycler, der das Feld zuerst abräumt, ist ein häufiger Konter.</p></li>
        <li>Eine weitere Form des Abfangens ist das Halten auf dem Planeten eines Freundes, um ihn zu schützen: Angreifer müssen abbrechen, weil die verteidigende Flotte zu stark wäre. Das Risiko, so abgefangen zu werden, kannst du mit einem Savescan senken.</li>
        <li><p>Fliegt ein Spieler von einem Planeten zum anderen auf Stationieren und ruft die Flotte dann zurück, verschwindet sie aus der Sensorenphalanx. Beobachte sein Saveverhalten (wann er startet und wann er zurückruft). Wenn du einen Rückruf erwartest, phalanxe den Planeten im Sekundentakt. Sobald die Flotte verschwindet, notiere die Zeit, addiere den Rückflug und komme etwa 4–6 Sekunden später mit Flotte und Recyclern an.</p>
        <p>Flüchtet er per Save vom Mond aufs Trümmerfeld und schickt Recycler voraus, ist Abfangen fast unmöglich – es sei denn, du zerstörst den Mond. Schicke Todessterne mit dem Auftrag Zerstören. Ist der Mond weg, fliegt die Flotte zum Planeten zurück; phalanxe diesen Planeten und hänge dich ein paar Sekunden hinter sie.</p>
        <p>All diese Techniken funktionieren deutlich besser, wenn du die Gewohnheiten des Ziels kennst – zum Beispiel ein Save jeden Abend um 23 Uhr oder Online-Kommen mittags um 12. Studiere den Spieler, bevor du ihn abfängst.</p></li>
        </ul>
        <p>Mehr im Wiki: <a href="{wiki_url}/wiki/Saven" target="_blank">Saven</a>, <a href="{wiki_url}/wiki/Sensorenphalanx" target="_blank">Sensorenphalanx</a>.</p>
      title: Raiden
    '2':
      body: |-
        <h3>Angreifen mit dem Verband</h3>
        <p>Um gemeinsam anzugreifen, schicke zuerst eine Flotte mit dem Auftrag „Angreifen“ zum Ziel. Nach dem Start öffnest du das Flottenmenü und wandelst diese Flotte über „Verband“ in einen Verbandsangriff um. Dort kannst du den Verband umbenennen und andere Spieler einladen; der Spieler, der den Angriff gestartet hat, ist automatisch eingeladen. Jeder eingeladene Spieler schickt dann seine eigenen Schiffe mit dem Auftrag „Verbandsangriff“ zu denselben Koordinaten.</p>
        <p>Der Verband fliegt immer so lange, wie die langsamste beteiligte Flotte braucht. Schnellere Flotten, die später dazukommen, verkürzen die Restzeit nicht. Langsamere Flotten erhöhen die Restzeit auf ihre eigene Flugzeit. In der Regel können höchstens 5 Spieler und 16 Flotten an einem Verbandsangriff teilnehmen (die Einstellungen des Universums können abweichen). Eine beitretende Flotte darf die Restflugzeit um höchstens 30 % verlängern. Bleiben 100 Minuten, darf eine beitretende Flotte höchstens 130 Minuten brauchen.</p>
        <p><b>Achtung:</b> Wenn der Gründer des Verbands seine Flotte zurückruft, werden auch alle anderen Flotten im Verband zurückgerufen.</p>
        <h3>Verteidigen mit dem Verband</h3>
        <p>Wirst du angegriffen, können Allianzmitglieder und Buddys helfen. Sie schicken eine Flotte zu den angegriffenen Koordinaten, wählen die Haltedauer und nutzen den Auftrag „Halten“. Neben dem Deuterium für den Flug fallen beim Start zusätzliche Haltekosten an, abhängig von Flottengröße und Dauer. Solange sie bei dir halten, kämpfen sie in jedem Kampf auf diesem Planeten oder Mond mit und erscheinen in Spionageberichten, als wären es deine eigenen Schiffe. Time das Halten so, dass die Flotte kurz vor dem Angreifer ankommt, damit ein Savescan sie möglichst nicht sieht. Haltende Spieler können ihre Flotte jederzeit im Flottenmenü zurückrufen; sonst wartet die Flotte die Haltezeit ab und fliegt dann nach Hause.</p>
        <h3>Deuterium pro Stunde Halten</h3>
        <p>Kleiner Transporter: 5<br>
        Großer Transporter: 5<br>
        Leichter Jäger: 2<br>
        Schwerer Jäger: 7<br>
        Kreuzer: 30<br>
        Schlachtschiff: 50<br>
        Kolonieschiff: 100<br>
        Recycler: 30<br>
        Spionagesonde: 1/10<br>
        Bomber: 100<br>
        Zerstörer: 100<br>
        Todesstern: 1/10</p>
      title: Allianzkampfsystem
    '3':
      body: |-
        <p>Ein Mond kann entstehen, wenn ein Trümmerfeld mit mindestens 100.000 Einheiten entsteht (1 % Mondchance). Die Chance ist bei 20 % gedeckelt, egal wie groß das Feld ist.</p>
        <h3>Allgemeines</h3>
        <p>Monde lassen sich wie Planeten umbenennen, aber „(Mond)“ bleibt im Namen. Du kannst höchstens einen Mond pro Planet haben. Mit einem Mond kannst du außerhalb der Sicht einer Sensorenphalanx saven, deshalb lohnt es sich, relativ früh einen zu erzeugen. Auf einem Mond kannst du Roboterfabrik, Raumschiffwerft, Metallspeicher, Kristallspeicher, Deuteriumtank, Allianzdepot, Mondbasis, Sensorenphalanx und Sprungtor bauen.</p>
        <h3>Mondschuss</h3>
        <p>Ein Mondschuss ist die gezielte Zerstörung von Schiffen, um ein Trümmerfeld zu erzeugen. Üblich sind Leichte Jäger: Bei 30 % der Flotte und 0 % für Verteidigung im Trümmerfeld ergeben 1.667 Leichte Jäger eine Mondchance von 20 %. Sie sind billig zu verlieren und landen sehr nah am Maximum. Zerstört ein stärkerer Spieler beim schwächeren Leichte Jäger, darf jeder das Trümmerfeld abbauen. Greift ein schwächerer Spieler einen stärkeren mit Schiffen an, die sterben sollen, darf nur der schwächere abbauen – sonst wäre es Pushen. Monde und Mondversuche fallen unter die Pushing-Regeln.</p>
        <p>In einem Universum, in dem auch Verteidigung Trümmer erzeugt, ist es oft besser, Verteidigung zu bauen und sie in mehreren Wellen zerlegen zu lassen, um mehrere Mondversuche zu bekommen. Üblich sind 3.334 Raketenwerfer oder 3.334 Leichte Lasergeschütze.</p>
        <p>Wenn ein Mond entsteht, steht im Kampfbericht, dass sich die enormen Mengen an freiem Metall und Kristall anziehen und einen Trabanten um den Planeten bilden.</p>
        <p>Mondchance von 1 bis 19 %: zufällige Größe. Mondchance von 20 %: mehr als 8.000 km Durchmesser. Ein Mond wird nie größer als 8.944 km.</p>
        <h3>Gebäude</h3>
        <p>Speicher lohnen sich auf einem Mond meist nicht, weil dort nichts produziert wird. Eine Raumschiffwerft ist ebenfalls selten nützlich: Die Bauzeiten sind lang, und Schiffe kannst du auf dem Planeten bauen. Ob sich ein Allianzdepot lohnt, ist umstritten; es belegt außerdem wertvolle Felder.</p>
        <p>Die drei Gebäude, die es nur auf dem Mond gibt:</p>
        <ul>
        <li><p><b>Mondbasis</b><br>Schafft zusätzliche Baufelder: 3 pro Stufe, von denen eines für den nächsten Ausbau der Mondbasis draufgeht.</p></li>
        <li><p><b>Sensorenphalanx</b><br>Zeigt Flottenbewegungen auf feindlichen Planeten (nicht auf Monden). Die Reichweite steigt mit jeder Stufe.</p></li>
        <li><p><b>Sprungtor</b><br>Bewegt Schiffe sofort von einem Mond zum anderen. Rohstoffe können nicht mitreisen. Nach einem Sprung braucht das Tor Zeit zum Abkühlen (üblicherweise eine Stunde), sonst überhitzt es.</p></li>
        </ul>
        <p>Eine gängige Bau-Reihenfolge für Monde:<br>
        <b>Legende:</b><br>
        MB – Mondbasis<br>
        SP – Sensorenphalanx<br>
        ST – Sprungtor<br>
        RB – Roboterfabrik</p>
        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>
        Danach kannst du die Sensorenphalanx weiter ausbauen, wenn du die Rohstoffe hast. Du kannst auch einige Stufen der Roboterfabrik abreißen und diese Felder für die Phalanx nutzen.</p>
        <h3>Zerstörung</h3>
        <p>Ein Mond lässt sich nur mit Todessternen zerstören. Wähle im Auftragsmenü „Zerstören“ statt „Angreifen“. Jede Flotte auf dem Mond muss zuerst vernichtet werden; überlebende Todessterne können bei der Zerstörung des Mondes selbst noch verloren gehen. Eine Mondzerstörung erzeugt kein Trümmerfeld.</p>
        <h3>Mondangriffe mit Todessternen</h3>
        <p>Chance auf Mondzerstörung: (100 − Wurzel(Mondgröße)) × Wurzel(Anzahl Todessterne). Chance, dass die angreifenden Todessterne zerstört werden: Wurzel(Mondgröße) / 2. Je größer der Mond, desto riskanter die Zerstörung.</p>
        <h3>Mondchance und Mondgröße</h3>
        <p>100.000 Trümmereinheiten ergeben 1 % Mondchance. Maximale Chance: 20 %. Seit einer späteren Änderung hat jeder Mond die maximale Anzahl bebaubarer Felder (79). Früher war das ABRUNDEN((Durchmesser / 1000)²). Größtmöglicher Mond: 8.944 km Durchmesser, 79 Felder.</p>
        <p>Mehr im Wiki: <a href="{wiki_url}/wiki/Mond" target="_blank">Monde</a>, <a href="{wiki_url}/wiki/Hauptseite" target="_blank">Wiki</a>.</p>
      title: Monde
    '4':
      body: |-
        <h3>Wie gründe ich eine Allianz?</h3>
        <p>Öffne im Menü links „Allianz“ und dann „Eigene Allianz gründen“. Gib ein Allianz-Tag (die kurze Abkürzung) und einen Allianznamen ein. Beispiel: Eine Allianz mit dem Namen „Die Top Ally“ könnte das Tag „DTA“ verwenden.</p>
        <p>Erlaubt sind nur Buchstaben, Zahlen und Leerzeichen. Nach der Eingabe von Tag und Name klickst du auf „Erstellen“. Ist der Name oder das Tag schon vergeben, bekommst du eine Fehlermeldung und musst etwas anderes wählen. Bei Erfolg siehst du eine Bestätigung; „Weiter“ öffnet dein noch leeres Allianzmenü, das du jederzeit über „Allianz“ im Menü links erreichst. Ganz oben siehst du dein Tag und deinen Namen.</p>
        <p>Darunter findest du:<br>
        Mitglieder: alle Mitglieder mit Punkten, Koordinaten des Heimatplaneten, Beitrittsdatum und Onlinestatus. Ein Klick auf die Spaltenköpfe sortiert die Liste.<br>
        Dein Rang: dein Rangname plus ein Link zur Allianzverwaltung.<br>
        Rundnachrichten: eine Nachricht an die ganze Allianz oder an ausgewählte Ränge.</p>
        <h3>Allianzverwaltung</h3>
        <p>Unter „Ränge“ legst du die Rechte der einzelnen Ränge fest, zum Beispiel das Recht, die Allianz aufzulösen oder Rundnachrichten zu verschicken. Unter „Mitglieder“ kannst du Spieler rauswerfen, Ränge vergeben und sehen, wie viele Tage sie offline waren. Außerdem kannst du Allianz-Tag und Allianznamen ändern.</p>
        <p>Die „Textverwaltung“ bearbeitet die Allianztexte. Der externe Text ist für alle Spieler sichtbar, der interne nur für Mitglieder. Der Bewerbungstext ist eine Vorlage für Spieler, die sich bewerben.</p>
        <p>Unter „Optionen“ kannst du ein Banner-Bild und ein Allianzforum verlinken, festlegen, ob Bewerbungen möglich sind, und den Rangnamen des Gründers bestimmen. Lässt du das Feld leer, lautet der Rang „Gründer“.</p>
        <p>Du kannst die Allianz auflösen oder an ein anderes Mitglied übergeben, das dann Gründer wird.</p>
      title: Allianzen
