ins_credits_text: 'Br0Game продовжує довгу низку браузерних ігор з відкритим кодом. Шана всім, хто створював і підтримував їх до нас:'
ins_credits_thanks: Дякуємо спільноті pr0game за гру, з якої виросла ця.
ins_licence_note: Вільне програмне забезпечення за ліцензією GNU AGPL v3
ins_task_images: Оптимізація зображень (WebP)
ins_db_help: Br0Game зберігає все в базі даних MySQL або MariaDB. Значення нижче можна взяти в панелі хостингу (шукай «Databases» або «MySQL») або у того, хто налаштовував твій сервер. Якщо MySQL ти встановлював сам, типові значення зазвичай підходять.
ins_db_host: Сервер бази даних
ins_db_host_info: Майже завжди «localhost». Деякі хостинги дають назву на кшталт «db1.example.com».
ins_db_name_info: Назва бази даних для гри. Спочатку створи її в панелі хостингу або дозволь інсталятору створити її (див. блок нижче).
ins_db_advanced: Додатково (порт, префікс таблиць, пароль для міграцій) — зазвичай не потрібно
ins_db_prefix_info: Додається перед назвою кожної таблиці. Міняй лише тоді, коли ділиш одну базу з іншим ПЗ.
ins_db_migrationpw_info: Захищає сторінку оновлення (install/?mode=upgrade) для майбутніх оновлень гри. Залиш порожнім — інсталятор згенерує надійний пароль і покаже його один раз на останній сторінці.
ins_db_migrationpw_placeholder: створюється автоматично
ins_migrationpw_invalid: Пароль для міграцій не може містити лапки, зворотні скісні риски, $ або розриви рядків.
ins_err_technical: технічні деталі
ins_err_access_denied: Сервер бази даних відхилив ім'я користувача або пароль. Перевір обидва на помилки (важливий регістр) у панелі хостингу.
ins_err_unknown_db: Такої бази даних немає на сервері. Перевір назву або постав позначку «Створити базу даних» нижче.
ins_err_no_privilege: Цьому користувачеві бази даних не дозволено її використовувати. Надай йому всі привілеї на цю базу в панелі хостингу.
ins_err_no_create: Цьому користувачеві не дозволено створювати бази даних. Створи порожню базу в панелі хостингу і зніми позначку «Створити базу даних».
ins_err_socket: Сокет сервера бази даних не знайдено. Спробуй замість «localhost» хост «127.0.0.1».
ins_err_unreachable: Сервер бази даних «%s» недоступний. Перевір назву хоста і порт, а також чи запущено сервер бази даних. Багато хостингів дозволяють підключення лише зі своїх веб-серверів, тож «localhost» зазвичай правильний.
ins_game_desc: Назви гру і вибери, як вона працюватиме. Усе це можна змінити пізніше в адмін-панелі (Адмін — Налаштування).
ins_group_general: Загальні
ins_uni_name: Назва всесвіту
ins_uni_name_info: Показується гравцям під час вибору всесвіту. Порожньо = «Всесвіт 1».
ins_uni_name_invalid: Назва всесвіту може містити не більше 60 символів.
ins_language: Мова за замовчуванням
ins_language_info: Мова для нових відвідувачів і для твого облікового запису адміністратора.
ins_language_invalid: Невідома мова.
ins_timezone: Часовий пояс
ins_timezone_info: Вибрано за сервером. Використовується для показу серверного часу.
ins_timezone_invalid: Невідомий часовий пояс.
ins_group_speed: Швидкість гри
ins_speed_info: Наскільки швидко йдуть будівництво, дослідження, кораблі, флоти та видобуток. Classic — оригінальний темп; швидші пресети підходять для невеликих спільнот і коротких раундів.
ins_speed_classic: Classic
ins_speed_classic_info: оригінальний темп, раунди тривають місяці
ins_speed_fast: Fast
ins_speed_fast_info: приблизно втричі швидше, раунди тривають тижні
ins_speed_blitz: Blitz
ins_speed_blitz_info: до десяти разів швидше, раунди тривають дні
ins_speed_detail: Будівництво/дослідження %bx, флоти %fx, ресурси %rx
ins_speed_invalid: Невідомий пресет швидкості.
ins_group_players: Гравці
ins_registration: Реєстрація
ins_registration_open: Відкрита — зареєструватися може будь-хто
ins_registration_closed: Закрита — облікові записи створюєш лише ти
ins_registration_info: Вибери «закрита», поки налаштовуєш гру. Відкрити її пізніше можна в адмін-панелі (Налаштування).
ins_registration_invalid: Невідоме налаштування реєстрації.
ins_bots: Комп'ютерні гравці (боти)
ins_bots_info: Від 0 до 50. Боти грають як живі гравці з різними звичками, тож нова гра не порожня. 0 = без ботів.
ins_bots_invalid: Кількість ботів має бути від 0 до 50.
ins_mail: Надсилати листи (реєстрація, скидання пароля)
ins_mail_info: Вимкнено за замовчуванням. Вмикай лише тоді, коли сервер може надсилати пошту; SMTP можна налаштувати пізніше в адмін-панелі (Налаштування).
ins_admin_mail_info: Використовується для скидання пароля і як контактна адреса.
ins_admin_mail_invalid: Введи коректну адресу е-пошти.
ins_admin_pass_confirm: Повтори пароль
ins_admin_pass_rules: Пароль має містити щонайменше %d символів (не більше 64). Коротке речення з кількох слів легко запам'ятати і важко вгадати.
ins_admin_pass_short: Пароль має містити щонайменше %d символів.
ins_admin_pass_long: Пароль може містити не більше 64 символів.
ins_admin_pass_mismatch: Паролі не співпадають.
ins_done_checklist: Твій чек-лист
ins_done_login: Увійди в адміністрування.
ins_done_login_info: 'Ти вже увійшов як «%s». Наступного разу використовуй:'
ins_done_cron: Налаштуй cron-завдання (обов'язково).
ins_done_cron_info: 'Без нього в грі нічого не просувається (флоти, черги будівництва, статистика). Додай цей рядок до crontab користувача веб-сервера (crontab -e) або створи cron-завдання з ним у панелі хостингу:'
ins_done_cron_help: "Як налаштувати cron-завдання (зокрема в панелі хостингу)"
ins_done_locked: Інструмент встановлення тепер заблоковано.
ins_done_locked_info: Майстер більше не можна запустити. Щоб оновити пізніше, дотримуйся розділу про оновлення в документації.
ins_done_https: Використовуй HTTPS.
ins_done_https_info: 'Зараз сторінка відкривається через HTTP: паролі передаються без шифрування. Налаштуй сертифікат (наприклад, Let''s Encrypt), перш ніж запрошувати гравців.'
ins_done_https_ok: Ця сторінка відкрита через HTTPS — добре.
ins_done_settings: Змінюй налаштування пізніше.
ins_done_settings_info: 'Адмін — Налаштування: назва гри, швидкість, реєстрація, е-пошта (SMTP), боти та багато іншого.'
ins_done_bots: Боти.
ins_done_bots_info: 'Створено ботів: %d. Вони діятимуть під час запуску cron-завдання. Керуй ними в адмін-панелі.'
ins_done_bots_failed: Адміністратора створено, але ботів створити не вдалося. Додати їх можна пізніше в адмін-панелі.
ins_done_migrationpw: Запиши свій пароль для міграцій (показується лише один раз).
ins_done_migrationpw_info: Він потрібен для оновлень гри. Також зберігається в config/game.php.
ins_done_docs: 'Документація:'
ins_done_to_admin: До адміністрування
ins_step_legal: Юридичне
ins_legal_desc: Вибери, де розміщується гра і з чого почнуться юридичні сторінки та дошка спільноти. Усе це можна змінити пізніше в адмін-зоні (Налаштування, Сторінки).
ins_group_privacy: Регіон розміщення
ins_privacy_info: Регіон визначає, яка політика конфіденційності використовується за замовчуванням.
ins_privacy_eu: ЄС / ЄЕЗ — політика конфіденційності за GDPR
ins_privacy_eu_info: Обери, якщо гра розміщена в Європейському Союзі або Європейській економічній зоні чи призначена для гравців звідти.
ins_privacy_other: Поза ЄС — загальна політика конфіденційності
ins_privacy_other_info: Проста політика конфіденційності без посилань на GDPR.
ins_group_rules: Правила
ins_rules_default: Імпортувати стандартні правила
ins_rules_default_info: Сторінка правил починається зі стандартних правил гри, які потім можна відредагувати.
ins_rules_blank: Почати з порожнього
ins_rules_blank_info: Сторінка правил залишиться порожньою, доки ти не напишеш власні правила в адмін-зоні.
ins_group_community: Спільнота
ins_board: Увімкнути дошку спільноти
ins_board_info: Форум для гравців. Коли вимкнено, усі посилання на дошку приховані, а сторінки дошки недоступні.
ins_legal_note: Згенеровані тексти — лише шаблони. Як оператор ти відповідаєш за юридичні тексти своєї гри і маєш їх перевірити.
ins_legal_region_invalid: Вибери коректний регіон розміщення.
ins_legal_rules_invalid: Вибери, з чого мають починатися правила.
