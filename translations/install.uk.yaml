intro_text: 'Br0Game — це браузерна космічна стратегія з відкритим кодом: розбудовуй планети, досліджуй технології, відправляй флоти і воюй із сотнями гравців одночасно.<br><br>Цей майстер крок за кроком налаштовує нову інсталяцію: перевіряє сервер, підключається до бази даних і створює її, будує таблиці, дає змогу назвати гру та створює адміністратора.'
intro_upgrade_head: Br0Game уже встановлено?
intro_upgrade_text: <p>Br0Game уже встановлено, і ти хочеш лише оновити його?</p><p>Оновити існуючу базу даних можна тут за кілька кліків!</p>
