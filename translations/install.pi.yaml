intro_install: Zur Installation
intro_lang: Sprache
intro_text: >-
  Br0Game ist eines der besten Klone von OGame.<br>Br0Game ist die neueste und
  stabilste XNova Version je entwickelt wurde. Br0Game glänzt durch Stabilität,
  Flexibilität, Dynamik, Qualität und Benutzerfreundlichkeit. Wir hoffen immer
  besser zu sein als ihre Erwartungen.<br><br>Das Installations-System führt Sie
  durch die Installation, oder Upgrade auf einer vorherigen Version auf die
  neueste ein. Jede Frage, ein Problem zögern Sie bitte nicht, unsere
  Entwicklung und Unterstützung zu ersuchen.<br><br>Br0Game ist ein
  OpenSource-Projekt und ist under GNU GPL v3 lizenziert. Zur Lizenz klicken Sie
  bitte im Menu auf die entsprechenden Menüpunkt.<br><br>Bevor die Installation
  gestartet werden kann, wird vorher ein kleiner Test durchgeführt, ob sie die
  Mindestanforderungen unterstützen.
intro_upgrade_head: Br0Game schon installiert?
intro_upgrade_text: >-
  <p>Du hast Br0Game bereits installiert und möchtest einfach
  updaten?</p><p>Hier kann du deine alte Datenbank mit wenigen klicks
  aktualisieren!</p>
intro_welcome: Herzlich Willkommen beim Br0Game!
licence_accept: >-
  Akzeptieren Sie sämtliche Bedingungen der Lizenzbestimmungen? Sie können die
  Software nur installieren, wenn Sie die Lizenzbestimmungen akzeptieren.
licence_desc: >-
  Bitte lesen Sie die folgenden Lizenzbestimmungen. Verwenden Sie die
  Bildlaufleiste, um das gesamte Dokument anzuzeigen.
licence_head: Lizenzbestimmungen
licence_need_accept: >-
  Um mit der Installation fortfahren zu können, müssen Sie die
  Lizenzbestimmungen akzeptieren.
