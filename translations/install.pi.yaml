req_desc: >-
  Bevor die Installation fortgesetzt werden kann, wird Br0Game einige Tests zu
  deiner Server-Konfiguration und deinen Dateien durchführen, um
  sicherzustellen, dass du Br0Game installieren und benutzen kannst. Bitte lies
  die Ergebnisse aufmerksam durch und fahre nicht weiter fort, bevor alle
  erforderlichen Tests bestanden sind. Falls du irgendeine der Funktionen, die
  unter den optionalen Modulen aufgeführt sind, nutzen möchtest, solltest du
  sicherstellen, dass die entsprechenden Tests auch bestanden werden.
req_head: Benötigte Systemvoraussetzungen
req_php_need: Installierte Version der Skriptsprache &raquo;PHP&laquo;
req_php_need_desc: >-
  <strong>Voraussetzung</strong> — PHP ist die Serverseitige Sprache, in der
  Br0Game geschrieben ist. Damit Br0Game ohne Einschränkungen funktioniert, wird
  die PHP Version 5.2.5 vorrausgesetzt.
sql_close_reason: |-
