step4_head: Administrator erstellen
step6_desc: Du hast Br0Game erfolgreich installiert.
step6_head: Herzlichen Glückwunsch!
step6_info_additional: >-
  Wenn du unten auf die Schaltfläche klickst, wirst du zu einem Formular im
  Administrations-Bereich weitergeleitet. Anschließend solltest du dir etwas
  Zeit nehmen, um die verfügbaren Optionen kennen zu
  lernen.<br/><br/><strong>Bitte lösche die Datei
  &raquo;var/ENABLE_INSTALL_TOOL&laquo; oder nenne es um, bevor du dein
  Spiel benutzt. Solange diese Datei existiert, ist dein Spiel potenziell
  gefährdet!</strong>
step6_info_head: Starte mit Br0Game durch!
step8_need_fields: Du muust alle Felder ausfüllen.
