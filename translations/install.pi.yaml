step3_desc: >-
  Die von Br0Game genutzten Datenbank-Tabellen wurden nun erstellt und mit
  einigen Ausgangswerten gefüllt. Geh weiter zum nächsten Schritt, um die
  Installation von Br0Game abzuschließen.
