sys_expe_found_ress_1_1: >-
  Kesif filonuz ufak tefek gok cisimleri buldu. Kaptan Yahya bunlardan bazi
  madenler elde edebilecegini dusunuyor.
sys_expe_found_ress_1_2: >-
  Bazi ufak gezegenler gorduk ve bunlarda cok rahat bir sekilde maden elde ettik
  .
sys_expe_found_ress_1_3: >-
  Kesif bolgesinde gozden uzak bir yerde islenmeye deger madenler buldular,
  kesifte bulunan madenler  %s ve %s, %s ve %s ve %s ve %s toplayip gezegenine
  getirdiler <br> Komutanin seyir defterinden : Inanin bu kaynaklar tekrar
  gorulemeyecek kadar coktu, ancak yeterli kapasitemiz yoktu :( teknisyenler
  kitaplarini bile orada biraktilar, hatta ben ufak sise rakimi bile orada
  birakmak zorunda kaldim.
sys_expe_found_ress_1_4: >-
  Kesif Filonuz bir radyoaktif ve yuksek atmosfer asteroit toksit kirlenmesine
  rastladi. Ancak taramalar bu asteroidin kaynak olarak zengin oldugunu
  gostermistir. Oto gemiyi kullarak maden elde etmeye calistik.
sys_expe_found_ress_2_1: >-
  Kesif filonuz antik bir nakliye filosu buldu. Konvoy tamamen dolu gibi ama
  madenlerin cogu tahrip olmus. Kurtabildiklerimizi alip donuyoruz.
sys_expe_found_ress_2_2: >-
  Bataklik ve karanligin hukum surdugu bir gezegene indik. Gezegeni tam
  tarayamasakda bazi kolayca erisilebilir madenler bulduk.
sys_expe_found_ress_2_3: >-
  Kucuk bir askeri olmayan konvoyla karsilastik. Acil olarak ilac ve yiyecek
  ihtiyaclari oldugunu soylediler. Bizde onlara biz Kizilay degiliz dedik ve
  maden karsiligi istediklerini verdik.
sys_expe_found_ress_3_1: >-
  Kesif filon biraz utangac bir alien irkina rastliyor. Acikcasi bu kadar
  cekingen alien ile de ilk kez karsilasiyorsun ve seninkiler de olaylari
  yavastan aliyorlar. Bir sure iletisim kurduktan sonra, aralarindan bir
  temsilciyi degis tokus edilebilecek mallarla dunyana gondermeyi oneriyorlar.
sys_expe_found_ress_3_2: >-
  Kendi atmosferine sahip ufak bir Ay`da, kesif filon yuksek miktarda islenmemis
  hammadde istifi buldu. Ay uzerinde calisan Murettebat hala bu dogal hazineleri
  kaldirip, yuklemeye calisiyor.
sys_expe_found_ress_logbook_1: >-
  Birinci subayın seyir defterinden bir kayıt: Tüm boş alanı kullandık ancak
  yine de bulunan tüm kaynakları yanımıza alamadık.
sys_expe_found_ress_logbook_2: >-
  Birinci subayın seyir defterinden bir kayıt: Keşke birkaç kargo gemimiz daha
  olsaydı! Şimdi geride bir sürü kaynak bırakmak zorunda kalacağız.
sys_expe_found_ress_logbook_3: >-
  Birinci subayın seyir defterinden bir kayıt: Artık gerçekten ihtiyacımız
  olmayan her şeyi zaten attık ama yine de bulunan tüm kaynaklar için yeterli
  alan yaratamıyoruz.
sys_expe_found_ress_logbook_4: >-
  Birinci subay seyir defterinden bir kayıt: Kafeteryayı ve tüm salonları depoya
  dönüştürdüğümüzde bile bulduğumuz tüm kaynakları hala taşıyamıyoruz.
sys_expe_found_ships: >-
  Kesif filonuz bazi terkedilmis uzay gemileri buldu.<br> Komutanin seyir
  defterinden : Gemiler neredeyse hic kullanilmamis, hangi akla hizmet bu
  gemileri birakip gitmisler cozemedim!.<br>:
sys_expe_found_ships_1_1: >-
  Kesif ekibimiz enerjiye dayali tershane uretim merkezine geldi. Bazi gemiler
  halen uretim asamasinda ve biz bu araclari buradan kacirmaya calisiyoruz
sys_expe_found_ships_1_2: >-
  Kesif ekibimiz bir yildiz kalesi ile karsilasti.. Kalede bir kac damar hangar
  tespit edildi. Teknisyenlerimizin bazilari onu tamir edebilir.
sys_expe_found_ships_1_3: >-
  Kesif ekibimiz muhtemelen halen devam eden bir savastan geriye kalmis bir
  gezegen buldu. Yorungede bir cok batik gemi bulunuyor. Teknisyenlerimiz
  bazilarini onarmaya calisiyor. Belki o zaman burada ne oldugu hakkinda daha
  fazla bilgi edinebiliriz.
sys_expe_found_ships_1_4: >-
  Kesif ekibin terkedilmis yildiz kalesi buldu. Kalede kimse yasamiyor ama
  icinde hala birkac gemi var. Geriye bu gemilerin calisir durumda olup
  olmadigini anlamak kaliyor.
sys_expe_found_ships_2_1: >-
  Kesif filonun dikkatini bir gezegen cekiyor. Cok buyuk isiklandirma
  sistemlerine sahip gezegen murettebati huzursuzlandiriyor. Kaptanin endiseli
  de olsa yaklasma emri veriyor. Gezegene inis yapildiginda murettebatin
  teknolojisi gelismis bir alien irkina rastliyor. Bir tersane gorevlisi
  kullanmadiklari birkac gemiyi hediye etmeyi teklif ediyor.
sys_expe_found_ships_2_2: >-
  Bir onceki kesif filosunun kalintisina ulastik! Bu kalintilar icinde isimize
  yarayacak gemi olup olmadigina karar vermeye calisiyoruz.
sys_expe_found_ships_3_1: >-
  Kesif ekibin terkedilmis yildiz kalesi buldu. Kalede kimse yasamiyor ama
  icinde hala birkac gemi var. Geriye bu gemilerin calisir durumda olup
  olmadigini anlamak kaliyor.
sys_expe_found_ships_3_2: >-
  Icinde zamaninda gelismis bir uygarlik barindirmis olan bir gezegen bulduk.
  Koca gezegende geriye sadece uzaydan da gorebilen devasa bir uzay gemisi
  istasyonu kalmis. Pilot ve uzmanlarimiz gezegene gidip bu uzay gemisi
  istasyonunda isimize yarayabilecek gemi olup olmadigini kontrol edecekler.
sys_expe_found_ships_logbook_1: >-
  Makine subaylarının seyir defterinden bir kayıt: Yanımızda birkaç gemi daha
  getirmiş olsaydık, bu güzelliklerden bazılarını yanımıza almak kolay olurdu!
sys_expe_found_ships_logbook_2: >-
  Makine subaylarının seyir defterinden bir kayıt: Ne yazık ki, görevimizde
  keşfedilen tüm gemileri geri getirecek kapasitemiz yoktu.
sys_expe_found_ships_logbook_3: >-
  Makine subaylarının seyir defterinden bir kayıt: Maalesef bulunan tüm gemileri
  geri getirmek için yeterli kapasitemiz yok.
sys_expe_found_ships_nothing: Gemi bulunamadi.
sys_expe_lost_fleet_1: >-
  Kesif ekibimize birsey oldu efendim! Bir telsiz mesaji birakmislar: Bu da ne
  boyle ! Zzzrrt Aman Tanrim! Krrrzzzzt zrrrtrzt Yardim Edinnnnn !! krgzzzz
  Krzzzzzzzztzzzz benziyor ...
sys_expe_lost_fleet_2: >-
  Kesif filosundan son aldigimiz bilgilere gore, cok guzel gorunen bir
  karadeligi daha yakindan gormek istedikleri idi..
sys_expe_lost_fleet_3: >-
  Efendim bu duyacaklariniza inanmayacaksiniz! Super bir gezegen bulduk, gemiyi
  agzina kadar maden ve karanlik madde ile doldurduk. Hakettigimizi dusunerek
  eglenmeye basladik. Hepimiz deliler gibi sarhos olmusuz. Sabah kalktigimizda
  ne gorelim. Bizim filonun yerinde yeller esiyor. Sadece bir not : Madenler,
  Karanlik madde ve gemiler icin tesekkurler. Dost bir filo murettebati geri
  getiriyor.
sys_expe_lost_fleet_4: >-
  Kesif ekibi hazirliksiz durumda kesfe yollandi. Bilim adamlarimiz halen saskin
  ancak Tum ekip yok olacak gibi gorunuyor...
sys_expe_nothing_1: >-
  Kesif filon Supernovanin cok guzel resimlerini cekmis ama bunun haricinde
  onemli bir kesifte bulunamadi. Yine de moralini bozma, en azindan bu resimler
  Evrenin En Iyi Resimleri Yarismasinda basarili olacaktir.
sys_expe_nothing_2: >-
  Saf ve enerjik yasamlar ve malzeme umudu ile kesiflere baslanmisti. Ancak
  deuterium sikintisi bu durumun kotulesmesini sagladi ve kesif gorevi iptal
  edildi.
sys_expe_nothing_3: >-
  Galiba kaptanin dogumgununun bu bilinmedik gezegende kutlanmasi hic iyi bir
  fikir degildi. Garip bir hastalik ve beraberinde getirdigi agir ates yuzunden
  murettabatin yarisi yorgan dosek hastahanede yatiyor. Bu sorun yuzunden kesif
  de basarisizlikla yarida kesilmek zorunda kaldi.
sys_expe_nothing_4: >-
  Korsanlariyla unlu bir sisteme giris yapan murettebatin cikan bir tartisma
  sonucu bir korsan gemisi kaptanindan dayak yedi. Saglik her seyden once
  geldigi icin kesif yarida kesilmek zorunda kaldi. Bu kesiften de elin bos
  donuyorsun.
sys_expe_nothing_5: >-
  Eh, en azindan simdi herkes 5. siniftan kirmizi anemalinin gemi sistemleri
  uzerindeki garip etkilerinin yani sira murettebat uzerinde de olumsuz
  psikolojik etkileri oldugunu biliyor. Bu kesif sonucunda baska bir sey de
  ogrenilemedi!
sys_expe_nothing_6: >-
  Kesif filon bir sekilde notron yildizlarindan birinin merkez cekim kuvvetinin
  yakinlarina girdi. Bu cekim kuvvetinden cikmasi kolay olmadi, kendini ancak
  agir bir mucadelenin sonucunda kurtarabildi. Tabii bu mucadele sirasinda
  ekstra deuterium tuketimi zorunluydu ve dolayisiyla filon verilen gorevi
  yerine getiremeden, yakit yetersizligi sebebiyle erkenden eve donmek zorunda
  kaldi.
sys_expe_nothing_7: >-
  Kesif filon acil durum sinyali yakaladi! Sinyali gonderen, yakinindaki
  gezegenin cekim gucunden cikamayan dev bir nakliye gemisiydi. Basarili bir
  kurtarma operasyonundan sonra nakliye gemisinin kaptani kurtaricilari onuruna
  bir solen duzenleyip, isimlerini ozel musteri defterine ekledi.
sys_expe_nothing_8: >-
  Bu kesif seni kelimenin tam anlamiyla evrenin bosluklariyla tanistirdi. Bosluk
  disinda hic bir seye rastlamadin, ne kucuk bir gezegen ne bir goktasi ne bir
  tanecik...hicbir sey!
sys_expe_nothing_9: >-
  Evrenin tum yonbulma sistemleri garip bir bilgisayar virusu yuzunden agir
  sorunlar yasadilar. Bunun sonucunda gonderilen kesif filosu tum sure boyunca
  kendi etrafinda turlamis ve donup dolasip ayni yere gelmis. Herhalde bu kesif
  yolculugunun olumlu bir katkisi olmadigini bir daha soylemem gerekmiyor.
sys_expe_report: Kesif Raporu
sys_expe_report_msg: '%s %s filosunun %s''deki keşif raporu:'
sys_expe_time_fast_1: >-
  Kesif ekibimiz yolda dost bir filo ile karsilasti. Yeni bulduklari bir yakiti
  bizle paylastilar. Bu yeni yakit bizi normalden hizli goturuyor. Eve erken
  donuyoruz.
sys_expe_time_fast_2: >-
  Rota kaptaninin hastalanmasi sonucu, rota idaresini 2. rota kaptani aldi.
  Belki inanmayacaksiniz ama yaptigi degisik hiper uzay hesaplari ve rota
  sayesinden beklenenden erken donecegiz.
sys_expe_time_fast_3: >-
  Geminin yeni komutani oldukca cesur cikti, cesur olmasinin yanisira bir o
  kadar da yetenekli oldugunu iddia edebiliriz. Tam oturmamis bir solucan deligi
  bulup kullanarak, filonun eve geri donusunu hizlandirdi! Her ne kadar filo
  erken donmus olsa da, bu kesif sonunda herhangi bir bulgu bulunamadigi
  gercegini degistirmiyor.
sys_expe_time_slow_1: >-
  Bilinmeyen bir nedenden dolayi kesif ekibinin atlama islemi hata ile
  sonuclandi. Neredeyse bir gunesin icinde yok olunuyordu. Neyse ki bu bilinen
  bir sistem ama karaya donmek uzun zaman alacak gibi gorunuyor.
sys_expe_time_slow_2: >-
  Kirmizi dev ruzgari nedeniyle atlama bozuldu. Bunun disinda herhangi bir kesif
  hatasi yok. Ancak Yildizlar arasinda bosluk mevcut. Bu bizi
  yavaslatacaktir.Kirmizi dev ruzgari ilk defa duyuyorum
sys_expe_time_slow_3: >-
  Efendim hic bir sey bulamadik, hic bir sey, ekibin morali bozuk, biz biraz bi
  yerde duraklayip demlenecegiz. Beklenenden biraz daha gec gelecegiz
sys_expe_time_slow_4: >-
  Garip bir radyoaktif serpinti gunes sistemindeyken kesif filosunu felc etti.
  Asil garip olan filo sistemlerimize olan virus etkisi oldu. Bu durum zaman
  malesef ki zaman kaybi.
sys_expe_time_slow_5: >-
  Yeni navigasyon modulu buyuk bir basarisizlikla sonuclandi. Kesif ekibi yanlis
  bir yola girdi. Hatta tum deuterium gereksiz yere atlama icin harcandi. Simdi
  hayal kirikligi ile geri donuluyor. Bu durum biraz zaman alabilir
sys_expe_time_slow_6: >-
  Kirmizi devin yildiz ruzgari yuzunden kesif filonun sicramasi o derece
  etkileniyor ki, geri donusun sadece hesaplanmasi bile inanilmaz zaman aliyor.
  Ayrica kesfin yapildigi yerde yildizlar arasindaki bosluktan baska bir sey
  yoktu.
