sys_expe_attack_1_1_1: >-
  Filo Komutani Bildiriyor : Kesif filolarimiz Griler irki ve onun gemileri ile
  karsilasti. Onlar kayitsiz sartsiz filomuzu teslim etmeyi talep ettiler.
  Lutfen ciddi olun. Onlar bizim gemilerimizi alamazlar efendim. Savasmamiz
  gerek.
sys_expe_attack_1_1_2: >-
  Ilkel bir barbar kabilesi filomuza saldirdi. Ama endise edecek birsey yok,
  ilkel silahlari ile hicbir zarar veremediler. karsi ates acma ihtiyaci bile
  hissetmedik.
sys_expe_attack_1_1_3: >-
  Sarhos uzay korsanlarina ait oldugunu dusundugumuz bazi sinyaller yakaladik.
  Gorunuse gore savasmak zorunda kalacagiz.
sys_expe_attack_1_1_4: Bazi korsanlara karsi savastik. Cok sukur sayica bizden cok azlardi.
sys_expe_attack_1_1_5: >-
  Kendine Taksim Korsanlari diyen bir gurup kosulsuz olarak teslim olmamimizi
  istedi. Eger tehlike arzettiklerini dusunsek ates acardik ve kendimizi ne
  kadar iyi savunabildigimizi gorurlerdi..
sys_expe_attack_1_2_1: Kesif filomuzun onu uzay korsanlari tarafindan kesildi. Savasmak zorundayiz
sys_expe_attack_1_2_2: Filomuz bazi uyzay korsanlari tarafindan pusuya dusuruldu. Savas kacinilmaz
sys_expe_attack_1_2_3: Diger kesif filosundan gelen yardim cagrisi bir tuzakmis. Savasmak zorundayiz
sys_expe_attack_1_3_1: >-
  Yakaladigimiz sinyaller meger bilinmeyen bir turden gelmiyormus. Bir korsan
  ussunden geliyormus. Tabi ki korsanlar bolgelerinde bizi gormekten pek hosnut
  olmadilar.
sys_expe_attack_1_3_2: Bazi korsanlara karsi savastik. Cok sukur sayica bizden cok azlardi.
sys_expe_attack_1_3_3: >-
  Keşif Komutanından acil bir mesaj aldık: "Bir cisim yaklaşıyor! Uzay
  boşluğundan fırlayarak geldiler. Ohh Neyseki sadece lanet uzay korsanlarıymış.
  Şansımızı denemeliyiz, savaşacağız!
