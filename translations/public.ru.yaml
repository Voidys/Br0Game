registerWelcomePMText: >-
  Добро пожаловать в %s! Первым делом постройте солнечную электростанцию​​,
  потому что энергия необходима для последующего производства ресурсов. Для
  этого нажмите кнопку "Постройки" в левом меню. Затем постройте четвёртое
  здание сверху. Теперь у Вас есть энергия, Вы можете начать строить шахты.
  Вернитесь в меню "Постройки" и постройте шахту металла, затем шахту кристалла.
  Чтобы строить корабли Вам нужно сначала построить Верфь. Что для этого нужно
  Вы найдёте в левом меню "Технологии". Команда проекта желает вам много
  удовольствия в исследовании Вселенной!
