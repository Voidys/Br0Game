home_meme_alt_deep_space_transit: "Комикс: два кадета в шаттле – один поникает при виде поля астероидов, другой улыбается светящейся туманности. «Обычное патрулирование сектора vs. поиск неисследованной туманности, богатой ресурсами.»"
