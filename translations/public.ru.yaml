home_meme_alt_enemy_fleet: "Комикс: кадет в панике хватается за голову под мигающими сигналами тревоги – «1000 вражеских Уничтожителей на подходе?! Я думал, этот сектор безопасен?!»"
home_meme_alt_fleet_decimated: "Комикс: контуженный солдат смотрит перед собой, а за разбитым куполом взрываются корабли – «Когда 20 часов фармишь ресурсы, а потом прилетает флот игрока из топ-3 и за 3 секунды всё разносит.»"
home_meme_alt_solo_scouting: "Комикс: командир Камиока ухмыляется и кладёт роботизированную руку на плечо кадета – «Не волнуйся, кадет. Верховное командование „полностью“ уверено в твоей одиночной разведмиссии в космос.»"
home_meme_alt_this_is_fine: "Комикс: пёс в скафандре спокойно сидит в горящем командном центре и говорит «This is fine» – «Не волнуйся. Мой флот опаздывает всего на 4 часа.»"
