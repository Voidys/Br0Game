bonus:
  Attack: Atak
  BuildTime: Czas budowy
  Defensive: Obrona
  DefensiveTime: Czas budowy obrony
  Energy: Produkcja energii
  Expedition: Ekspedycje
  FleetSlots: Ilość możliwych flot
  FlyTime: Czas lotu
  GateCoolTime: Czas ładowania teleportera
  MoreFound: Zasoby znajdowane podczas ekspedycji
  Planets: Ilość planet
  ResearchTime: Czas badań
  Resource: Prędkość wydobycia
  ResourceStorage: Wielkość magazynów
  Shield: Osłona
  ShipStorage: Ładowność floty
  ShipTime: Czas budowy okrętów
  SpyPower: Moc szpiegowania
longDescription:
  '1': >-
    Metal to podstawowy budulec na twojej planecie. Dzięki rozwojowi kopalni
    możesz go wydobywać z głębszych pokładów, gdzie jest go więcej!
  '2': >-
    Podstawowy budulec elementów elektronicznych. Kopalnie wymagają więcej
    energii niż metal, bo obróbka kryształu jest bardziej skomplikowana.
    Kryształ jest potrzebny wszędzie tam, gdzie mamy do czynienia z elektroniką,
    poczynając od fabryki robotów, a na najmniejszych statkach kończąc.
  '3': >-
    Deuterium jest zwane również ciężką wodą. Służy jako paliwo, jest również
    potrzebny do niektórych badań. Poza tym potrzebujesz dużych jego ilości, by
    móc używać Falangi.
  '4': >-
    Gigantyczne panele słoneczne zbierają i koncentrują energię. Wraz z rosnącym
    poziomem, ilość paneli zwiększa się, dzieki czemu produkcja energii również
    rośnie.
  '6': Z każdym poziomem skraca czas badań o 8%.
  '12': >-
    W elektrowniach jądrowych jądra ciężkiego wodoru łączą się tworząc jądra
    helu. Podczas tego procesu wydzielają się niesamowite ilości ciepła i
    energii. Z jednego grama Deuterium produkujesz 41,32*10^-13 J energii. Im
    wiekszy poziom rozbudowy reaktora, tym więcej energi produkuje na godzinę.
  '14': >-
    Fabryka robotów dostarcza podstawowej siły roboczej na twojej planecie. Z
    każdym levelem wzrasta szybkość budowy budynków.
  '15': >-
    Zwieńczenie rozwoju robotyki. Z każdym levelem rośnie szybkośc produkcji
    budynków, statków i struktur obronnych.
  '21': >-
    Stocznia służy do budowy struktur obronnych i statków. Im bardziej
    rozbudowana, tym większe statki mogą być budowane. Rozbudowa ma również
    spory wpływ na prędkość budowy.
  '22': >-
    Służy do przechowywania podstawowego budulca, czyli metalu. Jeśli jest
    pełny, produkcja na planecie zostaje wstrzymana, a więc warto pilnować, by
    był odpowiednio rozbudowany.
  '23': >-
    Służy do przechowywania kryształu. Jeśli jest pełny, produkcja na planecie
    zostaje wstrzymana, a więc warto pilnować, by był odpowiednio rozbudowany.
  '24': >-
    Służy do przechowywania deuterium. Jeśli jest pełny, produkcja na planecie
    zostaje wstrzymana, a więc warto pilnować, by był odpowiednio rozbudowany.
  '31': >-
    Esencja każdego Imperium. To w nim powstają najprostsze badania i tam są
    rozwijane. Od poziomu zależy długość badań, jak również przedmioty, które
    możesz zbadać.
  '33': >-
    Wraz z rozwojem twojej planety w końcu staniesz przed problemem
    przepełnienia. Na planecie nie będzie więcej miejsca na budowę. Rozwiązaniem
    tego problemu są terraformery.
  '34': >-
    Depozyt pozwala zaopatrywać sojuszniczą flotę stojącą na orbicie w paliwo.
    Każdy level zwiększa ilość dostarczanego paliwa o 10 000 deuterium.
  '35': >-
    Dok naprawczy daje możliwość naprawy zniszczonych statków, które opuściły
    pole wraku w wyniku walki. Czas naprawy wynosi maksymalnie 12 godzin, przy
    czym do oddania statków do użytku potrzeba co najmniej 30 minut.<br>Od
    momentu powstania pola wrakowego pozostały 3 dni na rozpoczęcie naprawy.
    Naprawione statki muszą zostać aktywnie przywrócone do eksploatacji po
    zakończeniu naprawy. Jeśli tak się nie stanie, automatycznie wrócą do użytku
    po 3 dniach.
  '41': >-
    Z powodu braku atmosfery na księżycu musisz najpierw zbudować bazę
    księżycową, by dostarczyła tlenu i miejsca na budowę.
  '42': >-
    Falanga czujników analizuje spektrum światła i gazów w swoim zasięgu, a
    potem superkomputer dostarcza danych na temat aktywnie przemieszczających
    się flot. Jednorazowe skanowanie przestrzeni w zasięgu falangi kosztuje 5k
    Deuterium. Zasięg falangi liczymy tym wzorem =(level falangi) ^ 2 - 1.
  '43': >-
    Olbrzymie wrota zwane teleporterem pozwalają na transport ogromych flot
    natychmiast i to nie tracąc deuterium. Po każdym użyciu teleporter musi się
    zregenerować, by można go było użyć ponownie. Niestety nie da się tą drogą
    przesyłać surowców.
  '44': >-
    Służy do budowy rakiet i antyrakiet. Każdy level pozwala przechowywać 5
    antyrakiet lub 2 rakiety i 1 antyrakietę. Np. na poziomie 10 możesz mieć
    maksymalnie 50 antyrakiet lub 25 rakiet.
  '106': >-
    Od poziomu tej technologii zależy, jakie dane uda Ci się zebrać o twoim
    celu. Jeśli przeciwnik ma większy level technologii szpiegowskiej, wtedy
    musisz wysłać więcej sond, by uzyskać maksymalną ilość danych na temat
    twojego przeciwnika. Większa ilość sond zwiększa szansę ich wykrycia i
    zniszczenia. Od poziomu 2 dostaniesz informacje ile jednostek cię atakuje,
    od levelu 4 dowiesz się również jakie typy statków, a od levelu 8 informacje
    będą pełne, czyli ile i jakie typy statków są agresorami.
  '108': >-
    Ta technologia kontroluje dokładne czasy przylotu, trajektorię lotu itp.
    Każda flota, którą wyślesz, zajmuje część zasobów(slot). Powinieneś stale
    rozwijać tą technologię, by móc wysyłać więcej flot jednocześnie.
  '109': >-
    Kluczowa technologia bojowa. Każdy level zwiększa skuteczoność stystemów
    bojowych o 10% wartości bazowej!
  '110': >-
    Kolejna technologia bojowa. Każdy level zwiększa skuteczność systemów osłon
    o 10% wartości bazowej.
  '111': >-
    Technologia cywilno-bojowa. Opancerzenie chroni w przestrzeni przed
    promieniowaniem, jak również zmniejsza szkody podczas walki. Z każdym
    levelem zwiększa się jakość stopów metalu, jak i jego rodzaj, co skutkuje
    wzrostem wytrzymałości pancerza o 10% wartości podstawowej.
  '113': >-
    Wszystko co budujesz, poczynając od struktur obronnych, budynków i statków,
    wymaga energii. Wraz z rozwojem tej technologii możesz używać i produkować
    bardziej zaawansowane jednostki, wymagające różnych rodzajów energii.
  '114': >-
    Teoria podróży nadprzestrzennych opiera się na istnieniu wymiarów
    przyległych. A lot wygląda tak, iż w jednym miejscu statek wchodzi w
    nadprzestrzeń, a w innym wychodzi, co zajmuje znacznie mniej czasu niż
    tradycyjny lot. Wraz z rozwojem tej technologii teoria zmiania się w
    praktykę.
  '115': >-
    Mimo iż to stara technologia, wciąż jeszcze jest używana. Każdy poziom
    rozwoju tej technologi skutkuje zwiększeniem prędkości statków
    korzystających z tego typu napędu o 10% wartości bazowej. Mały transporter,
    duży transporter, sonda szpiegowska, jak i lekki myśliwiec korzystają z tej
    technologii.
  '117': >-
    Napęd ten zazwyczaj składa się z rekatora, zespołu przetworników i dyszy
    napędowej. Dzieki zmieniszeniu strat między reaktorem a dyszami i
    usprawnieniu pracy przetworników, statki korzystające z tego typu napędu
    mogą poruszać się 20% szybciej predkości bazowej. Jako, iż ten napęd jest
    również używany do napędzania rakiet międzyplanetarnych, każdy level
    zwiększa ich zasięg. Bąmbowiec, krążownik, ciężki myśliwiec i kolonizator
    korzystają z tego napędu.
  '118': >-
    Wraz z rowojem technologi nadprzestrzennej powstał właśnie taki oto napęd,
    który zakrzywia czasoprzestrzeń wokół jednostki. Dzieki wypaczeniu
    czasoprzestrzeni podróż na odległość 1000 lat świetlych została skrócona
    zaledwie do godziny. Każdy level zwiększa predkość statków korzystających z
    tego napędu o 30% wartości bazowej.
  '120': >-
    Lasery są używane w bardzo wielu dziedzinach w twoim imperium, poczynając od
    komunikacji, gdzie komputery przekształcają wiązkę w czytelny sygnał, po
    przekazywanie energii na planetę, a kończąc na takim skoncentrowaniu wiązki,
    by była mordercza.
  '121': >-
    Skoncentrowana wiązka jonów rozpędzona przez akcelelatory wyrządza znaczne
    szkody przy uderzeniu w cel.
  '122': >-
    Na świecie są 4 stany skupienia: stały, ciecz, gaz i plazma. Technologia
    plazmowa to zwieńczenie technologii jonowej, gdzie poprzez dalszy rozwój
    akcelalatorów i ściśnięcie atomów powstaje plazma, która uderzając w cel
    wyrządza ogromne szkody.
  '123': >-
    Naukowcy z różnych planet komunikują się ze sobą przez tę sieć. Wraz z
    rozbudową na kolejny poziom, do sieci zostanie przyłączone dodatkowe
    laboratorium, przy czym przyłączane będą zawsze laboratoria o najwyższym
    poziomie.
  '124': >-
    Dzięki modułowi badawczemu astrofizyki statki mogą podejmować długie
    ekspedycje. Każdy drugi poziom tej technologii (począwszy od poziomu 1)
    pozwala skolonizować dodatkową planetę. Możesz także wysyłać więcej
    ekspedycji w głąb kosmosu.<br><br><li>Poziom 1-3 - 1
    ekspedycja</li><li>Poziom 4-8 - 2 ekspedycje</li><li>Poziom 9-15 - 3
    ekspedycje</li><li>Poziom 16-24 - 4 ekspedycje</li>
  '131': Zwiększa produkcję metalu o 2%.
  '132': Zwiększa produkcję kryształu o 2%.
  '133': Zwiększa produkcję deuterium o 2%.
  '134': Zmniejsza koszty lotu o 2%
  '199': >-
    Grawiton to cząstka elementarna, która pośredniczy w tworzeniu grawitacji w
    ramach kwantowej teorii pola. Grawitony są cząstkami, które same w sobie nie
    mają masy. Rozwój grawitonów jest potrzebny tylko dla jednej technologii -
    pozwala budować Gwiazdę śmierci!
  '202': >-
    Pierwszy statek zbudowany przez cesarza, który ma ładowność 5000 jednostek.
    Służy na początku do tranportu zasobów między koloniami, a z czasem bierze
    udział w napadach na wrogie planety. Od piątego poziomu napędu impulsowego
    korzysta z niego również mały transportowiec, dzięki czemu porusza się 2x
    szybciej.
  '203': >-
    To nastepca małego transportowca. Wyposażony w lepszy typ napędu, dużo
    bardziej pojemny, lepiej opancerzony. Bierze udział w wiekszości napadów na
    wrogie planety.
  '204': >-
    Pierwsze jednostki wojskowe. Są małe i zwinne, ale bardzo słabe, dopiero
    spora ich ilość potrafi być zagrożeniem. Wykorzystywane do ataku na słabo
    bronione pobliskie planety.
  '205': >-
    Następca swojego poprzednika. Lepiej opancerzony i uzbrojony. Jednak to
    wciąż słaba jednostka.
  '206': >-
    Wraz z rozwojem dział laserowych i jonowych narodził się Krążownik. Swojego
    czasu był Panem przestworzy. Ponad 2x lepiej opancerzony i uzbrojony od
    ciężkiego myśliwa, a do tego piekelnie szybki. Niestety w raz z rozwojem
    dział gaussa ich czas się skończył. Dziś wciąż można je spotkać jako
    wsparcie, ze względu na ich szybkość również jako rajdery.
  '207': >-
    Gdy okazało się, iż straty z ataków są niewspółmiernie wielkie do zysków,
    powstał on. Uzbrojony w wielorzędowe działa, mocno opancerzony i dysponujący
    dużą ładownością za sprawą zastosowania napędu nadprzestrzennego, stał sie
    trzonem nowoczesnej floty.
  '208': >-
    Ten dobrze opancerzony statek służy do podbijania nowych planet, co jest
    niezbędne dla powstającego imperium. Statek jest wykorzystywany jako
    dostawca surowc&oacute;w dla nowej kolonii, po ponownym rozebraniu go na
    części i wykorzystaniu wszystkich materiał&oacute;w nadających się do
    recyklingu do budowy nowego świata. Liczba planet nadających się do
    kolonizacji w imperium jest bezpośrednio zależna od badań astrofizycznych.
    Pierwszy poziom, a także każdy kolejny drugi poziom, pozwalają na dalszą
    kolonizację.
  '209': >-
    Okręt wyspecjalizowany w zbieraniu tego, co zostaje po kosmicznych bitwach,
    czyli metalu i krzystału z pól zniszczeń. Rozwój oficera ładowności okrętów
    zwiększa ich maksymalną ładowność do 2 Mln.
  '210': >-
    To małe jednostki bezzałogowe, wyspecjalizowane w dostarczaniu danych o
    wrogich planetach. Pomimo tego, iż są bardzo szybkie i małe, czasem zostają
    wykryte i zniszczone.
  '211': >-
    Gdy zauważono, iż niektóre planety zamist floty bronią się straszną ilością
    struktur obronnych, stworzono go, by był w stanie szybko je niszczyć.
  '212': >-
    Z powodu coraz wiekszego zapotrzebowania na energię powstały one -
    niewielkie, ale bardzo wydajne, a do tego tanie. Umieszczone na wysokich
    orbitach przekazują zgromadzoną energię na planetę za pomocą zaawansowanych
    laserów. Nie posiadają obrony, więc w trakcie walki na orbicie planety
    bardzo często są niszczone!
  '213': >-
    Niszczyciel to wynik wielu lat pracy i rozwoju. Wraz z rozwojem Gwiazd
    śmierci zdecydowano, iż potrzebne jest coś, co by chociaż troche mogło im
    się przeciwstawić. Ciężki pancerz, wielorzędowe działa jonowe, gaussa, jak i
    plazmowe sprawiły, iż jest to jeden z najbardziej przerażających statków,
    jakie się pojawiły w tym świecie. Niestety, jego rozmiary sprawiają, iż jest
    strasznie deuterożerny.
  '214': >-
    Niszczycielska siła Giazd śmierci nie ma sobie równych! Jest tak duża, że
    może niszczyć księżyce!
  '215': >-
    Najbardziej zaawansowany statek we wszechświecie, szczególnie groźny, kiedy
    stają naprzeciwko siebie floty. Odpowiednia ilość jest w stanie zadecydować
    o zwycięstwie. Dzięki poprawie dział laserowych i lepszemu napędowi
    prawdopodobnie zostanie następcą Okretu wojennego. Niestety jego pojemność
    jest bardzo ograniczona, chociaż częściowo jest to kompensowane przez
    niewielkie zużycie paliwa.
  '216': >-
    Dark Moon to w pewnym sensie następca Gwiazdy śmierci. Niestety, kosztem
    szybkości zatracił możliwość niszczenia księżyców, jak i ustępuje gwieździe
    siłą ognia.
  '217': >-
    Powstał dzięki potrzebie transportu większych ładunków, jak również
    szybszego transportu.
  '218': >-
    Można powiedzieć, iż to przedstawiciel koszmaru na tym świecie, niestety
    strasznie powolny.
  '219': >-
    Ogromna ładowność, a dzięki nowym technologiom porusza się znacznie szybciej
    od standardowego recyklera.
  '220': >-
    Stalowy Kolos to prawdziwa forteca w kosmosie, chroniona przez
    nieprzeniknione tarcze i potężny pancerz. Nawet najpotężniejsze ataki
    odbijają się od niego, gdy nieubłaganie sunie naprzód. Jednak ta obrona ma
    swoją cenę: jego uzbrojenie jest niemal symboliczne, a powolne silniki
    czynią go ociężałym gigantem. Zamiast błyskawicznych ataków i zwrotnych
    manewrów, Stalowy Kolos stawia na czystą wytrzymałość. Kto chce go
    zatrzymać, musi uzbroić się w cierpliwość – lub dysponować miażdżącą siłą
    ognia.
  '221': >-
    Burzowe Ostrze to myśliwiec najwyższej klasy: niesamowicie szybki i
    bezlitośnie uzbrojony. Jego przeciwnicy ledwo go dostrzegą, zanim uderzy.
    Obrona jest sprawą drugorzędną – nie musi wytrzymywać, skoro może po prostu
    ominąć zagrożenie. Jego jedynym celem są transportowce i floty recyklerów,
    które niszczy bez żadnego oporu. Dzięki oszałamiającej prędkości może
    uderzyć w dowolnym momencie i zniknąć, zanim nadejdzie pomoc. Kto znajdzie
    się na celowniku Burzowe Ostrze, nie ma większych szans na ucieczkę.
  '222': >-
    Ciężki Krążownik to wzmocniona wersja standardowego krążownika. Dzięki
    ulepszonym tarczom i potężnemu uzbrojeniu może stawić czoła ciężkim
    przeciwnikom. Najlepiej sprawdza się w towarzystwie Stalowych Kolosów,
    Niszczycieli i Bombowców, gdzie jego siła ognia błyszczy. Mimo swojej potęgi
    pozostaje jednak powolny i mało zwrotny.
  '223': >-
    Dron Tarczy to nowatorskie podejście w obronie floty, które koncentruje się
    na maksymalnej ochronie załogi. Innowacyjne, lecz ciężkie technologie
    ochronne znacząco wpłynęły na prędkość lotu i zwrotność. Pomimo słabej
    prędkości i manewrowości, dron jest bardzo skuteczny w obronie. Stara
    konstrukcja została wykorzystana do granic możliwości, aby zapewnić niemal
    nieprzeniknioną obronę.
  '224': >-
    Improwizowany Transporter Szturmowy to niezbadany pojazd transportowy,
    wyposażony w minimalne uzbrojenie, zaprojektowany specjalnie do zakłócania
    spokoju nieostrożnych i nieprzygotowanych sąsiadów. Ten improwizowany pojazd
    nie jest przeznaczony do długotrwałego użytkowania, a raczej do szybkich,
    impulsywnych ataków, które wywołują natychmiastowe reakcje. Konflikt z
    sąsiadami jest praktycznie gwarantowany, gdy tylko pojazd zostanie użyty.
    Dzięki ograniczonemu uzbrojeniu i nieprzewidywalnej naturze staje się
    niebezpiecznym narzędziem do szybkiej eskalacji konfliktów.
  '225': >-
    Transporter Burzowy to prawdziwe dzieło techniki, które oferuje doskonałą
    równowagę pomiędzy siłą bojową, prędkością i pojemnością transportową. Jego
    zdolność do szybkiego przemieszczania wojsk i zasobów, jednocześnie
    zapewniając imponującą siłę ognia na polu bitwy, sprawiła, że stał się
    niezastąpionym elementem każdej potężnej floty. Niezależnie od tego, czy
    jest używany do szybkich jednostek szturmowych, czy wspiera długoterminowe
    operacje, Transporter Burzowy jest kluczem do skutecznej wojny i nie może
    zabraknąć w żadnej flocie.
  '226': >-
    Kolosalny Transporter Bitewny to szczyt inżynierii. Pomimo nieco masywnego
    designu i wynikającej z tego powolnej prędkości lotu, jest to najbardziej
    opancerzony transporter bitewny, jaki kiedykolwiek widziała flota. Jego
    miażdżąca siła ognia czyni go niepowstrzymaną siłą na polu bitwy. Ten kolos
    jest w stanie łatwo przełamać linie wroga, zapewniając jednocześnie
    maksymalną ochronę dla swojej załogi. Jest to ucieleśnienie siły i
    odporności, stanowiące nieoceniony element każdej ciężko uzbrojonej floty.
  '227': >-
    Ulepszony Recykler to nowoczesna wersja standardowego recyklera. Dzięki
    wydajnemu napędowi impulsowemu może szybciej i taniej docierać do pól
    szczątków, co czyni go nieocenionym statkiem dla każdej zaawansowanej floty.
    Jego zoptymalizowana konstrukcja obniża koszty produkcji i zwiększa
    efektywność odzyskiwania surowców. Dostępny od midgame, zapewnia
    strategiczną przewagę dla każdego rozwijającego się imperium.
  '228': >-
    Omega Recykler to szczyt technologii recyklingu – ale za wysoką cenę. Dzięki
    potężnemu napędowi nadprzestrzennemu dociera do pól szczątków w rekordowym
    czasie i odzyskuje surowce szybciej niż jakikolwiek inny statek. Jednak ta
    prędkość obniża jego efektywność: koszty budowy i paliwa są ogromne, co
    sprawia, że jest to opcja tylko dla bogatych dowódców w późnej fazie gry.
    Dla tych, którzy cenią szybkość ponad oszczędność, to ostateczny recykler.
  '401': >-
    Twoja pierwsza linia obrony. Po walce i zniszczeniu jest 70% szans, że
    zostanie naprawiona.
  '402': >-
    Wiązki laserowe dzięki specjalnym systemom namierzania i podążania za celem
    są kierowane tak, by przebijać kadłub. Po walce i zniszczeniu jest 70%
    szans, że zostanie naprawiona.
  '403': >-
    Ciężki laser to ulepszona wersja lekkiego. Po walce i zniszczeniu jest 70%
    szans, że zostanie naprawiona.
  '404': >-
    Działo gaussa strzela ogromnymi metalowymi pociskami, siejącymi straszne
    zniszczenia. Po walce i zniszczeniu istnieje 70% szans, że zostanie
    naprawione.
  '405': >-
    Działo jonowe strzela skoncentrowaną wiązką jonów naładowanych dodatnio lub
    ujemnie. Po walce i zniszczeniu istnieje 70% szans, że zostanie naprawione.
  '406': >-
    Wyrzutnia plazmy. Z powodu jego zapotrzebowania na energię jest zasilane
    dużym reaktorem jądrowym. Po walce i zniszczeniu istnieje 70% szans, że
    zostanie naprawione.
  '407': >-
    Mała osłona roztacza nad planetą ochronę, która pochłania cześć obrażeń. Po
    walce i zniszczeniu istnieje 70% szans, że zostanie naprawiona.
  '408': >-
    Duża osłona to wynik wielu lat rozwoju małej osłony. Jest w stanie wytrzymać
    dużo wiekszy ostrzał wroga. Po walce i zniszczeniu istnieje 70% szans, że
    zostanie naprawiona.
  '409': >-
    Szczyt badań nad osłonami. Jest dużo bardziej wytrzymała niż duża, ale jej
    zapotrzebowanie na energię też jest duże! Po walce i zniszczeniu istnieje
    70% szans, że zostanie naprawiona.
  '410': Jak nazwa wskazuje to broń grawitonowa, używana na Gwieździe śmierci.
  '411': >-
    To nieruchoma stacja obronna, niepotrzebująca zasilania z zewnatrz. Jej
    budowa wymaga znacznych ilości energii. Jest tak gigantyczna, iż możesz mieć
    tylko jednego takiego potwora.
  '412': >-
    Bunkier to silnie ufortyfikowana konstrukcja zaprojektowana tak, by
    wytrzymać nawet najpotężniejsze ataki. Zapewnia on niezrównaną ochronę
    mieszkańcom planety oraz kluczowej infrastrukturze, co czyni go fundamentem
    obrony planety.
  '413': Laser „Titan” to potężna broń o niezrównanej sile rażenia.
  '414': >-
    „Decoy” to zaawansowany system obronny, którego zadaniem jest wprowadzanie w
    błąd i dezorientowanie sił wroga. Przebierając się za wyrzutnię rakiet,
    odstrasza on ataki.
  '502': Służa do przechwytywania i niszczenia wrogich rakiet międzyplanetarnych.
  '503': Służy do niszczenia obrony na planecie. Ma wroga w postaci antyrakiet.
  '901': >-
    Główny surowiec do budowy konstrukcji nośnych budynków i statków
    kosmicznych. Metal jest najtańszym surowcem mineralnym, dlatego jest
    częściej wykorzystywany niż inne.
  '902': >-
    Główny surowiec do budowy elementów elektronicznych i stopów metali.
    Kryształy wykorzystywane są we wszystkich statkach kosmicznych i budynkach.
    Najczęściej używane w przemyśle stoczniowym kryształy są jednak bardzo
    rzadkie i podobnie jak metale znajdują się w większych ilościach w głębokich
    warstwach.
  '903': >-
    Deuter jest izotopem wodoru. Jego separacja z wody jest procesem zużywającym
    duże ilości energii. Deuter jest wykorzystywany jako paliwo dla statków
    kosmicznych, dla prawie wszystkich badań naukowych, do podglądu galaktyki
    jak i skanowania z wykorzystaniem falangi czujników.
  '911': >-
    Czysta energia napędzająca przemysł wydobywczy. Aby zapewnić zaopatrzenie
    kopalń i ekstraktorów, wymagane są ogromne ilości czystej energii. Prawie
    wszystkie budynki potrzebują energii do ich eksploatacji. Energia jest
    niewymienialna.
  "229": "Stworzona, by przełamać dominację Xerów, Żmija jest ostateczną bronią przeciwko Lekkim myśliwcom, Ciężkim myśliwcom i Krążownikom. Dzięki szybkostrzelnym działom i zaawansowanej technologii zmienia układ sił we wszechświecie."
  "230": "Szybki. Precyzyjny. Nietykalny. Przechwytywacz nie jest stworzony do uczciwych walk – został zaprojektowany, by uderzać szybko i mocno, zapewniając przytłaczającą przewagę w mgnieniu oka."
  "231": "Behemot jest owocem dziesięcioleci badań nad gravitonami, które połączono w bezlitosną platformę bojową. W przeciwieństwie do Gwiazd Śmierci nie został zaprojektowany do niszczenia planet, lecz do maksymalnej skuteczności na polu bitwy. Rezygnując z energochłonnych systemów potrzebnych do niszczenia księżyców, znacznie odchudzono jego konstrukcję, co pozwoliło na mocniejsze silniki, większą zwrotność i większą siłę ognia. Kompaktowe działo gravitonowe zmienia go w mobilną maszynę zniszczenia, zdolną samodzielnie unicestwić nawet ogromne floty."
  "232": "Tytan Pustki to szczyt nowoczesnej technologii gravitonowej. Każdy element jego konstrukcji służy jednemu celowi: szybkiej anihilacji wrogich księżyców. Konwencjonalne wieżyczki bojowe celowo pominięto, aby zmniejszyć masę i zrobić miejsce na kolosalne generatory kryształowe. Zasilają one najbardziej zaawansowane cewki przyspieszające, jakie kiedykolwiek zbudowano w znanych galaktykach, nadając statkowi niezrównaną mobilność. Ogromne zapotrzebowanie na kryształ sprawia, że każdy Tytan Pustki to monumentalne osiągnięcie przemysłowe – i symbol nieograniczonej siły niszczącej."
secureResources: >-
  W zależności od poziomu ulepszenia, 1% dziennej produkcji do maksymalnie 10%
  jest chronione przed grabieżą podczas ataków.
shortDescription:
  '1': >-
    Wydobywa Metal, kopalnie metalu mają podstawowe znaczenie dla twojego
    imperium!
  '2': Wydobywa Kryształ, potrzebny do budowy komponentów elektronicznych!
  '3': >-
    Deuterium jest wydobywane przez ekstraktor, służy jako paliwo oraz materiał
    budowlany.
  '4': >-
    Elektrownia słoneczna pobiera energie ze słońca. Wszystkie budynki wymagają
    energii!
  '6': Z każdym poziomem skraca czas badań o 8%.
  '12': Reaktor fuzyjny, dzieki fuzji deuteru, wytwarza energię!
  '14': >-
    Fabryka Robotów przyspiesza budowę. Im wyższy poziom, tym krócej trwa budowa
    i ulepszanie budynków.
  '15': >-
    Zwięczenie rozwoju robotyki. Każdy poziom zwiększa szybkość budowy statków,
    instalacji obronnych i budynków!
  '21': >-
    W stoczni budujesz instalacje obronne oraz wszystkie typy stacji. Im wyższy
    poziom, tym szybciej się je buduje!
  '22': Zwiększa ilość przechowywanego metalu.
  '23': Zwiększa ilość przechowywanego kryształu.
  '24': Zwiększa ilość przechowywanego deuterium
  '31': Konieczne do tego, by móc odkrywać nowe technologie.
  '33': >-
    Terraformer przez terraforming zwiększa ilość dostępnych pól do zabudowy na
    planecie.
  '34': Zasila w paliwo sojusznicza flotę na orbicie.
  '35': Dok naprawczy umożliwia odbudowę statków z pola wraków.
  '41': >-
    Jako iż na księżycu nie ma atmosfery, musisz najpierw zbudować bazę
    księżycową.
  '42': >-
    Falanga pozwala obrserwować aktywne floty w jej zasięgu. Każdy level
    zwiększa maksymalny zasięg.
  '43': Teleporter pozwala przenosić floty bez staraty cennego czasu!.
  '44': Używane do przechowywania rakiet i antyrakiet.
  '106': >-
    Dzięki tej technologi mogą być zbierane informacje o innych planetach i
    księżycach.
  '108': >-
    Dzięki rozwojowi technologi komputerowej możesz zarządzać większą ilością
    flot. Każdy level zwiększa ilość flot, którymi możesz zarządzać, o 1
    jednostkę.
  '109': >-
    Technologia broni podnosi efektywność używania broni. Każdy level zwiększa
    obrażenia o 10% wartości bazowej.
  '110': >-
    Technologia osłony podnosi efektywność wykorzystania osłon statków, jak
    również ich struktur obronnych. Każdy level zwiększa siłę osłony o 10%
    wartości bazowej!.
  '111': >-
    Specjalne stopy metalu zwiększają wytrzymałość opancerzenia. Każdy level
    zwiększa wytrzymałość opancerzenia o 10% wartości bazowej.
  '113': >-
    Znajomość wielu różnych rodzajów energii jest potrzebna dla nowych
    technologii.
  '114': >-
    Z połączenia 4 i 5 wymiaru udało się stworzyć napęd znacznie szybszy i
    bardziej efektywny.
  '115': >-
    Dalsze rozwijanie tego napędu sprawia, iż niektóre statki poruszają się 10%
    szybciej w porównaniu do prędkości bazowej.
  '117': >-
    Dalsze rozwijanie tego napędu sprawia, iż niektóre statki poruszają się o
    20% szybciej w porównaniu do prędkości bazowej.
  '118': >-
    Napęd nadprzestrzenny zagina przestrzeń wokół statku. Dalszy rozwój tego
    napędu sprawia, iż niektóre statki poruszają się o 30% szybciej w porównaniu
    do prędkości bazowej.
  '120': Poprawa koncentracji wiązki światła sprawia, iż zadaje ona obrażenia.
  '121': >-
    Działo jonowe przyśpiesza jony. Dzięki temu podczas uderzenia w obiekt
    wyrządzają one duże szkody.
  '122': >-
    Zwięczenie technologii jonowej. Jony są tak przyspieszone, iż wiązka zmienia
    się w plazmę. Zadaje olbrzymie obrażenia podczas uderzenia w cel.
  '123': >-
    Naukowcy z różnych planet komunikują się ze sobą przez tę sieć. Wraz z
    rozbudową na kolejny poziom, do sieci zostanie przyłączone dodatkowe
    laboratorium, przy czym przyłączane będą zawsze laboratoria o najwyższym
    poziomie.
  '124': >-
    Moduł astrofizyczny pozwala na kolonizację wiekszej ilości planet. Każdy
    nieparzysty poziom tej technologi zwiększa maksymalną ilość planet o 1.
    Astrofizyka zwiększa również ilość ekspedycji.<br><br><li>Poziom 1-3 - 1
    ekspedycja</li><li>Poziom 4-8 - 2 ekspedycje</li><li>Poziom 9-15 - 3
    ekspedycje</li><li>Poziom 16-24 - 4 ekspedycje</li>
  '131': Zwiększa produkcję metalu o 2%.
  '132': Zwiększa produkcję kryształu o 2%.
  '133': Zwiększa produkcję deuterium o 2%.
  '134': Zmniejsza koszty lotu o 2%
  '199': >-
    Skoncentrowane cząstki grawitonowe tworzą sztuczne pole grawitacji, które
    wciąga wszystko w siebie jak czarna dziura. Pole jest tak potężne, że może
    zniszczyć księżyc.
  '202': >-
    Mały transportowiec służy do szybkiego transportu surowców na pobliskie
    planety.
  '203': >-
    Duży transportowiec może zabrać nie tylko więcej surowców, ale również -
    dzięki lepszemu napędowi - jest znacznie szybszy.
  '204': >-
    Jest to pierwsza jednostka wojskowa, którą możesz zbudować. W początkowej
    fazie gry przydają się, by napadać pobliskie planety posiadające niewielką
    obronę. Mimo tego, że są stosunkowo słabe, są tanie, a icg duża ilość
    potrafi być groźna.
  '205': Następca lekkiego myśliwca, lepiej uzbrojony i opancerzony.
  '206': >-
    Krążownik nie dość, że dużo lepiej opancerzony od myśliwców, to jest jeszcze
    znacznie szybszy.
  '207': >-
    Okręty wojenne to trzon każdej floty. Ich ciężkie działa, duża szybkość i
    ładowność sprawia, że są niezastąpione.
  '208': Niezamieszkane planety skolonizujesz za pomocą tego statku.
  '209': >-
    Recyklery - jak nazwa wskazuje - zbierają złom, który powstaje po walkach
    flot.
  '210': >-
    Sondy szpiegowskie to małe, bezzałogowe, bardzo szybkie stateczki, które
    przekazują dane na temat wroga.
  '211': Bombowce służą do niszczenia obrony na planecie.
  '212': >-
    Satelity słoneczne to małe kolektory energii krążące na wysokiej orbicie.
    Przekazują energię na planetę za pomocą wiązki lasera. 
  '213': Niszczyciel to król statków wojennych.
  '214': >-
    Niszczycielska siła gwiazd śmierci nie ma sobie równych. Jest tak duża, że
    może niszczyć księżyce.
  '215': Ten typ statku ma tylko jeden cel - przechwycić i zniszczyć wrogą flotę.
  '216': Następca Gwiazdy śmierci. Szybszy, ale nie tak potężny.
  '217': >-
    Powstał dzięki potrzebie transportu większych ładunków i szybszego
    transportu.
  '218': >-
    Można powiedzieć, iż to przedstawiciel koszmaru na tym świecie, niestety
    strasznie powolny.
  '219': >-
    Ogromna ładowność, a dzięki nowym technologiom porusza się znacznie szybciej
    od standardowego recyklera .
  '220': >-
    Stalowy Kolos odpiera każdy atak dzięki potężnym tarczom i grubej pancernej
    osłonie, ale jego uzbrojenie i silniki pozostawiają wiele do życzenia.
  '221': >-
    Burzowe Ostrze to błyskawiczny myśliwiec, uzbrojony po zęby. Obrona?
    Niepotrzebna – jego celem są bezbronne transportowce i recyklery.
  '222': >-
    Wolny, ale silnie uzbrojony krążownik z ulepszonymi tarczami i zdolnościami
    ofensywnymi.
  '223': >-
    Nowa wersja lekkiego myśliwca, która zapewnia maksymalne bezpieczeństwo
    załogi kosztem słabych właściwości lotnych.
  '224': >-
    Niezbadany statek transportowy z minimalnym uzbrojeniem, zaprojektowany w
    celu zakłócania spokoju nieostrożnych sąsiadów i wywołania natychmiastowego
    konfliktu.
  '225': >-
    Statek, który łączy siłę bojową, prędkość i pojemność transportową, dzięki
    czemu jest niezastąpiony w każdej potężnej flocie.
  '226': >-
    Ogromnie opancerzony transporter bitewny o imponującym, nieco masywnym
    designie, którego miażdżąca siła ognia jest w stanie pokonać nawet
    najsilniejszych przeciwników.
  '227': >-
    Ulepszona wersja klasycznego recyklera z napędem impulsowym, umożliwiająca
    bardziej efektywne misje odzyskiwania przy niższych kosztach.
  '228': >-
    Ekstremalnie szybka, ale nieefektywna wersja Recyklera z napędem
    nadprzestrzennym.
  '231': >-
    Mniejsza i szybsza Gwiazda Śmierci, pozbawiona zdolności niszczenia
    księżyców. Najlepiej opisuje się „Behemota” jako śmiertelnie groźnego
    przeciwnika dla flot.
  '401': Wyrzutnia rakiet to podstawowa struktura obronna, tania i efektywna.
  '402': >-
    Wiązki laserowe - dzięki specjalnym systemom namierzania i podążania za
    celem - są kierowane tak, by przebijać kadłub.
  '403': Ciężki laser to ulepszona wersja lekkiego.
  '404': >-
    Działo Gaussa strzela ogromnymi metalowymi pociskami, siejącymi straszne
    zniszczenia.
  '405': >-
    Działo jonowe strzela skoncentrowaną wiązką jonów naładowanych dodatnio lub
    ujemnie.
  '406': >-
    Wyrzutnia plazmy, z powodu jego zapotrzebowania na energię, jest zasilane
    dużym reaktorem jądrowym.
  '407': >-
    Mała osłona roztacza nad planetą zabezpieczenie, które pochłania część
    obrażeń.
  '408': >-
    Jest to silniejsza wersja małej osłony, niestety wymaga również więcej
    zasobów energii.
  '409': >-
    Szczyt badań nad osłonami. Jest dużo bardziej wytrzymała niż duża, ale jej
    zapotrzebowanie na energię też jest duże!.
  '410': >-
    Po latach badań nad grawitonami stworzono działo strzelające polem
    elektormagnetycznym, wyrządzającym znaczne szkody.
  '411': >-
    To nieruchoma stacja obronna, niepotrzebująca zasilania z zewnątrz. Jej
    budowa wymaga znacznych ilości energii.
  '412': To chroni! Tak jak klocki Lego w grze „Kindergarten TD”
  '413': Laser „Titan” to gigantyczny laser.
  '414': Atrapa udaje wyrzutnię rakiet.
  '502': Antyrakiety przechwytują rakiety międzyplanetarne przeciwnika.
  '503': >-
    Międzyplanetarne rakiety. Ich jedynym celem jest niszczenie obrony
    przeciwnika.
  '901': >-
    Główny surowiec do budowy konstrukcji nośnych budynków i statków
    kosmicznych.
  '902': Główny surowiec do budowy elementów elektronicznych i stopów metali.
  '903': >-
    Deuter jest izotopem wodoru, paliwo dla statków kosmicznych, nawigatorów i
    naukowców.
  '911': Czysta energia napędzająca przemysł wydobywczy.
  "229": "Stworzona, by przełamać dominację Xerów, Żmija jest ostateczną bronią przeciwko Lekkim myśliwcom, Ciężkim myśliwcom i Krążownikom. Dzięki szybkostrzelnym działom i zaawansowanej technologii zmienia układ sił we wszechświecie."
  "230": "Szybki. Precyzyjny. Nietykalny. Przechwytywacz nie jest stworzony do uczciwych walk – został zaprojektowany, by uderzać szybko i mocno, zapewniając przytłaczającą przewagę w mgnieniu oka."
  "232": "Szybszy, bardziej wybuchowy, zawsze dobra niespodzianka. Tytan Pustki to postrach księżyców."
