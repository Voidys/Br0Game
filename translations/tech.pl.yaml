longDescription:
  '1': "Kopalnie metalu wydobywają rudę, na której opiera się każde rodzące się i ugruntowane imperium."
  '2': "Kryształ to kluczowy składnik układów elektronicznych i niektórych stopów. Jego wydobycie jest bardziej skomplikowane, więc kopalnia zużywa tyle samo energii co kopalnia metalu."
  '3': "Deuterium napędza twoje statki i jest wydobywane z głębin oceanu. To rzadka substancja, więc jest stosunkowo droga. Potrzebujesz go też do wielu badań oraz do skanowania Falangą."
  '4': "Elektrownie słoneczne zamieniają światło słoneczne w energię. Każda kopalnia potrzebuje energii do pracy."
  '6': "Domyślnie każdy poziom skraca czas badań o 8%."
  '12': "Elektrownia Jądrowa wytwarza energię, łącząc jądra deuterium. Daje jej więcej niż Elektrownia Słoneczna, ale drożej kosztuje. Produkcja rośnie wraz z Technologią Energetyczną i własnym poziomem elektrowni. Wzór na produkcję energii:<br> Wyprodukowana energia = 30 x poziom Elektrowni Jądrowej x (1,05 + (0,01 * poziom Technologii Energetycznej))^poziom Elektrowni Jądrowej"
  '14': "Fabryki Robotów dostarczają roboty budowlane, które pomagają przy budowie twoich budynków. Każdy poziom przyspiesza rozbudowę budynków."
  '15': "Szczyt robotyki. Każdy poziom skraca o połowę czas budowy budynków, statków i obrony."
  '21': "Wszystkie statki i obrona powstają w planetarnej Stoczni."
  '22': "Magazynuje nadwyżki Metalu."
  '23': "Magazynuje nadwyżki Kryształu."
  '24': "Magazynuje nadwyżki Deuterium."
  '31': "Do badania nowych technologii potrzebujesz Laboratorium Badawczego. Jego poziom decyduje o tempie badań i o tym, jakie technologie możesz odblokować. Badanie trwa w laboratorium na planecie, na której je zaczniesz, a efekt działa na wszystkie twoje planety. Gdy trwa badanie, żadnego Laboratorium Badawczego nie można rozbudować."
  '33': "Terraformer powiększa użyteczną powierzchnię planety. Każdy poziom daje 5 dodatkowych pól, a na każdym parzystym poziomie jeszcze jedno. Każdy poziom Terraformera zajmuje jedno pole.<br>Budowa wymaga energii, ale jej nie zużywa: twoja planeta musi tylko produkować jej wystarczająco dużo (1000 na poziomie 1, podwajane z każdym poziomem), nawet jeśli kopalnie już ją pobierają. Raz zbudowanego Terraformera nie da się już zburzyć."
  '34': "Depozyt Sojuszniczy obecnie nie działa w tej grze: przyjazne floty mogą stacjonować na twojej planecie bez niego, a zaopatrzenia w paliwo nie ma."
  '35': "Dok Naprawczy potrafi naprawić statki zniszczone w walce, które zostawiły pole wraków. Naprawa trwa najwyżej 12 godzin i nie może się zakończyć wcześniej niż 30 minut po pojawieniu się pola wraków.<br>Gdy pole wraków się pojawi, masz 3 dni na rozpoczęcie naprawy. Po jej zakończeniu musisz sam przywrócić statki do służby. Jeśli tego nie zrobisz, wrócą do służby automatycznie po 3 dniach."
  '41': "Księżyc nie ma atmosfery, a świeży księżyc ma miejsce tylko na jeden budynek, więc zacznij od Bazy Księżycowej. Każdy poziom daje 3 dodatkowe pola i sam zajmuje jedno. Raz zbudowanej Bazy Księżycowej nie da się już rozebrać."
  '42': "Falanga pozwala śledzić ruchy flot. Im wyższy poziom, tym większy zasięg: domyślnie (poziom Falangi)^2 - 1 układów, więc poziom 1 obejmuje tylko układ samego księżyca. Jedno skanowanie kosztuje 5000 deuterium, które musi być na księżycu. Żeby skanować, otwórz widok Galaktyki z księżyca i kliknij planetę w zasięgu. Samych księżyców Falangą skanować nie można, bo nie mają atmosfery.<br><br>Falanga pokazuje floty, które startują z skanowanej planety albo lecą do niej: moment przylotu, koniec postoju i powrót flot właściciela do domu. Przerzutów (stacjonowania) i rakiet nie widać nigdy, podobnie jak lotów recyklingowych i handlowych zmierzających na planetę."
  '43': "Teleportery to olbrzymie nadajniki, które przesyłają duże floty przez wszechświat bez straty czasu. Nie zużywają deuterium, ale tą drogą nie da się przesyłać surowców. Oba teleportery muszą być gotowe: po skoku każdy potrzebuje czasu na ostygnięcie, który domyślnie wynosi 60 minut na poziomie 1 i z każdym poziomem się skraca, aż do 10 minut od poziomu 15."
  '44': "Silosy rakietowe przechowują twoje rakiety. Domyślnie każdy poziom dodaje 10 miejsc. Antyrakieta zajmuje 1 miejsce, Rakieta Międzyplanetarna zajmuje 2."
  '106': "Ta technologia pozwala zbierać informacje o innych planetach i księżycach. Gdy wysyłasz sondy, twoja Technologia Szpiegowska jest porównywana z technologią celu: im wyższy twój poziom, tym więcej informacji w raporcie i tym mniejsza szansa na wykrycie sond. Więcej sond odsłania więcej szczegółów, ale zwiększa ryzyko wykrycia. Od określonych poziomów Technologii Szpiegowskiej dowiadujesz się też więcej o obcych flotach na ekranie Przeglądu:<br><br><li>Na poziomie 0-1 widzisz tylko, że flota zbliża się do twojej planety</li><li>Na poziomach 2-3 widzisz, ile statków nadlatuje</li><li>Na poziomach 4-7 widzisz, jakich typów statki są we flocie</li><li>Od poziomu 8 widzisz, ile statków każdego typu jest we flocie</li>"
  '108': "Lepsze komputery pozwalają dowodzić większą liczbą flot. Każdy poziom Technologii Komputerowej zwiększa maksymalną liczbę twoich flot o jeden."
  '109': "Technologia Broni zwiększa skuteczność systemów uzbrojenia. Każdy poziom podnosi siłę ognia wszystkich jednostek o 10% wartości bazowej."
  '110': "Technologia Osłony wzmacnia osłony statków i budowli obronnych. Każdy poziom zwiększa wytrzymałość osłon o 10% wartości bazowej."
  '111': "Specjalne stopy poprawiają pancerz statków i budowli obronnych. Każdy poziom zwiększa skuteczność pancerza o 10%."
  '113': "Opanowanie różnych rodzajów energii to klucz do wielu nowych technologii. Każdy poziom Technologii Energetycznej zwiększa też produkcję energii w Elektrowni Jądrowej."
  '114': "Dzięki połączeniu czwartego i piątego wymiaru możesz zbadać nowy rodzaj napędu, bardziej ekonomiczny i wydajny."
  '115': "Rozwój tego napędu przyspiesza część statków, ale każdy poziom dodaje tylko 10% prędkości bazowej. Dotyczy to: Małego Transportera, Dużego Transportera, Lekkiego Myśliwca, Recyklera i Sondy Szpiegowskiej (Mały Transporter i Recykler później przechodzą na lepsze napędy)."
  '117': "Napęd impulsowy działa na zasadzie odrzutu. Jego rozwój przyspiesza część statków, ale każdy poziom dodaje tylko 20% prędkości bazowej: Bombowiec, Krążownik, Ciężki Myśliwiec i Statek Kolonizacyjny, a także Mały Transporter i Recykler po przejściu na ten napęd. Rakiety międzyplanetarne też lecą z każdym poziomem dalej."
  '118': "Napęd nadprzestrzenny zakrzywia przestrzeń wokół statku. Jego rozwój przyspiesza część statków, ale każdy poziom dodaje tylko 30% prędkości bazowej: Pancernik, Okręt Wojenny, Niszczyciel, Gwiazda Śmierci, Dark Moon, Giga Transporter, Avatar i Gigarecykler, a także Bombowiec i Recykler po przejściu na ten napęd. Wymaga Technologii Nadprzestrzennej (poziom 3) i Laboratorium Badawczego (poziom 7)."
  '120': "Skupione światło tworzy wiązkę, która niszczy wszystko, w co uderzy. Wymaga Laboratorium Badawczego (poziom 1) i Technologii Energetycznej (poziom 2)."
  '121': "Śmiercionośna wiązka rozpędzonych jonów, która przy uderzeniu wyrządza ogromne szkody."
  '122': "Dalszy rozwój technologii jonowej: przyspiesza wysokoenergetyczną plazmę, powstałą z przegrzanych jonów. Przy uderzeniu działa niszcząco."
  '123': "Naukowcy z różnych planet porozumiewają się przez tę sieć. Każdy poziom pozwala dołączyć jedno kolejne laboratorium do laboratorium, w którym zaczynasz badanie. Wybierane są laboratoria o najwyższych poziomach, a laboratorium w sieci musi być na tyle rozwinięte, żeby samo mogło prowadzić to badanie. Ich poziomy są sumowane przy obliczaniu czasu badania."
  '124': "Astrofizyka odblokowuje kolonizację i ekspedycje w głąb kosmosu. Podany niżej limit kolonii, czas postoju i pozycje to ustawienia domyślne; twoje uniwersum może się różnić.<br><br> <li>Limit kolonii</li> Poziom 1-2 = 2 planety<br> Poziom 3-4 = 3 planety<br> Poziom 5-6 = 4 planety<br> Poziom 7-8 = 5 planet<br> Poziom 9-10 = 6 planet<br> Poziom 11-12 = 7 planet<br> Poziom 13-14 = 8 planet<br> Poziom 15-16 = 9 planet<br> Poziom 17-18 = 10 planet<br> Poziom 19-20 = 11 planet<br> Poziom 21+ = 12 planet<br><br> <li>Sloty ekspedycji</li> Poziom 1-3 = 1 ekspedycja<br> Poziom 4-8 = 2 ekspedycje<br> Poziom 9-15 = 3 ekspedycje<br> Poziom 16-24 = 4 ekspedycje<br>(kolejna na każdym następnym poziomie kwadratowym: 25, 36, ...)<br><br> <li>Czas postoju na ekspedycji</li> Poziom = maksymalny czas postoju w godzinach<br><br> <li>Pozycje do kolonizacji</li> Poziom 1-3 = 4-12<br> Poziom 4-5 = 3-13<br> Poziom 6-7 = 2-14<br> Poziom 8+ = 1-15"
  '131': "Zwiększa produkcję metalu o 2% na poziom."
  '132': "Zwiększa produkcję kryształu o 2% na poziom."
  '133': "Zwiększa produkcję deuterium o 2% na poziom."
  '134': "Zmniejsza koszty lotu o 2% na poziom."
  '199': "Wystrzał skoncentrowanego ładunku cząstek grawitonów tworzy sztuczne pole grawitacyjne, które potrafi niszczyć statki, a nawet księżyce. Wymaga Laboratorium Badawczego (poziom 12)."
  '202': "Mały Transporter to zwinny statek, który szybko przewozi surowce na inne planety.<br>Lata na napędzie spalinowym, dopóki twój Napęd Impulsowy nie osiągnie poziomu 5. Od tego momentu przechodzi na napęd impulsowy, który podwaja jego prędkość bazową."
  '203': "Ten transportowiec przewozi znacznie więcej niż Mały Transporter i dzięki ulepszonemu napędowi jest zwykle szybszy."
  '204': "Pierwszy okręt bojowy, jaki buduje każdy imperator. Lekki Myśliwiec jest zwinny, ale w pojedynkę bezbronny; w dużych ilościach staje się realnym zagrożeniem dla każdego imperium. To właśnie Lekkie Myśliwce jako pierwsze eskortują Małe i Duże Transportery na wrogie planety o słabej obronie."
  '205': "Ten myśliwiec ma lepszy pancerz i mocniej uderza niż Lekki Myśliwiec."
  '206': "Krążowniki mają prawie trzy razy mocniejszy pancerz niż Ciężkie Myśliwce i ponad dwa razy większą siłę ognia. Są też bardzo szybkie."
  '207': "Okręty Wojenne to trzon floty. Ciężkie działa, duża prędkość i pojemne ładownie czynią z nich przeciwników, z którymi trzeba się liczyć."
  '208': "Ten dobrze opancerzony statek zdobywa nowe planety, których potrzebuje rodzące się imperium. Na nowej kolonii statek jest rozbierany, a cały nadający się do odzysku materiał trafia na rozwój nowego świata. To, ile planet możesz skolonizować, zależy bezpośrednio od Astrofizyki: pierwszy poziom i każdy kolejny drugi pozwalają na jedną kolonię więcej (domyślnie)."
  '209': "Recykler zbiera surowce z pól zniszczeń. Jego ładowność to 20 000. Zaczyna na napędzie spalinowym, po osiągnięciu przez Napęd Impulsowy poziomu 17 przechodzi na napęd impulsowy, a gdy Napęd Nadprzestrzenny osiągnie poziom 15 – na napęd nadprzestrzenny."
  '210': "Sondy Szpiegowskie to małe, zwinne drony, które dostarczają dane o flotach i planetach na duże odległości."
  '211': "Bombowiec powstał specjalnie do niszczenia obrony planet.<br>Lata na napędzie impulsowym, a gdy Napęd Nadprzestrzenny osiągnie poziom 8, przechodzi na napęd nadprzestrzenny."
  '212': "Satelity Słoneczne to proste platformy z ogniwami słonecznymi na wysokiej, stacjonarnej orbicie. Zbierają światło słoneczne i przesyłają je laserem do stacji naziemnej."
  '213': "Niszczyciel to król okrętów wojennych. Przeciw Lekkim Laserom ma szybki ostrzał: po każdym trafieniu w 9 przypadkach na 10 oddaje kolejny strzał."
  '214': "Niszczycielska siła Gwiazdy Śmierci nie ma sobie równych, a do tego potrafi niszczyć księżyce."
  '215': "Pancernik specjalizuje się w przechwytywaniu wrogich flot."
  '216': "Następca popularnej Gwiazdy Śmierci: znacznie szybszy i wytrzymalszy, z ogromną ładownią, ale uderza nieco słabiej."
  '217': "Rozwinięcie Dużego Transportera ze znacznie większą ładownością. Lata na napędzie nadprzestrzennym, więc na starcie jest wolniejszy od Dużego Transportera, ale wyprzedza go wraz z kolejnymi poziomami Napędu Nadprzestrzennego."
  '218': "Absolutny najgorszy scenariusz, choć bardzo powolny."
  '219': "Ogromna ładownia i nowe silniki pozwalają mu latać szybciej i zbierać więcej z pól zniszczeń."
  '220': >-
    Stalowy Kolos to prawdziwa forteca w kosmosie, chroniona przez
    nieprzeniknione tarcze i potężny pancerz. Nawet najpotężniejsze ataki
    odbijają się od niego, gdy nieubłaganie sunie naprzód. Jednak ta obrona ma
    swoją cenę: jego uzbrojenie jest niemal symboliczne, a powolne silniki
    czynią go ociężałym gigantem. Zamiast błyskawicznych ataków i zwrotnych
    manewrów, Stalowy Kolos stawia na czystą wytrzymałość. Kto chce go
    zatrzymać, musi uzbroić się w cierpliwość – lub dysponować miażdżącą siłą
    ognia.
  '221': >-
    Burzowe Ostrze to myśliwiec najwyższej klasy: niesamowicie szybki i
    bezlitośnie uzbrojony. Jego przeciwnicy ledwo go dostrzegą, zanim uderzy.
    Obrona jest sprawą drugorzędną – nie musi wytrzymywać, skoro może po prostu
    ominąć zagrożenie. Jego jedynym celem są transportowce i floty recyklerów,
    które niszczy bez żadnego oporu. Dzięki oszałamiającej prędkości może
    uderzyć w dowolnym momencie i zniknąć, zanim nadejdzie pomoc. Kto znajdzie
    się na celowniku Burzowe Ostrze, nie ma większych szans na ucieczkę.
  '222': >-
    Ciężki Krążownik to wzmocniona wersja standardowego krążownika. Dzięki
    ulepszonym tarczom i potężnemu uzbrojeniu może stawić czoła ciężkim
    przeciwnikom. Najlepiej sprawdza się w towarzystwie Stalowych Kolosów,
    Niszczycieli i Bombowców, gdzie jego siła ognia błyszczy. Mimo swojej potęgi
    pozostaje jednak powolny i mało zwrotny.
  '223': >-
    Dron Tarczy to nowatorskie podejście w obronie floty, które koncentruje się
    na maksymalnej ochronie załogi. Innowacyjne, lecz ciężkie technologie
    ochronne znacząco wpłynęły na prędkość lotu i zwrotność. Pomimo słabej
    prędkości i manewrowości, dron jest bardzo skuteczny w obronie. Stara
    konstrukcja została wykorzystana do granic możliwości, aby zapewnić niemal
    nieprzeniknioną obronę.
  '224': >-
    Improwizowany Transporter Szturmowy to niezbadany pojazd transportowy,
    wyposażony w minimalne uzbrojenie, zaprojektowany specjalnie do zakłócania
    spokoju nieostrożnych i nieprzygotowanych sąsiadów. Ten improwizowany pojazd
    nie jest przeznaczony do długotrwałego użytkowania, a raczej do szybkich,
    impulsywnych ataków, które wywołują natychmiastowe reakcje. Konflikt z
    sąsiadami jest praktycznie gwarantowany, gdy tylko pojazd zostanie użyty.
    Dzięki ograniczonemu uzbrojeniu i nieprzewidywalnej naturze staje się
    niebezpiecznym narzędziem do szybkiej eskalacji konfliktów.
  '225': >-
    Transporter Burzowy to prawdziwe dzieło techniki, które oferuje doskonałą
    równowagę pomiędzy siłą bojową, prędkością i pojemnością transportową. Jego
    zdolność do szybkiego przemieszczania wojsk i zasobów, jednocześnie
    zapewniając imponującą siłę ognia na polu bitwy, sprawiła, że stał się
    niezastąpionym elementem każdej potężnej floty. Niezależnie od tego, czy
    jest używany do szybkich jednostek szturmowych, czy wspiera długoterminowe
    operacje, Transporter Burzowy jest kluczem do skutecznej wojny i nie może
    zabraknąć w żadnej flocie.
  '226': >-
    Kolosalny Transporter Bitewny to szczyt inżynierii. Pomimo nieco masywnego
    designu i wynikającej z tego powolnej prędkości lotu, jest to najbardziej
    opancerzony transporter bitewny, jaki kiedykolwiek widziała flota. Jego
    miażdżąca siła ognia czyni go niepowstrzymaną siłą na polu bitwy. Ten kolos
    jest w stanie łatwo przełamać linie wroga, zapewniając jednocześnie
    maksymalną ochronę dla swojej załogi. Jest to ucieleśnienie siły i
    odporności, stanowiące nieoceniony element każdej ciężko uzbrojonej floty.
  '227': >-
    Ulepszony Recykler to nowoczesna wersja standardowego recyklera. Dzięki
    wydajnemu napędowi impulsowemu może szybciej i taniej docierać do pól
    szczątków, co czyni go nieocenionym statkiem dla każdej zaawansowanej floty.
    Jego zoptymalizowana konstrukcja obniża koszty produkcji i zwiększa
    efektywność odzyskiwania surowców. Dostępny od midgame, zapewnia
    strategiczną przewagę dla każdego rozwijającego się imperium.
  '228': >-
    Omega Recykler to szczyt technologii recyklingu – ale za wysoką cenę. Dzięki
    potężnemu napędowi nadprzestrzennemu dociera do pól szczątków w rekordowym
    czasie i odzyskuje surowce szybciej niż jakikolwiek inny statek. Jednak ta
    prędkość obniża jego efektywność: koszty budowy i paliwa są ogromne, co
    sprawia, że jest to opcja tylko dla bogatych dowódców w późnej fazie gry.
    Dla tych, którzy cenią szybkość ponad oszczędność, to ostateczny recykler.
  '401': "Wyrzutnia Rakiet to prosta, ale opłacalna obrona. Po walce średnio około 70% zniszczonej obrony zostaje odbudowane."
  '402': "Lekkie lasery to proste naziemne działa. Specjalne systemy celownicze śledzą wroga, a wiązka lasera o wysokim natężeniu przecina kadłub celu. Po walce średnio około 70% zniszczonej obrony zostaje odbudowane."
  '403': "Ciężki Laser to praktyczna, ulepszona wersja Lekkiego Lasera. Po walce średnio około 70% zniszczonej obrony zostaje odbudowane."
  '404': "Działo Gaussa wystrzeliwuje metalowe pociski o dużej gęstości z ogromną prędkością. Po walce średnio około 70% zniszczonej obrony zostaje odbudowane."
  '405': "Działo Jonowe wystrzeliwuje wiązki jonów (cząstek naładowanych dodatnio lub ujemnie). Po walce średnio około 70% zniszczonej obrony zostaje odbudowane."
  '406': "Wyrzutnia Plazmy wykorzystuje duże ogniwo paliwowe reaktora jądrowego do zasilania akceleratora elektromagnetycznego, który wystrzeliwuje impulsy (toroidy) plazmy. Po walce średnio około 70% zniszczonej obrony zostaje odbudowane."
  '407': "Mała Osłona otacza całą planetę polem, które pochłania ogromne ilości energii. Na planecie można zbudować tylko jedną."
  '408': "Duża Osłona to dalszy rozwój, który potrzebuje znacznie więcej energii, by wytrzymać ataki. Na planecie można zbudować tylko jedną."
  '409': "Ewolucja technologii osłon. Zużywa dużo więcej energii, ale wytrzymuje więcej ataków niż jakakolwiek inna osłona. Na planecie można zbudować tylko jedną."
  '410': "Po latach badań nad grawitacją naukowcy opracowali działo grawitonowe, które wytwarza małe, skoncentrowane pole grawitonów i wystrzeliwuje je we wroga."
  '411': "Nieruchoma platforma obronna bez własnego napędu, utrzymywana przez grawitację na stabilnej orbicie wokół planety. Uruchomienie tego procesu wymaga ogromnych ilości energii. Na planecie można zbudować tylko jedną."
  '412': "Bunkier to silnie ufortyfikowana konstrukcja, zaprojektowana tak, by wytrzymać nawet najpotężniejsze ataki. Zapewnia niezrównaną ochronę mieszkańcom planety i kluczowej infrastrukturze, co czyni go fundamentem obrony planety."
  '413': Laser „Titan” to potężna broń o niezrównanej sile rażenia.
  '414': "Wabik to zaawansowany system obronny, którego zadaniem jest wprowadzanie w błąd i dezorientowanie sił wroga. Przebrany za Wyrzutnię Rakiet, odstrasza ataki."
  '502': "Antyrakiety przechwytują i niszczą wrogie Rakiety Międzyplanetarne. Każda Rakieta Międzyplanetarna wymaga jednej Antyrakiety."
  '503': "Rakiety Międzyplanetarne niszczą obronę przeciwnika, chyba że zestrzelą je Antyrakiety. Obrona zniszczona w ten sposób nie jest odbudowywana. Domyślnie ich zasięg (w układach słonecznych) zależy od poziomu twojego Napędu Impulsowego:<br>Zasięg = (5 x poziom Napędu Impulsowego) - 1"
  '901': >-
    Główny surowiec do budowy konstrukcji nośnych budynków i statków
    kosmicznych. Metal jest najtańszym surowcem mineralnym, dlatego jest
    częściej wykorzystywany niż inne.
  '902': >-
    Główny surowiec do budowy elementów elektronicznych i stopów metali.
    Kryształy wykorzystywane są we wszystkich statkach kosmicznych i budynkach.
    Najczęściej używane w przemyśle stoczniowym kryształy są jednak bardzo
    rzadkie i podobnie jak metale znajdują się w większych ilościach w głębokich
    warstwach.
  '903': >-
    Deuter jest izotopem wodoru. Jego separacja z wody jest procesem zużywającym
    duże ilości energii. Deuter jest wykorzystywany jako paliwo dla statków
    kosmicznych, dla prawie wszystkich badań naukowych, do podglądu galaktyki
    jak i skanowania z wykorzystaniem falangi czujników.
  '911': >-
    Czysta energia napędzająca przemysł wydobywczy. Aby zapewnić zaopatrzenie
    kopalń i ekstraktorów, wymagane są ogromne ilości czystej energii. Prawie
    wszystkie budynki potrzebują energii do ich eksploatacji. Energia jest
    niewymienialna.
  "229": "Stworzona, by przełamać dominację Xerów, Żmija jest ostateczną bronią przeciwko Lekkim myśliwcom, Ciężkim myśliwcom i Krążownikom. Dzięki szybkostrzelnym działom i zaawansowanej technologii zmienia układ sił we wszechświecie."
  "230": "Szybki. Precyzyjny. Nietykalny. Przechwytywacz nie jest stworzony do uczciwych walk – został zaprojektowany, by uderzać szybko i mocno, zapewniając przytłaczającą przewagę w mgnieniu oka."
  "231": "Behemot jest owocem dziesięcioleci badań nad gravitonami, które połączono w bezlitosną platformę bojową. W przeciwieństwie do Gwiazd Śmierci nie został zaprojektowany do niszczenia planet, lecz do maksymalnej skuteczności na polu bitwy. Rezygnując z energochłonnych systemów potrzebnych do niszczenia księżyców, znacznie odchudzono jego konstrukcję, co pozwoliło na mocniejsze silniki, większą zwrotność i większą siłę ognia. Kompaktowe działo gravitonowe zmienia go w mobilną maszynę zniszczenia, zdolną samodzielnie unicestwić nawet ogromne floty."
  "232": "Tytan Pustki to szczyt nowoczesnej technologii gravitonowej. Każdy element jego konstrukcji służy jednemu celowi: szybkiej anihilacji wrogich księżyców. Konwencjonalne wieżyczki bojowe celowo pominięto, aby zmniejszyć masę i zrobić miejsce na kolosalne generatory kryształowe. Zasilają one najbardziej zaawansowane cewki przyspieszające, jakie kiedykolwiek zbudowano w znanych galaktykach, nadając statkowi niezrównaną mobilność. Ogromne zapotrzebowanie na kryształ sprawia, że każdy Tytan Pustki to monumentalne osiągnięcie przemysłowe – i symbol nieograniczonej siły niszczącej."
secureResources: "Każdy poziom budynku magazynowego chroni 1% dziennej produkcji danego surowca przed grabieżą podczas ataków, maksymalnie do 10%."
shortDescription:
  '1': "Kopalnie metalu wydobywają rudę, na której opiera się każde rodzące się i ugruntowane imperium."
  '2': "Kryształ to kluczowy składnik układów elektronicznych i niektórych stopów. Jego wydobycie jest bardziej skomplikowane, więc kopalnia zużywa tyle samo energii co kopalnia metalu."
  '3': "Deuterium napędza twoje statki i jest wydobywane z głębin oceanu. To rzadka substancja, więc jest stosunkowo droga. Potrzebujesz go też do wielu badań oraz do skanowania Falangą."
  '4': "Elektrownie słoneczne zamieniają światło słoneczne w energię. Każda kopalnia potrzebuje energii do pracy."
  '6': "Domyślnie każdy poziom skraca czas badań o 8%."
  '12': "Elektrownia Jądrowa łączy paliwo deuterowe, żeby wytwarzać energię."
  '14': "Fabryki Robotów dostarczają roboty budowlane, które pomagają przy budowie twoich budynków. Każdy poziom przyspiesza rozbudowę budynków."
  '15': "Szczyt robotyki. Każdy poziom skraca o połowę czas budowy budynków, statków i obrony."
  '21': "Wszystkie statki i obrona powstają w planetarnej Stoczni."
  '22': "Magazynuje nadwyżki Metalu."
  '23': "Magazynuje nadwyżki Kryształu."
  '24': "Magazynuje nadwyżki Deuterium."
  '31': "Do badania nowych technologii potrzebujesz Laboratorium Badawczego."
  '33': "Terraformer powiększa użyteczną powierzchnię planety: 5 dodatkowych pól na poziom, plus jedno na każdym parzystym poziomie. Każdy poziom sam zajmuje jedno pole."
  '34': "Depozyt Sojuszniczy obecnie nie działa w tej grze."
  '35': "Dok Naprawczy przywraca statki z pola wraków."
  '41': "Księżyc nie ma atmosfery, a świeży księżyc ma miejsce tylko na jeden budynek, więc zacznij od Bazy Księżycowej."
  '42': "Falanga pozwala śledzić ruchy flot. Im wyższy poziom, tym większy zasięg."
  '43': "Teleportery to olbrzymie nadajniki, które przesyłają duże floty przez wszechświat bez straty czasu."
  '44': "Silosy rakietowe przechowują twoje rakiety."
  '106': "Ta technologia pozwala zbierać informacje o innych planetach i księżycach."
  '108': "Lepsze komputery pozwalają dowodzić większą liczbą flot. Każdy poziom Technologii Komputerowej zwiększa maksymalną liczbę twoich flot o jeden."
  '109': "Technologia Broni zwiększa skuteczność systemów uzbrojenia. Każdy poziom podnosi siłę ognia wszystkich jednostek o 10% wartości bazowej."
  '110': "Technologia Osłony wzmacnia osłony statków i budowli obronnych. Każdy poziom zwiększa wytrzymałość osłon o 10% wartości bazowej."
  '111': "Specjalne stopy poprawiają pancerz statków i budowli obronnych. Każdy poziom zwiększa skuteczność pancerza o 10%."
  '113': "Opanowanie różnych rodzajów energii to klucz do wielu nowych technologii."
  '114': "Dzięki połączeniu czwartego i piątego wymiaru możesz zbadać nowy rodzaj napędu, bardziej ekonomiczny i wydajny."
  '115': "Rozwój tego napędu przyspiesza część statków, ale każdy poziom dodaje tylko 10% prędkości bazowej."
  '117': "Napęd impulsowy działa na zasadzie odrzutu. Jego rozwój przyspiesza część statków, ale każdy poziom dodaje tylko 20% prędkości bazowej."
  '118': "Napęd nadprzestrzenny zakrzywia przestrzeń wokół statku. Jego rozwój przyspiesza część statków, ale każdy poziom dodaje tylko 30% prędkości bazowej."
  '120': "Skupione światło tworzy wiązkę, która niszczy wszystko, w co uderzy."
  '121': "Śmiercionośna wiązka rozpędzonych jonów, która przy uderzeniu wyrządza ogromne szkody."
  '122': "Dalszy rozwój technologii jonowej: przyspiesza wysokoenergetyczną plazmę, powstałą z przegrzanych jonów. Przy uderzeniu działa niszcząco."
  '123': "Naukowcy z różnych planet porozumiewają się przez tę sieć."
  '124': "Odblokowuje kolonizację i ekspedycje w głąb kosmosu. Dodatkowe planety na nieparzystych poziomach, dodatkowe sloty ekspedycji na poziomach kwadratowych, dłuższy postój ekspedycji i więcej pozycji planet w układzie."
  '131': "Zwiększa produkcję metalu o 2% na poziom."
  '132': "Zwiększa produkcję kryształu o 2% na poziom."
  '133': "Zwiększa produkcję deuterium o 2% na poziom."
  '134': "Zmniejsza koszty lotu o 2% na poziom."
  '199': "Wystrzał skoncentrowanego ładunku cząstek grawitonów tworzy sztuczne pole grawitacyjne, które potrafi niszczyć statki, a nawet księżyce."
  '202': "Mały Transporter to zwinny statek, który szybko przewozi surowce na inne planety."
  '203': "Ten transportowiec przewozi znacznie więcej niż Mały Transporter i dzięki ulepszonemu napędowi jest zwykle szybszy."
  '204': "Pierwszy okręt bojowy, jaki buduje każdy imperator. Lekki Myśliwiec jest zwinny, ale w pojedynkę bezbronny; w dużych ilościach staje się realnym zagrożeniem dla każdego imperium. To właśnie Lekkie Myśliwce jako pierwsze eskortują Małe i Duże Transportery na wrogie planety o słabej obronie."
  '205': "Ten myśliwiec ma lepszy pancerz i mocniej uderza niż Lekki Myśliwiec."
  '206': "Krążowniki mają prawie trzy razy mocniejszy pancerz niż Ciężkie Myśliwce i ponad dwa razy większą siłę ognia. Są też bardzo szybkie."
  '207': "Okręty Wojenne to trzon floty. Ciężkie działa, duża prędkość i pojemne ładownie czynią z nich przeciwników, z którymi trzeba się liczyć."
  '208': "Za pomocą tego statku skolonizujesz wolne planety."
  '209': "Recykler zbiera surowce z pól zniszczeń."
  '210': "Sondy Szpiegowskie to małe, zwinne drony, które dostarczają dane o flotach i planetach na duże odległości."
  '211': "Bombowiec powstał specjalnie do niszczenia obrony planet."
  '212': "Satelity Słoneczne to proste platformy z ogniwami słonecznymi na wysokiej, stacjonarnej orbicie. Zbierają światło słoneczne i przesyłają je laserem do stacji naziemnej."
  '213': "Niszczyciel to król okrętów wojennych."
  '214': "Niszczycielska siła Gwiazdy Śmierci nie ma sobie równych, a do tego potrafi niszczyć księżyce."
  '215': "Pancernik specjalizuje się w przechwytywaniu wrogich flot."
  '216': "Następca popularnej Gwiazdy Śmierci: znacznie szybszy i wytrzymalszy, z ogromną ładownią, ale uderza nieco słabiej."
  '217': "Rozwinięcie Dużego Transportera ze znacznie większą ładownością. Lata na napędzie nadprzestrzennym, więc na starcie jest wolniejszy od Dużego Transportera, ale wyprzedza go wraz z kolejnymi poziomami Napędu Nadprzestrzennego."
  '218': "Absolutny najgorszy scenariusz, choć bardzo powolny."
  '219': "Ogromna ładownia i nowe silniki pozwalają mu latać szybciej i zbierać więcej z pól zniszczeń."
  '220': >-
    Stalowy Kolos odpiera każdy atak dzięki potężnym tarczom i grubej pancernej
    osłonie, ale jego uzbrojenie i silniki pozostawiają wiele do życzenia.
  '221': >-
    Burzowe Ostrze to błyskawiczny myśliwiec, uzbrojony po zęby. Obrona?
    Niepotrzebna – jego celem są bezbronne transportowce i recyklery.
  '222': >-
    Wolny, ale silnie uzbrojony krążownik z ulepszonymi tarczami i zdolnościami
    ofensywnymi.
  '223': >-
    Nowa wersja lekkiego myśliwca, która zapewnia maksymalne bezpieczeństwo
    załogi kosztem słabych właściwości lotnych.
  '224': >-
    Niezbadany statek transportowy z minimalnym uzbrojeniem, zaprojektowany w
    celu zakłócania spokoju nieostrożnych sąsiadów i wywołania natychmiastowego
    konfliktu.
  '225': >-
    Statek, który łączy siłę bojową, prędkość i pojemność transportową, dzięki
    czemu jest niezastąpiony w każdej potężnej flocie.
  '226': >-
    Ogromnie opancerzony transporter bitewny o imponującym, nieco masywnym
    designie, którego miażdżąca siła ognia jest w stanie pokonać nawet
    najsilniejszych przeciwników.
  '227': >-
    Ulepszona wersja klasycznego recyklera z napędem impulsowym, umożliwiająca
    bardziej efektywne misje odzyskiwania przy niższych kosztach.
  '228': >-
    Ekstremalnie szybka, ale nieefektywna wersja Recyklera z napędem
    nadprzestrzennym.
  '231': >-
    Mniejsza i szybsza Gwiazda Śmierci, pozbawiona zdolności niszczenia
    księżyców. Najlepiej opisuje się „Behemota” jako śmiertelnie groźnego
    przeciwnika dla flot.
  '401': "Wyrzutnia Rakiet to prosta, ale opłacalna obrona."
  '402': "Lekkie lasery to proste naziemne działa obronne. Specjalne systemy celownicze śledzą wrogie statki, a wiązka lasera o wysokim natężeniu przecina kadłub celu."
  '403': "Ciężki Laser to ulepszona wersja Lekkiego Lasera."
  '404': "Działo Gaussa wystrzeliwuje metalowe pociski o dużej gęstości z ogromną prędkością."
  '405': "Działo Jonowe wystrzeliwuje wiązki jonów (cząstek naładowanych dodatnio lub ujemnie)."
  '406': "Wyrzutnia Plazmy wykorzystuje duże ogniwo paliwowe reaktora jądrowego do zasilania akceleratora elektromagnetycznego, który wystrzeliwuje impulsy (toroidy) plazmy."
  '407': "Mała Osłona otacza całą planetę polem, które pochłania ogromne ilości energii."
  '408': "Duża Osłona potrafi pochłonąć znacznie więcej energii podczas ataków."
  '409': "Ewolucja technologii osłon. Zużywa dużo więcej energii, ale wytrzymuje więcej ataków niż jakakolwiek inna osłona."
  '410': "Po latach badań nad grawitacją naukowcy opracowali działo grawitonowe, które wytwarza małe, skoncentrowane pole grawitonów i wystrzeliwuje je we wroga."
  '411': "Nieruchoma platforma obronna bez własnego napędu, utrzymywana przez grawitację na stabilnej orbicie wokół planety. Uruchomienie tego procesu wymaga ogromnych ilości energii."
  '412': "Chroni! Jak klocek Lego w „Kindergarten TD”."
  '413': "Laser „Titan” to kolosalny laser."
  '414': "Wabik to wyrafinowany system obronny, który ma wprowadzać wroga w błąd. Udając Wyrzutnię Rakiet, odstrasza ataki."
  '502': "Antyrakiety niszczą nadlatujące Rakiety Międzyplanetarne."
  '503': "Rakiety Międzyplanetarne niszczą obronę przeciwnika."
  '901': "Metal to główny surowiec do budynków i statków. Jest najtańszym surowcem, ale też tym, którego potrzebujesz najwięcej."
  '902': "Kryształ to główny surowiec do budowy układów elektronicznych i niektórych stopów."
  '903': "Deuterium występuje w najgłębszych oceanach. To najdroższy surowiec, który wymaga też najwięcej energii."
  '911': "Energia jest potrzebna do produkcji każdego surowca."
  "229": "Stworzona, by przełamać dominację Xerów, Żmija jest ostateczną bronią przeciwko Lekkim myśliwcom, Ciężkim myśliwcom i Krążownikom. Dzięki szybkostrzelnym działom i zaawansowanej technologii zmienia układ sił we wszechświecie."
  "230": "Szybki. Precyzyjny. Nietykalny. Przechwytywacz nie jest stworzony do uczciwych walk – został zaprojektowany, by uderzać szybko i mocno, zapewniając przytłaczającą przewagę w mgnieniu oka."
  "232": "Szybszy, bardziej wybuchowy, zawsze dobra niespodzianka. Tytan Pustki to postrach księżyców."
