spytechStatsDescription: >-
  Na poziomach 0 i 1 widoczna jest tylko suma punktów innych graczy. Od poziomu
  2 widoczne są również punkty budynków innych graczy. Od poziomu 4 wyświetlane
  są również punkty badań. Od poziomu 6 wyświetlane są statki i punkty obrony, a
  także statystyki bitewne.
