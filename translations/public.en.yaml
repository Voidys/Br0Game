registerWelcomePMText: >-
  Welcome to %s! First build a Solar Power Plant, because energy is needed to
  produce resources. Open Buildings in the left menu and start with the Solar
  Power Plant.<br>Once you have energy, you can build mines. Stay in Buildings
  and construct a Metal Mine, then a Crystal Mine.<br><br>To build ships you
  need a Shipyard. The Technologies menu on the left shows what is required to
  unlock it.<br>If you have more questions, check the FAQ, the wiki, or open a
  support ticket.<br><br>The team wishes you a lot of fun exploring the
  universe!
