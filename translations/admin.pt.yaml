  Você só pode atacar usuários onde seus pontos estão entre seus pontos *
  (quantidade), por exemplo *18 , ou seja, se você tiver 1000 pontos, você pode
  atacar usuários com menos de 18.000 pontos, ou, se você tiver 50.000 pontos,
  você pode ser atacado por usuários onde você entra no alcance deles, como se
  um inimigo ou um usuário neutro tivesse 20.000 pontos, * 18 será 360.000,
  então você está no alcance deles e você pode ser atacado por ele
