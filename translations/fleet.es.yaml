sys_destruc_echec: >-
  Los temblores sacuden la luna. Pero algo sale mal, las estrellas de la muerte
  explotan y se desintengran en millones de pedazos. <br>La onda expansiva
  elimina toda la fola por completo.
sys_destruc_lune: 'La probabilidad de destruir la luna es de: %d %% '
sys_destruc_mess1: Las estrellas de la muerte disparan el graviton a la luna
sys_destruc_null: >-
  Las estrellas de la muerten no generan el poder necesario, la mision falla y
  las naves vuelven de regreso.
sys_destruc_reussi: >-
  Los temblores empiezan a sacudir la superficie de la luna, despues de unos
  instantes la luna no soporta mas y vuela en mil pedazos, mision cumplida, la
  flota vuelve al planeta de origen.
sys_destruc_rip: 'La probabilidad de autodestrucción de la flota es de: %d %% '
sys_destruc_stop: El defensor ha conseguido detener la destrucción de la luna
sys_destruc_title: 'Las siguientes flotas contrastan la destrucción de la luna:'
sys_expe_attack_1_1_1: >-
  Algunos piratas espaciales, aparentemente muy desesperados por tratar de
  secuestrar nuestra flota de expedición.
sys_expe_attack_1_1_2: >-
  Algunos bárbaros primitivos nos han atacando con naves espaciales, por
  llamarlas de aluna forma. Si el bombardeo adquiere proporciones graves, nos
  veremos obligados a responder.
sys_expe_attack_1_1_3: >-
  Hemos recogido algunos mensajes de radio de piratas que parecian estar muy
  borrachos. Al parecer vamos a ser atacados.
sys_expe_attack_1_1_4: >-
  Tuvimos que defendernos contra unos piratas, que afortunadamente no fueron muy
  numerosos.
sys_expe_attack_1_1_5: >-
  Nuestros informes de flota de expedición que se encontraron con un tal Moa
  Tikarr y su manada salvaje, que exigen la rendición incondicional de nuestra
  flota. Si se ponen serios, tendrán que darse cuenta de que nuestras naves
  saben defenderse bien.
sys_expe_attack_1_2_1: >-
  Tu flota de expedición ha tenido un desagradable encuentro con unos piratas
  del espacio.
sys_expe_attack_1_2_2: >-
  ¡Estamos en una emboscada de algunos piratas espaciales! La batalla, por
  desgracia, es inevitable.
sys_expe_attack_1_2_3: >-
  El grito de ayuda, que siguio la expedición, resultó ser de algunos
  malintencionados piratas espaciales. La batalla fue inevitable.
sys_expe_attack_1_3_1: >-
  Las señales de recogida no se originaron a partir de una naturaleza extraña,
  sino ¡por una base pirata secreta! Los piratas eran conscientes de nuestra
  presencia en su sector y no estaban particularmente entusiasmados.
sys_expe_attack_1_3_2: >-
  ¡La flota de expedición informó de fuertes combates con barcos piratas no
  identificados!
sys_expe_attack_1_3_3: >-
  Hemos recibido un mensaje urgente del comandante de la expedición: "¡Vienen
  hacia nosotros! Han salido de un salto hiperespacial, afortunadamente sólo son
  piratas, por lo que tenemos una oportunidad, ¡entonces pelearemos!
sys_expe_attack_2_1_1: >-
  Su flota de expedición tuvo un primer contacto no muy amigo con una especie
  desconocida.
sys_expe_attack_2_1_2: ¡Algunos buques de extraño aspecto han atacado sin previo aviso!
sys_expe_attack_2_1_3: ¡Nuestra expedición fue atacada por un pequeño grupo de naves desconocidas!
sys_expe_attack_2_1_4: >-
  La flota de expedición informo haber tenido contacto con naves desconocidas.
  Los mensajes de radio no se pudieron decodificar, sin embargo parece que los
  buques extranjeros han activado sus armas.
sys_expe_attack_2_2_1: ¡Una especie desconocida está atacando a nuestra expedición!
sys_expe_attack_2_2_2: >-
  Tu flota de expedición, al parecer, violó el territorio de la hasta ahora
  desconocida, pero muy agresiva amiga de la guerra, especie alienígena.
sys_expe_attack_2_2_3: >-
  El enlace a nuestra flota de expedición fue interrumpido. Por lo que hemos
  sabido sobre el último mensaje, la flota se encuentra bajo un fuerte fuego -
  los agresores no pudieron ser identificados.
sys_expe_attack_2_3_1: >-
  ¡Tu expedición ha encontrado una flota de invasión extraterrestre y reportaron
  intensos combates!
sys_expe_attack_2_3_2: >-
  Una asociación de gran cantidad de naves cristalinas de origen desconocido
  tiene rumbo de colisión directa con nuestra flota de expedición. Ahora tenemos
  que asumir lo peor.
sys_expe_attack_2_3_3: >-
  Tuvimos dificultades pronunciando el dialecto de la raza alienígena
  correctamente. Nuestro diplomático dijo 'Fuego!' en lugar de 'Paz!'
sys_expe_attackname_1: Piratas
sys_expe_attackname_2: Aliens
sys_expe_back_home: Su flota ha regresado a %1$s %2$s desde la expedición en %3$s.
sys_expe_back_home_ress: Han traído %s %s, %s %s y %s %s .
sys_expe_back_home_ships_flound: 'Se encontraron las siguientes embarcaciones:'
sys_expe_back_home_ships_lost: 'Los siguientes barcos se perdieron:'
sys_expe_blackholl_1: >-
  La flota fue arrastrada hacia un agujero negro, y ésta fue parcialmente
  destruida.
sys_expe_blackholl_2: La flota fue arrastrada hacia un agujero negro, y fue completamente destruida!
sys_expe_depleted_max_1: >-
  Entrada del diario de los oficiales de comunicaciones: Si nos sintiéramos en
  peligro podríamos volver con todas las otras expediciones que vuelan por aquí.
sys_expe_depleted_max_2: >-
  Entrada del diario de los oficiales de comunicación: Si sigue así tendremos
  que colocar boyas de navegación para manejar todo este tráfico.
sys_expe_depleted_max_3: >-
  Entrada en el cuaderno de bitácora del oficial de comunicaciones: Tal vez
  sería más útil abrir una tienda de recuerdos aquí que enviar otra expedición.
sys_expe_depleted_med_1: >-
  Entrada del diario de los oficiales de comunicaciones: Encontramos pruebas que
  indican la presencia de múltiples flotas de expedición en la zona. Regresamos
  a casa.
sys_expe_depleted_med_2: >-
  Entrada del diario de los oficiales de comunicaciones: Establecimos contacto
  amistoso por radio con otras expediciones en este sector.
sys_expe_depleted_med_3: >-
  Entrada del diario de los oficiales de comunicaciones: Celebramos la
  culminación de la expedición con los miembros de la tripulación de otra flota
  de expedición que se dirigía al mismo sector. No tienen nada nuevo que
  comunicar.
sys_expe_depleted_min_1: >-
  Entrada del diario de los oficiales de comunicaciones: Parece que los humanos
  han estado en esta parte de la galaxia antes.
sys_expe_depleted_min_2: >-
  Entrada del diario de los oficiales de comunicaciones: Encontramos restos de
  antiguas naves espaciales. No somos los primeros en llegar.
sys_expe_depleted_min_3: >-
  Cuaderno de bitácora del oficial de comunicaciones: Casi tuvimos una colisión
  con otra flota de expedición. No creía que hubiera otras por aquí.
sys_expe_depleted_not_1: >-
  Entrada del diario de los oficiales de comunicaciones: Parece que esta parte
  del universo aún no ha sido explorada.
sys_expe_depleted_not_2: >-
  Entrada del diario de los oficiales de comunicaciones: Se siente muy bien ser
  los primeros en viajar por un sector inexplorado.
sys_expe_feqeuence_few: Más de 10 expediciones en las últimas 24 horas
sys_expe_feqeuence_many: Más de 50 expediciones en las últimas 24 horas
sys_expe_feqeuence_medium: Más de 25 expediciones en las últimas 24 horas
sys_expe_feqeuence_no: Pocas expediciones en 24 horas
sys_expe_found_goods: '%s %s fueron minados.'
sys_expe_found_ress_1_1: >-
  Tu expedición ha descubierto un pequeño grupo de asteroides, de los que se han
  obtenidos algunos recursos.
sys_expe_found_ress_1_2: En un planetoide remoto de fácil acceso se encontraron materias primas.
sys_expe_found_ress_1_3: >-
  Su expedición se encontró con restos de naves muy antiguos, luchando una larga
  batalla contra el olvido. Los componentes individuales pueden reciclar y
  recuperar.
sys_expe_found_ress_1_4: >-
  La expedición se encontró con una contaminación radioactiva y muy tóxica para
  la atmósfera. Sin embargo, los escáneres mostraron que este asteroide es muy
  rico en recursos. Se usaron naves no trupuladas para obtener las materias
  primas.
sys_expe_found_ress_2_1: >-
  Tu expedición descubrió una antigua hiper nave de carga desierta, al parecer,
  ha sido destrozada en alguna batalla. Algunos recursos pudieron ser salvados.
sys_expe_found_ress_2_2: >-
  En una pequeña luna con una atmósfera a su propia expedición encontraron
  grandes yacimientos minerales. El personal de tierra está allí para reunir
  esos tesoros naturales.
sys_expe_found_ress_2_3: >-
  Hemos encontrado un pequeño convoy de naves civiles en necesidad de alimentos
  y medicamentos de urgencia. A cambio, recibimos una gran cantidad de recursos
  útiles.
sys_expe_found_ress_3_1: >-
  Tu flota de expedición descubrió una nave alienígena gigante. Con la
  tecnología de la nave no pudieron hacer nada, pero la nave pudo ser
  descompuesta en sus componentes, a través de los cuales se pudo obtener
  valiosas materias primas.
sys_expe_found_ress_3_2: >-
  Un cinturón de minerales alrededor de un planeta desconocido, figura grandes
  cantidades de materias primas. ¡La flota de expedición muestra informes de
  carga completa!
sys_expe_found_ress_logbook_1: >-
  Anotación del cuaderno de bitácora de los primeros oficiales: Usamos todo el
  espacio libre pero aún no pudimos llevarnos todos los recursos encontrados.
sys_expe_found_ress_logbook_2: >-
  Anotación del cuaderno de bitácora de los primeros oficiales: ¡Si sólo
  tuviéramos algunos cargueros más! Ahora tendremos que dejar atrás montones de
  recursos.
sys_expe_found_ress_logbook_3: >-
  Anotación del cuaderno de bitácora de los primeros oficiales: Ya hemos tirado
  todo lo que realmente ya no necesitamos pero aún no somos capaces de hacer
  suficiente espacio para todos los recursos encontrados.
sys_expe_found_ress_logbook_4: >-
  Anotación del cuaderno de bitácora de los primeros oficiales: Incluso cuando
  transformamos la cafetería y todos los salones en almacenes seguimos sin poder
  transportar todos los recursos que encontramos.
sys_expe_found_ships: >-
  Tus exploradores han encontrado un escuadrón abandonado pero en buen
  estado.<br>:
sys_expe_found_ships_1_1: >-
  ¡Nos hemos encontrado con los restos de una expedición anterior! Nuestros
  técnicos miran si algunas de las naves pueden volver a volar.
sys_expe_found_ships_1_2: >-
  Hemos encontrado una base abandonada de piratas. En el hangar habían algunas
  naves viejas. Nuestros técnicos van a comprobar si todavía son capaces de
  utilizarlas.
sys_expe_found_ships_1_3: >-
  Nuestra expedición encontró un planeta que fue probablemente destruido por las
  guerras. En órbita hay varias naves naufragadas. Los técnicos tratan de
  reparar algunas de ellas. Tal vez entonces también tengan la posibilidad de
  obtener información sobre lo que ha sucedido aquí.
sys_expe_found_ships_1_4: >-
  Tu expedición ha encontrado una vieja estrella de la muerte, que probablemente
  dejó de funcionar hace mucho tiempo. En el hangar de la fortaleza se
  encontraron unas cuantas naves. Los teócnicos analizarán si algunas de ellas
  pueden ser reparadas o no.
sys_expe_found_ships_2_1: >-
  Hemos encontrado los restos de una Armada. Los técnicos de la flota de
  expedición han ido inmediatamente a las semi-intactas y tratan de arreglarla
  de nuevo.
sys_expe_found_ships_2_2: >-
  Nuestra expedición se topó con un viejo hangar automático. Algunas naves se
  encuentran aún en fase de producción, y nuestros ingenieros están tratando de
  restablecer la energía en la planta.
sys_expe_found_ships_3_1: >-
  Hemos encontrado un cementerio gigante de naves espaciales. Algunos técnicos
  de la flota de la expedición han logrado poner una o más naves de nuevo en
  funcionamiento.
sys_expe_found_ships_3_2: >-
  Hemos descubierto un planeta con los restos de una civilización. Desde la
  órbita sólo se reconoce un único edificio que sigue intacto. Algunos de
  nuestros técnicos y los pilotos han ido a la superficie para ver si algunas de
  las naves estacionadas allí todavía son capaces de ser utilizadas.
sys_expe_found_ships_logbook_1: >-
  Anotación del cuaderno de bitácora de los oficiales de máquinas: ¡Si
  hubiéramos traído más barcos, habría sido fácil llevarnos algunas de esas
  bellezas!
sys_expe_found_ships_logbook_2: >-
  Anotación del cuaderno de bitácora de los oficiales de máquinas:
  Desafortunadamente, no tuvimos la capacidad de traer de vuelta todas las naves
  descubiertas en nuestra misión.
sys_expe_found_ships_logbook_3: >-
  Anotación del cuaderno de bitácora de los oficiales de máquinas:
  Desafortunadamente no tenemos suficiente capacidad para traer de vuelta todas
  las naves encontradas.
sys_expe_found_ships_nothing: '- No habían naves que se pudieran reparar.'
sys_expe_lost_fleet_1: >-
  De la expedición, sólo llegó un mensaje de radio;: Zzzrrt Oh Dios! Krrrzzzzt
  la zrrrtrzt krgzzzz sí parece Krzzzzzzzztzzzz auxiliooKrzZZzzzz ...
sys_expe_lost_fleet_2: >-
  Lo último que se envió por la expedición tenía algunos planos de la apertura
  de ........ un agujero negro.
sys_expe_lost_fleet_3: >-
  El el núcleo de una de las naves se produjo una reacción en cadena que explotó
  y se llevó a toda la flota con ella.
sys_expe_lost_fleet_4: >-
  La flota de expedición no pudo dar el salto hacia el espacio normal. Nuestros
  científicos siguen desconcertados en cuanto a lo que podría haber ocurrido,
  pero la flota parece haberse perdido permanentemente.
sys_expe_nothing_1: >-
  Aparte de algunas criaturas extrañas, esta expedición vuelve sin nada
  interesante de su viaje.
sys_expe_nothing_2: >-
  Su expedición ha hecho bellas imágenes de una supernova. Realmente no hay
  nuevos hallazgos en esta expedición. Pero tenemos buenas posibilidades para
  concurso de mejor película-de-Universo de este año.
sys_expe_nothing_3: >-
  Un virus informático extraño paralizó la nave después de salir del sistema
  solar. Esto significaba que la flota de expedición entera voló todo el tiempo
  en círculo. Sin más nada que decir, la expedición no tuvo mucho éxito.
sys_expe_nothing_4: >-
  Una vida de pura energía a la que todos los miembros de la expedición se
  habían quedado mirando los patrones hipnóticos en las pantallas durante varios
  días. Cuando por fin la mayoría ha despertado, en la expedición había una
  grave escasez de deuterio, y la misión tuvo que ser cancelada.
sys_expe_nothing_5: >-
  Bueno, al menos ahora sabemos que tienen anomalías de color rojo en la clase 5
  no son los únicos efectos caóticos sobre los sistemas de navegación, pero
  también puede provocar alucinaciones masivas en la tripulación. Además de eso
  no mucho se consiguió de esta expedición.
sys_expe_nothing_6: >-
  A pesar de las exploraciones prometedoras de este sector, por desgracia,
  volvemos con las manos vacías.
sys_expe_nothing_7: >-
  Tal vez no deberíamos celebrar el cumpleaños de los Capitanes en este planeta
  remoto. Una fiebre de la selva desagradable ha acompañado a gran parte de la
  tripulación obligándolos a ir a la enfermería. No cabe decir que la expedición
  ha fallado.
sys_expe_nothing_8: >-
  Tu expedición, literalmente, hizo amistad con el vacío del universo. Ni
  siquiera había un pequeño asteroide, o radiación, o partículas, o cualquier
  cosa que hubiera hecho esta expedición emocionante.
sys_expe_nothing_9: >-
  Un fallo del núcleo del reactor habría destruido casi toda la expedición.
  Afortunadamente, los ingenieros eran más que capaces y pudieron evitar lo
  peor. Sin embargo, la reparación tardó tanto tiempo, que la expedición regresó
  con las manos vacías.
sys_expe_report: Reporte de expedición
sys_expe_report_msg: 'Informe de expedición de la flota %s %s en %s:'
sys_expe_time_fast_1: >-
  Una retroalimentación imprevista en la bobina de alimentaciín de las unidades
  de conducción, aceleró el regreso de la expedición, y ahora vuelve antes de lo
  esperado. En primer lugar informó que ella no tiene nada interesante que
  informar.
sys_expe_time_fast_2: >-
  El nuevo comandante se aprovechó de algunos agujeros de gusano inestables para
  acortar el vuelo de vuelta con éxito! Sin embargo, la propia expedición no ha
  traído ninguna prueba de ello.
sys_expe_time_fast_3: >-
  Tu expedición no encontró nada nuevo en el sector que investigó. Sin embargo,
  la flota se encontró adentro del viento solar durante la reentrada. Así, el
  salto fue acelerado. Tu expedición ahora vuelve a casa un poco temprano.
sys_expe_time_slow_1: >-
  Un error llevó a un cálculo erróneo del Navegador con el salto de la
  expedición. No sólo la flota desembarcó en un lugar completamente equivocado,
  sino que incluso la via de vuelta tomó mucho más tiempo.
sys_expe_time_slow_2: >-
  Por razones desconocidas, el salto de la flota de la expedición, simplemente
  salió mal. Casi sale en el corazón de un sol. Afortunadamente, aterrizó en un
  sistema conocido, pero el retorno llevará más tiempo del inicialmente pensado.
sys_expe_time_slow_3: >-
  El módulo de navegación nuevo probablemente tuvo que luchar con algunos
  errores. No sólo la trayectoria de la flota de la expedición fue totalmente en
  la dirección equivocada, sino que el deuterio se consumió en su totalidad. La
  flota terminó el salto justo en una luna. Un poco decepcionados ahora, la
  expedición regresa a casa. Este regreso se retrasa probablemente un poco.
sys_expe_time_slow_4: >-
  Su expedición se encontró en un sector con tormentas de partículas
  amplificadas. Esta sobrecarga la energía de la flota, para todas las naves,
  provoco que los sistemas más importantes se cancelaran. Su mecánico pudo
  evitar lo peor, pero la expedición regresa de vuelta con algo de retraso.
sys_expe_time_slow_5: >-
  La nave que mandó de la expedición chocó con una nave extraña que saltó en
  pleno vuelo sin previo aviso delante de la flota. La nave alienígena explotó y
  los daños a las naves han sido considerables. Una vez que las reparaciones se
  hayan completado, tus naves estarán de regreso, porque en este estado, la
  expedición no puede continuar.
sys_expe_time_slow_6: >-
  El viento estelar de una gigante roja ha distorsionado el salto de la
  expedición tanto que se tomó algo de tiempo para calcular la reentrada. Aparte
  de que el sector en el que la expedición salió, no es más que el vacío entre
  las estrellas.
sys_fleet_return: |-
  Su flota regresa al %s %s %s y ofrece %s %s, %s %s y %s %s.
