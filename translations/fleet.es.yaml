sys_colo_notech: >-
  El colonizador llega a las coordenadas %s. Cuando los colonos se acercaron al
  planeta, encontraron que su equipo no es el adecuado para las condiciones
  climáticas imperantes y primero tendrian que evolucionar las Tecnologías.
  Decepcionados, los colonos emprenden el viaje de retorno.
sys_colo_notfree: >-
  El colonizador llega a las coordenadas %s. Cuando tus coloniazadores llegaron
  a las cordenadas se encontraron con otra colonia ya desarrollada. Totalmente
  desmoralizados emprenden el viaje de retorno.
