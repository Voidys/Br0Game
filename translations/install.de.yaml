  <strong>Optional</strong> — Grafikbearbeitungs-Bibliothek &raquo;gdlib&laquo;
  ist für die dynamische Generierung von Bildern zuständig. Ohne sie werden
  einige Funktionalitäten der Software nicht funktionieren.
