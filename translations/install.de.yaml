sql_welcome: Herzlich Willkommen zu Br0Game v
step1_desc: >-
  Nachdem nun festgestellt wurde, dass Br0Game auf deinem Server betrieben
  werden kann, musst du noch einige Informationen angeben. Wenn du nicht weißt,
  wie die Verbindungsdaten für deine Datenbank lauten, kontaktiere bitte als
  erstes deinen Webhosting-Provider oder wende dich an die Br0Game
  Support-Foren. Wenn du Daten eingibst, prüfe diese bitte sorgfältig, bevor du
  fortfährst.
