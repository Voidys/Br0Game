reg_global_desc: >-
  Br0Game wird auch funktionieren, wenn diese Einstellung aktiviert ist.
  Allerdings wird aus Sicherheitsgründen empfohlen, register_globals in der
  PHP-Installation zu deaktivieren, falls dies möglich ist.
