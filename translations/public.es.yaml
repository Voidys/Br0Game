home_meme_alt: "Meme en cómic desde el puente de mando de {game_name}"
home_meme_alt_deep_space_transit: "Cómic: dos cadetes en una lanzadera – uno se hunde al ver un campo de asteroides, el otro sonríe ante una nebulosa brillante. «Patrullas de sector rutinarias vs. encontrar una nebulosa inexplorada y rica en recursos.»"
home_meme_alt_deuterium_joyride: "Cómic: un comandante cansado en la cubierta de observación mira a dos reclutas flotando fuera – «Ver a los nuevos reclutas malgastar todo su deuterio dando vueltas mientras yo espero 12 horas a las mejoras de mis minas.»"
home_meme_alt_enemy_fleet: "Cómic: un cadete se lleva las manos a la cabeza mientras parpadean las alarmas – «¡¿1000 destructores enemigos en camino?! ¡¿No era este sector seguro?!»"
home_meme_alt_fleet_decimated: "Cómic: un soldado en estado de shock mira al frente mientras explotan naves tras la cúpula destrozada – «Cuando pasas 20 horas recolectando recursos y la flota de un jugador del top 3 llega y lo desmonta todo en 3 segundos.»"
home_meme_alt_solo_scouting: "Cómic: el comandante Kamioka sonríe y apoya una mano robótica en el hombro de un cadete – «Tranquilo, cadete. El Alto Mando tiene una confianza ‘total’ en tu misión de reconocimiento en solitario por el espacio.»"
home_meme_alt_this_is_fine: 'Cómic: un perro con traje espacial está sentado tan tranquilo en un centro de mando en llamas y dice «This is fine» – «Tranquilo. Mi flota solo vuelve con 4 horas de retraso.»'
