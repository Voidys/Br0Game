registerWelcomePMText: ¡Bienvenido a %s! Lo primero es construir una planta de energía solar, porque hace falta energía para producir recursos. Abre Edificios en el menú de la izquierda y empieza por la planta de energía solar.<br>Cuando tengas energía, ya puedes construir minas. Sigue en Edificios y levanta una mina de metal y después una de cristal.<br><br>Para construir naves necesitas un hangar. El menú Tecnología de la izquierda te muestra qué hace falta para desbloquearlo.<br>Si tienes más dudas, echa un vistazo a las FAQ, a la wiki o abre un ticket de soporte.<br><br>¡El equipo te desea mucha diversión explorando el universo!
