install_desc: >-
  Pour activer l'outil d'installation, créez le fichier
  "var/ENABLE_INSTALL_TOOL"<br> Le nom du fichier est sensible à la casse
  et n'a pas de fin de type de fichier.<br> Le fichier peut être vide. 

  Il sera supprimé automatiquement une fois l’installation terminée ou s’il date
  de plus d’une heure.
