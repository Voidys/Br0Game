intro_text: >-
  Un des meilleurs clones Ogame : 2 Moons.<br>The latest is and 2 Moons the
  stablest flat rate was ever developed. 2 of Moon shines by stability,
  flexibility, dynamics, quality and user-friendliness. We hope always to be
  better than her expectations.<br><br>The installation system guides you
  through the install or upgrade from an older version to the latest. On
  questions or trouble don't hesitate to contact us.<br><br>Br0Game is an open
  source project licensed under the GNU GPL v3. For the license please click on
  the item in the menu.<br><br>Before the installation starts, a test is
  conducted, if system requirements are met.
