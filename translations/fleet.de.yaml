sys_destruc_echec: >-
  Erdbeben erschüttern den Planeten. Doch etwas geht schief: Die Todessterne
  explodieren und zerfallen in tausende Einzelteile. <br>Die Druckwelle erreicht
  die komplette Flotte.
sys_destruc_lune: 'Die Wahrscheinlichkeit einer Mondzerstörung beträgt: %d%% '
sys_destruc_mess1: Die Todessterne richten ihre gewaltigen Energien auf den Mond.
sys_destruc_null: >-
  Die Todessterne können ihre volle Leistung nicht aufbauen.<br> Der Mond wird
  nicht zerstört.
sys_destruc_reussi: >-
  Die Strahlen der Todessterne erreichen den Mond und zerfetzen ihn.<br>Der
  gesamte Mond wurde zerstört.
sys_destruc_rip: 'Die Wahrscheinlichkeit der Selbstzerstörung der Flotte beträgt: %d%%'
sys_destruc_stop: Der Verteidiger hat die Mondzerstörung erfolgreich abgeblockt.
sys_destruc_title: Folgende Flotten stehen sich zur Mondzerstörung gegenüber am
sys_expe_attack_1_1_1: >-
  Ein paar anscheinend sehr verzweifelte Weltraumpiraten haben versucht, unsere
  Expeditionsflotte zu kapern.
sys_expe_attack_1_1_2: >-
  Einige primitive Barbaren greifen uns mit Raumschiffen an, die nicht einmal
  ansatzweise die Bezeichnung Raumschiff verdient haben. Sollte der Beschuss
  ernst zu nehmende Ausmaße annehmen, sehen wir uns gezwungen das Feuer zu
  erwidern.
sys_expe_attack_1_1_3: >-
  Wir haben ein paar Funksprüche sehr betrunkener Piraten aufgefangen.
  Anscheinend sollen wir überfallen werden.
sys_expe_attack_1_1_4: >-
  Wir mussten uns gegen einige Piraten wehren, die zum Glück nicht allzu
  zahlreich waren.
sys_expe_attack_1_1_5: >-
  Unsere Expeditionsflotte meldet, dass ein gewisser Moa Tikarr und seine wilde
  Meute die bedingungslose Kapitulation unserer Flotte verlangen. Sollten sie
  Ernst machen, werden sie feststellen müssen, dass sich unsere Schiffe durchaus
  zu wehren wissen.
sys_expe_attack_1_2_1: >-
  Deine Expeditionsflotte hatte ein unschönes Zusammentreffen mit einigen
  Weltraumpiraten.
sys_expe_attack_1_2_2: >-
  Wir sind in den Hinterhalt einiger Sternen-Freibeuter geraten! Ein Kampf war
  leider unvermeidlich.
sys_expe_attack_1_2_3: >-
  Der Hilferuf, dem die Expedition folgte, stellte sich als böse Falle einiger
  arglistiger Sternen-Freibeuter heraus. Ein Gefecht war unvermeidlich.
sys_expe_attack_1_3_1: >-
  Die aufgefangenen Signale stammten nicht von Fremdwesen, sondern von einer
  geheimen Piratenbasis! Die Piraten waren von unserer Anwesenheit in ihrem
  Sektor nicht besonders begeistert.
sys_expe_attack_1_3_2: >-
  Die Expeditionsflotte meldet schwere Kämpfe mit nicht-identifizierten
  Piratenschiffen!
sys_expe_attack_1_3_3: >-
  Wir haben gerade eine dringende Nachricht vom Expeditionskommandanten
  erhalten: "Sie kommen auf uns zu! Sie sind aus dem Hyperraum gesprungen, zum
  Glück sind es nur Piraten, wir haben also eine Chance, wir werden kämpfen!"
sys_expe_attack_2_1_1: >-
  Deine Expeditionsflotte hatte einen nicht besonders freundlichen Erstkontakt
  mit einer unbekannten Spezies.
sys_expe_attack_2_1_2: >-
  Einige fremdartig anmutende Schiffe haben ohne Vorwarnung die
  Expeditionsflotte angegriffen!
sys_expe_attack_2_1_3: >-
  Unsere Expedition wurde von einer kleinen Gruppe unbekannter Schiffe
  angegriffen!
sys_expe_attack_2_1_4: >-
  Die Expeditionsflotte meldet Kontakt mit unbekannten Schiffen. Die Funksprüche
  sind nicht entschlüsselbar, jedoch scheinen die fremden Schiffe ihre Waffen zu
  aktivieren.
sys_expe_attack_2_2_1: Eine unbekannte Spezies greift unsere Expedition an!
sys_expe_attack_2_2_2: >-
  Deine Expeditionsflotte hat anscheinend das Hoheitsgebiet einer bisher
  unbekannten, aber äußerst aggressiven und kriegerischen Alienrasse verletzt.
sys_expe_attack_2_2_3: >-
  Die Verbindung zu unserer Expeditionsflotte wurde kurzfristig gestört. Soweit
  wir die letzte Botschaft richtig entschlüsselt haben, steht die Flotte unter
  schwerem Feuer – die Aggressoren konnten nicht identifiziert werden.
sys_expe_attack_2_3_1: >-
  Deine Expedition ist in eine Alien-Invasions-Flotte geraten und meldet schwere
  Gefechte!
sys_expe_attack_2_3_2: >-
  Ein großer Verband kristalliner Schiffe unbekannter Herkunft hält direkten
  Kollisionskurs mit unserer Expeditionsflotte. Wir müssen nun wohl vom
  Schlimmsten ausgehen.
sys_expe_attack_2_3_3: >-
  Wir hatten ein wenig Schwierigkeiten, den Dialekt der fremden Rasse richtig
  auszusprechen. Unser Diplomat nannte versehentlich "Feuer!" statt "Frieden!".
sys_expe_attackname_1: Piraten
sys_expe_attackname_2: Aliens
sys_expe_back_home: >-
  Deine Flotte ist von der Expedition bei %3$s wieder nach %1$s %2$s
  zurückgekehrt.
sys_expe_back_home_ress: Sie haben %s %s, %s %s und %s %s mitgebracht.
sys_expe_back_home_ships_flound: 'Es wurden folgende Schiffe gefunden:'
sys_expe_back_home_ships_lost: 'Es gingen folgende Schiffe verloren:'
sys_expe_blackholl_1: Deine Flotte traf auf ein schwarzes Loch und wurde teilweise zerst&ouml;rt!
sys_expe_blackholl_2: Deine Flotte traf auf ein schwarzes Loch und wurde komplett zerst&ouml;rt!
sys_expe_depleted_max_1: >-
  Logbuch Nachtrag des Kommunikationsoffiziers: Wenn wir uns zu unsicher fühlen,
  können wir uns ja mit all den anderen Expeditionen, die hier herum fliegen,
  zusammen tun.
sys_expe_depleted_max_2: >-
  Eintrag aus dem Logbuch des Kommunikationsoffiziers: Wenn das so weitergeht,
  werden wir Navigationsbojen aufstellen müssen, um den ganzen Verkehr zu
  bewältigen.
sys_expe_depleted_max_3: >-
  Logbucheintrag des Kommunikationsoffiziers: Vielleicht wäre es sinnvoller,
  hier einen Souvenirladen zu eröffnen, als noch eine weitere Expedition zu
  schicken.
sys_expe_depleted_med_1: >-
  Logbuch Nachtrag des Kommunikationsoffiziers: Es wurden Anzeichen für die
  Präsenz anderer Expeditionsflotten gefunden.
sys_expe_depleted_med_2: >-
  Eintrag aus dem Logbuch des Kommunikationsoffiziers: Wir haben freundlichen
  Funkkontakt mit einigen anderen Expeditionen in diesem Sektor hergestellt.
sys_expe_depleted_med_3: >-
  Eintrag aus dem Logbuch des Kommunikationsoffiziers: Wir haben den Abschluss
  der Expedition mit den Besatzungsmitgliedern einer anderen Expeditionsflotte
  gefeiert, die im gleichen Sektor unterwegs war. Sie haben nichts Neues zu
  berichten.
sys_expe_depleted_min_1: >-
  Logbuch Nachtrag des Kommunikationsoffiziers: Es scheint so, als ob bereits
  ein Mensch in diesem Bereich der Galaxis gewesen wäre.
sys_expe_depleted_min_2: >-
  Eintrag aus dem Logbuch des Kommunikationsoffiziers: Wir haben Trümmer von
  alten Raumschiffen gefunden. Wir sind nicht die ersten hier.
sys_expe_depleted_min_3: >-
  Logbucheintrag des Kommunikationsoffiziers: Wir hätten beinahe eine Kollision
  mit einer anderen Expeditionsflotte gehabt. Ich habe nicht geglaubt, dass es
  hier noch andere geben würde.
sys_expe_depleted_not_1: >-
  Logbuch Nachtrag des Kommunikationsoffiziers: Dieser Bereich des Universums
  ist wohl noch nicht erkundet worden.
sys_expe_depleted_not_2: >-
  Logbuch Nachtrag des Kommunikationsoffiziers: Es ist ein erhebendes Gefühl,
  der Erste in einem unerforschten Sektor zu sein.
sys_expe_feqeuence_few: Mehr als 10 Expeditionen in den letzen 24 Stunden
sys_expe_feqeuence_many: Mehr als 50 Expeditionen in den letzen 24 Stunden
sys_expe_feqeuence_medium: Mehr als 25 Expeditionen in den letzen 24 Stunden
sys_expe_feqeuence_no: Wenige Expeditionen in 24 Stunden
sys_expe_found_goods: Es wurden %s %s abgebaut.
sys_expe_found_ress_1_1: >-
  Deine Expedition hat einen kleinen Asteroidenschwarm entdeckt, aus dem einige
  Ressourcen gewonnen werden können.
sys_expe_found_ress_1_2: >-
  Auf einem abgelegenen Planetoiden wurden einige leicht zugängliche
  Ressourcenfelder gefunden und erfolgreich Rohstoffe gewonnen.
sys_expe_found_ress_1_3: >-
  Deine Expedition stieß auf sehr alte Raumschiffwracks einer längst vergangenen
  Schlacht. Einzelne Komponenten konnte man bergen und recyceln.
sys_expe_found_ress_1_4: >-
  Die Expedition stieß auf einen radioaktiv verstrahlten Planetoiden mit
  hochgiftiger Atmosphäre. Jedoch ergaben Scans, dass dieser Planetoid sehr
  rohstoffhaltig ist. Mittels automatischer Drohnen wurde versucht, ein Maximum
  an Rohstoffen zu gewinnen.
sys_expe_found_ress_2_1: >-
  Deine Expedition fand einen uralten, voll beladenen, aber menschenleeren
  Frachterkonvoi. Einige Ressourcen konnten geborgen werden.
sys_expe_found_ress_2_2: >-
  Auf einem kleinen Mond mit eigener Atmosphäre fand deine Expedition große
  Rohstoffvorkommen. Die Bodencrews sind dabei diese natürlichen Schätze zu
  heben.
sys_expe_found_ress_2_3: >-
  Wir haben einen kleinen Konvoi ziviler Schiffe getroffen, die dringend Nahrung
  und Medikamente benötigten. Im Austausch dafür erhielten wir eine ganze Menge
  nützlicher Ressourcen.
sys_expe_found_ress_3_1: >-
  Deine Expeditionsflotte meldet den Fund eines riesigen Alien-Schiffswracks.
  Mit der Technologie konnten sie zwar nichts anfangen, aber das Schiff ließ
  sich in seine Einzelteile zerlegen und dadurch konnte man wertvolle Rohstoffe
  gewinnen.
sys_expe_found_ress_3_2: >-
  Ein Mineraliengürtel um einen unbekannten Planeten enthielt Unmengen an
  Rohstoffen. Die Expeditionsflotte meldet volle Lager!
sys_expe_found_ress_logbook_1: >-
  Logbuch Nachtrag des ersten Offiziers: Wir haben zwar alle freien Plätze voll
  gestopft, konnten aber trotzdem nicht alle gefundenen Ressourcen unterbringen.
sys_expe_found_ress_logbook_2: >-
  Eintrag aus dem Logbuch des ersten Offiziers: Wenn wir nur ein paar
  Frachtschiffe mehr hätten! Jetzt müssen wir eine Menge Ressourcen
  zurücklassen.
sys_expe_found_ress_logbook_3: >-
  Logbuch Nachtrag des ersten Offiziers: Wir haben zwar alles nicht unbedingt
  notwendige über Bord geworfen, aber trotzdem nicht genügen Platz für alle
  gefunden Ressourcen machen können.
sys_expe_found_ress_logbook_4: >-
  Eintrag aus dem Logbuch des ersten Offiziers: Auch nachdem wir die Cafeteria
  und alle Aufenthaltsräume in Lagerräume umgewandelt haben, können wir immer
  noch nicht alle Ressourcen transportieren, die wir gefunden haben.
sys_expe_found_ships: >-
  Deine Forscher haben Raumschiffe in einwandfreiem Zustand gefunden!.<br>Bergen
  konnten Sie:
sys_expe_found_ships_1_1: >-
  Wir sind auf die Überreste einer Vorgängerexpedition gestoßen! Unsere
  Techniker schauen, ob sie einige der Wracks wieder Flugfähig bekommen
sys_expe_found_ships_1_2: >-
  Wir haben eine verlassene Piratenbasis gefunden. Im Hangar liegen noch einige
  alte Schiffe. Unsere Techniker schauen nach, ob einige davon noch zu
  gebrauchen sind.
sys_expe_found_ships_1_3: >-
  Unsere Expedition fand einen Planeten, der wohl durch anhaltende Kriege fast
  komplett zerstört wurde. In der Umlaufbahn trieben diverse Schiffswracks. Die
  Techniker versuchen, einige davon zu reparieren. Vielleicht erhalten wir so
  auch Information darüber, was hier geschehen ist.
sys_expe_found_ships_1_4: >-
  Deine Expedition ist auf eine alte Sternenfestung gestoßen, die wohl seit
  Ewigkeiten verlassen ist. Im Hangar der Festung wurden ein paar Schiffe
  gefunden. Die Techniker schauen, ob sie einige davon wieder flott bekommen.
sys_expe_found_ships_2_1: >-
  Wir haben die Reste einer Armada gefunden. Die Techniker der Expeditionsflotte
  haben sich sofort auf die halbwegs intakten Schiffe begeben und versuchen,
  diese wieder instandzusetzen.
sys_expe_found_ships_2_2: >-
  Unsere Expedition stieß auf eine alte, automatische Schiffswerft. Einige
  Schiffe sind noch in der Produktionsphase, und unsere Techniker versuchen, die
  Energieversorgung der Werft wiederherzustellen.
sys_expe_found_ships_3_1: >-
  Wir haben einen riesigen Raumschiffsfriedhof gefunden. Einigen Technikern der
  Expeditionsflotte ist es gelungen, das eine oder andere Schiff wieder in
  Betrieb zu nehmen.
sys_expe_found_ships_3_2: >-
  Wir haben einen Planeten mit Resten einer Zivilisation entdeckt. Aus dem Orbit
  ist noch ein riesiger Raumbahnhof zu erkennen, der als einziges Gebäude noch
  intakt ist. Einige unserer Techniker und Piloten haben sich auf die Oberfläche
  begeben um nachzuschauen, ob ein paar der dort abgestellten Schiffe noch zu
  gebrauchen sind.
sys_expe_found_ships_logbook_1: >-
  Logbuch Nachtrag des Maschinenoffiziers: Wenn wir doch nur ein paar Schiffe
  mehr dabei gehabt hätten! Dann wäre es ein leichtes gewesen noch mehr von
  diesen Prachtstücken ab zu schleppen.
sys_expe_found_ships_logbook_2: >-
  Logbuch Nachtrag des Maschinenoffiziers: Leider haben wir nicht genug Tonnage
  um all die schönen Schiffe nach Hause zu bringen.
sys_expe_found_ships_logbook_3: >-
  Logbuch Nachtrag des Maschinenoffiziers: Wir verfügen leider nicht über
  genügend Tonnage, um alle gefundenen Schiffe zurückzubringen.
sys_expe_found_ships_nothing: '- Es konnten keine Schiffe repariert werden.'
sys_expe_lost_fleet_1: >-
  Von der Expedition ist nur noch folgender Funkspruch übrig geblieben: Zzzrrt
  Oh Gott! Krrrzzzzt das zrrrtrzt sieht krgzzzz ja aus wie Krzzzzzzzztzzzz...
sys_expe_lost_fleet_2: >-
  Das Letzte, was von dieser Expedition noch gesendet wurde, waren einige
  unglaublich gut gelungene Nahaufnahmen eines sich öffnenden, schwarzen Loches.
sys_expe_lost_fleet_3: >-
  Ein Kernbruch des Führungsschiffes führte zu einer Kettenreaktion, die in
  einer durchaus spektakulären Explosion die gesamte Expedition vernichtete.
sys_expe_lost_fleet_4: >-
  Die Expeditionsflotte ist nicht mehr aus dem Sprung in den Normalraum
  zurückgekehrt. Unsere Wissenschaftler rätseln noch immer, was geschehen sein
  könnte, jedoch scheint die Flotte endgültig verloren zu sein.
sys_expe_nothing_1: >-
  Außer einiger kurioser, kleiner Tierchen von einem unbekannten Sumpfplaneten,
  bringt diese Expedition nichts Aufregendes von ihrer Reise mit.
sys_expe_nothing_2: >-
  Deine Expedition hat wunderschöne Bilder einer Supernova gemacht. Wirklich
  neue Erkenntnisse hat diese Expedition jedoch nicht gebracht. Aber man hat
  gute Chancen auf den Bestes-Bild-Des-Universums-Wettbewerb in diesem Jahr.
sys_expe_nothing_3: >-
  Ein seltsames Computervirus legte kurz nach Verlassen des Sonnensystems die
  Navigation lahm. Dies führte dazu, dass die gesamte Expeditionsflotte die
  ganze Zeit im Kreis flog. Überflüssig zu sagen, dass die Expedition nicht
  besonders erfolgreich war.
sys_expe_nothing_4: >-
  Eine Lebensform aus reiner Energie hat dafür gesorgt, dass sämtliche
  Expeditionsmitglieder tagelang auf die hypnotischen Muster auf den
  Bildschirmen starrten. Als endlich die Meisten wieder klar im Kopf geworden
  waren, musste die Expedition aufgrund von akutem Deuterium-Mangel allerdings
  abgebrochen werden.
sys_expe_nothing_5: >-
  Nun, zumindest weiß man jetzt, dass rote Anomalien der Klasse 5 nicht nur
  chaotische Auswirkungen auf die Schiffssysteme haben, sondern auch massive
  Halluzinationen bei der Crew auslösen können. Viel mehr hat diese Expedition
  aber nicht gebracht.
sys_expe_nothing_6: >-
  Trotz der ersten, vielversprechenden Scans dieses Sektors kommen wir leider
  mit leeren Händen zurück.
sys_expe_nothing_7: >-
  Vielleicht hätte man den Geburtstag des Captains nicht auf diesem abgelegenen
  Planeten feiern sollen. Ein fieses Dschungelfieber hat große Teile der Crew
  gezwungen die Expedition in der Krankenstation zu begleiten. Der akute
  Personalausfall führte dazu, dass die Expedition scheiterte.
sys_expe_nothing_8: >-
  Deine Expedition hat, wortwörtlich, mit der Leere des Alls Bekanntschaft
  gemacht. Es gab nicht einmal einen kleinen Asteroiden, oder Strahlung, oder
  Partikel, oder irgendetwas, dass diese Expedition aufregend gestaltet hätte.
sys_expe_nothing_9: >-
  Ein Reaktorfehler des Führungsschiffes hätte beinahe die gesamte Expedition
  vernichtet. Zum Glück waren die Techniker mehr als fähig und konnten das
  Schlimmste verhindern. Die Reparatur nahm jedoch soviel Zeit in Anspruch, dass
  die Expedition unverrichteter Dinge wieder zurückkehrte.
sys_expe_report: Expeditionsbericht
sys_expe_report_msg: 'Expeditionsbericht der Flotte von %s %s bei %s:'
sys_expe_time_fast_1: >-
  Eine unvorhergesehene Rückkopplung in den Energiespulen der Antriebsaggregate
  beschleunigte den Rücksprung der Expedition, so dass sie nun früher als
  erwartet zurückkehrt. Ersten Meldungen zufolge hat sie jedoch nichts
  Spannendes zu berichten.
sys_expe_time_fast_2: >-
  Der etwas wagemutige neue Kommandant nutzte ein instabiles Wurmloch, um den
  Rückflug zu verkürzen – mit Erfolg! Jedoch hat die Expedition selbst keine
  neuen Erkenntnisse gebracht.
sys_expe_time_fast_3: >-
  Deine Expedition meldet keinen Besonderheiten in dem erforschten Sektor.
  Jedoch geriet die Flotte beim Rücksprung in einen Sonnenwind. Dadurch wurde
  der Sprung ziemlich beschleunigt. Deine Expedition kehrt nun etwas früher nach
  Hause.
sys_expe_time_slow_1: >-
  Ein böser Patzer des Navigators führte zu einer Fehlkalkulation beim Sprung
  der Expedition. Nicht nur landete die Flotte an einem völlig falschen Ort,
  auch der Rückweg nahm nun erheblich mehr Zeit in Anspruch.
sys_expe_time_slow_2: >-
  Aus bisher unbekannten Gründen, ging der Sprung der Expeditionsflotte völlig
  daneben. Beinahe wäre man im Herzen einer Sonne herausgekommen. Zum Glück ist
  man in einem bekannten System gelandet, jedoch wird der Rücksprung länger
  dauern als ursprünglich gedacht.
sys_expe_time_slow_3: >-
  Das neue Navigationsmodul hat wohl doch noch mit einigen Bugs zu kämpfen.
  Nicht nur ging der Sprung der Expeditionsflotte in die völlig falsche
  Richtung, auch wurde das gesamte Deuterium verbraucht, wobei der Sprung der
  Flotte nur knapp hinter dem Mond des Startplaneten endete. Etwas enttäuscht
  kehrt die Expedition nun auf Impuls zurück. Dadurch wird die Rückkehr wohl ein
  wenig verzögert.
sys_expe_time_slow_4: >-
  Deine Expedition geriet in einen Sektor mit verstärkten Partikelstürmen.
  Dadurch überluden sich die Energiespeicher der Flotte und bei sämtlichen
  Schiffen fielen die Hauptsysteme aus. Deine Mechaniker konnten das Schlimmste
  verhindern, jedoch wird die Expedition nun mit einiger Verspätung
  zurückkehren.
sys_expe_time_slow_5: >-
  Das Führungsschiff deiner Expeditionsflotte kollidierte mit einem fremden
  Schiff, das ohne Vorwarnung direkt in die Flotte sprang. Das fremde Schiff
  explodierte und die Schäden am Führungsschiff waren beachtlich. Sobald die
  gröbsten Reparaturen abgeschlossen sind, werden sich deine Schiffe auf den
  Rückweg machen, da in diesem Zustand die Expedition nicht fortgeführt werden
  kann.
sys_expe_time_slow_6: >-
  Der Sternwind eines roten Riesen verfälschte den Sprung der Expedition
  dermaßen, dass es einige Zeit dauerte, den Rücksprung zu berechnen. Davon
  abgesehen gab es in dem Sektor, in dem die Expedition herauskam, nichts außer
  der Leere zwischen den Sternen.
