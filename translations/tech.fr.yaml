bonus:
  Attack: Attaque
  BuildTime: Temps de construction
  Defensive: Défense
  DefensiveTime: Temps de construction des défenses
  Energy: Production d'énergie
  Expedition: Expéditions
  FleetSlots: Slots de flotte
  FlyTime: Temps de vol
  GateCoolTime: Temps de chargement du portail de saut
  MoreFound: Trouvailles d'expédition
  Planets: Planètes
  ResearchTime: Temps de recherche
  Resource: Production de ressources
  ResourceStorage: Stockage de ressources
  Shield: Bouclier
  ShipStorage: Stockage de vaisseaux
  ShipTime: Temps de construction des vaisseaux
  SpyPower: Puissance d'espionnage
longDescription:
  '1': Les mines de métal extraient le minerai sur lequel repose tout empire, naissant
    ou établi.
  '2': Le cristal est l'ingrédient clé des circuits électroniques et de certains alliages.
  '3': Le deutérium alimente tes vaisseaux spatiaux. Il est extrait des profondeurs
    marines et, comme c'est une substance rare, il coûte relativement cher.
  '4': Les centrales solaires transforment la lumière du soleil en énergie. Chaque
    mine a besoin d'énergie pour fonctionner.
  '6': Par défaut, chaque niveau réduit le temps de recherche de 8 %.
  '12': La centrale de fusion produit de l'énergie en fusionnant du deutérium. Elle
    fournit plus d'énergie qu'une centrale solaire, mais coûte plus cher à construire.
    Sa production augmente avec la technologie Énergie et avec son propre niveau.
    La formule de production d'énergie est :<br> Énergie produite = 30 x niveau de
    la centrale de fusion x (1,05 + (0,01 * niveau de la technologie Énergie))^niveau
    de la centrale de fusion
  '14': Les usines de robots fournissent des robots de construction qui aident à bâtir
    tes bâtiments. Chaque niveau accélère l'amélioration des bâtiments.
  '15': Le summum de la robotique. Chaque niveau divise par deux le temps de construction
    des bâtiments, des vaisseaux et des défenses.
  '21': Tous les vaisseaux et toutes les défenses sont construits dans le chantier
    spatial de la planète.
  '22': Permet de stocker l'excédent de métal.
  '23': Permet de stocker l'excédent de cristal.
  '24': Permet de stocker l'excédent de deutérium.
  '31': Il te faut un laboratoire de recherche pour étudier de nouvelles technologies.
    Le niveau du laboratoire détermine la vitesse de tes recherches et les technologies
    que tu peux débloquer. Une recherche se déroule dans le laboratoire de la planète
    où tu la lances, et son résultat profite à toutes tes planètes. Tant qu'une recherche
    est en cours, aucun laboratoire de recherche ne peut être amélioré.
  '33': 'Le terraformeur agrandit la surface exploitable de la planète. Chaque niveau
    te donne 5 cases supplémentaires, plus une case en bonus à chaque niveau pair.
    Chaque niveau du terraformeur occupe lui-même une case.<br>Sa construction demande
    de l''énergie, mais celle-ci n''est pas consommée : ta planète doit simplement
    en produire assez (1 000 pour le niveau 1, le double à chaque niveau), même si
    tes mines l''utilisent déjà. Une fois construit, le terraformeur ne peut plus
    jamais être démoli.'
  '34': "Le dépôt d'alliance te permet de ravitailler en deutérium les flottes amies qui stationnent sur ta planète et de prolonger ainsi leur séjour. Tu l'ouvres depuis la page des bâtiments : pour chaque flotte en stationnement, tu choisis entre 1 heure et autant d'heures que le niveau du dépôt, et tu paies les heures multipliées par le coût de stationnement horaire de la flotte, pris sur le deutérium de ta planète. Le coût horaire est un dixième de la consommation de base cumulée des vaisseaux de la flotte, arrondi à l'entier supérieur. Une flotte peut être ravitaillée encore et encore, mais ne peut jamais avoir plus de 32 heures de séjour restantes. Seules les flottes d'autres joueurs actuellement en orbite autour de ta planète peuvent être ravitaillées."
  '35': Le dock de réparation peut réparer les vaisseaux détruits au combat qui ont
    laissé un champ d'épaves. Une réparation dure 12 heures au maximum, et elle ne
    peut pas se terminer moins de 30 minutes après l'apparition du champ d'épaves.<br>Une
    fois le champ d'épaves apparu, tu as 3 jours pour lancer la réparation. Quand
    la réparation est terminée, tu dois remettre toi-même les vaisseaux en service.
    Sinon, ils reprennent le service automatiquement au bout de 3 jours.
  '41': 'La lune n''a pas d''atmosphère, et une lune toute neuve n''a de place que
    pour un seul bâtiment : commence donc par la base lunaire. Chaque niveau donne
    3 cases supplémentaires et occupe lui-même une case. Une fois construite, la base
    lunaire ne peut plus jamais être démantelée.'
  '42': 'La phalange de capteurs permet de surveiller les mouvements de flottes. Plus
    son niveau est élevé, plus sa portée est grande : (niveau de la phalange)^2 -
    1 systèmes par défaut, donc le niveau 1 ne couvre que le système de la lune elle-même.
    Un scan coûte 5 000 deutérium, qui doivent se trouver sur la lune. Pour scanner,
    ouvre la vue Galaxie depuis la lune et clique sur une planète à portée. Les lunes
    elles-mêmes ne peuvent pas être scannées avec la phalange, car elles n''ont pas
    d''atmosphère.<br><br>La phalange montre les flottes qui partent de la planète
    scannée ou qui s''y rendent : quand elles arrivent, quand un stationnement prend
    fin et quand les flottes du propriétaire rentrent. Les déploiements et les missiles
    ne sont jamais affichés, pas plus que les vols de recyclage ou de commerce à destination
    de la planète.'
  '43': 'Les portes de saut sont d''énormes émetteurs qui envoient de grandes flottes
    à travers l''univers sans perdre de temps. Elles ne consomment pas de deutérium,
    mais on ne peut pas transférer de ressources de cette façon. Les deux portes doivent
    être prêtes : après un saut, chaque porte a besoin d''un temps de recharge, qui
    est par défaut de 60 minutes au niveau 1 et diminue à chaque niveau, jusqu''à
    10 minutes à partir du niveau 15.'
  '44': Les silos de missiles stockent tes missiles. Par défaut, chaque niveau ajoute
    10 emplacements. Un missile d'interception occupe 1 emplacement, un missile interplanétaire
    en occupe 2.
  '106': 'Cette technologie permet de recueillir des informations sur d''autres planètes
    et lunes. Quand tu envoies des sondes, ta technologie d''espionnage est comparée
    à celle de la cible : plus ton niveau est élevé, plus le rapport contient d''informations
    et moins tes sondes risquent d''être détectées. Plus de sondes révèlent plus de
    détails, mais augmentent le risque de détection. À certains niveaux de technologie
    d''espionnage, tu en apprends aussi davantage sur les flottes étrangères dans
    ta vue d''ensemble :<br><br><li>Aux niveaux 0-1, tu vois seulement qu''une flotte
    approche de ta planète</li><li>Aux niveaux 2-3, tu vois combien de vaisseaux approchent</li><li>Aux
    niveaux 4-7, tu vois quels types de vaisseaux composent la flotte</li><li>À partir
    du niveau 8, tu vois combien de vaisseaux de chaque type composent la flotte</li>'
  '108': De meilleurs ordinateurs permettent de commander plus de flottes. Chaque
    niveau de la technologie Ordinateur augmente d'une unité ton nombre maximal de
    flottes.
  '109': La technologie Armes rend les systèmes d'armes plus efficaces. Chaque niveau
    augmente la puissance d'armement de toutes les unités de 10 % de la valeur de
    base.
  '110': La technologie Bouclier rend les boucliers des vaisseaux et des défenses
    plus efficaces. Chaque niveau augmente la puissance des boucliers de 10 % de la
    valeur de base.
  '111': Des alliages spéciaux améliorent le blindage des vaisseaux et des défenses.
    Chaque niveau augmente l'efficacité du blindage de 10 %.
  '113': Maîtriser les différents types d'énergie est la clé de nombreuses nouvelles
    technologies. Chaque niveau de la technologie Énergie augmente aussi la production
    d'énergie de la centrale de fusion.
  '114': En intégrant les 4e et 5e dimensions, tu peux rechercher un nouveau type
    de propulsion, plus économique et plus efficace.
  '115': 'Développer ce réacteur rend certains vaisseaux plus rapides, mais chaque
    niveau n''ajoute que 10 % de la vitesse de base. Vaisseaux concernés : petit transporteur,
    grand transporteur, chasseur léger, recycleur et sonde d''espionnage (le petit
    transporteur et le recycleur passent plus tard à de meilleurs réacteurs).'
  '117': 'Le réacteur à impulsion repose sur le principe de réaction. Le développer
    rend certains vaisseaux plus rapides, mais chaque niveau n''ajoute que 20 % de
    la vitesse de base : bombardier, croiseur, chasseur lourd et vaisseau de colonisation,
    ainsi que le petit transporteur et le recycleur une fois passés à ce réacteur.
    Les missiles interplanétaires volent aussi plus loin à chaque niveau.'
  '118': 'La propulsion hyperespace déforme l''espace autour d''un vaisseau. La développer
    rend certains vaisseaux plus rapides, mais chaque niveau n''ajoute que 30 % de
    la vitesse de base : traqueur, vaisseau de bataille, destructeur, étoile de la
    mort, lune noire, transporteur ultime, avatar et recycleur ultime, ainsi que le
    bombardier et le recycleur une fois passés à ce réacteur. Requiert la technologie
    Hyperespace (niveau 3) et un laboratoire de recherche (niveau 7).'
  '120': La lumière focalisée produit un faisceau qui endommage tout ce qu'il touche.
    Requiert un laboratoire de recherche (niveau 1) et la technologie Énergie (niveau
    2).
  '121': Un faisceau mortel d'ions accélérés qui inflige d'énormes dégâts à l'impact.
  '122': Un développement plus poussé de la technologie ionique, qui accélère du plasma
    à haute énergie obtenu en surchauffant des ions. L'effet à l'impact est dévastateur.
  '123': Les chercheurs de différentes planètes communiquent via ce réseau. Chaque
    niveau permet à un laboratoire de plus de se joindre à celui où tu lances une
    recherche. Les laboratoires de plus haut niveau sont choisis, et un laboratoire
    connecté doit être assez avancé pour mener cette recherche seul. Leurs niveaux
    sont additionnés pour calculer le temps de recherche.
  '124': 'L''astrophysique débloque la colonisation et les expéditions dans l''espace
    profond. La limite de colonies, la durée de stationnement et les positions ci-dessous
    sont les réglages par défaut ; ton univers peut différer.<br><br> <li>Limite de
    colonies</li> Niveau 1-2 = 2 planètes<br> Niveau 3-4 = 3 planètes<br> Niveau 5-6
    = 4 planètes<br> Niveau 7-8 = 5 planètes<br> Niveau 9-10 = 6 planètes<br> Niveau
    11-12 = 7 planètes<br> Niveau 13-14 = 8 planètes<br> Niveau 15-16 = 9 planètes<br>
    Niveau 17-18 = 10 planètes<br> Niveau 19-20 = 11 planètes<br> Niveau 21+ = 12
    planètes<br><br> <li>Slots d''expédition</li> Niveau 1-3 = 1 expédition<br> Niveau
    4-8 = 2 expéditions<br> Niveau 9-15 = 3 expéditions<br> Niveau 16-24 = 4 expéditions<br>(une
    de plus à chaque niveau carré suivant : 25, 36, ...)<br><br> <li>Durée de stationnement
    en expédition</li> Niveau = durée maximale en heures<br><br> <li>Positions colonisables</li>
    Niveau 1-3 = 4-12<br> Niveau 4-5 = 3-13<br> Niveau 6-7 = 2-14<br> Niveau 8+ =
    1-15'
  '131': Augmente la production de métal de 2 % par niveau.
  '132': Augmente la production de cristal de 2 % par niveau.
  '133': Augmente la production de deutérium de 2 % par niveau.
  '134': Réduit les coûts de vol de 2 % par niveau.
  '199': Tirer une charge concentrée de particules de graviton crée un champ de gravité
    artificiel capable de détruire des vaisseaux, et même des lunes. Requiert un laboratoire
    de recherche (niveau 12).
  '202': Le petit transporteur est un vaisseau agile qui achemine rapidement des ressources
    vers d'autres planètes.<br>Il vole avec le réacteur à combustion jusqu'à ce que
    ton réacteur à impulsion atteigne le niveau 5. À partir de là, il passe au réacteur
    à impulsion, ce qui double sa vitesse de base.
  '203': Ce cargo transporte bien plus que le petit transporteur et est généralement
    plus rapide grâce à un réacteur amélioré.
  '204': Le premier vaisseau de combat que tout empereur construit. Le chasseur léger
    est agile, mais vulnérable seul ; en grand nombre, il devient une vraie menace
    pour n'importe quel empire. Les chasseurs légers sont les premiers à escorter
    les petits et grands transporteurs vers des planètes hostiles faiblement défendues.
  '205': Ce chasseur a un meilleur blindage et frappe plus fort que le chasseur léger.
  '206': Les croiseurs ont presque trois fois le blindage des chasseurs lourds et
    plus de deux fois leur puissance de feu. Ils sont aussi très rapides.
  '207': 'Les vaisseaux de bataille sont l''épine dorsale d''une flotte. Canons lourds,
    grande vitesse et vastes soutes : des adversaires à prendre très au sérieux.'
  '208': 'Ce vaisseau bien blindé conquiert de nouvelles planètes, dont un empire
    en plein essor a besoin pour grandir. Sur la nouvelle colonie, le vaisseau est
    démonté et tout le matériau recyclable sert à développer ce nouveau monde. Le
    nombre de planètes que tu peux coloniser dépend directement de l''astrophysique :
    le premier niveau, puis un niveau sur deux, permettent une colonie de plus (par
    défaut).'
  '209': Le recycleur récolte des matières premières dans les champs de débris. Sa
    capacité de chargement est de 20 000. Il part avec le réacteur à combustion, passe
    au réacteur à impulsion quand ton réacteur à impulsion atteint le niveau 17, puis
    à la propulsion hyperespace quand ta propulsion hyperespace atteint le niveau
    15.
  '210': Les sondes d'espionnage sont de petits drones agiles qui transmettent des
    données sur les flottes et les planètes, même à grande distance.
  '211': Le bombardier a été conçu spécialement pour détruire les défenses d'une planète.<br>Il
    vole avec le réacteur à impulsion et passe à la propulsion hyperespace quand ta
    propulsion hyperespace atteint le niveau 8.
  '212': Les satellites solaires sont de simples plateformes de cellules solaires
    placées sur une haute orbite stationnaire. Ils captent la lumière du soleil et
    la renvoient par laser vers la station au sol.
  '213': 'Le destructeur est le roi des vaisseaux de guerre. Contre les canons laser
    légers, il dispose du tir rapide : après chaque tir réussi, il tire à nouveau
    dans 9 cas sur 10.'
  '214': La puissance destructrice de l'étoile de la mort n'a pas d'égale, et elle
    peut détruire des lunes.
  '215': Le traqueur est spécialisé dans l'interception des flottes ennemies.
  '216': 'Le successeur de la célèbre étoile de la mort : bien plus rapide et plus
    robuste, avec une immense soute, mais elle frappe un peu moins fort.'
  '217': 'Une évolution du grand transporteur, avec une capacité de transport bien
    supérieure. Il fonctionne avec la propulsion hyperespace : il démarre donc plus
    lentement que le grand transporteur, mais prend de l''avance à mesure que ta propulsion
    hyperespace progresse.'
  '218': Le pire scénario imaginable, même s'il est très lent.
  '219': Un immense espace de chargement et de nouveaux moteurs lui permettent de
    voler plus vite et de récolter davantage dans les champs de débris.
  '220': 'Le Colosse d''Acier est une véritable forteresse spatiale, protégée par
    des boucliers impénétrables et un blindage massif. Même les assauts les plus violents
    rebondissent alors qu’il avance inexorablement. Mais cette supériorité défensive
    a un prix : son armement est dérisoire et ses moteurs lents en font un géant maladroit.
    Au lieu d’attaques éclairs ou de manœuvres agiles, le Colosse d''Acier mise sur
    sa pure résistance. Ceux qui souhaitent l’arrêter devront faire preuve d’une endurance
    sans faille – ou d’une puissance de feu écrasante.'
  '221': 'Lame de Tempête est un chasseur d’élite : incroyablement rapide et armé
    sans pitié. Ses ennemis ont à peine le temps de la voir avant qu’elle ne frappe.
    La défense est une préoccupation secondaire – elle n’a pas besoin d’encaisser
    ce qu’elle peut simplement éviter. Son seul objectif : les transporteurs et les
    flottes de recycleurs, anéantis sans résistance. Grâce à sa vitesse fulgurante,
    elle peut frapper à tout moment et disparaître avant l’arrivée des renforts. Quiconque
    est pris pour cible par la Lame de Tempête a peu de chances de s’enfuir.'
  '222': >-
    Le Croiseur Lourd est une évolution renforcée du croiseur standard. Avec des
    boucliers améliorés et une puissance de feu considérable, il peut tenir tête
    aux ennemis massifs. Il brille particulièrement lorsqu'il est utilisé avec
    des Colosses d’Acier, des Destroyers et des Bombardiers. Cependant, malgré
    sa puissance, il reste lent et peu maniable.
  '223': >-
    Le Drone de Bouclier représente une approche innovante de la défense de
    flotte, avec un accent particulier sur la protection de l'équipage. Les
    technologies de bouclier, bien que lourdes, ont considérablement réduit la
    vitesse de vol et la maniabilité. Malgré ses mauvaises caractéristiques de
    vol, il est extrêmement efficace en défense. La structure obsolète a été
    poussée à ses limites pour offrir une défense presque impénétrable.
  '224': >-
    Le Transporteur d'Assaut Improvisé est un vaisseau de transport non testé,
    équipé d'une armement minimal, créé spécifiquement pour déranger les voisins
    imprudents et non préparés. Ce vaisseau improvisé n'est pas conçu pour un
    usage prolongé, mais pour des attaques rapides et impulsives qui provoquent
    des réactions immédiates. Un conflit de voisinage est pratiquement garanti
    dès qu'il est déployé. Avec son armement limité et sa nature imprévisible,
    il devient un outil dangereux pour une escalade rapide des conflits.
  '225': >-
    Le Transporteur de Tempête est un véritable chef-d'œuvre technologique qui
    offre l'équilibre parfait entre puissance de combat, vitesse et capacité de
    transport. Sa capacité à déployer rapidement des troupes et des ressources
    tout en apportant une impressionnante puissance de feu sur le champ de
    bataille en fait un élément essentiel de toute flotte puissante. Que ce soit
    pour des unités d'assaut rapides ou pour soutenir des opérations à long
    terme, le Transporteur de Tempête est la clé d'une guerre efficace et un
    incontournable dans toute flotte.
  '226': >-
    Le Transporteur de Bataille Colossal représente le summum de l'ingénierie.
    Malgré son design légèrement volumineux et sa vitesse de vol relativement
    lente, c'est le transporteur de bataille le plus blindé jamais vu. Sa
    puissance de feu écrasante en fait une force imparable sur le champ de
    bataille. Ce colosse peut aisément percer les lignes ennemies tout en
    offrant une protection maximale à son équipage. Il incarne la force et la
    résilience et est un atout essentiel pour toute flotte lourdement armée.
  '227': >-
    Le Recycleur Optimisé est une avancée technologique du modèle standard.
    Grâce à son puissant moteur à impulsion, il atteint les champs de débris
    plus rapidement et à moindre coût, ce qui en fait un atout essentiel pour
    toute flotte avancée. Sa conception optimisée réduit les coûts de
    construction tout en augmentant l’efficacité de récupération des ressources.
    Disponible à partir du midgame, il offre un avantage stratégique crucial
    pour tout empire en expansion.
  '228': 'Le Récupérateur Oméga représente l’apogée de la technologie de récupération,
    mais à un prix élevé. Son puissant moteur hyperspatial lui permet d’atteindre
    les champs de débris en un temps record et de collecter les ressources plus vite
    que n’importe quel autre vaisseau. Cependant, cette vitesse se fait au détriment
    de l’efficacité : ses coûts de construction et de carburant sont colossaux, ce
    qui en fait une option viable uniquement pour les commandants fortunés en fin
    de partie. Pour ceux qui privilégient la vitesse aux économies, voici le récupérateur
    ultime.'
  '401': Le lanceur de missiles est une défense simple mais économique. Après un combat,
    environ 70 % des défenses détruites sont en moyenne reconstruites.
  '402': Les lasers légers sont de simples armes au sol. Des systèmes de ciblage spéciaux
    suivent l'ennemi, et un laser de haute intensité perce la coque de la cible. Après
    un combat, environ 70 % des défenses détruites sont en moyenne reconstruites.
  '403': Le laser lourd est une version améliorée, plus pratique, du laser léger.
    Après un combat, environ 70 % des défenses détruites sont en moyenne reconstruites.
  '404': Le canon de Gauss tire des projectiles métalliques de haute densité à très
    grande vitesse. Après un combat, environ 70 % des défenses détruites sont en moyenne
    reconstruites.
  '405': Un canon à ions tire des faisceaux d'ions (particules chargées positivement
    ou négativement). Après un combat, environ 70 % des défenses détruites sont en
    moyenne reconstruites.
  '406': La tourelle à plasma utilise la pile à combustible d'un grand réacteur nucléaire
    pour alimenter un accélérateur électromagnétique qui tire des impulsions (tores)
    de plasma. Après un combat, environ 70 % des défenses détruites sont en moyenne
    reconstruites.
  '407': Le petit bouclier enveloppe toute la planète d'un champ qui absorbe d'énormes
    quantités d'énergie. Un seul peut être construit par planète.
  '408': Le grand bouclier est une évolution qui demande nettement plus d'énergie
    pour résister aux attaques. Un seul peut être construit par planète.
  '409': L'évolution de la technologie des boucliers planétaires. Il consomme beaucoup
    plus d'énergie, mais encaisse plus d'attaques que tout autre bouclier. Un seul
    peut être construit par planète.
  '410': Après des années de recherche sur la gravité, les scientifiques ont mis au
    point un canon à gravitons qui génère un petit champ de gravitons concentré et
    le tire sur l'ennemi.
  '411': Une plateforme de défense immobile, sans énergie propre, maintenue par la
    gravité sur une orbite stable autour de la planète. Lancer ce processus demande
    d'énormes quantités d'énergie. Une seule peut être construite par planète.
  '412': >-
    Le Bunker est une structure fortement fortifiée, conçue pour résister même
    aux attaques les plus puissantes. Il offre une protection inégalée aux
    habitants de la planète et à ses infrastructures essentielles, ce qui en
    fait un pilier de la défense planétaire.
  '413': >-
    Le Titan Laser est une arme colossale dotée d'une puissance destructrice
    sans pareille.
  '414': >-
    Le « Decoy » est un système défensif sophistiqué conçu pour induire en
    erreur et désorienter les forces ennemies. En se faisant passer pour un
    lance-missiles, il dissuade les attaques.
  '502': Les missiles d'interception détruisent les missiles interplanétaires entrants.
    Il faut un missile d'interception par missile interplanétaire.
  '503': Les missiles interplanétaires détruisent les défenses de l'adversaire, sauf
    si des missiles d'interception les abattent. Les défenses ainsi détruites ne sont
    pas reconstruites. Par défaut, leur portée (en systèmes solaires) dépend du niveau
    de ton réacteur à impulsion :<br>Portée = (5 x niveau du réacteur à impulsion)
    - 1
  '901': Le métal est la ressource principale des bâtiments et des vaisseaux. C'est
    la ressource la moins chère, mais aussi celle dont tu as le plus besoin et, comme
    le cristal, c'est celle qui demande le moins d'énergie à produire. Plus les mines
    sont grandes, plus elles creusent profondément dans le sol.
  '902': Le cristal est la ressource principale des circuits électroniques et de certains
    alliages. Il est produit dans des mines souterraines, où la matière première est
    transformée en circuits sur place.
  '903': Le deutérium se trouve dans les mers les plus profondes et c'est l'une des
    ressources les plus rares de l'univers. Il faut atteindre le fond marin pour l'obtenir,
    ce qui en fait la ressource la plus chère.
  '911': L'énergie est nécessaire pour produire chaque ressource.
  "229": "Développée pour briser la domination des Xer, la Vipère est l'arme ultime contre les chasseurs légers, les chasseurs lourds et les croiseurs. Avec ses canons à tir rapide et sa technologie avancée, elle fait basculer l'équilibre des forces dans l'univers."
  '230': 'Rapide. Précis. Intouchable. L''Intercepteur n''est pas fait pour les combats
    équitables : il est conçu pour frapper vite et fort, créant un avantage écrasant
    en un clin d''œil.'
  "231": "Le Béhémoth est le fruit de décennies de recherche sur les gravitons, réunissant cette technologie dans une plateforme de combat implacable. Contrairement aux Étoiles de la mort, il n'a pas été conçu pour la destruction planétaire, mais pour une efficacité maximale sur le champ de bataille. En abandonnant les systèmes énergivores nécessaires à la destruction des lunes, sa conception a été considérablement allégée, permettant des moteurs plus puissants, une plus grande agilité et une puissance de feu accrue. Son canon à gravitons compact en fait une machine de destruction mobile, capable d'anéantir seule même de vastes flottes."
  '232': 'Le Titan du Vide représente le sommet de la technologie moderne des gravitons.
    Chaque aspect de sa conception sert un seul but : l''anéantissement rapide des
    lunes ennemies. Les tourelles d''armes conventionnelles ont été délibérément omises
    pour réduire la masse et faire place à de colossaux générateurs de cristal. Ceux-ci
    alimentent les bobines d''accélération les plus avancées jamais construites dans
    les galaxies connues, offrant au vaisseau une mobilité inégalée. Les besoins immenses
    en cristal font de chaque Titan du Vide un exploit industriel monumental – et
    un symbole de puissance destructrice illimitée.'
secureResources: Chaque niveau d'un entrepôt protège 1 % de la production quotidienne
  de cette ressource contre le pillage lors des attaques, jusqu'à un maximum de
  10 %.
shortDescription:
  '1': Les mines de métal extraient le minerai sur lequel repose tout empire, naissant
    ou établi.
  '2': Le cristal est l'ingrédient clé des circuits électroniques et de certains alliages.
  '3': Le deutérium alimente tes vaisseaux spatiaux. Il est extrait des profondeurs
    marines et, comme c'est une substance rare, il coûte relativement cher.
  '4': Les centrales solaires transforment la lumière du soleil en énergie. Chaque
    mine a besoin d'énergie pour fonctionner.
  '6': Par défaut, chaque niveau réduit le temps de recherche de 8 %.
  '12': La centrale de fusion fusionne du deutérium pour produire de l'énergie.
  '14': Les usines de robots fournissent des robots de construction qui aident à bâtir
    tes bâtiments. Chaque niveau accélère l'amélioration des bâtiments.
  '15': Le summum de la robotique. Chaque niveau divise par deux le temps de construction
    des bâtiments, des vaisseaux et des défenses.
  '21': Tous les vaisseaux et toutes les défenses sont construits dans le chantier
    spatial de la planète.
  '22': Permet de stocker l'excédent de métal.
  '23': Permet de stocker l'excédent de cristal.
  '24': Permet de stocker l'excédent de deutérium.
  '31': Il te faut un laboratoire de recherche pour étudier de nouvelles technologies.
  '33': 'Le terraformeur agrandit la surface exploitable de la planète : 5 cases supplémentaires
    par niveau, plus une en bonus à chaque niveau pair. Chaque niveau occupe lui-même
    une case.'
  '34': "Le dépôt d'alliance te permet de prolonger, contre du deutérium, le séjour des flottes amies stationnées sur ta planète : par ravitaillement, jusqu'à autant d'heures que le niveau du dépôt."
  '35': Le dock de réparation remet en état des vaisseaux d'un champ d'épaves.
  '41': 'La lune n''a pas d''atmosphère, et une lune toute neuve n''a de place que
    pour un seul bâtiment : commence donc par la base lunaire.'
  '42': La phalange de capteurs permet de surveiller les mouvements de flottes. Plus
    son niveau est élevé, plus sa portée est grande.
  '43': Les portes de saut sont d'énormes émetteurs qui envoient de grandes flottes
    à travers l'univers sans perdre de temps.
  '44': Les silos de missiles stockent tes missiles.
  '106': Cette technologie permet de recueillir des informations sur d'autres planètes
    et lunes.
  '108': De meilleurs ordinateurs permettent de commander plus de flottes. Chaque
    niveau de la technologie Ordinateur augmente d'une unité ton nombre maximal de
    flottes.
  '109': La technologie Armes rend les systèmes d'armes plus efficaces. Chaque niveau
    augmente la puissance d'armement de toutes les unités de 10 % de la valeur de
    base.
  '110': La technologie Bouclier rend les boucliers des vaisseaux et des défenses
    plus efficaces. Chaque niveau augmente la puissance des boucliers de 10 % de la
    valeur de base.
  '111': Des alliages spéciaux améliorent le blindage des vaisseaux et des défenses.
    Chaque niveau augmente l'efficacité du blindage de 10 %.
  '113': Maîtriser les différents types d'énergie est la clé de nombreuses nouvelles
    technologies.
  '114': En intégrant les 4e et 5e dimensions, tu peux rechercher un nouveau type
    de propulsion, plus économique et plus efficace.
  '115': Développer ce réacteur rend certains vaisseaux plus rapides, mais chaque
    niveau n'ajoute que 10 % de la vitesse de base.
  '117': Le réacteur à impulsion repose sur le principe de réaction. Le développer
    rend certains vaisseaux plus rapides, mais chaque niveau n'ajoute que 20 % de
    la vitesse de base.
  '118': La propulsion hyperespace déforme l'espace autour d'un vaisseau. La développer
    rend certains vaisseaux plus rapides, mais chaque niveau n'ajoute que 30 % de
    la vitesse de base.
  '120': La lumière focalisée produit un faisceau qui endommage tout ce qu'il touche.
  '121': Un faisceau mortel d'ions accélérés qui inflige d'énormes dégâts à l'impact.
  '122': Un développement plus poussé de la technologie ionique, qui accélère du plasma
    à haute énergie obtenu en surchauffant des ions. L'effet à l'impact est dévastateur.
  '123': Les chercheurs de différentes planètes communiquent via ce réseau.
  '124': Débloque la colonisation et les expéditions dans l'espace profond. Des planètes
    en plus aux niveaux impairs, des slots d'expédition en plus aux niveaux carrés,
    des stationnements d'expédition plus longs et plus de positions dans un système.
  '131': Augmente la production de métal de 2 % par niveau.
  '132': Augmente la production de cristal de 2 % par niveau.
  '133': Augmente la production de deutérium de 2 % par niveau.
  '134': Réduit les coûts de vol de 2 % par niveau.
  '199': >-
    En lançant une charge concentrée de particules Gravitons un champ de
    pesanteur artificielle peut être construit, où les vaisseaux ou même les
    lunes peuvent être anéantis.
  '202': Le petit transporteur est un vaisseau agile qui achemine rapidement des ressources
    vers d'autres planètes.
  '203': Ce cargo transporte bien plus que le petit transporteur et est généralement
    plus rapide grâce à un réacteur amélioré.
  '204': Le premier vaisseau de combat que tout empereur construit. Le chasseur léger
    est agile, mais vulnérable seul ; en grand nombre, il devient une vraie menace
    pour n'importe quel empire. Les chasseurs légers sont les premiers à escorter
    les petits et grands transporteurs vers des planètes hostiles faiblement défendues.
  '205': Ce chasseur a un meilleur blindage et frappe plus fort que le chasseur léger.
  '206': Les croiseurs ont presque trois fois le blindage des chasseurs lourds et
    plus de deux fois leur puissance de feu. Ils sont aussi très rapides.
  '207': 'Les vaisseaux de bataille sont l''épine dorsale d''une flotte. Canons lourds,
    grande vitesse et vastes soutes : des adversaires à prendre très au sérieux.'
  '208': Ce vaisseau permet de coloniser les planètes libres.
  '209': Le recycleur récolte des matières premières dans les champs de débris.
  '210': Les sondes d'espionnage sont de petits drones agiles qui transmettent des
    données sur les flottes et les planètes, même à grande distance.
  '211': >-
    Le bombardier a été spécialement conçu pour détruire les défenses
    planétaires.
  '212': Les satellites solaires sont de simples plateformes de cellules solaires
    placées sur une haute orbite stationnaire. Ils captent la lumière du soleil et
    la renvoient par laser vers la station au sol.
  '213': Le destructeur est le roi des vaisseaux de guerre.
  '214': La puissance destructrice de l'étoile de la mort n'a pas d'égale, et elle
    peut détruire des lunes.
  '215': Le traqueur est spécialisé dans l'interception des flottes ennemies.
  '216': 'Le successeur de la célèbre étoile de la mort : bien plus rapide et plus
    robuste, avec une immense soute, mais elle frappe un peu moins fort.'
  '217': 'Une évolution du grand transporteur, avec une capacité de transport bien
    supérieure. Il fonctionne avec la propulsion hyperespace : il démarre donc plus
    lentement que le grand transporteur, mais prend de l''avance à mesure que ta propulsion
    hyperespace progresse.'
  '218': Le pire scénario imaginable, même s'il est très lent.
  '219': Un immense espace de chargement et de nouveaux moteurs lui permettent de
    voler plus vite et de récolter davantage dans les champs de débris.
  '220': Le Colosse d'Acier résiste à toutes les attaques grâce à ses boucliers massifs
    et à son épais blindage, mais ses armes et ses moteurs laissent à désirer.
  '221': 'La Lame de Tempête est un chasseur fulgurant, armé jusqu''aux dents. Défense ?
    Inutile : ses proies sont des transporteurs et des recycleurs sans défense.'
  '222': Un croiseur lent mais lourdement armé, aux boucliers et aux capacités offensives
    améliorés.
  '223': Une refonte du chasseur léger, qui privilégie la sécurité de l'équipage au
    prix de mauvaises performances de vol.
  '224': Un vaisseau de transport non testé, à l'armement minimal, conçu pour embêter
    les voisins imprudents et déclencher un conflit immédiat.
  '225': Un vaisseau qui allie puissance de combat, vitesse et capacité de transport,
    et devient indispensable à toute flotte puissante.
  '226': Un transporteur de bataille très blindé, à l'allure imposante et un peu massive,
    dont la puissance de feu écrasante vient à bout des adversaires les plus coriaces.
  '227': Une version améliorée du recycleur classique, dotée de moteurs à impulsion,
    pour des missions de récupération plus efficaces et moins coûteuses.
  '228': Une version du recycleur extrêmement rapide mais peu rentable, dotée de la
    propulsion hyperespace.
  '231': Une étoile de la mort plus petite et plus rapide, incapable de détruire des
    lunes. Le Béhémoth est redoutable face aux flottes.
  '401': Le lanceur de missiles est une défense simple mais économique.
  '402': Les lasers légers sont de simples armes de défense au sol. Des systèmes de
    ciblage spéciaux suivent les vaisseaux ennemis, et un laser de haute intensité
    perce la coque de la cible.
  '403': Le laser lourd est une version améliorée du laser léger.
  '404': >-
    Le canon de Gauss tire des projectiles en métal de haute densité à très
    grande vitesse.
  '405': >-
    Un canon à ions est une arme qui tire des faisceaux d'ions (particules
    chargées positivement ou négativement).
  '406': La tourelle à plasma utilise la pile à combustible d'un grand réacteur nucléaire
    pour alimenter un accélérateur électromagnétique qui tire des impulsions (tores)
    de plasma.
  '407': Le petit bouclier enveloppe toute la planète d'un champ qui absorbe d'énormes
    quantités d'énergie.
  '408': Le grand bouclier peut absorber nettement plus d'énergie lors des attaques.
  '409': L'évolution de la technologie des boucliers planétaires. Il consomme beaucoup
    plus d'énergie, mais encaisse plus d'attaques que tout autre bouclier.
  '410': Après des années de recherche sur la gravité, les scientifiques ont mis au
    point un canon à gravitons qui génère un petit champ de gravitons concentré et
    le tire sur l'ennemi.
  '411': >-
    Il s'agit une plateforme défensive. Elle n'a aucun pouvoir direct, et elle
    est maintenue par gravité dans une orbite stable de la planète. Ce processus
    exige une quantité élevée d'énergie. 
  '412': Ça protège ! Comme la brique Lego dans Kindergarten TD.
  '413': Le Titan Laser est un laser colossal.
  '414': Le leurre est un système défensif sophistiqué conçu pour tromper et désorienter
    les forces ennemies. En se faisant passer pour un lanceur de missiles, il dissuade
    les attaques.
  '502': Les missiles d'interception détruisent les missiles interplanétaires entrants.
  '503': Les missiles interplanétaires détruisent les défenses de l'adversaire.
  '901': Le métal est la ressource principale des bâtiments et des vaisseaux. C'est
    la ressource la moins chère, mais aussi celle dont tu as le plus besoin.
  '902': Le cristal est la ressource principale des circuits électroniques et de certains
    alliages.
  '903': Le deutérium se trouve dans les mers les plus profondes. C'est la ressource
    la plus chère, et aussi celle qui demande le plus d'énergie.
  '911': L'énergie est nécessaire pour produire chaque ressource.
  '229': Développée pour briser la domination des Xer, la Vipère est l'arme ultime
    contre les chasseurs légers, les chasseurs lourds et les croiseurs. Avec ses canons
    à tir rapide et sa technologie avancée, elle fait basculer l'équilibre des forces
    dans l'univers.
  '230': 'Rapide. Précis. Intouchable. L''Intercepteur n''est pas fait pour les combats
    équitables : il est conçu pour frapper vite et fort, créant un avantage écrasant
    en un clin d''œil.'
  '232': Plus rapide, plus explosif, toujours une bonne surprise. Le Titan du Vide
    est la terreur des lunes.
