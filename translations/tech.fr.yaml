spytechStatsDescription: Aux niveaux 0 et 1, tu ne vois que le total de points des
  autres joueurs. À partir du niveau 2, tu vois aussi leurs points de bâtiments ;
  à partir du niveau 4, leurs points de recherche. À partir du niveau 6, tu vois
  en plus leurs points de vaisseaux et de défenses, ainsi que leurs statistiques
  de combat.
