spytechStatsDescription: >-
  Aux niveaux 0 et 1, seuls les points totaux des autres joueurs sont visibles.
  À partir du niveau 2, les points de construction des autres joueurs sont
  également visibles. À partir du niveau 4, les points de recherche sont
  également affichés. A partir du niveau 6, les navires et les points de défense
  sont affichés ainsi que les statistiques de la bataille.
