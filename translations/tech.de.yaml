spytechStatsDescription: >-
  Auf Stufe 0 und 1 siehst du nur die Gesamtpunkte anderer Spieler. Ab Stufe 2
  siehst du zusätzlich ihre Gebäudepunkte, ab Stufe 4 ihre Forschungspunkte. Ab
  Stufe 6 kommen Schiffs- und Verteidigungspunkte sowie die Kampfstatistiken
  dazu.
