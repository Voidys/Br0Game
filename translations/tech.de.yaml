longDescription:
  '1': >-
    Metallminen fördern das Erz, auf dem jedes junge wie etablierte Imperium
    aufbaut. Metall ist der wichtigste Baustoff für Gebäude und Schiffe, der
    günstigste Rohstoff und der, den du am meisten brauchst. Zusammen mit
    Kristall braucht es zur Herstellung außerdem am wenigsten Energie. Je weiter
    eine Mine ausgebaut ist, desto tiefer gräbt sie sich in den Boden und desto
    höher ist die Produktion. Dafür braucht sie aber auch mehr Energie.
  '2': >-
    Kristall ist der Schlüsselrohstoff für Elektronik und bestimmte Legierungen.
    Kristallminen bauen Mineralien ab und verarbeiten sie gleich zu den nötigen
    Legierungen. Das kostet genauso viel Energie wie beim Metall.
  '3': >-
    Deuterium ist schwerer Wasserstoff und der Treibstoff deiner Raumschiffe.
    Die größten Vorräte liegen tief auf dem Meeresgrund, und je weiter du den
    Synthetisierer ausbaust, desto mehr davon erschließt er. Du brauchst
    Deuterium außerdem für viele Forschungen, für einen Blick in die Galaxie und
    für Phalanx-Scans. Es ist selten und deshalb vergleichsweise teuer.
  '4': >-
    Solarkraftwerke wandeln Sonnenlicht in Energie um und bilden das Fundament
    deiner Energieversorgung. Jede Mine braucht Energie, um zu laufen. Je weiter
    du ein Kraftwerk ausbaust, desto mehr Fläche ist mit Solarzellen bedeckt.
  '6': >-
    Weil die Forschungen immer aufwendiger werden, haben sich die klügsten Köpfe
    der intergalaktischen Forschungsnetzwerke zusammengetan und den TechnoDome
    entwickelt. Standardmäßig verkürzt jede Stufe die Forschungszeit um 8%.
  '12': >-
    Das Fusionskraftwerk gewinnt Energie, indem es Deuterium verschmilzt. Es
    liefert mehr Energie als ein Solarkraftwerk, ist aber teurer im Bau. Der
    Ertrag steigt mit der Energietechnik und mit der Stufe des Kraftwerks
    selbst. Die Formel für die Energieerzeugung lautet:<br> Erzeugte Energie =
    30 x Stufe des Fusionskraftwerks x (1,05 + (0,01 * Stufe der
    Energietechnik))^Stufe des Fusionskraftwerks
  '14': >-
    Roboterfabriken stellen Bauroboter bereit, die dir beim Errichten deiner
    Gebäude helfen. Jede Stufe beschleunigt den Ausbau von Gebäuden.
  '15': >-
    Die Nanitenfabrik ist die Krönung der Robotertechnik. Naniten sind
    nanometergroße Roboter, die sich vernetzen und dadurch Außerordentliches
    leisten. Einmal erforscht, steigern sie die Produktivität in fast allen
    Bereichen. Jede Stufe halbiert die Bauzeit von Gebäuden, Schiffen und
    Verteidigungsanlagen.
  '21': >-
    In der Raumschiffwerft deines Planeten werden alle Schiffe und
    Verteidigungsanlagen gebaut. Je höher die Stufe, desto schneller entstehen
    auch aufwendigere und größere Schiffe und Verteidigungsanlagen. Mit einer
    Nanitenfabrik helfen winzige Roboter den Arbeitern, noch schneller zu
    arbeiten.
  '22': >-
    Riesige Lagerhallen für überschüssiges Metall. Je größer der Speicher, desto
    mehr Metall passt hinein. Ist das Lager voll, wird kein Metall mehr
    gefördert.
  '23': >-
    In diesen riesigen Lagerhallen wird überschüssiger Kristall
    zwischengespeichert. Je größer das Lager, desto mehr Kristall passt hinein.
    Sind die Kristalllager voll, wird kein Kristall mehr gefördert.
  '24': >-
    Riesige Tanks für neu gewonnenes Deuterium. Je größer sie sind, desto mehr
    Deuterium passt hinein. Sind sie voll, wird kein Deuterium mehr gefördert.
  '31': >-
    Ohne Forschungslabor keine neuen Technologien. Die Stufe des Labors
    bestimmt, wie schnell du forschst und welche Technologien du erforschen
    kannst. Geforscht wird im Labor des Planeten, auf dem du die Forschung
    startest, und das Ergebnis gilt für alle deine Planeten. Solange eine
    Forschung läuft, kann kein Forschungslabor ausgebaut werden.
  '33': >-
    Der Terraformer erweitert die nutzbare Fläche des Planeten. Jede Stufe
    bringt dir 5 zusätzliche Felder, auf jeder geraden Stufe noch ein weiteres.
    Jede Stufe des Terraformers belegt selbst ein Feld.<br>Der Bau kostet
    Energie, die aber nicht verbraucht wird: Dein Planet muss sie nur erzeugen
    können (1.000 für Stufe 1, mit jeder Stufe doppelt so viel), auch wenn deine
    Minen sie schon nutzen. Einmal gebaut, lässt sich der Terraformer nie wieder
    abreißen.
  '34': "Mit dem Allianzdepot kannst du befreundete Flotten, die an deinem Planeten halten, mit Deuterium versorgen und so ihren Aufenthalt verlängern. Du öffnest es auf der Gebäudeseite: Für jede haltende Flotte wählst du zwischen 1 Stunde und so vielen Stunden, wie das Depot Stufen hat, und zahlst Stunden mal die stündlichen Haltekosten der Flotte aus dem Deuterium deines Planeten. Die stündlichen Haltekosten sind ein Zehntel des summierten Grundverbrauchs der Schiffe der Flotte, aufgerundet. Eine Flotte kann immer wieder versorgt werden, darf aber nie mehr als 32 Stunden Aufenthalt übrig haben. Versorgt werden können nur Flotten anderer Spieler, die gerade an deinem Planeten im Orbit stehen."
  '35': >-
    Das Reparaturdock kann Schiffe reparieren, die im Kampf zerstört wurden und
    ein Wrackfeld hinterlassen haben. Eine Reparatur dauert höchstens 12 Stunden
    und ist frühestens 30 Minuten nach Entstehung des Wrackfeldes fertig.<br>Ab
    Entstehung des Wrackfeldes hast du 3 Tage Zeit, um die Reparatur zu starten.
    Nach der Reparatur musst du die Schiffe selbst wieder in Dienst stellen.
    Tust du das nicht, gehen sie nach 3 Tagen automatisch wieder in Dienst.
  '41': >-
    Der Mond hat keine Atmosphäre, und ein frischer Mond bietet Platz für nur
    ein Gebäude, deshalb beginnst du am besten mit der Mondbasis. Sie sorgt für
    Atemluft, Gravitation und Wärme. Jede Stufe bringt 3 zusätzliche Felder und
    belegt selbst ein Feld. Einmal gebaut, kann die Mondbasis nie wieder
    abgerissen werden.
  '42': >-
    Die Sensorphalanx lässt dich Flottenbewegungen beobachten. Je höher die
    Stufe, desto größer die Reichweite der Phalanx: standardmäßig
    (Phalanxstufe)^2 - 1 Systeme, Stufe 1 deckt also nur das eigene System des
    Mondes ab. Ein Scan kostet 5.000 Deuterium, das auf dem Mond bereitstehen
    muss. Du scannst, indem du vom Mond aus in die Galaxieansicht wechselst und
    auf einen Planeten in Reichweite klickst. Monde selbst lassen sich mit der
    Phalanx nicht scannen, weil ihnen die Atmosphäre fehlt.<br><br>Die Phalanx
    zeigt Flotten, die vom gescannten Planeten starten oder zu ihm fliegen: ihre
    Ankunft, das Ende einer Haltezeit und die Rückkehr der Flotten des
    Besitzers. Stationierungen und Raketen werden nie angezeigt, ebenso wenig
    Recycling- und Handelsflüge zum Planeten.
  '43': >-
    Sprungtore sind riesige Transmitter, die auch große Flotten ohne Zeitverlust
    quer durchs Universum schicken. Sie verbrauchen kein Deuterium, Rohstoffe
    lassen sich auf diesem Weg aber nicht mitschicken. Beide Tore müssen bereit
    sein: Nach einem Sprung braucht jedes Tor eine Abklingzeit, die
    standardmäßig auf Stufe 1 bei 60 Minuten liegt und mit jeder Stufe kürzer
    wird, bis auf 10 Minuten ab Stufe 15.
  '44': >-
    Raketensilos lagern deine Raketen. Standardmäßig bietet jede Stufe 10
    Plätze: Eine Abfangrakete belegt 1 Platz, eine Interplanetarrakete 2. Die
    Raketentypen lassen sich beliebig kombinieren.
  '106': >-
    Mit dieser Technologie sammelst du Informationen über andere Planeten und
    Monde. Wenn du Sonden schickst, wird deine Spionagetechnik mit der des Ziels
    verglichen: Je höher deine Stufe, desto mehr Infos im Bericht und desto
    kleiner die Chance, dass deine Sonden entdeckt werden. Mehr Sonden liefern
    mehr Details, erhöhen aber auch das Risiko, entdeckt zu werden. Ab
    bestimmten Stufen erfährst du in der Übersicht außerdem mehr über fremde
    Flotten:<br><br><li>Auf Stufe 0-1 siehst du nur, dass sich eine Flotte
    deinem Planeten nähert</li><li>Auf Stufe 2-3 siehst du, wie viele Schiffe
    anfliegen</li><li>Auf Stufe 4-7 siehst du, welche Schiffstypen in der Flotte
    sind</li><li>Ab Stufe 8 siehst du, wie viele Schiffe jedes Typs in der
    Flotte sind</li>
  '108': >-
    Bessere Computer lassen dich mehr Flotten gleichzeitig befehligen. Jede
    Stufe Computertechnik erhöht deine maximale Flottenanzahl um eins. Mehr
    Flotten bedeuten mehr Raids und mehr Beute, und auch Händler profitieren,
    weil sie mehr Handelsflotten gleichzeitig losschicken können. Baue die
    Computertechnik deshalb das ganze Spiel über kontinuierlich aus.
  '109': >-
    Die Waffentechnik macht Waffensysteme wirkungsvoller. Jede Stufe erhöht die
    Waffenstärke aller Einheiten um 10% des Grundwerts. So bleiben deine
    Einheiten auf Dauer konkurrenzfähig, deshalb solltest du sie das ganze Spiel
    über weiterentwickeln.
  '110': >-
    Die Schildtechnik macht die Schilde von Schiffen und Verteidigungsanlagen
    wirksamer. Jede Stufe erhöht die Schildstärke um 10% des Grundwerts.
  '111': >-
    Spezielle Legierungen verbessern die Panzerung von Schiffen und
    Verteidigungsanlagen. Jede Stufe erhöht die Wirksamkeit der Panzerung um 10%
    des Grundwerts.
  '113': >-
    Wer verschiedene Energieformen beherrscht, schaltet viele neue Technologien
    frei. Jede Stufe Energietechnik erhöht außerdem die Energieerzeugung des
    Fusionskraftwerks.
  '114': >-
    Mit der Einbindung der 4. und 5. Dimension kannst du einen neuartigen
    Antrieb erforschen, der sparsamer und leistungsfähiger ist.
  '115': >-
    Verbrennungstriebwerke arbeiten nach dem uralten Rückstoßprinzip:
    Hocherhitzte Materie wird weggeschleudert und treibt das Schiff in die
    Gegenrichtung. Sie sind nicht besonders effizient, aber billig, zuverlässig
    und kaum wartungsbedürftig. Da sie die Grundlage jeder Raumfahrt sind,
    solltest du sie so früh wie möglich erforschen. Jede Stufe macht folgende
    Schiffe um 10% des Grundwerts schneller: Kleiner und Großer Transporter,
    Leichter Jäger, Recycler und Spionagesonde (Kleiner Transporter und Recycler
    wechseln später zu besseren Antrieben).
  '117': >-
    Das Impulstriebwerk arbeitet nach dem Rückstoßprinzip. Die Strahlmasse fällt
    dabei größtenteils als Abfallprodukt der Kernfusion an, zusätzlich kann
    weitere Masse eingespritzt werden. Jede Stufe macht folgende Schiffe um 20%
    des Grundwerts schneller: Bomber, Kreuzer, Schwerer Jäger und Kolonieschiff,
    außerdem Kleiner Transporter und Recycler, sobald sie auf diesen Antrieb
    wechseln. Außerdem fliegen Interplanetarraketen pro Stufe weiter.
  '118': >-
    Der Hyperraumantrieb krümmt den Raum rund um ein Schiff und komprimiert ihn,
    sodass sich weite Strecken sehr schnell zurücklegen lassen. Jede Stufe macht
    Schiffe mit diesem Antrieb (Schlachtkreuzer, Schlachtschiff, Zerstörer,
    Todesstern, Lune Noire, Evo. Transporter, Avatar und Gigarecycler, außerdem
    Bomber und Recycler, sobald sie auf diesen Antrieb wechseln) um 30 Prozent
    des Grundwerts schneller. Voraussetzungen: Hyperraumtechnik (Stufe 3),
    Forschungslabor (Stufe 7).
  '120': >-
    Gebündeltes Licht erzeugt einen Strahl, der alles beschädigt, was er trifft.
    Laser (Lichtverstärkung durch induzierte Strahlungsemission) finden überall
    Anwendung, von optischen Computern bis zu schweren Laserwaffen, die mühelos
    Schiffspanzerungen durchschneiden. Die Lasertechnik ist die Grundlage für
    viele weitere Waffentechnologien. Voraussetzungen: Forschungslabor (Stufe
    1), Energietechnik (Stufe 2).
  '121': >-
    Ein tödlicher Strahl aus beschleunigten Ionen, der beim Aufprall enormen
    Schaden anrichtet.
  '122': >-
    Eine Weiterentwicklung der Ionentechnik: Statt Ionen wird hochenergetisches
    Plasma beschleunigt, das durch extremes Erhitzen von Ionen entsteht. Beim
    Aufprall hat es eine verheerende Wirkung.
  '123': >-
    Forscher verschiedener Planeten kommunizieren über dieses Netzwerk. Jede
    Stufe schaltet ein weiteres Labor zu dem Labor dazu, in dem du eine
    Forschung startest. Dabei werden immer die Labore mit den höchsten Stufen
    gewählt. Das vernetzte Labor muss weit genug ausgebaut sein, um die
    Forschung allein durchführen zu können. Die Stufen aller beteiligten Labore
    werden addiert und bestimmen die Forschungszeit.
  '124': >-
    Die Astrophysik schaltet Kolonisierung und Expeditionen in den tiefen
    Weltraum frei. Kolonielimit, Expeditionsdauer und Positionen unten sind die
    Standardwerte; dein Universum kann abweichen.<br><br> <li>Kolonielimit</li>
    Stufe 1-2 = 2 Planeten<br> Stufe 3-4 = 3 Planeten<br> Stufe 5-6 = 4
    Planeten<br> Stufe 7-8 = 5 Planeten<br> Stufe 9-10 = 6 Planeten<br> Stufe
    11-12 = 7 Planeten<br> Stufe 13-14 = 8 Planeten<br> Stufe 15-16 = 9
    Planeten<br> Stufe 17-18 = 10 Planeten<br> Stufe 19-20 = 11 Planeten<br>
    Stufe 21+ = 12 Planeten<br><br> <li>Expeditionsslots</li> Stufe 1-3 = 1
    Expedition<br> Stufe 4-8 = 2 Expeditionen<br> Stufe 9-15 = 3
    Expeditionen<br> Stufe 16-24 = 4 Expeditionen<br>(eine weitere auf jeder
    folgenden Quadratstufe: 25, 36, ...)<br><br> <li>Expeditionsdauer</li> Stufe
    = maximale Haltezeit in Stunden<br><br> <li>Kolonisierbare Positionen</li>
    Stufe 1-3 = 4-12<br> Stufe 4-5 = 3-13<br> Stufe 6-7 = 2-14<br> Stufe 8+ =
    1-15
  '131': >-
    Erhöht die Metallproduktion pro Stufe um 2%.
  '132': >-
    Erhöht die Kristallproduktion pro Stufe um 2%.
  '133': >-
    Erhöht die Deuteriumproduktion pro Stufe um 2%.
  '134': >-
    Senkt die Flugkosten pro Stufe um 2%.
  '199': >-
    Ein Graviton ist ein masseloses, ungeladenes Teilchen, das die
    Gravitationskraft bestimmt. Wird eine konzentrierte Ladung Gravitonen
    abgefeuert, entsteht ein künstliches Gravitationsfeld, das ähnlich wie ein
    schwarzes Loch Masse in sich hineinzieht und Schiffe oder sogar Monde
    zerstören kann. Für genug Gravitonen braucht es riesige Mengen Energie.
    Voraussetzung: Forschungslabor (Stufe 12).
  '202': >-
    Der Kleine Transporter ist ein wendiges Schiff, das Rohstoffe schnell zu
    anderen Planeten bringt. Er ist ungefähr so groß wie ein Jäger, verzichtet
    aber auf starke Antriebe und Bordwaffen, um Platz für Fracht zu schaffen
    (Ladekapazität: 5.000 Rohstoffeinheiten). Wegen seiner geringen Feuerkraft
    wird er oft von anderen Schiffen eskortiert.<br>Er fliegt mit dem
    Verbrennungsantrieb, bis dein Impulstriebwerk Stufe 5 erreicht. Ab dann
    wechselt er zum Impulsantrieb und verdoppelt damit seine
    Grundgeschwindigkeit.
  '203': >-
    Dieses Frachtschiff transportiert deutlich mehr als der Kleine Transporter
    und ist dank verbessertem Antrieb meist schneller. Es hat kaum Waffen an
    Bord und sollte deshalb nie allein losgeschickt werden. Der Große
    Transporter bringt Rohstoffe zwischen deinen Planeten, begleitet deine
    Flotten auf Raubzügen und schleppt möglichst viel Beute heim (Ladekapazität:
    25.000 Rohstoffeinheiten).
  '204': >-
    Das erste Kampfschiff, das jeder Herrscher baut. Der Leichte Jäger ist
    wendig, allein aber verwundbar; in großer Zahl wird er zur echten Bedrohung
    für jedes Imperium. Er ist günstig und auf fast jedem Planeten zu finden,
    hat aber nur schwache Schilde und wenig Laderaum. Leichte Jäger eskortieren
    als Erste Kleine und Große Transporter zu schwach verteidigten feindlichen
    Planeten.
  '205': >-
    Bei der Weiterentwicklung des Leichten Jägers stießen die Forscher an die
    Grenzen des konventionellen Antriebs. Für das neue Schiff kam deshalb
    erstmals der Impulsantrieb zum Einsatz. Das machte es teurer, ließ aber mehr
    Energie für Waffen und Schilde übrig, und auch die Materialien waren
    hochwertiger. Das Ergebnis: bessere Panzerung und mehr Feuerkraft, im Kampf
    also eine deutlich größere Bedrohung als der Leichte Jäger. Der Schwere
    Jäger leitet eine neue Ära im Schiffbau ein und ist die Grundlage der
    Kreuzertechnologie.
  '206': >-
    Mit den schweren Lasern und Ionenkanonen gerieten die Jäger immer mehr in
    Bedrängnis. Also entwickelte man eine neue Schiffsklasse mit mehr Panzerung
    und mehr Feuerkraft: den Kreuzer. Kreuzer sind fast dreimal so stark
    gepanzert wie Schwere Jäger und haben mehr als die doppelte Feuerkraft.
    Außerdem sind sie sehr schnell. Gegen mittlere Verteidigung gibt es kaum
    eine bessere Waffe. Fast ein Jahrhundert lang beherrschten sie das All, bis
    Gaußkanonen und Plasmawerfer ihre Vorherrschaft beendeten. Gegen
    Jägerverbände sind sie bis heute beliebt.
  '207': >-
    Schlachtschiffe sind das Rückgrat jeder Flotte. Schwere Geschütze, hohe
    Geschwindigkeit und große Laderäume machen sie zu Gegnern, die man ernst
    nehmen muss.
  '208': >-
    Dieses gut gepanzerte Schiff erobert neue Planeten, die ein aufstrebendes
    Imperium zum Wachsen braucht. Auf der neuen Kolonie wird das Schiff zerlegt,
    und alles verwertbare Material fließt in den Aufbau der neuen Welt. Wie
    viele Planeten du kolonisieren kannst, hängt direkt von der Astrophysik ab:
    Die erste Stufe und jede weitere zweite Stufe erlauben standardmäßig eine
    weitere Kolonie.
  '209': >-
    Der Recycler birgt Rohstoffe aus Trümmerfeldern. Nach riesigen
    Weltraumschlachten schienen die Trümmerfelder für immer verloren: Normale
    Transporter konnten sich nicht nah genug heranwagen, ohne von kleinen
    Trümmerteilen schwer beschädigt zu werden. Eine Neuentwicklung in der
    Schildtechnologie löste das Problem, und der Recycler, gebaut ähnlich wie
    der Große Transporter, holte die scheinbar verlorenen Rohstoffe doch noch
    heim. Dank spezieller mehrdimensionaler Laderäume fasst er 20.000 Einheiten.
    Er startet mit dem Verbrennungsantrieb, wechselt zum Impulsantrieb, sobald
    dein Impulstriebwerk Stufe 17 erreicht, und zum Hyperraumantrieb, sobald
    dein Hyperraumantrieb Stufe 15 erreicht.
  '210': >-
    Spionagesonden sind kleine, wendige Drohnen, die über weite Entfernungen
    Daten über Flotten und Planeten liefern. Ihr Hochleistungstriebwerk bringt
    sie in wenigen Sekunden ans Ziel. Im Orbit verweilen sie kurz, um Daten zu
    sammeln, und sind in dieser Zeit für den Feind relativ leicht zu entdecken
    und anzugreifen. Um Platz zu sparen, haben sie kaum Panzerung und weder
    Schilde noch Waffen und sind deshalb leichte Ziele, sobald sie entdeckt
    werden.
  '211': >-
    Der Bomber wurde eigens entwickelt, um die Verteidigung eines Planeten zu
    zerstören. Mit seiner lasergesteuerten Zielvorrichtung wirft er Plasmabomben
    punktgenau auf die Planetenoberfläche und richtet bei Verteidigungsanlagen
    verheerenden Schaden an.<br>Er fliegt mit dem Impulsantrieb und wechselt zum
    Hyperraumantrieb, sobald dein Hyperraumantrieb Stufe 8 erreicht.
  '212': >-
    Solarsatelliten sind einfache Plattformen aus Solarzellen in einem hohen,
    stationären Orbit. Sie sammeln Sonnenlicht und strahlen es per Laser zur
    Bodenstation. Ihre Effizienz hängt von der Sonneneinstrahlung ab: Auf
    sonnennahen Planeten liefern sie mehr Energie als auf sonnenfernen. Dank
    ihres guten Preis-Leistungs-Verhältnisses lösen sie die Energieprobleme
    vieler Welten. Aber Vorsicht: Im Kampf können Solarsatelliten zerstört
    werden.
  '213': >-
    Der Zerstörer ist der König der Kriegsschiffe. Seine Ionen-, Plasma- und
    Gaußgeschütztürme sind dank verbesserter Zielsensoren so treffsicher, dass
    er gegen Leichte Lasergeschütze Schnellfeuer hat: nach jedem Treffer schießt
    er in 9 von 10 Fällen noch einmal. Wegen seiner Größe ist er kaum
    manövrierfähig und gleicht im Kampf eher einer Kampfstation als einem
    Kampfschiff. So hoch wie seine Kampfkraft ist auch sein Deuteriumverbrauch.
  '214': >-
    Die Zerstörungskraft des Todessterns ist unübertroffen, und er kann Monde
    zerstören. Er ist mit einer riesigen Gravitonkanone bewaffnet, die Schiffe
    von der Größe eines Zerstörers oder sogar Monde vernichtet. Weil das enorm
    viel Energie braucht, besteht er fast nur aus Generatoren. Nur riesige
    Sternenreiche können die Rohstoffe und Arbeiter aufbringen, um dieses
    mondgroße Schiff zu bauen.
  '215': >-
    Der Schlachtkreuzer ist darauf spezialisiert, feindliche Flotten abzufangen.
    Mit seinen hochentwickelten Lasergeschützen bekämpft das filigrane Schiff
    viele angreifende Schiffe gleichzeitig. Durch die schlanke Bauform und die
    starke Bewaffnung ist die Ladekapazität begrenzt, das gleicht der sparsame
    Hyperraumantrieb aber wieder aus.
  '216': >-
    Dieses monströse Schiff ist der Nachfolger des beliebten Todessterns:
    deutlich schneller und robuster, mit riesigem Laderaum, schlägt aber etwas
    weniger hart zu.
  '217': >-
    Eine Weiterentwicklung des Großen Transporters mit deutlich mehr
    Ladekapazität. Er fliegt mit dem Hyperraumantrieb, startet also langsamer
    als der Große Transporter, zieht aber mit jeder Stufe deines
    Hyperraumantriebs davon.
  '218': >-
    Der Super-GAU schlechthin, wenn auch ein sehr langsamer. Dieses Schiff
    vereint die Stärken mehrerer Schiffe und ist der Kaiser unter den
    Kampfsternen.
  '219': >-
    Ein wahrhaft gigantisches Recyclingschiff im Weltraum: riesiger Laderaum und
    neue Antriebe machen es schneller und ermöglichen mehr Ausbeute aus
    Trümmerfeldern. Gebaut für große Imperien.
  '220': >-
    Der Stahlkoloss ist eine wahre Festung im All, geschützt durch
    unerschütterliche Schilde und eine massive Panzerung. Selbst heftigste
    Angriffe prallen an ihm ab, während er unbeirrt seinen Weg fortsetzt. Doch
    diese defensive Überlegenheit hat ihren Preis: Seine Bewaffnung ist kaum der
    Rede wert, und seine langsamen Antriebe machen ihn zu einem trägen Giganten.
    Statt Blitzangriffen oder wendigen Manövern setzt dieses Schiff auf pure
    Standhaftigkeit. Wer es aufhalten will, muss einen langen Atem haben – oder
    eine gewaltige Feuerkraft.
  '221': >-
    Die Sturmklinge ist ein Jäger der Extraklasse: unglaublich schnell und
    gnadenlos bewaffnet. Ihre Gegner bekommen sie kaum zu Gesicht, bevor sie
    zuschlägt. Verteidigung ist für dieses Schiff zweitrangig – es muss nicht
    aushalten, was es einfach umfliegen kann. Ihr Fokus liegt ausschließlich auf
    Transportern und Recyclerflotten, die ohne Gegenwehr zerschmettert werden.
    Mit ihrer rasenden Geschwindigkeit kann sie jederzeit zuschlagen und
    verschwinden, bevor Verstärkung eintrifft. Wer mit der Sturmklinge ins
    Visier genommen wird, hat kaum eine Chance zu entkommen.
  '222': >-
    Der Schwere Kreuzer ist eine robuste Weiterentwicklung des
    Standard-Kreuzers. Mit verstärkten Schilden und einer mächtigen Bewaffnung
    kann er sich gegen schwerfällige Feinde behaupten. Besonders effektiv ist er
    im Einsatz mit Stahlkolossen, Zerstörern und Bombern, wo seine Feuerkraft
    glänzen kann. Trotz seiner Stärke bleibt er jedoch langsam und weniger
    flexibel.
  '223': >-
    Die Schutzschild-Drohne stellt einen neuen Ansatz im Bereich der
    Flottenverteidigung dar. Ihr primäres Ziel ist es, den Schutz der Besatzung
    zu maximieren. Durch innovative, aber schwere Schutztechnologien wurden die
    Flugeigenschaften stark beeinträchtigt. Obwohl ihre Geschwindigkeit und
    Wendigkeit miserabel sind, ist sie auf der Verteidigungsebene äußerst
    effektiv. Der veraltete Aufbau wurde dabei bis an seine Grenzen ausgereizt,
    um eine nahezu undurchdringliche Verteidigung zu ermöglichen.
  '224': >-
    Der Improvisierte Kampftransporter ist ein ungetestetes Transportschiff mit
    minimaler Bewaffnung, gebaut, um unvorsichtige und unvorbereitete Nachbarn
    zu ärgern. Dieses zusammengeschusterte Gefährt ist nicht für den
    Dauereinsatz gedacht, sondern für schnelle, impulsive Angriffe, die sofort
    Reaktionen hervorrufen. Nachbarschaftsstreit ist praktisch garantiert,
    sobald es im Einsatz ist. Mit seiner dürftigen Ausstattung und seiner
    unberechenbaren Art ist es ein gefährliches Werkzeug, um Konflikte schnell
    eskalieren zu lassen.
  '225': >-
    Der Sturmtransporter ist ein wahres Meisterwerk der Technik und bietet die
    perfekte Balance zwischen Kampfkraft, Geschwindigkeit und Transportvolumen.
    Er verlegt Truppen und Rohstoffe schnell und bringt dabei beeindruckende
    Feuerkraft aufs Schlachtfeld. Damit ist er aus jeder schlagkräftigen Flotte
    nicht mehr wegzudenken. Ob für schnelle Angriffe oder zur Unterstützung
    langer Einsätze: Der Sturmtransporter ist der Schlüssel zu effektiver
    Kriegsführung und gehört in jede Flotte.
  '226': >-
    Der Kolossale Schlachttransporter ist die Spitze der Ingenieurskunst. Trotz
    seines etwas klobigen Designs und der daraus folgenden geringen
    Fluggeschwindigkeit ist er der am stärksten gepanzerte Kampftransporter, den
    je eine Flotte gesehen hat. Seine überwältigende Schlagkraft macht ihn zu
    einer unaufhaltsamen Macht auf dem Schlachtfeld. Dieser Koloss durchbricht
    mühelos feindliche Linien und schützt dabei seine Besatzung optimal. Er
    verkörpert Stärke und Widerstandsfähigkeit und ist unverzichtbar für jede
    schwer bewaffnete Flotte.
  '227': >-
    Der Optimierte Recycler ist eine hochmoderne Weiterentwicklung des
    herkömmlichen Recyclers. Dank des leistungsstarken Impulstriebwerks erreicht
    er Trümmerfelder schneller und günstiger, was ihn für jede fortgeschrittene
    Flotte unverzichtbar macht. Seine optimierte Bauweise senkt die Baukosten
    und steigert gleichzeitig die Effizienz bei der Rohstoffrückgewinnung. Ab
    dem Midgame verfügbar, verschafft er jedem expandierenden Imperium einen
    strategischen Vorteil.
  '228': >-
    Der Omega-Recycler ist der Höhepunkt der Recycling-Technologie, hat aber
    seinen Preis. Sein leistungsstarker Hyperraumantrieb bringt ihn in
    Rekordzeit zu Trümmerfeldern und lässt ihn Rohstoffe schneller bergen als
    jedes andere Schiff. Die Geschwindigkeit geht allerdings auf Kosten der
    Effizienz: Bau- und Treibstoffkosten sind enorm, deshalb lohnt er sich nur
    für wohlhabende Kommandanten im Lategame. Wer Tempo über Kosten stellt,
    bekommt hier den ultimativen Recycler.
  '229': >-
    Entwickelt, um die Vorherrschaft der Xer zu brechen, ist die Viper die
    ultimative Waffe gegen Leichte Jäger, Schwere Jäger und Kreuzer. Mit ihren
    Schnellfeuerkanonen und fortschrittlicher Technik bringt sie das
    Kräfteverhältnis im Universum ins Wanken.
  '230': >-
    Schnell. Präzise. Unerreichbar. Der Impulsjäger ist nicht für faire Kämpfe
    gebaut, sondern dafür, schnell und hart zuzuschlagen und im Handumdrehen
    eine erdrückende Übermacht zu schaffen.
  '231': >-
    Der Behemoth ist das Ergebnis jahrzehntelanger Gravitonforschung, verwandelt
    in eine unerbittliche Kampfplattform. Anders als Todessterne wurde er nicht
    für planetare Zerstörung entwickelt, sondern für maximale Gefechtsleistung.
    Weil er auf die energiehungrigen Systeme zur Mondzerstörung verzichtet,
    konnte sein Design deutlich erleichtert werden. Das ermöglicht stärkere
    Antriebe, mehr Wendigkeit und höhere Feuerkraft. Seine kompakte
    Gravitonkanone macht ihn zur mobilen Vernichtungsmaschine, die selbst
    riesige Flotten im Alleingang zerschlagen kann.
  '232': >-
    Der Void Titan ist der Höhepunkt moderner Gravitontechnologie. Sein gesamtes
    Design dient einem einzigen Ziel: der schnellen Auslöschung feindlicher
    Monde. Auf klassische Geschütztürme wurde bewusst verzichtet, um Masse zu
    sparen und Platz für gigantische Kristallgeneratoren zu schaffen. Diese
    versorgen die fortschrittlichsten Beschleunigungsspulen der bekannten
    Galaxien und verleihen dem Schiff eine unerreichte Beweglichkeit. Der enorme
    Kristallbedarf macht jeden Void Titan zu einer industriellen Meisterleistung
    und zum Symbol grenzenloser Zerstörungskraft.
  '401': >-
    Der Raketenwerfer ist eine einfache, aber kostengünstige Verteidigung. Er
    ist nur eine Weiterentwicklung gewöhnlicher ballistischer Feuerwaffen und
    braucht deshalb keine Forschung. Dank der niedrigen Kosten lohnt er sich
    gegen kleinere Flotten, verliert mit der Zeit aber an Bedeutung und dient
    später meist nur noch als Schussfang hinter großen Geschützen. Nach einer
    Schlacht werden im Schnitt etwa 70 Prozent der zerstörten Verteidigungsanlagen
    wieder aufgebaut.
  '402': >-
    Um die enormen Fortschritte der Raumschifftechnologie auszugleichen, mussten
    die Forscher eine Verteidigungsanlage entwickeln, die auch mit größeren und
    besser ausgerüsteten Schiffen und Flotten zurechtkommt. Das war die
    Geburtsstunde des Leichten Lasergeschützes. Leichte Lasergeschütze sind
    einfache Verteidigungswaffen am Boden: Spezielle Zielsysteme verfolgen den
    Feind, und ein hochintensiver Laser schneidet durch die Hülle des Ziels.
    Durch den konzentrierten Beschuss eines Ziels mit Photonen konnte eine
    wesentlich größere Schadenswirkung erzielt werden als mit gewöhnlichen
    ballistischen Waffen. Um der größeren Feuerkraft der neuen Schiffstypen
    standzuhalten, bekam es außerdem verbesserte Schilde. Damit die
    Produktionskosten niedrig blieben, wurde die Struktur nicht weiter
    verstärkt. Das Leichte Lasergeschütz hat das beste
    Preis-Leistungs-Verhältnis überhaupt und ist deshalb auch für weiter
    fortgeschrittene Zivilisationen interessant. Nach einer Schlacht werden im
    Schnitt etwa 70 Prozent der zerstörten Verteidigungsanlagen wieder aufgebaut.
  '403': >-
    Das Schwere Lasergeschütz ist die konsequente Weiterentwicklung des Leichten
    Lasergeschützes. Die Struktur wurde verstärkt und mit neuen Materialien
    verbessert. Die Hülle konnte so wesentlich widerstandsfähiger gemacht
    werden. Gleichzeitig wurden auch das Energiesystem und der Zielcomputer
    verbessert, sodass es wesentlich mehr Energie auf ein Ziel konzentrieren
    kann. Nach einer Schlacht werden im Schnitt etwa 70 Prozent der zerstörten
    Verteidigungsanlagen wieder aufgebaut.
  '404': >-
    Projektilwaffen galten neben Kernfusion, Energietechnik, Hyperraumantrieb
    und immer besseren Panzerungen lange als antiquiert, bis ausgerechnet die
    Energietechnik, die sie einst verdrängt hatte, ihnen ihren Platz zurückgab.
    Das Prinzip kannte man schon im 20. und 21. Jahrhundert der Erde: der
    Teilchenbeschleuniger. Eine Gaußkanone ist im Grunde nichts anderes als eine
    erheblich größere Version davon. Tonnenschwere Geschosse aus hochdichtem
    Metall werden unter gigantischem elektrischem Aufwand magnetisch
    beschleunigt. Ihre Mündungsgeschwindigkeit ist so hoch, dass die
    Schmutzteilchen in der Luft um das Geschoss verglühen, und der Rückstoß
    lässt die Erde beben. Dieser Durchschlagskraft können auch aktuelle
    Panzerungen und Schilde kaum widerstehen, und nicht selten wird das Ziel
    einfach durchschlagen. Nach einer Schlacht werden im Schnitt etwa 70 Prozent
    der zerstörten Verteidigungsanlagen wieder aufgebaut.
  '405': >-
    Im 21. Jahrhundert der Erde war der EMP allgemein bekannt. EMP steht für
    Elektromagnetischer Puls: Er induziert in alle Schaltkreise zusätzliche
    Spannungen und verursacht so massenhaft Störungen, die empfindliche Geräte
    zerstören können. Damals basierten EMP-Waffen meist auf Raketen und Bomben,
    auch in Verbindung mit Nuklearwaffen. Inzwischen wurde der EMP ständig
    weiterentwickelt, denn man sah großes Potenzial darin, Ziele nicht zu
    zerstören, sondern nur kampf- und manövrierunfähig zu machen, sodass einer
    Übernahme nichts mehr im Weg stand. Die bisher höchste Form einer EMP-Waffe
    stellt das Ionengeschütz dar. Es schleudert eine Welle von Ionen (elektrisch
    geladene Teilchen) auf das Ziel, welche die Schilde destabilisiert und alle
    Elektronik - sofern diese nicht massiv abgeschirmt ist - beschädigt, was
    nicht selten einer völligen Zerstörung gleichkommt. Die kinetische
    Durchschlagskraft kann vernachlässigt werden. Die Ionentechnik wird auch auf
    Kreuzern eingesetzt, jedoch auf keinem anderen Schiffstyp, denn der
    Energieverbrauch der Ionengeschütze ist enorm, und im Gefecht kommt es oft
    darauf an, das Ziel zu zerstören und nicht nur zu lähmen. Nach einer
    Schlacht werden im Schnitt etwa 70 Prozent der zerstörten Verteidigungsanlagen
    wieder aufgebaut.
  '406': >-
    Die Lasertechnik war inzwischen nahezu perfektioniert und die Ionentechnik
    am Ende ihrer Entwicklung. Es galt als praktisch unmöglich, aus einem der
    beiden Waffensysteme noch mehr Effektivität herauszuholen. Das änderte sich,
    als jemand auf die Idee kam, beide Systeme zu kombinieren. Wie schon aus der
    Kernfusion bekannt, erhitzen Laser Teilchen (meist Deuterium) auf extrem
    hohe Temperaturen von oft mehreren Millionen Grad. Die Ionentechnik trägt
    ihren Teil in Form von elektrischer Aufladung, Stabilisierungsfeldern und
    Beschleunigern bei. Ist die Ladung ausreichend erhitzt, unter Druck gesetzt
    und ionisiert, jagt man sie mit Beschleunigern in Richtung Ziel. Der
    grünlich glühende Plasmastrahl ist ein imposanter Anblick, doch die Crew des
    Zielschiffs wird wenig Freude daran haben, wenn in wenigen Sekunden die
    Hülle zerfetzt und die Elektronik geschmort wird. Der Plasmawerfer gilt als
    eine der gefürchtetsten Waffen überhaupt, und diese Technik hat ihren Preis.
    Nach einer Schlacht werden im Schnitt etwa 70 Prozent der zerstörten
    Verteidigungsanlagen wieder aufgebaut.
  '407': >-
    Lange bevor Schildgeneratoren klein genug für Schiffe waren, gab es bereits
    riesige Generatoren auf der Oberfläche von Planeten. Sie hüllen den ganzen
    Planeten in ein Kraftfeld, das ungeheure Mengen an Energie absorbieren kann,
    bevor es zusammenbricht. Kleinere Angriffsflotten scheitern immer wieder an
    diesen Schildkuppeln. Mit fortschreitender Technologie lassen sie sich noch
    verstärken, und später kannst du sogar eine Große Schildkuppel bauen, die
    noch stärker ist. Pro Planet kann nur eine einzige Kleine Schildkuppel
    gebaut werden.
  '408': >-
    Die Weiterentwicklung der Kleinen Schildkuppel. Sie basiert auf derselben
    Technologie, braucht aber deutlich mehr Energie, um feindliche Angriffe
    abzuhalten. Pro Planet kann nur eine gebaut werden.
  '409': >-
    Die Weiterentwicklung der Schildkuppel-Technologie. Sie verbraucht noch viel
    mehr Energie, hält dafür aber mehr Angriffe aus als jedes andere Schild. Pro
    Planet kann nur eine gebaut werden.
  '410': >-
    Nach jahrelanger Gravitationsforschung entwickelten Wissenschaftler eine
    Gravitonkanone, die ein kleines, konzentriertes Gravitonfeld erzeugt und auf
    den Feind abfeuert.
  '411': >-
    Eine unbewegliche Verteidigungsplattform ohne eigenen Antrieb, die durch
    Gravitonforschung in einer stabilen Umlaufbahn um den Planeten gehalten
    wird. Diesen Vorgang zu starten, kostet riesige Mengen Energie. Wegen ihrer
    gigantischen Ausmaße kannst du nur eine dieser Plattformen besitzen.
  '412': >-
    Der Bunker ist ein stark befestigtes Bauwerk, das selbst den mächtigsten
    Angriffen standhalten soll. Er bietet den Bewohnern des Planeten und der
    wichtigen Infrastruktur unvergleichlichen Schutz und ist damit ein
    Eckpfeiler der Planetenverteidigung.
  '413': >-
    Der Titan-Laser ist eine gigantische Waffe von beispielloser
    Zerstörungskraft.
  '414': >-
    Der Köder ist ein raffiniertes Verteidigungssystem, das feindliche
    Streitkräfte in die Irre führen und verwirren soll. Er gibt sich als
    Raketenwerfer aus und schreckt so Angriffe ab.
  '502': >-
    Abfangraketen zerstören anfliegende Interplanetarraketen. Pro
    Interplanetarrakete wird eine Abfangrakete benötigt.
  '503': >-
    Interplanetarraketen zerstören die gegnerische Verteidigung, können aber von
    Abfangraketen abgefangen werden. Verteidigungsanlagen, die von
    Interplanetarraketen zerstört wurden, bauen sich nicht wieder auf.
    Standardmäßig hängt die Reichweite (in Sonnensystemen) von der Stufe deines
    Impulstriebwerks ab:<br>Reichweite = (5 x Stufe des Impulstriebwerks) - 1
  '901': >-
    Metall ist der wichtigste Rohstoff für Gebäude und Schiffe. Es ist der
    günstigste Rohstoff, aber auch der, den du am meisten brauchst, und braucht
    wie Kristall zur Herstellung am wenigsten Energie. Je größer die Minen,
    desto tiefer graben sie sich in die Erde und desto höher ist die Produktion.
    Trotz seiner Häufigkeit gehört Metall zu den begehrtesten Rohstoffen im
    Universum.
  '902': >-
    Kristall ist der Hauptrohstoff für elektronische Schaltkreise und bestimmte
    Legierungen. Er wird in unterirdischen Minen abgebaut und dort gleich zu
    Schaltkreisen verarbeitet.
  '903': >-
    Deuterium (schwerer Wasserstoff) findet sich in den tiefsten Meeren und ist
    einer der seltensten Rohstoffe im Universum. Man muss bis zum Meeresgrund
    vordringen, deshalb ist es der teuerste Rohstoff und braucht auch am meisten
    Energie. Du brauchst es als Treibstoff für Raumschiffe, für viele
    Forschungen, für einen Blick in die Galaxie und für Phalanx-Scans.
  '911': >-
    Energie wird für die Gewinnung jedes Rohstoffs benötigt. Man sagt, mit
    unvorstellbar großen Energiemengen ließe sich sogar die Gravitation
    beeinflussen und damit zerstörerische Waffen bauen. Bis heute ist das aber
    kaum jemandem gelungen.
secureResources: >-
  Jede Stufe eines Lagergebäudes schützt 1% der Tagesproduktion des jeweiligen
  Rohstoffs bei Angriffen vor Plünderung, maximal 10%.
shortDescription:
  '1': Metallminen fördern das Erz, auf dem jedes junge wie etablierte Imperium aufbaut.
  '2': Kristall ist der Schlüsselrohstoff für Elektronik und bestimmte Legierungen.
  '3': >-
    Deuterium treibt deine Raumschiffe an und wird aus der Tiefsee gewonnen. Es
    ist selten und deshalb vergleichsweise teuer.
  '4': >-
    Solarkraftwerke wandeln Sonnenlicht in Energie um. Jede Mine braucht
    Energie, um zu laufen.
  '6': >-
    Standardmäßig verkürzt jede Stufe die Forschungszeit um 8%.
  '12': >-
    Das Fusionskraftwerk gewinnt Energie, indem es Deuterium als Brennstoff
    verschmilzt.
  '14': >-
    Roboterfabriken stellen Bauroboter bereit, die dir beim Errichten deiner
    Gebäude helfen. Jede Stufe beschleunigt den Ausbau von Gebäuden.
  '15': >-
    Die Krönung der Robotertechnik. Jede Stufe halbiert die Bauzeit von
    Gebäuden, Schiffen und Verteidigungsanlagen.
  '21': >-
    In der Raumschiffwerft deines Planeten werden alle Schiffe und
    Verteidigungsanlagen gebaut.
  '22': Lagerstätte für überschüssiges Metall.
  '23': Lagerstätte für überschüssigen Kristall.
  '24': Lagerstätte für überschüssiges Deuterium.
  '31': Um neue Technologien zu erforschen, brauchst du ein Forschungslabor.
  '33': >-
    Der Terraformer erweitert die nutzbare Fläche des Planeten: 5 zusätzliche
    Felder pro Stufe, auf jeder geraden Stufe ein weiteres. Jede Stufe belegt
    selbst ein Feld.
  '34': "Mit dem Allianzdepot verlängerst du für Deuterium den Aufenthalt befreundeter Flotten, die an deinem Planeten halten: pro Versorgung bis zu so viele Stunden wie die Depotstufe."
  '35': Das Reparaturdock stellt Schiffe aus einem Wrackfeld wieder her.
  '41': >-
    Der Mond hat keine Atmosphäre, und ein frischer Mond bietet Platz für nur
    ein Gebäude, deshalb beginnst du am besten mit der Mondbasis.
  '42': >-
    Die Sensorphalanx lässt dich Flottenbewegungen beobachten. Je höher die
    Stufe, desto größer die Reichweite der Phalanx.
  '43': >-
    Sprungtore sind riesige Transmitter, die auch große Flotten ohne Zeitverlust
    quer durchs Universum schicken.
  '44': Raketensilos lagern deine Raketen.
  '106': Mit dieser Technologie sammelst du Informationen über andere Planeten und Monde.
  '108': >-
    Bessere Computer lassen dich mehr Flotten befehligen. Jede Stufe
    Computertechnik erhöht deine maximale Flottenanzahl um eins.
  '109': >-
    Die Waffentechnik macht Waffensysteme wirkungsvoller. Jede Stufe erhöht die
    Waffenstärke aller Einheiten um 10% des Grundwerts.
  '110': >-
    Die Schildtechnik macht die Schilde von Schiffen und Verteidigungsanlagen
    wirksamer. Jede Stufe erhöht die Schildstärke um 10% des Grundwerts.
  '111': >-
    Spezielle Legierungen verbessern die Panzerung von Schiffen und
    Verteidigungsanlagen. Jede Stufe erhöht die Wirksamkeit der Panzerung um
    10%.
  '113': Wer verschiedene Energieformen beherrscht, schaltet viele neue Technologien frei.
  '114': >-
    Mit der Einbindung der 4. und 5. Dimension kannst du einen neuartigen
    Antrieb erforschen, der sparsamer und leistungsfähiger ist.
  '115': >-
    Die Weiterentwicklung dieses Antriebs macht einige Schiffe schneller, aber
    jede Stufe bringt nur 10% der Grundgeschwindigkeit.
  '117': >-
    Das Impulstriebwerk arbeitet nach dem Rückstoßprinzip. Die Weiterentwicklung
    macht einige Schiffe schneller, aber jede Stufe bringt nur 20% der
    Grundgeschwindigkeit.
  '118': >-
    Der Hyperraumantrieb krümmt den Raum um ein Schiff. Die Weiterentwicklung
    macht einige Schiffe schneller, aber jede Stufe bringt nur 30% der
    Grundgeschwindigkeit.
  '120': Gebündeltes Licht erzeugt einen Strahl, der alles beschädigt, was er trifft.
  '121': >-
    Ein tödlicher Strahl aus beschleunigten Ionen, der beim Aufprall enormen
    Schaden anrichtet.
  '122': >-
    Eine Weiterentwicklung der Ionentechnik: Statt Ionen wird hochenergetisches
    Plasma beschleunigt, das durch extremes Erhitzen von Ionen entsteht. Beim
    Aufprall hat es eine verheerende Wirkung.
  '123': Forscher verschiedener Planeten kommunizieren über dieses Netzwerk.
  '124': >-
    Schaltet Kolonisierung und Expeditionen in den tiefen Weltraum frei.
    Zusätzliche Planeten auf ungeraden Stufen, zusätzliche Expeditionsslots auf
    Quadratstufen, längere Expeditionsdauer und mehr Planetenpositionen in einem
    System.
  '131': >-
    Erhöht die Metallproduktion pro Stufe um 2%.
  '132': >-
    Erhöht die Kristallproduktion pro Stufe um 2%.
  '133': >-
    Erhöht die Deuteriumproduktion pro Stufe um 2%.
  '134': >-
    Senkt die Flugkosten pro Stufe um 2%.
  '199': >-
    Eine konzentrierte Ladung Gravitonen erzeugt ein künstliches
    Gravitationsfeld, das Schiffe und sogar Monde zerstören kann.
  '202': >-
    Der Kleine Transporter ist ein wendiges Schiff, das Rohstoffe schnell zu
    anderen Planeten bringt.
  '203': >-
    Dieses Frachtschiff transportiert deutlich mehr als der Kleine Transporter
    und ist dank verbessertem Antrieb meist schneller.
  '204': >-
    Das erste Kampfschiff, das jeder Herrscher baut. Wendig, aber allein
    verwundbar; in großer Zahl eine echte Bedrohung für jedes Imperium. Leichte
    Jäger eskortieren als Erste Kleine und Große Transporter zu schwach
    verteidigten feindlichen Planeten.
  '205': Dieser Jäger ist besser gepanzert und schlägt härter zu als der Leichte Jäger.
  '206': >-
    Kreuzer sind fast dreimal so stark gepanzert wie schwere Jäger und verfügen
    über mehr als die doppelte Schusskraft. Zudem sind sie sehr schnell.
  '207': >-
    Schlachtschiffe bilden meist das Rückgrat einer Flotte. Ihre schweren
    Geschütze, die hohe Geschwindigkeit und der große Frachtraum machen sie zu
    ernst zu nehmenden Gegnern.
  '208': Mit diesem Schiff kannst du unbesiedelte Planeten kolonisieren.
  '209': Der Recycler birgt Rohstoffe aus Trümmerfeldern.
  '210': >-
    Spionagesonden sind kleine, wendige Drohnen, die über weite Entfernungen
    Daten über Flotten und Planeten liefern.
  '211': >-
    Der Bomber wurde eigens entwickelt, um die Verteidigung eines Planeten zu
    zerstören.
  '212': >-
    Solarsatelliten sind einfache Plattformen aus Solarzellen, die sich in einem
    hohen stationären Orbit befinden. Sie sammeln das Sonnenlicht und geben es
    per Laser an die Bodenstation weiter.
  '213': Der Zerstörer ist der König unter den Kriegsschiffen.
  '214': >-
    Die Zerstörungskraft des Todessterns ist unübertroffen, und er kann Monde
    zerstören.
  '215': Der Schlachtkreuzer ist auf das Abfangen feindlicher Flotten spezialisiert.
  '216': >-
    Der Nachfolger des beliebten Todessterns: deutlich schneller und robuster,
    mit riesigem Laderaum, schlägt aber etwas weniger hart zu.
  '217': >-
    Eine Weiterentwicklung des Großen Transporters mit deutlich mehr
    Ladekapazität. Er fliegt mit dem Hyperraumantrieb, startet also langsamer
    als der Große Transporter, zieht aber mit jeder Stufe deines
    Hyperraumantriebs davon.
  '218': Der Super-GAU schlechthin, wenn auch ein sehr langsamer.
  '219': >-
    Riesiger Laderaum und neue Antriebe: schneller und mit mehr Ausbeute aus
    Trümmerfeldern.
  '220': >-
    Der Stahlkoloss trotzt jedem Angriff mit massiven Schilden und dicker
    Panzerung, doch seine Waffen und Antriebe lassen zu wünschen übrig.
  '221': >-
    Die Sturmklinge ist ein blitzschneller Jäger, bis an die Zähne bewaffnet.
    Schutz? Überflüssig – ihre Beute sind wehrlose Transporter und Recycler.
  '222': >-
    Ein langsamer, aber stark bewaffneter Kreuzer mit verbesserten Schilden und
    Offensivfähigkeiten.
  '223': >-
    Eine Neuerfindung des leichten Jägers, die maximale Sicherheit für die
    Besatzung bietet, jedoch in Fluggeschwindigkeit und Wendigkeit stark
    eingeschränkt ist.
  '224': >-
    Ein ungetestetes Transportschiff mit minimaler Bewaffnung, gebaut, um
    unvorsichtige Nachbarn zu ärgern und sofort Streit zu provozieren.
  '225': >-
    Ein Schiff, das Kampfkraft, Geschwindigkeit und Transportvolumen vereint und
    deshalb in jeder schlagkräftigen Flotte unverzichtbar ist.
  '226': >-
    Ein massiv gepanzerter Kampftransporter mit imposantem, leicht klobigem
    Design, dessen überwältigende Feuerkraft selbst die härtesten Gegner
    bezwingt.
  '227': >-
    Eine verbesserte Version des klassischen Recyclers mit Impulstriebwerk, das
    effizientere Bergungsmissionen bei geringeren Kosten ermöglicht.
  '228': >-
    Eine extrem schnelle, aber ineffiziente Weiterentwicklung des Recyclers mit
    Hyperraumantrieb.
  '229': >-
    Entwickelt, um die Vorherrschaft der Xer zu brechen, ist die Viper die
    ultimative Waffe gegen Leichte Jäger, Schwere Jäger und Kreuzer. Mit ihren
    Schnellfeuerkanonen und fortschrittlicher Technik bringt sie das
    Kräfteverhältnis im Universum ins Wanken.
  '230': >-
    Schnell. Präzise. Unerreichbar. Der Impulsjäger ist nicht für faire Kämpfe
    gebaut, sondern dafür, schnell und hart zuzuschlagen und im Handumdrehen
    eine erdrückende Übermacht zu schaffen.
  '231': >-
    Ein kleinerer, schnellerer Todesstern, der keine Monde zerstören kann. Der
    Behemoth ist tödlich gegen Flotten.
  '232': >-
    Schneller, explosiver, immer für eine Überraschung gut. Der Void Titan ist
    der Schrecken der Monde.
  '401': Der Raketenwerfer ist eine einfache, aber kostengünstige Verteidigung.
  '402': >-
    Leichte Lasergeschütze sind einfache Verteidigungswaffen am Boden. Spezielle
    Zielsysteme verfolgen feindliche Schiffe, und ein hochintensiver Laser
    schneidet durch die Hülle des Ziels.
  '403': >-
    Das Schwere Lasergeschütz ist eine verbesserte Version des Leichten
    Lasergeschützes.
  '404': Die Gaußkanone verschießt extrem schnelle Projektile aus hochdichtem Metall.
  '405': >-
    Das Ionengeschütz schießt Strahlen aus Ionen (positiv oder negativ geladenen
    Teilchen) auf das Ziel, destabilisiert Schilde und beschädigt die
    Elektronik.
  '406': >-
    Der Plasmawerfer nutzt eine große Brennzelle eines Kernreaktors, um einen
    elektromagnetischen Beschleuniger anzutreiben, der Plasmapulse (Toroide)
    abfeuert.
  '407': >-
    Die Kleine Schildkuppel hüllt den ganzen Planeten in ein Feld, das ungeheure
    Mengen an Energie absorbieren kann.
  '408': Die Große Schildkuppel kann im Angriff deutlich mehr Energie absorbieren.
  '409': >-
    Die Weiterentwicklung der Schildkuppel-Technologie. Sie verbraucht noch viel
    mehr Energie, hält dafür aber mehr Angriffe aus als jedes andere Schild.
  '410': >-
    Nach jahrelanger Gravitationsforschung entwickelten Wissenschaftler eine
    Gravitonkanone, die ein kleines, konzentriertes Gravitonfeld erzeugt und auf
    den Feind abfeuert.
  '411': >-
    Eine unbewegliche Verteidigungsplattform ohne eigenen Antrieb, die durch
    Gravitonforschung in einer stabilen Umlaufbahn um den Planeten gehalten
    wird. Diesen Vorgang zu starten, kostet riesige Mengen Energie.
  '412': Er schützt! Wie der Lego-Stein in „Kindergarten TD“.
  '413': Der Titan Laser ist ein gigantischer Laser.
  '414': >-
    Der Köder ist ein raffiniertes Verteidigungssystem, das feindliche
    Streitkräfte in die Irre führen soll. Er gibt sich als Raketenwerfer aus und
    schreckt so Angriffe ab.
  '502': Abfangraketen zerstören angreifende Interplanetarraketen.
  '503': Interplanetarraketen zerstören die gegnerische Verteidigung.
  '901': >-
    Metall ist der wichtigste Rohstoff für Gebäude und Schiffe. Es ist der
    günstigste Rohstoff, aber auch der, den du am meisten brauchst.
  '902': >-
    Kristall ist der Hauptrohstoff für elektronische Schaltkreise und bestimmte
    Legierungen.
  '903': >-
    Deuterium findet sich in den tiefsten Meeren. Es ist der teuerste Rohstoff
    und braucht auch am meisten Energie.
  '911': Energie wird für die Gewinnung jedes Rohstoffs benötigt.
