  "-2": "[UTC - 2] เวลาเฟร์นังดูจีโนโรนยา, เวลาเซาท์จอร์เจียและหมู่เกาะเซาท์แซนด์วิช"
  "-3": "[UTC - 3] เวลามาตรฐานแอมะซอน, เวลากรีนแลนด์กลาง"
  "-3.5": "[UTC - 3:30] เวลามาตรฐานนิวฟันด์แลนด์"
  "-4": "[UTC - 4] เวลามาตรฐานแอตแลนติก"
  "-4.5": "[UTC - 4:30] เวลามาตรฐานเวเนซุเอลา"
  "-5": "[UTC - 5] เวลามาตรฐานตะวันออก (สหรัฐฯ/แคนาดา)"
  "-6": "[UTC - 6] เวลามาตรฐานตอนกลาง (สหรัฐฯ/แคนาดา)"
  "-7": "[UTC - 7] เวลามาตรฐานเทือกเขาร็อกกี (สหรัฐฯ/แคนาดา)"
  "-8": "[UTC - 8] เวลามาตรฐานแปซิฟิก (สหรัฐฯ/แคนาดา)"
  "-9": "[UTC - 9] เวลามาตรฐานอะแลสกา, เวลาเกาะแกมเบียร์"
  "-9.5": "[UTC - 9:30] เวลาหมู่เกาะมาร์เคซัส"
  "-10": "[UTC - 10] เวลามาตรฐานฮาวาย-อะลูเชียน, เวลาหมู่เกาะคุก"
  "-11": "[UTC - 11] เวลานีอูเอ, เวลามาตรฐานซามัว"
  "-12": "[UTC - 12] เวลาเกาะเบเกอร์"
  '0': "[UTC] เวลายุโรปตะวันตก, เวลามาตรฐานกรีนิช"
  '1': "[UTC + 1] เวลายุโรปกลาง, เวลาแอฟริกาตะวันตก"
  '2': "[UTC + 2] เวลายุโรปตะวันออก, เวลาแอฟริกากลาง"
  '3': "[UTC + 3] เวลามาตรฐานมอสโก, เวลาแอฟริกาตะวันออก"
  '3.5': "[UTC + 3:30] เวลามาตรฐานอิหร่าน"
  '4': "[UTC + 4] เวลามาตรฐานอ่าวเปอร์เซีย, เวลามาตรฐานซามารา"
  '4.5': "[UTC + 4:30] เวลาอัฟกานิสถาน"
  '5': "[UTC + 5] เวลามาตรฐานปากีสถาน, เวลามาตรฐานเยคาเตรินบูร์ก"
  '5.5': "[UTC + 5:30] เวลามาตรฐานอินเดีย, เวลาศรีลังกา"
  '5.75': "[UTC + 5:45] เวลาเนปาล"
  '6': "[UTC + 6] เวลาบังกลาเทศ, เวลาภูฏาน, เวลามาตรฐานโนโวซีบีสค์"
  '6.5': "[UTC + 6:30] เวลาหมู่เกาะโคโคส, เวลาเมียนมา"
  '7': "[UTC + 7] เวลาอินโดจีน (ประเทศไทย), เวลามาตรฐานครัสโนยาสค์"
  '8': "[UTC + 8] เวลามาตรฐานจีน, เวลามาตรฐานออสเตรเลียตะวันตก, เวลามาตรฐานอีร์คุตสค์"
  '8.75': "[UTC + 8:45] เวลามาตรฐานออสเตรเลียตะวันตกเฉียงใต้"
  '9': "[UTC + 9] เวลามาตรฐานญี่ปุ่น, เวลามาตรฐานเกาหลี, เวลามาตรฐานชีตา"
  '9.5': "[UTC + 9:30] เวลามาตรฐานออสเตรเลียตอนกลาง"
  '10': "[UTC + 10] เวลามาตรฐานออสเตรเลียตะวันออก, เวลามาตรฐานวลาดีวอสตอค"
  '10.5': "[UTC + 10:30] เวลามาตรฐานลอร์ดฮาว"
  '11': "[UTC + 11] เวลาหมู่เกาะโซโลมอน, เวลามาตรฐานมากาดาน"
  '11.5': "[UTC + 11:30] เวลาเกาะนอร์ฟอล์ก"
  '12': "[UTC + 12] เวลานิวซีแลนด์, เวลาฟิจิ, เวลามาตรฐานคัมชัตกา"
  '12.75': "[UTC + 12:45] เวลาหมู่เกาะแชทัม"
  '13': "[UTC + 13] เวลาตองงา, เวลาหมู่เกาะฟีนิกซ์"
  '14': "[UTC + 14] เวลาหมู่เกาะไลน์"
