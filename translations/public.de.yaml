registerWelcomePMText: >-
  Willkommen bei %s! Baue zuerst ein Solarkraftwerk, denn Energie wird für die
  spätere Rohstoffproduktion benötigt. Um diese zu bauen, klicke links im Menu
  auf "Gebäude". Danach baue das 4. Gebäude von oben. Da du nun Energie hast,
  kannst du anfangen Minen zu bauen. Gehe dazu wieder im Menü auf Gebäude und
  baue eine Metallmine, danach wieder eine Kristallmine. Um Schiffe bauen zu
  können musst du zuerst eine Raumschiffswerft gebaut haben. Was dafür benötigt
  wird findest du links im Menüpunkt Technologie. Das Team wünscht dir viel Spaß
  beim Erkunden des Universums!
