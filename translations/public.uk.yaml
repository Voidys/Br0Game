home_meme_alt: Комікс-мем із командної палуби {game_name}
home_meme_alt_deep_space_transit: 'Комікс: двоє кадетів у шатлі — один обм''якає, побачивши поле астероїдів, інший шкірить зуби, дивлячись на сяючу туманність. «Стандартні патрулі секторів проти знахідки недослідженої туманності, багатої на ресурси.»'
home_meme_alt_deuterium_joyride: 'Комікс: втомлений командир на оглядовій палубі дивиться, як двоє новобранців літають надворі, — «Дивлюся, як новачки марнують весь свій дейтерій на катання надворі, поки я чекаю 12 годин на покращення шахт.»'
home_meme_alt_enemy_fleet: 'Комікс: кадет у паніці хапається за голову, поки спалахують сигнали тривоги — «1000 ворожих знищувачів на підльоті?! А я думав, цей сектор безпечний?!»'
home_meme_alt_fleet_decimated: 'Комікс: солдат у шоці дивиться перед собою, поки за розбитим куполом вибухають кораблі — «Коли 20 годин фармиш ресурси, а потім флот гравця з топ-3 заскакує й розбирає все за 3 секунди.»'
home_meme_alt_solo_scouting: 'Комікс: командир Каміока шкіриться й кладе роботизовану руку на плече кадета — «Не хвилюйся, кадете. Верховне командування має «повну» довіру до твоєї одиночної розвідувальної місії в Космос.»'
home_meme_alt_this_is_fine: 'Комікс: пес у скафандрі спокійно сидить у палаючому командному центрі й каже «Усе нормально» — «Не хвилюйся. Мій флот просто на 4 години запізнюється з повернення.»'
