longDescription:
  '1': "เหมืองโลหะขุดแร่ที่เป็นรากฐานของทุกจักรวรรดิ ทั้งที่เพิ่งเกิดและที่มั่นคงแล้ว"
  '2': คริสตัลเป็นส่วนผสมสำคัญของวงจรอิเล็กทรอนิกส์และโลหะผสมบางชนิด
  '3': "ดิวทีเรียมเป็นเชื้อเพลิงของยานอวกาศ และได้มาจากก้นทะเลลึก เป็นสารหายาก จึงมีราคาค่อนข้างสูง"
  '4': "โรงไฟฟ้าพลังงานแสงอาทิตย์เปลี่ยนแสงอาทิตย์เป็นพลังงาน เหมืองทุกแห่งต้องใช้พลังงานในการทำงาน"
  '6': "โดยค่าเริ่มต้น ทุกเลเวลลดเวลาวิจัยลง 8%"
  '12': "โรงไฟฟ้าฟิวชันผลิตพลังงานด้วยการหลอมรวมดิวทีเรียม ให้พลังงานมากกว่าโรงไฟฟ้าพลังงานแสงอาทิตย์ แต่สร้างแพงกว่า กำลังผลิตเพิ่มขึ้นตามเทคโนโลยีพลังงานและเลเวลของโรงไฟฟ้าเอง สูตรการผลิตพลังงานคือ:<br> พลังงานที่ผลิต = 30 x เลเวลโรงไฟฟ้าฟิวชัน x (1.05 + (0.01 * เลเวลเทคโนโลยีพลังงาน))^เลเวลโรงไฟฟ้าฟิวชัน"
  '14': "โรงงานหุ่นยนต์ผลิตหุ่นยนต์ก่อสร้างมาช่วยสร้างอาคารของคุณ ทุกเลเวลทำให้การอัปเกรดอาคารเร็วขึ้น"
  '15': "สุดยอดของวิทยาการหุ่นยนต์ ทุกเลเวลลดเวลาก่อสร้างอาคาร ยาน และสิ่งป้องกันลงครึ่งหนึ่ง"
  '21': ยานและสิ่งป้องกันทั้งหมดสร้างที่อู่ต่อยานอวกาศของดาวเคราะห์
  '22': เก็บโลหะส่วนเกิน
  '23': เก็บคริสตัลส่วนเกิน
  '24': เก็บดิวทีเรียมส่วนเกิน
  '31': "คุณต้องมีห้องวิจัยเพื่อวิจัยเทคโนโลยีใหม่ เลเวลของห้องวิจัยกำหนดว่าคุณวิจัยได้เร็วแค่ไหนและปลดล็อกเทคโนโลยีใดได้ การวิจัยดำเนินที่ห้องวิจัยของดาวเคราะห์ที่คุณเริ่มวิจัย และผลที่ได้ใช้กับดาวเคราะห์ทุกดวงของคุณ ขณะที่กำลังวิจัยอยู่ จะอัปเกรดห้องวิจัยไม่ได้"
  '33': "เทอร์ราฟอร์มเมอร์ขยายพื้นที่ใช้งานของดาวเคราะห์ ทุกเลเวลให้พื้นที่เพิ่ม 5 ช่อง บวกอีกหนึ่งช่องในทุกเลเวลที่เป็นเลขคู่ และทุกเลเวลของเทอร์ราฟอร์มเมอร์กินพื้นที่หนึ่งช่องเอง<br>การสร้างต้องใช้พลังงาน แต่พลังงานนั้นไม่ได้ถูกใช้หมดไป ดาวเคราะห์ของคุณแค่ต้องผลิตให้พอ (1,000 สำหรับเลเวล 1 และเพิ่มเป็นสองเท่าทุกเลเวล) แม้เหมืองจะใช้พลังงานนั้นอยู่แล้วก็ตาม เมื่อสร้างแล้วจะรื้อเทอร์ราฟอร์มเมอร์ไม่ได้อีก"
  '34': "คลังพันธมิตรให้คุณเติมดิวทีเรียมให้กองเรือฝ่ายเดียวกันที่ตรึงกำลังอยู่ที่ดาวของคุณ เพื่อต่อเวลาตรึงกำลังของพวกเขา เปิดได้จากหน้าอาคาร: สำหรับกองเรือที่ตรึงกำลังแต่ละกอง คุณเลือกได้ตั้งแต่ 1 ชั่วโมงไปจนถึงจำนวนชั่วโมงเท่าเลเวลของคลัง และจ่ายจำนวนชั่วโมงคูณค่าตรึงกำลังต่อชั่วโมงของกองเรือจากดิวทีเรียมของดาวคุณ ค่าตรึงกำลังต่อชั่วโมงเท่ากับหนึ่งในสิบของอัตราสิ้นเปลืองเชื้อเพลิงพื้นฐานรวมของยานในกองเรือ ปัดขึ้น กองเรือเติมเสบียงซ้ำได้เรื่อยๆ แต่จะมีเวลาตรึงกำลังเหลือเกิน 32 ชั่วโมงไม่ได้ เติมเสบียงได้เฉพาะกองเรือของผู้เล่นคนอื่นที่อยู่ในวงโคจรของดาวคุณตอนนี้เท่านั้น"
  '35': "อู่ซ่อมยานซ่อมยานที่ถูกทำลายในการรบและทิ้งทุ่งซากยานไว้ได้ การซ่อมใช้เวลาสูงสุด 12 ชั่วโมง และเสร็จก่อน 30 นาทีหลังทุ่งซากยานปรากฏไม่ได้<br>เมื่อทุ่งซากยานปรากฏ คุณมีเวลา 3 วันในการเริ่มซ่อม เมื่อซ่อมเสร็จ คุณต้องนำยานกลับเข้าประจำการเอง หากไม่ทำ ยานจะกลับเข้าประจำการอัตโนมัติหลัง 3 วัน"
  '41': "ดวงจันทร์ไม่มีชั้นบรรยากาศ และดวงจันทร์ที่เพิ่งเกิดมีที่พอสำหรับอาคารเพียงหนึ่งหลัง ดังนั้นเริ่มด้วยฐานดวงจันทร์ ทุกเลเวลให้พื้นที่เพิ่ม 3 ช่อง และกินพื้นที่หนึ่งช่องเอง เมื่อสร้างแล้วจะรื้อฐานดวงจันทร์ไม่ได้อีก"
  '42': "เซนเซอร์ฟาแลนซ์ให้คุณเฝ้าดูการเคลื่อนไหวของกองเรือ ยิ่งเลเวลสูง ระยะฟาแลนซ์ก็ยิ่งไกล: (เลเวลฟาแลนซ์)^2 - 1 ระบบโดยค่าเริ่มต้น ดังนั้นเลเวล 1 ครอบคลุมเฉพาะระบบของดวงจันทร์เอง การสแกนหนึ่งครั้งใช้ดิวทีเรียม 5,000 ซึ่งต้องอยู่บนดวงจันทร์ เมื่อจะสแกน ให้เปิดหน้ากาแล็กซีจากดวงจันทร์แล้วคลิกดาวเคราะห์ในระยะ ฟาแลนซ์สแกนดวงจันทร์ไม่ได้ เพราะดวงจันทร์ไม่มีชั้นบรรยากาศ<br><br>ฟาแลนซ์แสดงกองเรือที่ออกจากหรือบินมายังดาวเคราะห์ที่สแกน: เวลาที่ไปถึง เวลาที่การตรึงกำลังสิ้นสุด และเวลาที่กองเรือของเจ้าของกลับบ้าน การส่งประจำการและขีปนาวุธจะไม่แสดงเลย รวมถึงเที่ยวบินรีไซเคิลหรือค้าขายที่มุ่งหน้าไปยังดาวนั้นด้วย"
  '43': "ประตูกระโดดเป็นเครื่องส่งสัญญาณขนาดมหึมาที่ส่งกองเรือขนาดใหญ่ข้ามจักรวาลโดยไม่เสียเวลาเลย ไม่ใช้ดิวทีเรียม แต่โอนทรัพยากรด้วยวิธีนี้ไม่ได้ ประตูทั้งสองต้องพร้อม: หลังกระโดด ประตูแต่ละแห่งต้องพักให้เย็นลง ซึ่งโดยค่าเริ่มต้นคือ 60 นาทีที่เลเวล 1 และสั้นลงทุกเลเวล ลงไปถึง 10 นาทีตั้งแต่เลเวล 15"
  '44': "ไซโลขีปนาวุธเก็บขีปนาวุธของคุณ โดยค่าเริ่มต้น ทุกเลเวลเพิ่ม 10 ช่อง ขีปนาวุธสกัดกั้นใช้ 1 ช่อง ขีปนาวุธข้ามดาวใช้ 2 ช่อง"
  '106': "เทคโนโลยีนี้ช่วยให้คุณรวบรวมข้อมูลเกี่ยวกับดาวเคราะห์และดวงจันทร์อื่น เมื่อส่งหุ่นสอดแนม เทคโนโลยีสอดแนมของคุณจะถูกเทียบกับของเป้าหมาย ยิ่งเลเวลสูง รายงานก็ยิ่งมีข้อมูลมาก และโอกาสที่หุ่นของคุณจะถูกตรวจพบก็ยิ่งต่ำ ส่งหุ่นมากขึ้นเปิดเผยรายละเอียดมากขึ้นแต่เพิ่มความเสี่ยงที่จะถูกตรวจพบ ที่เลเวลบางระดับของเทคโนโลยีสอดแนม คุณยังรู้เรื่องกองเรือต่างชาติมากขึ้นในหน้าภาพรวม:<br><br><li>เลเวล 0-1 คุณเห็นแค่ว่ามีกองเรือกำลังมุ่งหน้ามายังดาวเคราะห์ของคุณ</li><li>เลเวล 2-3 คุณเห็นว่ามียานกี่ลำกำลังมา</li><li>เลเวล 4-7 คุณเห็นว่ากองเรือมียานประเภทใดบ้าง</li><li>เลเวล 8 ขึ้นไป คุณเห็นว่ามียานแต่ละประเภทกี่ลำในกองเรือ</li>"
  '108': "คอมพิวเตอร์ที่ดีขึ้นช่วยให้คุณสั่งการกองเรือได้มากขึ้น ทุกเลเวลของเทคโนโลยีคอมพิวเตอร์เพิ่มจำนวนกองเรือสูงสุดของคุณหนึ่งกอง"
  '109': "เทคโนโลยีอาวุธทำให้ระบบอาวุธมีประสิทธิภาพมากขึ้น ทุกเลเวลเพิ่มกำลังอาวุธของทุกยูนิต 10% ของค่าพื้นฐาน"
  '110': "เทคโนโลยีโล่ทำให้โล่ของยานและสิ่งป้องกันมีประสิทธิภาพมากขึ้น ทุกเลเวลเพิ่มความแข็งแกร่งของโล่ 10% ของค่าพื้นฐาน"
  '111': "โลหะผสมพิเศษช่วยเพิ่มเกราะของยานและสิ่งป้องกัน ทุกเลเวลเพิ่มประสิทธิภาพเกราะ 10%"
  '113': "การเชี่ยวชาญพลังงานหลายรูปแบบเป็นกุญแจสู่เทคโนโลยีใหม่มากมาย ทุกเลเวลของเทคโนโลยีพลังงานยังเพิ่มกำลังผลิตของโรงไฟฟ้าฟิวชันด้วย"
  '114': "ด้วยการรวมมิติที่ 4 และ 5 เข้าด้วยกัน คุณวิจัยเครื่องยนต์แบบใหม่ที่ประหยัดและมีประสิทธิภาพกว่าได้"
  '115': "การพัฒนาเครื่องยนต์นี้ทำให้ยานบางลำเร็วขึ้น แต่ทุกเลเวลเพิ่มเพียง 10% ของความเร็วพื้นฐาน ยานที่ได้รับผล: ยานขนส่งเล็ก ยานขนส่งใหญ่ ยานขับไล่เบา ยานรีไซเคิล และหุ่นสอดแนม (ยานขนส่งเล็กและยานรีไซเคิลจะเปลี่ยนไปใช้เครื่องยนต์ที่ดีกว่าในภายหลัง)"
  '117': "เครื่องยนต์อิมพัลส์ทำงานตามหลักแรงปฏิกิริยา การพัฒนาต่อยอดทำให้ยานบางลำเร็วขึ้น แต่ทุกเลเวลเพิ่มเพียง 20% ของความเร็วพื้นฐาน: ยานทิ้งระเบิด เรือลาดตระเวน ยานขับไล่หนัก และยานอาณานิคม รวมถึงยานขนส่งเล็กและยานรีไซเคิลเมื่อเปลี่ยนมาใช้เครื่องยนต์นี้ ขีปนาวุธข้ามดาวยังบินได้ไกลขึ้นทุกเลเวลด้วย"
  '118': "เครื่องยนต์ไฮเปอร์สเปซบิดเบือนปริภูมิรอบตัวยาน การพัฒนามันทำให้ยานบางลำเร็วขึ้น แต่ทุกเลเวลเพิ่มเพียง 30% ของความเร็วพื้นฐาน: เรือลาดตระเวนรบ เรือรบ เรือพิฆาต ดาวมรณะ จันทร์ดำ ยานขนส่งรบ อวตาร และยานรีไซเคิลรบ รวมถึงยานทิ้งระเบิดและยานรีไซเคิลเมื่อเปลี่ยนมาใช้เครื่องยนต์นี้ ต้องมีเทคโนโลยีไฮเปอร์สเปซ (เลเวล 3) และห้องวิจัย (เลเวล 7)"
  '120': "แสงที่รวมศูนย์สร้างลำแสงที่ทำลายสิ่งที่มันโดน ต้องมีห้องวิจัย (เลเวล 1) และเทคโนโลยีพลังงาน (เลเวล 2)"
  '121': "ลำไอออนที่ถูกเร่งความเร็วอันร้ายแรง สร้างความเสียหายมหาศาลเมื่อโดนเป้าหมาย"
  '122': "การพัฒนาต่อยอดจากเทคโนโลยีไอออน ที่เร่งพลาสมาพลังงานสูงซึ่งเกิดจากการทำให้ไอออนร้อนจัด มีผลทำลายล้างรุนแรงเมื่อกระทบเป้าหมาย"
  '123': "นักวิจัยบนดาวเคราะห์ต่างๆ สื่อสารกันผ่านเครือข่ายนี้ ทุกเลเวลให้ห้องวิจัยอีกหนึ่งแห่งเข้าร่วมกับห้องวิจัยที่คุณเริ่มวิจัย ระบบจะเลือกห้องวิจัยที่มีเลเวลสูงสุด และห้องวิจัยที่เชื่อมเครือข่ายต้องก้าวหน้าพอที่จะวิจัยเรื่องนั้นได้ด้วยตัวเอง เลเวลของห้องเหล่านี้ถูกรวมกันเพื่อคำนวณเวลาวิจัย"
  '124': "การวิจัยฟิสิกส์ดาราศาสตร์ปลดล็อกการตั้งอาณานิคมและการสำรวจอวกาศลึก ขีดจำกัดอาณานิคม เวลาตรึงกำลัง และตำแหน่งด้านล่างเป็นค่าเริ่มต้น จักรวาลของคุณอาจต่างออกไป<br><br> <li>ขีดจำกัดอาณานิคม</li> เลเวล 1-2 = 2 ดาวเคราะห์<br> เลเวล 3-4 = 3 ดาวเคราะห์<br> เลเวล 5-6 = 4 ดาวเคราะห์<br> เลเวล 7-8 = 5 ดาวเคราะห์<br> เลเวล 9-10 = 6 ดาวเคราะห์<br> เลเวล 11-12 = 7 ดาวเคราะห์<br> เลเวล 13-14 = 8 ดาวเคราะห์<br> เลเวล 15-16 = 9 ดาวเคราะห์<br> เลเวล 17-18 = 10 ดาวเคราะห์<br> เลเวล 19-20 = 11 ดาวเคราะห์<br> เลเวล 21 ขึ้นไป = 12 ดาวเคราะห์<br><br> <li>ช่องสำรวจ</li> เลเวล 1-3 = 1 การสำรวจ<br> เลเวล 4-8 = 2 การสำรวจ<br> เลเวล 9-15 = 3 การสำรวจ<br> เลเวล 16-24 = 4 การสำรวจ<br>(เพิ่มอีกหนึ่งทุกเลเวลที่เป็นเลขกำลังสองถัดไป: 25, 36, ...)<br><br> <li>เวลาตรึงกำลังของการสำรวจ</li> เลเวล = เวลาตรึงกำลังสูงสุดเป็นชั่วโมง<br><br> <li>ตำแหน่งที่ตั้งอาณานิคมได้</li> เลเวล 1-3 = 4-12<br> เลเวล 4-5 = 3-13<br> เลเวล 6-7 = 2-14<br> เลเวล 8 ขึ้นไป = 1-15"
  '131': "เพิ่มการผลิตโลหะ 2% ต่อเลเวล"
  '132': "เพิ่มการผลิตคริสตัล 2% ต่อเลเวล"
  '133': "เพิ่มการผลิตดิวทีเรียม 2% ต่อเลเวล"
  '134': "ลดค่าใช้จ่ายในการบิน 2% ต่อเลเวล"
  '199': "การยิงประจุอนุภาคกราวิตอนที่รวมศูนย์สร้างสนามแรงโน้มถ่วงเทียมที่ทำลายยานและแม้แต่ดวงจันทร์ได้ ต้องมีห้องวิจัย (เลเวล 12)"
  '202': "ยานขนส่งเล็กเป็นยานคล่องตัวที่ขนทรัพยากรไปยังดาวเคราะห์อื่นได้อย่างรวดเร็ว<br>มันบินด้วยเครื่องยนต์เผาไหม้จนกว่าเครื่องยนต์อิมพัลส์ของคุณจะถึงเลเวล 5 จากนั้นจะเปลี่ยนไปใช้เครื่องยนต์อิมพัลส์ ซึ่งเพิ่มความเร็วพื้นฐานเป็นสองเท่า"
  '203': "ยานขนส่งลำนี้บรรทุกได้มากกว่ายานขนส่งเล็กมาก และโดยทั่วไปเร็วกว่าด้วยเครื่องยนต์ที่ดีกว่า"
  '204': "ยานรบลำแรกที่จักรพรรดิทุกคนสร้าง ยานขับไล่เบาคล่องตัวแต่เปราะบางเมื่ออยู่ลำพัง ถ้ามีจำนวนมากก็กลายเป็นภัยคุกคามจริงจังต่อทุกจักรวรรดิ ยานขับไล่เบาเป็นยานแรกที่คุ้มกันยานขนส่งเล็กและใหญ่ไปยังดาวเคราะห์ศัตรูที่ป้องกันอ่อน"
  '205': ยานขับไล่ลำนี้มีเกราะดีกว่าและยิงแรงกว่ายานขับไล่เบา
  '206': "เรือลาดตระเวนมีเกราะเกือบสามเท่าของยานขับไล่หนัก และกำลังยิงมากกว่าสองเท่า อีกทั้งยังเร็วมาก"
  '207': "เรือรบเป็นกระดูกสันหลังของกองเรือ ปืนใหญ่หนัก ความเร็วสูง และห้องบรรทุกขนาดใหญ่ทำให้มันเป็นคู่ต่อสู้ที่ต้องเอาจริงด้วย"
  '208': "ยานหุ้มเกราะแน่นหนาลำนี้ยึดครองดาวเคราะห์ใหม่ ซึ่งจักรวรรดิที่กำลังเติบโตต้องใช้ขยายตัว ที่อาณานิคมใหม่ ยานจะถูกถอดประกอบและวัสดุรีไซเคิลทั้งหมดถูกนำไปพัฒนาโลกใหม่ จำนวนดาวเคราะห์ที่คุณตั้งอาณานิคมได้ขึ้นตรงกับการวิจัยฟิสิกส์ดาราศาสตร์: เลเวลแรกและทุกๆ เลเวลที่สองถัดจากนั้นอนุญาตให้มีอาณานิคมเพิ่มหนึ่งแห่ง (โดยค่าเริ่มต้น)"
  '209': "ยานรีไซเคิลเก็บวัตถุดิบจากทุ่งเศษซาก ความจุบรรทุก 20,000 เริ่มต้นด้วยเครื่องยนต์เผาไหม้ เปลี่ยนเป็นเครื่องยนต์อิมพัลส์เมื่อเครื่องยนต์อิมพัลส์ของคุณถึงเลเวล 17 และเปลี่ยนเป็นเครื่องยนต์ไฮเปอร์สเปซเมื่อเครื่องยนต์ไฮเปอร์สเปซของคุณถึงเลเวล 15"
  '210': หุ่นสอดแนมเป็นโดรนขนาดเล็กคล่องตัวที่ส่งข้อมูลกองเรือและดาวเคราะห์ข้ามระยะทางไกล
  '211': "ยานทิ้งระเบิดถูกสร้างมาเพื่อทำลายการป้องกันของดาวเคราะห์โดยเฉพาะ<br>มันบินด้วยเครื่องยนต์อิมพัลส์ และเปลี่ยนไปใช้เครื่องยนต์ไฮเปอร์สเปซเมื่อเครื่องยนต์ไฮเปอร์สเปซของคุณถึงเลเวล 8"
  '212': "ดาวเทียมสุริยะเป็นแท่นเซลล์แสงอาทิตย์แบบเรียบง่ายในวงโคจรสูงที่อยู่กับที่ มันเก็บแสงอาทิตย์แล้วส่งลงสถานีภาคพื้นดินด้วยเลเซอร์"
  '213': "เรือพิฆาตคือราชาของเรือรบ ต่อป้อมเลเซอร์เบา มันมีการยิงเร็ว: หลังยิงโดนแต่ละครั้ง มันได้ยิงอีกนัดใน 9 จาก 10 ครั้ง"
  '214': "พลังทำลายล้างของดาวมรณะไม่มีใครเทียบได้ และมันทำลายดวงจันทร์ได้"
  '215': เรือลาดตระเวนรบเชี่ยวชาญในการสกัดกั้นกองเรือศัตรู
  '216': "ผู้สืบทอดของดาวมรณะสุดนิยม: เร็วกว่ามากและทนกว่า มีห้องบรรทุกใหญ่โต แต่ยิงเบากว่าเล็กน้อย"
  '217': "การพัฒนาต่อจากยานขนส่งใหญ่ ที่บรรทุกได้มากกว่ามาก ใช้เครื่องยนต์ไฮเปอร์สเปซ จึงเริ่มต้นช้ากว่ายานขนส่งใหญ่ แต่แซงขึ้นมาเมื่อเครื่องยนต์ไฮเปอร์สเปซของคุณเลเวลสูงขึ้น"
  '218': "สถานการณ์เลวร้ายที่สุดอย่างแท้จริง แม้จะช้ามากก็ตาม"
  '219': พื้นที่บรรทุกมหึมาและเครื่องยนต์ใหม่ทำให้บินเร็วขึ้นและเก็บจากทุ่งเศษซากได้มากขึ้น
  '220': "ยักษ์เหล็กคือป้อมปราการแท้จริงในอวกาศ ปกป้องด้วยเกราะกำบังที่ไม่ยอมแพ้และเกราะหนาทึบ แม้การโจมตีที่ดุเดือดที่สุดก็กระเด็นออกขณะที่มันเคลื่อนไปข้างหน้าอย่างไม่ลดละ แต่ความเหนือชั้นด้านการป้องกันนี้มีราคา: อาวุธของมันแทบไม่มีอะไรให้พูดถึง และเครื่องยนต์อืดอาดทำให้มันเป็นยักษ์เชื่องช้า แทนที่จะโจมตีแบบสายฟ้าแลบหรือแปรขบวนคล่องแคล่ว ยานลำนี้พึ่งความอึดล้วนๆ ใครอยากหยุดมันต้องมีความอดทนสูง หรือกำลังยิงที่ท่วมท้น"
  '221': "สตอร์มเบลดเป็นยานขับไล่ชั้นยอด: เร็วสุดๆ และติดอาวุธอย่างไร้ปรานี คู่ต่อสู้แทบไม่ทันเห็นมันก่อนมันจะโจมตี การป้องกันเป็นเรื่องรอง ไม่จำเป็นต้องทนในสิ่งที่หนีพ้นได้ง่ายๆ เป้าหมายเดียวของมันคือกองเรือขนส่งและยานรีไซเคิล ซึ่งถูกกวาดล้างโดยไม่มีการต่อต้าน ด้วยความเร็วสูงจัด มันโจมตีได้ตามใจแล้วหายไปก่อนกำลังเสริมจะมาถึง ใครที่ตกเป็นเป้าของสตอร์มเบลดแทบไม่มีโอกาสหนีรอด"
  '222': "เรือลาดตระเวนหนักเป็นวิวัฒนาการเสริมกำลังของเรือลาดตระเวนมาตรฐาน ด้วยโล่ที่ดีขึ้นและอาวุธทรงพลัง มันยืนหยัดต่อสู้กับศัตรูที่เทอะทะได้ มันโดดเด่นเมื่อส่งไปพร้อมยักษ์เหล็ก เรือพิฆาต และยานทิ้งระเบิด ซึ่งกำลังยิงของมันเปล่งประกายจริงๆ อย่างไรก็ตาม แม้จะแข็งแกร่ง มันยังช้าและคล่องตัวน้อยกว่า"
  '223': "โดรนโล่คือแนวทางใหม่ในการป้องกันกองเรือ เน้นการปกป้องลูกเรือเป็นหลัก เทคโนโลยีโล่ที่แปลกใหม่แต่หนักทำให้ความเร็วบินและความคล่องตัวลดลงมาก แม้ความเร็วและความคล่องตัวต่ำ แต่มีประสิทธิภาพสูงในการป้องกัน โครงสร้างที่ล้าสมัยถูกดันจนถึงขีดสุดเพื่อให้การป้องกันที่แทบทะลวงไม่ได้"
  '224': "ยานขนส่งโจมตีดัดแปลงเป็นยานขนส่งที่ยังไม่ผ่านการทดสอบ ติดอาวุธเพียงเล็กน้อย สร้างขึ้นมาเพื่อก่อกวนเพื่อนบ้านที่ประมาทและไม่ทันตั้งตัวโดยเฉพาะ ยานชั่วคราวลำนี้ไม่ได้ออกแบบมาใช้ระยะยาว แต่สำหรับการโจมตีฉับพลันที่ยั่วให้เกิดปฏิกิริยาทันที เกือบรับประกันได้ว่าจะเกิดข้อพิพาทกับเพื่อนบ้านทันทีที่มันถูกส่งออกไป ด้วยอุปกรณ์จำกัดและนิสัยคาดเดายาก มันจึงเป็นเครื่องมืออันตรายที่ทำให้ความขัดแย้งบานปลายอย่างรวดเร็ว"
  '225': "ยานขนส่งพายุเป็นความมหัศจรรย์ทางเทคโนโลยีอย่างแท้จริง ให้ความสมดุลที่สมบูรณ์แบบระหว่างพลังรบ ความเร็ว และความจุบรรทุก ความสามารถในการส่งกำลังพลและทรัพยากรอย่างรวดเร็วพร้อมส่งกำลังยิงที่น่าประทับใจสู่สนามรบ ทำให้มันเป็นองค์ประกอบสำคัญของกองเรือทรงพลังทุกกอง ไม่ว่าจะเป็นหน่วยจู่โจมรวดเร็วหรือสนับสนุนปฏิบัติการระยะยาว ยานขนส่งพายุคือกุญแจสู่สงครามที่มีประสิทธิภาพและขาดไม่ได้เลยในทุกกองเรือ"
  '226': "ยานขนส่งรบยักษ์คือจุดสูงสุดของงานวิศวกรรม แม้ดีไซน์จะเทอะทะเล็กน้อยและทำให้บินช้า แต่มันเป็นยานขนส่งรบที่หุ้มเกราะหนาที่สุดที่กองเรือใดเคยเห็น กำลังยิงที่ท่วมท้นทำให้มันเป็นพลังที่หยุดไม่อยู่ในสนามรบ ยักษ์ตัวนี้ฝ่าแนวข้าศึกได้อย่างง่ายดายพร้อมปกป้องลูกเรือสูงสุด มันเป็นตัวแทนของความแข็งแกร่งและความอึด ทำให้เป็นทรัพย์สินสำคัญของทุกกองเรือที่ติดอาวุธหนัก"
  '227': "ยานรีไซเคิลปรับปรุงเป็นการอัปเกรดล้ำสมัยของยานรีไซเคิลมาตรฐาน ติดเครื่องยนต์อิมพัลส์ทรงพลัง ไปถึงทุ่งเศษซากได้เร็วและคุ้มค่าขึ้น ทำให้เป็นทรัพย์สินสำคัญของกองเรือขั้นสูงทุกกอง ดีไซน์ที่ปรับปรุงช่วยลดต้นทุนการสร้างขณะเพิ่มประสิทธิภาพการกู้คืนทรัพยากร ใช้ได้ตั้งแต่กลางเกม และให้ความได้เปรียบเชิงกลยุทธ์แก่จักรวรรดิที่กำลังขยายตัว"
  '228': "ยานรีไซเคิลโอเมกาคือจุดสูงสุดของเทคโนโลยีรีไซเคิล แต่มาพร้อมราคาสูง เครื่องยนต์ไฮเปอร์สเปซทรงพลังทำให้ไปถึงทุ่งเศษซากได้ในเวลาทำลายสถิติและกู้ทรัพยากรได้เร็วกว่ายานลำอื่น แต่ความเร็วนี้แลกมาด้วยประสิทธิภาพ: ค่าสร้างและค่าเชื้อเพลิงมหาศาล ทำให้เหมาะเฉพาะผู้บัญชาการร่ำรวยในช่วงท้ายเกม สำหรับคนที่ให้ความเร็วก่อนต้นทุน นี่คือยานรีไซเคิลขั้นสุดยอด"
  '229': "สร้างขึ้นเพื่อทลายความเหนือกว่าของ Xer ไวเปอร์คืออาวุธขั้นสุดยอดต่อยานขับไล่เบา ยานขับไล่หนัก และเรือลาดตระเวน ด้วยปืนใหญ่ยิงเร็วและเทคโนโลยีขั้นสูง มันเปลี่ยนดุลอำนาจในจักรวาล"
  '230': "เร็ว แม่นยำ แตะต้องไม่ได้ ยานสกัดกั้นไม่ได้สร้างมาเพื่อการต่อสู้ที่ยุติธรรม แต่ออกแบบมาโจมตีเร็วและแรง สร้างความได้เปรียบท่วมท้นในพริบตา"
  '231': "เบเฮมอธเป็นผลจากการวิจัยกราวิตอนหลายทศวรรษ ที่กลายเป็นแท่นรบไร้ความปรานี ต่างจากดาวมรณะ มันไม่ได้ออกแบบมาทำลายดาวเคราะห์ แต่เพื่อประสิทธิภาพในสนามรบสูงสุด ด้วยการทิ้งระบบกินพลังงานที่ต้องใช้ทำลายดวงจันทร์ ดีไซน์จึงเบาลงมาก ทำให้มีเครื่องยนต์แรงกว่า คล่องตัวกว่า และกำลังยิงมากขึ้น ปืนใหญ่กราวิตอนขนาดกะทัดรัดทำให้มันเป็นเครื่องจักรทำลายล้างเคลื่อนที่ ที่กวาดล้างแม้กองเรือขนาดมหึมาได้ลำพังลำเดียว"
  '232': "วอยด์ไททันคือจุดสูงสุดของเทคโนโลยีกราวิตอนสมัยใหม่ ทุกแง่มุมของดีไซน์ตอบสนองจุดประสงค์เดียว: การทำลายดวงจันทร์ศัตรูอย่างรวดเร็ว ป้อมอาวุธทั่วไปถูกตัดออกโดยตั้งใจเพื่อลดมวลและเปิดที่ให้เครื่องกำเนิดคริสตัลมหึมา ซึ่งจ่ายพลังให้ขดลวดเร่งความเร็วที่ล้ำหน้าที่สุดเท่าที่เคยสร้างข้ามกาแล็กซีที่รู้จัก ให้ยานมีความคล่องตัวที่หาใครเทียบไม่ได้ ความต้องการคริสตัลมหาศาลทำให้วอยด์ไททันทุกลำเป็นความสำเร็จทางอุตสาหกรรมอันยิ่งใหญ่ และเป็นสัญลักษณ์ของพลังทำลายล้างไร้ขีดจำกัด"
  '401': "เครื่องยิงจรวดเป็นสิ่งป้องกันที่เรียบง่ายแต่คุ้มค่า หลังการรบ โดยเฉลี่ยแล้วสิ่งป้องกันที่ถูกทำลายประมาณ 70% จะถูกสร้างกลับคืน"
  '402': "เลเซอร์เบาเป็นอาวุธภาคพื้นดินแบบเรียบง่าย ระบบเล็งพิเศษติดตามศัตรู และเลเซอร์ความเข้มสูงตัดทะลุตัวถังของเป้าหมาย หลังการรบ โดยเฉลี่ยแล้วสิ่งป้องกันที่ถูกทำลายประมาณ 70% จะถูกสร้างกลับคืน"
  '403': "เลเซอร์หนักเป็นเวอร์ชันปรับปรุงที่ใช้งานได้จริงของเลเซอร์เบา หลังการรบ โดยเฉลี่ยแล้วสิ่งป้องกันที่ถูกทำลายประมาณ 70% จะถูกสร้างกลับคืน"
  '404': "ปืนเกาส์ยิงกระสุนโลหะความหนาแน่นสูงด้วยความเร็วสูงมาก หลังการรบ โดยเฉลี่ยแล้วสิ่งป้องกันที่ถูกทำลายประมาณ 70% จะถูกสร้างกลับคืน"
  '405': "ปืนใหญ่ไอออนยิงลำไอออน (อนุภาคประจุบวกหรือลบ) หลังการรบ โดยเฉลี่ยแล้วสิ่งป้องกันที่ถูกทำลายประมาณ 70% จะถูกสร้างกลับคืน"
  '406': "ป้อมพลาสมาใช้เซลล์เชื้อเพลิงเครื่องปฏิกรณ์นิวเคลียร์ขนาดใหญ่ขับเครื่องเร่งแม่เหล็กไฟฟ้าที่ยิงพัลส์ (โทรอยด์) ของพลาสมา หลังการรบ โดยเฉลี่ยแล้วสิ่งป้องกันที่ถูกทำลายประมาณ 70% จะถูกสร้างกลับคืน"
  '407': "โดมโล่เล็กห่อหุ้มทั้งดาวเคราะห์ด้วยสนามที่ดูดซับพลังงานมหาศาล สร้างได้เพียงหนึ่งหลังต่อดาวเคราะห์"
  '408': "โดมโล่ใหญ่เป็นการพัฒนาต่อยอดที่ต้องใช้พลังงานมากกว่ามากเพื่อต้านการโจมตี สร้างได้เพียงหนึ่งหลังต่อดาวเคราะห์"
  '409': "วิวัฒนาการของเทคโนโลยีโดมโล่ ใช้พลังงานมากกว่ามาก แต่ทนการโจมตีได้มากกว่าโล่อื่นใด สร้างได้เพียงหนึ่งหลังต่อดาวเคราะห์"
  '410': "หลังการวิจัยแรงโน้มถ่วงหลายปี นักวิทยาศาสตร์พัฒนาปืนใหญ่กราวิตอนที่สร้างสนามกราวิตอนขนาดเล็กเข้มข้นแล้วยิงใส่ศัตรู"
  '411': "แท่นป้องกันที่ขยับไม่ได้และไม่มีพลังของตัวเอง ถูกแรงโน้มถ่วงตรึงไว้ในวงโคจรที่มั่นคงรอบดาวเคราะห์ การเริ่มกระบวนการนี้ใช้พลังงานมหาศาล สร้างได้เพียงหนึ่งแท่นต่อดาวเคราะห์"
  '412': "บังเกอร์เป็นโครงสร้างป้อมปราการที่ออกแบบมาทนการโจมตีที่รุนแรงที่สุด ให้การปกป้องที่ไม่มีใครเทียบแก่ชาวดาวเคราะห์และโครงสร้างพื้นฐานสำคัญ ทำให้เป็นรากฐานของการป้องกันดาวเคราะห์"
  '413': เลเซอร์ไททันเป็นอาวุธมหึมาที่มีพลังทำลายล้างหาใครเทียบไม่ได้
  '414': "ตัวล่อเป็นระบบป้องกันอันชาญฉลาดที่ออกแบบมาหลอกและสร้างความสับสนให้กำลังข้าศึก ด้วยการปลอมตัวเป็นเครื่องยิงจรวด มันป้องปรามการโจมตี"
  '502': "ขีปนาวุธสกัดกั้นทำลายขีปนาวุธข้ามดาวที่พุ่งเข้ามา ต้องใช้ขีปนาวุธสกัดกั้นหนึ่งลูกต่อขีปนาวุธข้ามดาวหนึ่งลูก"
  '503': "ขีปนาวุธข้ามดาวทำลายสิ่งป้องกันของคู่ต่อสู้ เว้นแต่ขีปนาวุธสกัดกั้นยิงมันตก สิ่งป้องกันที่ถูกทำลายด้วยวิธีนี้จะไม่ถูกสร้างกลับคืน โดยค่าเริ่มต้น ระยะของมัน (เป็นระบบสุริยะ) ขึ้นกับเลเวลเครื่องยนต์อิมพัลส์ของคุณ:<br>ระยะ = (5 x เลเวลเครื่องยนต์อิมพัลส์) - 1"
  '901': "โลหะเป็นทรัพยากรหลักสำหรับอาคารและยาน เป็นทรัพยากรที่ถูกที่สุด แต่ก็เป็นสิ่งที่คุณต้องใช้มากที่สุดด้วย และเหมือนคริสตัล ใช้พลังงานผลิตน้อยที่สุด ยิ่งเหมืองใหญ่ ก็ยิ่งขุดลึกลงดิน"
  '902': "คริสตัลเป็นทรัพยากรหลักสำหรับวงจรอิเล็กทรอนิกส์และโลหะผสมบางชนิด ผลิตในเหมืองใต้ดิน ที่วัตถุดิบถูกแปลงเป็นวงจรทันที"
  '903': "ดิวทีเรียมพบในทะเลที่ลึกที่สุดและเป็นหนึ่งในทรัพยากรที่หายากที่สุดในจักรวาล คุณต้องลงไปถึงพื้นทะเลจึงจะได้มา ทำให้เป็นทรัพยากรที่แพงที่สุด"
  '911': พลังงานจำเป็นต่อการผลิตทรัพยากรทุกชนิด
secureResources: "ทุกเลเวลของคลังช่วยปกป้องการผลิตรายวันของทรัพยากรนั้น 1% จากการถูกปล้นในการโจมตี สูงสุด 10%"
shortDescription:
  '1': "เหมืองโลหะขุดแร่ที่เป็นรากฐานของทุกจักรวรรดิ ทั้งที่เพิ่งเกิดและที่มั่นคงแล้ว"
  '2': คริสตัลเป็นส่วนผสมสำคัญของวงจรอิเล็กทรอนิกส์และโลหะผสมบางชนิด
  '3': "ดิวทีเรียมเป็นเชื้อเพลิงของยานอวกาศ และได้มาจากก้นทะเลลึก เป็นสารหายาก จึงมีราคาค่อนข้างสูง"
  '4': "โรงไฟฟ้าพลังงานแสงอาทิตย์เปลี่ยนแสงอาทิตย์เป็นพลังงาน เหมืองทุกแห่งต้องใช้พลังงานในการทำงาน"
  '6': "โดยค่าเริ่มต้น ทุกเลเวลลดเวลาวิจัยลง 8%"
  '12': โรงไฟฟ้าฟิวชันหลอมรวมเชื้อเพลิงดิวทีเรียมเพื่อผลิตพลังงาน
  '14': "โรงงานหุ่นยนต์ผลิตหุ่นยนต์ก่อสร้างมาช่วยสร้างอาคารของคุณ ทุกเลเวลทำให้การอัปเกรดอาคารเร็วขึ้น"
  '15': "สุดยอดของวิทยาการหุ่นยนต์ ทุกเลเวลลดเวลาก่อสร้างอาคาร ยาน และสิ่งป้องกันลงครึ่งหนึ่ง"
  '21': ยานและสิ่งป้องกันทั้งหมดสร้างที่อู่ต่อยานอวกาศของดาวเคราะห์
  '22': เก็บโลหะส่วนเกิน
  '23': เก็บคริสตัลส่วนเกิน
  '24': เก็บดิวทีเรียมส่วนเกิน
  '31': คุณต้องมีห้องวิจัยเพื่อวิจัยเทคโนโลยีใหม่
  '33': "เทอร์ราฟอร์มเมอร์ขยายพื้นที่ใช้งานของดาวเคราะห์: เพิ่ม 5 ช่องต่อเลเวล บวกอีกหนึ่งช่องในทุกเลเวลที่เป็นเลขคู่ และทุกเลเวลกินพื้นที่หนึ่งช่องเอง"
  '34': "คลังพันธมิตรให้คุณต่อเวลาตรึงกำลังของกองเรือฝ่ายเดียวกันที่ดาวของคุณด้วยดิวทีเรียม: ครั้งละไม่เกินจำนวนชั่วโมงเท่าเลเวลของคลัง"
  '35': อู่ซ่อมยานคืนสภาพยานจากทุ่งซากยาน
  '41': "ดวงจันทร์ไม่มีชั้นบรรยากาศ และดวงจันทร์ที่เพิ่งเกิดมีที่พอสำหรับอาคารเพียงหลังเดียว ดังนั้นเริ่มด้วยฐานดวงจันทร์"
  '42': "เซนเซอร์ฟาแลนซ์ให้คุณเฝ้าดูการเคลื่อนไหวของกองเรือ ยิ่งเลเวลสูง ระยะฟาแลนซ์ก็ยิ่งไกล"
  '43': ประตูกระโดดเป็นเครื่องส่งสัญญาณขนาดมหึมาที่ส่งกองเรือขนาดใหญ่ข้ามจักรวาลโดยไม่เสียเวลาเลย
  '44': ไซโลขีปนาวุธเก็บขีปนาวุธของคุณ
  '106': เทคโนโลยีนี้ช่วยให้คุณรวบรวมข้อมูลเกี่ยวกับดาวเคราะห์และดวงจันทร์อื่น
  '108': "คอมพิวเตอร์ที่ดีขึ้นช่วยให้คุณสั่งการกองเรือได้มากขึ้น ทุกเลเวลของเทคโนโลยีคอมพิวเตอร์เพิ่มจำนวนกองเรือสูงสุดของคุณหนึ่งกอง"
  '109': "เทคโนโลยีอาวุธทำให้ระบบอาวุธมีประสิทธิภาพมากขึ้น ทุกเลเวลเพิ่มกำลังอาวุธของทุกยูนิต 10% ของค่าพื้นฐาน"
  '110': "เทคโนโลยีโล่ทำให้โล่ของยานและสิ่งป้องกันมีประสิทธิภาพมากขึ้น ทุกเลเวลเพิ่มความแข็งแกร่งของโล่ 10% ของค่าพื้นฐาน"
  '111': "โลหะผสมพิเศษช่วยเพิ่มเกราะของยานและสิ่งป้องกัน ทุกเลเวลเพิ่มประสิทธิภาพเกราะ 10%"
  '113': การเชี่ยวชาญพลังงานหลายรูปแบบเป็นกุญแจสู่เทคโนโลยีใหม่มากมาย
  '114': "ด้วยการรวมมิติที่ 4 และ 5 เข้าด้วยกัน คุณวิจัยเครื่องยนต์แบบใหม่ที่ประหยัดและมีประสิทธิภาพกว่าได้"
  '115': "การพัฒนาเครื่องยนต์นี้ทำให้ยานบางลำเร็วขึ้น แต่ทุกเลเวลเพิ่มเพียง 10% ของความเร็วพื้นฐาน"
  '117': "เครื่องยนต์อิมพัลส์ทำงานตามหลักแรงปฏิกิริยา การพัฒนาต่อยอดทำให้ยานบางลำเร็วขึ้น แต่ทุกเลเวลเพิ่มเพียง 20% ของความเร็วพื้นฐาน"
  '118': "เครื่องยนต์ไฮเปอร์สเปซบิดเบือนปริภูมิรอบตัวยาน การพัฒนามันทำให้ยานบางลำเร็วขึ้น แต่ทุกเลเวลเพิ่มเพียง 30% ของความเร็วพื้นฐาน"
  '120': แสงที่รวมศูนย์สร้างลำแสงที่ทำลายสิ่งที่มันโดน
  '121': "ลำไอออนที่ถูกเร่งความเร็วอันร้ายแรง สร้างความเสียหายมหาศาลเมื่อโดนเป้าหมาย"
  '122': "การพัฒนาต่อยอดจากเทคโนโลยีไอออน ที่เร่งพลาสมาพลังงานสูงซึ่งเกิดจากการทำให้ไอออนร้อนจัด มีผลทำลายล้างรุนแรงเมื่อกระทบเป้าหมาย"
  '123': "นักวิจัยบนดาวเคราะห์ต่างๆ สื่อสารกันผ่านเครือข่ายนี้"
  '124': "ปลดล็อกการตั้งอาณานิคมและการสำรวจอวกาศลึก ดาวเคราะห์เพิ่มในเลเวลคี่ ช่องสำรวจเพิ่มในเลเวลที่เป็นเลขกำลังสอง เวลาตรึงกำลังสำรวจนานขึ้น และตำแหน่งดาวเคราะห์ในระบบมากขึ้น"
  '131': "เพิ่มการผลิตโลหะ 2% ต่อเลเวล"
  '132': "เพิ่มการผลิตคริสตัล 2% ต่อเลเวล"
  '133': "เพิ่มการผลิตดิวทีเรียม 2% ต่อเลเวล"
  '134': "ลดค่าใช้จ่ายในการบิน 2% ต่อเลเวล"
  '199': การยิงประจุอนุภาคกราวิตอนที่รวมศูนย์สร้างสนามแรงโน้มถ่วงเทียมที่ทำลายยานและแม้แต่ดวงจันทร์ได้
  '202': ยานขนส่งเล็กเป็นยานคล่องตัวที่ขนทรัพยากรไปยังดาวเคราะห์อื่นได้อย่างรวดเร็ว
  '203': "ยานขนส่งลำนี้บรรทุกได้มากกว่ายานขนส่งเล็กมาก และโดยทั่วไปเร็วกว่าด้วยเครื่องยนต์ที่ดีกว่า"
  '204': "ยานรบลำแรกที่จักรพรรดิทุกคนสร้าง ยานขับไล่เบาคล่องตัวแต่เปราะบางเมื่ออยู่ลำพัง ถ้ามีจำนวนมากก็กลายเป็นภัยคุกคามจริงจังต่อทุกจักรวรรดิ ยานขับไล่เบาเป็นยานแรกที่คุ้มกันยานขนส่งเล็กและใหญ่ไปยังดาวเคราะห์ศัตรูที่ป้องกันอ่อน"
  '205': ยานขับไล่ลำนี้มีเกราะดีกว่าและยิงแรงกว่ายานขับไล่เบา
  '206': "เรือลาดตระเวนมีเกราะเกือบสามเท่าของยานขับไล่หนัก และกำลังยิงมากกว่าสองเท่า อีกทั้งยังเร็วมาก"
  '207': "เรือรบเป็นกระดูกสันหลังของกองเรือ ปืนใหญ่หนัก ความเร็วสูง และห้องบรรทุกขนาดใหญ่ทำให้มันเป็นคู่ต่อสู้ที่ต้องเอาจริงด้วย"
  '208': ใช้ยานลำนี้ตั้งอาณานิคมบนดาวเคราะห์ว่างได้
  '209': ยานรีไซเคิลเก็บวัตถุดิบจากทุ่งเศษซาก
  '210': หุ่นสอดแนมเป็นโดรนขนาดเล็กคล่องตัวที่ส่งข้อมูลกองเรือและดาวเคราะห์ข้ามระยะทางไกล
  '211': ยานทิ้งระเบิดถูกสร้างมาเพื่อทำลายการป้องกันของดาวเคราะห์โดยเฉพาะ
  '212': "ดาวเทียมสุริยะเป็นแท่นเซลล์แสงอาทิตย์แบบเรียบง่ายในวงโคจรสูงที่อยู่กับที่ มันเก็บแสงอาทิตย์แล้วส่งลงสถานีภาคพื้นดินด้วยเลเซอร์"
  '213': เรือพิฆาตคือราชาของเรือรบ
  '214': "พลังทำลายล้างของดาวมรณะไม่มีใครเทียบได้ และมันทำลายดวงจันทร์ได้"
  '215': เรือลาดตระเวนรบเชี่ยวชาญในการสกัดกั้นกองเรือศัตรู
  '216': "ผู้สืบทอดของดาวมรณะสุดนิยม: เร็วกว่ามากและทนกว่า มีห้องบรรทุกใหญ่โต แต่ยิงเบากว่าเล็กน้อย"
  '217': "การพัฒนาต่อจากยานขนส่งใหญ่ ที่บรรทุกได้มากกว่ามาก ใช้เครื่องยนต์ไฮเปอร์สเปซ จึงเริ่มต้นช้ากว่ายานขนส่งใหญ่ แต่แซงขึ้นมาเมื่อเครื่องยนต์ไฮเปอร์สเปซของคุณเลเวลสูงขึ้น"
  '218': "สถานการณ์เลวร้ายที่สุดอย่างแท้จริง แม้จะช้ามากก็ตาม"
  '219': พื้นที่บรรทุกมหึมาและเครื่องยนต์ใหม่ทำให้บินเร็วขึ้นและเก็บจากทุ่งเศษซากได้มากขึ้น
  '220': "ยักษ์เหล็กทนการโจมตีทุกอย่างด้วยโล่ขนาดใหญ่และเกราะหนา แต่อาวุธและเครื่องยนต์ยังน่าผิดหวัง"
  '221': "สตอร์มเบลดเป็นยานขับไล่เร็วปานสายฟ้า ติดอาวุธครบมือ การป้องกัน? ไม่จำเป็น เหยื่อของมันคือยานขนส่งและยานรีไซเคิลที่ไร้การป้องกัน"
  '222': "เรือลาดตระเวนที่ช้าแต่ติดอาวุธหนัก มีโล่และกำลังโจมตีที่เสริมแล้ว"
  '223': "การออกแบบใหม่ของยานขับไล่เบา เน้นความปลอดภัยของลูกเรือ แลกกับสมรรถนะการบินที่แย่"
  '224': "ยานขนส่งที่ยังไม่ผ่านการทดสอบ ติดอาวุธเพียงเล็กน้อย ออกแบบมาก่อกวนเพื่อนบ้านที่ประมาทและจุดชนวนความขัดแย้งทันที"
  '225': "ยานที่รวมพลังรบ ความเร็ว และความจุบรรทุกไว้ด้วยกัน ทำให้ขาดไม่ได้สำหรับกองเรือทรงพลังทุกกอง"
  '226': "ยานขนส่งรบหุ้มเกราะหนา ดีไซน์น่าเกรงขามแต่เทอะทะเล็กน้อย ที่กำลังยิงท่วมท้นของมันเอาชนะแม้คู่ต่อสู้ที่แกร่งที่สุดได้"
  '227': "ยานรีไซเคิลคลาสสิกรุ่นปรับปรุงที่ติดเครื่องยนต์อิมพัลส์ ทำภารกิจกู้ซากได้มีประสิทธิภาพขึ้นในต้นทุนที่ต่ำลง"
  '228': "ยานรีไซเคิลรุ่นอัปเกรดที่เร็วมากแต่ไม่ประหยัด ติดเครื่องยนต์ไฮเปอร์สเปซ"
  '229': "สร้างขึ้นเพื่อทลายความเหนือกว่าของ Xer ไวเปอร์คืออาวุธขั้นสุดยอดต่อยานขับไล่เบา ยานขับไล่หนัก และเรือลาดตระเวน ด้วยปืนใหญ่ยิงเร็วและเทคโนโลยีขั้นสูง มันเปลี่ยนดุลอำนาจในจักรวาล"
  '230': "เร็ว แม่นยำ แตะต้องไม่ได้ ยานสกัดกั้นไม่ได้สร้างมาเพื่อการต่อสู้ที่ยุติธรรม แต่ออกแบบมาโจมตีเร็วและแรง สร้างความได้เปรียบท่วมท้นในพริบตา"
  '231': "ดาวมรณะที่เล็กกว่าและเร็วกว่า ที่ทำลายดวงจันทร์ไม่ได้ เบเฮมอธอันตรายถึงตายต่อกองเรือ"
  '232': "เร็วกว่า ระเบิดแรงกว่า และเซอร์ไพรส์เสมอ วอยด์ไททันคือความหวาดกลัวของดวงจันทร์"
  '401': เครื่องยิงจรวดเป็นสิ่งป้องกันที่เรียบง่ายแต่คุ้มค่า
  '402': "เลเซอร์เบาเป็นอาวุธป้องกันภาคพื้นดินแบบเรียบง่าย ระบบเล็งพิเศษติดตามยานศัตรู และเลเซอร์ความเข้มสูงตัดทะลุตัวถังของเป้าหมาย"
  '403': เลเซอร์หนักเป็นเวอร์ชันปรับปรุงของเลเซอร์เบา
  '404': ปืนเกาส์ยิงกระสุนโลหะความหนาแน่นสูงด้วยความเร็วสูงมาก
  '405': "ปืนใหญ่ไอออนยิงลำไอออน (อนุภาคประจุบวกหรือลบ)"
  '406': "ป้อมพลาสมาใช้เซลล์เชื้อเพลิงเครื่องปฏิกรณ์นิวเคลียร์ขนาดใหญ่ขับเครื่องเร่งแม่เหล็กไฟฟ้าที่ยิงพัลส์ (โทรอยด์) ของพลาสมา"
  '407': โดมโล่เล็กห่อหุ้มทั้งดาวเคราะห์ด้วยสนามที่ดูดซับพลังงานมหาศาล
  '408': โดมโล่ใหญ่ดูดซับพลังงานได้มากกว่ามากเมื่อถูกโจมตี
  '409': "วิวัฒนาการของเทคโนโลยีโดมโล่ ใช้พลังงานมากกว่ามาก แต่ทนการโจมตีได้มากกว่าโล่อื่นใด"
  '410': "หลังการวิจัยแรงโน้มถ่วงหลายปี นักวิทยาศาสตร์พัฒนาปืนใหญ่กราวิตอนที่สร้างสนามกราวิตอนขนาดเล็กเข้มข้นแล้วยิงใส่ศัตรู"
  '411': "แท่นป้องกันที่ขยับไม่ได้และไม่มีพลังของตัวเอง ถูกแรงโน้มถ่วงตรึงไว้ในวงโคจรที่มั่นคงรอบดาวเคราะห์ การเริ่มกระบวนการนี้ใช้พลังงานมหาศาล"
  '412': "มันปกป้อง! เหมือนบล็อกเลโก้ใน Kindergarten TD"
  '413': เลเซอร์ไททันเป็นเลเซอร์ยักษ์
  '414': "ตัวล่อเป็นระบบป้องกันอันชาญฉลาดที่ออกแบบมาหลอกและสร้างความสับสนให้กำลังข้าศึก ด้วยการปลอมตัวเป็นเครื่องยิงจรวด มันป้องปรามการโจมตี"
  '502': ขีปนาวุธสกัดกั้นทำลายขีปนาวุธข้ามดาวที่พุ่งเข้ามา
  '503': ขีปนาวุธข้ามดาวทำลายสิ่งป้องกันของคู่ต่อสู้
  '901': "โลหะเป็นทรัพยากรหลักสำหรับอาคารและยาน เป็นทรัพยากรที่ถูกที่สุด แต่ก็เป็นสิ่งที่คุณต้องใช้มากที่สุดด้วย"
  '902': คริสตัลเป็นทรัพยากรหลักที่ใช้สร้างวงจรอิเล็กทรอนิกส์และก่อตัวเป็นสารประกอบโลหะผสมบางชนิด
  '903': "ดิวทีเรียมพบในทะเลที่ลึกที่สุด เป็นทรัพยากรที่แพงที่สุดและใช้พลังงานมากที่สุดด้วย"
  '911': พลังงานจำเป็นต่อการผลิตทรัพยากรทุกชนิด
