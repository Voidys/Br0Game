op_activate_vacation_mode_confirm: Vacation mode cannot be deactivated again for 48 hours. Are you sure?
op_activate_vacation_mode_descrip: >-
  Vacation mode is designed to protect you during longer periods of absence. It
  can only be activated when no fleets of your own are on the move. When it is
  activated, it protects you from new attacks. However, attacks that have
  already begun will continue and friendly fleets that are holding will be sent
  back! The production of resources, the construction of buildings and shipyard
  orders as well as research is paused during this time and will be resumed
  afterwards. Vacation mode cannot be deactivated in the first 48 hours!
