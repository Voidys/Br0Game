kontakt: >-
  Hi!<br>On this page you will find information about the people who actively
  run, moderate and develop this project.<br>Feel free to contact us if you have
  any questions or problems.<br><br><!--discord_url-->For a better exchange with us, but also with
  the other players, we have set up a Discord server. You can find it <a
  href="{discord_url}">here</a> or via the menu.<br>On the
  server you will find the latest news, as well as exciting memes between the
  alliances of the universe.<br>Ask questions about game mechanics and help with
  your own suggestions for the further development of the game.<br><br><!--/discord_url-->Of
  course, we will also answer your in-game questions.<br>However, please bear in
  mind that we only play the game as a hobby. Answers may take a few days.<br>
