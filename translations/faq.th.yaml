faq_overview: FAQ
questions:
  '1':
    '1':
      body: |-
        <p>ส่วนนี้อธิบายอาคารหลัก ว่าควรสร้างอะไรก่อนและแต่ละอย่างมีไว้ทำอะไร จักรวรรดิที่เฟื่องฟูเริ่มจากการสร้างอาคารตามลำดับที่เหมาะสม</p>
        <h3>โรงไฟฟ้าพลังงานแสงอาทิตย์</h3>
        <p>สร้างอันนี้ก่อน เหมืองต้องใช้พลังงานเพื่อผลิตโลหะ คริสตัล และดิวทีเรียม หลังโรงไฟฟ้าสร้างเสร็จ แถบทรัพยากรและหน้าการผลิตจะแสดงว่าคุณมีพลังงานเท่าไร</p>
        <h3>เหมืองโลหะ</h3>
        <p>โลหะเป็นหนึ่งในสามทรัพยากร เกือบทุกอย่างที่คุณสร้างหรือวิจัยต้องใช้โลหะ ดังนั้นการขยายเหมืองนี้จึงต้องมาก่อน ช่วงต้นเกมให้ทำเลเวลนำเหมืองอื่นหลายเลเวล</p>
        <h3>เหมืองคริสตัลและโรงกลั่นดิวทีเรียม</h3>
        <p>คริสตัลใช้ในอาคาร ยาน และงานวิจัย คุณผลิตได้น้อยกว่าโลหะ จึงมีค่ากว่า ในช่วงท้ายเกมมักถูกแย่งชิงกันอย่างดุเดือด ดิวทีเรียมเป็นเชื้อเพลิงของกองเรือ เผาเป็นพลังงานในโรงไฟฟ้าฟิวชันได้ และจำเป็นสำหรับอาคารและงานวิจัยสำคัญหลายอย่าง (รวมถึงห้องวิจัย)</p>
        <p>ข้อมูลเพิ่มเติม: <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">วิกิ</a></p>
      title: "ขั้นที่ 1"
    '2':
      body: |-
        <p>การขยายจักรวรรดิและปฏิสัมพันธ์กับผู้เล่นคนอื่นต้องมีอาคารเพิ่ม งานวิจัยและอู่ต่อยานอวกาศช่วยให้คุณเริ่มสร้างกองเรือและการป้องกันดาวเคราะห์ได้</p>
        <h3>อู่ต่อยานอวกาศ</h3>
        <p>ยานทั้งหมด (และสิ่งป้องกัน) สร้างที่นี่ อู่ต่อยานอวกาศเปิดให้สร้างได้แต่เนิ่นๆ แต่ยานหลายประเภทยังต้องวิจัยเพิ่ม เมนูเทคโนโลยีแสดงข้อกำหนดของยานและสิ่งป้องกันแต่ละอย่าง อู่ที่เลเวลสูงขึ้นสร้างได้เร็วขึ้น</p>
        <h3>ห้องวิจัย</h3>
        <p>เริ่มงานวิจัยที่นี่ งานวิจัยปลดล็อกอาคาร ยาน สิ่งป้องกัน และงานวิจัยต่อยอด และบางเทคโนโลยีให้โบนัสกับสิ่งที่คุณมีอยู่แล้วด้วย การขยายห้องวิจัยทำให้วิจัยเร็วขึ้น</p>
        <h3>โรงงานหุ่นยนต์</h3>
        <p>โรงงานหุ่นยนต์ขาดไม่ได้ เลเวลที่สูงขึ้นช่วยลดเวลาก่อสร้างอาคารและเร่งการผลิตยานด้วย เมื่อเวลาสร้างยาวเกินไป ให้ขยายโรงงานหุ่นยนต์เพื่อลดเวลาลง</p>
      title: "ขั้นที่ 2"
    '3':
      body: |-
        <p>ส่วนนี้พูดถึงการป้องกันดาวเคราะห์และการเคลื่อนกองเรือครั้งแรก: วิธีส่งกองเรือและวิธีรับมือผู้เล่นคนอื่น</p>
        <h3>หน้ากาแล็กซี</h3>
        <p>ใช้หาผู้เล่นคนอื่น คุณจะเห็นรายละเอียดของดาวเคราะห์อื่น และส่งกองเรือบางส่วนจากหน้านี้ได้โดยตรง คุณยังส่งข้อความหาผู้เล่น หรือสอดแนมดาวเคราะห์ได้ถ้ามีหุ่นสอดแนม</p>
        <h3>การส่งกองเรือ</h3>
        <p>ส่งกองเรือได้จากหน้ากาแล็กซีหรือเมนูกองเรือ เลือกก่อนว่าจะส่งยานแต่ละประเภทกี่ลำ จากนั้นตั้งเป้าหมาย (พิกัดจากหน้ากาแล็กซี) และความเร็ว สุดท้ายเลือกภารกิจ เช่น โจมตี ส่งประจำการ ตรึงกำลัง รีไซเคิล หรือขนส่ง</p>
        <h3>การป้องกัน</h3>
        <p>เมื่อมีอู่ต่อยานอวกาศแล้ว คุณก็สร้างสิ่งป้องกันได้ด้วย มันปกป้องดาวเคราะห์และสู้ร่วมกับกองเรือที่อยู่ที่นั่นตอนการโจมตีมาถึง ต่างจากยาน สิ่งป้องกันที่ถูกทำลายประมาณ 70% จะได้รับการซ่อมหลังการรบ</p>
      title: "ขั้นที่ 3"
    category: เคล็ดลับสำหรับมือใหม่
  '2':
    '1':
      body: |-
        <h3>การปล้น</h3>
        <p>การปล้นคือการโจมตีผู้เล่นคนอื่นเพื่อเอาทรัพยากรของเขา ประเภททั่วไป:</p>
        <ul>
        <li>การปล้นฟาร์ม</li>
        <li>การโจมตีกองเรือ</li>
        <li>การปล้นทุ่งเศษซาก</li>
        <li>การสกัดกั้น</li>
        </ul>
        <h3>การปล้นฟาร์ม</h3>
        <p>นี่คือการโจมตีที่พบบ่อยที่สุดในจักรวาล คุณสอดแนมดาวเคราะห์ใกล้เคียงแล้วส่งกองเรือเล็กที่มีที่บรรทุกและกำลังยิงพอจะทะลวงการป้องกันเบาและยังได้กำไร: ทรัพยากรที่ปล้นมาควรมากกว่าดิวทีเรียมที่ใช้บวกความสูญเสียของคุณเอง</p>
        <h3>การโจมตีกองเรือ</h3>
        <p>ระดับสูงสุดของการปล้น คือการล่ากองเรือของผู้เล่นคนอื่น นอกจากหุ่นสอดแนมและโชคแล้ว เซนเซอร์ฟาแลนซ์และจังหวะเวลาก็สำคัญ เมื่อเจอกองเรือที่คุ้มค่า คุณยังต้องตามให้ทันและรีไซเคิลเศษซาก ซึ่งมักยาก เพราะกองเรือที่ให้กำไรอาจเกินความจุยานรีไซเคิลของคุณ จึงต้องประสานยานรีไซเคิลและ ถ้าจำเป็น พันธมิตร ACS ควบคู่กับกองเรือรบ</p>
        <h3>การปล้นทุ่งเศษซาก</h3>
        <p>วิธีทำกำไรที่ง่ายที่สุดและเป็นที่นิยมน้อยที่สุด: เก็บเศษซากที่ผู้เล่นคนอื่นสร้างไว้ เศษซากเป็นของคนที่เก็บ ดังนั้นการขโมยทุ่งเศษซากจึงเป็นต้นเหตุของความบาดหมางที่พบบ่อย</p>
        <h3>การสกัดกั้น</h3>
        <p>งานของฟลีตเตอร์คือสร้างกองเรือและทำลายกองเรือ คุณไม่ได้เจอยานที่ว่างอยู่เสมอไป ดังนั้นการจับผู้เล่นฝีมือดีมักหมายถึงการสกัดกั้นตอนที่เขาเซฟกองเรือหรือกำลังบินไปโจมตี ซึ่งไม่ง่าย และก็มีวิธีป้องกันได้</p>
        <ul>
        <li><p>ดวงจันทร์ช่วยให้สกัดกั้นง่ายขึ้น เพราะเซนเซอร์ฟาแลนซ์สแกนการเคลื่อนไหวของกองเรือบนดาวเคราะห์ในระยะได้ (ไม่รวมดวงจันทร์) หากเจอกองเรือที่คุ้มจะจับ ให้คำนวณเวลาบินที่เหลือ โดยเฉพาะเวลากลับหลังไปถึง เลเวลเครื่องยนต์ (เผาไหม้ อิมพัลส์ ไฮเปอร์สเปซ) จากรายงานสอดแนมก็พอสำหรับคำนวณ ด้วยมือหรือเครื่องคำนวณเวลาบิน นาฬิกาที่แม่นยำช่วยได้ จับเวลากองเรือและยานรีไซเคิลของคุณให้ไปถึงหลังเป้าหมายราว 3-5 วินาทีที่ดาวเคราะห์หรือดวงจันทร์ของเขา ยานรีไซเคิลก็ต้องจับเวลาเช่นกัน</p></li>
        <li><p>หากจะสกัดกั้นกองเรือที่บินจากดวงจันทร์ไปทุ่งเศษซาก คุณต้องรู้เวลาออกตัวคร่าวๆ สร้างทุ่งเศษซากที่มองเห็นได้ในตำแหน่งที่คุณคิดว่าเขาจะมาเก็บ (เช่นด้วยหุ่นสอดแนม) คำนวณว่ากองเรือของเขาใช้เวลาไปถึงเท่าไร เฝ้าดูระบบ แล้วรีเฟรชจนกว่าทุ่งจะหายไป จดเวลานั้น บวกเที่ยวบินขากลับของเขา แล้วจับเวลากองเรือและยานรีไซเคิลของคุณให้ตามหลังเวลาถึงนั้นไม่กี่วินาที</p>
        <p><b>หมายเหตุ:</b> วิธีนี้ไม่ได้ผลเสมอไป ยานรีไซเคิลที่ส่งล่วงหน้าไปเก็บทุ่งก่อนเป็นวิธีสู้ที่พบบ่อย</p></li>
        <li>การสกัดกั้นอีกแบบคือการตรึงกำลังที่ดาวของเพื่อนเพื่อปกป้อง ทำให้ผู้โจมตีต้องเรียกกลับเพราะกองเรือป้องกันจะแข็งแกร่งเกินไป คุณลดความเสี่ยงที่จะโดนจับแบบนี้ได้ด้วยการสแกนเซฟ</li>
        <li><p>หากผู้เล่นส่งกองเรือประจำการจากดาวดวงหนึ่งไปอีกดวงแล้วเรียกกลับ กองเรือจะหายไปจากเซนเซอร์ฟาแลนซ์ ให้ดูรูปแบบการเซฟของเขา (ตอนออกตัวและตอนเรียกกลับ) เมื่อคาดว่าเขาจะเรียกกลับ ให้ใช้ฟาแลนซ์สแกนดาวดวงนั้นทุกวินาที ทันทีที่กองเรือหายไป จดเวลา บวกเที่ยวบินขากลับ แล้วไปถึงหลังจากนั้นราว 4-6 วินาทีพร้อมกองเรือและยานรีไซเคิล</p>
        <p>หากเขาเซฟจากดวงจันทร์ไปทุ่งเศษซากและส่งยานรีไซเคิลไปก่อน การสกัดกั้นแทบเป็นไปไม่ได้ เว้นแต่คุณจะทำลายดวงจันทร์ ส่งดาวมรณะด้วยภารกิจทำลาย หลังดวงจันทร์หายไป กองเรือจะกลับดาวเคราะห์ ใช้ฟาแลนซ์สแกนดาวนั้นแล้วแทรกตัวตามหลังเขาไม่กี่วินาที</p>
        <p>เทคนิคเหล่านี้ทั้งหมดได้ผลดีขึ้นมากหากคุณรู้นิสัยของเป้าหมาย เช่น เซฟทุกเย็น 23:00 หรือออนไลน์ตอนเที่ยง ศึกษาผู้เล่นก่อนสกัดกั้น</p></li>
        </ul>
        <p>อ่านเพิ่มในวิกิ: <a href="{wiki_url}/wiki/En/Saven" target="_blank">การเซฟกองเรือ</a>, <a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">เซนเซอร์ฟาแลนซ์</a></p>
      title: การปล้น
    '2':
      body: |-
        <h3>การโจมตีด้วย ACS</h3>
        <p>หากจะโจมตีร่วมกัน ให้ส่งกองเรือด้วยภารกิจโจมตีไปที่เป้าหมายก่อน หลังออกตัวแล้ว เปิดเมนูกองเรือแล้วใช้ปุ่ม ACS เพื่อเปลี่ยนกองเรือนั้นเป็นกลุ่ม ACS ที่นั่นคุณเปลี่ยนชื่อกลุ่มและเชิญผู้เล่นคนอื่นได้ ผู้เล่นที่เริ่มการโจมตีจะถูกเชิญอัตโนมัติ ผู้เล่นที่ได้รับเชิญแต่ละคนจะส่งยานของตัวเองไปยังพิกัดเดียวกันด้วยภารกิจโจมตีร่วมพันธมิตร</p>
        <p>กลุ่มจะบินด้วยความเร็วเท่ากองเรือที่ช้าที่สุดที่เข้าร่วมเสมอ กองเรือที่เร็วกว่าที่เข้าร่วมทีหลังไม่ได้ทำให้เวลาที่เหลือสั้นลง กองเรือที่ช้ากว่าจะเพิ่มเวลาที่เหลือเป็นเวลาบินของตัวเอง โดยปกติเข้าร่วมการโจมตี ACS หนึ่งครั้งได้สูงสุด 5 ผู้เล่นและ 16 กองเรือ (การตั้งค่าของจักรวาลอาจต่างกัน) กองเรือที่เข้าร่วมเพิ่มเวลาบินที่เหลือได้ไม่เกิน 30% หากเหลือ 100 นาที กองเรือที่เข้าร่วมใช้เวลาได้สูงสุด 130 นาที</p>
        <p><b>คำเตือน:</b> หากผู้ก่อตั้ง ACS เรียกกลับ ทุกกองเรือในกลุ่มก็จะถูกเรียกกลับด้วย</p>
        <h3>การป้องกันด้วย ACS</h3>
        <p>หากคุณถูกโจมตี สมาชิกพันธมิตรและเพื่อนช่วยได้ พวกเขาส่งกองเรือไปที่พิกัดที่ถูกโจมตี เลือกว่าจะอยู่นานเท่าไร และใช้ภารกิจตรึงกำลัง นอกจากดิวทีเรียมค่าบิน ยังมีค่าตรึงกำลังเพิ่มที่ถูกหักตอนออกตัว ขึ้นกับขนาดกองเรือและระยะเวลา ระหว่างที่ตรึงกำลังอยู่ พวกเขาจะสู้ในทุกการรบบนดาวเคราะห์หรือดวงจันทร์นั้น และปรากฏในรายงานสอดแนมเหมือนเป็นยานของคุณ จับเวลาให้ไปถึงก่อนผู้โจมตีเล็กน้อย เพื่อให้การสแกนเซฟมองเห็นได้ยากขึ้น ผู้เล่นที่ตรึงกำลังเรียกกลับได้ทุกเมื่อจากเมนูกองเรือ มิฉะนั้นกองเรือจะรอจนครบเวลาตรึงกำลังแล้วกลับบ้าน</p>
        <h3>ดิวทีเรียมต่อการตรึงกำลัง 1 ชั่วโมง</h3>
        <p>ยานขนส่งเล็ก: 5<br>
        ยานขนส่งใหญ่: 5<br>
        ยานขับไล่เบา: 2<br>
        ยานขับไล่หนัก: 7<br>
        เรือลาดตระเวน: 30<br>
        เรือรบ: 50<br>
        ยานอาณานิคม: 100<br>
        ยานรีไซเคิล: 30<br>
        หุ่นสอดแนม: 1/10<br>
        ยานทิ้งระเบิด: 100<br>
        เรือพิฆาต: 100<br>
        ดาวมรณะ: 1/10</p>
      title: "ระบบโจมตีร่วมพันธมิตร (ACS)"
    '3':
      body: |-
        <p>ดวงจันทร์เกิดได้เมื่อมีทุ่งเศษซากอย่างน้อย 100,000 หน่วย (โอกาสเกิดดวงจันทร์ 1%) โอกาสสูงสุด 20% ไม่ว่าทุ่งจะใหญ่แค่ไหน</p>
        <h3>ทั่วไป</h3>
        <p>ดวงจันทร์เปลี่ยนชื่อได้เหมือนดาวเคราะห์ แต่คำว่า "(Moon)" จะยังอยู่ในชื่อ คุณมีดวงจันทร์ได้สูงสุดหนึ่งดวงต่อดาวเคราะห์ ดวงจันทร์ช่วยให้คุณเซฟกองเรือพ้นสายตาเซนเซอร์ฟาแลนซ์ จึงควรสร้างให้เร็วพอสมควร บนดวงจันทร์คุณสร้างโรงงานหุ่นยนต์ อู่ต่อยานอวกาศ คลังโลหะ คลังคริสตัล คลังดิวทีเรียม คลังพันธมิตร ฐานดวงจันทร์ เซนเซอร์ฟาแลนซ์ และประตูกระโดดได้</p>
        <h3>มูนช็อต</h3>
        <p>มูนช็อตคือการจงใจทำลายยานเพื่อสร้างทุ่งเศษซาก ตัวเลือกปกติคือยานขับไล่เบา: ที่ 30% ของกองเรือและ 0% ของสิ่งป้องกันกลายเป็นเศษซาก ยานขับไล่เบา 1,667 ลำให้โอกาสดวงจันทร์ 20% เสียไปก็ไม่แพง และใกล้เพดานมาก หากผู้เล่นที่แข็งกว่าทำลายยานขับไล่เบาของผู้เล่นที่อ่อนกว่า ใครก็เก็บเศษซากได้ หากผู้เล่นที่อ่อนกว่าโจมตีผู้เล่นที่แข็งกว่าด้วยยานที่ตั้งใจให้ตาย เฉพาะผู้เล่นที่อ่อนกว่าเท่านั้นที่เก็บเศษซากได้ ไม่เช่นนั้นถือเป็นการพุช ดวงจันทร์และความพยายามสร้างดวงจันทร์อยู่ภายใต้กฎการพุช</p>
        <p>ในจักรวาลที่สิ่งป้องกันก็สร้างเศษซากด้วย มักดีกว่าที่จะสร้างสิ่งป้องกันแล้วให้ถูกทำลายหลายระลอกเพื่อพยายามสร้างดวงจันทร์หลายครั้ง เครื่องยิงจรวด 3,334 เครื่อง หรือป้อมเลเซอร์เบา 3,334 ป้อม เป็นตัวเลือกที่พบบ่อย</p>
        <p>เมื่อดวงจันทร์เกิด รายงานการรบจะบอกว่าโลหะและคริสตัลอิสระจำนวนมหาศาลรวมตัวกันและก่อเป็นดาวบริวารรอบดาวเคราะห์</p>
        <p>โอกาสดวงจันทร์ระหว่าง 1% ถึง 19%: ขนาดสุ่ม โอกาสดวงจันทร์ 20%: เส้นผ่านศูนย์กลางมากกว่า 8,000 กม. ดวงจันทร์ไม่เคยใหญ่เกิน 8,944 กม.</p>
        <h3>อาคาร</h3>
        <p>โดยปกติไม่คุ้มที่จะสร้างคลังบนดวงจันทร์ เพราะไม่มีการผลิตที่นั่น อู่ต่อยานอวกาศก็แทบไม่มีประโยชน์เช่นกัน: เวลาสร้างนาน และคุณสร้างยานบนดาวเคราะห์ได้ คลังพันธมิตรยังเป็นที่ถกเถียง และยังกินพื้นที่ที่มีค่า</p>
        <p>อาคารสามอย่างที่มีเฉพาะบนดวงจันทร์คือ:</p>
        <ul>
        <li><p><b>ฐานดวงจันทร์</b><br>เพิ่มพื้นที่สร้าง: 3 ต่อเลเวล โดยหนึ่งช่องถูกใช้โดยการอัปเกรดฐานดวงจันทร์ครั้งถัดไป</p></li>
        <li><p><b>เซนเซอร์ฟาแลนซ์</b><br>แสดงการเคลื่อนไหวของกองเรือบนดาวเคราะห์ของศัตรู (ไม่รวมดวงจันทร์) ระยะเพิ่มขึ้นทุกเลเวล</p></li>
        <li><p><b>ประตูกระโดด</b><br>ย้ายยานจากดวงจันทร์หนึ่งไปอีกดวงได้ทันที ทรัพยากรไปด้วยไม่ได้ หลังกระโดด ประตูต้องใช้เวลาเย็นลง (ปกติหนึ่งชั่วโมง) ไม่เช่นนั้นจะร้อนเกิน</p></li>
        </ul>
        <p>ลำดับการสร้างดวงจันทร์ที่พบบ่อย:<br>
        <b>คำอธิบาย:</b><br>
        MB – ฐานดวงจันทร์<br>
        SP – เซนเซอร์ฟาแลนซ์<br>
        ST – ประตูกระโดด<br>
        RB – โรงงานหุ่นยนต์</p>
        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>
        หลังจากนั้นคุณขยายเซนเซอร์ฟาแลนซ์ต่อได้ถ้ามีทรัพยากร หรือจะรื้อโรงงานหุ่นยนต์ลงบางเลเวลแล้วเอาช่องไปใส่ฟาแลนซ์ก็ได้</p>
        <h3>การทำลาย</h3>
        <p>ดวงจันทร์ทำลายได้ด้วยดาวมรณะเท่านั้น ในเมนูภารกิจให้เลือกทำลายแทนโจมตี กองเรือใดๆ บนดวงจันทร์ต้องถูกทำลายก่อน ดาวมรณะที่รอดอาจยังสูญเสียได้เมื่อดวงจันทร์ถูกทำลาย การทำลายดวงจันทร์ไม่สร้างทุ่งเศษซาก</p>
        <h3>การโจมตีดวงจันทร์ด้วยดาวมรณะ</h3>
        <p>โอกาสทำลายดวงจันทร์: (100 − sqrt(ขนาดดวงจันทร์)) × sqrt(จำนวนดาวมรณะ) โอกาสที่ดาวมรณะผู้โจมตีจะถูกทำลาย: sqrt(ขนาดดวงจันทร์) / 2 ดวงจันทร์ที่ใหญ่กว่าเสี่ยงกว่าในการทำลาย</p>
        <h3>โอกาสและขนาดดวงจันทร์</h3>
        <p>เศษซาก 100,000 หน่วยให้โอกาสดวงจันทร์ 1% โอกาสสูงสุด: 20% หลังการเปลี่ยนแปลงภายหลัง ดวงจันทร์ทุกดวงมีจำนวนช่องสร้างสูงสุด (79) ก่อนหน้านี้คือ FLOOR((เส้นผ่านศูนย์กลาง / 1000)²) ดวงจันทร์ที่ใหญ่ที่สุดเป็นไปได้: เส้นผ่านศูนย์กลาง 8,944 กม. 79 ช่อง</p>
        <p>อ่านเพิ่มในวิกิ: <a href="{wiki_url}/wiki/En/Mond" target="_blank">ดวงจันทร์</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">วิกิ</a></p>
      title: ดวงจันทร์
    '4':
      body: |-
        <h3>ฉันตั้งพันธมิตรได้อย่างไร?</h3>
        <p>เปิดเมนู "พันธมิตร" ทางซ้าย แล้วเลือกสร้างพันธมิตรของคุณเอง กรอกแท็กพันธมิตร (ตัวย่อสั้นๆ) และชื่อพันธมิตร ตัวอย่าง: พันธมิตรชื่อ "The Top Ally" อาจใช้แท็ก "DTA"</p>
        <p>ใช้ได้เฉพาะตัวอักษร ตัวเลข และช่องว่าง หลังกรอกแท็กและชื่อแล้ว คลิกสร้าง หากชื่อหรือแท็กนั้นถูกใช้ไปแล้ว คุณจะได้ข้อความผิดพลาดและต้องเลือกใหม่ เมื่อสำเร็จคุณจะเห็นข้อความยืนยัน กดต่อไปเพื่อเปิดเมนูพันธมิตรที่ยังว่างอยู่ ซึ่งคุณเข้าได้เสมอจากเมนูพันธมิตรทางซ้าย ด้านบนคุณจะเห็นแท็กและชื่อของคุณ</p>
        <p>ด้านล่างนั้นคุณจะพบ:<br>
        สมาชิก: สมาชิกทุกคนพร้อมคะแนน พิกัดดาวบ้าน วันที่เข้าร่วม และสถานะออนไลน์ คลิกหัวคอลัมน์เพื่อเรียงลำดับ<br>
        ยศของคุณ: ชื่อยศของคุณ พร้อมลิงก์ไปยังการจัดการพันธมิตร<br>
        ข้อความหมู่: ส่งข้อความถึงทั้งพันธมิตรหรือเฉพาะบางยศ</p>
        <h3>การจัดการพันธมิตร</h3>
        <p>ยศ ให้คุณตั้งสิทธิ์ของแต่ละยศ เช่น ยุบพันธมิตรหรือส่งข้อความหมู่ สมาชิก ให้คุณเตะผู้เล่น มอบยศ และดูว่าพวกเขาออฟไลน์มากี่วัน คุณยังเปลี่ยนแท็กและชื่อพันธมิตรได้ด้วย</p>
        <p>การจัดการข้อความ แก้ไขข้อความของพันธมิตร ข้อความภายนอกทุกคนเห็นได้ ข้อความภายในเห็นได้เฉพาะสมาชิก ข้อความใบสมัครเป็นแม่แบบสำหรับผู้ที่มาสมัคร</p>
        <p>ตัวเลือก ให้คุณลิงก์รูปแบนเนอร์และบอร์ดพันธมิตร เลือกว่าจะเปิดรับใบสมัครหรือไม่ และตั้งชื่อยศผู้ก่อตั้ง หากเว้นว่างไว้ ยศนี้จะเป็น "Founder"</p>
        <p>คุณยุบพันธมิตรได้ หรือโอนให้สมาชิกคนอื่น ซึ่งจะกลายเป็นผู้ก่อตั้ง</p>
      title: พันธมิตร
