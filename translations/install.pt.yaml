install_desc: >-
  Para ativar a ferramenta de instalação, crie o arquivo
  "var/ENABLE_INSTALL_TOOL"<br> O nome do arquivo diferencia maiúsculas de
  minúsculas e não tem final de tipo de arquivo.<br> O arquivo pode estar
  vazio. 

  Ele será excluído automaticamente após a conclusão da instalação ou se tiver
  mais de uma hora.
install_title: A ferramenta de instalação está bloqueada
intro_install: Para Instalação
intro_lang: Idioma
intro_text: >-
  O Br0Game é um dos melhores projectos de OGame.<br>O Br0Game é a versão mais
  recente e mais estável do XNova actualmente desenvolvido. Br0Game é notável
  por sua facilidade de estabilidade, flexibilidade, dinamismo, qualidade e
  utilização. Nós sempre esperamos ser melhor do que as tuas
  expectativas.<br><br>O sistema de instalação irá guiar-te através da
  instalação ou atualizar de uma versão anterior para a mais recente. Cada
  questão, um problema, por favor não hesites em pedir ao nosso desenvolvimento
  e suporte em caso de duvidas!<br><br>O Br0Game é um projeto em Open Source,
  lincenciado sob GNU GPL v3. Para que esta seja verificado, por favor clica no
  link acima onde se refera a "Lincença"<br><br>Antes da instalação pode ser
  iniciado um pequeno teste para verificar se o teu Plano/Dominio tem todos os
  requesitos para suportar o Br0Game
intro_upgrade_head: Br0Game já instalado?
intro_upgrade_text: >-
  <p>Já instalaste o Br0Game e queres fácil actualização?</p><p>Aqui podes
  atualizar a base de dados antiga com apenas alguns cliques!</p>
intro_welcome: Olá utilizador de Br0Game!
