step1_desc: >-
  Agora que foi determinado que Br0Game pode ser instalado no teu servidor,
  deverás fornecer algumas informações. Se tu não sabes como executar uma
  ligação de base de dados, entra em contato com teu provedor de hospedagem
  primeiro ou com o fórum de Br0Game para ajuda e suporte. Quando tu inserires
  os dados, verifica se foram introduzidos correctamente
