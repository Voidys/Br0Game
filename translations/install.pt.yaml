req_desc: >-
  Antes da instalação prosseguir, o Br0Game realizará alguns testes para
  verificar se o teu Servidor suporta o Br0Game, de modo garantir que o Br0Game
  possa ser instalado. É surgerido que leia cuidadosamente os resultados, e não
  prossiga até todos estes serem verificados.
