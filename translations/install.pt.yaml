req_php_need: Versão instalada da linguagem de script &raquo;PHP&laquo;
req_php_need_desc: >-
  <strong>Requerido</strong> — O PHP é a linguagem base de código do Br0Game.
  Este é requerido a versão PHP 5.2.5 ou superior para que todos os modulos
  funcionam correctamente
