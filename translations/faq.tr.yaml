faq_overview: FAQ
questions:
  '1':
    '1':
      body: |-
        <p>Bu bölümde temel binaları anlatıyoruz: önce neyi inşa etmelisin ve hangisi ne işe yarar. Gelişen bir imparatorluk, binaları mantıklı bir sırayla kurmakla başlar.</p>
        <h3>Solar Enerji Santrali</h3>
        <p>Önce bunu kur. Madenlerin metal, kristal ve deuterium üretebilmesi için enerji gerekir. Santral bittikten sonra kaynak çubuğu ve Üretim sayfası ne kadar enerjin olduğunu gösterir.</p>
        <h3>Metal Madeni</h3>
        <p>Metal üç kaynaktan biridir. İnşa ettiğin ya da araştırdığın hemen her şey metal ister, bu yüzden bu madeni geliştirmek öncelik olmalı. Başlarda onu diğer madenlerinin birkaç seviye önünde tut.</p>
        <h3>Kristal Madeni ve Deuterium Sentezleyici</h3>
        <p>Kristal binalarda, gemilerde ve araştırmalarda kullanılır. Metalden daha az üretirsin, bu da onu daha değerli yapar; oyunun ilerleyen aşamalarında çoğu zaman sert bir şekilde çekişilir. Deuterium filolarına yakıt olur, Füzyon Enerji Santrali'nde enerjiye çevrilebilir ve birkaç önemli bina ile araştırma için gereklidir (Araştırma Laboratuvarı dahil).</p>
        <p>Daha fazla bilgi: <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>
      title: 1. Adım
    '2':
      body: |-
        <p>İmparatorluğunu büyütmek ve diğer oyuncularla etkileşime girmek için daha fazla binaya ihtiyacın var. Araştırma ve bir Tersane, filo ile gezegen savunması kurmanı sağlar.</p>
        <h3>Tersane</h3>
        <p>Tüm gemiler (ve savunmalar) burada üretilir. Tersane erken açılır ama birçok gemi sınıfı için yine de ek araştırma gerekir. Teknolojiler menüsü her gemi ve savunmanın gereksinimlerini listeler. Tersane seviyesi yükseldikçe üretim hızlanır.</p>
        <h3>Araştırma Laboratuvarı</h3>
        <p>Araştırmalar burada başlatılır. Binaların, gemilerin, savunmaların ve yeni araştırmaların kilidini açar; bazı teknolojiler sahip olduğun şeylere bonus da verir. Araştırma Laboratuvarını geliştirmek araştırmaları hızlandırır.</p>
        <h3>Robot Fabrikası</h3>
        <p>Robot Fabrikası şart. Seviyesi yükseldikçe bina inşa süresi kısalır, gemi üretimi de hızlanır. İnşa süreleri uzadığında Robot Fabrikasını geliştirip süreleri tekrar aşağı çek.</p>
      title: 2. Adım
    '3':
      body: |-
        <p>Bu bölümde gezegenini savunmayı ve ilk filo hareketlerini anlatıyoruz: filo nasıl gönderilir, diğer oyuncularla nasıl başa çıkılır.</p>
        <h3>Galaksi görünümü</h3>
        <p>Diğer oyuncuları bulmak için kullan. Diğer gezegenler hakkında ayrıntıları görür ve filonun bir kısmını doğrudan bu görünümden gönderebilirsin. Oyunculara mesaj atabilir ya da Casus Sondaların varsa bir gezegeni casuslayabilirsin.</p>
        <h3>Filo göndermek</h3>
        <p>Filolar Galaksi görünümünden ya da Filolar menüsünden gönderilebilir. Önce her türden kaç gemi göndereceğini seç. Sonra hedefi (Galaksi görünümündeki koordinatlar) ve hızı belirle. Son olarak Saldır, Konuşlan, Bekle, Geri dönüştür ya da Nakliye gibi bir görev seç.</p>
        <h3>Savunma</h3>
        <p>Tersanen olunca savunma da kurabilirsin. Savunmalar gezegeni korur ve bir saldırı vurduğunda orada bulunan filoyla birlikte savaşır. Gemilerin aksine, yok edilen savunmaların yaklaşık %70'i savaştan sonra onarılır.</p>
      title: 3. Adım
    category: Yeni başlayanlar için ipuçları
  '2':
    '1':
      body: |-
        <h3>Yağma</h3>
        <p>Yağma, kaynaklarını almak için diğer oyunculara saldırmaktır. Yaygın türleri:</p>
        <ul>
        <li>Çiftlik baskını (farm)</li>
        <li>Filo saldırısı</li>
        <li>Enkaz alanı baskını</li>
        <li>Önleme</li>
        </ul>
        <h3>Çiftlik baskını</h3>
        <p>Bir evrende en sık görülen saldırılardır. Yakındaki gezegenleri casuslar, hafif savunmayı aşıp yine de kâr bırakacak kadar kargo ve ateş gücü olan küçük filolar gönderirsin: çalınan kaynaklar, harcanan deuterium ile kendi kayıplarının toplamını aşmalı.</p>
        <h3>Filo saldırısı</h3>
        <p>Yağmanın zirvesi: diğer oyuncuların filolarını avlamak. Casus Sondalarının ve şansın yanı sıra Radar İstasyonu ve iyi zamanlama da önemlidir. Değerli bir filo gördükten sonra onu yakalaman ve enkazı geri dönüştürmen gerekir. Bu çoğu zaman zordur, çünkü kârlı filolar Geri Dönüşümcü kapasiteni aşabilir; o zaman Geri Dönüşümcüleri ve gerekirse İttifak Savaş Sistemi ortaklarını ve savaş filosunu koordine etmen gerekir.</p>
        <h3>Enkaz alanı baskını</h3>
        <p>Kâr etmenin en kolay ve en az sevilen yolu: başka oyuncuların yarattığı enkaz alanlarını toplamak. Enkaz, onu toplayana ait olur; bu yüzden alan çalmak, kötü kan olmasının yaygın bir nedenidir.</p>
        <h3>Önleme</h3>
        <p>Bir filocunun işi filo kurmak ve filo yok etmektir. Boşta duran gemileri her zaman bulamazsın; bu yüzden iyi oyuncuları yakalamak çoğu zaman onları filo kurtarırken ya da saldırıya uçarken önlemek demektir. Bu kolay değil; buna karşı savunma yolları da var.</p>
        <ul>
        <li><p>Ay, önlemeyi kolaylaştırır; çünkü Radar İstasyonu menzildeki gezegenlerdeki filo hareketlerini tarayabilir (aylardakini değil). Yakalamaya değer bir filo bulursan kalan uçuş süresini hesapla - özellikle vardıktan sonraki dönüş süresini. Bir casus raporundaki motor seviyeleri (Yanmalı, İmpuls, Hiperuzay) bunu elle ya da bir uçuş süresi hesaplayıcısıyla hesaplamak için yeterlidir. Hassas bir saat işe yarar. Filonu ve Geri Dönüşümcülerini, hedefin gezegenine ya da ayına onlardan yaklaşık 3-5 saniye sonra varacak şekilde zamanla. Geri Dönüşümcülerin de zamanlanması gerekir.</p></li>
        <li><p>Bir aydan enkaz alanına uçan bir filoyu önlemek için kabaca bir kalkış zamanına ihtiyacın var. Toplayacaklarını düşündüğün yerlerde görünür bir enkaz alanı oluştur (örneğin Casus Sondalarıyla). Filolarının oraya ne kadar sürede varacağını hesapla, sistemi izle ve alan kaybolana kadar yenile. O zamanı not et, dönüş uçuşunu ekle ve filonu ile Geri Dönüşümcülerini bu varıştan birkaç saniye sonraya zamanla.</p>
        <p><b>Not:</b> bu her zaman işe yaramaz. Alanı önceden temizlemesi için öne gönderilen bir Geri Dönüşümcü yaygın bir karşı hamledir.</p></li>
        <li>Başka bir önleme biçimi de bir arkadaşının gezegeninde onu korumak için beklemek; savunan filo çok güçlü olacağı için saldıranlar geri çağırmak zorunda kalır. Bu şekilde yakalanma riskini bir kaçış taramasıyla azaltabilirsin.</li>
        <li><p>Bir oyuncu bir gezegenden diğerine konuşlanıp sonra geri çağırırsa, filo Radar İstasyonundan kaybolur. Kaçış düzenine (ne zaman fırlattığına, ne zaman geri çağırdığına) dikkat et. Geri çağırma beklediğinde gezegeni her saniye radarla tara. Filo kaybolduğu anda zamanı not et, dönüş uçuşunu ekle ve filo ile Geri Dönüşümcülerle yaklaşık 4-6 saniye sonra var.</p>
        <p>Aydan enkaz alanına kaçıyor ve Geri Dönüşümcüleri öne gönderiyorsa, ayı yok etmedikçe önlemek neredeyse imkânsızdır. Yok et görevi ile Ölüm Yıldızları gönder. Ay gittikten sonra filo gezegene döner; o gezegeni radarla tara ve onların birkaç saniye arkasına gir.</p>
        <p>Tüm bu teknikler, hedefin alışkanlıklarını biliyorsan çok daha iyi çalışır - örneğin her akşam 23:00'te kaçış yapması ya da öğlen çevrim içi olması gibi. Önlemeden önce oyuncuyu incele.</p></li>
        </ul>
        <p>Wiki'de daha fazlası: <a href="{wiki_url}/wiki/En/Saven" target="_blank">Filo kurtarma</a>, <a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">Radar İstasyonu</a>.</p>
      title: Yağma
    '2':
      body: |-
        <h3>İSS ile saldırmak</h3>
        <p>Birlikte saldırmak için önce hedefe Saldır görevi ile bir filo gönder. Fırlattıktan sonra Filolar menüsünü aç ve o filoyu bir İSS grubuna çevirmek için Birlik seçeneğini kullan. Orada grubu yeniden adlandırabilir ve diğer oyuncuları davet edebilirsin; saldırıyı başlatan oyuncu otomatik olarak davetlidir. Davet edilen her oyuncu kendi gemilerini İttifak Saldırısı görevi ile aynı koordinatlara gönderir.</p>
        <p>Grup her zaman katılan en yavaş filo kadar uçar. Sonradan katılan daha hızlı filolar kalan süreyi kısaltmaz. Daha yavaş filolar kalan süreyi kendi uçuş sürelerine kadar uzatır. Genellikle bir İSS saldırısına en fazla 5 oyuncu ve 16 filo katılabilir (evren ayarları farklı olabilir). Katılan bir filo kalan uçuş süresini en fazla %30 uzatabilir. 100 dakika kaldıysa, katılan bir filo en fazla 130 dakika sürebilir.</p>
        <p><b>Uyarı:</b> İSS kurucusu geri çağırırsa gruptaki tüm filolar da geri çağrılır.</p>
        <h3>İSS ile savunmak</h3>
        <p>Saldırı altındaysan ittifak üyeleri ve arkadaşların yardım edebilir. Saldırılan koordinatlara bir filo gönderir, ne kadar kalacaklarını seçer ve Bekle görevini kullanırlar. Uçuş deuteriumunun yanı sıra, filo büyüklüğüne ve süreye bağlı ek bekleme maliyeti kalkışta tahsil edilir. Beklerken o gezegen ya da aydaki her savaşa katılır ve casus raporlarında senin gemilerinmiş gibi görünürler. Bekleyişleri saldırgandan hemen önce varacak şekilde zamanla; böylece bir kaçış taramasının onları görme olasılığı düşer. Bekleyen oyuncular Filolar menüsünden istedikleri zaman geri çağırabilir; aksi halde filo bekleme süresini doldurur ve eve döner.</p>
        <h3>1 saatlik bekleme başına deuterium</h3>
        <p>Küçük Nakliye: 5<br>
        Büyük Nakliye: 5<br>
        Hafif Avcı: 2<br>
        Ağır Avcı: 7<br>
        Kruvazör: 30<br>
        Komuta Gemisi: 50<br>
        Koloni Gemisi: 100<br>
        Geri Dönüşümcü: 30<br>
        Casus Sondası: 1/10<br>
        Bombardıman Gemisi: 100<br>
        Muhrip: 100<br>
        Ölüm Yıldızı: 1/10</p>
      title: İttifak Savaş Sistemi
    '3':
      body: |-
        <p>En az 100.000 birimlik bir enkaz alanı oluştuğunda ay doğabilir (%1 ay şansı). Alan ne kadar büyük olursa olsun şans %20'de sınırlanır.</p>
        <h3>Genel</h3>
        <p>Aylar gezegenler gibi yeniden adlandırılabilir ama “(Ay)” adın içinde kalır. Gezegen başına en fazla bir aya sahip olabilirsin. Ay, filonu Radar İstasyonunun gözünden uzakta kurtarmanı sağlar; bu yüzden nispeten erken kurmaya değer. Ayda Robot Fabrikası, Tersane, Metal Deposu, Kristal Deposu, Deuterium Deposu, İttifak Deposu, Ay Merkez İstasyonu, Radar İstasyonu ve Sıçrama Geçidi inşa edebilirsin.</p>
        <h3>Ay atışı</h3>
        <p>Ay atışı, enkaz alanı oluşturmak için gemileri bilerek yok ettirmektir. Genellikle Hafif Avcılar seçilir: filonun %30'u ve savunmanın %0'ı enkaza dönüşürken, 1.667 Hafif Avcı %20 ay şansı verir. Kaybetmesi ucuzdur ve sınıra çok yakın düşer. Daha güçlü bir oyuncu daha zayıf bir oyuncuya ait Hafif Avcıları yok ederse enkazı herkes toplayabilir. Daha zayıf bir oyuncu, ölmesi için hazırladığı gemilerle daha güçlüye saldırırsa enkazı yalnızca zayıf olan toplayabilir - aksi halde bu push sayılır. Aylar ve ay denemeleri push kurallarına tabidir.</p>
        <p>Savunmanın da enkaz yarattığı bir evrende, savunma kurup onu birkaç dalgada yok ettirerek birkaç ay denemesi yapmak çoğu zaman daha iyidir. 3.334 Roketatar ya da 3.334 Hafif Lazer yaygın bir seçimdir.</p>
        <p>Bir ay oluştuğunda savaş raporu, muazzam miktardaki serbest metal ve kristalin birbirini çekip gezegenin çevresinde bir uydu oluşturduğunu söyler.</p>
        <p>%1 ile %19 arası ay şansı: rastgele boyut. %20 ay şansı: 8.000 km üzeri çap. Bir ay asla 8.944 km'den büyük olmaz.</p>
        <h3>Binalar</h3>
        <p>Depoları ayda kurmaya genellikle değmez, çünkü orada hiçbir şey üretilmez. Tersane de nadiren işe yarar: inşa süreleri uzundur ve gemileri gezegende de yapabilirsin. İttifak Deposu tartışmalıdır; değerli alanları da kaplar.</p>
        <p>Yalnızca aya özgü üç bina şunlar:</p>
        <ul>
        <li><p><b>Ay Merkez İstasyonu</b><br>İnşa edilebilir alan ekler: seviye başına 3, bunlardan biri sıradaki Ay Merkez İstasyonu yükseltmesine gider.</p></li>
        <li><p><b>Radar İstasyonu</b><br>Düşman gezegenlerindeki (aylardaki değil) filo hareketlerini gösterir. Menzili her seviyeyle artar.</p></li>
        <li><p><b>Sıçrama Geçidi</b><br>Gemileri bir aydan diğerine anında taşır. Kaynaklar onlarla gidemez. Atlamadan sonra geçidin soğuması gerekir (genellikle bir saat), yoksa aşırı ısınır.</p></li>
        </ul>
        <p>Yaygın bir ay inşa sırası:<br>
        <b>Açıklama:</b><br>
        AMİ - Ay Merkez İstasyonu<br>
        Rİ - Radar İstasyonu<br>
        SG - Sıçrama Geçidi<br>
        RF - Robot Fabrikası</p>
        <p>AMİ1 - RF1 - RF2 - AMİ2 - Rİ1 - RF3 - AMİ3 - Rİ2 - RF4 - AMİ4 - Rİ3 - RF5 - AMİ5 - Rİ4 - RF6 - AMİ6 - Rİ5 - Rİ6 - AMİ7 - Rİ7 - Rİ8 - AMİ8 - SG1<br>
        Bundan sonra kaynakların varsa Radar İstasyonunu geliştirmeye devam edebilirsin. Robot Fabrikasının bazı seviyelerini yıkıp bu alanları radara da verebilirsin.</p>
        <h3>Yok etme</h3>
        <p>Bir ay yalnızca Ölüm Yıldızlarıyla yok edilebilir. Görev menüsünde Saldır yerine Yok et'i seç. Ayda bulunan filo önce yok edilmelidir; hayatta kalan Ölüm Yıldızları, ayın kendisi yok edilirken yine de kaybedilebilir. Ay yok etme enkaz alanı oluşturmaz.</p>
        <h3>Ölüm Yıldızı ile ay saldırıları</h3>
        <p>Ayı yok etme şansı: (100 - karekök(ay boyutu)) × karekök(Ölüm Yıldızı sayısı). Saldıran Ölüm Yıldızlarının yok olma şansı: karekök(ay boyutu) / 2. Büyük aylar yok etmek için daha risklidir.</p>
        <h3>Ay şansı ve boyutu</h3>
        <p>100.000 enkaz birimi %1 ay şansı verir. En yüksek şans: %20. Sonradan yapılan bir değişiklikle her ay, inşa edilebilir en yüksek alan sayısına (79) sahiptir. Eskiden bu TABAN((çap / 1000)²) idi. Mümkün olan en büyük ay: 8.944 km çap, 79 alan.</p>
        <p>Wiki'de daha fazlası: <a href="{wiki_url}/wiki/En/Mond" target="_blank">Aylar</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>
      title: Aylar
    '4':
      body: |-
        <h3>Nasıl ittifak kurarım?</h3>
        <p>Soldaki menüden İttifak'ı aç, sonra Kendi ittifakını kur'a tıkla. Bir ittifak etiketi (kısa kısaltma) ve bir ittifak adı gir. Örnek: “Üst Müttefikler” adlı bir ittifak “ÜM” etiketini kullanabilir.</p>
        <p>Yalnızca harf, rakam ve boşluk kullanılabilir. Etiketi ve adı girdikten sonra Kur'a tıkla. Bu ad ya da etiket zaten alınmışsa hata alırsın ve başka bir tane seçmen gerekir. Başarılı olursa bir onay görürsün; Devam et, henüz boş olan ittifak menünü açar; ona her zaman soldaki menüde İttifak'tan ulaşabilirsin. En üstte etiketini ve adını görürsün.</p>
        <p>Altında şunları bulursun:<br>
        Üyeler: her üye, puanı, ana gezegen koordinatları, katılma tarihi ve çevrim içi durumuyla. Sıralamak için sütun başlıklarına tıkla.<br>
        Rütben: rütbe adın ve ittifak yönetimine giden bir bağlantı.<br>
        Toplu mesajlar: tüm ittifaka ya da seçili rütbelere mesaj gönder.</p>
        <h3>İttifak yönetimi</h3>
        <p>Rütbeler bölümünde her rütbe için yetkileri ayarlarsın; örneğin ittifakı dağıtmak ya da toplu mesaj göndermek. Üyeler bölümünde oyuncuları atabilir, rütbe verebilir ve kaç gündür çevrim dışı olduklarını görebilirsin. İttifak etiketini ve adını da değiştirebilirsin.</p>
        <p>Metin yönetimi ittifak metinlerini düzenler. Dış metin her oyuncuya görünür; iç metin yalnızca üyelere. Başvuru metni, başvuracak kişiler için bir şablondur.</p>
        <p>Seçenekler bölümünde bir afiş görseli ve bir ittifak forumu bağlayabilir, başvuruların açık olup olmayacağını seçebilir ve kurucu rütbesinin adını belirleyebilirsin. Boş bırakırsan rütbe Kurucu olur.</p>
        <p>İttifakı dağıtabilir ya da başka bir üyeye devredebilirsin; o üye kurucu olur.</p>
      title: İttifaklar
