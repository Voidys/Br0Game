op_activate_vacation_mode: Activar modo vacaciones
op_activate_vacation_mode_confirm: >-
  El modo vacaciones no se puede volver a desactivar durante 48 horas. ¿Está
  seguro?
op_activate_vacation_mode_descrip: >-
  El modo Vacaciones está diseñado para protegerte durante largos periodos de
  ausencia. Sólo puede activarse cuando no hay flotas propias en movimiento.
  Cuando se activa, te protege de nuevos ataques. Sin embargo, los ataques que
  ya hayan comenzado continuarán y las flotas amigas que estén aguantando ¡serán
  enviadas de vuelta! La producción de recursos, la construcción de edificios y
  pedidos de astilleros así como la investigación se pausan durante este tiempo
  y se reanudarán después. El modo de vacaciones dura al menos 48 horas, tras
  las cuales podrás desactivarlo de nuevo.
