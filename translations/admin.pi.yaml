se_noob_protection_multi: Noobschutzfaktor
se_noob_protection_multi_info: >-
  Sie können nur Benutzer angreifen, deren Punkte zwischen Ihren Punkten *
  (Betrag) liegen, zum Beispiel *18. Das heißt, wenn Sie 1000 Punkte haben,
  können Sie Benutzer mit weniger als 18000 Punkten angreifen, oder, wenn Sie
  50000 Punkte haben, können Sie von Benutzern angegriffen werden, in deren
  Reichweite Sie Punkte eingeben, z. B. wenn ein Feind oder ein neutraler
  Benutzer 20000 Punkte hat, * 18 ist 360000, Sie befinden sich also in ihrer
  Reichweite und du kannst von ihm angegriffen werden
