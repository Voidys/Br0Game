registerWelcomePMText: Bem-vindo a %s! Começa por construir uma Planta de Energia Solar, porque é preciso energia para produzir recursos. Abre Edifícios no menu da esquerda e começa pela Planta de Energia Solar.<br>Quando tiveres energia, podes construir minas. Continua em Edifícios e constrói uma Mina de Metal e depois uma Mina de Cristal.<br><br>Para construir naves precisas de um Hangar. O menu Tecnologias, à esquerda, mostra o que é preciso para o desbloquear.<br>Se tiveres mais dúvidas, consulta a FAQ, a wiki, ou abre um pedido de suporte.<br><br>A equipa deseja-te muita diversão a explorar o universo!
