home_meme_alt: "Meme de banda desenhada do posto de comando de {game_name}"
home_meme_alt_deep_space_transit: "Banda desenhada: dois cadetes numa nave – um desanima ao ver um campo de asteroides, o outro sorri para uma nebulosa brilhante. «Patrulhas de setor normais vs. encontrar uma nebulosa inexplorada e rica em recursos.»"
home_meme_alt_deuterium_joyride: "Banda desenhada: um comandante cansado no deck de observação vê dois recrutas a flutuar lá fora – «Ver os novos recrutas a gastar todo o deutério em passeios enquanto eu espero 12 horas pelas melhorias das minas.»"
home_meme_alt_enemy_fleet: "Banda desenhada: um cadete agarra a cabeça em pânico enquanto os alarmes piscam – «1000 destruidores inimigos a caminho?! Pensei que este setor era seguro?!»"
home_meme_alt_fleet_decimated: "Banda desenhada: um soldado em choque olha em frente enquanto naves explodem atrás da cúpula destruída – «Quando passas 20 horas a recolher recursos e a frota de um jogador do top 3 aparece e desmonta tudo em 3 segundos.»"
home_meme_alt_solo_scouting: "Banda desenhada: o comandante Kamioka sorri e pousa uma mão robótica no ombro de um cadete – «Não te preocupes, cadete. O Alto Comando tem confiança ‘total’ na tua missão de reconhecimento a solo no espaço.»"
home_meme_alt_this_is_fine: "Banda desenhada: um cão em fato espacial está sentado calmamente num centro de comando em chamas e diz «This is fine» – «Não te preocupes. A minha frota só volta com 4 horas de atraso.»"
