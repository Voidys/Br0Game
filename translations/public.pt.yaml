registerWelcomePMText: >-
  Welcome to %s! First build a solar power plant,because energy is needed for
  the production of raw materials. To build one, left click in the menu on
  "buildings". Then build the 4th Building from the top. </br> When you have
  energy, you can begin to build mines. Go to buildings on the menu and build a
  metal mine, followed by a crystal mine. </br></br>In order to be able to build
  ships you need to have a shipyard. To see what is needed to unlock that
  building you can take a look at "Technologies" at the left menu.</br>If you
  more questions you can look at the beginnersguide, our forum or open a support
  ticket. </br></br> The team wishes you much fun exploring the universe!
