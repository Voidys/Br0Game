bonus:
  Attack: вооружения.
  BuildTime: времени строительства.
  Defensive: брони космических кораблей.
  DefensiveTime: времени постройки обороны.
  Energy: выработки энергии.
  Expedition: одновременных экспедиций.
  FleetSlots: слота для полётов кораблей.
  FlyTime: времени полёта кораблей.
  GateCoolTime: времени перезарядки телепорта.
  MoreFound: находок в экспедициях.
  Planets: планеты.
  ResearchTime: времени проведения исследований.
  Resource: добычи ресурсов.
  ResourceStorage: вместимости хранилищ.
  Shield: мощности щитов.
  ShipStorage: вместимости кораблей.
  ShipTime: времени постройки кораблей.
  SpyPower: мощности шпионажа.
longDescription:
  '1': Рудники металла добывают руду, на которой строится любая империя — и молодая, и закалённая в боях.
  '2': Кристалл — ключевой компонент электронных схем и некоторых сплавов.
  '3': Дейтерий — топливо для твоих кораблей. Его добывают в морских глубинах. Вещество редкое, поэтому довольно дорогое.
  '4': Солнечные электростанции превращают солнечный свет в энергию. Любому руднику нужна энергия для работы.
  '6': По умолчанию каждый уровень сокращает время исследований на 8%.
  '12': Термоядерная электростанция вырабатывает энергию, сплавляя дейтерий. Она даёт больше энергии, чем Солнечная электростанция, но и стоит дороже. Выработка растёт с Энергетической технологией и с уровнем самой станции. Формула выработки энергии:<br> Энергия = 30 × уровень Термоядерной электростанции × (1,05 + (0,01 × уровень Энергетической технологии))^уровень Термоядерной электростанции
  '14': Фабрики роботов поставляют строительных роботов, которые помогают возводить постройки. Каждый уровень ускоряет улучшение построек.
  '15': Вершина робототехники. Каждый уровень вдвое сокращает время строительства построек, кораблей и обороны.
  '21': Все корабли и оборонительные сооружения строятся на планетарной Верфи.
  '22': Хранилище для излишков металла.
  '23': Хранилище для излишков кристалла.
  '24': Хранилище для излишков дейтерия.
  '31': Чтобы исследовать новые технологии, нужна Исследовательская лаборатория. Её уровень определяет скорость исследований и то, какие технологии тебе доступны. Исследование идёт в лаборатории той планеты, где ты его запустил, а результат действует на все твои планеты. Пока идёт исследование, ни одну Исследовательскую лабораторию улучшить нельзя.
  '33': "Терраформер расширяет пригодную для застройки площадь планеты. Каждый уровень даёт 5 дополнительных полей, плюс ещё одно поле на каждом чётном уровне. Каждый уровень Терраформера сам занимает одно поле.<br>Для строительства нужна энергия, но она не расходуется: твоей планете достаточно её вырабатывать (1 000 для 1 уровня, с каждым уровнем вдвое больше), даже если шахты уже её используют. Построенный Терраформер нельзя снести."
  '34': "Склад альянса в этой игре сейчас ни на что не влияет: дружественные флоты могут держаться на твоей планете и без него, а дозаправки топливом нет."
  '35': Ремонтный док может чинить корабли, которые были уничтожены в бою и оставили поле крушения. Ремонт занимает не более 12 часов и не может закончиться раньше, чем через 30 минут после появления поля крушения.<br>После появления поля крушения у тебя есть 3 дня, чтобы начать ремонт. Когда ремонт закончен, корабли нужно вернуть в строй самому. Если этого не сделать, они вернутся в строй автоматически через 3 дня.
  '41': На Луне нет атмосферы, а на новой луне хватает места лишь для одной постройки — так что начни с Лунной базы. Каждый уровень даёт 3 дополнительных поля и сам занимает одно поле. Построенную Лунную базу нельзя снести.
  '42': "Сенсорная фаланга позволяет следить за движением флотов. Чем выше уровень, тем больше радиус действия: по умолчанию (уровень фаланги)^2 − 1 систем, так что уровень 1 покрывает только систему самой луны. Одно сканирование стоит 5 000 дейтерия, который должен лежать на луне. Чтобы просканировать, открой Галактику с луны и нажми на планету в радиусе действия. Сами луны фалангой сканировать нельзя — у них нет атмосферы.<br><br>Фаланга показывает флоты, которые стартуют с сканируемой планеты или летят к ней: когда они прибудут, когда закончится удержание и когда флоты владельца вернутся домой. Размещения и ракеты не показываются, как и полёты переработчиков и торговых флотов к этой планете."
  '43': "Телепорты — гигантские передатчики, которые мгновенно перебрасывают большие флоты через всю вселенную. Дейтерий они не расходуют, но перевозить ресурсы так нельзя. Оба телепорта должны быть готовы: после прыжка каждому нужна перезарядка — по умолчанию 60 минут на 1 уровне, и с каждым уровнем она сокращается, до 10 минут начиная с 15 уровня."
  '44': В Ракетных шахтах хранятся твои ракеты. По умолчанию каждый уровень добавляет 10 слотов. Ракета-перехватчик занимает 1 слот, Межпланетная ракета — 2.
  '106': "Эта технология позволяет собирать сведения о других планетах и лунах. Когда ты отправляешь зонды, твой уровень Шпионажа сравнивается с уровнем цели: чем он выше, тем больше информации в докладе и тем ниже шанс обнаружения зондов. Больше зондов — больше подробностей, но и выше риск обнаружения. На некоторых уровнях Шпионажа ты также узнаёшь больше о чужих флотах на экране «Обзор»:<br><br><li>На уровне 0-1 видно лишь, что флот приближается к твоей планете</li><li>На уровнях 2-3 видно, сколько кораблей приближается</li><li>На уровнях 4-7 видно, какие типы кораблей во флоте</li><li>На уровне 8+ видно, сколько кораблей каждого типа во флоте</li>"
  '108': Мощные компьютеры позволяют командовать большим числом флотов. Каждый уровень Компьютерной технологии увеличивает максимальное число флотов на один.
  '109': Оружейная технология повышает эффективность систем вооружения. Каждый уровень увеличивает силу оружия всех юнитов на 10% от базового значения.
  '110': Щитовая технология усиливает щиты кораблей и оборонительных сооружений. Каждый уровень увеличивает мощность щитов на 10% от базового значения.
  '111': Специальные сплавы улучшают броню кораблей и оборонительных сооружений. Каждый уровень повышает эффективность брони на 10%.
  '113': Умение обращаться с разными видами энергии — ключ ко многим новым технологиям. Каждый уровень Энергетической технологии также увеличивает выработку Термоядерной электростанции.
  '114': Объединив 4-е и 5-е измерения, можно создать новый тип двигателя — более экономичный и эффективный.
  '115': "Развитие этого двигателя ускоряет некоторые корабли, но каждый уровень добавляет лишь 10% от базовой скорости. Затрагивает: Малый транспорт, Большой транспорт, Лёгкий истребитель, Переработчик и Шпионский зонд (Малый транспорт и Переработчик позже переходят на более мощные двигатели)."
  '117': "Импульсный двигатель работает по реактивному принципу. Его развитие ускоряет некоторые корабли, но каждый уровень добавляет лишь 20% от базовой скорости. Затрагивает: Бомбардировщик, Крейсер, Тяжёлый истребитель и Колонизатор, а также Малый транспорт и Переработчик, когда они переходят на этот двигатель. Кроме того, с каждым уровнем Межпланетные ракеты летят дальше."
  '118': "Гиперпространственный двигатель искривляет пространство вокруг корабля. Его развитие ускоряет некоторые корабли, но каждый уровень добавляет лишь 30% от базовой скорости. Затрагивает: Линейный крейсер, Линкор, Уничтожитель, Звезда смерти, Сверхновая звезда, Улучшенный транспорт, Аватар и Мега переработчик, а также Бомбардировщик и Переработчик, когда они переходят на этот двигатель. Требуются Гиперпространственная технология (уровень 3) и Исследовательская лаборатория (уровень 7)."
  '120': Сфокусированный свет даёт луч, который повреждает всё, во что попадает. Требуются Исследовательская лаборатория (уровень 1) и Энергетическая технология (уровень 2).
  '121': Смертоносный луч ускоренных ионов, который при попадании наносит огромный урон.
  '122': "Дальнейшее развитие ионной технологии: ускоряется высокоэнергетическая плазма, получаемая перегревом ионов. При попадании она оказывает разрушительное действие."
  '123': Через эту сеть общаются исследователи с разных планет. Каждый уровень позволяет подключить к лаборатории, где ты запускаешь исследование, ещё одну лабораторию. Выбираются лаборатории с самыми высокими уровнями, и подключаемая лаборатория должна быть достаточно развита, чтобы провести это исследование самостоятельно. Их уровни складываются при расчёте времени исследования.
  '124': "Астрофизика открывает колонизацию и экспедиции в глубокий космос. Лимит колоний, время удержания и позиции ниже указаны для настроек по умолчанию; во вселенной они могут отличаться.<br><br> <li>Лимит колоний</li> Уровень 1-2 = 2 планеты<br> Уровень 3-4 = 3 планеты<br> Уровень 5-6 = 4 планеты<br> Уровень 7-8 = 5 планет<br> Уровень 9-10 = 6 планет<br> Уровень 11-12 = 7 планет<br> Уровень 13-14 = 8 планет<br> Уровень 15-16 = 9 планет<br> Уровень 17-18 = 10 планет<br> Уровень 19-20 = 11 планет<br> Уровень 21+ = 12 планет<br><br> <li>Слоты экспедиций</li> Уровень 1-3 = 1 экспедиция<br> Уровень 4-8 = 2 экспедиции<br> Уровень 9-15 = 3 экспедиции<br> Уровень 16-24 = 4 экспедиции<br>(ещё одна на каждом следующем квадратном уровне: 25, 36, ...)<br><br> <li>Время удержания в экспедиции</li> Уровень = максимальное время удержания в часах<br><br> <li>Позиции для колонизации</li> Уровень 1-3 = 4-12<br> Уровень 4-5 = 3-13<br> Уровень 6-7 = 2-14<br> Уровень 8+ = 1-15"
  '131': Увеличивает добычу металла на 2% за уровень.
  '132': Увеличивает добычу кристалла на 2% за уровень.
  '133': Увеличивает добычу дейтерия на 2% за уровень.
  '134': Снижает расходы на полёты на 2% за уровень.
  '199': Выстрел концентрированным зарядом гравитонов создаёт искусственное гравитационное поле, способное уничтожать корабли и даже луны. Требуется Исследовательская лаборатория (уровень 12).
  '202': Малый транспорт — манёвренный корабль, который быстро доставляет ресурсы на другие планеты.<br>Он летает на реактивном двигателе, пока Импульсный двигатель не достигнет 5 уровня. После этого он переходит на импульсный двигатель, который вдвое увеличивает его базовую скорость.
  '203': Этот грузовой корабль вмещает гораздо больше Малого транспорта и обычно быстрее благодаря улучшенному двигателю.
  '204': Первый боевой корабль, который строит каждый император. Лёгкий истребитель манёвренный, но в одиночку уязвим; в большом количестве он становится реальной угрозой для любой империи. Лёгкие истребители первыми сопровождают Малые и Большие транспорты к вражеским планетам со слабой обороной.
  '205': Этот истребитель лучше бронирован и бьёт сильнее Лёгкого истребителя.
  '206': У Крейсеров почти втрое больше брони, чем у Тяжёлых истребителей, и более чем вдвое больше огневой мощи. Кроме того, они очень быстрые.
  '207': Линкоры — становой хребет флота. Тяжёлые орудия, высокая скорость и большие грузовые отсеки делают их серьёзными противниками.
  '208': "Этот хорошо бронированный корабль завоёвывает новые планеты, которые нужны растущей империи. На новой колонии корабль разбирается, и весь пригодный материал идёт на развитие нового мира. Сколько планет ты сможешь колонизировать, напрямую зависит от Астрофизики: первый уровень и каждый второй после него открывают ещё одну колонию (по умолчанию)."
  '209': Переработчик добывает сырьё из полей обломков. Его грузоподъёмность — 20 000. Сначала он летает на реактивном двигателе, переходит на импульсный, когда Импульсный двигатель достигнет 17 уровня, и на гиперпространственный, когда Гиперпространственный двигатель достигнет 15 уровня.
  '210': Шпионские зонды — маленькие манёвренные дроны, которые доставляют данные о флотах и планетах на большие расстояния.
  '211': Бомбардировщик создан специально для уничтожения планетарной обороны.<br>Он летает на импульсном двигателе и переходит на гиперпространственный, когда Гиперпространственный двигатель достигнет 8 уровня.
  '212': Солнечные спутники — простые платформы из солнечных элементов на высокой стационарной орбите. Они собирают солнечный свет и передают его лазером на наземную станцию.
  '213': "Уничтожитель — король боевых кораблей. Против Лёгких лазеров у него скорострел: после каждого попадания он получает ещё один выстрел в 9 случаях из 10."
  '214': Разрушительной силе Звезды смерти нет равных, и она способна уничтожать луны.
  '215': Линейный крейсер специализируется на перехвате вражеских флотов.
  '216': "Преемник популярной Звезды смерти: намного быстрее и прочнее, с огромным грузовым отсеком, но бьёт чуть слабее."
  '217': Развитие Большого транспорта с гораздо большей грузоподъёмностью. Работает на гиперпространственном двигателе, поэтому на старте медленнее Большого транспорта, но по мере прокачки Гиперпространственного двигателя вырывается вперёд.
  '218': Худший из возможных кошмаров, пусть и очень медленный.
  '219': Огромный грузовой отсек и новые двигатели позволяют летать быстрее и собирать с полей обломков больше.
  '220': "Стальной Колосс — настоящая крепость в космосе, защищённая непробиваемыми барьерами и массивной бронёй. Даже самые яростные атаки отскакивают от него, пока он неумолимо движется вперёд. Но за превосходную защиту приходится платить: вооружение почти не стоит упоминания, а неповоротливые двигатели делают его медлительным великаном. Вместо молниеносных ударов и ловких манёвров корабль полагается на чистую стойкость. Чтобы остановить его, нужна огромная выдержка — или подавляющая огневая мощь."
  '221': "Штормовой Клинок — истребитель высшего класса: невероятно быстрый и безжалостно вооружённый. Противники едва успевают его заметить, как он уже наносит удар. Защита для него вторична: зачем выдерживать то, от чего можно просто уйти? Его единственная цель — флоты транспортов и переработчиков, которые уничтожаются без сопротивления. Благодаря бешеной скорости он бьёт когда захочет и исчезает до прихода подкрепления. У того, кого выбрал Штормовой Клинок, почти нет шансов уйти."
  '222': Тяжёлый Крейсер — усиленная эволюция обычного Крейсера. С улучшенными щитами и мощным оружием он может устоять против неповоротливых врагов. Лучше всего он раскрывается вместе со Стальными Колоссами, Уничтожителями и Бомбардировщиками, где его огневая мощь проявляется в полную силу. Но, несмотря на силу, он остаётся медленным и менее манёвренным.
  '223': Дрон Щита — новый подход к защите флота, в первую очередь направленный на безопасность экипажа. Инновационные, но тяжёлые щитовые технологии значительно снизили скорость и манёвренность. Несмотря на плохие скорость и ловкость, в обороне он очень эффективен. Устаревший корпус доведён до предела, чтобы обеспечить почти непробиваемую защиту.
  '224': Импровизированный Штурмовой Транспорт — непроверенный транспортный корабль с минимальным вооружением, созданный специально, чтобы тревожить беспечных и неподготовленных соседей. Эта самодельная машина не рассчитана на долгое использование, а предназначена для быстрых импульсивных атак, вызывающих мгновенную реакцию. Соседский конфликт практически гарантирован, как только её применят. С ограниченным оснащением и непредсказуемым нравом она становится опасным инструментом быстрой эскалации.
  '225': Штормовой Транспорт — настоящее чудо техники, идеальный баланс боевой мощи, скорости и грузоподъёмности. Он быстро доставляет войска и ресурсы, да ещё и выдаёт впечатляющую огневую мощь на поле боя — потому и стал неотъемлемой частью любого сильного флота. Для быстрых штурмовых групп или поддержки длительных операций Штормовой Транспорт — ключ к эффективной войне и абсолютная необходимость для любого флота.
  '226': Колоссальный Боевой Транспорт — вершина инженерной мысли. Несмотря на слегка громоздкий корпус и вытекающую отсюда невысокую скорость, это самый тяжело бронированный боевой транспорт, который когда-либо видел любой флот. Его подавляющая огневая мощь делает его неудержимой силой на поле боя. Этот гигант без труда прорывает вражеские линии, обеспечивая экипажу максимальную защиту. Он воплощает силу и стойкость, а значит, незаменим для любого хорошо вооружённого флота.
  '227': Оптимизированный Переработчик — передовая версия стандартного Переработчика. Мощный импульсный двигатель позволяет ему быстрее и дешевле добираться до полей обломков, поэтому он нужен любому развитому флоту. Оптимизированная конструкция снижает стоимость постройки и повышает эффективность сбора ресурсов. Доступен со средней стадии игры и даёт стратегическое преимущество любой растущей империи.
  '228': "Омега-Ресайклер — вершина технологий переработки, но дорогой ценой. Мощный гиперпространственный двигатель позволяет ему добираться до полей обломков в рекордные сроки и собирать ресурсы быстрее любого другого корабля. Но скорость достаётся ценой эффективности: постройка и топливо стоят огромных денег, так что это вариант только для богатых командиров на поздней стадии игры. Для тех, кто ценит скорость выше стоимости, это идеальный Переработчик."
  '401': Ракетная установка — простое, но выгодное средство обороны. После боя в среднем около 70% уничтоженных оборонительных сооружений восстанавливается.
  '402': Лёгкие лазеры — простые наземные орудия. Специальные системы наведения отслеживают врага, а мощный лазер прорезает корпус цели. После боя в среднем около 70% уничтоженных оборонительных сооружений восстанавливается.
  '403': Тяжёлый лазер — практичная улучшенная версия Лёгкого лазера. После боя в среднем около 70% уничтоженных оборонительных сооружений восстанавливается.
  '404': Пушка Гаусса выстреливает плотными металлическими снарядами с огромной скоростью. После боя в среднем около 70% уничтоженных оборонительных сооружений восстанавливается.
  '405': Ионное орудие стреляет лучами ионов (положительно или отрицательно заряженных частиц). После боя в среднем около 70% уничтоженных оборонительных сооружений восстанавливается.
  '406': Плазменное орудие использует топливный элемент большого ядерного реактора, чтобы питать электромагнитный ускоритель, выпускающий импульсы плазмы (тороиды). После боя в среднем около 70% уничтоженных оборонительных сооружений восстанавливается.
  '407': Малый щитовой купол накрывает всю планету полем, которое поглощает огромное количество энергии. На одной планете можно построить только один.
  '408': Большой щитовой купол — дальнейшее развитие, которому для сдерживания атак нужно заметно больше энергии. На одной планете можно построить только один.
  '409': Эволюция технологии щитовых куполов. Потребляет намного больше энергии, но выдерживает больше атак, чем любой другой щит. На одной планете можно построить только один.
  '410': "После многих лет изучения гравитации учёные создали Гравитонное орудие: оно генерирует небольшое концентрированное гравитонное поле и выстреливает им во врага."
  '411': Неподвижная оборонительная платформа без собственной тяги, которую гравитация удерживает на стабильной орбите вокруг планеты. Для запуска этого процесса нужно огромное количество энергии. На одной планете можно построить только один.
  '412': Бункер — тяжело укреплённое сооружение, способное выдержать даже самые мощные атаки. Он обеспечивает непревзойдённую защиту жителям планеты и важнейшей инфраструктуре и служит краеугольным камнем планетарной обороны.
  '413': Titan Laser — колоссальное орудие непревзойдённой разрушительной силы.
  '414': Приманка — хитрая оборонительная система, призванная сбивать с толку и дезориентировать врага. Маскируясь под Ракетную установку, она отпугивает нападающих.
  '502': Ракеты-перехватчики уничтожают летящие на тебя Межпланетные ракеты. На каждую Межпланетную ракету нужна одна Ракета-перехватчик.
  '503': Межпланетные ракеты уничтожают оборону противника, если их не сбивают Ракеты-перехватчики. Оборона, уничтоженная таким образом, не восстанавливается. По умолчанию их дальность (в солнечных системах) зависит от уровня Импульсного двигателя:<br>Дальность = (5 × уровень Импульсного двигателя) − 1
  '901': Металл — главный ресурс для построек и кораблей. Он самый дешёвый, но и нужен больше всего; как и кристалл, он требует меньше всего энергии. Чем больше шахты, тем глубже они уходят в землю.
  '902': Кристалл — главный ресурс для электронных схем и некоторых сплавов. Его добывают в подземных шахтах, где сырьё сразу превращается в схемы.
  '903': Дейтерий находится в самых глубоких морях и относится к редчайшим ресурсам вселенной. Чтобы добыть его, нужно добраться до морского дна, поэтому это самый дорогой ресурс.
  '911': Энергия нужна для добычи любого ресурса.
  '229': Созданная, чтобы сломить господство Ксеров, Гадюка — совершенное оружие против Лёгких истребителей, Тяжёлых истребителей и Крейсеров. Скорострельные пушки и передовые технологии меняют баланс сил во вселенной.
  '230': Быстрый. Точный. Неуловимый. Перехватчик создан не для честных боёв — он наносит быстрый и мощный удар и за мгновение даёт подавляющее преимущество.
  '231': Бегемот — результат десятилетий исследований гравитонов, превращённых в неумолимую боевую платформу. В отличие от Звёзд смерти, он создан не для уничтожения планет, а для максимальной эффективности на поле боя. Отказавшись от энергоёмких систем, нужных для разрушения лун, конструкцию значительно облегчили, получив более мощные двигатели, большую манёвренность и усиленное вооружение. Компактное гравитонное орудие превращает его в мобильную машину разрушения, способную в одиночку уничтожать даже огромные флоты.
  '232': "Титан Пустоты — вершина современных гравитонных технологий. Каждая деталь его конструкции служит единственной цели: быстрому уничтожению вражеских лун. Обычные орудийные башни намеренно убрали, чтобы снизить массу и освободить место для колоссальных кристаллических генераторов. Они питают самые совершенные ускорительные катушки, когда-либо построенные в известных галактиках, и дают кораблю непревзойдённую подвижность. Огромная потребность в кристалле делает каждый Титан Пустоты монументальным промышленным достижением и символом безграничной разрушительной силы."
secureResources: Каждый уровень хранилища защищает от разграбления во время атак 1% суточной добычи этого ресурса, но не более 10%.
shortDescription:
  '1': Рудники металла добывают руду, на которой строится любая империя — и молодая, и закалённая в боях.
  '2': Кристалл — ключевой компонент электронных схем и некоторых сплавов.
  '3': Дейтерий — топливо для твоих кораблей. Его добывают в морских глубинах. Вещество редкое, поэтому довольно дорогое.
  '4': Солнечные электростанции превращают солнечный свет в энергию. Любому руднику нужна энергия для работы.
  '6': По умолчанию каждый уровень сокращает время исследований на 8%.
  '12': Термоядерная электростанция получает энергию, сплавляя ядра дейтерия.
  '14': Фабрики роботов поставляют строительных роботов, которые помогают возводить постройки. Каждый уровень ускоряет улучшение построек.
  '15': Вершина робототехники. Каждый уровень вдвое сокращает время строительства построек, кораблей и обороны.
  '21': Все корабли и оборонительные сооружения строятся на планетарной Верфи.
  '22': Хранилище для излишков металла.
  '23': Хранилище для излишков кристалла.
  '24': Хранилище для излишков дейтерия.
  '31': Чтобы исследовать новые технологии, нужна Исследовательская лаборатория.
  '33': "Терраформер расширяет пригодную для застройки площадь планеты: по 5 дополнительных полей за уровень и ещё одно поле на каждом чётном уровне. Каждый уровень сам занимает одно поле."
  '34': Склад альянса в этой игре сейчас ни на что не влияет.
  '35': Ремонтный док восстанавливает корабли из поля крушения.
  '41': На Луне нет атмосферы, а на новой луне хватает места лишь для одной постройки — так что начни с Лунной базы.
  '42': Сенсорная фаланга позволяет следить за движением флотов. Чем выше уровень, тем больше радиус действия фаланги.
  '43': Телепорты — гигантские передатчики, которые мгновенно перебрасывают большие флоты через всю вселенную.
  '44': В Ракетных шахтах хранятся твои ракеты.
  '106': Эта технология позволяет собирать сведения о других планетах и лунах.
  '108': Мощные компьютеры позволяют командовать большим числом флотов. Каждый уровень Компьютерной технологии увеличивает максимальное число флотов на один.
  '109': Оружейная технология повышает эффективность систем вооружения. Каждый уровень увеличивает силу оружия всех юнитов на 10% от базового значения.
  '110': Щитовая технология усиливает щиты кораблей и оборонительных сооружений. Каждый уровень увеличивает мощность щитов на 10% от базового значения.
  '111': Специальные сплавы улучшают броню кораблей и оборонительных сооружений. Каждый уровень повышает эффективность брони на 10%.
  '113': Умение обращаться с разными видами энергии — ключ ко многим новым технологиям.
  '114': Объединив 4-е и 5-е измерения, можно создать новый тип двигателя — более экономичный и эффективный.
  '115': Развитие этого двигателя ускоряет некоторые корабли, но каждый уровень добавляет лишь 10% от базовой скорости.
  '117': Импульсный двигатель работает по реактивному принципу. Его развитие ускоряет некоторые корабли, но каждый уровень добавляет лишь 20% от базовой скорости.
  '118': Гиперпространственный двигатель искривляет пространство вокруг корабля. Его развитие ускоряет некоторые корабли, но каждый уровень добавляет лишь 30% от базовой скорости.
  '120': Сфокусированный свет даёт луч, который повреждает всё, во что попадает.
  '121': Смертоносный луч ускоренных ионов, который при попадании наносит огромный урон.
  '122': "Дальнейшее развитие ионной технологии: ускоряется высокоэнергетическая плазма, получаемая перегревом ионов. При попадании она оказывает разрушительное действие."
  '123': Через эту сеть общаются исследователи с разных планет.
  '124': Открывает колонизацию и экспедиции в глубокий космос. Дополнительные планеты — на нечётных уровнях, дополнительные слоты экспедиций — на квадратных уровнях, более долгое удержание в экспедициях и больше позиций для планет в системе.
  '131': Увеличивает добычу металла на 2% за уровень.
  '132': Увеличивает добычу кристалла на 2% за уровень.
  '133': Увеличивает добычу дейтерия на 2% за уровень.
  '134': Снижает расходы на полёты на 2% за уровень.
  '199': Выстрел концентрированным зарядом гравитонов создаёт искусственное гравитационное поле, способное уничтожать корабли и даже луны.
  '202': Малый транспорт — манёвренный корабль, который быстро доставляет ресурсы на другие планеты.
  '203': Этот грузовой корабль вмещает гораздо больше Малого транспорта и обычно быстрее благодаря улучшенному двигателю.
  '204': Первый боевой корабль, который строит каждый император. Лёгкий истребитель манёвренный, но в одиночку уязвим; в большом количестве он становится реальной угрозой для любой империи. Лёгкие истребители первыми сопровождают Малые и Большие транспорты к вражеским планетам со слабой обороной.
  '205': Этот истребитель лучше бронирован и бьёт сильнее Лёгкого истребителя.
  '206': У Крейсеров почти втрое больше брони, чем у Тяжёлых истребителей, и более чем вдвое больше огневой мощи. Кроме того, они очень быстрые.
  '207': Линкоры — становой хребет флота. Тяжёлые орудия, высокая скорость и большие грузовые отсеки делают их серьёзными противниками.
  '208': С помощью этого корабля можно колонизировать свободные планеты.
  '209': Переработчик добывает сырьё из полей обломков.
  '210': Шпионские зонды — маленькие манёвренные дроны, которые доставляют данные о флотах и планетах на большие расстояния.
  '211': Бомбардировщик создан специально для уничтожения планетарной обороны.
  '212': Солнечные спутники — простые платформы из солнечных элементов на высокой стационарной орбите. Они собирают солнечный свет и передают его лазером на наземную станцию.
  '213': Уничтожитель — король боевых кораблей.
  '214': Разрушительной силе Звезды смерти нет равных, и она способна уничтожать луны.
  '215': Линейный крейсер специализируется на перехвате вражеских флотов.
  '216': "Преемник популярной Звезды смерти: намного быстрее и прочнее, с огромным грузовым отсеком, но бьёт чуть слабее."
  '217': Развитие Большого транспорта с гораздо большей грузоподъёмностью. Работает на гиперпространственном двигателе, поэтому на старте медленнее Большого транспорта, но по мере прокачки Гиперпространственного двигателя вырывается вперёд.
  '218': Худший из возможных кошмаров, пусть и очень медленный.
  '219': Огромный грузовой отсек и новые двигатели позволяют летать быстрее и собирать с полей обломков больше.
  '220': Стальной Колосс выдерживает любую атаку благодаря мощным щитам и толстой броне, но его оружие и двигатели оставляют желать лучшего.
  '221': "Штормовой Клинок — молниеносный истребитель, вооружённый до зубов. Защита? Не нужна: его добыча — беззащитные транспорты и переработчики."
  '222': Медленный, но мощно вооружённый крейсер с усиленными щитами и атакой.
  '223': "Переосмысленный Лёгкий истребитель: безопасность экипажа важнее всего, а лётные качества — как получится."
  '224': Непроверенный транспортный корабль с минимальным вооружением, созданный, чтобы потревожить беспечных соседей и сразу спровоцировать конфликт.
  '225': Корабль, сочетающий боевую мощь, скорость и грузоподъёмность. Незаменим в любом сильном флоте.
  '226': Тяжело бронированный боевой транспорт с внушительным, слегка громоздким корпусом, чья подавляющая огневая мощь способна одолеть даже самых стойких противников.
  '227': "Улучшенная версия классического Переработчика с импульсными двигателями: сбор обломков проходит эффективнее и дешевле."
  '228': Крайне быстрая, но неэффективная версия Переработчика с гиперпространственным двигателем.
  '231': Звезда смерти поменьше и побыстрее, которая не умеет уничтожать луны. Бегемот смертельно опасен для флотов.
  '401': Ракетная установка — простое, но выгодное средство обороны.
  '402': Лёгкие лазеры — простые наземные оборонительные орудия. Специальные системы наведения следят за вражескими кораблями, а мощный лазер прорезает корпус цели.
  '403': Тяжёлый лазер — улучшенная версия Лёгкого лазера.
  '404': Пушка Гаусса выстреливает плотными металлическими снарядами с огромной скоростью.
  '405': Ионное орудие стреляет лучами ионов (положительно или отрицательно заряженных частиц).
  '406': Плазменное орудие использует топливный элемент большого ядерного реактора, чтобы питать электромагнитный ускоритель, выпускающий импульсы плазмы (тороиды).
  '407': Малый щитовой купол накрывает всю планету полем, которое поглощает огромное количество энергии.
  '408': Большой щитовой купол поглощает во время атак значительно больше энергии.
  '409': Эволюция технологии щитовых куполов. Потребляет намного больше энергии, но выдерживает больше атак, чем любой другой щит.
  '410': "После многих лет изучения гравитации учёные создали Гравитонное орудие: оно генерирует небольшое концентрированное гравитонное поле и выстреливает им во врага."
  '411': Неподвижная оборонительная платформа без собственной тяги, которую гравитация удерживает на стабильной орбите вокруг планеты. Для запуска этого процесса нужно огромное количество энергии.
  '412': Защищает! Как кубик «Лего» в Kindergarten TD.
  '413': Titan Laser — колоссальный лазер.
  '414': Приманка — хитрая оборонительная система, призванная сбивать с толку и дезориентировать врага. Маскируясь под Ракетную установку, она отпугивает нападающих.
  '502': Ракеты-перехватчики уничтожают летящие на тебя Межпланетные ракеты.
  '503': Межпланетные ракеты уничтожают оборону противника.
  '901': Металл — главный ресурс для построек и кораблей. Он самый дешёвый, но и нужен больше всего.
  '902': Кристаллы — главный ресурс для электронных схем и некоторых сплавов.
  '903': Дейтерий водится в самых глубоких морях. Это самый дорогой ресурс, и энергии на него тоже уходит больше всего.
  '911': Энергия нужна для добычи любого ресурса.
  '229': Созданная, чтобы сломить господство Ксеров, Гадюка — совершенное оружие против Лёгких истребителей, Тяжёлых истребителей и Крейсеров. Скорострельные пушки и передовые технологии меняют баланс сил во вселенной.
  '230': Быстрый. Точный. Неуловимый. Перехватчик создан не для честных боёв — он наносит быстрый и мощный удар и за мгновение даёт подавляющее преимущество.
  '232': Быстрее, взрывоопаснее, всегда приятный сюрприз. Титан Пустоты — ужас лун.
