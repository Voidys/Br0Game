bonus:
  Attack: вооружения.
  BuildTime: времени строительства.
  Defensive: брони космических кораблей.
  DefensiveTime: времени постройки обороны.
  Energy: выработки энергии.
  Expedition: одновременных экспедиций.
  FleetSlots: слота для полётов кораблей.
  FlyTime: времени полёта кораблей.
  GateCoolTime: времени остывания телепорта.
  MoreFound: одновременных полётов поиска тёмной материи.
  Planets: планеты.
  ResearchTime: времени проведения исследований.
  Resource: добычи ресурсов.
  ResourceStorage: вместимости хранилищ.
  Shield: мощности щитов.
  ShipStorage: вместимости кораблей.
  ShipTime: времени постройки кораблей.
  SpyPower: мощности шпионажа.
longDescription:
  '1': >-
    Основной поставщик сырья для строительства несущих структур построек и
    кораблей.
  '2': Основной поставщик сырья для электронных строительных элементов и сплавов.
  '3': Извлекает из воды на планете незначительную долю дейтерия.
  '4': >-
    Производит энергию из солнечных лучей. Энергия требуется для работы
    большинства построек.
  '6': >-
    Чтобы сократить время проведения исследований, лучшие умы межгалактических
    исследовательских сетей объединились и разработали технополис. Он сокращает
    время проведения исследований на 8%. Хоть и не много, но на поздних этапах
    развития империи любая мелочь в этом плане дорогого стоит.
  '12': >-
    Добывает энергию из процесса образования атома гелия двумя атомами тяжёлого
    водорода.
  '14': >-
    Предоставляет простую рабочую силу, которую можно применять при
    строительстве планетарной инфраструктуры. Каждый уровень развития фабрики
    повышает скорость строительства зданий.
  '15': >-
    Представляет собой венец робототехники. Каждый уровень укорачивает время
    строительства зданий, кораблей и оборонительных сооружений вдвое.
  '21': >-
    В строительной верфи производятся все виды кораблей и оборонительных
    сооружений.
  '22': Хранилище для необработанных руд металлов до их дальнейшей переработки.
  '23': Хранилище для необработанного кристалла до его дальнейшей переработки.
  '24': Огромные ёмкости для хранения добытого дейтерия.
  '31': Необходима для исследования новых технологий.
  '33': Терраформер увеличивает пригодную для застройки площадь.
  '34': >-
    Склад альянса предоставляет возможность обеспечения топливом дружественных
    флотов, которые помогают при обороне и находятся на орбите
  '35': >-
    Ремонтный док дает возможность ремонтировать разрушенные корабли, покинувшие
    поле крушения в результате боя. Время ремонта составляет максимум 12 часов,
    но до ввода кораблей в строй проходит не менее 30 минут.<br>С момента
    создания поля крушения осталось 3 дня для начала ремонта. Отремонтированные
    корабли должны активно вводиться в строй после завершения ремонта. Если
    этого не произойдет, они автоматически вернутся в строй через 3 дня.
  '41': >-
    Луна не располагает атмосферой, поэтому перед заселением требуется соорудить
    лунную базу. Она обеспечивает необходимые воздух, гравитацию и тепло. Чем
    выше уровень развития лунной базы, тем больше обеспеченная биосферой
    площадь.
  '42': >-
    Высокочастотные сенсоры полностью просматривают спектр частот всех
    попадающих на фалангу излучений. Мощные компьютеры комбинируют мельчайшие
    колебания энергии и таким образом получают информацию о передвижениях
    кораблей на отдалённых планетах.
  '43': >-
    Телепорт - это огромные ворота, которые могут пересылать между собой флоты
    любых размеров без временных затрат. Телепорты не требуют дейтерия, однако
    между двумя прыжками должен пройти один час, иначе ворота перегреются.
    Невозможна также пересылка ресурсов. Весь процесс требует крайне высоко
    развитой технологии.
  '44': Служит для хранения ракет.
  '106': С помощью этой технологии добываются данные о других планетах.
  '108': >-
    С увеличением мощности компьютеров можно командовать всё большим количеством
    флотов. Каждый уровень компьютерной технологии увеличивает максимальное
    количество флотов на один.
  '109': >-
    Оружейная технология делает системы вооружения эффективней. Каждый уровень
    увеличивает мощность вооружения войсковых частей на 10% от основной
    мощности.
  '110': >-
    Эта технология делает щиты кораблей и оборонительных сооружений эффективней.
    Каждый уровень повышает эффективность щитов на 10% от основной мощности.
  '111': >-
    Специальные сплавы улучшают броню космических кораблей. Так, устойчивость
    брони может увеличиваться с каждым уровнем на 10% .
  '113': Обладание различными видами энергии необходимо для многих новых технологий.
  '114': >-
    Путём сплетения 4-го и 5-го измерения стало возможным исследовать новый
    более экономный и эффективный двигатель.
  '115': >-
    Дальнейшее развитие этих двигателей делает некоторые корабли быстрее, однако
    каждый уровень повышает скорость лишь на 10%.
  '117': >-
    Импульсный двигатель основывается на принципе отдачи. Дальнейшее развитие
    этих двигателей делает некоторые корабли быстрее, однако с каждым уровнем
    повышает скорость лишь на 20%.
  '118': >-
    Выгибает пространство вокруг корабля. Дальнейшее развитие этих двигателей
    делает некоторые корабли быстрее, каждый уровень повышает скорость на 30%.
  '120': >-
    Благодаря фокусированию света возникает луч, который при попадании на объект
    наносит ему повреждения.
  '121': >-
    Поистине смертоносный наводимый луч из ускоренных ионов. При попадании на
    какой-либо объект они наносят огромный ущерб.
  '122': >-
    Дальнейшее развитие ионной технологии, которая ускоряет не ионы, а
    высокоэнергетическую плазму. Она оказывает опустошительное действие при
    попадании на какой-либо объект.
  '123': >-
    Посредством этой сети учёные с различных планет могут обмениваться
    информацией.
  '124': >-
    С помощью модуля исследования астрофизики корабли могут совершать длительные
    экспедиции. Каждые два уровня этой технологии (начиная с 1 уровня) позволяют
    колонизировать дополнительную планету. Вы также можете отправлять больше
    экспедиций в глубокий космос.<br><br><li>Уровень 1-3 - 1
    экспедиция</li><li>Уровень 4-8 - 2 экспедиции</li><li>Уровень 9-15 - 3
    экспедиции</li><li>Уровень 16-24 - 4 экспедиции</li>
  '131': >-
    Благодаря передовым разработкам в сфере добычи металла, её возможно
    увеличить на 2% с каждым уровнем.
  '132': >-
    Благодаря передовым разработкам в сфере добычи кристалла, её возможно
    увеличить на 2% с каждым уровнем.
  '133': >-
    Благодаря передовым разработкам в сфере добычи дейтерия, её возможно
    увеличить на 2% с каждым уровнем.
  '134': Снижает расходы на перелет на 2%
  '199': >-
    Путём запуска концентрированного заряда частиц гравитона можно создавать
    искусственное гравитационное поле, благодаря которому можно уничтожать
    корабли или даже луны.
  '202': >-
    Малый транспорт - это манёвренный корабль, который может быстро
    транспортировать сырьё на другие планеты.
  '203': >-
    Дальнейшее развитие малых транспортов позволило создать корабли, обладающие
    большей вместительностью и, благодаря более развитому двигателю, способными
    передвигаться быстрее, чем малый транспорт, до тех пор, пока на малых
    транспортах не устанавливаются импульсные двигатели 5-го уровня
  '204': >-
    Лёгкий истребитель - это манёвренный корабль, который можно найти почти на
    каждой планете. Затраты на него не особо велики, однако щитовая мощность и
    вместимость очень малы.
  '205': >-
    Дальнейшее развитие лёгкого истребителя, он лучше защищён и обладает большей
    силой атаки.
  '206': >-
    Крейсеры почти втрое сильней защищены, чем тяжёлые истребители, а по огневой
    мощи они превосходят тяжёлые истребители более, чем в два раза. К тому же
    они очень быстры.
  '207': >-
    Линкоры как правило составляют основу флота. Их тяжёлые орудия, высокая
    скорость и большой грузовой тоннаж делают их серьёзными противниками.
  '208': >-
    Этот хорошо бронированный корабль используется для завоевания новых планет,
    что необходимо для развивающейся империи. Корабль используют как поставщика
    сырья на новую колонию, разобрав его заново и использовав все пригодные для
    переработки материалы для развития нового мира. Количество колонизируемых
    планет в империи напрямую зависит от исследований в области астрофизики.
    Первый уровень, а также каждый второй уровень позволяют продолжить
    колонизацию.
  '209': С помощью переработчика добывается сырьё из обломков.
  '210': >-
    Шпионские зонды - это маленькие манёвренные корабли, которые доставляют с
    больших расстояний данные о флотах и планетах.
  '211': >-
    Бомбардировщик был разработан специально для того, чтобы уничтожать
    планетарную оборону.
  '212': >-
    Солнечные спутники - это простые платформы из солнечных батарей, которые
    находятся на высокой орбите. Они собирают солнечный свет и передают энергию
    на наземную станцию.
  '213': Уничтожитель - король среди военных кораблей.
  '214': Уничтожительная мощь звезды смерти непревосходима.
  '215': Линейный крейсер специализируется на перехвате вражеских флотов.
  '216': Сверхновая звезда - самый мощный боевой корабль.
  '217': Дальнейшая разработка большого транспорта, более вместительного и быстрого.
  '218': >-
    При виде этого корабля, жители впадают в ужас и покидают колонии. Прекрасные
    боевые качества, но очень медленный.
  '219': >-
    Инженеры разработали новый переработчик, он летает быстрее и может собрать
    значительно больше обломков.
  '220': >-
    Стальной Колосс – это настоящая крепость в космосе, защищённая
    непроницаемыми щитами и массивной броней. Даже самые яростные атаки
    отскакивают от него, пока он неуклонно движется вперёд. Однако это
    оборонительное превосходство имеет свою цену: его вооружение незначительно,
    а медленные двигатели делают его громоздким гигантом. Вместо молниеносных
    ударов и ловких манёвров, Стальной Колосс полагается на чистую стойкость.
    Желающий его остановить должен запастись терпением – или обладать
    сокрушительной огневой мощью.
  '221': >-
    Штормовой Клинок – элитный истребитель: невероятно быстрый и беспощадно
    вооружённый. Противники едва успевают его заметить, прежде чем он наносит
    удар. Защита? Второстепенна – зачем выдерживать урон, если можно просто
    уклониться? Его цель – это беззащитные транспортники и переработчики,
    которые уничтожаются без сопротивления. Благодаря невероятной скорости он
    может атаковать в любой момент и исчезнуть до прибытия подкрепления. Тот,
    кто попал в прицел Штормовой Клинок, практически не имеет шансов на
    спасение.
  '222': >-
    Тяжёлый Крейсер — это усиленная версия стандартного крейсера. Благодаря
    улучшенным щитам и мощному вооружению он способен противостоять громоздким
    врагам. Особенно эффективен в сочетании со Стальными Колоссами,
    Разрушителями и Бомбардировщиками, где его огневая мощь раскрывается в
    полной мере. Однако, несмотря на свою силу, остаётся медлительным и менее
    манёвренным.
  '223': >-
    Дрон Щита — это новый подход к обороне флота, ориентированный на
    максимальную защиту экипажа. Инновационные, но тяжелые технологии защиты
    значительно снизили скорость и маневренность. Несмотря на плохие летные
    характеристики, он чрезвычайно эффективен в обороне. Устаревшая конструкция
    была доведена до предела, чтобы обеспечить почти непроходимую защиту.
  '224': >-
    Импровизированный Штурмовой Транспорт — это непроверенный транспортный
    корабль, оснащённый минимальным вооружением, специально разработанный для
    того, чтобы беспокоить неосторожных и неподготовленных соседей. Этот
    импровизированный корабль не предназначен для длительного использования, а
    для быстрых, импульсивных атак, которые неизбежно вызовут мгновенную
    реакцию. Конфликт с соседями практически гарантирован, как только он будет
    задействован. С ограниченным вооружением и непредсказуемой природой он
    становится опасным инструментом для быстрой эскалации конфликта.
  '225': >-
    Штормовой Транспорт — это настоящее чудо техники, которое идеально сочетает
    боевую мощь, скорость и транспортную емкость. Его способность быстро
    перемещать войска и ресурсы, при этом обеспечивая внушительную огневую мощь
    на поле боя, сделала его незаменимым элементом любой мощной флоты. Будь то
    быстрые штурмовые подразделения или поддержка долгосрочных операций,
    Штормовой Транспорт является ключом к эффективной войне и не может
    отсутствовать в любой флоте.
  '226': >-
    Колоссальный Боевой Транспорт представляет собой вершину инженерного
    искусства. Несмотря на слегка громоздкий дизайн и связанную с этим медленную
    скорость полета, это самый сильно бронированный боевой транспорт, который
    когда-либо был замечен на поле боя. Его подавляющая огневая мощь делает его
    непреодолимой силой на поле битвы. Этот колосс легко преодолевает вражеские
    линии, одновременно предоставляя максимальную защиту для своей экипажа. Он
    является воплощением силы и устойчивости и незаменим в любой сильно
    вооруженной флотилии.
  '227': ' Оптимизированный Переработчик – это передовая модификация стандартного переработчика. Оснащенный мощным импульсным двигателем, он быстрее и дешевле добирается до полей обломков, что делает его незаменимым кораблем для любой продвинутой флоты. Его усовершенствованная конструкция снижает затраты на производство и повышает эффективность сбора ресурсов. Доступен с середины игры и обеспечивает стратегическое преимущество для любой расширяющейся империи.'
  '228': >-
    Омега-Ресайклер – вершина технологий утилизации, но за огромную цену.
    Благодаря мощному гиперпространственному двигателю он добирается до полей
    обломков рекордно быстро и собирает ресурсы быстрее, чем любой другой
    корабль. Однако за эту скорость приходится платить – его строительство и
    эксплуатация стоят колоссальных денег, что делает его доступным только для
    богатых командиров на поздних стадиях игры. Для тех, кто ставит скорость
    выше эффективности, это идеальный ресайклер.
  '401': Ракетная установка - простое и дешёвое средство обороны.
  '402': >-
    При помощи концентрированного обстрела цели фотонами можно достичь
    значительно больших разрушений, чем при применении обычного баллистического
    вооружения.
  '403': Тяжелый лазер представляет собой дальнейшее развитие лёгкого лазера.
  '404': Пушка Гаусса ускоряет многотонные заряды с гигантскими затратами энергии.
  '405': >-
    Ионное орудие направляет на цель волну ионов, которая дестабилизирует щиты и
    повреждает электронику.
  '406': >-
    Плазменные орудия выпускают сгустки высокотемпературной плазмы и превосходят
    по своему разрушительному действию даже уничтожитель.
  '407': Малый щитовой защищает планету и поглощает удары атаки.
  '408': >-
    Дальнейшее развитие малого щитового купола. Он может сдерживать ещё более
    сильные атаки на планету, поглощая значительно большее количество энергии.
  '409': Самая мощная защита для ваших планет от вражеского флота.
  '410': >-
    После многолетних исследований в гравитационной технологии, ученым удалось
    создать гравитационную пушку которая генерирует небольшие концентрированные
    пучки и атакует ими противника.
  '411': >-
    Существование орбитальной базы требует колоссальных затрат энергии, но они с
    лихвой окупают себя при оборонительных операциях. Она не способна атаковать
    другие планеты, и находится на орбите в стационарном состоянии.
  '412': >-
    «Бункер» — это мощно укрепленное сооружение, рассчитанное на то, чтобы
    выдержать даже самые мощные атаки. Оно обеспечивает беспрецедентную защиту
    жителей планеты и важнейших объектов инфраструктуры, что делает его
    краеугольным камнем планетарной обороны.
  '413': >-
    «Титан-лазер» — это гигантское оружие, обладающее беспрецедентной
    разрушительной силой.
  '414': >-
    «Декой» — это сложная оборонительная система, предназначенная для введения
    вражеских сил в заблуждение и дезориентации. Маскируясь под ракетную
    установку, она сдерживает атаки.
  '502': Ракеты-перехватчики уничтожают атакующие межпланетные ракеты.
  '503': Межпланетные ракеты уничтожают защиту противника.
  '901': >-
    Metal is the main resource for Buildings and Ships. It is the cheapest
    resource, but it is needed the most as well. Producing Metal is the least
    energy expensive. The bigger the mines are, the deeper they dig into the
    earth.
  '902': >-
    Crystals are the main resource used to build electronic circuits and form
    certain alloy compounds. It gets produced in mines under the ground, where
    the raw material instantly is made into cicuits.
  '903': >-
    Deuterium is found in the deepest sea. It belongs to the rarest resources in
    the Universe. Because you have to get to the ground of the sea in order to
    get Deuterium, it is the most expensive resource.
  '911': Energy is needed for the production of every resource.
  "229": "Созданная, чтобы сломить господство Ксеров, Гадюка — это совершенное оружие против лёгких истребителей, тяжёлых истребителей и крейсеров. Благодаря скорострельным пушкам и передовым технологиям она меняет баланс сил во вселенной."
  "230": "Быстрый. Точный. Неуловимый. Перехватчик создан не для честных боёв — он рассчитан на быстрый и мощный удар, создающий подавляющее преимущество в мгновение ока."
  "231": "Бегемот — результат десятилетий исследований гравитонов, объединивших эту технологию в беспощадную боевую платформу. В отличие от Звёзд смерти, он создавался не для уничтожения планет, а для максимальной эффективности на поле боя. Отказавшись от энергоёмких систем, необходимых для уничтожения лун, конструкцию значительно облегчили, что позволило установить более мощные двигатели, повысить маневренность и огневую мощь. Компактная гравитонная пушка превращает его в мобильную машину разрушения, способную в одиночку уничтожить даже огромные флоты."
  "232": "Титан Пустоты — вершина современной гравитонной технологии. Каждая деталь его конструкции служит единственной цели: быстрому уничтожению вражеских лун. Обычные орудийные башни намеренно убрали, чтобы снизить массу и освободить место для колоссальных кристаллических генераторов. Они питают самые совершенные ускорительные катушки из когда-либо построенных в известных галактиках, обеспечивая кораблю непревзойдённую подвижность. Огромная потребность в кристалле делает каждого Титана Пустоты монументальным промышленным достижением и символом безграничной разрушительной мощи."
secureResources: >-
  В зависимости от уровня модернизации от разграбления во время атак защищается
  1% дневного объема производства, максимум 10%.
shortDescription:
  '1': >-
    Основной поставщик сырья для строительства несущих структур построек и
    кораблей.
  '2': Основной поставщик сырья для электронных строительных элементов и сплавов.
  '3': Извлекает из воды на планете незначительную долю дейтерия.
  '4': >-
    Производит энергию из солнечных лучей. Энергия требуется для работы
    большинства построек.
  '6': >-
    Чтобы сократить время проведения исследований, лучшие умы межгалактических
    исследовательских сетей объединились и разработали технополис. Он сокращает
    время проведения исследований на 8%. Хоть и не много, но на поздних этапах
    развития империи любая мелочь в этом плане дорогого стоит.
  '12': >-
    Добывает энергию из процесса образования атома гелия двумя атомами тяжёлого
    водорода.
  '14': >-
    Предоставляет простую рабочую силу, которую можно применять при
    строительстве планетарной инфраструктуры. Каждый уровень развития фабрики
    повышает скорость строительства зданий.
  '15': >-
    Представляет собой венец робототехники. Каждый уровень укорачивает время
    строительства зданий, кораблей и оборонительных сооружений вдвое.
  '21': >-
    В строительной верфи производятся все виды кораблей и оборонительных
    сооружений.
  '22': Хранилище для необработанных руд металлов до их дальнейшей переработки.
  '23': Хранилище для необработанного кристалла до его дальнейшей переработки.
  '24': Огромные ёмкости для хранения добытого дейтерия.
  '31': Необходима для исследования новых технологий.
  '33': Терраформер увеличивает пригодную для застройки площадь.
  '34': >-
    Склад альянса предоставляет возможность обеспечения топливом дружественных
    флотов, которые помогают при обороне и находятся на орбите
  '35': Ремонтный док позволяет восстанавливать корабли на месте кораблекрушения.
  '41': >-
    Луна не располагает атмосферой, поэтому перед заселением требуется соорудить
    лунную базу. Она обеспечивает необходимые воздух, гравитацию и тепло. Чем
    выше уровень развития лунной базы, тем больше обеспеченная биосферой
    площадь.
  '42': >-
    Высокочастотные сенсоры полностью просматривают спектр частот всех
    попадающих на фалангу излучений. Мощные компьютеры комбинируют мельчайшие
    колебания энергии и таким образом получают информацию о передвижениях
    кораблей на отдалённых планетах.
  '43': >-
    Телепорт - это огромные ворота, которые могут пересылать между собой флоты
    любых размеров без временных затрат. Телепорты не требуют дейтерия, однако
    между двумя прыжками должен пройти один час, иначе ворота перегреются.
    Невозможна также пересылка ресурсов. Весь процесс требует крайне высоко
    развитой технологии.
  '44': Служит для хранения ракет.
  '106': С помощью этой технологии добываются данные о других планетах.
  '108': >-
    С увеличением мощности компьютеров можно командовать всё большим количеством
    флотов. Каждый уровень компьютерной технологии увеличивает максимальное
    количество флотов на один.
  '109': >-
    Оружейная технология делает системы вооружения эффективней. Каждый уровень
    увеличивает мощность вооружения войсковых частей на 10% от основной
    мощности.
  '110': >-
    Эта технология делает щиты кораблей и оборонительных сооружений эффективней.
    Каждый уровень повышает эффективность щитов на 10% от основной мощности.
  '111': >-
    Специальные сплавы улучшают броню космических кораблей. Так, устойчивость
    брони может увеличиваться с каждым уровнем на 10% .
  '113': Обладание различными видами энергии необходимо для многих новых технологий.
  '114': >-
    Путём сплетения 4-го и 5-го измерения стало возможным исследовать новый
    более экономный и эффективный двигатель.
  '115': >-
    Дальнейшее развитие этих двигателей делает некоторые корабли быстрее, однако
    каждый уровень повышает скорость лишь на 10%.
  '117': >-
    Импульсный двигатель основывается на принципе отдачи. Дальнейшее развитие
    этих двигателей делает некоторые корабли быстрее, однако с каждым уровнем
    повышает скорость лишь на 20%.
  '118': >-
    Выгибает пространство вокруг корабля. Дальнейшее развитие этих двигателей
    делает некоторые корабли быстрее, каждый уровень повышает скорость на 30%.
  '120': >-
    Благодаря фокусированию света возникает луч, который при попадании на объект
    наносит ему повреждения.
  '121': >-
    Поистине смертоносный наводимый луч из ускоренных ионов. При попадании на
    какой-либо объект они наносят огромный ущерб.
  '122': >-
    Дальнейшее развитие ионной технологии, которая ускоряет не ионы, а
    высокоэнергетическую плазму. Она оказывает опустошительное действие при
    попадании на какой-либо объект.
  '123': >-
    Посредством этой сети учёные с различных планет могут обмениваться
    информацией.
  '124': >-
    Теперь корабли можно оснащать исследовательским модулем, обеспечивающим
    обработку собранных данных в условиях длительных полётов.
  '131': >-
    Благодаря передовым разработкам в сфере добычи металла, её возможно
    увеличить на 2% с каждым уровнем.
  '132': >-
    Благодаря передовым разработкам в сфере добычи кристалла, её возможно
    увеличить на 2% с каждым уровнем.
  '133': >-
    Благодаря передовым разработкам в сфере добычи дейтерия, её возможно
    увеличить на 2% с каждым уровнем.
  '134': Снижает расходы на перелет на 2%
  '199': >-
    Путём запуска концентрированного заряда частиц гравитона можно создавать
    искусственное гравитационное поле, благодаря которому можно уничтожать
    корабли или даже луны.
  '202': >-
    Малый транспорт - это манёвренный корабль, который может быстро
    транспортировать сырьё на другие планеты.
  '203': >-
    Дальнейшее развитие малых транспортов позволило создать корабли, обладающие
    большей вместительностью и, благодаря более развитому двигателю, способными
    передвигаться быстрее, чем малый транспорт, до тех пор, пока на малых
    транспортах не устанавливаются импульсные двигатели 5-го уровня
  '204': >-
    Лёгкий истребитель - это манёвренный корабль, который можно найти почти на
    каждой планете. Затраты на него не особо велики, однако щитовая мощность и
    вместимость очень малы.
  '205': >-
    Дальнейшее развитие лёгкого истребителя, он лучше защищён и обладает большей
    силой атаки.
  '206': >-
    Крейсеры почти втрое сильней защищены, чем тяжёлые истребители, а по огневой
    мощи они превосходят тяжёлые истребители более, чем в два раза. К тому же
    они очень быстры.
  '207': >-
    Линкоры как правило составляют основу флота. Их тяжёлые орудия, высокая
    скорость и большой грузовой тоннаж делают их серьёзными противниками.
  '208': При помощи этого корабля можно осваивать незаселённые планеты.
  '209': С помощью переработчика добывается сырьё из обломков.
  '210': >-
    Шпионские зонды - это маленькие манёвренные корабли, которые доставляют с
    больших расстояний данные о флотах и планетах.
  '211': >-
    Бомбардировщик был разработан специально для того, чтобы уничтожать
    планетарную оборону.
  '212': >-
    Солнечные спутники - это простые платформы из солнечных батарей, которые
    находятся на высокой орбите. Они собирают солнечный свет и передают энергию
    на наземную станцию.
  '213': Уничтожитель - король среди военных кораблей.
  '214': Уничтожительная мощь звезды смерти непревосходима.
  '215': Линейный крейсер специализируется на перехвате вражеских флотов.
  '216': Сверхновая звезда - самый мощный боевой корабль.
  '217': Дальнейшая разработка большого транспорта, более вместительного и быстрого.
  '218': >-
    При виде этого корабля, жители впадают в ужас и покидают колонии. Прекрасные
    боевые качества, но очень медленный.
  '219': >-
    Инженеры разработали новый переработчик, он летает быстрее и может собрать
    значительно больше обломков.
  '220': >-
    Стальной Колосс выдерживает любые атаки благодаря мощным щитам и толстой
    броне, но его оружие и двигатели оставляют желать лучшего.
  '221': >-
    Штормовой Клинок – молниеносный истребитель, вооружённый до зубов. Защита?
    Не нужна – его цель беззащитные транспортники и переработчики.
  '222': >-
    Медленный, но мощно вооружённый крейсер с усиленными щитами и атакующими
    возможностями.
  '223': >-
    Переосмысленный легкий истребитель, с приоритетом на безопасность экипажа,
    но с плохими летными характеристиками.
  '224': >-
    Непроверенный транспортный корабль с минимальным вооружением,
    предназначенный для нарушения спокойствия неосторожных соседей и
    немедленного провоцирования конфликта.
  '225': >-
    Корабль, который сочетает боевую мощь, скорость и транспортную емкость, что
    делает его незаменимым для любой мощной флоты.
  '226': >-
    Массово бронированный боевой транспорт с внушительным, слегка громоздким
    дизайном, чья подавляющая огневая мощь способна победить даже самых сильных
    противников.
  '227': >-
    Улучшенная версия классического переработчика с импульсным двигателем,
    обеспечивающая более эффективные миссии по сбору ресурсов при меньших
    затратах.
  '228': >-
    Чрезвычайно быстрый, но неэффективный перерабатывающий корабль с
    гиперпространственным двигателем.
  '231': >-
    Меньшая по размеру и более маневренная «Звезда Смерти», лишенная возможности
    уничтожать спутники. «Бегемот» лучше всего охарактеризовать как смертоносное
    оружие против флотов.
  '401': Ракетная установка - простое и дешёвое средство обороны.
  '402': >-
    При помощи концентрированного обстрела цели фотонами можно достичь
    значительно больших разрушений, чем при применении обычного баллистического
    вооружения.
  '403': Тяжелый лазер представляет собой дальнейшее развитие лёгкого лазера.
  '404': Пушка Гаусса ускоряет многотонные заряды с гигантскими затратами энергии.
  '405': >-
    Ионное орудие направляет на цель волну ионов, которая дестабилизирует щиты и
    повреждает электронику.
  '406': >-
    Плазменные орудия выпускают сгустки высокотемпературной плазмы и превосходят
    по своему разрушительному действию даже уничтожитель.
  '407': Малый щитовой защищает планету и поглощает удары атаки.
  '408': >-
    Дальнейшее развитие малого щитового купола. Он может сдерживать ещё более
    сильные атаки на планету, поглощая значительно большее количество энергии.
  '409': Самая мощная защита для ваших планет от вражеского флота.
  '410': >-
    После многолетних исследований в гравитационной технологии, ученым удалось
    создать гравитационную пушку которая генерирует небольшие концентрированные
    пучки и атакует ими противника.
  '411': >-
    Существование орбитальной базы требует колоссальных затрат энергии, но они с
    лихвой окупают себя при оборонительных операциях. Она не способна атаковать
    другие планеты, и находится на орбите в стационарном состоянии.
  '412': Это защищает! Как кубик «Лего» в игре «Kindergarten TD»
  '413': «Titan Laser» — это гигантский лазер.
  '414': «Декой» маскируется под ракетную установку.
  '502': Ракеты-перехватчики уничтожают атакующие межпланетные ракеты.
  '503': Межпланетные ракеты уничтожают защиту противника.
  '901': >-
    Metal is the main resource for Buildings and Ships. It is the cheapest
    resource, but it is needed the most as well. Producing Metal is the least
    energy expensive. The bigger the mines are, the deeper they dig into the
    earth.
  '902': >-
    Crystals are the main resource used to build electronic circuits and form
    certain alloy compounds.
  '903': >-
    Deuterium is found in the deepest sea. It belongs to the rarest resources in
    the Universe. Because you have to get to the ground of the sea in order to
    get Deuterium, it is the most expensive resource.
  '911': Energy is needed for the production of every resource.
  "229": "Созданная, чтобы сломить господство Ксеров, Гадюка — это совершенное оружие против лёгких истребителей, тяжёлых истребителей и крейсеров. Благодаря скорострельным пушкам и передовым технологиям она меняет баланс сил во вселенной."
  "230": "Быстрый. Точный. Неуловимый. Перехватчик создан не для честных боёв — он рассчитан на быстрый и мощный удар, создающий подавляющее преимущество в мгновение ока."
  "232": "Быстрее, взрывоопаснее, всегда приятный сюрприз. Титан Пустоты — ужас лун."
