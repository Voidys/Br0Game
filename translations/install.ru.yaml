install_desc: >-
  Чтобы включить инструмент установки, создайте
  "var/ENABLE_INSTALL_TOOL"<br> Имя файла чувствительно к регистру и не
  имеет окончания типа файла.<br> Файл может быть пустым. 

  Он будет удален автоматически после завершения установки или если он старше
  одного часа.
install_title: Инструмент установки заблокирован
intro_install: Установить
intro_lang: Язык
intro_text: >-
  Br0Game - один из лучших клонов OGame.<br>Br0Game является самым стабильным и
  развивающимся движком из всех подобных XNova на данный момент. Мы надеемся,
  что Br0Game будет лучше, чем Вы ожидаете.<br><br>Если у Вас будут вопросы,
  консультируйтесь с нами.<br><br>Br0Game является проектом с открытым кодом и
  распространяется под лицензией GNU GPL v3, ознакомиться с которой Вы можете в
  разделе Лицензия.<br><br>Перед установкой будет запущен небольшой тест на
  соответствие минимальным требованиям.
intro_upgrade_head: Br0Game уже установлена
intro_upgrade_text: >-
  <p>Вы уже установили Br0Game и просто хотите её обновить?</p><p>Здесь вы
  можете обновить старую базу данных с помощью нескольких кликов.</p>
intro_welcome: Добро пожаловать в Br0Game!
licence_accept: >-
  Вы согласны со всеми условиями лицензионного соглашения? Вы можете установить
  программное обеспечение, только если Вы принимаете условия лицензионного
  соглашения.
licence_desc: >-
  Пожалуйста, прочитайте лицензионное соглашение. Используйте полосу прокрутки
  для просмотра всего документа.
licence_head: Лицензионное соглашение
licence_need_accept: >-
  Для того, чтобы приступить к установке, Вы должны принять условия
  лицензионного соглашения.
