step6_info_additional: >-
  Если Вы нажмёте на кнопку ниже, Вы будете перенаправлены в панель
  администратора. Потратьте некоторое время на ознакомление с доступными
  настройками.<br/><br/><strong>Пожалуйста, удалите файл
  &raquo;var/ENABLE_INSTALL_TOOL&laquo; или переименуйте его, прежде чем
  использовать игру. Пока этот файл существует, Ваша игра подвергается
  потенциальному риску взлома!</strong>
