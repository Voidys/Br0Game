step1_desc: >-
  Br0Game может быть установлена на Вашем сервере, но Вы должны указать
  настройки доступа к базе данных. Если Вы не знаете настройки доступа для
  подключения к базе данных, узнайте их у Вашего хостинг-провайдера или
  связитесь с технической поддержкой Br0Game для консультации. При вводе данных,
  пожалуйста, проверьте их внимательно, прежде чем продолжить.
