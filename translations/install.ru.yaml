reg_gd_desc: >-
  <strong>Рекомендуемо</strong> — Графическая библиотека &raquo;gdlib&laquo;
  отвечает за динамическую генерацию изображений. Без этой библиотеки не будет
  возможна работа некоторых функциональных возможностей программного
  обеспечения.
reg_gd_need: Установленная версия графической библиотеки &raquo;gdlib&laquo;
reg_global_desc: >-
  Br0Game будет корректно работать, если этот параметр включён. Тем не менее,
  рекомендуется по соображениям безопасности, отключить register_globals в
  настройках PHP.
