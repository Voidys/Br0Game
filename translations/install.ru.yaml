req_desc: >-
  Перед продолжением установки Br0Game выполнит проверку файлов конфигурации
  Вашего сервера на соответствие необходимым требованиям использования Br0Game.
  Пожалуйста, прочитайте внимательно результаты и не продолжайте установку, пока
  проверка не будет пройдена по всем пунктам. Если Вы хотите использовать любую
  из функций перечисленных ниже модулей, Вы должны убедиться, что проверка
  пройдена.
req_head: Необходимые модули
req_php_need: Установленная версия &raquo;PHP&laquo;
req_php_need_desc: >-
  <strong>Требование</strong> — PHP является серверным языком, на котором
  написана игра. Br0Game работает без ограничений, используя версию PHP 5.2.5 и
  выше.
