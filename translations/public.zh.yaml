home_meme_caption: 你的第一天
home_meme_alt: 来自 {game_name} 指挥甲板的漫画梗图
home_meme_alt_deep_space_transit: 漫画：两名学员坐在穿梭机里——一个看到小行星带瘫倒在座位上，另一个对着发光的星云咧嘴大笑。“日常星区巡逻 vs. 发现一片未探索的富资源星云。”
home_meme_alt_deuterium_joyride: 漫画：一位疲惫的指挥官站在观景台上，看着两名新兵在外面漂来漂去——“看着新兵们在外面兜风把重氢烧光，而我还在等 12 小时的矿场升级。”
home_meme_alt_enemy_fleet: 漫画：警报闪烁，一名学员抱头惊慌失措——“1000 艘敌方毁灭者正在逼近？！不是说这个星区很安全吗？！”
home_meme_alt_fleet_decimated: 漫画：一名受惊的士兵呆呆地望着前方，破碎的穹顶外舰船接连爆炸——“当你花了 20 小时采集资源，结果前三名玩家的舰队跳过来，3 秒钟就把一切拆了。”
home_meme_alt_solo_scouting: 漫画：神冈指挥官咧嘴一笑，把机械手搭在一名学员肩上——“别担心，学员。最高指挥部对你单人深入太空的侦察任务‘充满’信心。”
home_meme_alt_this_is_fine: 漫画：一只穿着太空服的狗平静地坐在燃烧的指挥中枢里说“这没事”——“别担心，我的舰队只是晚了 4 小时才返航。”
