tutorial_rewards_header: 'Награды:'
tutorial_text:
  step0: "Добро пожаловать в {game_name}!<br><br>\r\nЭтот учебник познакомит вас с основами игры.<br>\r\nДля получения дополнительной информации вы сможете обращаться к нашему Wiki, так как не все аспекты игры рассматриваются в учебнике.\r\nВы можете получить доступ к Wiki в любое время через меню слева.<br>\r\nУчебник можно пропустить, но вы не сможете начать его заново.<br><br>\r\nУдачи, Император!"
  step1: "Цель игры — набирать как можно больше очков. За каждые 1000 потраченных ресурсов вы получите одно очко.\r\nРесурсы можно добывать разными способами, но главным является производство на собственных шахтах.<br>\r\nСначала обеспечьте базовые ресурсы — металл и кристаллы. Для их добычи необходимы соответствующие шахты, а также энергия от солнечной электростанции.\r\nПри нехватке энергии шахты будут работать не на полную мощность.<br>\r\nЭти здания можно улучшать через меню <b>Здания</b>. Кликнув на название здания, вы увидите, сколько ресурсов будет приносить следующий уровень, а также сколько энергии потребуется для его работы.<br><br>\r\nДля дополнительной информации посмотрите в Wiki:\r\n<a href=\"{wiki_url}/wiki/EN/Rohstoffe\" target=\"_blank\">Raw material production</a>"
  step2: "Игра будет намного интереснее, если общаться с другими игроками.\r\nБольшинство игроков общаются через наш Discord.\r\nВ сообществе вы сможете найти ответы на вопросы, а также союзников для совместной игры.<br>\r\nВ случае затруднений можно открыть тикет для поддержки."
  step3: "Другие игроки могут нападать на ваши планеты, чтобы забрать ресурсы.<br>\r\nЗащита поможет предотвратить такие атаки и сохранить хотя бы ночное производство.<br>\r\nВажно иметь сбалансированную защиту, так как состав атакующего флота тоже имеет значение.<br>\r\nПеред тем как разграбить ваш планету, атакующий должен преодолеть вашу оборону. Чем больше кораблей ему потребуется, тем меньше его выгода.<br>\r\nОборонительные сооружения можно строить в меню <b>Оборона</b> при наличии верфи. Для верфи, в свою очередь, понадобится роботизированный завод и дейтерий.<br><br>\r\nБольше информации вы найдете в Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Defense facilities</a>"
  step4: "Улучшайте свои шахты для стабильного снабжения ресурсами!<br>\r\nПостепенно стоимость строительства, исследований и обороны будет увеличиваться.\r\nДля этого вам понадобится развивать добычу ресурсов на своих планетах.\r\nТеперь зайдите в меню <b>Здания</b> и улучшите нужные постройки, если у вас достаточно ресурсов."
  step5: "Постройте малый транспортный корабль!<br>\r\nМалые транспортеры будут полезны для перевозки ресурсов на более поздних стадиях игры.<br>\r\nС импульсным двигателем они быстрее больших транспортных кораблей и могут перевозить ресурсы между вашими планетами, участвовать в торговле или атаковать других игроков.<br><br>\r\nПодробнее читайте в Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Ships</a>"
  step6: "Для удобства вы можете переименовать планеты. Щелкните по названию планеты в верхней части экрана в меню обзора и измените его.<br><br>\r\nТакже можно отправить запрос на добавление в друзья другим игрокам. После принятия запроса вы сможете легче общаться и видеть статус друг друга.<br>\r\nДля этого не обязательно состоять в одном альянсе. Союзники также могут держать свои флоты на планете друга для совместной обороны.<br><br>\r\nПрисоединившись к альянсу, вы получите больше возможностей для командной игры.\r\nВ альянсе можно рассылать общие сообщения, видеть статус и очки других игроков в зависимости от ранга в альянсе."
  step7: "Чтобы узнать, какие ресурсы, здания, исследования и корабли есть у других игроков, шлите им шпионские зонды.\r\nОтправить зонд можно через меню флота или галактики.<br>\r\nНо помните, что другие игроки могут шпионить и вас!"
  step8: >-
    Экспедиция может принести ресурсы, корабли, события или потери. Чтобы
    попробовать это, возьмите корабль и отправьтесь в экспедицию, нажав на
    координату планеты 16 и миссию «Экспедиция» в меню флота.<br>

    Каждый тип корабля добавляет очки к размеру экспедиционного флота до
    предела, когда достигается максимальный размер события.<br><br>

    Дополнительную информацию ищите в Wiki:

    <a href="{wiki_url}/wiki/En/Expoanleitung"
    target="_blank">Expeditions</a>
  step9: "Для ускорения производства ресурсов вам нужно колонизировать больше планет.\r\nТак вы сможете одновременно развивать производство и строить корабли на нескольких планетах.<br>\r\nНо помните: для заселения внешних или внутренних зон системы требуется высокий уровень астрофизики.\r\nКолонизационный корабль можно построить без астрофизики, но первая колония потребует изучения этого исследования.<br><br>\r\nКолонизация планет рядом с уже заселенными уменьшит время транспортировки, но также делает вас более уязвимыми для нападений.<br><br>\r\nПодробнее читайте в Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrophysics</a>"
  step10: "Чтобы быстрее добывать ресурсы, можно нападать на других игроков.<br>\r\nОбратите внимание на соотношение затрат и пользы, чтобы ваша атака была выгодной.<br>\r\nИспользуйте шпионские отчеты и боевой симулятор для расчетов.<br><br>\r\nПредупреждение: многие флотовые миссии можно отследить другими игроками.<br>\r\nСохранить свой флот — одна из самых важных частей игры.<br><br>\r\nРекомендуем ознакомиться с темами в Wiki:\r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensorphalanx</a>"
  step10_u6: >-
    Чтобы быстрее добывать ресурсы, можно нападать на других игроков.<br>

    Обратите внимание на соотношение затрат и пользы, чтобы ваша атака была
    выгодной.<br>

    Используйте шпионские отчеты и боевой симулятор для расчетов.<br><br>

    Предупреждение: многие флотовые миссии можно отследить другими игроками.<br>

    Сохранить свой флот — одна из самых важных частей игры.<br><br>

    Рекомендуем ознакомиться с темами в Wiki:

    <a
    href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Saven</a>
  step11: "При уничтожении флотов образуется обломочное поле, которое можно переработать.\r\nДля этого вам понадобится утилизатор, который способен собрать до 20 тысяч ресурсов с поля обломков.\r\nУничтожение крупного флота может стать значительным источником ресурсов.<br><br>\r\nКроме отправки через меню флота, утилизаторы можно отправлять прямо из меню галактики, щелкнув по полю обломков и выбрав нужное количество."
  step12: "Поздравляем, вы завершили учебник!<br><br>\r\nВ игре есть множество других механик, которые еще предстоит освоить.<br>\r\nСуществуют три основные стили игры, отличающиеся по трудоемкости и подходам:<br>\r\n<ul>\r\n<li>Шахтер: развивает добычу ресурсов на колониях, в основном использует транспортные корабли</li>\r\n<li>Флиттер: ориентирован на боевые корабли, имеет минимальное производство, живет за счет грабежей</li>\r\n<li>Комбо: сочетает оба стиля</li>\r\n</ul>\r\nНа поздних этапах игры важными становятся луны, и вы уже должны быть знакомы с сенсорной фалангой.<br><br>\r\nЕсли у вас будут вопросы, обратитесь к Wiki или к сообществу на Discord за помощью."
  step12_u6: >-
    Поздравляем, вы завершили учебник!<br><br>

    В игре есть множество других механик, которые еще предстоит освоить.<br>

    Существуют три основные стили игры, отличающиеся по трудоемкости и
    подходам:<br>

    <ul>

    <li>Шахтер: развивает добычу ресурсов на колониях, в основном использует
    транспортные корабли</li>

    <li>Флиттер: ориентирован на боевые корабли, имеет минимальное производство,
    живет за счет грабежей</li>

    <li>Комбо: сочетает оба стиля</li>

    </ul>

    Если у вас будут вопросы, обратитесь к Wiki или к сообществу на Discord за
    помощью.
tutorial_title:
  step0: Что это за игра?
  step1: Начнем зарабатывать!
  step2: Общайтесь с другими игроками!
  step3: Не оставайтесь без защиты!
  step4: Планируйте на будущее!
  step5: Нам нужны корабли!
  step6: Дайте планете имя и ищите союзников!
  step7: Посмотрите, что есть у других!
  step8: Начало неизведанного!
  step9: Один планета надолго не хватит!
  step10: Не жди долго своей добычи!
  step11: Попробуй быть утилизатором!
  step12: Ты справился
