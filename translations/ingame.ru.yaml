op_activate_vacation_mode_descrip: >-
  Режим "Отпуск" предназначен для защиты во время длительного отсутствия. Он
  может быть активирован только тогда, когда ни один из ваших флотов не
  находится в движении. Когда режим активирован, он защищает вас от новых атак.
  Однако уже начавшиеся атаки будут продолжаться, а удерживаемые дружественные
  флоты будут отправлены обратно! Производство ресурсов, строительство зданий и
  верфей, а также исследования приостанавливаются на это время и возобновляются
  после. Режим каникул длится не менее 48 часов, после чего его можно снова
  отключить.
