kontakt: >-
  Привет!<br>На этой странице вы найдете информацию о людях, которые активно
  управляют, модерируют и развивают этот проект.<br>Не стесняйтесь обращаться к
  нам, если у вас возникнут вопросы или проблемы.<br><br>Для лучшего обмена
  информацией с нами, а также с другими со-спилерами, мы создали сервер Discord.
  Вы можете найти его <a href="https://discord.gg/jhYYN3yuat">здесь</a> или
  через меню.<br>На сервере вы найдете последние новости, а также увлекательные
  мемы между альянсами вселенной.<br>Задавайте вопросы по игровой механике и
  помогайте своими предложениями по дальнейшему развитию
  игры.<br><br>Разумеется, мы также будем отвечать на внутриигровые
  обновления.<br>Однако, пожалуйста, помните, что мы играем в игру только как
  хобби. Ответы могут занять несколько дней.<br>
