Achievement_text:
  '1': Вы не спали всю ночь и не сделали ни одного выстрела.
  '2': За последние 90 дней у Вас были постоянные перемещения флота.
  '3': >-
    Вы потеряли свой флот, когда в настройках языка было установлено значение
    "Французский".
  '4': Изучить ионные технологии 10.
  '5': Изучить исследования гравитона 2.
  '6': Одна из ваших атак вернулась с 1 металлом, 1 кристаллом, 1 дейтерием.
  '7': >-
    Победить флот пиратских или инопланетных кораблей общей численностью не
    менее 10 000 кораблей.
  '8': Участвуйте в таблице подтягивания (по вторникам с 20:00 по Discord).
  '9': Постройте свою первую "Звезду смерти".
  '10': Уничтожить луну игрока.
  '11': Играйте 14 дней исключительно на мобильном телефоне.
  '12': Ваш флот был уничтожен черной дырой во время первой экспедиции.
  '13': Отправьте свой флот в сторону, пока до начала атаки остается менее 5 секунд.
  '14': Вы потеряли 10 флотов из-за черных дыр.
  '15': Провести на планете 10 лунных попыток, не получив луны
  '16': Более 250 ваших переработчиков вернулись без груза
  '17': >-
    Запустить в производство не менее 5000 ракетных установок, получив заказ на
    их изготовление.
  '18': >-
    Потребление 5 миллионов дейтерия на планете в течение 24 часов в виде затрат
    на топливо.
  '19': Исследовать космическую броню 3.
  '20': Исследовать космическую броню 6.
  '21': Исследовать космическую броню 9.
  '22': Исследовать космическую броню 12.
  '23': Исследовать космическую броню 15.
  '24': Изучение лазерных технологий 12.
  '25': Вы дали согласие на получение записей
  '26': >-
    Удалите планету, которая принесла вам наибольшее количество очков. (Не менее
    100 000 очков)
  '27': Исследовать Межгалактическую исследовательскую сеть 1.
  '28': Улучшите все три ресурсных склада на луне до уровня не ниже 3.
  '29': >-
    Коллективизировать флот игрока, набравшего большее количество очков, с
    помощью 5 человек AKS
  '30': Отразить нападение 5 человек АКС в одиночку
  '31': Своей атакой вы перевели игрока в режим отпуска.
  '32': Поднять 1000 планет при активированной теме "SetSail".
  '33': Возвращение из режима U.
  '34': Быть атакованным один раз.
  '35': Атаковать активного игрока, имеющего менее 1/10 ваших очков
  '36': "Получите сообщение, содержащее один из следующих блоков:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Ваш флот был уничтожен AKS с 5 участниками.
  '38': Нападать на членов своего альянса.
  '39': Напасть на кого-то, имея ровно 42 корабля.
  '40': >-
    Колонизировать планету, находящуюся на расстоянии не менее половины
    Вселенной.
  '41': Заблокировать на неделю слот для флота с плохим предложением на рынке.
  '42': Появляется 4 раза в Зале боя в качестве проигравшего.
  '43': "Выиграть сражение, пока ваш аккаунт отмечен как неактивный,\r\n            на одной из ваших планет, куда ранее прибыл флот, время полета которого превышало 7 дней."
  '44': >-
    Produziere auf einem Planeten für mehr als 7 Tage eine Ressource mit weniger
    als 100% Energienutzen.
  '45': Выиграть атаку на игрока, входящего в топ-5 защиты.
  '46': Запуск защиты от столкновений путем обстрела межпланетными ракетами.
  '47': Уничтожить 5 лун.
  '48': Потерять 5 "Звезд смерти" при попытке уничтожить луны.
  '49': Отрывайте коло сразу после его образования.
  '50': "Потеряйте все свои солнечные спутники на планете с достаточным количеством энергии для исследования Gravi\r\n            энергии для исследования Gravi, не исследовав Gravi."
  '51': Израсходуйте весь свой дейтерий во время торжественного просмотра.
  '52': >-
    Постройте Звезду смерти, не построив сначала другие линкоры (легкий
    истребитель, тяжелый истребитель, крейсер, линкор, бомбардировщик,
    разрушитель или боевой крейсер).
  '53': У меня самый высокий уровень в 5 исследованиях одновременно.
  '54': Время атаки на активного игрока до 01.01. 00:00:00
  '55': Особые достижения
