faq_overview: FAQ
questions:
  '1':
    '1':
      body: "<p>En esta parte del tutorial se describen los principales edificios. Explica cuáles deben construirse al principio y para qué se necesitan. Para construir un imperio con éxito, es importante construir los edificios en un orden sensato.</p>\r\n<h3>La planta de energía solar:</h3>\r\n<p>Para producir los recursos que necesitas para construir tu imperio, es necesario construir primero este edificio. Suministra la energía con la que sus minas producen los recursos metal, cristal y deuterio. En cuanto termine la construcción, podrás ver cuánta energía hay disponible en la barra de recursos, así como en el punto \"Producción\".</p>\r\n<h3>La mina de metal:</h3>\r\n<p>El metal es uno de los tres recursos disponibles en el juego. El metal es necesario para casi todo lo que se puede construir o investigar. Por lo tanto, es aconsejable una buena expansión de esta mina. Sobre todo al principio, es importante que esta mina funcione varios niveles por encima de las demás.</p>\r\n<h3>La mina de cristal y el sintetizador de deuterio:</h3>\r\n<p>El cristal es una materia prima importante para edificios, barcos e investigación. Se produce en menor cantidad que el metal, pero no por ello es menos valioso. En el transcurso del juego verás lo disputado que puede estar el cristal. El deuterio es un proveedor de energía (sintetizador de deuterio), combustible para flotas y el recurso básico para algunas investigaciones y edificios importantes (laboratorio de investigación).</p>"
      title: Paso 1
    '2':
      body: "<p>Para expandir tu imperio y competir o interactuar con otros jugadores, necesitas más edificios. Mediante la investigación y la construcción de un astillero espacial, empiezas a construir tu flota y tu defensa planetaria. Encontrará más información aquí:</p>\r\n<h3>El astillero de naves espaciales:</h3>\r\n<p>Aquí se construyen todas las naves disponibles en el juego. Aunque el astillero esté a tu disposición muy al principio del juego, seguirás necesitando más investigación para poder construir ciertas clases de barcos. En la opción de menú \"Tecnología\" encontrará un resumen de los requisitos técnicos de cada buque o defensa. Cuanto más avanzado sea el astillero, más rápido podrá construirse.</p>\r\n<h3>El laboratorio de investigación:</h3>\r\n<p>La investigación puede iniciarse aquí. Sirven para poder construir nuevos edificios y sistemas de investigación y defensa. Además, ciertas investigaciones aportan una bonificación a los logros ya existentes. La investigación también puede acelerarse ampliando el laboratorio de investigación.</p>\r\n<h3>La fábrica de robots:</h3>\r\n<p>La fábrica de robots es un edificio esencial. Al ampliarlo, se puede reducir el tiempo de producción de las naves espaciales y el de construcción de los edificios. Si los plazos de construcción se alargan considerablemente, pueden volver a reducirse ampliando la fábrica de robots.</p>"
      title: Paso 2
    '3':
      body: "<p>Esta parte del tutorial está dedicada a la defensa de tu propio planeta, así como a las primeras acciones con tu propia flota. Describe brevemente las opciones para enviar la flota e interactuar con otros jugadores.</p>\r\n<h3>El punto de vista de la galaxia:</h3>\r\n<p>Se utiliza para localizar a otros jugadores. Puedes encontrar información detallada sobre los otros planetas y también puedes enviar partes de tu flota directamente desde esta vista. Además, también puedes utilizar esta vista para contactar con otros jugadores o espiar otro planeta, siempre que puedas y hayas construido sondas espía.</p>\r\n<h3>Flotas navieras:</h3>\r\n<p>Las flotas pueden enviarse a través de la vista de galaxias o a través del elemento \"Flotas\". Primero selecciona el número de naves de un determinado tipo que van a volar. Tienes que fijar el destino (coordenadas que recibes en la vista de galaxia) y la velocidad a la que hay que llegar. También se puede determinar el tipo de misión, como \"ataque\", \"estación\", \"espera\", \"desmantelamiento\" o \"espera\".</p>\r\n<h3>Defensa:</h3>\r\n<p>Para proteger tu propio planeta, también puedes construir instalaciones de defensa con la construcción del astillero espacial. Éstas ofrecen cierta protección contra los atacantes y luchan con tu propia flota, que se encuentra en el planeta en el momento del ataque, contra tu oponente. A diferencia de la flota, el 70% de las defensas se restablecen tras la batalla.</p>"
      title: Paso 3
    category: Consejos para principiantes
  '2':
    '1':
      body: "<h3>Raiden:</h3>\r\n<p>Es el término común para atacar a otros jugadores con el fin de apoderarse de sus recursos.\r\nExisten varios tipos de redadas:</p>\r\n<ul>\r\n\t<li>Incursiones inactivas</li>\r\n\t<li>ACS (Sistema de Combate de la Alianza)</li>\r\n\t<li>Interceptar una flota</li>\r\n</ul>\r\n<h3>Incursiones inactivas:</h3>\r\n<p>Como \"fleeter\" básicamente quieres conseguir recursos lo más rápido y fácil posible. A veces no serás capaz de atacar a ningún jugador activo a tu alrededor ya que la mayoría de ellos \r\nestarán en línea o ya están guardando flotas. Sin embargo, puedes atacar a los jugadores inactivos, ya que no es probable que se conecten. Farming inactivos no es tan suspenso como\r\natacar a jugadores activos, pero es una buena forma de evitar ataques que consumen mucho tiempo.</p>\r\n<h3>ACS:</h3>\r\n<p>El Sistema de Combate de la Alianza (o ACS) permite a los amigos y miembros de la alianza combinar temporalmente sus flotas para atacar o defender un objetivo que no hubieran podido atacar o defender por sí solos. Un Depósito de Alianza no es un prerrequisito para atacar o defender un planeta con ACS.</p>\r\n<h3>Interceptar una flota:</h3>\r\n<p>Aquí es donde la cosa se complica. ¿Cómo encuentro posibles objetivos? Básicamente intentas encontrarlos como flotas inactivas, sin embargo cada vez que ves esa flota te\r\nque el jugador está en línea. Antes de que puedas chocar contra alguien que está guardando y vigilando su flota tienes que averiguar cómo, cuándo y dónde el jugador está \r\nguarda su flota. Para ello tienes que observar al jugador. Si el jugador está salvando sin lunas es más fácil interceptarlo ya que básicamente puedes confiar en \r\nen su falange. Pero cuando se trata de interceptar flotas salvadas desde una luna la cosa se complica. Dependiendo de cómo el jugador salva tienes que destruir \r\nsu(s) luna(s) para poder falanquear su flota.</p>"
      title: Raiden
    '2':
      body: "<h3>Ataque con el ACS</h3>\r\n<p>Para poder atacar juntos, primero deben enviar una flota con la orden \"Atacar\" al objetivo de su ataque. Una vez lanzado el ataque, puedes convertir tu flota en una unidad de flota en el menú de flota haciendo clic en el botón \"Unidad\". En el menú de asociación de flotas tienes entonces la opción de renombrar la asociación e invitar a nuevos jugadores a la asociación, por lo que el jugador que inició el ataque es automáticamente invitado también Ahora todas las flotas deseadas deben unirse y tu asociación de flotas está completa. Para ello, cada jugador invitado debe introducir las coordenadas correctas del objetivo al enviar sus propias naves, seleccionar la orden \"ataque en formación\" y enviar la flota. El convoy siempre vuela el tiempo que necesite la subflota más lenta. Las flotas más rápidas no cambian el tiempo de vuelo restante cuando se unen a la federación. Las flotas más lentas, sin embargo, aumentan el tiempo de vuelo restante a su propio tiempo de vuelo. También hay que tener en cuenta que un máximo de 5 jugadores pueden volar en un ataque conjunto y un máximo de 16 flotas individuales pueden volar en formación. Una flota que se une a una formación puede aumentar su tiempo de vuelo restante un 30% como máximo. Así, si el tiempo de vuelo restante es de 100 minutos, una flota que desee unirse a la formación en ese momento podrá disponer de un tiempo máximo de vuelo de 130 minutos.<br>\r\n<b>Atención:</b> si la flota de los fundadores de la federación es retirada, ¡las demás seguirán volando!</p>\r\n<h3>Defenderse con el ACS</h3>\r\n<p>Si te ataca una flota enemiga, tienes la opción de que te ayuden jugadores amigos, tanto si el atacante es demasiado fuerte para ti solo, como si simplemente quieres menos pérdidas y más beneficios de una intercepción. Para que los jugadores amigos te ayuden, deben enviar su flota para apoyarte. Pueden ser todos los jugadores que pertenezcan a tu alianza o estén en tu lista de amigos. Si este es el caso, pueden seleccionar las coordenadas en las que te atacan en su menú de flota, establecer cuánto tiempo quieren estacionar sus flotas contigo y luego salir volando con la orden \"Esperar\". Además de los costes de deuterio del vuelo, hay otros costes en función del tamaño de la flota y de la duración de la estancia, que se cargan directamente al principio. Mientras las flotas amigas estén estacionadas contigo, participarán en todas las batallas en ese planeta o luna. Aparecen en un informe de espionaje como si fueran tus propias naves. Por eso es importante enviar tus flotas de contención de forma que lleguen relativamente cerca de la flota atacante para evitar ser detectadas en caso de savecan. Los jugadores que hayan enviado sus flotas en apoyo pueden recuperarlas en cualquier momento en el menú de flotas. Si no se utiliza esta opción, la flota simplemente espera el tiempo de espera establecido y luego vuela de vuelta a su propietario.</p>\r\n<h3>Mantener el consumo de deuterio por 1 hora:</h3>\r\n<p>Pequeño transportista: 5<br>\r\nTransportador grande: 5<br>\r\nCazador de luz: 2<br>\r\nCazador pesado: 7<br>\r\nCrucero: 30<br>\r\nAcorazado: 50<br>\r\nBuque colonia: 100<br>\r\nReciclador: 30<br>\r\nSonda espía: 1/10<br>\r\nBomber: 100<br>\r\nDestructor: 100<br>\r\nEstrella de la Muerte: 1/10</p>"
      title: Sistema de combate de la Alianza
    '3':
      body: "<p>Se puede crear una luna si se crea un campo de escombros de al menos 100.000 unidades, lo que supone un 1% de posibilidades de que haya una luna. Sin embargo, la probabilidad máxima de luna es sólo del 20%, por muy grande que sea la TF.</p>\r\n<h3>General</h3>\r\n<p>Las lunas pueden renombrarse como los planetas, salvo que siempre hay un \"(luna\" después del nombre. Puedes tener un máximo de una luna por planeta. La ventaja de las lunas es que son invisibles para los demás, por lo que se debe disparar a una luna relativamente pronto. En la luna puedes construir una fábrica de robots, un astillero de naves espaciales, un almacén de metales, un almacén de cristales, un tanque de deuterio, un depósito de alianzas, una base lunar, una falange de sensores y una puerta de salto.</p>\r\n<h3>Disparo a la luna</h3>\r\n<p>Un disparo a la luna es la destrucción deliberada de naves para crear un campo de escombros. Para ello se utilizan sobre todo cazas ligeros, exactamente 1667, para que tengas un 20% de posibilidades. Se utilizan los LJ porque son relativamente fáciles de destruir y porque se acercan mucho a la probabilidad del 20%. En el caso de los disparos a la luna, hay que tener en cuenta que si el más fuerte destruye el LJ del más débil, sólo éste podrá eliminar el TF. Y si el más débil ataca al más fuerte con barcos a destruir, entonces de nuevo sólo el más débil puede reducir la TF, de lo contrario sería empujar.</p>\r\n<p>En un Deff into TF Uni, es mejor construir defensas y luego aplastarlas en varias oleadas para poder hacer varios intentos de luna seguidos. Para ello, se recomiendan los lanzacohetes 3334 o los cañones láser ligeros 3334.</p>\r\n<p>Cuando se forma una luna, dice el KB, \"las enormes cantidades de metal y cristal libres se atraen y forman un satélite alrededor del planeta.</p>\r\n<p>Probabilidad lunar entre 1% y 19% ' Probabilidad lunar de tamaño aleatorio es 20% ' Luna de más de 8000km de diámetro.<br>\r\nUna luna nunca puede tener más de 8944 km de diámetro.</p>\r\n<h3>Edificios y desarrollo</h3>\r\n<p>Los edificios son, como ya se ha escrito anteriormente, la fábrica de robots, el astillero de naves espaciales, el almacén de metal, el almacén de cristal, el tanque de deuterio, el depósito de alianzas, la base lunar, la falange de sensores y la puerta de salto. Sin embargo, nunca debes construir los tanques y almacenes, ya que no tienen sentido en la luna porque de todos modos no se produce nada. Tampoco deberías construir el astillero espacial, porque también es inútil construir naves y defensa en la luna, debido a los largos tiempos de construcción. Con el depósito de la alianza, es discutible que tenga sentido construirlo, pero reaviva campos valiosos.<br>\r\nLos tres edificios especiales de la Luna son:</p>\r\n<ul><li><p><b>Base lunar</b><br>Se utiliza para crear nuevos campos cultivables, por nivel desarrollado obtienes 3 nuevos campos en la luna, uno de los cuales debe ocupar la base del siguiente nivel.</p></li>\r\n<li><p><b>Falange del sensor</b><br>Se utiliza para comprobar en planetas enemigos qué movimientos de naves tienen en ese momento, pero esto se aplica a planetas y no a lunas. El alcance aumenta con cada nivel mejorado.</p></li>\r\n<li><p><b>Puerta de salto</b><br>Con la puerta de salto, puedes transferir naves de una luna a otra sin perder tiempo, pero no puedes llevarte ningún recurso. Un 1 debe pasar entre 2 saltos, de lo contrario la puerta de salto se sobrecalienta.</p></li></ul>\r\n<p>A continuación se presenta una lista de la construcción óptima de una luna:<br>\r\n<b>Leyenda:</b><br>\r\nMB – Base lunar<br>\r\nSP – Falange del sensor<br>\r\nST – Puerta de salto<br>\r\nRB – Fábrica de robots</p>\r\n<p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>\r\nPuede seguir ampliando SP según esta lista si lo desea o dispone de recursos suficientes. También puedes volver a salir de la fábrica de robots y seguir ampliando SP.</p>\r\n<h3>Destrucción</h3>\r\n<p>Una luna también puede volver a destruirse, pero sólo con desgarros (estrellas de la muerte).</p>\r\n<p>En el menú de órdenes, selecciona \"Destruir\" en lugar de \"Atacar\". Sin embargo, la flota en la luna primero debe ser destruida por el Rip antes de que pueda intentar destruir la luna. Por supuesto, los rips también pueden destruirse al destruir la propia luna, aunque hayan sobrevivido a la batalla. Lo especial de destruir la Luna es que no se crea TF.</p>\r\n<h3>Luna ataca con estrellas de la muerte:</h3>\r\n<p>La probabilidad de destrucción lunar es \"(100 - raíz(tamaño lunar)) * raíz(Número de RIPs)\". La probabilidad de que las Estrellas de la Muerte enviadas al ataque sean destruidas en el ataque lunar es \"Raíz(Tamaño de la Luna) / 2\". Cuanto más grande es la luna, más arriesgado es el intento de destruirla.</p>\r\n<h3>Posibilidad de luna y tamaño de la luna:</h3>\r\n<p>100.000 unidades TF dan un 1% de probabilidad lunar. Probabilidad lunar máxima: 20%. Desde un cambio, todos los propietarios de lunas disponen del número máximo de campos cultivables (79). <br>\r\nAnteriormente se calculaba del siguiente modo:<br>\r\nCampos máximos = REDONDO((diámetro de la luna/1000)2)<br>\r\nLa luna más grande posible: 8944 km de diámetro, es decir, 79 campos.</p>"
      title: Lunas
    '4':
      body: "<h3>¿Cómo se forma una alianza?</h3>\r\n<p>Para fundar una alianza, haga clic en \"Alianzas\" en el menú de la izquierda. A continuación, haz clic en \"Crea tu propia alianza\". En el siguiente menú tienes que introducir una \"etiqueta de alianza\" y un nombre de alianza, la \"etiqueta de alianza\" es la abreviatura de tu alianza. A modo de ejemplo: Si llamas a tu alianza \"The Top Ally\", una posible etiqueta de alianza sería \"DTA\".<br>\r\nTenga en cuenta que no se permiten caracteres especiales, sólo letras, números y espacios.<br>\r\nUna vez que haya introducido la etiqueta de la alianza y un nombre, haga clic en \"Encontrado\".<br>\r\nSi ya existe una alianza con este nombre o etiqueta, recibirá el mensaje correspondiente, en cuyo caso deberá pensar en otra etiqueta de alianza o en otro nombre.<br>\r\nSi la alianza se ha fundado con éxito, también se le mostrará esto. Si a continuación haces clic en \"Siguiente\", llegarás al menú de alianzas aún vacío, al que ahora puedes acceder haciendo clic en \"Alianzas\" en el menú de la izquierda. Allí verá varias opciones de selección e información, en primer lugar la etiqueta y el nombre de su alianza.</p>\r\n<p>A continuación encontrará los siguientes enlaces:<br>\r\n\"Lista de miembros\": En la lista de miembros puedes ver a todos los miembros de tu alianza, con sus puntos, las coordenadas de su planeta de origen y la fecha en que se unieron, así como su estado en línea. Puede cambiar el orden de clasificación haciendo clic en los títulos de las columnas.<br>\r\n\"Tu rango\": Aquí está el nombre de tu rango, al lado encontrarás el enlace al menú de administración de la alianza, más sobre esto en un momento.<br>\r\n\"Correo circular\": Haciendo clic en \"Enviar correo circular\" puedes enviar un mensaje a toda la alianza o sólo a determinados rangos.</p>\r\n<h3>El menú de gestión de alianzas</h3>\r\n<p>En la parte superior del menú de administración de la alianza hay un enlace \"Establecer derechos\". Aquí puedes establecer los derechos de los distintos rangos, por ejemplo, el derecho a disolver la alianza o a enviar circulares. Debajo encontrará el enlace \"Gestionar miembros\". Aquí puedes expulsar miembros de la alianza, asignarles rangos y también ver cuántos días llevan sin entrar en sus cuentas. Con los dos botones bajo el enlace \"Gestionar miembros\" puedes cambiar la etiqueta de la alianza y el nombre de la alianza.<br>\r\nPuedes cambiar los textos de la alianza en \"Gestión de textos\". El texto externo es visible para todos los jugadores, el texto interno sólo para los miembros de tu alianza. El texto de la solicitud es una especie de plantilla para las personas que soliciten su alianza.<br>\r\nEn los ajustes puedes enlazar una imagen que se mostrará en la página de la alianza e introducir un enlace a un foro de la alianza si tienes uno. También puede especificar si las solicitudes son posibles o no, y qué nombre de rango desea utilizar como fundador. Si no introduces nada ahí, el nombre de tu rango será \"Fundador\".<br>\r\nCon \"Disolver alianza\" puedes lógicamente disolver la alianza, y con \"Asignar/tomar el control de alianza\" puedes traspasar la alianza a otro miembro de la alianza, que obtiene entonces el estatus de fundador.</p>"
      title: Alianzas
    '5':
      body: "<h3>¿Dónde puedo encontrar más información?</h3>\r\n<p>Inglés:<br>\r\n<a href=\"https://www.owiki.de/index.php/Aufbautaktik\" target=\"_blank\">Guía de inicio (alemán)</a><br>\r\n<a href=\"https://www.owiki.de/index.php/Miner\" target=\"_blank\">Estilo de juego: Minero (alemán)</a> <br>\r\n<a href=\"https://www.owiki.de/index.php/Raideraccount\" target=\"_blank\">Estilo de juego: Fleeter (alemán)</a> <br>\r\n<a href=\"https://www.owiki.de/index.php/Comber\" target=\"_blank\">Estilo de juego: Comber (alemán)</a> <br>\r\n<a href=\"https://www.owiki.de/index.php/Saven\" target=\"_blank\">Guardar (alemán)</a></p>\r\n<p>English:<br>\r\n<a href=\"https://ogame.fandom.com/wiki/Quick_Start_Guide\" target=\"_blank\">Guía de inicio rápido (inglés)</a><br>\r\n<a href=\"https://ogame.fandom.com/wiki/Playing_Styles\" target=\"_blank\">Estilos de juego (Minero, Fleeter, Comber)(inglés)</a><br>\r\n<a href=\"https://ogame.fandom.com/wiki/Fleetsaving\" target=\"_blank\">Guardar (inglés)</a></p>"
      title: Enlaces
    category: Información avanzada
