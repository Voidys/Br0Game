faq_overview: FAQ
questions:
  '1':
    '1':
      body: |-
        <p>Aquí repasamos los edificios principales: qué construir primero y para qué sirve cada uno. Un imperio próspero empieza por construirlos en un orden sensato.</p>
        <h3>Planta de energía solar</h3>
        <p>Constrúyela primero. Las minas necesitan energía para producir metal, cristal y deuterio. Cuando la planta esté terminada, la barra de recursos y la página de Producción te mostrarán cuánta energía tienes.</p>
        <h3>Mina de metal</h3>
        <p>El metal es uno de los tres recursos. Casi todo lo que construyes o investigas cuesta metal, así que ampliar esta mina es prioritario. Al principio, mantenla varios niveles por encima de tus otras minas.</p>
        <h3>Mina de cristal y sintetizador de deuterio</h3>
        <p>El cristal se usa en edificios, naves e investigaciones. Produces menos que de metal, y por eso vale más; más adelante suele ser muy disputado. El deuterio es el combustible de tus flotas, se puede quemar para obtener energía en la planta de fusión y hace falta para varios edificios e investigaciones importantes (entre ellos el laboratorio de investigación).</p>
        <p>Más información: <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>
      title: Paso 1
    '2':
      body: |-
        <p>Para hacer crecer tu imperio e interactuar con otros jugadores necesitas más edificios. Con la investigación y un hangar podrás empezar a montar una flota y la defensa de tu planeta.</p>
        <h3>Hangar</h3>
        <p>Aquí se construyen todas las naves (y las defensas). El hangar está disponible muy pronto, pero muchas clases de nave siguen requiriendo más investigación. El menú Tecnología muestra los requisitos de cada nave y defensa. Cuanto más alto sea el nivel del hangar, más rápido se construye.</p>
        <h3>Laboratorio de investigación</h3>
        <p>Aquí se inician las investigaciones. Desbloquean edificios, naves, defensas y más investigaciones, y algunas tecnologías además dan bonificaciones a lo que ya tienes. Ampliar el laboratorio acelera las investigaciones.</p>
        <h3>Fábrica de robots</h3>
        <p>La fábrica de robots es imprescindible. Los niveles altos reducen el tiempo de construcción de edificios y aceleran también la producción de naves. Cuando los tiempos de construcción se disparen, amplía la fábrica de robots para volver a reducirlos.</p>
      title: Paso 2
    '3':
      body: '<p>Aquí vemos cómo defender tu planeta y tus primeros movimientos de flota: cómo enviar flotas y cómo tratar con otros jugadores.</p>
      
        <h3>Vista de galaxia</h3>
      
        <p>Sirve para encontrar a otros jugadores. Ves detalles de otros planetas y puedes enviar parte de tu flota directamente desde esta vista. También puedes escribir mensajes a los jugadores o espiar un planeta si tienes sondas de espionaje disponibles.</p>
      
        <h3>Enviar flotas</h3>
      
        <p>Puedes enviar flotas desde la vista de galaxia o desde el menú Flotas. Primero elige cuántas naves de cada tipo enviar. Después fija el destino (coordenadas de la vista de galaxia) y la velocidad. Por último, elige la misión: Atacar, Desplegar, Mantener, Reciclar o Transportar, por ejemplo.</p>
      
        <h3>Defensa</h3>
      
        <p>Cuando tengas un hangar, también podrás construir defensas. Protegen el planeta y luchan junto a la flota que haya presente cuando llegue un ataque. A diferencia de las naves, alrededor del 70% de las defensas destruidas se reparan tras el combate.</p>'
      title: Paso 3
    category: Consejos para principiantes
  '2':
    '1':
      body: |-
        <h3>Saqueo</h3>
        <p>Saquear es atacar a otros jugadores para quedarte con sus recursos. Tipos habituales:</p>
        <ul>
        <li>Saqueo de granjas</li>
        <li>Ataque a flotas</li>
        <li>Saqueo de campos de escombros</li>
        <li>Interceptación</li>
        </ul>
        <h3>Saqueo de granjas</h3>
        <p>Son los ataques más comunes en un universo. Espías los planetas cercanos y envías flotas pequeñas con capacidad de carga y potencia de fuego suficientes para romper una defensa ligera y seguir saliendo ganando: los recursos robados deben superar el deuterio gastado más tus propias pérdidas.</p>
        <h3>Ataque a flotas</h3>
        <p>La élite del saqueo: cazar las flotas de otros jugadores. Además de las sondas de espionaje y algo de suerte, cuentan el Sensor Phalanx y un buen timing. Cuando detectas una flota que merece la pena, aún tienes que alcanzarla y reciclar los escombros. Suele ser difícil, porque las flotas rentables pueden superar la capacidad de tus recicladores: entonces tendrás que coordinar recicladores y, si hace falta, aliados de ataque grupal, además de la flota de combate.</p>
        <h3>Saqueo de campos de escombros</h3>
        <p>La forma más fácil y menos popular de sacar beneficio: recoger los campos de escombros que han creado otros jugadores. Los escombros son de quien los recoge, así que robar campos es una fuente habitual de enemistades.</p>
        <h3>Interceptación</h3>
        <p>El trabajo de un fleeter es construir flota y destruir flota. No siempre encontrarás naves paradas, así que cazar a buenos jugadores suele significar interceptarlos mientras hacen fleetsave o mientras vuelan a atacar. No es fácil; hay formas de defenderse.</p>
        <ul>
        <li><p>Una luna facilita interceptar, porque un Sensor Phalanx puede escanear los movimientos de flota en los planetas a su alcance (no en lunas). Si encuentras una flota que merece la pena, calcula su tiempo de vuelo restante, sobre todo el de regreso una vez llegue. Los niveles de motor (de combustión, de impulso, propulsor hiperespacial) de un informe de espionaje bastan para calcularlo, a mano o con una calculadora de tiempos de vuelo. Un reloj preciso ayuda. Sincroniza tu flota y tus recicladores para llegar unos 3–5 segundos después del objetivo a su planeta o luna. Los recicladores también hay que sincronizarlos.</p></li>
        <li><p>Para interceptar una flota que vuela de una luna a un campo de escombros necesitas una hora de salida aproximada. Crea un campo de escombros visible donde creas que van a recoger (por ejemplo con sondas de espionaje). Calcula cuánto tarda su flota en llegar, vigila el sistema y recarga hasta que el campo desaparezca. Anota esa hora, suma su vuelo de regreso y sincroniza tu flota y tus recicladores unos segundos por detrás de esa llegada.</p>
        <p><b>Nota:</b> no siempre funciona. Un contraataque habitual es enviar antes un reciclador para limpiar el campo.</p></li>
        <li>Otra forma de interceptar es mantener posición en el planeta de un amigo para protegerlo, obligando a los atacantes a retirarse porque la flota defensora sería demasiado fuerte. Puedes reducir el riesgo de que te cacen así con un escaneo de saveo.</li>
        <li><p>Si un jugador despliega de un planeta a otro y luego retira la flota, esta desaparece del Sensor Phalanx. Observa su patrón de saveo (cuándo sale y cuándo la retira). Cuando esperes la retirada, escanea el planeta con la falange cada segundo. En cuanto la flota desaparezca, anota la hora, suma el vuelo de regreso y llega unos 4–6 segundos más tarde con flota y recicladores.</p>
        <p>Si hace saveo de una luna a un campo de escombros y envía los recicladores por delante, interceptarlo es casi imposible salvo que destruyas la luna. Envía Estrellas de la muerte con la misión Destruir. Cuando la luna haya desaparecido, la flota vuelve al planeta; escanéalo con la falange y entra unos segundos por detrás.</p>
        <p>Todas estas técnicas funcionan mucho mejor si conoces las costumbres del objetivo, por ejemplo un saveo cada noche a las 23:00 o que se conecta al mediodía. Estudia al jugador antes de interceptarlo.</p></li>
        </ul>
        <p>Más en la wiki: <a href="{wiki_url}/wiki/En/Saven" target="_blank">Saveo de flotas</a>, <a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">Sensor Phalanx</a>.</p>
      title: Saqueo
    '2':
      body: '<h3>Atacar con SAC</h3>
      
        <p>Para atacar en grupo, primero envía una flota con la misión Atacar al objetivo. Cuando haya despegado, abre el menú Flotas y pulsa Federación para convertir esa flota en un grupo SAC. Allí puedes renombrar el grupo e invitar a otros jugadores; quien inició el ataque queda invitado automáticamente. Después, cada jugador invitado envía sus propias naves a las mismas coordenadas con la misión Ataque grupal.</p>
      
        <p>El grupo siempre vuela lo que tarde la flota participante más lenta. Las flotas más rápidas que se unen después no acortan el tiempo restante. Las más lentas lo alargan hasta su propio tiempo de vuelo. Normalmente pueden unirse como máximo 5 jugadores y 16 flotas a un ataque SAC (los ajustes del universo pueden variar). Una flota que se une puede alargar el tiempo de vuelo restante un 30% como máximo. Si quedan 100 minutos, la flota que se une puede tardar 130 minutos como mucho.</p>
      
        <p><b>Atención:</b> si el fundador del SAC retira su flota, todas las flotas del grupo se retiran también.</p>
      
        <h3>Defender con SAC</h3>
      
        <p>Si te atacan, los miembros de tu alianza y tus amigos pueden ayudarte. Envían una flota a las coordenadas atacadas, eligen cuánto tiempo quedarse y usan la misión Mantener. Además del deuterio del vuelo, al despegar se cobran costes extra de espera según el tamaño de la flota y la duración. Mientras mantienen posición, luchan en todos los combates de ese planeta o luna y aparecen en los informes de espionaje como si fueran tus naves. Sincroniza las esperas para llegar poco antes que el atacante, de modo que un escaneo de saveo tenga menos probabilidades de verlas. Quien mantiene posición puede retirar su flota desde el menú Flotas en cualquier momento; si no, la flota espera el tiempo fijado y vuelve a casa.</p>
      
        <h3>Deuterio por cada hora de espera</h3>
      
        <p>Nave pequeña de carga: 5<br>
      
        Nave grande de carga: 5<br>
      
        Cazador ligero: 2<br>
      
        Cazador pesado: 7<br>
      
        Crucero: 30<br>
      
        Nave de batalla: 50<br>
      
        Colonizador: 100<br>
      
        Reciclador: 30<br>
      
        Sonda de espionaje: 1/10<br>
      
        Bombardero: 100<br>
      
        Destructor: 100<br>
      
        Estrella de la muerte: 1/10</p>'
      title: Ataque grupal (SAC)
    '3':
      body: '<p>Una luna puede formarse cuando se crea un campo de escombros de al menos 100.000 unidades (1% de probabilidad de luna). La probabilidad tiene un tope del 20%, por grande que sea el campo.</p>
      
        <h3>General</h3>
      
        <p>Las lunas se pueden renombrar como los planetas, pero «(Luna)» se queda en el nombre. Solo puedes tener una luna por planeta. Una luna te permite hacer saveo fuera de la vista de un Sensor Phalanx, así que conviene tener una relativamente pronto. En una luna puedes construir fábrica de robots, hangar, almacén de metal, almacén de cristal, contenedor de deuterio, depósito de la alianza, base lunar, Sensor Phalanx y salto cuántico.</p>
      
        <h3>Lunazo</h3>
      
        <p>Un lunazo es la destrucción deliberada de naves para crear un campo de escombros. Lo habitual es usar cazadores ligeros: con el 30% de la flota y el 0% de la defensa pasando a escombros, 1.667 cazadores ligeros dan una probabilidad de luna del 20%. Son baratos de perder y se quedan muy cerca del tope. Si un jugador fuerte destruye cazadores ligeros de uno más débil, cualquiera puede recoger los escombros. Si uno débil ataca a uno fuerte con naves pensadas para morir, solo el débil puede recogerlos; si no, es pusheo. Las lunas y los intentos de luna entran en las reglas de pusheo.</p>
      
        <p>En un universo donde la defensa también genera escombros, suele ser mejor construir defensa y dejar que la destruyan en varias oleadas para hacer varios intentos de luna. 3.334 lanzamisiles o 3.334 láseres pequeños son una opción habitual.</p>
      
        <p>Cuando se forma una luna, el informe de combate dice que las enormes cantidades de metal y cristal libres se atraen y forman un satélite alrededor del planeta.</p>
      
        <p>Probabilidad de luna entre el 1% y el 19%: tamaño aleatorio. Probabilidad de luna del 20%: más de 8.000 km de diámetro. Una luna nunca supera los 8.944 km.</p>
      
        <h3>Edificios</h3>
      
        <p>Normalmente no compensa construir almacenes en una luna, porque allí no se produce nada. Un hangar tampoco suele ser útil: los tiempos de construcción son largos y puedes construir naves en el planeta. El depósito de la alianza es discutible; además ocupa casillas valiosas.</p>
      
        <p>Los tres edificios exclusivos de la luna son:</p>
      
        <ul>
      
        <li><p><b>Base lunar</b><br>Aumenta las casillas construibles: 3 por nivel, una de las cuales la ocupa la siguiente mejora de la base lunar.</p></li>
      
        <li><p><b>Sensor Phalanx</b><br>Muestra los movimientos de flota en planetas enemigos (no en lunas). El alcance aumenta con cada nivel.</p></li>
      
        <li><p><b>Salto cuántico</b><br>Mueve naves al instante de una luna a otra. Los recursos no pueden acompañarlas. Tras un salto, la puerta necesita tiempo para enfriarse (normalmente una hora) o se sobrecalienta.</p></li>
      
        </ul>
      
        <p>Un orden de construcción habitual para una luna:<br>
      
        <b>Leyenda:</b><br>
      
        MB – Base lunar<br>
      
        SP – Sensor Phalanx<br>
      
        ST – Salto cuántico<br>
      
        RB – Fábrica de robots</p>
      
        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>
      
        Después puedes seguir ampliando el Sensor Phalanx si tienes recursos. También puedes derribar algunos niveles de la fábrica de robots y dedicar esas casillas a la falange.</p>
      
        <h3>Destrucción</h3>
      
        <p>Una luna solo se puede destruir con Estrellas de la muerte. En el menú de misión elige Destruir en lugar de Atacar. Antes hay que destruir cualquier flota que haya en la luna; las Estrellas de la muerte que sobrevivan aún pueden perderse al destruir la propia luna. Destruir una luna no crea campo de escombros.</p>
      
        <h3>Ataques a lunas con Estrellas de la muerte</h3>
      
        <p>Probabilidad de destruir la luna: (100 − raíz(tamaño de la luna)) × raíz(número de Estrellas de la muerte). Probabilidad de que se destruyan las Estrellas de la muerte atacantes: raíz(tamaño de la luna) / 2. Cuanto mayor es la luna, más arriesgado es destruirla.</p>
      
        <h3>Probabilidad y tamaño de la luna</h3>
      
        <p>100.000 unidades de escombros dan una probabilidad de luna del 1%. Probabilidad máxima: 20%. Tras un cambio posterior, todas las lunas tienen el número máximo de casillas construibles (79). Antes era REDONDEAR.MENOS((diámetro / 1000)²). La luna más grande posible: 8.944 km de diámetro, 79 casillas.</p>
      
        <p>Más en la wiki: <a href="{wiki_url}/wiki/En/Mond" target="_blank">Lunas</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>'
      title: Lunas
    '4':
      body: |-
        <h3>¿Cómo fundo una alianza?</h3>
        <p>Abre Alianza en el menú de la izquierda y pulsa Crear tu propia alianza. Introduce una etiqueta de alianza (la abreviatura) y un nombre. Ejemplo: una alianza llamada «The Top Ally» podría usar la etiqueta «DTA».</p>
        <p>Solo se admiten letras, números y espacios. Tras introducir etiqueta y nombre, pulsa Crear. Si ese nombre o etiqueta ya existe, recibirás un error y tendrás que elegir otro. Si todo sale bien, verás una confirmación; Continuar abre tu menú de alianza, aún vacío, al que siempre puedes volver desde Alianza en el menú de la izquierda. Arriba verás tu etiqueta y tu nombre.</p>
        <p>Debajo encontrarás:<br>
        Miembros: todos los miembros con sus puntos, las coordenadas de su planeta principal, fecha de ingreso y estado de conexión. Pulsa en los encabezados de columna para ordenar.<br>
        Tu rango: el nombre de tu rango, más un enlace a la administración de la alianza.<br>
        Mensajes globales: envía un mensaje a toda la alianza o a rangos concretos.</p>
        <h3>Administración de la alianza</h3>
        <p>En Rangos defines los derechos de cada rango, por ejemplo disolver la alianza o enviar mensajes globales. En Miembros puedes expulsar jugadores, asignar rangos y ver cuántos días llevan desconectados. También puedes cambiar la etiqueta y el nombre de la alianza.</p>
        <p>Textos edita los textos de la alianza. El texto externo lo ve cualquier jugador; el interno, solo los miembros. El texto de solicitud es una plantilla para quienes se postulan.</p>
        <p>En Opciones puedes enlazar una imagen de cabecera y un foro de la alianza, decidir si se aceptan solicitudes y fijar el nombre del rango de fundador. Si lo dejas vacío, el rango será Fundador.</p>
        <p>Puedes disolver la alianza o traspasarla a otro miembro, que pasa a ser el fundador.</p>
      title: Alianzas
