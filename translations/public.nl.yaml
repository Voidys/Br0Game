home_meme_alt: Stripmeme van het commandodek van {game_name}
home_meme_alt_deep_space_transit: 'Strip: twee cadetten in een shuttle – de één zakt in elkaar bij het zien van een asteroïdenveld, de ander grijnst bij een gloeiende nevel. “Standaard sectorpatrouilles vs. een onontdekte, grondstofrijke nevel vinden.”'
home_meme_alt_deuterium_joyride: 'Strip: een vermoeide commandant op het observatiedek kijkt toe hoe twee rekruten buiten rondzweven – “Kijken hoe de nieuwe rekruten al hun deuterium verspillen aan een ritje buiten, terwijl ik 12 uur op mijn mijnupgrades wacht.”'
home_meme_alt_enemy_fleet: 'Strip: een cadet grijpt in paniek naar zijn hoofd terwijl alarmen flitsen – “1000 vijandelijke vernietigers onderweg?! Ik dacht dat deze sector veilig was?!”'
home_meme_alt_fleet_decimated: 'Strip: een geschokte soldaat staart voor zich uit terwijl schepen buiten een verbrijzelde koepel exploderen – “Als je 20 uur grondstoffen hebt gefarmd en dan de vloot van een top-3-speler binnenspringt en alles in 3 seconden sloopt.”'
home_meme_alt_solo_scouting: 'Strip: commandant Kamioka grijnst en legt een robotarm op de schouder van een cadet – “Maak je geen zorgen, cadet. Het Opperbevel heeft ‘volledig’ vertrouwen in je solo-verkenningsmissie de ruimte in.”'
home_meme_alt_this_is_fine: 'Strip: een hond in een ruimtepak zit rustig in een brandende commandopost en zegt “Dit is prima” – “Geen zorgen. Mijn vloot is maar 4 uur te laat terug.”'
