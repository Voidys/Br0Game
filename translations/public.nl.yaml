registerWelcomePMText: Welkom bij %s! Bouw eerst een zonne-energiecentrale, want je hebt energie nodig om grondstoffen te produceren. Open Gebouwen in het linkermenu en begin met de zonne-energiecentrale.<br>Zodra je energie hebt, kun je mijnen bouwen. Blijf in Gebouwen en bouw een metaalmijn, daarna een kristalmijn.<br><br>Voor het bouwen van schepen heb je een werf nodig. Het menu Technologieën aan de linkerkant laat zien wat je daarvoor nodig hebt.<br>Heb je nog vragen? Kijk in de FAQ, de wiki of open een supportticket.<br><br>Het team wenst je veel plezier bij het verkennen van het universum!
