sys_attacker_won: >-
  Agresor wygrał bitwę, jego statki lądują w stolicy, a dowódca przyjmuje
  upokarzającą przegranego defiladę zwycięskich wojsk.
sys_both_won: >-
  Bitwa nie przyniosła rozstrzygnięcia! Zmęczone floty wracają do swoich baz by
  dokonać niezbędnych napraw
sys_colo_allisok: >-
  Jedna z twoich flot osiągnęła koordynaty %s. Rozpocząłeś kolonizację nowej
  planety. To kolejny krok do ostatecznego triumfu naszego wspaniałego Imperium.
sys_colo_badpos: >-
  Jedna z twoich flot osiągnęła koordynaty %s. Brak możliwości kolonizacji, twoi
  kolonizatorzy wracają rozczarowani.
sys_colo_defaultname: Kolonia
sys_colo_maxcolo: >-
  Jedna z twoich flot osiągnęła koordynaty %s. Kolonizacja okazała się
  niemożliwa, możesz mieć tylko %d planet, przy tak niskiej znajomości
  astrofizyki.
sys_colo_mess_from: Kolonizacja
sys_colo_mess_report: Raport kolonizacji
sys_colo_notech: >-
  Jedna z twoich flot doleciała na %s. I okazało się, że nie możemy zasiedlić
  tej planety. Nasza znajomość Astrofizyki jest zbyt niska, żebyśmy mogli żyć w
  tak niesprzyjających warunkach!
sys_colo_notfree: >-
  Jedna z twoich flot osiągnęła koordynaty %s. Po dotarciu na miejsce okazało
  się, że planeta została wcześniej skolonizowana, przez kogoś innego.
  Kolonizatorzy wracają do domu kompletnie zdemoralizowani.
