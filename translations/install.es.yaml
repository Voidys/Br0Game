req_desc: >-
  Antes de que la instalación pueda continuar, Br0Game realizará algunas pruebas
  en la configuración de su servidor y los archivos para asegurarse de que se
  puede instalar y utilizar Br0Game. Por favor, lea cuidadosamente los
  resultados y no van más allá de todas las pruebas necesarias hasta que haya
  sido aprobada. Si desea utilizar cualquiera de las funciones que se enumeran
  en los módulos opcionales, debe asegurarse de que las pruebas adecuadas
  también se pasan.
req_head: Systema Requerido
req_php_need: Versión PHP (min. 5.2.5)
req_php_need_desc: >-
  <strong>Requisitos Previos</strong> — PHP es el lenguaje del lado del
  servidor, Br0Game está escrito en el. Br0Game Esto funciona sin ninguna
  limitación, la versión PHP 5.2.5 previsto.
