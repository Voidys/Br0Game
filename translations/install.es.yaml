install_desc: >-
  Para habilitar la herramienta de instalación, la creación del archivo
  "var/ENABLE_INSTALL_TOOL"<br> El nombre del archivo distingue entre
  mayúsculas y minúsculas y no tiene terminación de tipo de archivo.<br> El
  archivo puede estar vacío. 

  Se eliminará automáticamente una vez completada la instalación o si tiene más
  de una hora.
install_title: La herramienta de instalación está bloqueada
intro_install: Instalación
intro_lang: Idioma
intro_text: >-
  Br0Game es uno de los mejores clones de OGame. <br> Br0Game es la última y más
  estable versión de un servidor basado en Xnova que ah sido desarrollada. Los
  puntos clave de Br0Game son su facilidad, estabilidad, flexibilidad, dinamismo
  y calidad. En Br0Game siempre esperamos a ser más que sus expectativas. <br>
  El sistema de instalación le guiará a través de la instalación o la
  actualización de una versión previa a la última. <br>  Si tiene preguntas o
  problemas, por favor, no dude en comunicarse en nuestro foro de desarrollo y
  soporte. <br> Br0Game es un proyecto de código abierto y está bajo licencia
  GNU GPL v3. Para conocer la licencia, por favor haga click en la opción del
  menú correspondiente. <br> Antes de comenzar la instalación se lleva a cabo
  una prueba para saber si el servidor cumple los requisitos mínimos.
intro_upgrade_head: Br0Game ya instalado?
intro_upgrade_text: >-
  <p>Br0Game ya está instalado y sólo desea actualizarlo?</p>Aquí usted puede
  actualizar su base de datos antigua con unos pocos clics</p>
