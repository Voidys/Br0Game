step1_desc: >-
  Ahora que se ha determinado que Br0Game se puede utilizar en su servidor, debe
  proporcionar cierta información. Si usted no sabe cómo los datos están
  conectados a la base de datos, por favor póngase en contacto con su proveedor
  de hosting, como la primera o la espalda en los foros de soporte de Br0Game.
  Al introducir datos, por favor revise esto cuidadosamente antes de continuar.
