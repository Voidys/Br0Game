tutorial_text:
  step0: "Bienvenue sur {game_name} !<br><br>\r\nCe didacticiel va te montrer les bases du jeu.<br>\r\nSouvent, des informations complémentaires sont disponibles sur notre Wiki, car tous les aspects du jeu ne peuvent pas être expliqués dans le didacticiel. \r\nTu peux accéder au Wiki à tout moment via le menu de gauche.<br>\r\nTu peux sauter le didacticiel à tout moment, mais il ne sera alors plus accessible.<br><br>\r\nBonne chance, Empereur !"
  step1: "Dans ce jeu, l’objectif est d’obtenir le plus de points possible. On obtient un point pour chaque 1 000 ressources dépensées.\r\nCes ressources peuvent être obtenues de différentes manières. La principale est la production de tes mines.<br>\r\nAssure-toi d’abord de bien établir ta base de ressources. Pour cela, tu as besoin de métal et de cristal, produits par les mines correspondantes. Pour que celles-ci fonctionnent, il te faudra également de l’énergie produite par la centrale solaire.\r\nSi l’énergie est insuffisante, la production ne fonctionnera pas à 100 %.<br>\r\nCes bâtiments peuvent être améliorés via le menu <b>Bâtiments</b>. En cliquant sur le nom d’un bâtiment, tu verras en quoi l’amélioration augmentera ta production de ressources. \r\nTu pourras aussi voir la quantité d’énergie consommée par le niveau suivant.<br><br>\r\nPour plus d’infos, consulte le <b>Wiki</b> : \r\n<a href=\"{wiki_url}/wiki/EN/Rohstoffe\" target=\"_blank\">Raw material production</a>"
  step2: "Le jeu est beaucoup plus amusant quand on interagit avec les autres joueurs.\r\nLa plupart d’entre eux se retrouvent sur notre serveur Discord. \r\nDans la communauté, tu peux poser des questions et trouver d’autres joueurs pour jouer ensemble.<br>\r\nEn cas de problème, tu peux aussi y ouvrir des tickets."
  step3: "Une autre façon d’obtenir des ressources est de piller les planètes d’autres joueurs.<br>\r\nCependant, cela peut aussi t’arriver – alors construis ta première défense !<br>\r\nIl est important d’avoir une défense pour protéger au moins ta production nocturne.<br>\r\nCe n’est pas tant la quantité qui compte, mais la composition de la flotte attaquante.<br>\r\nAvant de pouvoir piller, l’attaquant doit d’abord surmonter ta défense. Plus l’attaquant doit envoyer de vaisseaux, moins son attaque sera rentable.<br>\r\nLes installations de défense se construisent dans le menu <b>Défense</b> et nécessitent un chantier spatial. Celui-ci nécessite également une usine de robots et du deutérium.<br><br>\r\nVoici l’article correspondant dans le Wiki : \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Defense facilities</a>"
  step4: "Assure ta production de base en améliorant tes mines !<br>\r\nLa construction de bâtiments, de vaisseaux et de défenses, ainsi que la recherche, devient de plus en plus coûteuse.\r\nTu devrais donc continuer à développer ta production pour répondre aux besoins de ton empire.\r\nClique maintenant sur Bâtiments et améliore-les dès que tu as suffisamment de ressources."
  step5: "Construis un petit transporteur !<br>\r\nLes petits transporteurs sont une méthode de transport rapide plus tard dans le jeu.<br>\r\nAvec le moteur à impulsion, ils sont souvent plus rapides que les grands transporteurs sur de longues distances.<br>\r\nIls sont utilisés pour transporter des ressources entre tes planètes, commercer avec d’autres joueurs ou les piller.<br><br>\r\nPour plus d’infos, consulte le Wiki : \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Ships</a>"
  step6: "Pour une meilleure organisation, tu peux renommer tes planètes. Clique sur le nom de la planète dans l’onglet de pointage pour l’essayer.<br><br>\r\nTu peux aussi envoyer des demandes d’amitié à d’autres joueurs. Une fois acceptées, elles facilitent la communication et permettent de voir le statut en ligne.<br>\r\nCela ne nécessite pas d’être dans la même alliance. Un autre avantage est de pouvoir stationner des flottes chez un ami, permettant une défense commune.<br><br>\r\nTu peux également rejoindre une alliance pour jouer en groupe. \r\nAu sein de l’alliance, tu peux envoyer des messages de groupe et voir le statut en ligne et les points des membres en fonction de leur rang.<br>"
  step7: "Pour voir les ressources, bâtiments, recherches, vaisseaux et défenses des autres joueurs, espionne-les en envoyant une sonde d’espionnage.<br>\r\nCependant, d’autres joueurs peuvent aussi t’espionner !"
  step8: >-
    Une expédition peut apporter des ressources, des vaisseaux, des événements
    ou des pertes. Pour essayer, prenez un vaisseau et lancez une expédition en
    cliquant sur la coordonnée planétaire 16 et la mission « Expédition » dans
    le menu de la flotte.<br>

    Chaque type de vaisseau ajoutera des points à la taille de la flotte
    d'expédition jusqu'à atteindre la taille maximale de l'événement.<br><br>

    Pour en savoir plus, consulte le Wiki : 

    <a href="{wiki_url}/wiki/En/Expoanleitung"
    target="_blank">Expeditions</a>
  step9: "Pour une production efficace, colonise d’autres planètes. \r\nAinsi, tu pourras produire ou construire des vaisseaux en simultané.<br>\r\nNote que pour coloniser sur les bords internes ou externes d’un système, un certain niveau en astrophysique est requis.\r\nBien que le vaisseau de colonisation puisse être construit sans astrophysique, la première colonie l’exige.<br><br>\r\nColoniser près d’un même système réduit les trajets mais te rend vulnérable aux \"Raider Colos\".<br><br>\r\nPour plus d’informations, consulte le Wiki : \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrophysics</a>"
  step10: "Pour obtenir des ressources rapidement, tu peux attaquer d’autres joueurs. \r\nPense au rapport coût-bénéfice pour que l’attaque soit rentable. Utilise les rapports d’espionnage et un simulateur de combat.<br><br>\r\nAttention ! De nombreuses missions de flotte peuvent être suivies par d’autres joueurs.<br>\r\nProtéger ta flotte est un aspect important du jeu.<br><br>\r\nLis ces articles sur le Wiki : \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensorphalanx</a>"
  step10_u6: >-
    Pour obtenir des ressources rapidement, tu peux attaquer d’autres joueurs. 

    Pense au rapport coût-bénéfice pour que l’attaque soit rentable. Utilise les
    rapports d’espionnage et un simulateur de combat.<br><br>

    Attention ! De nombreuses missions de flotte peuvent être suivies par
    d’autres joueurs.<br>

    Protéger ta flotte est un aspect important du jeu.<br><br>

    Lis ces articles sur le Wiki : 

    <a
    href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Saven</a>
  step11: "La destruction de flottes crée des champs de débris, qui peuvent être collectés avec un recycleur.\r\nUn recycleur peut récupérer jusqu’à 20k de ressources dans un champ de débris. \r\nDétruire une grande flotte peut donc devenir une source précieuse de ressources.<br><br>\r\nAu lieu de passer par le menu Flotte, les recycleurs peuvent aussi être envoyés directement depuis le menu Galaxie en cliquant sur un champ de débris et en sélectionnant le nombre requis."
  step12: "Félicitations, tu as terminé le didacticiel !<br><br>\r\nIl existe encore de nombreuses autres mécaniques dans ce jeu.<br>\r\nPar exemple, il y a essentiellement 3 styles de jeu, chacun avec un investissement en temps différent :<br>\r\n<ul>\r\n<li>Mineur : développe les mines sur de nombreuses colonies et utilise principalement des transporteurs</li>\r\n<li>Flotteur : investit principalement dans des vaisseaux de combat, produit peu lui-même, dépend des raids sur d’autres joueurs</li>\r\n<li>Mixte : une combinaison des deux</li>\r\n</ul>\r\nPlus tard dans le jeu, les lunes deviennent importantes. Tu as déjà découvert la Phalange de capteurs.<br><br>\r\nSi tu as d’autres questions, tu peux consulter le Wiki ou demander de l’aide à la communauté sur Discord."
  step12_u6: >-
    Félicitations, tu as terminé le didacticiel !<br><br>

    Il existe encore de nombreuses autres mécaniques dans ce jeu.<br>

    Par exemple, il y a essentiellement 3 styles de jeu, chacun avec un
    investissement en temps différent :<br>

    <ul>

    <li>Mineur : développe les mines sur de nombreuses colonies et utilise
    principalement des transporteurs</li>

    <li>Flotteur : investit principalement dans des vaisseaux de combat, produit
    peu lui-même, dépend des raids sur d’autres joueurs</li>

    <li>Mixte : une combinaison des deux</li>

    </ul>

    Si tu as d’autres questions, tu peux consulter le Wiki ou demander de l’aide
    à la communauté sur Discord.
tutorial_title:
