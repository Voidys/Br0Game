  step1: Va gagner ta vie !
  step2: Va sociabiliser !
  step3: Ne reste pas à découvert !
  step4: Pense à long terme !
  step5: On a besoin de vaisseaux !
  step6: Donne un nom à ta planète et cherche des amis !
  step7: Regarde ce que les autres ont !
  step8: Part à l’aventure !
  step9: Ne te contente pas d’une seule planète !
  step10: Tu vas attendre longtemps pour produire tes ressources ?
  step11: Joue au recycleur !
  step12: Tu as terminé
