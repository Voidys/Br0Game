faq_overview: 常见问题
questions:
  '1':
    '1':
      body: '<p>这一部分介绍主要建筑：该先建什么，每种建筑有什么用。繁荣的帝国，从按合理的顺序建造开始。</p>

        <h3>太阳能电站</h3>

        <p>最先建它。矿场需要能量才能生产金属、晶体和重氢。电站建成后，资源栏和产量页面会显示你有多少能量。</p>

        <h3>金属矿</h3>

        <p>金属是三种资源之一。你建造或研究的几乎所有东西都要消耗金属，所以扩建金属矿是首要任务。前期让它比其他矿场领先几级。</p>

        <h3>晶体矿和重氢精炼厂</h3>

        <p>晶体用于建筑、舰船和研究。它的产量比金属低，因此更有价值；到了游戏后期，它常常会被激烈争夺。重氢是舰队的燃料，可以在核聚变电站中燃烧发电，也是多种重要建筑和研究（包括研究实验室）的必需品。</p>

        <p>更多信息：<a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">维基</a>。</p>'
      title: 第 1 步
    '2':
      body: '<p>要壮大你的帝国并与其他玩家互动，你需要更多建筑。研究和造船厂能让你组建舰队和星球防御。</p>

        <h3>造船厂</h3>

        <p>所有舰船（和防御设施）都在这里建造。造船厂很早就能建，但许多舰船类别仍需要额外的研究。“科技”菜单列出了每种舰船和防御设施的需求。造船厂等级越高，建造越快。</p>

        <h3>研究实验室</h3>

        <p>研究从这里启动。它能解锁建筑、舰船、防御设施和更多研究，有些技术还会为你已有的东西提供加成。扩建研究实验室可以加快研究速度。</p>

        <h3>机器人工厂</h3>

        <p>机器人工厂不可或缺。等级越高，建筑建造时间越短，舰船生产也越快。建造时间变长时，就扩建机器人工厂把它降下来。</p>'
      title: 第 2 步
    '3':
      body: '<p>这一部分介绍如何保卫你的星球，以及你的第一批舰队行动：怎样派出舰队，怎样与其他玩家打交道。</p>

        <h3>星系视图</h3>

        <p>用它来寻找其他玩家。你可以查看其他星球的详情，并直接在这个视图里派出部分舰队。你也可以给玩家发消息，或者在有间谍探测器可用时侦查某颗星球。</p>

        <h3>派出舰队</h3>

        <p>舰队可以从星系视图或舰队菜单派出。首先选择每种舰船派出多少艘，然后设置目标（星系视图中的坐标）和速度，最后选择任务，例如攻击、部署、驻守、回收或运输。</p>

        <h3>防御</h3>

        <p>有了造船厂，你还可以建造防御设施。它们保护星球，并与攻击到达时在场的所有舰队并肩作战。与舰船不同，被摧毁的防御设施在战斗后约有 70% 会被修复。</p>'
      title: 第 3 步
    category: 新手提示
  '2':
    '1':
      body: '<h3>掠夺</h3>

        <p>掠夺就是攻击其他玩家来夺取他们的资源。常见类型：</p>

        <ul>

        <li>刷资源</li>

        <li>舰队攻击</li>

        <li>残骸场掠夺</li>

        <li>拦截</li>

        </ul>

        <h3>刷资源</h3>

        <p>这是宇宙中最常见的攻击。你侦查附近的星球，派出载货量和火力都足以攻破轻型防御并仍能获利的小型舰队：抢到的资源应该超过消耗的重氢加上你自己的损失。</p>

        <h3>舰队攻击</h3>

        <p>掠夺的高端玩法：猎杀其他玩家的舰队。除了间谍探测器和运气，感应阵和精准的时机也很重要。发现值得打的舰队后，你还得追上它并回收残骸。这往往很难，因为有利可图的舰队可能超出你的回收船载货量——这时你必须协调回收船，必要时还要协调联合攻击的伙伴以及战斗舰队。</p>

        <h3>残骸场掠夺</h3>

        <p>最轻松也最不受欢迎的获利方式：收取其他玩家制造的残骸场。残骸归收取的人所有，所以抢残骸场是结怨的常见原因。</p>

        <h3>拦截</h3>

        <p>舰队玩家的工作就是造舰队、毁舰队。你不会总能找到闲置的舰船，所以抓住高手往往意味着在他们保全舰队或发动攻击的途中拦截。这并不容易，也有办法防范。</p>

        <ul>

        <li><p>月球让拦截更容易，因为感应阵可以扫描范围内星球上的舰队动向（不含月球）。如果发现值得拦截的舰队，就算出它的剩余飞行时间——尤其是抵达之后的返航时间。从间谍报告中得到的引擎等级（燃烧、脉冲、超空间）就足以计算，可以手算，也可以用飞行时间计算器。精确的时钟会有帮助。让你的舰队和回收船在目标抵达其星球或月球后约 3–5 秒到达。回收船也需要掐准时间。</p></li>

        <li><p>要拦截从月球飞往残骸场的舰队，你需要大致的出发时间。在你认为他们会去收取的位置制造一个可见的残骸场（例如用间谍探测器）。计算他们的舰队飞到那里要多久，盯着该星系，不停刷新直到残骸场消失。记下这个时间，加上他们的返航飞行时间，让你的舰队和回收船比该抵达时间晚几秒到达。</p>

        <p><b>注意：</b>这并不总是有效。先派一艘回收船去清空残骸场是常见的反制手段。</p></li>

        <li>另一种拦截形式是驻守在朋友的星球上保护他们，迫使进攻者因为防守舰队过强而撤回。你可以用保全扫描来降低以这种方式被抓的风险。</li>

        <li><p>如果玩家把舰队从一颗星球部署到另一颗然后召回，舰队就会从感应阵上消失。观察他们的保全规律（何时出发、何时召回）。预计会召回时，每秒用感应阵扫描该星球。舰队消失的那一刻，记下时间，加上返航飞行时间，让你的舰队和回收船晚约 4–6 秒到达。</p>

        <p>如果他们从月球保全到残骸场并提前派出回收船，除非你摧毁月球，否则几乎不可能拦截。派出死星，使用摧毁任务。月球被毁后，舰队会返回星球；用感应阵扫描那颗星球，并比他们晚几秒卡进去。</p>

        <p>如果你了解目标的习惯，所有这些技巧的效果都会好得多——比如每晚 23:00 保全，或者中午上线。拦截之前，先研究这名玩家。</p></li>

        </ul>

        <p>维基中有更多内容：<a href="{wiki_url}/wiki/En/Saven" target="_blank">舰队保全</a>、<a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">感应阵</a>。</p>'
      title: 掠夺
    '2':
      body: '<h3>联合攻击</h3>

        <p>要一起进攻，先向目标派出一支任务为“攻击”的舰队。出发后，打开舰队菜单，使用“联合”把这支舰队变成联合攻击编组。你可以在那里重命名编组并邀请其他玩家；发起攻击的玩家会被自动邀请。每位受邀玩家随后以任务“联合攻击”把自己的舰船派往同一坐标。</p>

        <p>编组的飞行时间始终与参与的最慢舰队相同。之后加入的更快舰队不会缩短剩余时间。更慢的舰队会把剩余时间延长到自己的飞行时间。通常一次联合攻击最多可加入 5 名玩家和 16 支舰队（宇宙设置可能不同）。加入的舰队最多可将剩余飞行时间延长 30%。如果还剩 100 分钟，加入的舰队最多只能飞 130 分钟。</p>

        <p><b>警告：</b>如果联合攻击发起者召回，编组中的所有舰队也会被一并召回。</p>

        <h3>联合防御</h3>

        <p>如果你遭到攻击，联盟成员和好友可以来帮忙。他们把舰队派往被攻击的坐标，选择停留多久，并使用任务“驻守”。除了飞行消耗的重氢，出发时还会根据舰队规模和时长收取额外的驻守费用。驻守期间，他们会参加该星球或月球上的每一场战斗，并在间谍报告中显示得就像是你的舰船。让驻守的舰队在进攻者到达前不久抵达，保全扫描就不太容易发现他们。驻守的玩家可以随时在舰队菜单中召回；否则舰队会等驻守时间结束后返航。</p>

        <h3>每驻守 1 小时的重氢消耗</h3>

        <p>小型运输舰：5<br>

        大型运输舰：5<br>

        轻型战斗机：2<br>

        重型战斗机：7<br>

        巡洋舰：30<br>

        战列舰：50<br>

        殖民船：100<br>

        回收船：30<br>

        间谍探测器：1/10<br>

        轰炸机：100<br>

        毁灭者：100<br>

        死星：1/10</p>'
      title: 联合攻击系统
    '3':
      body: '<p>当产生至少 100,000 单位的残骸场时，就有可能形成月球（月球几率 1%）。无论残骸场多大，几率上限为 20%。</p>

        <h3>概述</h3>

        <p>月球可以像星球一样改名，但名字里会保留“（月球）”。每颗星球最多只能有一个月球。有了月球，你就能把舰队保全在感应阵看不到的地方，所以相对早点造一个很值得。在月球上可以建造机器人工厂、造船厂、金属仓库、晶体仓库、重氢罐、联盟太空站、月球基地、感应阵和跳跃门。</p>

        <h3>造月</h3>

        <p>造月就是故意损毁舰船来制造残骸场。通常选用轻型战斗机：当 30% 的舰队和 0% 的防御转为残骸时，1,667 架轻型战斗机能带来 20% 的月球几率。它们损失起来不心疼，又非常接近上限。如果强者向弱者派出轻型战斗机并将其击毁，任何人都可以收取残骸。如果弱者用注定被击毁的舰船攻击强者，则只有弱者可以收取残骸——否则就算是送分。月球和造月尝试适用送分规则。</p>

        <p>在防御也会产生残骸的宇宙中，通常更好的做法是建造防御，让它们分几波被打碎，以获得多次造月机会。3,334 个导弹发射器或 3,334 个轻型激光炮是常见的选择。</p>

        <p>月球形成时，战斗报告会写明：大量游离的金属和晶体聚集在一起，在星球周围形成了一颗卫星。</p>

        <p>月球几率在 1% 到 19% 之间：大小随机。月球几率为 20%：直径超过 8,000 公里。月球直径不会超过 8,944 公里。</p>

        <h3>建筑</h3>

        <p>通常不值得在月球上建仓库，因为那里不生产任何东西。造船厂也很少有用：建造时间很长，而且你可以在星球上造舰船。联盟太空站则存在争议；它还会占用宝贵的空地。</p>

        <p>三种月球专属建筑是：</p>

        <ul>

        <li><p><b>月球基地</b><br>增加可建造的空地：每级 3 个，其中 1 个被下一次月球基地升级占用。</p></li>

        <li><p><b>感应阵</b><br>显示敌方星球（不含月球）上的舰队动向。射程随等级提升。</p></li>

        <li><p><b>跳跃门</b><br>把舰船瞬间从一个月球转移到另一个月球。资源无法随行。跳跃之后，跳跃门需要时间冷却（通常一小时），否则会过热。</p></li>

        </ul>

        <p>常见的月球建造顺序：<br>

        <b>图例：</b><br>

        MB – 月球基地<br>

        SP – 感应阵<br>

        ST – 跳跃门<br>

        RB – 机器人工厂</p>

        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>

        之后，如果资源足够，你可以继续扩建感应阵。你也可以拆掉几级机器人工厂，把腾出的空地用来建感应阵。</p>

        <h3>摧毁</h3>

        <p>月球只能用死星摧毁。在任务菜单中选择“摧毁”而不是“攻击”。月球上的所有舰队必须先被消灭；在摧毁月球本身时，幸存的死星仍可能损失。摧毁月球不会产生残骸场。</p>

        <h3>死星攻击月球</h3>

        <p>摧毁月球的几率：(100 − sqrt(月球大小)) × sqrt(死星数量)。进攻的死星被摧毁的几率：sqrt(月球大小) / 2。月球越大，摧毁起来越危险。</p>

        <h3>月球几率与大小</h3>

        <p>100,000 单位残骸带来 1% 的月球几率。最大几率：20%。经过之后的改动，每个月球都拥有最大数量的可建造空地（79）。此前是 FLOOR((直径 / 1000)²)。可能的最大月球：直径 8,944 公里，79 个空地。</p>

        <p>维基中有更多内容：<a href="{wiki_url}/wiki/En/Mond" target="_blank">月球</a>、<a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">维基</a>。</p>'
      title: 月球
    '4':
      body: '<h3>怎样创建联盟？</h3>

        <p>点击左侧菜单中的“联盟”，然后选择“创建你自己的联盟”。输入联盟标签（简短的缩写）和联盟名称。例如：名为“The Top Ally”的联盟可以使用标签“DTA”。</p>

        <p>只允许使用字母、数字和空格。输入标签和名称后，点击创建。如果该名称或标签已被占用，会提示错误，你需要另选一个。成功后会看到确认信息；点击“继续”会打开尚为空的联盟菜单，之后你随时可以通过左侧菜单的“联盟”进入。顶部显示你的标签和名称。</p>

        <p>下面你会看到：<br>

        成员：每位成员的积分、主星坐标、加入日期和在线状态。点击列标题可以排序。<br>

        你的职位：你的职位名称，以及联盟管理的链接。<br>

        群发消息：向整个联盟或选定职位发送消息。</p>

        <h3>联盟管理</h3>

        <p>“职位”让你为每个职位设置权限，例如解散联盟或发送群发消息。“成员”让你踢出玩家、分配职位，并查看他们已离线多少天。你还可以修改联盟标签和名称。</p>

        <p>“文本管理”用来编辑联盟文本。对外文本所有玩家可见；内部文本只有成员可见。申请文本是给申请者的模板。</p>

        <p>“选项”可以链接横幅图片和联盟论坛，选择是否开放申请，并设置创始人职位名称。如果留空，该职位就叫“创始人”。</p>

        <p>你可以解散联盟，或者把联盟转让给另一名成员，对方随后成为创始人。</p>'
      title: 联盟
