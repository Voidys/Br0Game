op_dlte_account: Account löschen
op_dlte_account_descrip: >-
  Hiermit wird Ihr Konto nach mindestens 7 Tagen automatisch vollständig
  gelöscht. Die endgültige Löschung hängt von der Ausführungszeit des
  Lösch-Cronjobs ab und kann noch ein paar Tage dauern. Die Löschung kann
  gestoppt werden, solange sie noch nicht durchgeführt wurde, d.h. solange Sie
  sich noch in das Konto einloggen können.
