tutorial_text:
  step0: "¡Bienvenido a {game_name}!<br><br>\r\nEste tutorial te mostrará los conceptos básicos del juego.<br>\r\nCon frecuencia, se hace referencia a nuestro Wiki para obtener información adicional, ya que no todos los aspectos del juego se explican en el tutorial. \r\nPuedes acceder al Wiki en cualquier momento a través del menú en el lado izquierdo.<br>\r\nPuedes saltar el tutorial en cualquier momento, pero luego no podrás reiniciarlo.<br><br>\r\n¡Buena suerte, Emperador!"
  step1: "El objetivo de este juego es obtener la mayor cantidad de puntos posible. Obtienes un punto por cada 1.000 recursos gastados.\r\nPuedes obtener estos recursos de diversas maneras. La principal es la producción propia de las minas.<br>\r\nPrimero, asegúrate de tener un suministro básico. Para ello, necesitas metal y cristal de las minas correspondientes. Para que estas funcionen, también necesitas energía del planta de energía solar.\r\nSi no tienes suficiente energía, la producción no alcanzará el 100%.<br>\r\nPuedes mejorar estos edificios en el menú <b>Edificios</b>. Al hacer clic en el nombre del edificio, verás el beneficio de mejorar la producción de recursos. \r\nTambién podrás ver cuánta energía consumirá el siguiente nivel una vez terminado.<br><br>\r\nPara obtener más información, puedes consultar el <b>Wiki</b>:\r\n<a href=\"{wiki_url}/wiki/EN/Rohstoffe\" target=\"_blank\">Raw material production</a>"
  step2: "El juego es mucho más divertido cuando interactúas con otros jugadores.\r\nLa mayoría se organiza a través de nuestro Discord. \r\nEn la comunidad, no solo encontrarás respuestas a tus preguntas, sino que también podrás encontrar otros jugadores para jugar juntos.<br>\r\nSi tienes alguna duda, también puedes abrir tickets aquí."
  step3: "Otra forma de obtener recursos es atacando los planetas de otros jugadores.<br>\r\nSin embargo, esto también puede ocurrirte a ti: ¡construye tu primera defensa!<br>\r\nEs importante tener defensa para proteger al menos tu producción nocturna.<br>\r\nAquí no solo importa la cantidad, sino también la composición de la flota atacante.<br>\r\nAntes de saquear, el atacante primero debe superar tu defensa. Cada nave que envía reduce sus ganancias y aumenta potencialmente sus pérdidas por naves destruidas.<br>\r\nLas instalaciones de defensa se construyen en el menú <b>Defensa</b> utilizando un astillero, que requiere una fábrica de robots y deuterio.<br><br>\r\nAquí tienes el artículo correspondiente en el Wiki:\r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Defense facilities</a>"
  step4: "Asegura tu suministro ampliando tus minas.<br>\r\nLa construcción de edificios, naves y defensa, así como la investigación, se volverán más costosas con el tiempo.\r\nPor lo tanto, debes aumentar tu producción para satisfacer la demanda de recursos de tu planeta.\r\nHaz clic ahora en Edificios y amplía tus instalaciones cuando tengas suficientes recursos."
  step5: "Construye una pequeña nave de transporte.<br>\r\nLos pequeños transportes son una forma rápida de transportar recursos en el juego avanzado.<br>\r\nSi vuelan con un motor de impulso, son más rápidos que los grandes transportes durante largos períodos.<br>\r\nSe utilizan para trasladar recursos entre tus planetas, comerciar con otros jugadores o atacarlos.<br><br>\r\nPara obtener más información, consulta el Wiki:\r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Ships</a>"
  step6: "Para una mejor organización, puedes renombrar tus planetas. Haz clic en el nombre del planeta en la vista general de la barra superior de puntos. Prueba ahora.<br><br>\r\nTambién puedes enviar solicitudes de amigos a otros jugadores. Si aceptan tu solicitud, podrán comunicarse fácilmente y ver el estado en línea de cada uno.\r\nNo es necesario estar en la misma alianza.<br>\r\nOtra ventaja es poder estacionar flotas en el planeta de un amigo para defensa conjunta fuera de una alianza.<br><br>\r\nTambién puedes unirte a una alianza para jugar con más jugadores. \r\nDentro de la alianza, puedes enviar correos grupales y ver el estado en línea y los puntos de otros miembros según el rango de la alianza."
  step7: "Para ver qué recursos, edificios, investigaciones, naves y defensas tienen otros jugadores, debes espiarlos.\r\nEnvía una sonda de espionaje a otro jugador a través del menú de flotas o la galaxia.<br>\r\n¡Otros jugadores también pueden espiarte a ti!"
  step8: >-
    Una expedición puede aportar recursos, naves, eventos o pérdidas. Para
    probarlo, coge una nave y realiza una expedición haciendo clic en la
    coordenada planetaria 16 y en la misión «Expedición» en el menú de la
    flota.<br>

    Cada tipo de nave añadirá puntos al tamaño de la flota de expedición hasta
    un límite en el que se alcanza el tamaño máximo del evento.<br><br>

    Para más información, puedes consultar el Wiki sobre cómo maximizar tus
    ganancias:

    <a href="{wiki_url}/wiki/En/Expoanleitung"
    target="_blank">Expeditions</a>
  step9: "Para una producción rápida, deberías colonizar otros planetas.\r\nAsí podrás producir o construir naves en varios planetas al mismo tiempo.\r\nTen en cuenta que solo puedes colonizar en el borde interno o externo de un sistema si tienes un alto nivel de astrofísica.\r\nAunque puedes construir la nave de colonización sin astrofísica, necesitarás astrofísica para la primera colonia.<br><br>\r\nColonizar en sistemas cercanos mantiene las rutas de transporte cortas, pero también te hace vulnerable en el juego avanzado a jugadores que usan colonias como bases temporales.<br><br>\r\nPara más información, consulta el Wiki:\r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrophysics</a>"
  step10: "Para obtener recursos más rápido, también puedes atacar a otros jugadores.\r\nConsidera la relación costo-beneficio para iniciar un ataque rentable.\r\nUsa los informes de espionaje y el simulador de combate.<br><br>\r\n¡Atención! Muchas misiones de flota pueden ser rastreadas por otros jugadores.<br>\r\nProteger tu flota es uno de los aspectos más importantes del juego.<br><br>\r\nLee estos temas en el Wiki:\r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensorphalanx</a>"
  step10_u6: >-
    Para obtener recursos más rápido, también puedes atacar a otros jugadores.

    Considera la relación costo-beneficio para iniciar un ataque rentable.

    Usa los informes de espionaje y el simulador de combate.<br><br>

    ¡Atención! Muchas misiones de flota pueden ser rastreadas por otros
    jugadores.<br>

    Proteger tu flota es uno de los aspectos más importantes del juego.<br><br>

    Lee estos temas en el Wiki:

    <a
    href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Saven</a>
  step11: "La destrucción de flotas crea un campo de escombros que se puede recolectar.\r\nPara esto, necesitas un reciclador, que puede recoger hasta 20k de recursos del campo de escombros.\r\nDestruir una gran flota puede ser una fuente lucrativa de recursos.<br><br>\r\nEn lugar de usar el menú de flotas, los recicladores también pueden enviarse directamente desde el menú de la galaxia haciendo clic en un campo de escombros en el número adecuado."
  step12: "Felicidades, has completado el tutorial.<br><br>\r\nEste juego ofrece muchas más mecánicas adicionales.<br>\r\nPor ejemplo, existen esencialmente 3 estilos de juego, que también difieren en la cantidad de tiempo requerido:<br>\r\n<ul>\r\n<li>Minero: Expande minas en muchas colonias, utiliza principalmente transportes</li>\r\n<li>Cazador: Alta proporción de puntos en naves de combate, poca producción propia, depende de saquear a otros jugadores</li>\r\n<li>Combinador: Una combinación de ambos estilos</li>\r\n</ul>\r\nMás adelante en el juego, las lunas se vuelven importantes, y ya deberías haber aprendido sobre el sensor Phalanx.<br><br>\r\nSi tienes más preguntas, puedes consultar el Wiki o pedir ayuda a la comunidad en Discord."
  step12_u6: >-
    Felicidades, has completado el tutorial.<br><br>

    Este juego ofrece muchas más mecánicas adicionales.<br>

    Por ejemplo, existen esencialmente 3 estilos de juego, que también difieren
    en la cantidad de tiempo requerido:<br>

    <ul>

    <li>Minero: Expande minas en muchas colonias, utiliza principalmente
    transportes</li>

    <li>Cazador: Alta proporción de puntos en naves de combate, poca producción
    propia, depende de saquear a otros jugadores</li>

    <li>Combinador: Una combinación de ambos estilos</li>

    </ul>

    Si tienes más preguntas, puedes consultar el Wiki o pedir ayuda a la
    comunidad en Discord.
