registerWelcomePMText: >-
  Maligayang pagdating sa %s! Una, magtayo ng Solar Power Plant, dahil kailangan
  ng energy para makagawa ng resource. Buksan ang Buildings sa menu sa kaliwa
  at simulan sa Solar Power Plant.<br>Kapag may energy ka na, puwede ka nang
  magtayo ng mga mine. Manatili sa Buildings at magtayo ng Metal Mine, tapos
  Crystal Mine.<br><br>Para makagawa ng mga barko, kailangan mo ng Shipyard.
  Ipinapakita ng Technologies menu sa kaliwa kung ano ang kailangan para ma-unlock
  ito.<br>Kung may iba ka pang tanong, tingnan ang FAQ, ang wiki, o magbukas ng
  support ticket.<br><br>Masayang paggalugad sa universe mula sa buong team!
