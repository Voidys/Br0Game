spytechStatsDescription: En los niveles 0 y 1 solo puedes ver los puntos totales de otros jugadores. Desde el nivel 2 ves también sus puntos de edificios; desde el nivel 4, sus puntos de investigación. Desde el nivel 6 ves además sus puntos de naves y defensas, así como sus estadísticas de combate.
