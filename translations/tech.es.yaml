bonus:
  Attack: Ataque
  BuildTime: Tiempo de construcción
  Defensive: Defensa
  DefensiveTime: Tiempo de construcción de defensas
  Energy: Producción de energía
  Expedition: Expediciones
  FleetSlots: Slots de flota
  FlyTime: Tiempo de vuelo
  GateCoolTime: Tiempo de recarga del salto cuántico
  MoreFound: Hallazgos de expedición
  Planets: Planetas
  ResearchTime: Tiempo de investigación
  Resource: Producción de recursos
  ResourceStorage: Almacenamiento de recursos
  Shield: Escudo
  ShipStorage: Capacidad de la flota
  ShipTime: Tiempo de construcción de naves
  SpyPower: Poder de espionaje
longDescription:
  '1': Las minas de metal extraen el mineral sobre el que se construye todo imperio, nuevo o consolidado.
  '2': El cristal es el ingrediente clave de los circuitos electrónicos y de ciertas aleaciones.
  '3': El deuterio es el combustible de tus naves y se extrae de las profundidades marinas. Es una sustancia escasa, así que resulta relativamente caro.
  '4': Las plantas de energía solar convierten la luz del sol en energía. Todas las minas necesitan energía para funcionar.
  '6': De forma predeterminada, cada nivel reduce el tiempo de investigación un 8%.
  '12': La planta de fusión produce energía fusionando deuterio. Rinde más energía que una planta de energía solar, pero cuesta más construirla. La producción aumenta con la tecnología de energía y con el nivel de la propia planta. La fórmula de producción de energía es:<br> Energía producida = 30 x nivel de la planta de fusión x (1,05 + (0,01 * nivel de tecnología de energía))^nivel de la planta de fusión
  '14': Las fábricas de robots aportan robots de construcción que ayudan a levantar tus edificios. Cada nivel acelera las mejoras de edificios.
  '15': Lo último en robótica. Cada nivel reduce a la mitad el tiempo de construcción de edificios, naves y defensas.
  '21': Todas las naves y defensas se construyen en el hangar del planeta.
  '22': Almacena el exceso de metal.
  '23': Almacena el exceso de cristal.
  '24': Almacena el exceso de deuterio.
  '31': Necesitas un laboratorio de investigación para investigar nuevas tecnologías. El nivel del laboratorio determina la velocidad de investigación y qué tecnologías puedes desbloquear. La investigación se realiza en el laboratorio del planeta donde la inicias y su resultado vale para todos tus planetas. Mientras haya una investigación en curso, no se puede mejorar ningún laboratorio de investigación.
  '33': 'El Terraformer amplía la superficie utilizable del planeta. Cada nivel te da 5 casillas más, y una casilla extra en cada nivel par. Cada nivel del Terraformer ocupa una casilla.<br>Construirlo requiere energía, pero no se gasta: tu planeta solo tiene que producir la suficiente (1.000 para el nivel 1, y el doble con cada nivel), aunque tus minas ya la estén usando. Una vez construido, el Terraformer no se puede demoler nunca.'
  '34': "El depósito de la alianza te permite abastecer con deuterio a las flotas amigas que se mantienen en tu planeta y así alargar su estancia. Lo abres desde la página de edificios: para cada flota en espera eliges entre 1 hora y tantas horas como el nivel del depósito, y pagas las horas por el coste de mantenimiento por hora de la flota con el deuterio de tu planeta. El coste por hora es una décima parte del consumo base de combustible sumado de las naves de la flota, redondeado hacia arriba. Una flota puede abastecerse una y otra vez, pero nunca puede tener más de 32 horas de estancia restante. Solo se pueden abastecer flotas de otros jugadores que estén ahora en órbita de tu planeta."
  '35': El muelle de reparación puede reparar naves destruidas en combate que dejaron un campo de restos. Una reparación dura 12 horas como máximo y no puede terminar antes de 30 minutos tras la aparición del campo de restos.<br>Desde que aparece el campo de restos, tienes 3 días para iniciar la reparación. Cuando termina, tienes que volver a poner las naves en servicio tú mismo. Si no lo haces, vuelven a estar en servicio automáticamente al cabo de 3 días.
  '41': La luna no tiene atmósfera y una luna recién formada solo tiene sitio para un edificio, así que empieza por la base lunar. Cada nivel da 3 casillas extra y ocupa una casilla. Una vez construida, la base lunar no se puede desmantelar nunca.
  '42': 'El sensor Phalanx te permite vigilar los movimientos de flota. Cuanto mayor es el nivel, mayor es el alcance: (nivel del Phalanx)^2 - 1 sistemas de forma predeterminada, así que el nivel 1 solo cubre el propio sistema de la luna. Cada escaneo cuesta 5.000 de deuterio, que debe estar en la luna. Para escanear, abre la vista de galaxia desde la luna y haz clic en un planeta dentro del alcance. Las lunas no se pueden escanear con el Phalanx porque no tienen atmósfera.<br><br>El Phalanx muestra las flotas que salen del planeta escaneado o vuelan hacia él: cuándo llegan, cuándo termina una espera y cuándo vuelven a casa las flotas del dueño. Los despliegues y los misiles no se muestran nunca, ni tampoco los vuelos de reciclaje o comercio hacia el planeta.'
  '43': 'Los saltos cuánticos son enormes transmisores que envían grandes flotas por todo el universo sin perder tiempo. No gastan deuterio, pero no se pueden transferir recursos así. Ambos saltos deben estar listos: tras un salto, cada puerta necesita un tiempo de recarga que, de forma predeterminada, es de 60 minutos en el nivel 1 y se reduce con cada nivel hasta 10 minutos a partir del nivel 15.'
  '44': Los silos de misiles almacenan tus misiles. De forma predeterminada, cada nivel añade 10 espacios. Un misil de intercepción ocupa 1 espacio y un misil interplanetario, 2.
  '106': 'Esta tecnología te permite reunir información sobre otros planetas y lunas. Cuando envías sondas, tu tecnología de espionaje se compara con la del objetivo: cuanto mayor es tu nivel, más información trae el informe y menos probable es que detecten tus sondas. Más sondas revelan más detalles, pero aumentan el riesgo de ser detectado. En ciertos niveles de tecnología de espionaje también ves más sobre las flotas ajenas en tu vista general:<br><br><li>En el nivel 0-1 solo ves que una flota se acerca a tu planeta</li><li>En los niveles 2-3 ves cuántas naves se acercan</li><li>En los niveles 4-7 ves qué tipos de nave componen la flota</li><li>Desde el nivel 8 ves cuántas naves de cada tipo hay en la flota</li>'
  '108': Mejores ordenadores te permiten dirigir más flotas. Cada nivel de tecnología de computación aumenta en uno tu número máximo de flotas.
  '109': La tecnología militar hace más eficaces los sistemas de armamento. Cada nivel aumenta la potencia de armas de todas las unidades en un 10% del valor base.
  '110': La tecnología de defensa hace más eficaces los escudos de naves y defensas. Cada nivel aumenta la potencia del escudo en un 10% del valor base.
  '111': Aleaciones especiales mejoran el blindaje de naves y defensas. Cada nivel aumenta la eficacia del blindaje en un 10%.
  '113': Dominar distintos tipos de energía es la clave de muchas tecnologías nuevas. Cada nivel de tecnología de energía aumenta además la producción de la planta de fusión.
  '114': Integrando la cuarta y la quinta dimensión, puedes investigar un nuevo tipo de motor más económico y eficiente.
  '115': 'Desarrollar este motor hace más rápidas algunas naves, pero cada nivel solo suma un 10% de la velocidad base. Naves afectadas: nave pequeña de carga, nave grande de carga, cazador ligero, reciclador y sonda de espionaje (la nave pequeña de carga y el reciclador pasan más adelante a motores mejores).'
  '117': 'El motor de impulso funciona por reacción. Desarrollarlo más hace más rápidas algunas naves, pero cada nivel solo suma un 20% de la velocidad base: bombardero, crucero, cazador pesado y colonizador, además de la nave pequeña de carga y el reciclador cuando cambian a este motor. Los misiles interplanetarios también llegan más lejos con cada nivel.'
  '118': 'El propulsor hiperespacial curva el espacio alrededor de una nave. Desarrollarlo hace más rápidas algunas naves, pero cada nivel solo suma un 30% de la velocidad base: acorazado, nave de batalla, destructor, Estrella de la muerte, Luna Negra, Transporte Espacial, Avatar y Mega-Reciclador, además del bombardero y el reciclador cuando cambian a este motor. Requiere tecnología de hiperespacio (nivel 3) y laboratorio de investigación (nivel 7).'
  '120': La luz enfocada produce un rayo que daña todo lo que alcanza. Requiere laboratorio de investigación (nivel 1) y tecnología de energía (nivel 2).
  '121': Un rayo mortal de iones acelerados que causa un daño enorme al impactar.
  '122': Un desarrollo de la tecnología iónica que acelera plasma de alta energía, creado sobrecalentando iones. Su efecto al impactar es devastador.
  '123': Los investigadores de distintos planetas se comunican a través de esta red. Cada nivel permite que un laboratorio más se una al laboratorio donde inicias una investigación. Se eligen los laboratorios de nivel más alto, y un laboratorio en red debe estar lo bastante avanzado para realizar esa investigación por sí solo. Sus niveles se suman para calcular el tiempo de investigación.
  '124': 'La astrofísica desbloquea la colonización y las expediciones al espacio profundo. El límite de colonias, el tiempo de espera y las posiciones siguientes son los ajustes predeterminados; tu universo puede ser distinto.<br><br> <li>Límite de colonias</li> Nivel 1-2 = 2 planetas<br> Nivel 3-4 = 3 planetas<br> Nivel 5-6 = 4 planetas<br> Nivel 7-8 = 5 planetas<br> Nivel 9-10 = 6 planetas<br> Nivel 11-12 = 7 planetas<br> Nivel 13-14 = 8 planetas<br> Nivel 15-16 = 9 planetas<br> Nivel 17-18 = 10 planetas<br> Nivel 19-20 = 11 planetas<br> Nivel 21+ = 12 planetas<br><br> <li>Slots de expedición</li> Nivel 1-3 = 1 expedición<br> Nivel 4-8 = 2 expediciones<br> Nivel 9-15 = 3 expediciones<br> Nivel 16-24 = 4 expediciones<br>(una más en cada nivel cuadrado siguiente: 25, 36, ...)<br><br> <li>Tiempo de espera en expediciones</li> Nivel = tiempo máximo de espera en horas<br><br> <li>Posiciones colonizables</li> Nivel 1-3 = 4-12<br> Nivel 4-5 = 3-13<br> Nivel 6-7 = 2-14<br> Nivel 8+ = 1-15'
  '131': Aumenta un 2% por nivel la producción de metal.
  '132': Aumenta un 2% por nivel la producción de cristal.
  '133': Aumenta un 2% por nivel la producción de deuterio.
  '134': Reduce un 2% por nivel los costes de vuelo.
  '199': Disparar una carga concentrada de partículas de gravitón crea un campo gravitatorio artificial capaz de destruir naves e incluso lunas. Requiere laboratorio de investigación (nivel 12).
  '202': La nave pequeña de carga es una nave ágil que lleva recursos rápidamente a otros planetas.<br>Vuela con el motor de combustión hasta que tu motor de impulso llega al nivel 5. A partir de entonces cambia al motor de impulso, que duplica su velocidad base.
  '203': Esta nave de carga transporta mucho más que la nave pequeña de carga y, en general, es más rápida gracias a un motor mejorado.
  '204': La primera nave de combate que construye todo emperador. El cazador ligero es ágil pero vulnerable en solitario; en grandes cantidades se convierte en una amenaza real para cualquier imperio. Los cazadores ligeros son los primeros en escoltar naves de carga hacia planetas hostiles con poca defensa.
  '205': Este cazador tiene mejor blindaje y pega más fuerte que el cazador ligero.
  '206': Los cruceros tienen casi tres veces el blindaje de los cazadores pesados y más del doble de potencia de fuego. Además son muy rápidos.
  '207': Las naves de batalla son la columna vertebral de una flota. Cañones pesados, gran velocidad y grandes bodegas de carga las hacen rivales que hay que tomarse en serio.
  '208': 'Esta nave bien blindada conquista nuevos planetas, algo que un imperio emergente necesita para crecer. En la nueva colonia, la nave se desmonta y todo el material reciclable se invierte en desarrollar el nuevo mundo. Cuántos planetas puedes colonizar depende directamente de la astrofísica: el primer nivel y cada segundo nivel a partir de él permiten una colonia más (de forma predeterminada).'
  '209': El reciclador recolecta materias primas de los campos de escombros. Su capacidad de carga es de 20.000. Empieza con el motor de combustión, cambia al motor de impulso cuando tu motor de impulso llega al nivel 17 y al propulsor hiperespacial cuando este llega al nivel 15.
  '210': Las sondas de espionaje son drones pequeños y ágiles que traen datos sobre flotas y planetas a grandes distancias.
  '211': El bombardero se construyó expresamente para destruir las defensas de un planeta.<br>Vuela con el motor de impulso y cambia al propulsor hiperespacial cuando este llega al nivel 8.
  '212': Los satélites solares son sencillas plataformas de células solares en una órbita alta y estacionaria. Captan la luz del sol y la envían por láser a la estación terrestre.
  '213': 'El destructor es el rey de las naves de guerra. Contra los láseres pequeños tiene fuego rápido: tras cada impacto dispara otra vez en 9 de cada 10 casos.'
  '214': El poder destructivo de la Estrella de la muerte no tiene rival, y puede destruir lunas.
  '215': El acorazado está especializado en interceptar flotas hostiles.
  '216': 'El sucesor de la popular Estrella de la muerte: mucho más rápido y resistente, con una enorme bodega de carga, pero golpea algo menos fuerte.'
  '217': Una evolución de la nave grande de carga con mucha más capacidad. Funciona con el propulsor hiperespacial, así que arranca más lento que la nave grande de carga, pero la adelanta a medida que sube tu propulsor hiperespacial.
  '218': El peor escenario posible, aunque muy lento.
  '219': Una enorme bodega y motores nuevos le permiten volar más rápido y recoger más de los campos de escombros.
  '220': 'El Coloso de Acero es una auténtica fortaleza espacial, protegida por barreras inquebrantables y un blindaje enorme. Hasta los ataques más feroces rebotan mientras avanza sin descanso. Pero esa superioridad defensiva tiene un precio: su armamento apenas merece mención y sus lentos motores lo convierten en un gigante lento. En lugar de golpes relámpago o maniobras ágiles, esta nave confía en su pura resistencia. Quien quiera detenerlo necesitará mucho aguante o una potencia de fuego abrumadora.'
  '221': 'El Filo de Tormenta es un cazador de primer nivel: increíblemente rápido y armado sin piedad. Los rivales apenas lo ven antes de que golpee. La defensa es lo de menos: no necesita aguantar lo que puede dejar atrás. Se centra únicamente en transportes y recicladores, que aniquila sin resistencia. Con su velocidad vertiginosa golpea cuando quiere y desaparece antes de que lleguen refuerzos. Quien sea su objetivo tiene pocas posibilidades de escapar.'
  '222': El Crucero Pesado es una evolución reforzada del crucero estándar. Con escudos mejorados y armamento potente, puede plantar cara a enemigos torpes. Brilla cuando se despliega junto a Colosos de Acero, destructores y bombarderos, donde su potencia de fuego destaca de verdad. Sin embargo, pese a su fuerza, sigue siendo lento y poco maniobrable.
  '223': El Dron Escudo representa un nuevo enfoque de la defensa de flota, centrado sobre todo en proteger a la tripulación. Las innovadoras pero pesadas tecnologías de blindaje han reducido mucho su velocidad y maniobrabilidad. A pesar de su poca velocidad y agilidad, es muy eficaz en defensa. La estructura anticuada se ha llevado al límite para ofrecer una defensa casi impenetrable.
  '224': El Transportador de Asalto Improvisado es una nave de transporte sin probar y con armamento mínimo, creada expresamente para incordiar a vecinos descuidados y desprevenidos. Este vehículo improvisado no está pensado para un uso prolongado, sino para ataques rápidos e impulsivos que provocan reacciones inmediatas. Una disputa vecinal está prácticamente garantizada en cuanto se despliega. Con su equipo limitado y su naturaleza impredecible, se convierte en una herramienta peligrosa para escalar rápidamente un conflicto.
  '225': El Transportador de Tormenta es una auténtica maravilla tecnológica, con el equilibrio perfecto entre potencia de combate, velocidad y capacidad de transporte. Su capacidad de desplegar tropas y recursos con rapidez mientras lleva al campo de batalla una potencia de fuego impresionante lo ha convertido en un elemento esencial de cualquier flota poderosa. Ya sea para unidades de asalto rápido o para apoyar operaciones largas, el Transportador de Tormenta es clave para una guerra eficaz y un imprescindible en toda flota.
  '226': El Transportador de Batalla Colosal representa la cumbre de la ingeniería. A pesar de su diseño algo voluminoso y de su lenta velocidad de vuelo, es el transportador de batalla más blindado que ha visto flota alguna. Su abrumadora potencia de fuego lo convierte en una fuerza imparable en el campo de batalla. Este coloso puede romper líneas enemigas sin esfuerzo y ofrecer máxima protección a su tripulación. Encarna fuerza y resistencia, y es un activo esencial para cualquier flota muy armada.
  '227': El Reciclador Optimizado es una mejora de vanguardia del reciclador estándar. Equipado con un potente motor de impulso, llega antes y con menos coste a los campos de escombros, lo que lo hace imprescindible para cualquier flota avanzada. Su diseño optimizado reduce los costes de construcción y mejora la eficiencia de recuperación de recursos. Disponible a mitad de partida, da una ventaja estratégica a cualquier imperio en expansión.
  '228': 'El Reciclador Omega representa la cumbre de la tecnología de reciclaje, pero a un precio alto. Su potente propulsor hiperespacial le permite llegar a los campos de escombros en tiempo récord y recuperar recursos más rápido que cualquier otra nave. Sin embargo, esa velocidad se paga con la eficiencia: sus costes de construcción y combustible son inmensos, así que solo es viable para comandantes adinerados en el tramo final de la partida. Para quien prioriza la velocidad sobre el coste, es el reciclador definitivo.'
  '401': El lanzamisiles es una defensa sencilla pero rentable. Tras una batalla, de media se reconstruye alrededor del 70% de las defensas destruidas.
  '402': Los láseres pequeños son armas terrestres sencillas. Sistemas de puntería especiales siguen al enemigo y un láser de alta intensidad atraviesa el casco del objetivo. Tras una batalla, de media se reconstruye alrededor del 70% de las defensas destruidas.
  '403': El láser grande es una versión mejorada y práctica del láser pequeño. Tras una batalla, de media se reconstruye alrededor del 70% de las defensas destruidas.
  '404': El cañón Gauss dispara proyectiles metálicos de alta densidad a una velocidad altísima. Tras una batalla, de media se reconstruye alrededor del 70% de las defensas destruidas.
  '405': Un cañón iónico dispara rayos de iones (partículas con carga positiva o negativa). Tras una batalla, de media se reconstruye alrededor del 70% de las defensas destruidas.
  '406': El cañón de plasma usa una gran célula de combustible de reactor nuclear para alimentar un acelerador electromagnético que dispara pulsos (toroides) de plasma. Tras una batalla, de media se reconstruye alrededor del 70% de las defensas destruidas.
  '407': La cúpula pequeña de protección envuelve todo el planeta en un campo que absorbe cantidades enormes de energía. Solo se puede construir una por planeta.
  '408': La cúpula grande de protección es un desarrollo posterior que necesita bastante más energía para resistir ataques. Solo se puede construir una por planeta.
  '409': La evolución de la tecnología de cúpulas de protección. Usa mucha más energía, pero aguanta más ataques que cualquier otro escudo. Solo se puede construir una por planeta.
  '410': Tras años de investigación sobre la gravedad, los científicos desarrollaron un cañón de gravitón que genera un pequeño campo concentrado de gravitones y lo dispara contra el enemigo.
  '411': Una plataforma de defensa inmóvil, sin energía propia, que se mantiene en una órbita estable alrededor del planeta por la gravedad. Iniciar este proceso requiere cantidades enormes de energía. Solo se puede construir una por planeta.
  '412': El Búnker es una estructura muy fortificada, diseñada para resistir incluso los ataques más potentes. Ofrece una protección sin igual a los habitantes y a la infraestructura crítica del planeta, y es una piedra angular de la defensa planetaria.
  '413': El Titan Laser es un arma colosal de poder destructivo sin igual.
  '414': El Señuelo es un sofisticado sistema defensivo diseñado para engañar y confundir a las fuerzas enemigas. Al disfrazarse de lanzamisiles, disuade los ataques.
  '502': Los misiles de intercepción destruyen los misiles interplanetarios entrantes. Hace falta un misil de intercepción por cada misil interplanetario.
  '503': Los misiles interplanetarios destruyen las defensas del oponente, salvo que los misiles de intercepción los derriben. Las defensas destruidas así no se reconstruyen. De forma predeterminada, su alcance (en sistemas solares) depende del nivel de tu motor de impulso:<br>Alcance = (5 x nivel del motor de impulso) - 1
  '901': El metal es el recurso principal de edificios y naves. Es el recurso más barato, pero también el que más necesitas y, como el cristal, el que menos energía requiere para producirse. Cuanto mayores son las minas, más profundo excavan en la tierra.
  '902': El cristal es el recurso principal de los circuitos electrónicos y de ciertas aleaciones. Se produce en minas subterráneas, donde la materia prima se convierte enseguida en circuitos.
  '903': El deuterio se encuentra en los mares más profundos y es uno de los recursos más escasos del universo. Hay que llegar al fondo marino para obtenerlo, lo que lo convierte en el recurso más caro.
  '911': Se necesita energía para producir cualquier recurso.
  "229": Desarrollada para romper el dominio de los Xer, la Víbora es el arma definitiva contra cazadores ligeros, cazadores pesados y cruceros. Con sus cañones de fuego rápido y su tecnología avanzada, inclina la balanza de poder del universo.
  "230": 'Rápido. Preciso. Intocable. El Interceptor no está hecho para combates limpios: está diseñado para golpear rápido y fuerte, creando una ventaja abrumadora en un abrir y cerrar de ojos.'
  "231": El Behemot es el resultado de décadas de investigación en gravitón, convertido en una plataforma de combate implacable. A diferencia de las Estrellas de la muerte, no se diseñó para la destrucción planetaria, sino para la máxima eficacia en el campo de batalla. Al renunciar a los sistemas de gran consumo de energía necesarios para destruir lunas, su diseño se aligeró mucho, lo que permitió motores más potentes, más agilidad y más potencia de fuego. Su compacto cañón de gravitón lo convierte en una máquina de destrucción móvil, capaz de aniquilar él solo incluso flotas enormes.
  "232": 'El Titán del Vacío representa la cumbre de la tecnología moderna de gravitón. Cada aspecto de su diseño sirve a un único propósito: la rápida aniquilación de lunas enemigas. Se omitieron deliberadamente las torretas de armas convencionales para reducir masa y dejar sitio a colosales generadores de cristal. Estos alimentan las bobinas de aceleración más avanzadas jamás construidas en las galaxias conocidas, dando a la nave una movilidad sin igual. Las inmensas necesidades de cristal hacen de cada Titán del Vacío un logro industrial monumental, y un símbolo de poder destructivo ilimitado.'
secureResources: Cada nivel de un edificio de almacenamiento protege el 1% de la producción diaria de ese recurso frente al saqueo durante los ataques, hasta un máximo del 10%.
shortDescription:
  '1': Las minas de metal extraen el mineral sobre el que se construye todo imperio, nuevo o consolidado.
  '2': El cristal es el ingrediente clave de los circuitos electrónicos y de ciertas aleaciones.
  '3': El deuterio es el combustible de tus naves y se extrae de las profundidades marinas. Es una sustancia escasa, así que resulta relativamente caro.
  '4': Las plantas de energía solar convierten la luz del sol en energía. Todas las minas necesitan energía para funcionar.
  '6': De forma predeterminada, cada nivel reduce el tiempo de investigación un 8%.
  '12': La planta de fusión fusiona combustible de deuterio para producir energía.
  '14': Las fábricas de robots aportan robots de construcción que ayudan a levantar tus edificios. Cada nivel acelera las mejoras de edificios.
  '15': Lo último en robótica. Cada nivel reduce a la mitad el tiempo de construcción de edificios, naves y defensas.
  '21': Todas las naves y defensas se construyen en el hangar del planeta.
  '22': Almacena el exceso de metal.
  '23': Almacena el exceso de cristal.
  '24': Almacena el exceso de deuterio.
  '31': Necesitas un laboratorio de investigación para investigar nuevas tecnologías.
  '33': 'El Terraformer amplía la superficie utilizable del planeta: 5 casillas más por nivel, y una extra en cada nivel par. Cada nivel ocupa una casilla.'
  '34': "El depósito de la alianza te permite alargar a cambio de deuterio la estancia de las flotas amigas que se mantienen en tu planeta: por abastecimiento hasta tantas horas como el nivel del depósito."
  '35': El muelle de reparación recupera naves de un campo de restos.
  '41': La luna no tiene atmósfera y una luna recién formada solo tiene sitio para un edificio, así que empieza por la base lunar.
  '42': El sensor Phalanx te permite vigilar los movimientos de flota. Cuanto mayor es el nivel, mayor es el alcance.
  '43': Los saltos cuánticos son enormes transmisores que envían grandes flotas por todo el universo sin perder tiempo.
  '44': Los silos de misiles almacenan tus misiles.
  '106': Esta tecnología te permite reunir información sobre otros planetas y lunas.
  '108': Mejores ordenadores te permiten dirigir más flotas. Cada nivel de tecnología de computación aumenta en uno tu número máximo de flotas.
  '109': La tecnología militar hace más eficaces los sistemas de armamento. Cada nivel aumenta la potencia de armas de todas las unidades en un 10% del valor base.
  '110': La tecnología de defensa hace más eficaces los escudos de naves y defensas. Cada nivel aumenta la potencia del escudo en un 10% del valor base.
  '111': Aleaciones especiales mejoran el blindaje de naves y defensas. Cada nivel aumenta la eficacia del blindaje en un 10%.
  '113': Dominar distintos tipos de energía es la clave de muchas tecnologías nuevas.
  '114': Integrando la cuarta y la quinta dimensión, puedes investigar un nuevo tipo de motor más económico y eficiente.
  '115': Desarrollar este motor hace más rápidas algunas naves, pero cada nivel solo suma un 10% de la velocidad base.
  '117': El motor de impulso funciona por reacción. Desarrollarlo más hace más rápidas algunas naves, pero cada nivel solo suma un 20% de la velocidad base.
  '118': El propulsor hiperespacial curva el espacio alrededor de una nave. Desarrollarlo hace más rápidas algunas naves, pero cada nivel solo suma un 30% de la velocidad base.
  '120': La luz enfocada produce un rayo que daña todo lo que alcanza.
  '121': Un rayo mortal de iones acelerados que causa un daño enorme al impactar.
  '122': Un desarrollo de la tecnología iónica que acelera plasma de alta energía, creado sobrecalentando iones. Su efecto al impactar es devastador.
  '123': Los investigadores de distintos planetas se comunican a través de esta red.
  '124': Desbloquea la colonización y las expediciones al espacio profundo. Planetas extra en los niveles impares, slots de expedición extra en los niveles cuadrados, esperas de expedición más largas y más posiciones de planeta en un sistema.
  '131': Aumenta un 2% por nivel la producción de metal.
  '132': Aumenta un 2% por nivel la producción de cristal.
  '133': Aumenta un 2% por nivel la producción de deuterio.
  '134': Reduce un 2% por nivel los costes de vuelo.
  '199': Disparar una carga concentrada de partículas de gravitón crea un campo gravitatorio artificial capaz de destruir naves e incluso lunas.
  '202': La nave pequeña de carga es una nave ágil que lleva recursos rápidamente a otros planetas.
  '203': Esta nave de carga transporta mucho más que la nave pequeña de carga y, en general, es más rápida gracias a un motor mejorado.
  '204': La primera nave de combate que construye todo emperador. El cazador ligero es ágil pero vulnerable en solitario; en grandes cantidades se convierte en una amenaza real para cualquier imperio. Los cazadores ligeros son los primeros en escoltar naves de carga hacia planetas hostiles con poca defensa.
  '205': Este cazador tiene mejor blindaje y pega más fuerte que el cazador ligero.
  '206': Los cruceros tienen casi tres veces el blindaje de los cazadores pesados y más del doble de potencia de fuego. Además son muy rápidos.
  '207': Las naves de batalla son la columna vertebral de una flota. Cañones pesados, gran velocidad y grandes bodegas de carga las hacen rivales que hay que tomarse en serio.
  '208': Con esta nave se pueden colonizar planetas vacíos.
  '209': El reciclador recolecta materias primas de los campos de escombros.
  '210': Las sondas de espionaje son drones pequeños y ágiles que traen datos sobre flotas y planetas a grandes distancias.
  '211': El bombardero se construyó expresamente para destruir las defensas de un planeta.
  '212': Los satélites solares son sencillas plataformas de células solares en una órbita alta y estacionaria. Captan la luz del sol y la envían por láser a la estación terrestre.
  '213': El destructor es el rey de las naves de guerra.
  '214': El poder destructivo de la Estrella de la muerte no tiene rival, y puede destruir lunas.
  '215': El acorazado está especializado en interceptar flotas hostiles.
  '216': 'El sucesor de la popular Estrella de la muerte: mucho más rápido y resistente, con una enorme bodega de carga, pero golpea algo menos fuerte.'
  '217': Una evolución de la nave grande de carga con mucha más capacidad. Funciona con el propulsor hiperespacial, así que arranca más lento que la nave grande de carga, pero la adelanta a medida que sube tu propulsor hiperespacial.
  '218': El peor escenario posible, aunque muy lento.
  '219': Una enorme bodega y motores nuevos le permiten volar más rápido y recoger más de los campos de escombros.
  '220': El Coloso de Acero resiste cualquier ataque con escudos enormes y blindaje grueso, pero sus armas y motores dejan mucho que desear.
  '221': 'El Filo de Tormenta es un cazador fulminante, armado hasta los dientes. ¿Defensa? Innecesaria: sus presas son transportes y recicladores indefensos.'
  '222': Un crucero lento pero muy armado, con escudos y capacidad ofensiva mejorados.
  '223': Un rediseño del cazador ligero que prioriza la seguridad de la tripulación a costa de unas malas características de vuelo.
  '224': Una nave de transporte sin probar y con armamento mínimo, diseñada para incordiar a vecinos descuidados y desatar un conflicto inmediato.
  '225': Una nave que combina potencia de combate, velocidad y capacidad de transporte, y que resulta imprescindible en cualquier flota poderosa.
  '226': Un transportador de batalla muy blindado, de diseño imponente y algo voluminoso, cuya abrumadora potencia de fuego puede derrotar hasta a los rivales más duros.
  '227': Una versión mejorada del reciclador clásico con motores de impulso, que permite misiones de recuperación más eficientes y a menor coste.
  '228': Una mejora del reciclador extremadamente rápida pero poco eficiente, con propulsor hiperespacial.
  '231': Una Estrella de la muerte más pequeña y rápida que no puede destruir lunas. El Behemot es letal contra flotas.
  '401': El lanzamisiles es una defensa sencilla pero rentable.
  '402': Los láseres pequeños son armas de defensa terrestres sencillas. Sistemas de puntería especiales siguen a las naves enemigas y un láser de alta intensidad atraviesa el casco del objetivo.
  '403': El láser grande es una versión mejorada del láser pequeño.
  '404': El cañón Gauss dispara proyectiles metálicos de alta densidad a una velocidad altísima.
  '405': Un cañón iónico dispara rayos de iones (partículas con carga positiva o negativa).
  '406': El cañón de plasma usa una gran célula de combustible de reactor nuclear para alimentar un acelerador electromagnético que dispara pulsos (toroides) de plasma.
  '407': La cúpula pequeña de protección envuelve todo el planeta en un campo que absorbe cantidades enormes de energía.
  '408': La cúpula grande de protección puede absorber bastante más energía durante los ataques.
  '409': La evolución de la tecnología de cúpulas de protección. Usa mucha más energía, pero aguanta más ataques que cualquier otro escudo.
  '410': Tras años de investigación sobre la gravedad, los científicos desarrollaron un cañón de gravitón que genera un pequeño campo concentrado de gravitones y lo dispara contra el enemigo.
  '411': Una plataforma de defensa inmóvil, sin energía propia, que se mantiene en una órbita estable alrededor del planeta por la gravedad. Iniciar este proceso requiere cantidades enormes de energía.
  '412': ¡Protege! Como la pieza de Lego de Kindergarten TD.
  '413': El Titan Laser es un láser colosal.
  '414': El Señuelo es un sofisticado sistema defensivo diseñado para engañar y confundir a las fuerzas enemigas. Al disfrazarse de lanzamisiles, disuade los ataques.
  '502': Los misiles de intercepción destruyen los misiles interplanetarios entrantes.
  '503': Los misiles interplanetarios destruyen las defensas del oponente.
  '901': El metal es el recurso principal de edificios y naves. Es el recurso más barato, pero también el que más necesitas.
  '902': Los cristales son el recurso principal para fabricar circuitos electrónicos y ciertas aleaciones.
  '903': El deuterio se encuentra en los mares más profundos. Es el recurso más caro y el que más energía necesita.
  '911': Se necesita energía para producir cualquier recurso.
  "229": Desarrollada para romper el dominio de los Xer, la Víbora es el arma definitiva contra cazadores ligeros, cazadores pesados y cruceros. Con sus cañones de fuego rápido y su tecnología avanzada, inclina la balanza de poder del universo.
  "230": 'Rápido. Preciso. Intocable. El Interceptor no está hecho para combates limpios: está diseñado para golpear rápido y fuerte, creando una ventaja abrumadora en un abrir y cerrar de ojos.'
  "232": Más rápido, más explosivo, siempre una buena sorpresa. El Titán del Vacío es el terror de las lunas.
