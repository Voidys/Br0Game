registerWelcomePMText: "Witaj w %s! Zacznij od elektrowni słonecznej, bo do produkcji surowców potrzebna jest energia. Otwórz „Budynki” w menu po lewej i zbuduj Elektrownię Słoneczną.<br>Gdy już masz energię, możesz stawiać kopalnie. Zostań w „Budynkach” i zbuduj Kopalnię Metalu, a potem Kopalnię Kryształu.<br><br>Do budowy statków potrzebna jest Stocznia. Menu „Technologie” po lewej pokazuje, co trzeba spełnić, żeby ją odblokować.<br>Masz więcej pytań? Zajrzyj do FAQ, do wiki albo otwórz zgłoszenie do supportu.<br><br>Zespół życzy ci mnóstwa frajdy podczas odkrywania wszechświata!"
