home_meme_alt: "Komiksowy mem z mostka dowodzenia {game_name}"
home_meme_alt_deep_space_transit: "Komiks: dwóch kadetów w promie – jeden załamuje się na widok pola asteroid, drugi uśmiecha się do świecącej mgławicy. „Zwykłe patrole sektora vs. odkrycie niezbadanej mgławicy pełnej surowców.”"
home_meme_alt_deuterium_joyride: "Komiks: zmęczony dowódca na pokładzie obserwacyjnym patrzy na dwóch rekrutów unoszących się na zewnątrz – „Patrzę, jak nowi rekruci przepalają całe Deuterium na przejażdżki, a ja czekam 12 godzin na ulepszenie kopalni.”"
home_meme_alt_enemy_fleet: "Komiks: kadet łapie się za głowę w panice, a alarmy migają – „1000 wrogich niszczycieli w drodze?! Myślałem, że ten sektor jest bezpieczny?!”"
home_meme_alt_fleet_decimated: "Komiks: zszokowany żołnierz patrzy przed siebie, a za rozbitą kopułą wybuchają statki – „Kiedy przez 20 godzin farmisz surowce, a potem flota gracza z top 3 wpada i w 3 sekundy wszystko rozbiera.”"
home_meme_alt_solo_scouting: "Komiks: komandor Kamioka uśmiecha się i kładzie robotyczną dłoń na ramieniu kadeta – „Spokojnie, kadecie. Dowództwo ma ‚pełne’ zaufanie do twojej samotnej misji zwiadowczej w kosmos.”"
home_meme_alt_this_is_fine: "Komiks: pies w skafandrze siedzi spokojnie w płonącym centrum dowodzenia i mówi „This is fine” – „Spokojnie. Moja flota wraca tylko 4 godziny później.”"
