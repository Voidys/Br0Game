registerWelcomePMText: >-
  Witaj na %s! Jako pierwszy budnek zbuduj elektrownię słoneczną. Energia jest
  konieczna do pracy kopalń i wydobywania zasobów!. By zbudować kliknij na
  zakładkę "Budynki" w Menu. Potem zbuduj 4 budynek od góry. Po zbudowaniu masz
  już energię, zatem czas zbudować kopalnie metalu i kryształu. Jeśli chcesz coś
  zbudować a nie możesz, skorzystaj z zakładki Technologia - tam dowiesz się, co
  jest wymagane do budowy czy też badania!
