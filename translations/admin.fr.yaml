se_catch_up: Mécanisme de rattrapage
se_catch_up_info: >-
  Mécanisme de rattrapage qui augmente de manière exponentielle, jusqu'à un
  facteur 10 selon l'écart de points avec le premier joueur, et qui réduit les
  temps de construction et de recherche. À partir d'environ 90% des points, les
  joueurs ne reçoivent plus de bonus. A environ 54%, c'est un facteur de 2,5, à
  environ 27% un facteur de 5 et à environ 11% un facteur de 7,5, qui est
  converti en 1,0 à 0,5 maximum.
