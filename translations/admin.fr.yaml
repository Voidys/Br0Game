se_noob_protection_multi: Facteur Protection Newbie
se_noob_protection_multi_info: >-
  Vous ne pouvez attaquer que les utilisateurs dont les points sont entre vos
  points * (montant), par exemple *18 , cela signifie que si vous avez 1000
  points, vous pouvez attaquer les utilisateurs avec moins de 18000 points, ou,
  si vous avez 50000 points, vous pouvez être attaqué par les utilisateurs dont
  vous entrez dans leurs points de portée, comme si un ennemi ou un utilisateur
  neutre a 20000 points, * 18 sera 360000, vous êtes donc à leur portée et tu
  peux être attaqué par lui
