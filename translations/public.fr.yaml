registerWelcomePMText: "Bienvenue sur %s! D'abord vous devez construire une centrale solaire, parce que l'ènergie est nècessaire pour la production de matières premières. Pour en construire une, clic gauche dans le menu «bâtiments». Puis construire le 4e bâtiment à partir du haut. </br>Lorsque vous avez de l'énergie, vous pouvez commencer \tà construire des mines. Aller aux bâtiments dans le menu et de construire une mine de métal, suivie d'une mine de cristal.</br></br>Afin d'être en mesure de construire des vaisseaux, vous devez avoir un chantier naval. Pour voir ce qui est nécessaire pour débloquer la construction vous pouvez jeter un oeil à Technologies dans le menu de gauche.</br>Si vous avez plus de questions, vous pouvez consulter le guide des débutants, notre forum ou ouvrir un ticket de support.</br></br>L'équipe vous souhaite beaucoup de plaisir à explorez l'univers!"
