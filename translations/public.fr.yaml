home_meme_caption: Ton premier jour
home_meme_alt: "Mème BD du poste de commandement de {game_name}"
home_meme_alt_deep_space_transit: 'BD : deux cadets dans une navette – l’un s’effondre
  devant un champ d’astéroïdes, l’autre sourit face à une nébuleuse lumineuse. «
  Patrouilles de secteur ordinaires vs. découvrir une nébuleuse inexplorée riche
  en ressources. »'
home_meme_alt_deuterium_joyride: 'BD : un commandant fatigué sur le pont d’observation
  regarde deux recrues flotter dehors – « Regarder les nouvelles recrues gaspiller
  tout leur deutérium en balades pendant que j’attends 12 heures mes améliorations
  de mines. »'
home_meme_alt_enemy_fleet: 'BD : un cadet se tient la tête, paniqué, sous les alarmes
  clignotantes – « 1000 destroyers ennemis en approche ?! Je croyais ce secteur
  sûr ?! »'
home_meme_alt_fleet_decimated: 'BD : un soldat sous le choc fixe le vide tandis
  que des vaisseaux explosent derrière le dôme brisé – « Quand tu passes 20 heures
  à farmer des ressources et que la flotte d’un joueur du top 3 débarque et démonte
  tout en 3 secondes. »'
home_meme_alt_solo_scouting: 'BD : le commandant Kamioka sourit et pose une main
  robotique sur l’épaule d’un cadet – « Ne t’inquiète pas, cadet. Le Haut Commandement
  a une confiance “totale” en ta mission de reconnaissance en solo dans l’espace.
  »'
home_meme_alt_this_is_fine: 'BD : un chien en combinaison spatiale est assis calmement
  dans un poste de commandement en feu et dit « This is fine » – « Pas d’inquiétude.
  Ma flotte n’a que 4 heures de retard. »'
