op_activate_vacation_mode: Activer le mode vacances
op_activate_vacation_mode_confirm: >-
  Le mode vacances ne peut pas être désactivé pendant 48 heures. Vous êtes sûr
  de vous ?
op_activate_vacation_mode_descrip: >-
  Le mode vacances est conçu pour vous protéger pendant les périodes d'absence
  prolongées. Il ne peut être activé que lorsqu'aucune de vos flottes n'est en
  mouvement. Lorsqu'il est activé, il vous protège des nouvelles attaques.
  Cependant, les attaques déjà commencées se poursuivent et les flottes amies
  qui se maintiennent sont renvoyées ! La production de ressources, la
  construction de bâtiments et de chantiers navals ainsi que la recherche sont
  interrompues pendant cette période et reprendront ensuite. Le mode vacances
  dure au moins 48 heures, après quoi vous pouvez le désactiver à nouveau.
