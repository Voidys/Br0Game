kontakt: >-
  Salut!<br>Sur cette page, tu trouveras des informations sur les personnes qui
  gèrent, modèrent et développent activement ce projet.<br>N'hésite pas à nous
  contacter si tu as des questions ou des problèmes.<br><br><!--discord_url-->Pour faciliter
  l'échange avec nous, mais aussi avec les autres membres du projet, nous avons
  mis en place un serveur Discord. Tu le trouveras " <a
  href="{discord_url}">ici</a> " ou via le menu.<br>Sur le
  serveur, tu trouveras les dernières nouvelles, ainsi que des mèmes
  passionnants entre les alliances de l'univers.<br>Pose des questions sur les
  mécanismes du jeu et contribue au développement du jeu par tes propres
  suggestions.<br><br><!--/discord_url-->Bien entendu, nous te répondrons également sur les
  post-its en jeu.<br>Bedenke jedoch, dass auch wir das Spiel nur als Hobby
  betreiben. Les réponses peuvent prendre quelques jours.<br>
