questions:
  '1':
    '1':
      body: |-
        <p>У цьому розділі — головні споруди: що будувати спершу і навіщо кожна потрібна. Квітуча імперія починається з розумного порядку будівництва.</p>
        <h3>Сонячна електростанція</h3>
        <p>Будуй її першою. Шахтам потрібна енергія, щоб видобувати метал, кристал і дейтерій. Коли станція добудується, панель ресурсів і сторінка «Виробництво» покажуть, скільки в тебе енергії.</p>
        <h3>Шахта металу</h3>
        <p>Метал — один із трьох ресурсів. Майже все, що ти будуєш або досліджуєш, коштує металу, тож розвиток цієї шахти — пріоритет. На початку тримай її на кілька рівнів попереду інших шахт.</p>
        <h3>Шахта кристалу і синтезатор дейтерію</h3>
        <p>Кристал потрібен для споруд, кораблів і досліджень. Кристалу виробляється менше, ніж металу, тому він цінніший; пізніше в грі за нього часто точаться запеклі бої. Дейтерій — паливо для флотів, його можна спалювати заради енергії в термоядерній електростанції, а ще він потрібен для кількох важливих споруд і досліджень (зокрема дослідницької лабораторії).</p>
        <p>Докладніше: <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">вікі</a>.</p>
      title: Крок 1
    '2':
      body: |-
        <p>Щоб розвивати імперію й взаємодіяти з іншими гравцями, потрібно більше споруд. Дослідження та верф дають змогу створити флот і планетарну оборону.</p>
        <h3>Верф</h3>
        <p>Тут будують усі кораблі (та оборону). Верф стає доступною рано, але багатьом класам кораблів усе одно потрібні додаткові дослідження. Меню «Технології» показує вимоги для кожного корабля й оборонної споруди. Вищі рівні верфі будують швидше.</p>
        <h3>Дослідницька лабораторія</h3>
        <p>Тут розпочинають дослідження. Вони відкривають споруди, кораблі, оборону й подальші дослідження, а деякі технології ще й дають бонуси до того, що вже є. Розвиток дослідницької лабораторії пришвидшує дослідження.</p>
        <h3>Фабрика роботів</h3>
        <p>Фабрика роботів — необхідна річ. Вищі рівні скорочують час будівництва споруд і пришвидшують виробництво кораблів. Коли час будівництва стає надто довгим, розвивай фабрику роботів, щоб знову його скоротити.</p>
      title: Крок 2
    '3':
      body: |-
        <p>У цьому розділі — захист планети та перші ходи флоту: як надсилати флоти й що робити з іншими гравцями.</p>
        <h3>Огляд галактики</h3>
        <p>Користуйся ним, щоб знаходити інших гравців. Ти бачиш подробиці про інші планети й можеш надсилати частину флоту прямо звідси. Також можна писати гравцям або шпигувати за планетою, якщо в тебе є шпигунські зонди.</p>
        <h3>Надсилання флотів</h3>
        <p>Флоти можна надсилати з огляду галактики або з меню «Флот». Спершу обери, скільки кораблів кожного типу відправити. Потім задай ціль (координати з огляду галактики) та швидкість. Наприкінці обери місію, наприклад Атака, Розгортання, Утримання, Переробка чи Транспорт.</p>
        <h3>Оборона</h3>
        <p>Коли в тебе є верф, можна будувати й оборонні споруди. Вони захищають планету й б'ються разом із будь-яким флотом, що перебуває там під час атаки. На відміну від кораблів, близько 70% знищених оборонних споруд ремонтуються після бою.</p>
      title: Крок 3
    category: Поради для початківців
  '2':
    '1':
      body: |-
        <h3>Рейди</h3>
        <p>Рейд — це атака на інших гравців, щоб забрати їхні ресурси. Поширені види:</p>
        <ul>
        <li>Фарм-рейд</li>
        <li>Атака на флот</li>
        <li>Рейд на поле уламків</li>
        <li>Перехоплення</li>
        </ul>
        <h3>Фарм-рейд</h3>
        <p>Найпоширеніші атаки у всесвіті. Ти шпигуєш за найближчими планетами й надсилаєш невеликі флоти з достатньою вантажомісткістю та вогневою міццю, щоб пробити слабку оборону й лишитися в плюсі: вкрадені ресурси мають перевищувати витрачений дейтерій і твої власні втрати.</p>
        <h3>Атака на флот</h3>
        <p>Вищий пілотаж рейдів: полювання на флоти інших гравців. Окрім шпигунських зондів і везіння, важливі сенсорна фаланга й точний розрахунок часу. Помітивши вартий уваги флот, його ще треба наздогнати й переробити уламки. Це часто важко, бо вигідні флоти можуть перевищувати місткість твоїх переробників — тоді доведеться координувати переробників і, за потреби, учасників об'єднаної атаки, а також бойовий флот.</p>
        <h3>Рейд на поле уламків</h3>
        <p>Найлегший і найменш шанований спосіб заробити: збирати поля уламків, створені іншими гравцями. Уламки належать тому, хто їх збере, тож крадіжка полів — поширена причина образ.</p>
        <h3>Перехоплення</h3>
        <p>Робота флітера — будувати флот і знищувати флот. Не завжди вдасться знайти кораблі без діла, тож упіймати сильних гравців часто означає перехопити їх під час сейву або під час атаки. Це непросто; від цього є способи захиститися.</p>
        <ul>
        <li><p>Місяць полегшує перехоплення, бо сенсорна фаланга сканує рух флотів на планетах у радіусі дії (не на Місяцях). Якщо знайшов флот, який варто впіймати, порахуй час польоту, що залишився, — особливо час повернення після прибуття. Рівнів двигунів (реактивного, імпульсного, гіперпросторового) зі шпигунського звіту досить, щоб це обчислити вручну або калькулятором часу польоту. Точний годинник допомагає. Розрахуй час так, щоб твій флот і переробники прибули приблизно на 3–5 секунд пізніше за ціль на їхню планету чи Місяць. Переробникам теж потрібен розрахунок часу.</p></li>
        <li><p>Щоб перехопити флот, який летить із Місяця до поля уламків, потрібен приблизний час старту. Створи видиме поле уламків там, де, на твою думку, вони збиратимуть (наприклад, зондами). Порахуй, скільки їхній флот летітиме туди, стеж за системою й оновлюй, поки поле не зникне. Запиши цей час, додай їхній зворотний політ і розрахуй час так, щоб твій флот і переробники прибули на кілька секунд пізніше за це прибуття.</p>
        <p><b>Увага:</b> це працює не завжди. Поширена відповідь — переробник, відправлений наперед, щоб спершу прибрати поле.</p></li>
        <li>Ще один вид перехоплення — утримання на планеті друга для його захисту, через що нападники змушені відкликати флот, бо захисний флот буде надто сильним. Знизити ризик бути впійманим так можна сканом на сейв.</li>
        <li><p>Якщо гравець розгортає флот з однієї планети на іншу, а потім відкликає, флот зникає зі сенсорної фаланги. Спостерігай за його схемою сейву (коли він стартує і коли відкликає). Коли очікуєш відклик, скануй планету фалангою щосекунди. Щойно флот зникне, запиши час, додай зворотний політ і прибудь приблизно на 4–6 секунд пізніше з флотом і переробниками.</p>
        <p>Якщо він сейвиться з Місяця до поля уламків і відправляє переробників наперед, перехопити майже неможливо, якщо не знищити Місяць. Надішли Зірки смерті з місією «Знищення». Коли Місяць зникне, флот повернеться на планету; скануй цю планету фалангою й прибудь на кілька секунд позаду нього.</p>
        <p>Усі ці прийоми працюють значно краще, якщо знаєш звички цілі — наприклад, сейв щовечора о 23:00 або вихід у мережу опівдні. Вивчи гравця, перш ніж перехоплювати.</p></li>
        </ul>
        <p>Більше у вікі: <a href="{wiki_url}/wiki/En/Saven" target="_blank">Сейв флоту</a>, <a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">Сенсорна фаланга</a>.</p>
      title: Рейди
    '2':
      body: |-
        <h3>Атака з ACS</h3>
        <p>Щоб атакувати разом, спершу надішли флот із місією «Атака» на ціль. Після старту відкрий меню «Флот» і натисни «Об'єднання», щоб перетворити цей флот на групу ACS. Там можна перейменувати групу й запросити інших гравців; гравця, який розпочав атаку, запрошено автоматично. Кожен запрошений гравець потім надсилає свої кораблі на ті самі координати з місією «Об'єднана атака».</p>
        <p>Група завжди летить стільки, скільки найповільніший учасник. Швидші флоти, що приєднуються пізніше, не скорочують час, що залишився. Повільніші флоти збільшують час, що залишився, до власного часу польоту. Зазвичай до однієї ACS-атаки можуть приєднатися щонайбільше 5 гравців і 16 флотів (налаштування всесвіту можуть відрізнятися). Флот, що приєднується, може збільшити час польоту, що залишився, щонайбільше на 30%. Якщо залишається 100 хвилин, флот, що приєднується, може летіти щонайбільше 130 хвилин.</p>
        <p><b>Попередження:</b> якщо засновник ACS відкличе флот, відкликаються всі флоти групи.</p>
        <h3>Оборона з ACS</h3>
        <p>Якщо тебе атакують, можуть допомогти учасники альянсу та друзі. Вони надсилають флот на координати, що під атакою, обирають, скільки пробути, і використовують місію «Утримання». Окрім дейтерію на політ, під час старту стягуються додаткові витрати на утримання залежно від розміру флоту й тривалості. Поки вони утримують позицію, вони б'ються в кожному бою на цій планеті чи Місяці й відображаються у шпигунських звітах так, ніби це твої кораблі. Розрахуй утримання так, щоб вони прибули незадовго до нападника — тоді скан на сейв рідше їх помітить. Гравці, що утримують позицію, можуть відкликатися з меню «Флот» будь-коли; інакше флот дочекається завершення утримання й повернеться додому.</p>
        <h3>Дейтерій за 1 годину утримання</h3>
        <p>Малий транспорт: 5<br>
        Великий транспорт: 5<br>
        Легкий винищувач: 2<br>
        Важкий винищувач: 7<br>
        Крейсер: 30<br>
        Лінкор: 50<br>
        Колонізатор: 100<br>
        Переробник: 30<br>
        Шпигунський зонд: 1/10<br>
        Бомбардувальник: 100<br>
        Знищувач: 100<br>
        Зірка смерті: 1/10</p>
      title: Об'єднана атака (ACS)
    '3':
      body: |-
        <p>Місяць може утворитися, коли виникає поле уламків від 100 000 одиниць (шанс 1% на Місяць). Шанс обмежений 20%, хоч яким великим буде поле.</p>
        <h3>Загальне</h3>
        <p>Місяці можна перейменовувати як і планети, але «(Місяць)» у назві лишається. На кожну планету припадає щонайбільше один Місяць. Місяць дозволяє сейвити флот поза зоною видимості сенсорної фаланги, тож його варто створити порівняно рано. На Місяці можна збудувати: фабрику роботів, верф, сховища металу, кристалу й дейтерію, склад альянсу, місячну базу, сенсорну фалангу та місячну браму.</p>
        <h3>Мунщот</h3>
        <p>Мунщот — навмисне знищення кораблів, щоб створити поле уламків. Зазвичай для цього беруть легкі винищувачі: за 30% флоту й 0% оборони в уламки 1667 легких винищувачів дають 20% шансу на Місяць. Їх дешево втрачати, і вони підходять дуже близько до межі. Якщо сильніший гравець знищує легкі винищувачі слабшого, зібрати уламки може будь-хто. Якщо слабший гравець атакує сильнішого кораблями, призначеними для знищення, збирати може лише слабший — інакше це пушинг. Місяці та спроби їх створити підпадають під правила про пушинг.</p>
        <p>У всесвіті, де оборона теж створює уламки, часто краще збудувати оборону й дати розбити її кількома хвилями для кількох спроб створити Місяць. Поширений вибір — 3334 ракетні установки або 3334 малі лазерні турелі.</p>
        <p>Коли Місяць утворюється, бойовий звіт повідомляє, що величезні кількості вільного металу й кристалу притягуються докупи та утворюють супутник навколо планети.</p>
        <p>Шанс на Місяць від 1% до 19%: випадковий розмір. Шанс на Місяць 20%: діаметр понад 8000 км. Місяць ніколи не буває більшим за 8944 км.</p>
        <h3>Споруди</h3>
        <p>Сховища на Місяці зазвичай будувати не варто, бо там нічого не виробляється. Верф теж рідко потрібна: час будівництва довгий, а кораблі можна будувати на планеті. Склад альянсу — тема дискусій; він також займає цінні поля.</p>
        <p>Три споруди, що є лише на Місяці:</p>
        <ul>
        <li><p><b>Місячна база</b><br>Додає поля для забудови: 3 за рівень, одне з яких займає наступне покращення місячної бази.</p></li>
        <li><p><b>Сенсорна фаланга</b><br>Показує рух флотів на ворожих планетах (не на Місяцях). Радіус дії зростає з кожним рівнем.</p></li>
        <li><p><b>Місячна брама</b><br>Миттєво переміщує кораблі з одного Місяця на інший. Ресурси разом із ними не передати. Після стрибка брама потребує часу на охолодження (зазвичай одна година), інакше перегріється.</p></li>
        </ul>
        <p>Поширений порядок будівництва на Місяці:<br>
        <b>Умовні позначення:</b><br>
        MB – місячна база<br>
        SP – сенсорна фаланга<br>
        ST – місячна брама<br>
        RB – фабрика роботів</p>
        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>
        Після цього можна й далі розвивати сенсорну фалангу, якщо вистачає ресурсів. Також можна знести частину рівнів фабрики роботів і віддати ці поля під фалангу.</p>
        <h3>Знищення</h3>
        <p>Місяць можна знищити лише Зірками смерті. У меню місій обери «Знищення» замість «Атака». Спершу має бути знищений будь-який флот на Місяці; уцілілі Зірки смерті все одно можна втратити під час знищення самого Місяця. Знищення Місяця не створює поля уламків.</p>
        <h3>Атаки Зірок смерті на Місяці</h3>
        <p>Шанс знищити Місяць: (100 − sqrt(розмір Місяця)) × sqrt(кількість Зірок смерті). Шанс, що атакувальні Зірки смерті буде знищено: sqrt(розмір Місяця) / 2. Більші Місяці знищувати ризикованіше.</p>
        <h3>Шанс на Місяць і розмір</h3>
        <p>100 000 одиниць уламків дають 1% шансу на Місяць. Максимальний шанс: 20%. Після пізнішої зміни кожен Місяць має максимальну кількість полів для забудови (79). Раніше це було FLOOR((діаметр / 1000)²). Найбільший можливий Місяць: діаметр 8944 км, 79 полів.</p>
        <p>Більше у вікі: <a href="{wiki_url}/wiki/En/Mond" target="_blank">Місяці</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">вікі</a>.</p>
      title: Місяці
    '4':
      body: |-
        <h3>Як заснувати альянс?</h3>
        <p>Відкрий «Альянс» у меню ліворуч, потім «Створити власний альянс». Введи тег альянсу (коротку абревіатуру) і назву альянсу. Приклад: альянс із назвою «Найкращий альянс» може мати тег «НКА».</p>
        <p>Дозволені лише літери, цифри й пробіли. Після введення тега й назви натисни «Створити». Якщо така назва чи тег уже зайняті, з'явиться помилка, і доведеться обрати інші. У разі успіху побачиш підтвердження; «Продовжити» відкриє твоє ще порожнє меню альянсу, до якого завжди можна дістатися через «Альянс» у меню ліворуч. Угорі видно твій тег і назву.</p>
        <p>Нижче ти знайдеш:<br>
        Учасники: усі учасники з очками, координатами домашньої планети, датою вступу та статусом у мережі. Клацай заголовки стовпців, щоб сортувати.<br>
        Твій ранг: назва твого рангу та посилання на керування альянсом.<br>
        Масові повідомлення: надіслати повідомлення всьому альянсу або обраним рангам.</p>
        <h3>Керування альянсом</h3>
        <p>«Ранги» дозволяють налаштувати права для кожного рангу, наприклад розпуск альянсу чи надсилання масових повідомлень. «Учасники» дозволяють виганяти гравців, призначати ранги та бачити, скільки днів вони не були в мережі. Також можна змінити тег і назву альянсу.</p>
        <p>«Керування текстами» редагує тексти альянсу. Зовнішній текст бачить кожен гравець; внутрішній — лише учасники. Текст заявки — шаблон для тих, хто подає заявку.</p>
        <p>«Налаштування» дозволяють додати посилання на банер і форум альянсу, обрати, чи відкрито прийом заявок, і задати назву рангу засновника. Якщо залишити порожнім, ранг називатиметься «Засновник».</p>
        <p>Альянс можна розпустити або передати іншому учаснику, який стане засновником.</p>
      title: Альянси
