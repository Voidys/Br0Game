intro_install: To installation
intro_lang: Dil
intro_text: >-
  Br0Game en iyi ogame projelerinden birisidir.<br>Br0Game mevcut gelistirilmis
  en yeni ve guvenilir Xnova versiyonudur. Br0Game gerek kullanim kolayligi,
  gerek kod esnekligi, dinamizmi, kod kalitesi ve islevleri ile goz almaktadir.
  Her zaman sizin beklentilerinizden daha iyi olmaya calistik. <br><br>
  Kurulumdaki direktifler kurulum esnasinda size rehberlik edecektir. Her sorun
  ve problemde, bize danismak icin kesinlikle tereddut etmeyin!<br><br>The
  Br0Game bir acik kod uygulamasidir ve GNU GPL v3 lisanslidir. Lisans hakkinda
  bilgi edinmek icin asagidaki "Lisans" linkine tiklayabilirsiniz.  <br><br>
  Kurulum islemine baslamadan once sisteminiz Br0Game kurmak icin gerekli
  ozelliklere sahip olup olmadigi test edilecektir. 
intro_upgrade_head: Sisteminizde Br0Game mevcut kurulu mu?
intro_upgrade_text: >-
  <p>Sisteminizde Br0Game kurulu, kolay bir guncelleme
  istermisiniz?</p><p>Buraya tiklayarak sisteminizin eski veritabanini bir kac
  tiklama ile guncelleyebilirsiniz.!</p>
