op_activate_vacation_mode_confirm: Tatil modu 48 saat boyunca tekrar devre dışı bırakılamaz. Emin misiniz?
op_activate_vacation_mode_descrip: >-
  Tatil modu uzun süreli yokluklarda sizi korumak için tasarlanmıştır. Yalnızca
  kendi filolarınız hareket halinde değilken etkinleştirilebilir.
  Etkinleştirildiğinde sizi yeni saldırılara karşı korur. Ancak, halihazırda
  başlamış olan saldırılar devam edecek ve beklemekte olan dost filolar geri
  gönderilecektir! Kaynakların üretimi, binaların inşası ve tersane
  siparişlerinin yanı sıra araştırma bu süre zarfında duraklatılır ve daha sonra
  yeniden başlatılır. Tatil modu en az 48 saat sürer, sonrasında tekrar devre
  dışı bırakabilirsiniz.
