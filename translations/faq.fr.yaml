    "3":
      body: |-
        <p>Une lune peut se former lorsqu'un champ de débris d'au moins 100 000 unités est créé (1 % de chance de lune). La chance est plafonnée à 20 %, quelle que soit la taille du champ.</p>
        <h3>Général</h3>
        <p>Les lunes peuvent être renommées comme les planètes, mais « (Lune) » reste dans le nom. Tu ne peux avoir qu'une seule lune par planète. Une lune permet de faire du fleetsave hors de vue d'une Phalange de capteurs, il vaut donc la peine d'en créer une relativement tôt. Sur une lune, tu peux construire Usine de robots, Chantier spatial, Hangar de métal, Hangar de cristal, Réservoir de deutérium, Dépôt de ravitaillement, Base lunaire, Phalange de capteurs et Porte de saut.</p>
        <h3>Moonshot</h3>
        <p>Un moonshot est la destruction délibérée de vaisseaux pour créer un champ de débris. Les Chasseurs légers sont le choix habituel : avec 30 % de flotte et 0 % de défense en débris, 1 667 Chasseurs légers donnent 20 % de chance de lune. Ils sont peu coûteux à perdre et arrivent très près du plafond. Si un joueur plus fort détruit des Chasseurs légers chez un joueur plus faible, tout le monde peut récolter les débris. Si un joueur plus faible attaque un joueur plus fort avec des vaisseaux destinés à mourir, seul le joueur plus faible peut récolter — sinon c'est du pushing. Les lunes et les tentatives de lune sont soumises aux règles de pushing.</p>
        <p>Dans un univers où la défense crée aussi des débris, il est souvent préférable de construire de la défense et de la faire détruire en plusieurs vagues pour plusieurs tentatives de lune. 3 334 Lanceurs de missiles ou 3 334 Artilleries laser légères sont un choix courant.</p>
        <p>Lorsqu'une lune se forme, le rapport de combat indique que d'énormes quantités de métal et de cristal libres se rassemblent et forment un satellite autour de la planète.</p>
        <p>Chance de lune entre 1 % et 19 % : taille aléatoire. Chance de lune de 20 % : plus de 8 000 km de diamètre. Une lune n'est jamais plus grande que 8 944 km.</p>
        <h3>Bâtiments</h3>
        <p>Les hangars ne valent généralement pas la peine d'être construits sur une lune, car rien n'y est produit. Un chantier spatial est aussi rarement utile : les temps de construction sont longs, et tu peux construire des vaisseaux sur la planète. Le Dépôt de ravitaillement est discuté ; il occupe aussi de précieuses cases.</p>
        <p>Les trois bâtiments exclusifs à la lune sont :</p>
        <ul>
        <li><p><b>Base lunaire</b><br>Ajoute des cases constructibles : 3 par niveau, dont une est prise par la prochaine amélioration de la base lunaire.</p></li>
        <li><p><b>Phalange de capteurs</b><br>Montre les mouvements de flotte sur les planètes ennemies (pas les lunes). La portée augmente à chaque niveau.</p></li>
        <li><p><b>Porte de saut</b><br>Déplace instantanément des vaisseaux d'une lune à une autre. Les ressources ne peuvent pas les accompagner. Après un saut, la porte a besoin de temps pour refroidir (généralement une heure), sinon elle surchauffe.</p></li>
        </ul>
        <p>Un ordre de construction courant pour une lune :<br>
        <b>Légende :</b><br>
        MB – Base lunaire<br>
        SP – Phalange de capteurs<br>
        ST – Porte de saut<br>
        RB – Usine de robots</p>
        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>
        Ensuite, tu peux continuer à développer la Phalange de capteurs si tu as les ressources. Tu peux aussi démolir quelques niveaux d'Usine de robots et consacrer ces cases à la phalange.</p>
        <h3>Destruction</h3>
        <p>Une lune ne peut être détruite qu'avec des Étoiles de la mort. Dans le menu des missions, choisis Détruire au lieu d'Attaquer. Toute flotte présente sur la lune doit d'abord être détruite ; les Étoiles de la mort survivantes peuvent encore être perdues lorsque la lune elle-même est détruite. La destruction d'une lune ne crée pas de champ de débris.</p>
        <h3>Attaques de lune avec Étoile de la mort</h3>
        <p>Chance de destruction de la lune : (100 − racine(taille de la lune)) × racine(nombre d'Étoiles de la mort). Chance que les Étoiles de la mort attaquantes soient détruites : racine(taille de la lune) / 2. Plus une lune est grande, plus il est risqué de la détruire.</p>
        <h3>Chance et taille de la lune</h3>
        <p>100 000 unités de débris donnent 1 % de chance de lune. Chance maximale : 20 %. Après une modification ultérieure, chaque lune a le nombre maximal de cases constructibles (79). Auparavant, c'était FLOOR((diamètre / 1000)²). Plus grande lune possible : 8 944 km de diamètre, 79 cases.</p>
        <p>Plus d'infos dans le wiki : <a href="{wiki_url}/wiki/En/Mond" target="_blank">Lunes</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>
      title: "Lunes"
