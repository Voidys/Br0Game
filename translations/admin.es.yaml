  diferencia de puntos con el primer jugador. A partir de aprox. el 90% de los
  puntos, los jugadores dejan de recibir bonificaciones. A partir de aprox. el
  54% es un factor de 2,5, a partir de aprox. el 27% un factor de 5 y a partir
  de aprox. el 11% un factor de 7,5, que se convierte en 1,0 hasta un máximo de
