tutorial_text:
  step0: "{game_name}'e hoş geldin!<br><br>\r\nBu eğitimde, oyunun temel bilgileri gösterilecektir.<br>\r\nEk bilgi için sık sık wiki'ye başvurulacak, çünkü oyunun tüm yönleri eğitimde açıklanamaz. \r\nWiki’ye sol menüden istediğin zaman erişebilirsin.<br>\r\nEğitimi istediğin zaman atlayabilirsin ancak tekrar başlatılamaz.<br><br>\r\nBol şanslar, İmparator!"
  step1: "Bu oyunun amacı, mümkün olduğunca çok puan kazanmaktır. Harcadığın her 1.000 kaynak için bir puan kazanırsın.\r\nBu kaynaklara farklı yollarla ulaşılabilir. En önemlisi ise madenlerin kendi üretimidir.<br>\r\nÖncelikle temel kaynak üretimini sağla. Bunun için, Metal ve Kristal madenlerinden kaynak elde etmelisin. Madenlerin çalışması için de Güneş Enerji Santrali’nden enerji gereklidir.\r\nYeterli enerji sağlanmadığında %100 üretim sağlanamaz.<br>\r\nBu binaları <b>Binalar</b> menüsünden genişletebilirsin. Binanın adının üzerine tıklayarak, yükseltmenin kaynak değerini görebilirsin. \r\nAyrıca, bir sonraki seviyenin ne kadar enerji tükettiğini de göreceksin.<br><br>\r\nDaha fazla bilgi için wiki'ye bakabilirsin: \r\n<a href=\"https://wiki.pr0game.com/wiki/EN/Rohstoffe\" target=\"_blank\">Raw material production</a>"
  step2: "Diğer oyuncularla etkileşimde bulunmak oyunu daha eğlenceli hale getirir.\r\nÇoğu oyuncu Discord sunucumuzda organize olur. \r\nToplulukta sorularına yanıt alabilir ve birlikte oynayacak diğer oyuncuları bulabilirsin.<br>\r\nBelirsizlik durumlarında burada destek bileti açabilirsin."
  step3: "Kaynak elde etmenin bir diğer yolu, diğer oyuncuların gezegenlerini yağmalamaktır.<br>\r\nAncak bu sana da yapılabilir - bu yüzden ilk savunmanı inşa et!<br>\r\nEn azından gece üretimini korumak için bir savunmaya sahip olmak önemlidir.<br>\r\nAncak yalnızca savunma miktarı değil, saldırı filolarının kompozisyonu da önemlidir.<br>\r\nYağmalamadan önce saldırganın savunmanı aşması gerekir. Saldırganın göndermek zorunda kaldığı her gemi, kazancını azaltır ve gemilerinin zarar görme riskini artırır.<br>\r\nSavunma yapıları <b>Savunma</b> menüsünde Gemi Tersanesi ile inşa edilir. Bu da bir Robot Fabrikası ve Deuterium gerektirir.<br><br>\r\nWiki'de savunma hakkında daha fazla bilgi bulabilirsin: \r\n<a href=\"https://wiki.pr0game.com/wiki/En/Verteidigung\" target=\"_blank\">Defense facilities</a>"
  step4: "Kaynak üretimini artırarak sağlama al!<br>\r\nBinaların, gemilerin, savunman ve araştırmalar zamanla daha pahalı hale gelir.\r\nBu nedenle, üretimini artırarak gezegeninin kaynak ihtiyaçlarını karşılamaya çalışmalısın.\r\nYeterli kaynak olduğunda binalarını genişletmek için <b>Binalar</b> menüsüne tıkla ve gerekli yükseltmeleri yap."
  step5: "Küçük bir taşıyıcı inşa et!<br>\r\nKüçük taşıyıcılar, oyunun ilerleyen safhalarında hızlı bir taşıma aracıdır.<br>\r\nEğer itme motoruyla donatılırsa, büyük taşıyıcılardan uzun süre daha hızlı olabilirler.<br>\r\nBu taşıyıcılar, gezegenler arasında kaynak taşımak, diğer oyuncularla ticaret yapmak veya yağmalamak için kullanılır.<br><br>\r\nWiki'de daha fazla bilgi bulabilirsin: \r\n<a href=\"https://wiki.pr0game.com/wiki/En/Schiffe\" target=\"_blank\">Ships</a>"
  step6: "Gezegenleri daha iyi yönetmek için yeniden adlandırabilirsin. Üst menüdeki puan gösterge alanında gezegen adını tıklayarak isim değiştirebilirsin.<br><br>\r\nAyrıca diğer oyunculara dostluk isteği gönderebilirsin. İstek kabul edilirse daha kolay iletişim kurabilir ve birbirinizin çevrim içi durumunu görebilirsiniz. \r\nAynı ittifakta olmanıza gerek yoktur. \r\nDost oyunculara filo desteği verebilir, birlikte savunma yapabilirsiniz.<br><br>\r\nAyrıca bir ittifaka katılarak daha fazla oyuncu ile birlikte oynayabilirsin. \r\nİttifakta dostluk isteğine gerek olmadan filo desteği sağlanabilir. \r\nİttifak içinde grup mesajları gönderilebilir, çevrim içi durumu ve puan durumu görebilirsiniz - ittifak rütbesine bağlı olarak."
  step7: "Diğer oyuncuların kaynaklarını, binalarını, araştırmalarını, gemilerini ve savunmalarını görmek için onları casuslayabilirsin. \r\nBir casus probunu diğer bir oyuncuya göndermek için Filo menüsünden veya Galaksi menüsünden yola çıkabilirsin.<br>\r\nAncak, diğer oyuncular da seni casuslayabilir!"
  step8: >-
    Bir keşif gezisi kaynaklar, gemiler, olaylar veya kayıplar getirebilir. Bunu
    denemek için, bir gemi seçin ve filo menüsünde gezegen koordinatı 16'ya ve
    “Keşif” görevine tıklayarak bir keşif gezisine çıkın.<br>

    Her gemi türü, maksimum olay boyutuna ulaşılana kadar keşif filosunun
    boyutuna puan ekleyecektir.<br><br>

    Wiki'de daha fazla bilgiye erişebilirsin: 

    <a href="https://wiki.pr0game.com/wiki/En/Expoanleitung"
    target="_blank">Expeditions</a>
  step9: "Hızlı bir üretim için daha fazla gezegen kolonileştir. \r\nBu şekilde, aynı anda iki veya daha fazla gezegende üretim yapabilir ya da gemi inşa edebilirsin.\r\nSistemin iç kısmında veya dış kısmında koloni kurmak için yeterince yüksek bir Astrofizik seviyesi gereklidir.\r\nKoloni gemisi Astrofizik olmadan inşa edilebilir, ancak ilk koloni Astrofizik gerektirir!<br><br>\r\nBir sistemde ya da komşu sistemlerde kolonileşmek, nakliye yollarını kısa tutar ancak daha sonra oyunda, saldırgan oyuncular için kolay bir hedef olabilirsin.<br><br>\r\nDaha fazla bilgi için Wiki'ye göz atabilirsin: \r\n<a href=\"https://wiki.pr0game.com/wiki/En/Astrophysik\" target=\"_blank\">Astrophysics</a>"
  step10: "Kaynaklara daha hızlı ulaşmak istiyorsan başka oyunculara saldırabilir ya da kaynak transfer edebilirsin.<br>\r\nAncak dikkat et: diğer oyuncuların kaynaklarını almak ya da onların seni yağmalamasını engellemek için iyi bir stratejiye ihtiyacın var! \r\nBaşlangıç için küçük taşıyıcıları diğer oyuncuların gezegenlerine gönderip kaynaklarını yağmalayabilirsin.\r\nYağmalama esnasında dikkat edilmesi gereken temel şeyler için Wiki'yi inceleyebilirsin: \r\n<a href=\"https://wiki.pr0game.com/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven</a> - \r\n<a href=\"https://wiki.pr0game.com/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensorphalanx</a>"
  step10_u6: >-
    Kaynaklara daha hızlı ulaşmak istiyorsan başka oyunculara saldırabilir ya da
    kaynak transfer edebilirsin.<br>

    Ancak dikkat et: diğer oyuncuların kaynaklarını almak ya da onların seni
    yağmalamasını engellemek için iyi bir stratejiye ihtiyacın var! 

    Başlangıç için küçük taşıyıcıları diğer oyuncuların gezegenlerine gönderip
    kaynaklarını yağmalayabilirsin.

    Yağmalama esnasında dikkat edilmesi gereken temel şeyler için Wiki'yi
    inceleyebilirsin: 

    <a
    href="https://wiki.pr0game.com/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Saven</a>
  step11: "Filolar yok edildiğinde, bir enkaz alanı oluşur ve bu alan kaynaklarla doludur.\r\nBu enkazı toplamak için bir geri dönüştürücüye ihtiyacın var. Bu gemiler, enkaz alanından 20.000’e kadar kaynak toplayabilirler.\r\nBüyük bir filoyu yok etmek, yüksek miktarda kaynak kazancı sağlayabilir.<br><br>\r\nGeri dönüştürücüleri, filo menüsünden göndermek yerine galaksi menüsünden doğrudan enkaz alanına tıklayarak da yollayabilirsin."
  step12: "Tebrikler, eğitimi tamamladın!<br><br>\r\nBu oyun daha pek çok mekanik sunuyor. Örneğin, zaman ve çaba gereksinimleri açısından farklılık gösteren üç ana oyun tarzı var:<br>\r\n<ul>\r\n<li>Madenci: Kolonilerde madenleri geliştirir, çoğunlukla taşıyıcı kullanır</li>\r\n<li>Filocu: Puanlarının çoğunu savaş gemilerinden elde eder, kendi üretimi azdır, diğer oyuncuları yağmalar</li>\r\n<li>Komber: Her iki tarzın bir kombinasyonudur</li>\r\n</ul>\r\nOyunun ilerleyen aşamalarında, aylar önemli hale gelir ve sensor filoları gibi özellikleri keşfetmiş olmalısın.<br><br>\r\nDaha fazla soruların varsa, wiki'yi okuyabilir veya Discord’da topluluktan yardım isteyebilirsin."
  step12_u6: >-
    Tebrikler, eğitimi tamamladın!<br><br>

    Bu oyun daha pek çok mekanik sunuyor. Örneğin, zaman ve çaba gereksinimleri
    açısından farklılık gösteren üç ana oyun tarzı var:<br>

    <ul>

    <li>Madenci: Kolonilerde madenleri geliştirir, çoğunlukla taşıyıcı
    kullanır</li>

    <li>Filocu: Puanlarının çoğunu savaş gemilerinden elde eder, kendi üretimi
    azdır, diğer oyuncuları yağmalar</li>

    <li>Komber: Her iki tarzın bir kombinasyonudur</li>

    </ul>

    Daha fazla soruların varsa, wiki'yi okuyabilir veya Discord’da topluluktan
    yardım isteyebilirsin.
tutorial_title:
  step0: Bu ne tür bir oyun?
  step1: Bir şeyler kazan!
  step2: İnsanlarla kaynaş!
  step3: Savunmasız kalma!
  step4: Uzun vadeli düşün!
  step5: Gemiye ihtiyacımız var!
  step6: Gezegenine isim ver ve dostlar bul!
  step7: Diğerlerinin neye sahip olduğunu öğren!
  step8: Bilinmeze yolculuk!
  step9: Tek bir gezegenle yetinemezsin!
  step10: Gerçekten sadece kendi üretiminle mi yetineceksin?
  step11: Çöpçü modunu dene!
  step12: Başarıya ulaştın
