  servidor encontrarás as últimas notícias, bem como memes emocionantes entre as
  alianças do universo.<br>Faz perguntas sobre a mecânica do jogo e ajuda com as
  tuas próprias sugestões para o desenvolvimento do jogo.<br><br><!--/discord_url-->Claro que
  também responderemos às tuas perguntas no jogo.<br>No entanto, não te esqueças
  de que jogamos o jogo apenas como um passatempo. As respostas podem demorar
  alguns dias.<br>
