op_activate_vacation_mode: Activar Modo de Férias
op_activate_vacation_mode_confirm: >-
  O modo de férias não pode ser desativado novamente durante 48 horas. Tem a
  certeza?
op_activate_vacation_mode_descrip: >-
  O modo de férias foi concebido para o proteger durante períodos de ausência
  mais longos. Só pode ser ativado quando não há frotas próprias em movimento.
  Quando é ativado, protege-o de novos ataques. No entanto, os ataques que já
  começaram continuarão e as frotas amigas que estiverem a aguardar serão
  mandadas de volta! A produção de recursos, a construção de edifícios e
  encomendas de estaleiros, bem como a investigação, são interrompidas durante
  este período e serão retomadas depois. O modo de férias dura pelo menos 48
  horas, após as quais o podes desativar novamente.
