faq_overview: FAQ
questions:
  '1':
    '1':
      body: "<p>Ta część opisuje najważniejsze budynki: co budować na początku i do czego służy każdy z nich. Prężne imperium zaczyna się od stawiania ich w sensownej kolejności.</p>\n<h3>Elektrownia Słoneczna</h3>\n<p>Zbuduj ją jako pierwszą. Kopalnie potrzebują energii, żeby produkować metal, kryształ i deuterium. Gdy elektrownia będzie gotowa, pasek surowców i strona Produkcji pokażą, ile masz energii.</p>\n<h3>Kopalnia Metalu</h3>\n<p>Metal to jeden z trzech surowców. Prawie wszystko, co budujesz albo badasz, kosztuje metal, więc rozbudowa tej kopalni to priorytet. Na początku trzymaj ją o kilka poziomów wyżej niż pozostałe kopalnie.</p>\n<h3>Kopalnia Kryształu i Ekstraktor Deuterium</h3>\n<p>Kryształ jest potrzebny do budynków, statków i badań. Produkujesz go mniej niż metalu, przez co jest cenniejszy, a w późniejszej fazie gry często zażarcie o niego walczą. Deuterium napędza twoje floty, można je spalać na energię w Elektrowni Jądrowej i jest wymagane do kilku ważnych budynków i badań (w tym do Laboratorium Badawczego).</p>\n<p>Więcej informacji: <a href=\"{wiki_url}/wiki/En/Hauptseite\" target=\"_blank\">wiki</a>.</p>"
      title: "Krok 1"
    '2':
      body: "<p>Żeby rozwijać imperium i mieć do czynienia z innymi graczami, potrzebujesz kolejnych budynków. Badania i Stocznia pozwalają zacząć budować flotę i obronę planety.</p>\n<h3>Stocznia</h3>\n<p>Tu buduje się wszystkie statki (i obronę). Stocznię da się postawić wcześnie, ale wiele klas statków wymaga jeszcze dodatkowych badań. Menu Technologie pokazuje wymagania dla każdego statku i każdej jednostki obrony. Wyższe poziomy Stoczni przyspieszają budowę.</p>\n<h3>Laboratorium Badawcze</h3>\n<p>Tu zaczynasz badania. Odblokowują one budynki, statki, obronę i kolejne badania, a niektóre technologie dają też bonusy do tego, co już masz. Rozbudowa Laboratorium Badawczego skraca czas badań.</p>\n<h3>Fabryka Robotów</h3>\n<p>Fabryka Robotów to podstawa. Wyższe poziomy skracają czas budowy budynków i przyspieszają też produkcję statków. Gdy czasy budowy robią się długie, rozbuduj Fabrykę Robotów, żeby je znów zbić.</p>"
      title: "Krok 2"
    '3':
      body: "<p>Ta część dotyczy obrony planety i pierwszych ruchów flotą: jak wysyłać floty i jak radzić sobie z innymi graczami.</p>\n<h3>Widok Galaktyki</h3>\n<p>Służy do szukania innych graczy. Widzisz szczegóły o innych planetach i możesz wysyłać część floty bezpośrednio z tego widoku. Możesz też pisać do graczy albo szpiegować planetę, jeśli masz Sondy Szpiegowskie.</p>\n<h3>Wysyłanie flot</h3>\n<p>Floty wyślesz z widoku Galaktyki albo z menu Flota. Najpierw wybierz, ile statków każdego typu wysyłasz. Potem ustaw cel (współrzędne z widoku Galaktyki) i prędkość. Na koniec wybierz misję, np. Atak, Stacjonuj, Zostań, Recykling albo Transport.</p>\n<h3>Obrona</h3>\n<p>Gdy masz Stocznię, możesz też budować obronę. Chroni ona planetę i walczy razem z każdą flotą obecną w chwili ataku. W przeciwieństwie do statków, około 70% zniszczonej obrony jest naprawiane po walce.</p>"
      title: "Krok 3"
    category: "Wskazówki dla początkujących"
  '2':
    '1':
      body: "<h3>Rajdy</h3>\n<p>Rajd to atakowanie innych graczy, żeby zabrać im surowce. Najczęstsze rodzaje:</p>\n<ul>\n<li>Farmienie</li>\n<li>Atak na flotę</li>\n<li>Rajd na pole zniszczeń</li>\n<li>Przechwytywanie</li>\n</ul>\n<h3>Farmienie</h3>\n<p>To najczęstsze ataki w uniwersum. Szpiegujesz pobliskie planety i wysyłasz małe floty z wystarczającą ładownością i siłą ognia, żeby przebić lekką obronę i nadal wyjść na plus: zrabowane surowce powinny przewyższać zużyte deuterium plus twoje własne straty.</p>\n<h3>Atak na flotę</h3>\n<p>Wyższa szkoła rajdów: polowanie na floty innych graczy. Oprócz Sond Szpiegowskich i szczęścia liczą się Falanga i dobry timing. Gdy wypatrzysz wartą uwagi flotę, nadal musisz ją złapać i zrecyklingować pole zniszczeń. Często jest to trudne, bo opłacalne floty mogą przekraczać ładowność twoich recyklerów – wtedy musisz skoordynować recyklery i w razie potrzeby partnerów z AKS oraz flotę bojową.</p>\n<h3>Rajd na pole zniszczeń</h3>\n<p>Najłatwiejszy i najmniej lubiany sposób na zysk: zbieranie pól zniszczeń, które stworzyli inni gracze. Pole zniszczeń należy do tego, kto je zbierze, więc podkradanie pól to częste źródło złej krwi.</p>\n<h3>Przechwytywanie</h3>\n<p>Zadanie flociarza to budować flotę i niszczyć flotę. Nie zawsze trafisz na stojące statki, więc łapanie dobrych graczy często oznacza przechwytywanie ich w trakcie sejwu albo lotu z atakiem. To nie jest łatwe, ale są sposoby, żeby się przed tym bronić.</p>\n<ul>\n<li><p>Księżyc ułatwia przechwytywanie, bo Falanga skanuje ruchy flot na planetach w zasięgu (nie na księżycach). Jeśli znajdziesz flotę wartą złapania, wylicz, ile jej jeszcze zostało lotu – zwłaszcza czas powrotu po dotarciu. Do tego wystarczą poziomy napędów (Spalinowego, Impulsowego, Nadprzestrzennego) z raportu szpiegowskiego, liczone ręcznie albo kalkulatorem czasu lotu. Przyda się dokładny zegarek. Zgraj swoją flotę i recyklery tak, żeby dotarły około 3–5 sekund po celu na jego planetę lub księżyc. Recyklery też trzeba zgrać w czasie.</p></li>\n<li><p>Żeby przechwycić flotę lecącą z księżyca na pole zniszczeń, potrzebujesz przybliżonego czasu startu. Stwórz widoczne pole zniszczeń w miejscach, gdzie według ciebie będą zbierać (np. Sondami Szpiegowskimi). Policz, ile leci tam ich flota, obserwuj układ i odświeżaj, aż pole zniknie. Zanotuj ten czas, dodaj ich lot powrotny i zgraj swoją flotę oraz recyklery kilka sekund za tym przybyciem.</p>\n<p><b>Uwaga:</b> to nie zawsze działa. Częsta kontra to recykler wysłany przodem, który najpierw czyści pole.</p></li>\n<li>Inna forma przechwytywania to stacjonowanie u znajomego, żeby go chronić, co zmusza atakujących do zawrócenia, bo flota obrońców byłaby zbyt silna. Ryzyko złapania w ten sposób możesz zmniejszyć skanem sejwu.</li>\n<li><p>Jeśli gracz przerzuca flotę z jednej planety na drugą, a potem ją zawraca, flota znika z Falangi. Obserwuj jego schemat sejwowania (kiedy startuje i kiedy zawraca). Gdy spodziewasz się zawrotu, skanuj planetę Falangą co sekundę. W chwili, gdy flota zniknie, zanotuj czas, dodaj lot powrotny i dolataj około 4–6 sekund później z flotą i recyklerami.</p>\n<p>Jeśli sejwuje z księżyca na pole zniszczeń i wysyła recyklery przodem, przechwycenie jest niemal niemożliwe, chyba że zniszczysz księżyc. Wyślij Gwiazdy Śmierci z misją Zniszcz. Gdy księżyca już nie ma, flota wraca na planetę; skanuj tę planetę Falangą i wskakuj kilka sekund za nią.</p>\n<p>Wszystkie te techniki działają znacznie lepiej, jeśli znasz nawyki celu – na przykład sejw codziennie o 23:00 albo wchodzenie online w południe. Zbadaj gracza, zanim go przechwycisz.</p></li>\n</ul>\n<p>Więcej w wiki: <a href=\"{wiki_url}/wiki/En/Saven\" target=\"_blank\">Saven floty</a>, <a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Falanga</a>.</p>"
      title: "Rajdy"
    '2':
      body: "<h3>Atak z AKS</h3>\n<p>Żeby zaatakować wspólnie, najpierw wyślij na cel flotę z misją Atak. Po starcie otwórz menu Flota i przyciskiem AKS zamień tę flotę w grupę AKS. Tam możesz zmienić nazwę grupy i zaprosić innych graczy; gracz, który zaczął atak, jest zapraszany automatycznie. Każdy zaproszony gracz wysyła potem własne statki na te same współrzędne z misją Atak łączony.</p>\n<p>Grupa zawsze leci tak długo, jak najwolniejsza uczestnicząca flota. Szybsze floty dołączające później nie skracają pozostałego czasu. Wolniejsze floty wydłużają pozostały czas do własnego czasu lotu. Zwykle w jednym ataku AKS może wziąć udział maksymalnie 5 graczy i 16 flot (ustawienia uniwersum mogą się różnić). Dołączająca flota może wydłużyć pozostały czas lotu najwyżej o 30%. Jeśli zostało 100 minut, dołączająca flota może lecieć najwyżej 130 minut.</p>\n<p><b>Uwaga:</b> jeśli założyciel AKS zawróci swoją flotę, zawracają też wszystkie floty w grupie.</p>\n<h3>Obrona z AKS</h3>\n<p>Gdy jesteś atakowany, mogą ci pomóc członkowie sojuszu i znajomi. Wysyłają flotę na atakowane współrzędne, wybierają, jak długo zostaną, i używają misji Zostań. Oprócz deuterium na lot przy starcie pobierane są dodatkowe koszty postoju, zależne od wielkości floty i czasu. W trakcie postoju walczą w każdej bitwie na tej planecie lub księżycu i w raportach szpiegowskich pojawiają się tak, jakby były twoimi statkami. Zgraj postoje tak, żeby flota dotarła tuż przed atakującym – wtedy skan sejwu rzadziej ją zauważy. Gracze stacjonujący mogą w każdej chwili zawrócić z menu Flota; w przeciwnym razie flota odczeka postój i wróci do domu.</p>\n<h3>Deuterium na 1 godzinę postoju</h3>\n<p>Mały Transporter: 5<br>\nDuży Transporter: 5<br>\nLekki Myśliwiec: 2<br>\nCiężki Myśliwiec: 7<br>\nKrążownik: 30<br>\nOkręt Wojenny: 50<br>\nStatek Kolonizacyjny: 100<br>\nRecykler: 30<br>\nSonda Szpiegowska: 1/10<br>\nBombowiec: 100<br>\nNiszczyciel: 100<br>\nGwiazda Śmierci: 1/10</p>"
      title: "Wspólna walka – AKS"
    '3':
      body: "<p>Księżyc może powstać, gdy powstanie pole zniszczeń o wielkości co najmniej 100 000 jednostek (1% szansy na księżyc). Szansa kończy się na 20%, niezależnie od tego, jak duże jest pole.</p>\n<h3>Ogólnie</h3>\n<p>Księżycom można zmieniać nazwę jak planetom, ale „(Księżyc)” zostaje w nazwie. Na jedną planetę przypada najwyżej jeden księżyc. Księżyc pozwala sejwować flotę poza zasięgiem Falangi, więc warto go sobie stworzyć stosunkowo wcześnie. Na księżycu możesz zbudować Fabrykę Robotów, Stocznię, Magazyn Metalu, Magazyn Kryształu, Zbiornik Deuterium, Depozyt Sojuszniczy, Bazę Księżycową, Falangę i Teleporter.</p>\n<h3>Moonshot</h3>\n<p>Moonshot to celowe niszczenie statków w celu stworzenia pola zniszczeń. Zwykle używa się Lekkich Myśliwców: przy 30% floty i 0% obrony w polu zniszczeń 1667 Lekkich Myśliwców daje 20% szansy na księżyc. Są tanie w stracie i lądują bardzo blisko limitu. Jeśli silniejszy gracz niszczy Lekkie Myśliwce słabszemu, pole może zebrać każdy. Jeśli słabszy gracz atakuje silniejszego statkami przeznaczonymi na stracenie, pole może zebrać tylko słabszy – w przeciwnym razie to pushing. Księżyce i próby księżycowe podlegają zasadom pushingu.</p>\n<p>W uniwersum, w którym obrona także tworzy pole zniszczeń, często lepiej zbudować obronę i pozwolić ją rozbić w kilku falach, żeby mieć kilka prób księżyca. Częsty wybór to 3334 Wyrzutnie Rakiet albo 3334 Małe Lasery.</p>\n<p>Gdy powstanie księżyc, raport z walki informuje, że ogromne ilości wolnego metalu i kryształu zbijają się razem i tworzą satelitę wokół planety.</p>\n<p>Szansa na księżyc od 1% do 19%: losowa wielkość. Szansa na księżyc 20%: ponad 8000 km średnicy. Księżyc nigdy nie jest większy niż 8944 km.</p>\n<h3>Budynki</h3>\n<p>Magazyny zwykle nie opłaca się budować na księżycu, bo nic się tam nie produkuje. Stocznia też rzadko się przydaje: czasy budowy są długie, a statki zbudujesz na planecie. Depozyt Sojuszniczy jest kwestią sporną; zajmuje też cenne pola.</p>\n<p>Trzy budynki tylko dla księżyca to:</p>\n<ul>\n<li><p><b>Baza Księżycowa</b><br>Dodaje pola pod zabudowę: 3 na poziom, z czego jedno zajmuje kolejna rozbudowa Bazy Księżycowej.</p></li>\n<li><p><b>Falanga</b><br>Pokazuje ruchy flot na wrogich planetach (nie na księżycach). Zasięg rośnie z każdym poziomem.</p></li>\n<li><p><b>Teleporter</b><br>Przerzuca statki natychmiast z jednego księżyca na drugi. Surowce nie mogą lecieć razem z nimi. Po skoku brama potrzebuje czasu na ostygnięcie (zwykle godziny), inaczej się przegrzeje.</p></li>\n</ul>\n<p>Częsta kolejność budowy na księżycu:<br>\n<b>Legenda:</b><br>\nBK – Baza Księżycowa<br>\nFA – Falanga<br>\nTE – Teleporter<br>\nFR – Fabryka Robotów</p>\n<p>BK1 – FR1 – FR2 – BK2 – FA1 – FR3 – BK3 – FA2 – FR4 – BK4 – FA3 – FR5 – BK5 – FA4 – FR6 – BK6 – FA5 – FA6 – BK7 – FA7 – FA8 – BK8 – TE1<br>\nPotem możesz dalej rozbudowywać Falangę, jeśli masz surowce. Możesz też rozebrać część poziomów Fabryki Robotów i przeznaczyć te pola na falangę.</p>\n<h3>Zniszczenie</h3>\n<p>Księżyc można zniszczyć tylko Gwiazdami Śmierci. W menu misji wybierz Zniszcz zamiast Atak. Każda flota na księżycu musi zostać najpierw zniszczona; ocalałe Gwiazdy Śmierci mogą jeszcze zginąć przy niszczeniu samego księżyca. Zniszczenie księżyca nie tworzy pola zniszczeń.</p>\n<h3>Ataki Gwiazdami Śmierci na księżyc</h3>\n<p>Szansa zniszczenia księżyca: (100 − sqrt(wielkość księżyca)) × sqrt(liczba Gwiazd Śmierci). Szansa, że atakujące Gwiazdy Śmierci zostaną zniszczone: sqrt(wielkość księżyca) / 2. Większe księżyce są ryzykowniejsze do zniszczenia.</p>\n<h3>Szansa na księżyc i wielkość</h3>\n<p>100 000 jednostek pola zniszczeń daje 1% szansy na księżyc. Maksymalna szansa: 20%. Po późniejszej zmianie każdy księżyc ma maksymalną liczbę pól pod zabudowę (79). Wcześniej było to FLOOR((średnica / 1000)²). Największy możliwy księżyc: 8944 km średnicy, 79 pól.</p>\n<p>Więcej w wiki: <a href=\"{wiki_url}/wiki/En/Mond\" target=\"_blank\">Księżyce</a>, <a href=\"{wiki_url}/wiki/En/Hauptseite\" target=\"_blank\">wiki</a>.</p>"
      title: Księżyce
    '4':
      body: "<h3>Jak założyć sojusz?</h3>\n<p>Otwórz Sojusz w menu po lewej, a potem Załóż własny sojusz. Wpisz tag sojuszu (krótki skrót) i nazwę sojuszu. Przykład: sojusz o nazwie „Top Sojusz” może mieć tag „TOP”.</p>\n<p>Dozwolone są tylko litery, cyfry i spacje. Po wpisaniu tagu i nazwy kliknij Załóż. Jeśli taka nazwa lub tag są już zajęte, dostaniesz błąd i musisz wybrać inne. Gdy się uda, zobaczysz potwierdzenie; Dalej otwiera jeszcze pusty panel sojuszu, do którego zawsze dojdziesz przez Sojusz w menu po lewej. U góry widzisz swój tag i nazwę.</p>\n<p>Poniżej znajdziesz:<br>\nCzłonkowie: każdy członek z punktami, współrzędnymi planety macierzystej, datą dołączenia i statusem online. Kliknij nagłówki kolumn, żeby sortować.<br>\nTwoja ranga: nazwa twojej rangi oraz link do zarządzania sojuszem.<br>\nWiadomości zbiorcze: wyślij wiadomość do całego sojuszu albo do wybranych rang.</p>\n<h3>Zarządzanie sojuszem</h3>\n<p>W Rangach ustawiasz uprawnienia dla każdej rangi, np. rozwiązanie sojuszu albo wysyłanie wiadomości zbiorczych. W Członkach możesz wyrzucać graczy, przydzielać rangi i sprawdzać, od ilu dni są offline. Możesz też zmienić tag i nazwę sojuszu.</p>\n<p>Zarządzanie tekstami edytuje teksty sojuszu. Tekst zewnętrzny widzi każdy gracz, wewnętrzny tylko członkowie. Tekst podania to szablon dla osób, które się zgłaszają.</p>\n<p>W Opcjach możesz podlinkować obrazek banera i forum sojuszu, wybrać, czy podania są otwarte, i ustawić nazwę rangi założyciela. Jeśli zostawisz to pole puste, ranga nazywa się Założyciel.</p>\n<p>Możesz rozwiązać sojusz albo przekazać go innemu członkowi, który zostaje wtedy założycielem.</p>"
      title: Sojusz
    '5':
      body: "<h3>Gdzie znajdę więcej informacji?</h3>\n<!--wiki_url--><p>Pierwsze miejsce, do którego warto zajrzeć, to wiki:</p>\n<p><a href=\"{wiki_url}/wiki/En/Hauptseite\" target=\"_blank\">Strona główna wiki (angielski)</a><br>\n<a href=\"{wiki_url}/wiki/En/Buildorder\" target=\"_blank\">Kolejność budowy</a><br>\n<a href=\"{wiki_url}/wiki/En/%C3%96konomik\" target=\"_blank\">Style gry (Górnik, Raider, Comber)</a><br>\n<a href=\"{wiki_url}/wiki/En/Saven\" target=\"_blank\">Saven floty</a><br>\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Poradnik sejwowania floty</a><br>\n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">Ekspedycje</a></p><!--/wiki_url-->\n<p>Niemiecki (owiki):<br>\n<a href=\"https://www.owiki.de/index.php/Aufbautaktik\" target=\"_blank\">Taktyka rozwoju</a><br>\n<a href=\"https://www.owiki.de/index.php/Miner\" target=\"_blank\">Styl gry: Górnik</a><br>\n<a href=\"https://www.owiki.de/index.php/Raideraccount\" target=\"_blank\">Styl gry: Flociarz</a><br>\n<a href=\"https://www.owiki.de/index.php/Comber\" target=\"_blank\">Styl gry: Comber</a><br>\n<a href=\"https://www.owiki.de/index.php/Saven\" target=\"_blank\">Saven floty</a></p>"
      title: Linki
    category: Informacje zaawansowane
