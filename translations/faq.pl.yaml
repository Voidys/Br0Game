faq_overview: FAQ
questions:
  '1':
    '1':
      body: "<p>Ta część samouczka opisuje głównie budynki. Wyjaśnia, co należy budować na początku i do czego są one potrzebne. Aby zbudować udane imperium ważne jest, by budować budynki w określonej kolejności. </p>\r\n<h3>Elektrownia słoneczna:</h3>\r\n<p>W celu wytwarzania surowców tak bardzo potrzebnych twojemu rozwijającemu się imperium, pierwsze co musisz zrobić to zbudować elektrownię. Produkuje ona energię, która jest potrzebna do produkcji zasobów przez kopalnię. Ilość energii możesz sprawdzić w zakładce zasoby. Dowiesz się tam ile produkujesz i jakie są twoje potrzeby.</p>\r\n<h3>Kopalnia metalu:</h3>\r\n<p>Metal jest jednym z trzech zasobów wydobywalnych w grze. Jest najszybciej i najtaniej produkowany, ale że jest używany do budowy praktycznie wszystkiego na planecie, rozwój tej kopalni jest wskazany! W początkowym etapie gry warto, by poziom kopalni metalu był o kilka leveli wyższy.</p>\r\n<h3>Kopalnia kryształu i ekstraktor deuterium:</h3>\r\n<p>Kryształ również jest bardzo ważnym elementem do budowy budynków, statków czy odkrywania nowych technologii. Jego wydobycie jest znacząco mniejsze, dlatego jedna jednostka kryształu odpowiada dwóm jednostkom metalu. Deuterium to głównie paliwo dla floty, jest również wymagany podczas prowadzenia ważnych badań. Jego wydobycie jest również znacząco mniejsze w stosunku do metalu, jak i kryształu!</p>"
      title: Część 1
    '2':
      body: "<p>Podczas rozbudowy swojego imperium będziesz zmuszony do konkurowania lub też współpracy w innymi graczami. Przyda się do tego zaawansowana technologia, jak również rozbudowana stocznia, umożliwiająca stworzenie floty godnej twojego imperium, jak i obronę. Więcej informacji znajdziesz tutaj:</p>\r\n<h3>Stocznia:</h3>\r\n<p>Wszystkie statki czy też elementy obrony buduje się w stoczni. Na samym początku musisz zacząć od jej zbudowania. Wszelkich informacji, jakie będą Ci potrzebne odnośnie technologii, która jest wymagana do budowy zaawansowanych jednostek, dostarczy Ci zakładka \"Technologia\". Rozbudowana stoczni wpływa również na szybkość budowy zarówno jednostek, jak i obrony.</p>\r\n<h3>Laboratorium badawcze:</h3>\r\n<p>Budynek ten służy do przeprowadzenia badań na twoich planetach. Są one wymagane do budowy zaawansowanych budynków, jak również mogą poprawić pracę dotychczasowych. Poprzez rozbudowę laboratorium badawczego zwiększysz nie tylko szybkość badań, ale również będziesz mógł odkryć bardziej zaawansowane technologie.</p>\r\n<h3>Fabryka robotów:</h3>\r\n<p>Fabryka robotów to jeden z ważniejszych budynków. Dzięki jego rozbudowie przyspiesza budowę innych budynków na planecie!</p>"
      title: Część 2
    '3':
      body: "<p>W tej części dowiesz się krótko, jak bronić własnej planety i jak zarządzać własną flotą. Znajdziesz tutaj również informacje przydatne podczas interakcji z innymi graczami.</p>\r\n<h3>Galaktyka:</h3>\r\n<p>Galaktykę przeglądasz w celu lokalizacji innych graczy, jak i np. w celu poszukiwania złomu. Znajdziesz tam również szczegółowe informacje o sąsiedztwie planet innych graczy, możesz też wysyłać bezpośrednio z podglądu galaktyki niektóre akcje floty, np. akcję szpieguj gracza, jeśli masz zbudowane sondy szpiegowskie, czy też wysyłać wiadomości do innych graczy.</p>\r\n<h3>Floty:</h3>\r\n<p>Floty możesz wysyłać bezpośrednio z przeglądu galaktyki albo z zakładki flota. Najpierw wybierasz ilość z dostępnych jednostek, potem ustawiasz cel(podajesz koordynaty, które znajdziesz w galaktyce) i ustawiasz szybkość, z jaką ma poruszać się flota. Musisz wybrać również rodzaj akcji jaką ma przeprowadzić flota, poczynając od stacjonuj, a na zbieraniu złomu kończąc.</p>\r\n<h3>Obrona:</h3>\r\n<p>By móc bronić swoją planetę tuż po zbudowaniu stoczni będziesz miał możliwość budowy obrony stacjonarnej. Daje ona ochronę przed atakami innych graczy, jak również broni planety, gdy twoja flota jest na innej planecie. W przeciwieństwie do floty, gdy zbudujesz obronę i zostanie ona zniszczona w trakcie walki, to po walce ma 70% szans na to, że zostanie reaktywowana.</p>"
      title: Część 3
    category: Wskazówki dla początkujących
  '2':
    '1':
      body: "<h3>Ataki:</h3>\r\n<p>Termin, którego możemy użyć opisując ataki na innych graczy.\r\nRajdy można podzielić na kilka typów:</p>\r\n<ul>\r\n\t<li>Farmienie</li>\r\n\t<li>Polowanie na flotę</li>\r\n\t<li>Pola zniszczeń</li>\r\n\t<li>Przechwytywanie </li>\r\n</ul>\r\n<h3>Farmienie:</h3>\r\n<p>Najprostszy sposób zdobycia zasobów, wykonywany tak często, jak to tylko możliwe.<br>\r\nPolega na wyszukiwaniu słabych planet w naszym pobliżu (najlepiej graczy nieaktywnych lub mało aktywnych). Wyszukujemy planety, na których nie ma obrony lub jeśli jest to jest na tyle mała, że atak na nią nie przyniesie nam strat lub starty będą minimalne. Innymi słowy musisz atakować to, na czym najwięcej zarobisz, jak najmniej tracąc.</p>\r\n<h3>Polowanie na flotę:</h3>\r\n<p>Dla bardziej zaawansowanych.<br>\r\nPolowanie na wrogie floty.<br>\r\nNajbardziej emocjonująca część gry, czyli polowanie na flotę przeciwnika. Czego potrzebujesz? Sporej dawki szczęścia, a jeszcze więcej czasu, bo do najłatwiejszych zadań to nie należy. Nieoceniona może również okazać się falanga, a jeśli przeciwnik jest silniejszy to wsparcie przyjaciół z sojuszu. Gdy uda Ci się już zniszczyć wrogą flotę, to przychodzi czas na zebranie pola zniszczeń ze złomowania. I tutaj musisz pamiętać o tym, że takie pole zniszczeń może Ci ktoś podkraść. Najważniejszą częścią złomowania jest koordynacja ataku floty i zbierania złomu. Jeśli robisz AKS to bardzo ważną rzeczą jest współpraca graczy.</p>\r\n<h3>Pola zniszczeń:</h3>\r\n<p>Najbardziej wygodna metoda zdobywania zasobów, jak również najbardziej znienawidzona, jeśli dojdzie do kradzieży pola zniszczeń.\r\nPola zniszczeń z floty nie należą do nikogo, więc każdy może je zebrać, dlatego kradzież pola zniszczeń to duży problem.</p>\r\n<h3>Przechwytywanie</h3>\r\n<p>Najważniejsze zadanie to zbudować flotę i zniszczyć flotę przeciwnika. Nie zawsze jest łatwo zniszczyć czyjąś flotę, a jeśli polujemy na dobrego gracza, wtedy polowanie może być bardzo wymagające. Złapać flotę możesz jeśli leci z misją transportuj lub atakuj. Jednak są misje, podczas których flot nie da się złapać w żaden sposób.</p>\r\n<ul>\r\n\t<li><p>Jeśli masz księżyc, a na nim falangę, to przechwycenie obcej floty robi się dużo łatwiejsze. Wtedy wybierasz planetę i ją skanujesz. Jeśli dostrzeżesz aktywne floty na tej planecie, to musisz zdecydować, czy opłaca Ci się atak. Jeśli tak to czas, by zdobyć kilka potrzebnych ci danych. Musisz zwrócić uwagę, jak długo flota leci, kiedy doleci do celu i czy będzie wracać. A to znaczy, że musisz również znać szczegóły technologiczne przeciwnika (poziom rozwoju silników najwolniejszej jednostki - zdobędziesz je wysyłając sondy szpiegowskie z misja szpieguj), wtedy możesz za pomocą kalkulatora wyliczyć dokładny czas nie tylko przybycia do celu, ale również powrotu. Bardzo przydatny może się okazać zegarek z budzikiem, nie tylko do ocenienia, o której godzinie flota dotrze.</p>\r\n\t<p>Gdy już wiesz o której flota się zjawi na planecie czy też księżycu, musisz wysłać swoją flotę tak, by dotarła do celu 2-5 sekund po flocie przeciwnika (jeśli przeciwnik jest dobry, to 5 sekund może się okazać zbyt dużą różnicą i zdąży uciec). Kolejne co musisz zrobić to wysłać odpowiednią ilość recyklerów, by zebrać złom. Powinny się zjawić maksymalnie kilka sekund po ataku, w przeciwnym wypadku ktoś może Ci skraść pole zniszczeń!</p></li>\r\n\t<li>Jedną z form polowania może być również zastawianie pułapek. Zostawiając flotę słabszą niż mamy w rzeczywistości (flotę dosyłamy z innej planety tak, by była 10 sekund przed atakiem) lub też korzystanie z aks i łączenia flot tuż przed atakiem (misja zostań). Zawsze warto pilnować swojego ataku, by móc zawrócić, jeśli sytuacja ulegnie zmianie.</li>\r\n\t<li><p>Jeśli przeciwnik wykonuje trik z flotą, którą wysyła z misją stacjonuj, a potem ją zawraca, to takiej floty nie widać na falandze, ale i tak można ją przechwycić. Kluczem zawsze jest dokładne studiowanie przeciwnika - musisz poznać jego przyzwyczajenia, np. jeśli flotę zawrócił kilka minut przed dotarciem do celu, a ty wiesz dokładnie, ile leciała flota w tę stronę, to możesz łatwo, policzyć o której będzie u celu i ją przechwycić. Jeśli przeciwnik korzysta z księżyców, zawsze możesz księżyc zniszczyć, wtedy flota będzie skierowana automatycznie na planetę i będzie widoczna w falandze. Do niszczenia księżyców służy misja niszcz. \r\n\r\nJak widać sposobów na przechwycenie floty przeciwnika jest wiele - wymienione tutaj to tylko kawałek góry lodowej. Więcej dowiesz się rozmawiając z innymi graczami czy też przeglądając forum.</li></ul>"
      title: Rajdy
    '2':
      body: "<h3>Atakowanie AKS</h3>\r\n<p>Jak wiadomo można atakować wspólnie, by to zrobić musisz wysłać flotę z misją \"atakuj\". Potem wchodzisz w zakładkę floty - pod przyciskiem zawróć masz przycisk acs, a tam możliwość zmiany nazwy ataku, jak również zapraszanie innych do acs by dołączyli. Zaprasza osoba, która rozpoczyna atak, i to ona wysyła zaproszenia! Do ataku możesz zaprosić maksymalnie 5 graczy. W jednym ataku acs może być połączone maksymalnie 16 flot. Floty automatycznie dostosują prędkość do najwolniejszej floty biorącej udział w ataku, ale istnieje ograniczenie w możliwości spowolnienia floty do 30% czasu lotu. A to znaczy, że jeśli wyślesz flotę i przykładowo będzie ona mieć 100 minut do celu, to najwolniejsza flota może mieć maksymalnie 130 min do celu! Więc jeśli kolejna osoba chcąca dołączyć to tego ataku będzie miał czas dolotu mniejszy od 100 minut, to nie będzie mogła do takiego ataku dołączyć!<br>\r\n<b>Uwaga:</b> jeśli jedna z flot zostanie zawrócona, to reszta poleci dalej!!</p>\r\n<h3>Obrona  AKS</h3>\r\n<p>Tak samo jak i atakować, to wspólnie można również się bronić celem minimalizacji strat. Widząc, że leci na ciebie atak, możesz poprosić albo kogoś z listy twoich znajomych lub kogoś z sojuszu, by podesłał Ci flotę. Ważne jednak, byś na planecie, na którą ma zostać wysłana flota, miał zbudowany depozyt sojuszniczy. W innym wypadku nie będzie możliwe wysłanie floty na twoją planetę z misją \"zostań\"! Jeśli kogoś prosisz o wsparcie należy postarać się o to, by flota sojusznika pojawiła się kilka sekund przed atakiem - w innym wypadku atakujący gracz sprawdzając siły na planecie może stwierdzić, że atak mu się nie opłaca i lepiej wycofać swoje jednostki.</p>\r\n<h3>Zapotrzebowanie na deuterium w czasie postoju na obcej planecie (1h postoju) to ilość jednostek :</h3>\r\n<p>Mały transporter: 5<br>\r\nDuży transporter: 5<br>\r\nLekki myśliwiec: 2<br>\r\nCiężki myśliwiec: 7<br>\r\nKrążownik: 30<br>\r\nPancernik: 50<br>\r\nKolonizator: 100<br>\r\nRecykler: 30<br>\r\nSonda szpiegowska: 1/10<br>\r\nBombowiec: 100<br>\r\nNiszczyciel: 100<br>\r\nGwiazda śmierci: 1/10</p>"
      title: Wspólna walka - AKS
    '3':
      body: "<p>By powstał księżyc musi w trakcie walki powstać pole zniszczeń z minimalną ilością jednostek, czyli 100 000. Każde następne 100 000 jest przeliczone na 1% szansy na powstanie księżyca, aż do osiągnięcia maksymalnie 20% szansy na księżyc! Jeśli pole zniszczeń jest znacząco większe, wpływa to tylko na średnicę księżyca, ale nie modyfikuje maksymalnej szansy na powstanie go!</p>\r\n<h3>Ogólnie</h3>\r\n<p>Na jedną planetę przypada tylko 1 księżyc. Możesz zmieniać nazwę księżyca. By móc budować na księżycu musisz zbudować najpierw bazę księżycową - to najważniejszy budynek, ponieważ zwiększa ilość pól do zabudowy</p>\r\n<h3>Księżycowa próba</h3>\r\n<p>Jako księżycową próbę uważa się celowo wysłaną flotę składającą się np. z lekkich myśliwców w ilości 1667 (co daje dokładnie 20% szansy) na silnie bronioną planetę. Dlaczego LM? Dlatego, że są tanie, ale również stosunkowo łatwo je zniszczyć. Oczywiście możesz użyć innych jednostek w innych ilościach i może to wyjść taniej lub drożej. Księżyc nigdy nie będzie większy niż średnica 8944 km.</p>\r\n<h3>Budownictwo</h3>\r\n<p>Budowę na księżycu powinieneś zacząć od zbudowania bazy księżycowej, która da Ci dodatkowe pola pod budowę. Ponieważ pola do zabudowy na księżycu są bardzo cenne i co chwilę trzeba stawiać bazę księżycową nie warto tam budować czegoś, co nie jest absolutnie niezbędne, typu magazyny, stocznia itp.<br>\r\nNajważniejsze budynki na księżycu:</p>\r\n<ul><li><p><b>Baza księżycowa</b><br>Najważniejszy budynek na księżycu. Każdy poziom rozbudowy daje Ci 2 dodatkowe pola do zabudowy.</p></li>\r\n<li><p><b>Falanga</b><br>Falanga służy do szpiegowania aktywnych flot na planetach w jej zasięgu. Każdy poziom zwiększa zasięg falangi. Falanga nie może szpiegować księżyców, tylko planety!</p></li>\r\n<li><p><b>Teleporter</b><br>Służy do natychmiastowego przesyłania floty z jednego księżyca na drugi. Musisz mieć conajmniej 2 księżyce, by móc go używać. Nie możesz w ten sposób transportować zasobów, tylko floty wojenne. Każde użycie wymaga ponownego naładowania się i trwa określoną ilość czasu!</p></li></ul>\r\n<h3>Zniszczenie księżyca</h3>\r\n<p>Księżyc można zniszczyć za pomocą Gwiazdy śmierci - to jedyna jednostka mogąca tego dokonać.</p>\r\n<p>W misjach wybierz misję \"zniszcz\" i wyślij Gwiazdy do pracy. Po zniszczeniu księżyca nie zostaje pole zniszczeń.</p>\r\n"
      title: Księżyce
    '4':
      body: "<h3>Jak mogę założyć sojusz?</h3>\r\n<p>By założyć sojusz musisz się udać do zakładki sojusze w menu. Potem klikasz załóż sojusz, podajesz nazwę i tag sojuszu. Gotowe.<br>\r\nPamiętaj, że w nazwach nie możesz używać znaków specjalnych.<br>\r\n<h3>Menu zarządzania sojuszem</h3>\r\n<p>Wszystkie działania związane z istnieniem sojuszu ustawiasz w panelu zarządzania sojuszem. Dotyczy to rang w sojuszu, wiadomości, przykładowych podań czy też polityki z innymi sojuszami. Ważne by osoba, która zarządza sojuszem, miała zacięcie dyplomatyczne, które pomaga nie tylko podczas wojen, ale również podczas szukania innych sojuszników, paktowania z innymi sojuszami itd.<br>"
      title: Sojusz
    '5':
      body: "<h3>Gdzie mogę znaleźć więcej informacji?</h3>\r\n<p>Niemiecki:<br>\r\n<a href=\"https://www.owiki.de/index.php/Aufbautaktik\" target=\"_blank\">Przewodnik dla początkujących (niemiecki)</a><br>\r\n<a href=\"https://www.owiki.de/index.php/Miner\" target=\"_blank\">Playstyle: Górnik (niemiecki)</a> <br>\r\n<a href=\"https://www.owiki.de/index.php/Raideraccount\" target=\"_blank\">Playstyle: Fleeter(niemiecki)</a> <br>\r\n<a href=\"https://www.owiki.de/index.php/Comber\" target=\"_blank\">Playstyle: Cokmber(niemiecki)</a> <br>\r\n<a href=\"https://www.owiki.de/index.php/Saven\" target=\"_blank\">Oszczędzanie(niemiecki)</a></p>\r\n<p>Angielski:<br>\r\n<a href=\"https://ogame.fandom.com/wiki/Quick_Start_Guide\" target=\"_blank\">Skrócona instrukcja obsługi (angielski)</a><br>\r\n<a href=\"https://ogame.fandom.com/wiki/Playing_Styles\" target=\"_blank\">Style gry (Górnik, Fleeter, Comber)(angielski)</a><br>\r\n<a href=\"https://ogame.fandom.com/wiki/Fleetsaving\" target=\"_blank\">Oszczędzanie(angielski)</a></p>"
      title: Linki
    category: Informacje zaawansowane
