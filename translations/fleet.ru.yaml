sys_colo_notech: >-
  Один из Ваших флотов достигает координат %s. Когда поселенцы приблизились к
  планете, они обнаружили, что их оборудование не подходит для преобладающих
  климатических условий. Необходимо сильнее развивать технологии.
  Разочарованные, поселенцы возвращаются домой.
sys_colo_notfree: >-
  Один из Ваших флотов достигает координат %s. Поселенцы не нашли планету
  пригодную для жизни. Огорчённые, они вынуждены возвратиться домой.
