sys_defender_won: Обороняющийся выиграл битву.
sys_destroyed: Уничтожен
sys_destruc_echec: >-
  На поверхности луны начинают появляться гигантские трещины, но что-то идёт не
  так, как надо, гравитон в реакторах вызывает реакцию и звёзды смерти
  разлетаются на куски.
sys_destruc_lune: 'Вероятность уничтожения луны составила: %d%% '
sys_destruc_mess1: 'Звезда смерти выпустила гравитон на орбиту луны. '
sys_destruc_null: >-
  Звёзды смерти не произвели достаточно мощный выстрел, миссия не выполнена.
  Флот возвращается домой.
sys_destruc_reussi: >-
  На поверхности луны появляются гигантские трещины, вскоре луна раскалывается
  на куски, миссия выполнена. Флот возвращается домой.
sys_destruc_rip: 'Вероятность взрыва звёзд смерти составила: %d %% '
sys_destruc_stop: Обороняющийся был в состоянии остановить уничтожение луны.
sys_destruc_title: 'Cледующие флоты участвовали в уничтожении луны:'
sys_expe_attack_1_1_1: Пара отчаянных космических пиратов попыталась захватить наш флот.
sys_expe_attack_1_1_2: >-
  Несколько примитивных варваров атаковали нас космическими кораблями, которые
  даже космическими кораблями назвать нельзя. Если обстрел примет серьёзный
  оборот, мы вынуждены будем ответить на огонь.
sys_expe_attack_1_1_3: >-
  Мы перехватили несколько радиограмм очень пьяных пиратов. По-видимому, на нас
  должны напасть.
sys_expe_attack_1_1_4: >-
  Мы должны были защищаться от нескольких пиратов, которых, к счастью, было не
  слишком много.
sys_expe_attack_1_1_5: >-
  Ваши экспедиционные корабли сообщают, что некий Тикар Моа и его дикая свора
  требуют безусловный капитуляции Ваших флотов. Если они не шутят, они должны
  понимать, что все корабли прекрасно могут защищаться.
sys_expe_attack_1_2_1: У Вашей экспедиции произошла неприятная встреча с космическими пиратами.
sys_expe_attack_1_2_2: >-
  Мы попали в засаду нескольких космических пиратов. Бой, к сожалению, был
  неизбежен.
sys_expe_attack_1_2_3: >-
  Крик о помощи, за которым следовала экспедиция, оказался ловушкой нескольких
  озлобленных космических пиратов. Бой был неизбежен.
sys_expe_attack_1_3_1: >-
  Пойманные сигналы исходили не от инопланетной расы, а от секретной пиратской
  базы. Они были не в особом восторге от нашего появления.
sys_expe_attack_1_3_2: Экспедиция сообщает о тяжёлых боях с неопознанными пиратскими кораблями.
sys_expe_attack_1_3_3: >-
  Мы только что получили срочное сообщение от командира экспедиции:" О боже они
  идут на нас! - второе сообщение - пришло с задержкой в несколько секунд - они
  вышли из гиперпространства - это всего лишь пираты , у нас есть шанс на легкую
  победу, мы будем сражаться!"
sys_expe_attack_2_1_1: >-
  Ваш экспедиционный флот испытал не особо дружественный первый контакт с
  неизвестной расой.
sys_expe_attack_2_1_2: Несколько необычных с виду кораблей атаковали экспедицию без предупреждения.
sys_expe_attack_2_1_3: Ваша экспедиция была атакована небольшой группой неизвестных кораблей.
sys_expe_attack_2_1_4: >-
  Экспедиция сообщила о контакте с неизвестными кораблями. Радиограммы не
  расшифровываются, однако, чужие корабли, кажется, активируют своё оружие.
sys_expe_attack_2_2_1: Неизвестные существа напали на Вашу экспедицию.
sys_expe_attack_2_2_2: >-
  Ваша экспедиция пересекла космическую границу до сих пор неизвестной, но
  весьма агрессивной и воинственной инопланетной расы.
sys_expe_attack_2_2_3: >-
  В скором времени связь с экспедицией была нарушена. Если мы правильно
  расшифровали последнее сообщение, флот находился под шквальным огнём -
  агрессоры не были идентифицированы.
sys_expe_attack_2_3_1: Ваша экспедиция подверглась атаке чужих. Развязался ожесточённый бой.
sys_expe_attack_2_3_2: >-
  Большое объединение кристаллических судов держит курс на Вашу экспедицию. Мы
  должны предполагать наихудшее.
sys_expe_attack_2_3_3: >-
  Диалект инопланетной расы оказался непривычным для нас. И наш дипломат
  перепутав крикнул: "Огонь! - вместо " Мир!"
sys_expe_attackname_1: Пираты
sys_expe_attackname_2: Инопланетяне
sys_expe_back_home: Ваш флот вернулся в %1$s %2$s из экспедиции в %3$s.
sys_expe_back_home_ress: 'Флот доставил груз: %s %s, %s %s и %s %s.'
sys_expe_back_home_ships_flound: 'Были найдены следующие корабли:'
sys_expe_back_home_ships_lost: 'Были потеряны следующие корабли:'
sys_expe_blackholl_1: Часть Вашего флота засосало в чёрную дыру.
sys_expe_blackholl_2: Ваш флот полностью засосало в чёрную дыру.
sys_expe_depleted_max_1: >-
  Бортовой журнал, дополнение связиста: Если мы не слишком уверены в себе, то мы
  можем совместить усилия с остальными экспедициями из этого сектора.
sys_expe_depleted_max_2: >-
  Бортовой журнал, дополнение связиста: Если так пойдёт и дальше, то при таком
  движении надо будет ставить навигационные буйки.
sys_expe_depleted_max_3: >-
  Бортовой журнал, дополнение связиста: Может было бы разумнее соорудить здесь
  сувенирную станцию, вместо того, чтобы отправлять целую экспедицию?
sys_expe_depleted_med_1: >-
  Бортовой журнал, дополнение связиста: Обнаружены следы присутствия других
  экспедиционных флотов.
sys_expe_depleted_med_2: >-
  Бортовой журнал, дополнение связиста: Налажен дружеский радио-контакт с
  другими экспедициями из этого сектора.
sys_expe_depleted_med_3: >-
  Бортовой журнал, дополнение связиста: Мы отпраздновали окончание экспедиции с
  членами команды повстречавшейся нам второй экспедиции, которая тоже
  исследовала этот сектор. Они тоже не нашли ничего особенного.
sys_expe_depleted_min_1: >-
  Бортовой журнал, Приложение к коммуникатору: Похоже, что люди уже вошли в этот
  регион галактики.
sys_expe_depleted_min_2: >-
  Бортовой журнал, дополнение связиста: Мы обнаружили очень древние корабельные
  сигнатуры. Похоже, что мы тут не первые.
sys_expe_depleted_min_3: >-
  Бортовой журнал, дополнение Связиста: Мы почти столкнулись с другим
  экспедиционным флотом. Никогда бы не подумал, что сюда ещё кто-то полетит.
sys_expe_depleted_not_1: >-
  Бортовой журнал, дополнение связиста: Эта часть вселенной наверное ещё не
  исследована.
sys_expe_depleted_not_2: >-
  Бортовой журнал, дополнение связиста: Это такое возвышающее чувство - быть
  первопроходцем в неисследованном секторе вселенной.
sys_expe_feqeuence_few: Более 10 экспедиций за последние 24 часа
sys_expe_feqeuence_many: Более 50 экспедиций за последние 24 часа
sys_expe_feqeuence_medium: Более 25 экспедиций за последние 24 часа
sys_expe_feqeuence_no: Несколько экспедиций за 24 часа
sys_expe_found_goods: '%s %s были добыты.'
sys_expe_found_ress_1_1: >-
  Ваша экспедиция нашла маленькое скопление астероидов, из которого можно добыть
  некоторые ресурсы.
sys_expe_found_ress_1_2: >-
  На отдалённом астероиде было найдено некоторое количество ресурсов. Ресурсы
  подняты на борт.
sys_expe_found_ress_1_3: >-
  Ваша экспедиция наталкнулась на очень старые обломки космических кораблей
  давно произошедшей битвы. Можно подобрать отдельные компоненты для повторного
  использования.
sys_expe_found_ress_1_4: >-
  Экспедиция натолкнулась на астероид, заражённый радиоактивными веществами. Тем
  не менее, сканирование показало, что этот астероид богат сырьём. Использование
  беспилотных кораблей дало возможность загрузить на борт ресурсы.
sys_expe_found_ress_2_1: >-
  Ваша экспедиция нашла древнее, полностью нагруженное грузовое судно, но без
  экипажа на борту. Ресурсы были перегружены в хранилища Ваших кораблей.
sys_expe_found_ress_2_2: >-
  На небольшой луне с собственной атмосферой Ваша экспедиция нашла большое
  количество сырья. Наземные экипажи собрали эти природные богатства и
  переправили на борт.
sys_expe_found_ress_2_3: >-
  Мы встретили небольшой конвой гражданских кораблей, которые остро нуждались в
  продовольствии и медикаментах. В обмен на это мы получили огромное количество
  ресурсов.
sys_expe_found_ress_3_1: >-
  Ваша экспедиция сообщает об огромных обломках кораблей чужих. Учёные не смогли
  разобраться с их технологией, но некоторые составные части кораблей, которые
  могли быть использованы в качестве сырья, были погружены на борт.
sys_expe_found_ress_3_2: >-
  Минеральный пояс вокруг неизвестной планеты содержит большое количество сырья.
  Экспедиция сообщает о полной загрузке трюмов.
sys_expe_found_ress_logbook_1: >-
  Запись в бортовом журнале первого офицера: Мы забили каждый уголок корабля, но
  всех ресурсов взять с собой всё равно не сможем.
sys_expe_found_ress_logbook_2: >-
  Запись в бортовом журнале первого офицера: Было бы у нас хотя бы на пару
  транспортов больше! А так мы оставляем целую кучу ресурсов.
sys_expe_found_ress_logbook_3: >-
  Запись в бортовом журнале первого офицера: Хоть мы и выкинули всё ненужное за
  борт, но места для ресурсов всё равно не хватает.
sys_expe_found_ress_logbook_4: >-
  Запись в бортовом журнале первого офицера: Даже после переоборудования
  столовой и кают-компании места для ресурсов не хватает всё равно.
sys_expe_found_ships: >-
  Ваша экспедиция обнаружила несколько кораблей в отличном состоянии..<br>К
  флоту присоединились:
sys_expe_found_ships_1_1: >-
  Мы натолкнулись на остатки предыдущей экспедиции. Наши техники пытаются найти
  среди обломков что-то летающее.
sys_expe_found_ships_1_2: >-
  Мы нашли покинутую пиратскую базу. В ангаре находятся несколько старых
  кораблей. Наши инженеры пытаются найти корабли, которые ещё пригодны для
  полётов.
sys_expe_found_ships_1_3: >-
  Наша экспедиция нашла планету, которая была почти полностью разрушена
  длительными войнами. На орбите находились различные корабельные обломки.
  Инженеры пытаются отремонтировать некоторые из них. Вероятно, мы сможем
  получить информацию о том, что здесь произошло.
sys_expe_found_ships_1_4: >-
  Ваша экспедиция обнаружила старинную космическую крепость, которую покинули
  как будто бы целую вечность назад. В ангаре крепости было найдено несколько
  кораблей. Специалисты пытаются найти корабли, которые ещё пригодны для
  полётов.
sys_expe_found_ships_2_1: >-
  Мы нашли остатки армады Специалисты нашли несколько исправных кораблей и
  пытаются отремонтировать их.
sys_expe_found_ships_2_2: >-
  Ваша экспедиция натолкнулась на старую автоматическую верфь. Несколько
  кораблей всё ещё находятся в стадии производства. Наши специалисты пытаются
  восстановить энергоснабжение верфи.
sys_expe_found_ships_3_1: >-
  Мы нашли огромное кладбаще космических кораблей. Инженерам удалось вернуть к
  работе несколько кораблей.
sys_expe_found_ships_3_2: >-
  Мы обнаружили планету с останками цивилизации. Единственным не разрушенных
  зданием является космическая станция на орбите планеты. Некоторые из наших
  инженеров и пилотов отправились туда, чтобы посмотреть, есть ли пригодные для
  полётов корабли.
sys_expe_found_ships_logbook_1: >-
  Бортовой журнал, дополнение офицера-механика: Было бы у нас хотя бы пару штук
  кораблей! Было бы намного легче тащить это богатство.
sys_expe_found_ships_logbook_2: >-
  Бортовой журнал, дополнение офицера-механика: К сожалению у нас не хватает
  места, чтобы довезти до дома все эти прекрасные корабли.
sys_expe_found_ships_logbook_3: >-
  Бортовой журнал, дополнение офицера-механика: К сожалению нам не хватает
  места, чтоб загрузить все найденные корабли.
sys_expe_found_ships_nothing: Ни один корабль не подлежит ремонту.
sys_expe_lost_fleet_1: >-
  от экспедиции осталась только следующая радиограмма: О Боже!... оно... похоже
  на...
sys_expe_lost_fleet_2: >-
  Последним, что было послано экспедицией, были несколько, отлично получившихся,
  снимков крупным планом раскрывающейся черной дыры.
sys_expe_lost_fleet_3: >-
  Поломка ядерного реактора привела к цепной реакции, которая повлекла за собой
  невероятный взрыв, уничтоживший всю экспедицию.
sys_expe_lost_fleet_4: >-
  Экспедиционный флот не возвратился после гиперскачка. Учёные всё ещё гадают,
  что могло произойти, однако, флот потерян навсегда.
sys_expe_nothing_1: >-
  Экспедиция не принесла ничего особого, кроме какой-то странной зверушки с
  неизвестной болотной планеты.
sys_expe_nothing_2: >-
  Ваша экспедиция сделала красивые снимки сверхновой звезды. Тем не менее,
  экспедиция не принесла никаких новых сведений. Но есть хорошая возможность
  победить в конкурсе лучшего снимка вселенной в этом году.
sys_expe_nothing_3: >-
  Вскоре, после выхода из Солнечной системы, странный компьютерный вирус
  парализовал систему навигации. Это привело к тому, что экспедиционные корабли
  всё время летали по кругу. Излишне говорить, что экспедиция была не особо
  успешна.
sys_expe_nothing_4: >-
  Форма жизни из чистой энергии позаботилась о том, чтобы все члены
  экспедиционной команды целыми днями пристально смотрели на гипнотические
  образы на экранах. Когда, наконец, у большинства прояснилось в голове,
  экспедиция должна была прекратиться из-за острой нехватки дейтерия.
sys_expe_nothing_5: >-
  Ну, по крайней мере, теперь мы знаем, что красные аномалии пятого класса могут
  вызвать не только непредсказуемые воздействия на корабельные системы, но и
  массовые галлюцинации у экипажа. Однако, больше ничего эта экспедиция не
  принесла.
sys_expe_nothing_6: >-
  Не смотря на первые, многообещающие сканирования этого сектора экспедиция, к
  сожалению, возвращается с пустыми руками.
sys_expe_nothing_7: >-
  Вероятно, не нужно было праздновать день рождения капитана на этой отдаленной
  планете. Противная желтая лихорадка заставила большинство экипажа провести всю
  экспедицию в лазарете. Острая нехватка персонала привела к тому, что
  экспедиция потерпела неудачу.
sys_expe_nothing_8: >-
  Ваша экспедиция, в буквальном смысле, познакомилась с пустотой вселенной. Не
  было ни маленьких астероидов, ни излучения, ни частиц, ничего, что
  заинтересовало бы экспедицию.
sys_expe_nothing_9: >-
  Ошибка руководства, ответственного за реактор корабля чуть было не уничтожила
  всю экспедицию. К счастью, инженеры смогли предотвратить наихудшее. Тем не
  менее, ремонт реактора занял очень много времени, поэтому экспедиция вернулась
  с пустыми руками.
sys_expe_report: Доклад экспедиции
sys_expe_report_msg: 'Отчет об экспедиции флота %s %s на %s::'
sys_expe_time_fast_1: >-
  Непредвиденное обратное сцепление в энергетических приводах ускорило обратный
  скачок экспедиции, так что она теперь возвратится раньше, чем ожидалось.
  Согласно первым сообщениям, за время экспедиции не произошло ничего
  интересного.
sys_expe_time_fast_2: >-
  Очень смелый новый командир использовал нестабильный вихревой поток, чтобы
  уменьшить время обратного полёта – успешно. Однако, сама экспедиция не
  принесла ничего нового.
sys_expe_time_fast_3: >-
  Ваша экспедиция сообщила об отсутствии особенностей в исследованном секторе.
  Однако, флот при обратном скачке попал под солнечный ветер. Вследствие этого
  скачок несколько ускорился. Теперь экспедиция вернётся домой несколько раньше.
sys_expe_time_slow_1: >-
  Халтурно собранный навигатор неправильно произвёл расчёты для прыжка, и
  поэтому флот не только приземлился в абсолютно другом месте, но и обратная
  дорога заняла невероятно много времени.
sys_expe_time_slow_2: >-
  По неизвестным причинам скачок экспедиции был произведён неправильно.
  Экспедиция чуть было не вышла из скачка в центре солнца. К счастью этого не
  произошло и мы оказались в неизвестной системе. Обратный путь займёт больше
  времени, чем предполагалось изначально.
sys_expe_time_slow_3: >-
  Новый модуль навигации работает, но всё ещё с некоторыми ошибками. Не только
  скачок был произведён в неправильном направлении, но и израсходовался весь
  запас топлива. Экспедиции пришлось возвращаться на импульсе. Возвращение
  займёт достаточно много времени.
sys_expe_time_slow_4: >-
  Ваша экспедиция попала в сектор с сильным штормом частиц. Вследствие этого все
  основные системы вышли из строя. Инженеры смогли предотвратить наихудшее,
  однако, экспедиция вернётся с некоторым опозданием.
sys_expe_time_slow_5: >-
  Флагманский корабль Вашей экспедиции столкнулся с неизвестным судном, которое
  нарвалось на него без предупреждения. Неизвестное судно взорвалось, нанеся
  флагману существенные повреждения. В этом состоянии движение невозможно. Как
  только поверхностный ремонт будет завершён, Ваши корабли начнут возвращаться
  домой.
sys_expe_time_slow_6: >-
  Космический ветер красного гиганта сфальсифицировали скачок экспедиции так,
  что потребовалось некоторое время для расчета возврата. Кроме того, в секторе,
  в которой появилась экспедиция, не было ничего, не считая пустоты между
  звездами.
