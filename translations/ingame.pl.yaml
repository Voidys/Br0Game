op_activate_vacation_mode: Aktywuj urlop. UWAGA urlop trwa minimum 3 dni!
op_activate_vacation_mode_confirm: Trybu wakacyjnego nie można ponownie wyłączyć przez 48 godzin. Czy na pewno?
op_activate_vacation_mode_descrip: >-
  Tryb wakacyjny został zaprojektowany w celu ochrony użytkownika podczas
  dłuższych okresów nieobecności. Można go aktywować tylko wtedy, gdy żadna
  flota nie jest w ruchu. Po aktywacji tryb ten chroni gracza przed nowymi
  atakami. Jednak ataki, które już się rozpoczęły, będą kontynuowane, a
  przyjazne floty, które się utrzymują, zostaną odesłane! Produkcja surowców,
  budowa budynków i stoczni, a także badania są w tym czasie wstrzymane, a
  następnie zostaną wznowione. Tryb wakacyjny trwa co najmniej 48 godzin, po
  czym można go ponownie dezaktywować.
