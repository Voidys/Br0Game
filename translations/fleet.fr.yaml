  Les missiles interplanetaires (%d) provenant de %s atteignent la planete %s
  <br><br>
sys_irak_no_att: Toutes les roquettes ont été interceptées.
sys_irak_no_def: La planete n a pas de defenses
sys_irak_subject: Missile
sys_mess_attack_cancel: |-
  La bataille à %s %s a été annulée.
  Le serveur n'a pas pu le calculer.
sys_mess_attack_report: Rapport de bataille
sys_mess_destruc_report: 'Rapport : Destruction de la Lune'
sys_mess_fleetback: Retour de la flotte
sys_mess_piratebase_gone: Votre flotte a atteint %s, mais la base pirate n'y est plus. La flotte rentre à la base.
sys_mess_spy_activity: Activité d'espionnage
sys_mess_spy_control: Tour de contrôle
sys_mess_spy_destroyed: Vos sondes d'espionnage ont été détruites !
sys_mess_spy_ennemyfleet_1: Des sondes espionnes ennemies de la planète %s ont été repérées près de %s.
