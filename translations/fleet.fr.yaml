  Une de vos flottes est arrivée %s. Lorsque vos colons se sont approchés de la
  planète, ils devaient déterminer avec leur équipement si le climat était
  convenable et pouvait etre propise développé. Déçus, les colons sont revenus.
sys_colo_notfree: >-
  Une de vos flottes atteint les coordonnées %s. Lorsque les colons arrivent aux
  coordonnées souhaitées, ils réalisent que la planète est déjà colonisée.
  Complètement démoralisés, ils décident de revenir.
