spytechStatsDescription: >-
  Sa level 0 at 1, kabuuang puntos lang ng ibang manlalaro ang makikita mo.
  Mula level 2, makikita mo rin ang puntos nila sa mga gusali; mula level 4,
  ang puntos nila sa research. Mula level 6, makikita mo rin ang puntos nila
  sa mga barko at depensa, pati ang kanilang battle statistics.
