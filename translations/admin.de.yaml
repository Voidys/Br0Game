  zufällig verteilt oder zu 50% zufällig und im Block platziert werden.<br>Die
  zufällige Platzierung füllt hierbei Galaxien und Systeme gleichmäßig an
  zufälligen Positionen auf.<br>Die Block-Platzierung sucht zufällig ein System
  mit einem oder 2 Planeten aus. Falls es kein System gibt, oder es weniger als
  50 Spieler sind, wird zufällig platziert.
