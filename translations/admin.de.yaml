cronjob_desc: >-
  Hier folgt die Eingabe der Aufrufezeiten des Cronjobs. Die Bedingungen sind
  UND-verknüpft, das heißt dass der Cronjob nur ausgeführt wird wenn alle
  Bedingungen erfüllt sind. Die gleichzeitige Auswahl von einzelnen Werten in
  'Wochentag' und 'Tag' kann unter Umständen dazu führen dass der Cronjob
  unregelmäßig ausgeführt wird, hier sollte bei mindestens einer Bedingung die
  Option 'Alle' gewählt werden.<br>'Alle' wird vorrangig behandelt und
  überschreibt die Einstellungen der Auswahllisten.
