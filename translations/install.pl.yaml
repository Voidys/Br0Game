req_desc: >-
  Br0Game sprawdzi teraz konfigurację twojego serwera. Czytaj uważnie wyniki
  testów nim przejdziesz dalej. Jeśli chcesz używać opcjonalnych modułów to
  upewnij się że dodatkowe testy mają wynik pozytywny..
req_head: Wymagania systemowe
req_php_need: Minimalna wersja &raquo;PHP&laquo;
req_php_need_desc: >-
  <strong>Wymagane</strong> — PHP to język skryptowy wykonywane po stronie
  serwera, Br0Game jest w nim napisany. Do poprawnej instalacji wymagana wersja
  minimalna to PHP Version 5.2.5.
