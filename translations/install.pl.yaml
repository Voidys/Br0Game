install_desc: >-
  Aby włączyć narzędzie instalacyjne, utwórz plik
  "var/ENABLE_INSTALL_TOOL"<br> W nazwie pliku uwzględniana jest wielkość
  liter i nie ma końcówki typu pliku.<br> Plik może być pusty. 

  Zostanie on automatycznie usunięty po zakończeniu instalacji lub jeśli jest
  starszy niż godzinę.
install_title: Narzędzie instalacyjne jest zablokowane
intro_install: Przejdź do instalacji
intro_lang: Język
intro_text: >-
  Br0Game to najlepszy klon Ogame.<br>Br0Game to najnowsza i najbardziej
  stabilna wersja Xnova, jaka kiedykolwiek powstała. Cechuje ją przyjazność,
  elastyczność i dynamiczność, jak również najwyższa jakość obsługi. System
  przeprowadzi Cię przez proces instalacji lub też aktualizacji aktualnej wersji
  do najnowszej. Jeśli masz jakiekolwiek problemy nie wahaj się zadać pytania na
  naszym forum poświęconemu rozwojowi i wsparciu.<br><br>Br0Game podlega
  licencji GNU GPL v3. Licencje przeczytasz po kliknięciu odpowiedniego linku w
  menu.<br><br>Przed instalacją skrypt sprawdzi, czy twój serwer spełnia
  minimalne wymagania.
intro_upgrade_head: Zainstalować Br0Game?
intro_upgrade_text: >-
  <p>Br0Game zainstalowane, chcesz teraz sprawdzić
  aktualizacje?</p><p>Aktualizacje!</p>
intro_welcome: Serdecznie witamy w Br0Game!
licence_accept: >-
