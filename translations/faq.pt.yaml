questions:
  '1':
    '1':
      body: |-
        <p>Esta secção apresenta os edifícios principais: o que construir primeiro e para que serve cada um. Um império próspero começa por construí-los por uma ordem sensata.</p>
        <h3>Planta de Energia Solar</h3>
        <p>Constrói esta primeiro. As minas precisam de energia para produzir metal, cristal e deutério. Depois de a planta estar pronta, a barra de recursos e a página Produção mostram quanta energia tens.</p>
        <h3>Mina de Metal</h3>
        <p>O metal é um dos três recursos. Quase tudo o que constróis ou pesquisas custa metal, por isso expandir esta mina é prioridade. No início, mantém-na vários níveis à frente das outras minas.</p>
        <h3>Mina de Cristal e Extrator de Deutério</h3>
        <p>O cristal é usado em edifícios, naves e pesquisas. Produzes menos do que de metal, o que o torna mais valioso; mais tarde no jogo é muitas vezes alvo de feroz disputa. O deutério abastece as tuas frotas, pode ser queimado para produzir energia na Planta de Fusão e é necessário para vários edifícios e pesquisas importantes (incluindo o Laboratório de Pesquisas).</p>
        <p>Mais informações: <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>
      title: Passo 1
    '2':
      body: |-
        <p>Para fazer crescer o teu império e interagir com outros jogadores, precisas de mais edifícios. A pesquisa e um Hangar permitem-te começar uma frota e a defesa planetária.</p>
        <h3>Hangar</h3>
        <p>É aqui que se constroem todas as naves (e defesas). O Hangar fica disponível cedo, mas muitas classes de naves ainda exigem pesquisas adicionais. O menu Tecnologias lista os requisitos de cada nave e defesa. Níveis mais altos do Hangar constroem mais depressa.</p>
        <h3>Laboratório de Pesquisas</h3>
        <p>As pesquisas começam aqui. Desbloqueiam edifícios, naves, defesas e novas pesquisas, e algumas tecnologias dão ainda bónus ao que já tens. Expandir o Laboratório de Pesquisas acelera as pesquisas.</p>
        <h3>Fábrica de Robots</h3>
        <p>A Fábrica de Robots é essencial. Níveis mais altos reduzem o tempo de construção dos edifícios e aceleram também a produção de naves. Quando os tempos de construção ficarem longos, expande a Fábrica de Robots para os voltar a baixar.</p>
      title: Passo 2
    '3':
      body: |-
        <p>Esta secção trata da defesa do teu planeta e dos primeiros movimentos da tua frota: como enviar frotas e como lidar com os outros jogadores.</p>
        <h3>Vista Galáxia</h3>
        <p>Usa-a para encontrar outros jogadores. Vês detalhes sobre outros planetas e podes enviar parte da tua frota diretamente a partir desta vista. Também podes enviar mensagens a jogadores ou espiar um planeta, se tiveres Sondas de Espionagem disponíveis.</p>
        <h3>Enviar frotas</h3>
        <p>As frotas podem ser enviadas a partir da vista Galáxia ou do menu Frota. Primeiro, escolhe quantas naves de cada tipo queres enviar. Depois define o destino (coordenadas da vista Galáxia) e a velocidade. Por fim, escolhe a missão, como Atacar, Estacionar, Manter posição, Reciclar ou Transportar.</p>
        <h3>Defesa</h3>
        <p>Quando tiveres um Hangar, também podes construir defesas. Protegem o planeta e combatem juntamente com qualquer frota presente quando um ataque chega. Ao contrário das naves, cerca de 70% das defesas destruídas são reparadas depois do combate.</p>
      title: Passo 3
    category: Dicas para iniciantes
  '2':
    '1':
      body: |-
        <h3>Raides</h3>
        <p>Um raide é atacar outros jogadores para lhes roubar os recursos. Tipos mais comuns:</p>
        <ul>
        <li>Raide de farm</li>
        <li>Ataque de frota</li>
        <li>Raide a campos de destroços</li>
        <li>Intercetar</li>
        </ul>
        <h3>Raide de farm</h3>
        <p>São os ataques mais comuns num universo. Espias planetas próximos e envias frotas pequenas com capacidade de carga e poder de fogo suficientes para vencer defesas fracas e ainda ter lucro: os recursos roubados devem superar o deutério gasto mais as tuas próprias perdas.</p>
        <h3>Ataque de frota</h3>
        <p>O topo dos raides: caçar as frotas de outros jogadores. Além de Sondas de Espionagem e sorte, contam um Sensor Phalanx e um bom timing. Quando encontras uma frota que valha a pena, ainda tens de a apanhar e reciclar os destroços. Muitas vezes é difícil, porque frotas lucrativas podem exceder a tua capacidade de reciclagem – então tens de coordenar recicladores e, se for preciso, parceiros de ataque de aliança (ACS), além da frota de combate.</p>
        <h3>Raide a campos de destroços</h3>
        <p>A forma mais fácil, e menos popular, de ter lucro: recolher campos de destroços criados por outros jogadores. Os destroços pertencem a quem os recolhe, por isso roubar campos é uma fonte frequente de más relações.</p>
        <h3>Intercetar</h3>
        <p>O trabalho de um fleeter é construir frota e destruir frota. Nem sempre vais encontrar naves paradas, por isso apanhar bons jogadores significa muitas vezes intercetá-los enquanto salvam a frota ou enquanto voam num ataque. Não é fácil; há maneiras de se defender.</p>
        <ul>
        <li><p>Uma lua facilita a interceção, porque um Sensor Phalanx consegue ver os movimentos de frotas em planetas ao alcance (não em luas). Se encontrares uma frota que valha a pena apanhar, calcula o tempo de voo que lhe falta – sobretudo o regresso depois de chegar. Os níveis dos motores (Combustão, Impulsão, Hiperespaço) de um relatório de espionagem chegam para o calcular, à mão ou com uma calculadora de tempos de voo. Um relógio preciso ajuda. Cronometra a tua frota e os recicladores para chegarem cerca de 3–5 segundos depois do alvo ao planeta ou lua dele. Os recicladores também têm de ser cronometrados.</p></li>
        <li><p>Para intercetar uma frota que voa de uma lua para um campo de destroços, precisas de uma hora de partida aproximada. Cria um campo de destroços visível nos sítios onde achas que vão recolher (por exemplo, com Sondas de Espionagem). Calcula quanto tempo a frota deles demora a chegar lá, vigia o sistema e atualiza a página até o campo desaparecer. Anota essa hora, soma o voo de regresso deles e cronometra a tua frota e os recicladores para uns segundos depois dessa chegada.</p>
        <p><b>Nota:</b> isto nem sempre funciona. Um reciclador enviado à frente para limpar primeiro o campo é uma resposta comum.</p></li>
        <li>Outra forma de intercetar é estacionar no planeta de um amigo para o proteger, obrigando os atacantes a recolher porque a frota defensora seria forte demais. Podes reduzir o risco de seres apanhado assim com um scan de segurança.</li>
        <li><p>Se um jogador estaciona de um planeta para outro e depois recolhe a frota, esta desaparece do Sensor Phalanx. Observa o padrão de salvamento dele (quando lança e quando recolhe). Quando esperares uma recolha, faz phalanx ao planeta a cada segundo. No momento em que a frota desaparecer, anota a hora, soma o voo de regresso e chega cerca de 4–6 segundos depois com a frota e os recicladores.</p>
        <p>Se ele salva de uma lua para um campo de destroços e envia recicladores à frente, intercetar é quase impossível a menos que destruas a lua. Envia Estrelas da Morte com a missão Destruir. Depois de a lua desaparecer, a frota regressa ao planeta; faz phalanx a esse planeta e encaixa-te uns segundos atrás dela.</p>
        <p>Todas estas técnicas funcionam muito melhor se conheceres os hábitos do alvo – por exemplo, salvar a frota todas as noites às 23:00, ou ligar-se ao meio-dia. Estuda o jogador antes de o intercetares.</p></li>
        </ul>
        <p>Mais na wiki: <a href="{wiki_url}/wiki/En/Saven" target="_blank">Salvar frotas</a>, <a href="{wiki_url}/wiki/En/Sensorenphalanx" target="_blank">Sensor Phalanx</a>.</p>
      title: Raides
    '2':
      body: |-
        <h3>Atacar com ACS</h3>
        <p>Para atacar em conjunto, envia primeiro uma frota com a missão Atacar para o alvo. Depois de ela partir, abre o menu Frota e usa ACS para transformar essa frota num grupo ACS. Aí podes mudar o nome do grupo e convidar outros jogadores; o jogador que iniciou o ataque é convidado automaticamente. Cada jogador convidado envia depois as suas próprias naves para as mesmas coordenadas com a missão Ataque de Aliança.</p>
        <p>O grupo voa sempre ao ritmo da frota participante mais lenta. Frotas mais rápidas que se juntem mais tarde não encurtam o tempo restante. Frotas mais lentas aumentam o tempo restante para o seu próprio tempo de voo. Normalmente, um ataque ACS aceita no máximo 5 jogadores e 16 frotas (as definições do universo podem diferir). Uma frota que se junte pode aumentar o tempo de voo restante em no máximo 30%. Se faltarem 100 minutos, uma frota que se junte pode demorar no máximo 130 minutos.</p>
        <p><b>Aviso:</b> se o fundador do ACS recolher a frota, todas as frotas do grupo são também recolhidas.</p>
        <h3>Defender com ACS</h3>
        <p>Se estás a ser atacado, os membros da aliança e os amigos podem ajudar. Enviam uma frota para as coordenadas atacadas, escolhem quanto tempo ficam e usam a missão Manter posição. Além do deutério do voo, são cobrados à partida custos extra de permanência, consoante o tamanho da frota e a duração. Enquanto estão em posição, combatem em todas as batalhas nesse planeta ou lua e aparecem nos relatórios de espionagem como se fossem naves tuas. Cronometra as permanências para chegarem pouco antes do atacante, para que um scan de segurança as veja com menos probabilidade. Os jogadores em posição podem recolher a frota no menu Frota a qualquer momento; caso contrário, a frota espera o tempo da permanência e regressa a casa.</p>
        <h3>Deutério por 1 hora de permanência</h3>
        <p>Cargueiro Pequeno: 5<br>
        Cargueiro Grande: 5<br>
        Caça Ligeiro: 2<br>
        Caça Pesado: 7<br>
        Cruzador: 30<br>
        Nave de Batalha: 50<br>
        Nave de Colonização: 100<br>
        Reciclador: 30<br>
        Sonda de Espionagem: 1/10<br>
        Bombardeiro: 100<br>
        Destruidor: 100<br>
        Estrela da Morte: 1/10</p>
      title: Sistema de Combate de Aliança
    '3':
      body: |-
        <p>Pode formar-se uma lua quando é criado um campo de destroços de pelo menos 100 000 unidades (probabilidade de lua: 1%). A probabilidade tem um teto de 20%, por maior que seja o campo.</p>
        <h3>Geral</h3>
        <p>As luas podem ser renomeadas como os planetas, mas «(Moon)» fica sempre no nome. Podes ter no máximo uma lua por planeta. Uma lua permite-te salvar a frota fora da vista de um Sensor Phalanx, por isso compensa criar uma relativamente cedo. Numa lua podes construir Fábrica de Robots, Hangar, Armazém de Metal, Armazém de Cristal, Tanque de Deutério, Depósito da Aliança, Base Lunar, Sensor Phalanx e Portal de Salto Quântico.</p>
        <h3>Moonshot</h3>
        <p>Um moonshot é a destruição deliberada de naves para criar um campo de destroços. Os Caças Ligeiros são a escolha habitual: se 30% forem da frota e 0% da defesa para destroços, 1667 Caças Ligeiros dão uma probabilidade de lua de 20%. São baratos de perder e ficam muito perto do teto. Se um jogador mais forte destrói Caças Ligeiros de um mais fraco, qualquer um pode recolher os destroços. Se um jogador mais fraco ataca um mais forte com naves feitas para morrer, só o mais fraco os pode recolher – caso contrário é pushing. As luas e as tentativas de lua estão sujeitas às regras de pushing.</p>
        <p>Num universo em que a defesa também gera destroços, muitas vezes é melhor construir defesa e deixá-la ser destruída em várias vagas, para várias tentativas de lua. 3334 Lançadores de Mísseis ou 3334 Lasers Ligeiros são uma escolha comum.</p>
        <p>Quando se forma uma lua, o relatório de combate diz que as enormes quantidades de metal e cristal livres se atraem e formam um satélite à volta do planeta.</p>
        <p>Probabilidade de lua entre 1% e 19%: tamanho aleatório. Probabilidade de lua de 20%: mais de 8000 km de diâmetro. Uma lua nunca é maior do que 8944 km.</p>
        <h3>Edifícios</h3>
        <p>Normalmente não compensa construir armazéns numa lua, porque lá não se produz nada. Um Hangar também raramente é útil: os tempos de construção são longos e podes construir naves no planeta. Um Depósito da Aliança é discutível; também ocupa campos valiosos.</p>
        <p>Os três edifícios exclusivos da lua são:</p>
        <ul>
        <li><p><b>Base Lunar</b><br>Acrescenta campos construíveis: 3 por nível, um dos quais é ocupado pela melhoria seguinte da Base Lunar.</p></li>
        <li><p><b>Sensor Phalanx</b><br>Mostra movimentos de frotas em planetas inimigos (não em luas). O alcance aumenta a cada nível.</p></li>
        <li><p><b>Portal de Salto Quântico</b><br>Move naves instantaneamente de uma lua para outra. Os recursos não podem ir com elas. Depois de um salto, o portal precisa de tempo para arrefecer (normalmente uma hora) ou sobreaquece.</p></li>
        </ul>
        <p>Uma ordem de construção comum para a lua:<br>
        <b>Legenda:</b><br>
        MB – Base Lunar<br>
        SP – Sensor Phalanx<br>
        ST – Portal de Salto Quântico<br>
        RB – Fábrica de Robots</p>
        <p>MB1 – RB1 – RB2 – MB2 – SP1 – RB3 – MB3 – SP2 – RB4 – MB4 – SP3 – RB5 – MB5 – SP4 – RB6 – MB6 – SP5 – SP6 – MB7 – SP7 – SP8 – MB8 – ST1<br>
        Depois disso podes continuar a expandir o Sensor Phalanx, se tiveres os recursos. Também podes demolir alguns níveis da Fábrica de Robots e passar esses campos para o phalanx.</p>
        <h3>Destruição</h3>
        <p>Uma lua só pode ser destruída com Estrelas da Morte. No menu de missões escolhe Destruir em vez de Atacar. Qualquer frota na lua tem de ser destruída primeiro; as Estrelas da Morte sobreviventes ainda podem perder-se quando a própria lua é destruída. A destruição de uma lua não cria campo de destroços.</p>
        <h3>Ataques de Estrelas da Morte a luas</h3>
        <p>Probabilidade de destruir a lua: (100 − raiz(tamanho da lua)) × raiz(número de Estrelas da Morte). Probabilidade de as Estrelas da Morte atacantes serem destruídas: raiz(tamanho da lua) / 2. Luas maiores são mais arriscadas de destruir.</p>
        <h3>Probabilidade e tamanho da lua</h3>
        <p>100 000 unidades de destroços dão uma probabilidade de lua de 1%. Probabilidade máxima: 20%. Depois de uma alteração posterior, todas as luas têm o número máximo de campos construíveis (79). Antes era FLOOR((diâmetro / 1000)²). Maior lua possível: 8944 km de diâmetro, 79 campos.</p>
        <p>Mais na wiki: <a href="{wiki_url}/wiki/En/Mond" target="_blank">Luas</a>, <a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">wiki</a>.</p>
      title: Luas
    '4':
      body: |-
        <h3>Como fundo uma aliança?</h3>
        <p>Abre Aliança no menu da esquerda e depois Criar a tua própria aliança. Escreve uma tag de aliança (a abreviatura) e um nome de aliança. Exemplo: uma aliança chamada «The Top Ally» pode usar a tag «DTA».</p>
        <p>Só são permitidas letras, números e espaços. Depois de escreveres a tag e o nome, clica em Criar. Se esse nome ou tag já estiver em uso, aparece um erro e tens de escolher outro. Se correr bem, vês uma confirmação; Continuar abre o menu ainda vazio da tua aliança, a que podes sempre voltar em Aliança, no menu da esquerda. No topo vês a tua tag e o teu nome.</p>
        <p>Por baixo encontras:<br>
        Membros: todos os membros com pontos, coordenadas do planeta principal, data de entrada e estado online. Clica nos cabeçalhos das colunas para ordenar.<br>
        O teu cargo: o nome do teu cargo, mais uma ligação para a gestão da aliança.<br>
        Mensagens gerais: envia uma mensagem a toda a aliança ou a cargos selecionados.</p>
        <h3>Gestão da aliança</h3>
        <p>Em Cargos defines os direitos de cada cargo, por exemplo dissolver a aliança ou enviar mensagens gerais. Em Membros podes expulsar jogadores, atribuir cargos e ver há quantos dias estão offline. Também podes mudar a tag e o nome da aliança.</p>
        <p>Gestão de textos edita os textos da aliança. O texto externo é visível para todos os jogadores; o texto interno só para os membros. O texto de candidatura é um modelo para quem se candidata.</p>
        <p>Em Opções podes ligar uma imagem de banner e um fórum da aliança, escolher se as candidaturas estão abertas e definir o nome do cargo de fundador. Se o deixares vazio, o cargo é Fundador.</p>
        <p>Podes dissolver a aliança ou transferi-la para outro membro, que passa a ser o fundador.</p>
      title: Alianças
