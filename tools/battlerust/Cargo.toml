[package]
name = "battlerust"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Battle engine of V0Game: a faithful port of the PHP engine (BattleEngineSteemNova) with PHP's mt_rand, exported as a C library"
license = "MIT"
publish = false

[lib]
name = "battlerust"
# cdylib: bin/libbattlerust.so (loaded by the launcher bin/battlerust); rlib: used by the cargo tests
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse the JSON floats exactly like PHP wrote them (needed for byte-identical results)
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"   # lib.rs catches panics at the C boundary
