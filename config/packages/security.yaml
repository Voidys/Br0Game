security:
    # bcrypt, cost 13: the format of {prefix}accounts.password (AccountUtil::cryptPassword())
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: bcrypt
            cost: 13

    role_hierarchy:
        ROLE_MODERATOR: ROLE_USER
        ROLE_OPERATOR: ROLE_MODERATOR
        ROLE_ADMIN: ROLE_OPERATOR

    providers:
        accounts:
            id: App\Security\AccountProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # One firewall for the whole game: the login form on the start page authenticates the account,
        # the token lives in the session (2Moons) next to the game's session object.
        main:
            lazy: true
            provider: accounts
            custom_authenticators:
                - App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator
            # failed game logins per IP + e-mail: 5 per 15 minutes (a global limit per IP is 5x that);
            # the authenticator answers a throttled attempt with ?code=4
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: /

    # Game, account and admin area need a login; a battle report link (game?page=raport&raport=…)
    # and the board (account?page=board, read only for guests, BoardController guards the writes)
    # stay public. The admin area additionally asks for the admin password (game session flag).
    access_control:
        - { path: '^/(uni\d+/)?account$', allow_if: "is_authenticated() or request.query.get('page') == 'board'" }
        - { path: '^/(uni\d+/)?admin$', roles: IS_AUTHENTICATED }
        - { path: '^/(uni\d+/)?game$', allow_if: "is_authenticated() or (request.query.get('page') == 'raport' and request.query.has('raport') and request.query.count() == 2)" }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
